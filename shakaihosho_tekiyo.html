document.getElementById('rubyOff').onclick=()=>{settings.ruby=false;save();applySettings();};
document.getElementById('fontSize').onclick=()=>{settings.big=!settings.big;save();applySettings();};
function nav(){return `<nav class="nav" aria-label="学習メニュー">${[['tf','○×問題',74],['past','本試験の過去問',9],['wrong','間違えた問題',count(ALL,'wrong')]].map(([m,t,n])=>`<button data-mode="${m}" class="${mode===m?'selected':''}" aria-pressed="${mode===m}">${U(t)} <b>${n}</b></button>`).join('')}</nav>`;}
function header(){return `<section class="intro"><div class="eyebrow">SOCIAL SECURITY / CHECK TEST</div><h1>${U('社会保障制度の適用関係')}<br>${U('確認テスト')}</h1><p class="subtitle">${U('一問一答で基礎を確認し、過去問で力を試しましょう。')}</p><div class="stats"><div><strong>74</strong><span>${U('○×問題')}</span></div><div><strong>9</strong><span>${U('本試験の過去問')}</span></div><div><strong>${count(ALL,'correct')}<small style="font-size:15px"> / 83</small></strong><span>${U('正解した問題')}</span></div></div></section>`;}
function footer(){document.getElementById('footer').innerHTML=`<p>${U(storageOK?'学習記録は、このブラウザ内に保存されます。':'この環境では学習記録を保存できません。画面を閉じると記録が消えます。')}</p><details><summary>${U('出典と教材について')}</summary><p>${U('確認テスト原稿・社会保障適用関係テキストを基に作成。')} 2026.11.08</p><p>${U('○×問題の出題回は元原稿の関連回です。過去問そのものは別に収録しています。')}</p><p>${U('問題文と選択肢は出題当時の内容です。')}</p><p><a href="https://www.sssc.or.jp/shakai/past_exam/" target="_blank" rel="noopener">社会福祉振興・試験センター</a></p><p>${U('このテストは学習用です。国家試験の合否判定ではありません。')}</p></details><p style="margin-top:13px"><button data-action="reset">${U('記録をすべて消去')}</button></p>`;}
function goTop(){window.scrollTo({top:0,behavior:'instant'});document.querySelector('h2')?.focus({preventScroll:true});}
function home(){active=null;render();goTop();}
function start(qs,title,category=null){active={ids:qs.map(q=>q.id),title,category};render();goTop();}
function retry(){for(const id of active.ids){delete answers[id];delete results[id];}save();render();goTop();}
function dashboard(){
 if(mode==='tf')return `<div class="section-heading"><h2>${U('項目を選んで学習')}</h2><button data-action="alltf">${U('全問に挑戦')} →</button></div><div class="grid">${DATA.categories.map((title,i)=>{const qs=DATA.questions.filter(q=>q.category===i),c=count(qs,'correct');return `<button class="tile" data-cat="${i}" style="--tone:${tones[i]}"><div class="tile-head"><span class="number">${i+1}</span><span class="pill">${qs.length} ${U('問')}</span></div><div class="tile-name">${title}</div><div class="tile-foot">${U('正解数')} ${c} / ${qs.length}</div><div class="track"><div class="fill" style="width:${c/qs.length*100}%"></div></div></button>`;}).join('')}</div>`;
 if(mode==='past')return `<div class="section-heading"><h2>${U('本試験の過去問')}</h2><button data-action="allpast">${U('全問に挑戦')} →</button></div><p class="muted">${U('正しい選択肢を1つ選んでください。')}</p><div class="grid" style="margin-top:15px">${DATA.past.map(q=>`<button class="tile" data-past="${q.id}" style="--tone:#357ea1"><div class="tile-head"><span class="number">${q.num}</span><span class="pill">${U(status(q.id)==='correct'?'正解':status(q.id)==='wrong'?'不正解':status(q.id)==='unanswered'?'未回答':'未採点')}</span></div><div class="tile-name">${q.label}</div><div class="tile-foot">${q.categories.map(i=>DATA.categories[i]).join(' ／ ')}</div></button>`).join('')}</div>`;
 const wrong=ALL.filter(q=>status(q.id)==='wrong');const unanswered=ALL.filter(q=>status(q.id)==='unanswered');return `<div class="section-heading"><h2>${U('間違えた問題')} ${wrong.length}${U('問')}</h2></div>${wrong.length?`<p class="muted">${U('解説を確認して、もう一度挑戦しましょう。')}</p><div class="actions"><button class="primary" data-action="review">${U('もう一度解く')} →</button></div><div class="grid">${wrong.map(q=>`<button class="tile" data-single="${q.id}" style="--tone:#a75e61"><span class="tile-name">${q.kind==='tf'?U('○×問題')+' '+q.num:q.label}</span><span class="tile-foot">${q.kind==='tf'?DATA.categories[q.category]:U('本試験の過去問')}</span></button>`).join('')}</div>`:`<div class="empty"><h3>${U('まだ該当する問題はありません。')}</h3><p class="muted">${U('問題を解いて採点すると、復習する問題が表示されます。')}</p></div>`}${unanswered.length?`<div class="actions"><button data-action="unanswered">${U('未回答の問題')} ${unanswered.length}${U('問')} →</button></div>`:''}`;
}
function question(q,i){const graded=Boolean(results[q.id]),a=answers[q.id],s=results[q.id],label=s==='correct'?'正解':s==='wrong'?'不正解':'未回答';return `<article class="question" id="q-${q.id}" aria-label="問題${q.num}"><div class="q-top"><span class="q-num">${q.kind==='tf'?U('問題')+' '+q.num:q.label}</span>${graded?`<span class="status-${s}">${U(label)}</span>`:`<span class="muted">${i+1} / ${active.ids.length}</span>`}</div><div class="${q.kind==='tf'?'tf-layout':''}"><div><p class="q-text">${q.text}</p>${q.source?`<p class="source">${q.source}</p>`:''}</div>${q.kind==='tf'?`<div class="tf-options" role="group" aria-label="問題${q.num}の回答">${[1,0].map(v=>`<button data-answer="${q.id}" data-value="${v}" aria-label="${v?'○ 正しい':'× 誤り'}" aria-pressed="${a===v}" ${graded?'disabled':''}>${v?'○':'×'}</button>`).join('')}</div>`:''}</div>${q.case?`<div class="case"><strong>${U('事例')}</strong>${q.case}</div>`:''}${q.kind==='past'?`<div class="options" role="group" aria-label="選択肢">${q.options.map((text,j)=>`<button class="option" data-answer="${q.id}" data-value="${j+1}" aria-pressed="${a===j+1}" ${graded?'disabled':''}><span class="opt-num">${j+1}</span><span>${text}</span></button>`).join('')}</div>`:''}${graded?`<div class="explanation"><div class="key">${U('正答')}：${q.kind==='tf'?(q.answer?'○':'×'):q.answer} <small class="muted">${U('回答')}：${a===undefined?U('未回答'):q.kind==='tf'?(a?'○':'×'):a}</small></div>${q.kind==='tf'?`<p>${q.explanation}</p>`:`<h3>${U('選択肢ごとの解説')}</h3><ol>${q.explanations.map((e,j)=>`<li><span class="verdict ${q.answer===j+1?'status-correct':'status-wrong'}">${j+1}　${q.answer===j+1?'○':'×'}</span>${e}</li>`).join('')}</ol>`}</div>`:''}</article>`;}
function session(){const qs=active.ids.map(id=>BYID[id]),done=qs.every(q=>results[q.id]),n=qs.filter(q=>answers[q.id]!==undefined).length,s=scoreQuestions(qs,answers);let related=active.category===null?[]:DATA.past.filter(q=>q.categories.includes(active.category));return `<button data-action="home">← ${U(mode==='past'?'過去問一覧へ':'項目一覧へ')}</button><section class="session-head"><h2 tabindex="-1">${active.title}</h2><p>${U(qs.every(q=>q.kind==='tf')?'正しいと思う場合は○、誤りと思う場合は×を選んでください。':'回答後に採点すると、正答と根拠を確認できます。')}</p></section>${done?`<section class="result" role="status" tabindex="-1"><span>${U('得点')}</span><div><strong class="score">${s.correct}</strong> / ${s.total} ${U('点')} <span class="muted">（${Math.round(s.correct/s.total*100)}%）</span></div><p>${U(s.correct===s.total?'全問正解です。よく理解できています。':'解説を確認して、もう一度挑戦しましょう。')}</p><div class="muted">${U('不正解')} ${s.wrong}　／　${U('未回答')} ${s.unanswered}</div><div class="actions"><button data-action="retry">${U('もう一度解く')}</button>${s.wrong?`<button data-action="sessionWrong">${U('間違えた問題')} ${s.wrong}${U('問')} →</button>`:''}</div></section>`:''}<div class="session-tools"><span class="muted" id="answered">${U('回答済み')} ${n} / ${qs.length}</span><span class="muted">${done?U('解答と解説'):U('採点前です。回答を選んでください。')}</span></div><div id="questions">${qs.map(question).join('')}</div>${related.length?`<section class="session-head"><h3>${U('この項目の関連過去問')}</h3><div class="related">${related.map(q=>`<button data-past="${q.id}">${q.label} →</button>`).join('')}</div></section>`:''}<div class="bottom-bar"><span id="bottomCount">${U('回答済み')} ${n} / ${qs.length}</span><div class="tools"><button data-action="home">${U('戻る')}</button><button class="primary" data-action="${done?'retry':'grade'}">${U(done?'もう一度解く':'採点する')}</button></div></div>`;}
function render(){document.getElementById('app').innerHTML=(active?'':header())+nav()+(active?session():dashboard())+(readError?`<div class="notice">${U('保存した記録を読み込めませんでした。新しく開始します。')}</div>`:'');footer();applySettings();}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.mode){mode=b.dataset.mode;home();return;}
 if(b.dataset.cat!==undefined){const i=Number(b.dataset.cat);start(DATA.questions.filter(q=>q.category===i),`${i+1}　${DATA.categories[i]}`,i);return;}
 if(b.dataset.past){mode='past';const q=BYID[b.dataset.past];start([q],q.label);return;}
 if(b.dataset.single){const q=BYID[b.dataset.single];start([q],q.kind==='tf'?U('○×問題')+' '+q.num:q.label);retry();return;}
 if(b.dataset.answer){const id=b.dataset.answer;answers[id]=Number(b.dataset.value);save();document.querySelectorAll(`[data-answer="${id}"]`).forEach(x=>x.setAttribute('aria-pressed',String(Number(x.dataset.value)===answers[id])));let n=active.ids.filter(id=>answers[id]!==undefined).length;for(const el of ['answered','bottomCount'])document.getElementById(el).innerHTML=U('回答済み')+' '+n+' / '+active.ids.length;footer();return;}
 switch(b.dataset.action){case'home':home();break;case'alltf':start(DATA.questions,U('○×問題')+' 74'+U('問'));break;case'allpast':start(DATA.past,U('本試験の過去問')+' 9'+U('問'));break;case'grade':gradeQuestions(active.ids.map(id=>BYID[id]));render();document.querySelector('.result')?.focus();document.querySelector('.result')?.scrollIntoView({behavior:'instant',block:'start'});break;case'retry':retry();break;case'review':{const qs=ALL.filter(q=>status(q.id)==='wrong');start(qs,U('間違えた問題'));retry();break;}case'sessionWrong':{mode='wrong';const qs=active.ids.map(id=>BYID[id]).filter(q=>status(q.id)==='wrong');start(qs,U('間違えた問題'));retry();break;}case'unanswered':{const qs=ALL.filter(q=>status(q.id)==='unanswered');start(qs,U('未回答の問題'));retry();break;}case'reset':if(confirm('このブラウザに保存した回答と採点結果をすべて消去します。よろしいですか？')){answers={};results={};history={};save();home();}break;}
});
save();render();
</script></body></html>
