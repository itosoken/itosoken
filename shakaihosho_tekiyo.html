.bubble{position:relative;flex:1;background:#ffedd8;border:1.5px solid #367c72;border-radius:10px;padding:10px 16px}
.bubble::before{content:"";position:absolute;left:-8px;top:50%;width:13px;height:13px;margin-top:-7px;background:#ffedd8;border-left:1.5px solid #367c72;border-bottom:1.5px solid #367c72;transform:rotate(45deg)}
.tw{overflow-x:auto;margin:8px 0 6px}
.lec table{border-collapse:collapse;width:100%;table-layout:fixed}
.lec table.tb{font-size:.94em;line-height:1.7}
.lec table.tb th,.lec table.tb td{border:1px solid #c1d2d0;padding:8px 11px;vertical-align:middle;text-align:left;font-weight:400}
.lec table.tb th.hd{background:#173d46;color:#fff;text-align:center;font-weight:700;padding:6px 8px}
.lec table.tb td.lb{background:#ebf3f0;font-weight:700}.lec table.tb td.alt{background:#f5f8f7}
.lec table.plain td{padding:5px 3px;vertical-align:middle}
.lec .box{border:2px solid;border-radius:9px;padding:9px 4px}
.lec img.fig{display:block;width:100%;height:auto;margin:10px auto;border:1px solid #c1d2d0;border-radius:6px;background:#fff}
.lec img.topic{float:right;width:112px;height:auto;margin:-22px 0 4px 14px;border:0;background:none}
.lec-next{display:flex;justify-content:center;margin:24px 0 6px}.lec-next button{font-size:17px;padding:14px 34px}
.tile-lec{display:inline-block;font-size:12px;font-weight:700;color:var(--tone);border:1px solid var(--tone);border-radius:5px;padding:0 8px;margin-right:8px}
@media(max-width:760px){.lec{padding:4px 14px 20px;font-size:14.5px}.big .lec{font-size:17.5px}.lec table.tb th,.lec table.tb td{padding:7px 8px}.lec table.wide{min-width:600px}.lec img.fig{min-width:560px}.ti{flex-basis:42px;width:42px;height:46px}.bubble{padding:9px 12px}.lec img.topic{width:84px}.lec .box p.big1{font-size:1em}.lec p.big2{font-size:1.1em}}
@media print{.viewtabs,.lec-toc,.lec-next{display:none}.lec{border:0;padding:0}}

olgroup><col style="width:25.9%"><col style="width:74.1%"></colgroup><tr><th class="hd"><p class="c"><b>場面</b></p></th><th class="hd"><p class="c"><b>使う制度と条件</b></p></th></tr><tr><td class="lb"><p><b>業務災害・通勤災害</b></p></td><td><p class="b">労災保険の対象となる傷病は、療養（補償）等給付で治療を受ける。</p><p class="b">健康保険を<em class="r">選択することはできない</em>。</p></td></tr><tr><td class="lb"><p><b>要介護・要支援者の訪問看護</b></p></td><td class="alt"><p class="b">原則は介護保険。</p><p class="b">末期の悪性腫瘍等の所定の疾病、<em class="r">特別訪問看護指示書の有効期間</em>、所定の精神科訪問看護などでは医療保険を使う。</p></td></tr></table></div><h4>医療保険を使った後に公費で軽減するもの</h4><div class="tw"><table class="tb"><colgroup><col style="width:30.7%"><col style="width:69.3%"></colgroup><tr><th class="hd"><p class="c"><b>制度</b></p></th><th class="hd"><p class="c"><b>対象となる医療の自己負担</b></p></th></tr><tr><td class="lb"><p><b>自立支援医療</b></p></td><td><p class="b">更生医療・育成医療・精神通院医療が対象。</p><p class="b"><em class="r">原則1割負担</em>で、所得や病状等に応じた月額上限がある。</p></td></tr><tr><td class="lb"><p><b>指定難病の医療費助成</b></p></td><td class="alt"><p class="b">認定を受けた指定難病の対象医療には、所得等に応じた<em class="rb">自己負担上限月額</em>がある。</p><p class="b">医療保険で3割負担の人は2割に軽減され、もともと1割・2割の人は元の負担割合のまま。</p><p class="b">この割合で計算した自己負担額を複数の指定医療機関の分も含めて月ごとに合算し、<em class="rb">上限月額を超える分は公費が負担する</em>。</p></td></tr><tr><td class="lb"><p><b>結核医療<br>感染症法第37条の2</b></p></td><td><p class="b">対象医療費の95％を医療保険と公費で負担し、本人の負担は<em class="r">原則5％</em>。</p></td></tr><tr><td class="lb"><p><b>入院勧告等による結核医療<br>感染症法第37条</b></p></td><td class="alt"><p class="b">対象となる入院医療は<em class="r">原則として自己負担がない</em>。</p><p class="b">世帯の市町村民税所得割額の合計が56万4千円を超える場合は、月2万円を限度に負担する。</p></td></tr></table></div><h4>月額上限の読み方</h4><div class="teach"><span class="ti" role="img" aria-label="解説する講師"></span><div class="bubble"><p class="b">例えば、受給者証に記載された<em class="rb">自己負担上限月額が5,000円</em>の場合です。</p><p class="b">負担割合で計算した月の合計が3,000円なら支払いは3,000円、8,000円なら支払いは上限の5,000円です。</p></div></div><h3 id="lec0-3" tabindex="-1">介護が必要なときに使う制度</h3><h4>介護が必要なときの給付の優先順位</h4><div class="tw"><table class="plain"><colgroup><col style="width:21.7%"><col style="width:4.4%"><col style="width:21.7%"><col style="width:4.4%"><col style="width:21.7%"><col style="width:4.4%"><col style="width:21.7%"></colgroup><tr><td><div class="box" style="background:#FBE2AA;border-color:#925B15"><p class="big1 c"><span style="color:#5B390C;"><b>労災保険</b></span></p></div></td><td><p class="big2 c"><span style="color:#245D5A;"><b>＞</b></span></p></td><td><div class="box" style="background:#CDE9F6;border-color:#336D90"><p class="big1 c"><span style="color:#1C4965;"><b>介護保険</b></span></p></div></td><td><p class="big2 c"><span style="color:#245D5A;"><b>＞</b></span></p></td><td><div class="box" style="background:#E5DDF4;border-color:#715298"><p class="big1 c"><span style="color:#4D3571;"><b>障害福祉</b></span></p></div></td><td><p class="big2 c"><span style="color:#245D5A;"><b>＞</b></span></p></td><td><div class="box" style="background:#D3EDDB;border-color:#38704F"><p class="big1 c"><span style="color:#244C37;"><b>介護扶助</b></span></p></div></td></tr></table></div><p class="b n"><em class="r">同じ内容の給付が重なる場合</em><span style="color:#2B4C53;">に、その人が使える制度を左から順に確認する。</span></p><h4>同じ介護が複数の給付の対象になるとき</h4><div class="tw"><table class="tb"><colgroup><col style="width:28.0%"><col style="width:72.0%"></colgroup><tr><th class="hd"><p class="c"><b>組合せ</b></p></th><th class="hd"><p class="c"><b>優先・補完の考え方</b></p></th></tr><tr><td class="lb"><p><b>労災保険と介護保険</b></p></td><td><p class="b">同じ要介護状態等について、労災保険から相当する給付を受けられる範囲は<em class="r">労災保険が優先</em>する。</p><p class="b">労災で補償されない部分には、要件を満たせば介護保険を使える。</p></td></tr><tr><td class="lb"><p><b>介護保険と障害福祉</b></p></td><td class="alt"><p class="b">相当する介護保険サービスで必要な支援を受けられる場合は、<em class="r">介護保険が優先</em>する。</p><p class="b">相当するサービスがない場合や量が不足する場合は、市町村が<em class="r">必要性を個別に判断</em>する。</p></td></tr><tr><td class="lb"><p><b>介護保険と介護扶助</b></p></td><td><p class="b">介護保険の被保険者が生活保護を受ける場合は、介護保険給付を先に使い、対象となる<em class="r">利用者負担分</em>を原則として介護扶助で賄う。</p></td></tr><tr><td class="lb"><p><b>障害福祉と介護扶助</b></p></td><td class="alt"><p class="b">40～64歳で医療保険に未加入の被保護者は介護保険の第2号被保険者にはならない。</p><p class="b">特定疾病により介護が必要な場合は、使える障害福祉サービス等を優先し、必要な<em class="r">不足分を介護扶助で賄う</em>。</p></td></tr></table></div><h4>例えば、視覚障害のある方が65歳を迎えたら</h4><div class="teach"><span class="ti" role="img" aria-label="解説する講師"></span><div class="bubble"><p class="b">外出時に必要な<em class="r">同行援護</em>には、介護保険に相当するサービスがありません。</p><p class="b">引き続き支援が必要な場合は、障害福祉サービスとして利用できます。</p><p class="b">訪問介護に相当する支援は、介護保険で<em class="r">必要な量を確保できるか</em>を確認します。</p></div></div></template><template id="lec1"><nav class="lec-toc" aria-label="この解説の内容"><button data-jump="lec1-1">同じ障害で公的年金と労災年金を受けるとき</button><button data-jump="lec1-2">複数の年金を受けられるとき</button><button data-jump="lec1-3">傷病手当金とほかの給付を受けるとき</button><button data-jump="lec1-4">公的年金と社会手当の組合せ</button><button data-jump="lec1-5">社会手当どうしの併給</button></nav><h3 id="lec1-1" tabindex="-1">同じ障害で公的年金と労災年金を受けるとき</h3><div class="teach"><span class="ti" role="img" aria-label="解説する講師"></span><div class="bubble"><p class="b">仕事中の事故で障害が残り、両方の支給要件を満たすときは、<b>公的障害年金と労災の障害年金を併給できます</b>。</p><p class="b">原則として<em class="r">公的障害年金は全額</em>を受け取り、<em class="r">労災年金側の支給額を調整</em>します。</p></div></div><h4>労災の障害（補償）等年金に掛ける調整率</h4><div class="tw"><table class="tb"><colgroup><col style="width:45.2%"><col style="width:19.6%"><col style="width:35.1%"></colgroup><tr><th class="hd"><p class="c"><b>同一事由で受ける公的障害年金</b></p></th><th class="hd"><p class="c"><b>労災側の調整率</b></p></th><th class="hd"><p class="c"><b>率を掛けた額</b></p></th></tr><tr><td class="lb"><p><b>障害基礎年金と障害厚生年金</b></p></td><td><p class="c">0.73</p></td><td><p class="c">労災年金額の73％</p></td></tr><tr><td class="lb"><p><b>障害厚生年金のみ</b></p></td><td class="alt"><p class="c">0.83</p></td><td class="alt"><p class="c">労災年金額の83％</p></td></tr><tr><td class="lb"><p><b>障害基礎年金のみ</b></p></td><td><p class="c">0.88</p></td><td><p class="c">労災年金額の88％</p></td></tr></table></div><p class="b n"><span style="color:#4D6265;">調整後の労災年金と公的年金の合計が、調整前の労災年金を下回るときは、その下回る額を労災年金に加える。</span></p><h4>通常の率表を使わない例</h4><div class="tw"><table class="tb"><colgroup><col style="width:28.6%"><col style="width:71.4%"></colgroup><tr><th class="hd"><p class="c"><b>場面</b></p></th><th class="hd"><p class="c"><b>扱い</b></p></th></tr><tr><td class="lb"><p><b>20歳前傷病の特則</b></p></td><td><p class="b">年金制度に未加入の<em class="r">20歳前に初診日</em>がある傷病による障害基礎年金では、対象となる労災年金等を受けると、その額に相当する<em class="r">障害基礎年金が支給停止</em>になる。</p></td></tr><tr><td class="lb"><p><b>支給事由が異なる場合</b></p></td><td class="alt"><p class="b">例えば、自身の障害厚生年金と、配偶者の死亡による労災の遺族（補償）等年金は、<em class="r">同一事由による調整の対象にならない</em>。</p></td></tr></table></div><h4>「0.73」は受け取る割合</h4><div class="teach"><span class="ti" role="img" aria-label="解説する講師"></span><div class="bubble"><p class="b">障害基礎年金と障害厚生年金の両方を受ける通常のケースでは、労災の障害年金に<em class="r">0.73</em>を掛けます。</p><p class="b">遺族年金どうしが同一の死亡を理由に重なる場合も労災側で調整しますが、使う率は障害の場合と異なります。</p></div></div><h3 id="lec1-2" tabindex="-1">複数の年金を受けられるとき</h3><div class="teach"><span class="ti" role="img" aria-label="解説する講師"></span><div class="bubble"><p class="b">年金には<b>老齢・障害・遺族</b>という支給事由があります。</p><p class="b">事由が異なる年金は原則として一つを選びますが、<em class="r">65歳以後</em>には、異なる事由の基礎年金と厚生年金を組み合わせられる場合があります。</p></div></div><h4>基礎年金と厚生年金の組合せ</h4><p class="b n"><span style="color:#334E54;">各列の上下の年金は、それぞれの受給要件を満たせば一緒に受け取れる。</span></p><p><b>同じ支給事由の組合せ</b></p><div class="tw"><table class="plain"><colgroup><col style="width:12.2%"><col style="width:1.5%"><col style="width:27.8%"><col style="width:1.5%"><col style="width:27.8%"><col style="width:1.5%"><col style="width:27.8%"></colgroup><tr><td><p class="c"><span style="color:#435C61;"><b>2階</b></span></p></td><td></td><td style="background:#B9DAEC"><p class="c"><span style="color:#154961;"><b>老齢厚生年金</b></span></p></td><td></td><td style="background:#F4CCA2"><p class="c"><span style="color:#684218;"><b>障害厚生年金</b></span></p></td><td></td><td style="background:#D4C3E5"><p class="c"><span style="color:#513763;"><b>遺族厚生年金</b></span></p></td></tr><tr><td><p class="c"><span style="color:#435C61;"><b>1階</b></span></p></td><td></td><td style="background:#E2F1F9"><p class="c"><span style="color:#154961;"><b>老齢基礎年金</b></span></p></td><td></td><td style="background:#FDEDDC"><p class="c"><span style="color:#684218;"><b>障害基礎年金</b></span></p></td><td></td><td style="background:#EFE8F6"><p class="c"><span style="color:#513763;"><b>遺族基礎年金</b></span></p></td></tr></table></div><p><em class="rb">65歳以後の特例</em><span style="color:#233F46;"><b>　異なる支給事由の組合せ</b></span></p><div class="tw"><table class="plain"><colgroup><col style="width:12.2%"><col style="width:1.5%"><col style="width:27.8%"><col style="width:1.5%"><col style="width:27.8%"><col style="width:1.5%"><col style="width:27.8%"></colgroup><tr><td><p class="c"><span style="color:#435C61;"><b>2階</b></span></p></td><td></td><td style="background:#D4C3E5"><p class="c"><span style="color:#513763;"><b>遺族厚生年金</b></span></p></td><td></td><td style="background:#B9DAEC"><p class="c"><span style="color:#154961;"><b>老齢厚生年金</b></span></p></td><td></td><td style="background:#D4C3E5"><p class="c"><span style="color:#513763;"><b>遺族厚生年金</b></span></p></td></tr><tr><td><p class="c"><span style="color:#435C61;"><b>1階</b></span></p></td><td></td><td style="background:#E2F1F9"><p class="c"><span style="color:#154961;"><b>老齢基礎年金</b></span></p></td><td></td><td style="background:#FDEDDC"><p class="c"><span style="color:#684218;"><b>障害基礎年金</b></span></p></td><td></td><td style="background:#FDEDDC"><p class="c"><span style="color:#684218;"><b>障害基礎年金</b></span></p></td></tr></table></div><h4>年金の組合せと選択</h4><div class="tw"><table class="tb"><colgroup><col style="width:33.3%"><col style="width:66.7%"></colgroup><tr><th class="hd"><p class="c"><b>場面</b></p></th><th class="hd"><p class="c"><b>受け取り方</b></p></th></tr><tr><td class="lb"><p><b>同じ支給事由</b></p></td><td><p class="b">老齢基礎年金と老齢厚生年金など、<em class="r">同じ事由の基礎年金と厚生年金</em>は組み合わせて受け取れる。</p></td></tr><tr><td class="lb"><p><b>異なる支給事由</b></p></td><td class="alt"><p class="b">原則は<em class="r">一人一年金</em>。</p><p class="b">複数の受給権が生じても、原則としていずれかを選択する。</p></td></tr><tr><td class="lb"><p><b>65歳以後の特例</b></p></td><td><p class="b">老齢基礎＋遺族厚生、障害基礎＋老齢厚生、障害基礎＋遺族厚生などの組合せが認められる。</p></td></tr><tr><td class="lb"><p><b>自身の老齢厚生年金と<br>遺族厚生年金（65歳以後）</b></p></td><td class="alt"><p class="b"><em class="r">自身の老齢厚生年金を優先</em>する。</p><p class="b">遺族厚生年金の額がこれを上回る場合は、遺族厚生年金から<em class="r">差額を支給</em>する。</p></td></tr><tr><td class="lb"><p><b>寡婦年金と死亡一時金</b></p></td><td><p class="b">国民年金の第1号被保険者であった夫の死亡について両方の要件を満たす場合は、どちらか一方を選ぶ。</p></td></tr></table></div><h4>65歳になる前にハローワークで求職を申し込んだとき</h4><div class="teach"><span class="ti" role="img" aria-label="解説する講師"></span><div class="bubble"><p class="b">特別支給の老齢厚生年金等と雇用保険の基本手当は調整されます。</p><p class="b">原則として<em class="rb">求職申込みをした月の翌月分から</em>、基本手当の受給期間満了月または所定給付日数を受け終えた月まで、<em class="r">年金は全額支給停止</em>です。</p><p class="b">実際の受給状況に応じて後から精算します。</p></div></div><h3 id="lec1-3" tabindex="-1">傷病手当金とほかの給付を受けるとき</h3><div class="teach"><span class="ti" role="img" aria-label="解説する講師"></span><div class="bubble"><p class="b">健康保険の傷病手当金は、<em class="r">業務外の病気やけが</em>で働けず、給与を受けられないときなどに支給されます。</p><p class="b">障害年金や出産手当金と期間が重なったら、<b>何の給付と重なるか</b>を確認します。</p></div></div><h4>傷病手当金との組合せ</h4><div class="tw"><table class="tb"><colgroup><col style="width:25.3%"><col style="width:36.0%"><col style="width:38.7%"></colgroup><tr><th class="hd"><p class="c"><b>重なる給付</b></p></th><th class="hd"><p class="c"><b>比較する金額</b></p></th><th class="hd"><p class="c"><b>傷病手当金の扱い</b></p></th></tr><tr><td class="lb"><p><b>障害基礎年金のみ</b></p></td><td><p class="b">比較しない。</p></td><td><p class="b">この<em class="r">併給調整の対象外</em>。</p><p class="b">両方の要件を満たせば受け取れる。</p></td></tr><tr><td class="lb"><p><b>同じ傷病による<br>障害厚生年金</b></p></td><td class="alt"><p class="b"><em class="r">年金年額を360で割る</em>。</p><p class="b">同じ事由の障害基礎年金があれば合算する。</p></td><td class="alt"><p class="b">傷病手当金の日額が年金の日額換算額を上回ると、<em class="r">差額を支給</em>する。</p></td></tr><tr><td class="lb"><p><b>出産手当金</b></p></td><td><p class="b">同じ期間の出産手当金の日額と比較する。</p></td><td><p class="b"><em class="r">出産手当金を優先</em>する。</p><p class="b">傷病手当金の日額の方が高いときは差額を支給する。</p></td></tr></table></div><h4>同一傷病の障害厚生年金がある場合の計算例</h4><div class="tw"><table class="tb"><colgroup><col style="width:47.6%"><col style="width:52.4%"></colgroup><tr><th class="hd"><p class="c"><b>仮定する金額</b></p></th><th class="hd"><p class="c"><b>日額の比較</b></p></th></tr><tr><td class="lb"><p><b>対象となる年金年額　144万円</b></p></td><td><p>144万円 ÷ 360日 ＝ 4,000円</p></td></tr><tr><td class="lb"><p><b>傷病手当金の日額　5,000円</b></p></td><td class="alt"><p>5,000円 － 4,000円 ＝ <b>差額1,000円</b></p></td></tr></table></div><h4>この例で受け取る金額</h4><div class="teach"><span class="ti" role="img" aria-label="解説する講師"></span><div class="bubble"><p class="b">年金を受け取りながら、支給対象の1日につき傷病手当金の<em class="r">差額1,000円</em>を受け取ります。</p><p class="b">年金の日額換算に使うのは<b>360日</b>です。</p></div></div><h3 id="lec1-4" tabindex="-1">公的年金と社会手当の組合せ</h3><div class="teach"><span class="ti" role="img" aria-label="解説する講師"></span><div class="bubble"><p class="b">最初に、<b>年金を受ける人が</b><em class="rb">親か、子ども自身か</em>を確認します。</p><p class="b">特に児童扶養手当では、親が受ける年金の種類で、手当額と比べる金額が変わります。</p></div></div><h4>児童扶養手当は何と比べるか</h4><div class="tw"><table class="tb"><colgroup><col style="width:36.0%"><col style="width:64.0%"></colgroup><tr><th class="hd"><p class="c"><b>受給資格者が受ける主な年金</b></p></th><th class="hd"><p class="c"><b>比較する額</b></p></th></tr><tr><td class="lb"><p><b>老齢年金・遺族年金など<br>障害厚生年金3級のみを含む</b></p></td><td><p class="b">原則として<em class="r">公的年金額</em>と、所得に応じた児童扶養手当額を比べる。</p><p class="b">手当額が高いときは差額を支給する。</p></td></tr><tr><td class="lb"><p><b>障害基礎年金等</b></p></td><td class="alt"><p class="b">年金のうち<em class="rb">子の加算額</em>と、所得に応じた児童扶養手当額を比べる。</p><p class="b">手当額が高いときは差額を支給する。</p></td></tr></table></div><h4>障害に関する三つの手当と年金</h4><div class="tw"><table class="tb"><colgroup><col style="width:31.5%"><col style="width:68.5%"></colgroup><tr><th class="hd"><p class="c"><b>手当と受給者</b></p></th><th class="hd"><p class="c"><b>年金等との関係</b></p></th></tr><tr><td class="lb"><p><b>特別児童扶養手当<br>父母・養育者</b></p></td><td><p class="b">対象児童が障害を理由とする所定の公的年金を受けられる場合、その児童分は原則対象外。</p><p class="b">その年金が<em class="r">全額支給停止の場合は例外</em>。</p><p class="b">親自身の障害年金だけを理由に手当が止まることはない。</p></td></tr><tr><td class="lb"><p><b>障害児福祉手当<br>20歳未満の重度障害児本人</b></p></td><td class="alt"><p class="b">本人が障害を理由とする所定の公的給付を受けられる場合は原則対象外。</p><p class="b">その給付が全額支給停止の場合は例外。</p></td></tr><tr><td class="lb"><p><b>特別障害者手当<br>在宅の20歳以上の本人</b></p></td><td><p class="b"><em class="r">障害年金と併給できる</em>。</p><p class="b">本人の障害年金は、手当の所得制限を判定する際の所得に含める。</p></td></tr></table></div><h4>障害基礎年金を受けるひとり親の例</h4><div class="teach"><span class="ti" role="img" aria-label="解説する講師"></span><div class="bubble"><p class="b">年金総額が児童扶養手当額を超えていても、<em class="r">子の加算額が手当額を下回れば</em>差額が支給されます。</p><p class="b"><b>年金総額だけを見て判断しない</b>ことがポイントです。</p></div></div><h3 id="lec1-5" tabindex="-1">社会手当どうしの併給</h3><div class="teach"><span class="ti" role="img" aria-label="解説する講師"></span><div class="bubble"><p class="b">同じ家庭に複数の手当が支給されることがあります。</p><p class="b"><em class="rb">誰が受給者か</em>に加えて、子どもの年齢や障害の程度、所得、施設入所など、それぞれの手当の要件を確認します。</p></div></div><h4>同じ世帯で受けられる手当の組合せ</h4><div class="tw"><table class="tb wide"><colgroup><col style="width:24.4%"><col style="width:13.3%"><col style="width:14.7%"><col style="width:15.8%"><col style="width:15.2%"><col style="width:16.6%"></colgroup><tr><th class="hd"><p class="c"><b>手当</b></p></th><th class="hd"><p class="c"><b>児童<br>手当</b></p></th><th class="hd"><p class="c"><b>児童扶養<br>手当</b></p></th><th class="hd"><p class="c"><b>特別児童<br>扶養手当</b></p></th><th class="hd"><p class="c"><b>障害児<br>福祉手当</b></p></th><th class="hd"><p class="c"><b>特別<br>障害者手当</b></p></th></tr><tr><td class="lb"><p><b>児童手当</b></p></td><td><p class="c">―</p></td><td><p class="c">○</p></td><td><p class="c">○</p></td><td><p class="c">○</p></td><td><p class="c">○</p></td></tr><tr><td class="lb"><p><b>児童扶養手当</b></p></td><td class="alt"><p class="c">○</p></td><td class="alt"><p class="c">―</p></td><td class="alt"><p class="c">○</p></td><td class="alt"><p class="c">○</p></td><td class="alt"><p class="c">○</p></td></tr><tr><td class="lb"><p><b>特別児童扶養手当</b></p></td><td><p class="c">○</p></td><td><p class="c">○</p></td><td><p class="c">―</p></td><td><p class="c">○</p></td><td><p class="c">○</p></td></tr><tr><td class="lb"><p><b>障害児福祉手当</b></p></td><td class="alt"><p class="c">○</p></td><td class="alt"><p class="c">○</p></td><td class="alt"><p class="c">○</p></td><td class="alt"><p class="c">―</p></td><td class="alt"><p class="c">×※</p></td></tr><tr><td class="lb"><p><b>特別障害者手当</b></p></td><td><p class="c">○</p></td><td><p class="c">○</p></td><td><p class="c">○</p></td><td><p class="c">×※</p></td><td><p class="c">―</p></td></tr></table></div><p class="b n"><span style="color:#4D6265;">「○」は、各制度の要件を満たせば同じ世帯で受給できる組み合わせ。</span></p><p class="b n"><span style="color:#4D6265;">「―」は、同じ手当の組み合わせ。</span></p><p class="b n"><span style="color:#4D6265;">「×※」は、</span><em class="r">同一人物が同時に受けられない</em><span style="color:#4D6265;">組み合わせ。</span></p><p class="b n"><span style="color:#4D6265;">年齢の異なる別の家族であれば、同じ世帯でそれぞれ受給できる。</span></p><h4>養育する人が受け取る手当と本人が受け取る手当</h4><div class="tw"><table class="tb"><colgroup><col style="width:28.6%"><col style="width:71.4%"></colgroup><tr><th class="hd"><p class="c"><b>受給者</b></p></th><th class="hd"><p class="c"><b>主な手当</b></p></th></tr><tr><td class="lb"><p><b>父母・養育者など</b></p></td><td><p class="b">児童手当、児童扶養手当、特別児童扶養手当。</p><p class="b">児童手当には<em class="r">所得制限がない</em>。</p><p class="b">後の二つには所得制限がある。</p></td></tr><tr><td class="lb"><p><b>障害のある本人</b></p></td><td class="alt"><p class="b">障害児福祉手当は<em class="r">20歳未満</em>、特別障害者手当は<em class="r">20歳以上</em>が対象。</p><p class="b">それぞれ障害の程度や所得等の要件がある。</p></td></tr></table></div><h4>親と子がそれぞれ受け取る例</h4><div class="teach"><span class="ti" role="img" aria-label="解説する講師"></span><div class="bubble"><p class="b">重度の障害がある子を在宅で育てているとき、要件をそれぞれ満たせば、<em class="rb">親が特別児童扶養手当</em><b>を、</b><em class="rb">子が障害児福祉手当</em><b>を</b>受け取れます。</p></div></div></template><template id="lec2"><h3 id="lec2-1" tabindex="-1">契約利用と行政による措置</h3><div class="teach"><span class="ti" role="img" aria-label="解説する講師"></span><div class="bubble"><p class="b"><em class="r">行政がサービスの利用や入院を決定</em>する手続を「措置」といいます。</p><p class="b">ここでは、<b>誰が決定するか、どのような事情で通常の契約が難しくなるか</b>に注目します。</p></div></div><h4>福祉サービスの契約と措置</h4><div class="tw"><table class="tb"><colgroup><col style="width:30.4%"><col style="width:69.6%"></colgroup><tr><th class="hd"><p class="c"><b>利用するサービス</b></p></th><th class="hd"><p class="c"><b>措置の条件・決定主体・根拠法</b></p></th></tr><tr><td class="lb"><p><b>高齢者の介護サービス</b></p></td><td><p class="b">事業者との契約が原則。</p><p class="b">やむを得ない事由により介護サービスの利用が著しく困難な場合は、<em class="rb">市町村</em>が老人福祉法に基づき措置を行う。</p><p class="b">やむを得ない事由の例として、虐待や、認知症で判断能力が低下し適切な代理人がいない状況が挙げられる。</p></td></tr><tr><td class="lb"><p><b>身体障害者・知的障害者の<br>障害福祉サービス</b></p></td><td class="alt"><p class="b">事業者との契約が原則。</p><p class="b">申請や契約ができないなど、やむを得ない事由により介護給付費等の支給を受けることが著しく困難な場合は、<em class="rb">市町村</em>が身体障害者福祉法または知的障害者福祉法に基づき措置を行う。</p></td></tr><tr><td class="lb"><p><b>障害児通所支援・<br>児童の障害福祉サービス</b></p></td><td><p class="b">保護者と事業者との契約が原則。</p><p class="b">やむを得ない事由により保護者が障害児通所給付費・介護給付費等の支給を受けることが著しく困難な場合は、<em class="rb">市町村</em>が児童福祉法に基づき措置を行う。</p></td></tr><tr><td class="lb"><p><b>障害児入所施設</b></p></td><td class="alt"><p class="b">保護者の不在や判断能力の低下などにより入所に必要な契約が困難な場合は、<em class="rb">都道府県等</em>が児童福祉法に基づき入所措置を行う。</p><p class="b">虐待等が見受けられる場合は、保護者が契約できても、子どもを保護するために入所措置を行う。</p></td></tr><tr><td class="lb"><p><b>保育所・認定こども園等</b></p></td><td><p class="b">施設の種類に応じて、市町村が利用調整等を行う。</p><p class="b">市町村の支援を受けても保育を利用できないなど、やむを得ない事由により保育の利用が著しく困難な場合は、<em class="rb">市町村</em>が児童福祉法に基づき措置を行う。</p></td></tr></table></div><h4>精神科の措置入院</h4><div class="teach"><span class="ti" role="img" aria-label="解説する講師"></span><div class="bubble"><p class="b">精神障害のため、入院させなければ<em class="r">自傷他害のおそれ</em>があると、原則として<em class="rb">2人以上の精神保健指定医</em>の診察結果が一致した場合に、<em class="r">都道府県知事等</em>が措置入院を決定できます。</p><p class="b">任意入院など、ほかの入院形態にはそれぞれの要件があります。</p></div></div></template><template id="lec3"><h lass="alt"><p class="b">第1号で対象校に在学し、原則として<em class="r">本人の前年所得</em>が基準以下なら、申請により納付が猶予される。</p><p class="b">家族の所得は問わない。</p><p class="b">受給資格期間には算入されるが、追納しない期間は<em class="r">老齢基礎年金額に反映されない</em>。</p><p class="b">追納は<em class="r">10年以内</em>。</p></td></tr><tr><td class="lb"><p><b>厚生年金・健康保険</b></p></td><td><p class="b">所定労働時間・日数の双方が一般労働者の<em class="r">4分の3以上</em>で共通要件を満たせば、学生も加入する。</p><p class="b">これを満たさない昼間学生は週20時間以上でも原則対象外。</p><p class="b">休学中、夜間・通信課程等には例外がある。</p></td></tr><tr><td class="lb"><p><b>健康保険の被扶養者</b></p></td><td class="alt"><p class="b">続柄・生計維持等の要件を満たす場合は認定される。</p><p class="b">年収基準は原則130万円未満、配偶者を除く19歳以上23歳未満は<em class="r">150万円未満</em>。</p></td></tr><tr><td class="lb"><p><b>雇用保険</b></p></td><td><p class="b"><em class="r">昼間学生は原則対象外</em>。</p><p class="b">休学中や、卒業前に就職して卒業後も同じ事業主に引き続き雇用される予定の人などは、通常の加入要件で判断する。</p></td></tr><tr><td class="lb"><p><b>労災保険</b></p></td><td class="alt"><p class="b">適用事業で賃金を受けて働く<em class="r">学生アルバイトも</em>、労働時間・雇用期間にかかわらず対象。</p></td></tr></table></div></template><template id="lec4"><h3 id="lec4-1" tabindex="-1"><img class="fig topic" src="data:image/webp;base64,UklGRkZXAABXRUJQVlA4WAoAAAAQAAAAZwEACgEAQUxQSOobAAAB90c2aZPk/9NL54hI/JtTymDcto0kqf+ycw92/xExAfy56jPmd5a8AST5lZFnysorp3uqwJV55njklUOuxlV6ZTM4pvbJFXqcDUkLn1CFNxQSVK8kDe0tAJtHAPbBCCublI+Y+T1EAZ6IgI8SRUFApWAjAqjgk2FTllxiBpysU8O2vZBkJVW9ts/M2sc21rvHtm3bWPPYtm3btteaWXNmCt3fj+rq7umke2p+5s0X0X9n1LZjzf0Kr2TaRyGz7KdvSZIsSZJsq6A+s7t/tN/u/SH9FR3l7dGXdFdhYRHzZ6a0iP7DgmSrajReoqghCHK5PGJ2f0XyinQZ8Ry0GbDJFjsNZ7Pl4G6peE6yWWokihN/AbvsfOy4Rz+YuXzVmvW1XLNm+aJf333o0r37ynjOGn/I2EvXYfT4dxYFFJdMOmSDnEws//r2gyuzm8vGXnwAm5z/8lwCEPoeEDBHPsORWHgm9ppXP3d4h8acJ/6KdT35rTXZdZ7P6foJW2RXzZrQN8pnY80HYPs75hOQd119VwGEZTd0aJwFMuDs90ZdPESFBB7hz4OjvDa6zgcWqUM+zx6mOK1MuA54oJ1IuWxtoylZGYXuG/mCKL5SsZa+7pNblm8UrWJg21cIfpBWL3X02zEHjdiybwsBoNETYC263LqefKS1CAiAv/SXJy/YukWszN+IIQUcPTt+PtBkPBOks1G9n6fuKBoxRUzpiH7PESKfVsnWnGAI5uNjmzdWipgMHLs4+yAlIRYh4fu9BVKNkmjtHiD46dIRgMCVwpGNj1Lk5j/Htyotz5wjGhu1Jmtx0jLy0iUnHnBf20bFgzEwjTLqo7l6Ar 8万人。約5％は集計時点の異なる統計から求めた概算。</span></p><h4>民間との共通点と公務員特有の取扱い</h4><div class="tw"><table class="tb"><colgroup><col style="width:25.0%"><col style="width:75.0%"></colgroup><tr><th class="hd"><p class="c"><b>制度</b></p></th><th class="hd"><p class="c"><b>公務員への適用</b></p></th></tr><tr><td class="lb"><p><b>公的年金</b></p></td><td><p class="b">2015年10月の<em class="r">被用者年金一元化</em>により、原則として厚生年金に加入する。</p><p class="b">短時間・非常勤職員は勤務条件等で判断する。</p></td></tr><tr><td class="lb"><p><b>医療保険</b></p></td><td class="alt"><p class="b">共済組合の組合員と認定された被扶養者は短期給付の対象。</p><p class="b">短時間・非常勤職員も所定の要件を満たせば対象。</p></td></tr><tr><td class="lb"><p><b>介護保険</b></p></td><td><p class="b">市町村に住所がある65歳以上は原則第1号、40～64歳の医療保険加入者は第2号被保険者。</p></td></tr><tr><td class="lb"><p><b>雇用保険</b></p></td><td class="alt"><p class="b">退職手当制度等により失業等給付等を上回ると認められる保障が受けられる職員は<em class="r">原則適用除外</em>。</p><p class="b">非常勤職員などは勤務条件や退職手当制度の適用状況で判断する。</p></td></tr><tr><td class="lb"><p><b>公務・通勤災害</b></p></td><td><p class="b">一般職の国家公務員は非常勤職員も災害補償の対象。</p><p class="b">地方公務員は任用形態・勤務先の事業等により、地方公務員災害補償法、条例、労災保険等に分かれる。</p></td></tr><tr><td class="lb"><p><b>児童手当</b></p></td><td class="alt"><p class="b">原則として<em class="r">勤務先の所属庁</em>が認定・支給し、公務員分の費用を負担する。</p><p class="b">支給要件・金額は民間と同じ。</p></td></tr></table></div></template><template id="lec5"><h3 id="lec5-1" tabindex="-1">生活保護受給者の年金・医療・介護</h3><div class="teach"><span class="ti" role="img" aria-label="解説する講師"></span><div class="bubble"><p class="b">生活保護では、利用できる<em class="r">他の給付を先に活用</em>します。</p><p class="b">介護の負担を考えるときは、<b>本人の年齢</b>と、40～64歳であれば<em class="rb">医療保険に加入しているか</em>を確認します。</p></div></div><h4>被保護実人員は約201万人</h4><div class="tw"><img class="fig" src="data:image/webp;base64,UklGRixYAABXRUJQVlA4TCBYAAAvP4ZYAPfjqJEkR8rxu0SWxPHHc6+1Y5IGxEi2VUXzDA+GFMg/EnfYffL/OI4kyVGqd9F88QQjMBq3Toup+Q81QgBCCBAghEIEIkQABEAQEAAIoY0iZgREiAC+epjTqbfDqBhuGB1isHr/N1/dvP+7r236H+46eP5W52vzfHfvmNy/2Vd3cyq9HXot/D1BQMSItrrKpSMgl+45vvUf/tfBOH6suawJqtFL77vZGmYJEAJCCQEE9B/m/u/5W71tsXr0abWmohKgBAiVCAEBRQKlUqBUKgFCpVI5SyVQran0f 複数の扶助を受ける人がいるため、各扶助の人数には重複がある。</span></p><h4>年金・医療の基本</h4><div class="tw"><table class="tb"><colgroup><col style="width:26.2%"><col style="width:73.8%"></colgroup><tr><th class="hd"><p class="c"><b>制度</b></p></th><th class="hd"><p class="c"><b>適用の条件</b></p></th></tr><tr><td class="lb"><p><b>国民年金</b></p></td><td><p class="b">第1号被保険者本人が<em class="r">生活扶助</em>を受けると、保険料は<em class="r">法定免除</em>になる。</p><p class="b"><em class="r">医療扶助のみ</em>の場合などは、この事由による免除の対象外。</p></td></tr><tr><td class="lb"><p><b>医療保険・医療扶助</b></p></td><td class="alt"><p class="b">保護を受ける世帯の人は、国民健康保険・後期高齢者医療の適用除外（保護停止中の世帯を除く）。</p><p class="b">勤務先の健康保険など使える給付があれば先に使う。</p></td></tr></table></div><h4>年齢・医療保険別にみた介護の費用</h4><div class="tw"><table class="tb"><colgroup><col style="width:32.7%"><col style="width:15.8%"><col style="width:51.5%"></colgroup><tr><th class="hd"><p class="c"><b>対象者</b></p></th><th class="hd"><p class="c"><b>介護保険</b></p></th><th class="hd"><p class="c"><b>給付の順序</b></p></th></tr><tr><td class="lb"><p><b>40～64歳・医療保険未加入</b></p></td><td><p>加入なし</p></td><td><p class="b">特定疾病による要介護・要支援状態なら、<em class="r">障害福祉等を先に活用</em>し、必要な不足分を介護扶助で賄う。</p></td></tr><tr><td class="lb"><p><b>40～64歳・医療保険加入</b></p></td><td class="alt"><p>第2号</p></td><td class="alt"><p class="b">特定疾病による要介護・要支援認定を受けた場合、介護保険が優先し、原則として<em class="r">利用者負担分を介護扶助で賄う</em>。</p></td></tr><tr><td class="lb"><p><b>65歳以上</b></p></td><td><p>原則第1号</p></td><td><p class="b">要介護・要支援認定を受ければ<em class="r">原因を問わず</em>介護保険を使い、原則として利用者負担分を介護扶助で賄う。</p></td></tr></table></div></template><template id="lec6"><h3 id="lec6-1" tabindex="-1"><img class="fig topic" src="data:image/webp;base64,UklGRvZqAABXRUJQVlA4WAoAAAAQAAAAZwEABAEAQUxQSMobAAAB96embQOmKX/m646IFOdNOgExkt26zfsgFjVw+i+YACi5goj+TwCm3PGj3JMRP2C7IBn8KZIRI/LoNkd/I+4HtnkoVexH90O3PWDEW7Ye+Up6wjbbRbL7f+8iyTVbb5QNij5IBuD9QBU8KuUqJ1yrkMT8gcCuPfNg54eHEgBs0sjVcYXggfAWTxCDPAMQI0N7kZndfQ9iYANNslRhd3AT2CJC5PoTxdoe0B1J7EEymZlnPAcAglxbkkRvj1QwsNO2SRK9bYpk5kZK2wJPJ3UUzwcASWqk31BxXZ/PKxQ0eV/3iV4qr6sr1wMqWEgHD2aXmd/9j 受けられる。</p></td></tr></table></div><h4>各制度の被保険者数</h4><div class="tw"><table class="tb"><colgroup><col style="width:36.3%"><col style="width:16.7%"><col style="width:47.0%"></colgroup><tr><th class="hd"><p class="c"><b>公的統計でみる区分</b></p></th><th class="hd"><p class="c"><b>人数</b></p></th><th class="hd"><p class="c"><b>集計時点</b></p></th></tr><tr><td class="lb"><p><b>介護保険の第1号被保険者</b></p></td><td><p class="c">約3,584万人</p></td><td><p>令和7年3月末</p></td></tr><tr><td class="lb"><p><b>後期高齢者医療の被保険者</b></p></td><td class="alt"><p class="c">約2,039万人</p></td><td class="alt"><p>令和6年度。</p><p class="b">障害認定による65～74歳を含む。</p></td></tr><tr><td class="lb"><p><b>雇用保険の高年齢被保険者</b></p></td><td><p class="c">約372万人</p></td><td><p>令和7年度の月平均（速報値）</p></td></tr><tr><td class="lb"><p><b>健康保険（協会けんぽの65歳以上）</b></p></td><td class="alt"><p class="c">約250万人</p></td><td class="alt"><p>令和6年度末。</p><p class="b">本人のみ。</p><p class="b">日雇特例を除く。</p></td></tr><tr><td class="lb"><p><b>厚生年金の65歳以上の被保険者</b></p></td><td><p class="c">約210万人</p></td><td><p>令和6年度末。</p><p class="b">全年齢の4,748万人と、65歳以上の割合4.5％からの概算。</p></td></tr></table></div></template><template id="lec7"><nav class="lec-toc" aria-label="この解説の内容"><button data-jump="lec7-1">健康保険の被扶養者と国民年金の第3号被保険者</button><button data-jump="lec7-2">短時間労働者が自分で社会保険に入る条件</button><button data-jump="lec7-3">事実婚の配偶者が対象になる制度</button></nav><h3 id="lec7-1" tabindex="-1"><img class="fig topic" src="data:image/webp;base64,UklGRpBpAABXRUJQVlA4WAoAAAAQAAAAZwEAPwEAQUxQSAIeAAABDAZtG0lKc/xR7zy7hyAiJiBP/fJbFTCxDreTCJbkvSXHOXMd96OLO3zBTh05jjeZLeGC+mD9xr4D/F4AbrNUtIhXZ7ZYsF9EwJMkDm+4TGyZDvznDF6ldYoKXybUCeXBMuMiU1x3tAl9vKRamfEFj9MiryzsE/pE4QVgxq6/OD30CtOGVi/c7MAmDf3EASQBct5iGUhicRaXPRLGbkdAvnh25QXrROW+uOK6ZVEnycSrq4A1w4kDQ7zLxOZLsvmaqzm/PyaklOQ2kiRJ///yoI2XXMLTwytzjhExAd6wbVs2p9m//TiOa4aJQdAWT1m0NLi7u7u7uzu11HGoKw7BElpK3XF3eciDBQtukes8z+O89g+5Z+aWa+6ZjxExAX6sbVNtu7atLrCUgAk2m7MoFxMspkTMmQH5KtOaZSaA0ZWmzczMzAzW1GgR//u13wioEVEjojUzIiaAcra9cQNnRKaLNLHHFkmAojR7FykgXaSFFJESctzXRlJBRgB+0AfSzr4cI2ICMEwVNTM h:826px" loading="lazy" alt="令和6年3月末の被扶養者は協会けんぽ1,433万人、健康保険組合1,135万人、共済組合402万人。"></div><p class="n"><span style="color:#4D6265;">令和6年3月末。</span></p><p class="b n"><span style="color:#4D6265;">協会けんぽ、健康保険組合、共済組合の被扶養者数の合計。</span></p><h4>続柄と生計維持の要件</h4><div class="tw"><table class="tb"><colgroup><col style="width:29.8%"><col style="width:70.2%"></colgroup><tr><th class="hd"><p class="c"><b>区分</b></p></th><th class="hd"><p class="c"><b>認定の考え方</b></p></th></tr><tr><td class="lb"><p><b>健康保険の被扶養者<br>別居でも対象となる続柄</b></p></td><td><p class="b">配偶者（事実婚を含む）、子、孫、兄弟姉妹、直系尊属。</p><p class="b">主として被保険者に<em class="r">生計を維持</em>されていること等が必要。</p></td></tr><tr><td class="lb"><p><b>健康保険の被扶養者<br>同一世帯が必要な続柄</b></p></td><td class="alt"><p class="b">上記以外の<em class="r">3親等内の親族</em>、事実婚の配偶者の父母・子が対象。</p><p class="b">事実婚の配偶者の死亡後も引き続き同一世帯となる父母・子を含む。</p></td></tr><tr><td class="lb"><p><b>年間収入の見込み</b></p></td><td><p class="b"><em class="r">原則130万円未満</em>。</p><p class="b">配偶者を除く19歳以上23歳未満は<em class="r">150万円未満</em>、60歳以上または所定の障害がある場合は<em class="r">180万円未満</em>。</p></td></tr><tr><td class="lb"><p><b>国内居住・本人の加入</b></p></td><td class="alt"><p class="b">原則国内居住が必要で、海外留学等の例外がある。</p><p class="b">本人が勤務先の健康保険や後期高齢者医療の被保険者になると、被扶養者から外れる。</p></td></tr><tr><td class="lb"><p><b>国民年金の第3号被保険者</b></p></td><td><p class="b">生計維持・国内居住等の要件があり、対象は<em class="r">配偶者に限られる</em>。</p><p class="b">本人が厚生年金に加入すれば原則第2号になる。</p></td></tr></table></div><h3 id="lec7-2" tabindex="-1">短時間労働者が自分で社会保険に入る条件</h3><div class="teach"><span class="ti" role="img" aria-label="解説する講師"></span><div class="bubble"><p class="b">扶養の年収基準を確かめる前に、<b>本人が</b><em class="rb">勤務先の健康保険・厚生年金保険</em><b>に加入する働き方か</b>を見ます。</p><p class="b">次の順番で確かめると、自分の加入資格を判断できます。</p></div></div><h4>勤務先での加入を判定する順序</h4><div class="tw"><table class="tb"><colgroup><col style="width:37.5%"><col style="width:62.5%"></colgroup><tr><th class="hd"><p class="c"><b>確認する条件</b></p></th><th class="hd"><p class="c"><b>該当する場合の扱い</b></p></th></tr><tr><td class="lb"><p><b>① 一般労働者の4分の3以上か</b></p></td><td><p class="b">週の所定労働時間と月の所定労働日数が、どちらも通常の労働者の<em class="r">4分の3以上</em>であれば、雇用期間や年齢等の共通要件を満たす人は加入する。</p><p class="b">学生も対象。</p></td></tr><tr><td class="lb"><p><b>② ①に該当しない場合は、<br>適用拡大の対象事業所か</b></p></td><td class="alt"><p class="b">原則として厚生年金の被保険者数が<em class="r">常時51人以上</em>の企業等、労使の合意により任意に適用を受ける事業所、国・地方公共団体の事業所が対象。</p></td></tr><tr><td class="lb"><p><b>③ 短時間労働者本人が<br>加入要件を満たすか</b></p></td><td><p class="b">週の所定労働時間が<em class="r">20時間以上</em>で、<em class="r">2か月を超える</em>雇用の見込みがあり、<em class="r">原則として学生でない</em>こと等が必要。</p><p class="b">休学中・夜間課程・通信課程等の学生には例外がある。</p></td></tr></table></div><h4>企業規模と賃金の要件</h4><div class="tw"><table class="tb"><colgroup><col style="width:28.6%"><col style="width:71.4%"></colgroup><tr><th class="hd"><p class="c"><b>項目</b></p></th><th class="hd"><p class="c"><b>2026年11月時点の取扱い</b></p></th></tr><tr><td class="lb"><p><b>51人以上の数え方</b></p></td><td><p class="b">短時間労働者を除く厚生年金の被保険者数が、1年のうち6か月以上51人以上となる見込みで判断する。</p><p class="b">企業規模要件は2027年10月から段階的に縮小し、2035年10月に撤廃予定。</p></td></tr><tr><td class="lb"><p><b>所定内賃金</b></p></td><td class="alt"><p class="b">月額8.8万円以上という賃金要件は<em class="r">2026年10月に撤廃</em>された。</p><p class="b">最低賃金の減額特例許可を受けた一定の人には別の取扱いがある。</p></td></tr></table></div><h4>扶養の基準額より収入が少ない場合</h4><div class="teach"><span class="ti" role="img" aria-label="解説する講師"></span><div class="bubble"><p class="b">年収見込みが130万円未満でも、勤務先で本人が被保険者となる条件を満たせば、<em class="r">自分で社会保険に加入</em>します。</p><p class="b">130万円は健康保険の被扶養者認定に用いる基準です。</p></div></div><h3 id="lec7-3" tabindex="-1"><img class="fig topic" src="data:image/webp;base64,UklGRnhqAABXRUJQVlA4WAoAAAAQAAAAZwEAGwEAQUxQSMwbAAAB90cmbdPWv/XtjojEE7magNhIctjm9+5tyqDTf8F8PulUENH/CYhfsmb/F9NF/EvKAZB5BWBje3mquGjqxRsQQB7ZOzIjGuU/QwdukSFJrb+4N0FlB/XU4obiYJ5EYyyZPa8tZW5KqfU5ekvu0fMRWncfiK5vRAvshm2trRHpzrelbU8RnejqCorI3Eid+EFWkJ3MAlUC7IgIjxuR2QNcWNoAjYCU2Bs7gAOgcRg2VzMjbLrTQN5653NSpj3nDVJhv47uvyXp9frZrFikRbo1eZ7NdyOa0gFjDHg6EsAAxMUCUDUkcT4rgbyRpLEW89X5VF2VxVj640psJozRAzSWucwxRrGOwa+rWX/Xe99aDAZtG0lq+MPeu+tzCyAiGAgAmYhLNf0ICtQQz9eYp >右の約4％は、法律婚・事実婚の配偶者がいる女性を分母に、年代別の回答者数と公表割合から求めた概算。</span></p><p class="n"><span style="color:#4D6265;">内閣府・令和3年度調査。</span></p><h4>事実婚における制度ごとの扱い</h4><div class="tw"><table class="tb"><colgroup><col style="width:27.4%"><col style="width:72.6%"></colgroup><tr><th class="hd"><p class="c"><b>制度</b></p></th><th class="hd"><p class="c"><b>適用の条件</b></p></th></tr><tr><td class="lb"><p><b>健康保険・国民年金第3号</b></p></td><td><p class="b">事実婚の配偶者も対象。</p><p class="b">健康保険で配偶者自身は同一世帯が必須ではない。</p><p class="b">配偶者の父母・子は<em class="r">同一世帯が必要</em>。</p><p class="b">第3号の年齢・生計維持要件は「健康保険の被扶養者と国民年金の第3号被保険者」のとおり。</p></td></tr><tr><td class="lb"><p><b>遺族基礎・遺族厚生年金</b></p></td><td class="alt"><p class="b">生計維持等の要件を満たせば対象。</p><p class="b">遺族基礎年金を受ける配偶者には、対象となる子が必要。</p><p class="b"><em class="r">内縁による再婚</em>でも、配偶者としての遺族年金の<em class="r">受給権を失う</em>。</p></td></tr><tr><td class="lb"><p><b>寡婦年金・配偶者加給年金額</b></p></td><td><p class="b">寡婦年金は、夫の第1号としての納付済・免除期間が10年以上、婚姻関係が継続10年以上などの要件があり、事実婚の妻も対象。</p><p class="b">加給年金額は原則65歳未満の被扶養配偶者が対象で、老齢厚生年金では原則加入20年以上、障害厚生年金では1・2級などが条件。</p></td></tr><tr><td class="lb"><p><b>年金分割</b></p></td><td class="alt"><p class="b">事実婚解消の場合も、一方が他方の被扶養配偶者として<em class="r">第3号であった期間</em>は対象になり得る。</p><p class="b">2008年4月以後の対象期間の<em class="r">3号分割に合意は不要</em>。</p></td></tr><tr><td class="lb"><p><b>労災保険・雇用保険</b></p></td><td><p class="b">業務・通勤災害による死亡時の遺族（補償）等給付の対象に含まれる。</p><p class="b">2週間以上にわたり常時介護が必要な配偶者のために休業する場合も、介護休業給付の対象になり得る。</p></td></tr><tr><td class="lb"><p><b>生活保護・児童扶養手当</b></p></td><td class="alt"><p class="b">生活保護の世帯認定は<em class="r">生計・居住の実態</em>で判断する。</p><p class="b">児童扶養手当では、離婚・未婚等の父母が事実婚となり、その配偶者に児童が養育される場合は原則対象外。</p></td></tr><tr><td class="lb"><p><b>所得税・相続</b></p></td><td><p class="b">所得税の配偶者控除・相続税の配偶者の税額軽減は法律婚が対象。</p><p class="b">内縁の相手は配偶者としての法定相続人にはならないが、遺贈で財産を取得すれば相続税の対象になり得る。</p></td></tr></table></div></template><template id="lec8"><nav class="lec-toc" aria-label="この解説の内容"><button data-jump="lec8-1">日本で暮らす外国人の社会保障</button><button data-jump="lec8-2">国をまたいで働くときの年金と医療保険</but 0時間以上・31日以上の雇用見込み等を満たす労働者が対象。</p><p class="b">技能実習・特定技能の労働者も含まれる。</p><p class="b"><em class="r">昼間学生の留学生は原則対象外</em>。</p></td></tr><tr><td class="lb"><p><b>社会手当</b></p></td><td><p class="b">児童手当、児童扶養手当、特別児童扶養手当は<em class="r">国籍を問わない</em>。</p><p class="b">受給資格者・児童の国内居住等の各要件がある。</p><p class="b">児童手当では所定の海外留学中の児童も対象。</p></td></tr><tr><td class="lb"><p><b>生活保護</b></p></td><td class="alt"><p class="b">生活保護法による保護は日本国民が対象。</p><p class="b">永住者、定住者、日本人・永住者の配偶者等、特別永住者等には通知に基づく<em class="r">行政措置で準じた保護</em>を行う。</p><p class="b">留学生・技能実習生等は原則対象外。</p></td></tr></table></div><h3 id="lec8-2" tabindex="-1">国をまたいで働くときの年金と医療保険</h3><div class="teach"><span class="ti" role="img" aria-label="解説する講師"></span><div class="bubble"><p class="b">国をまたいで働く人は、<em class="rb">社会保障協定</em><b>があるか、どの制度が対象か</b>を確認します。</p><p class="b">また、日本を離れるときは、将来の年金のために加入期間を残す場合と、<em class="r">脱退一時金</em>を受ける場合で結果が変わります。</p></div></div><h4>発効済みの社会保障協定　24か国</h4><div class="tw"><table class="tb"><colgroup><col style="width:36.0%"><col style="width:64.0%"></colgroup><tr><th class="hd"><p class="c"><b>日本側の医療保険の扱い</b></p></th><th class="hd"><p class="c"><b>相手国</b></p></th></tr><tr><td class="lb"><p><b>日本の医療保険についても<br>二重加入を防止する8か国</b></p></td><td><p class="b">アメリカ、ベルギー、フランス、オランダ、チェコ、スイス、ハンガリー、ルクセンブルク。</p><p class="b">具体的な適用・免除要件は国ごとに異なる。</p></td></tr><tr><td class="lb"><p><b>そのほかの発効国<br>16か国</b></p></td><td class="alt"><p class="b">ドイツ、英国、韓国、カナダ、オーストラリア、スペイン、アイルランド、ブラジル、インド、フィリピン、スロバキア、中国、フィンランド、スウェーデン、イタリア、オーストリア。</p></td></tr></table></div><p class="b n"><span style="color:#4D6265;">オーストリアとの協定では、一時派遣される被用者は医療保険について</span><em class="r">両国の制度に加入</em><span style="color:#4D6265;">する。</span></p><h4>加入期間を通算する場合と、脱退一時金を受ける場合</h4><div class="tw"><table class="tb"><colgroup><col style="width:28.6%"><col style="width:71.4%"></colgroup><tr><th class="hd"><p class="c"><b>仕組み</b></p></th><th class="hd"><p class="c"><b>内容</b></p></th></tr><tr><td class="lb"><p><b>加入期間の通算</b></p></td><td><p class="b">通算の規定がある協定では、<em class="r">両国の加入期間を合わせて</em>受給資格を判定できる。</p><p class="b">通算の有無と、二重加入を防ぐ対象制度の範囲は、国ごとに確認する。</p></td></tr><tr><td class="lb"><p><b>外国人の脱退一時金</b></p></td><td class="alt"><p class="b">日本国籍がなく、日本の公的年金の被保険者でなく、日本に住所がない人が対象。</p><p class="b">国民年金の納付済期間等または厚生年金の加入期間が<em class="r">6か月以上</em>あり、老齢年金の受給資格期間を満たさず、障害年金等の受給権を有したことがないことなどが必要。</p></td></tr><tr><td class="lb"><p><b>請求の期限と効果</b></p></td><td><p class="b">原則として最後に被保険者資格を喪失した日から<em class="r">2年以内</em>。</p><p class="b">資格喪失日に日本に住所があった場合は、その後初めて日本に住所を有しなくなった日から数える。</p><p class="b">脱退一時金を受け取ると、請求以前の日本の<em class="r">年金加入期間はすべて失われる</em>。</p></td></tr></table></div></template><noscript>この確認テストの利用にはJavaScriptを有効にしてください。</noscript></div>

function scoreQuestions(qs,a){return qs.reduce((s,q)=>{if(a[q.id]===undefined)s.unanswered++;else if(a[q.id]===q.answer)s.correct++;else s.wrong++;return s;},{correct:0,wrong:0,unanswered:0,total:qs.length});}
function gradeQuestions(qs){for(const q of qs){results[q.id]=answers[q.id]===undefined?'unanswered':answers[q.id]===q.answer?'correct':'wrong';history[q.id]=results[q.id];}save();}
function applySettings(){document.body.classList.toggle('ruby-off',!settings.ruby);document.body.classList.toggle('big',settings.big);for(const [id,v] of [['rubyOn',settings.ruby],['rubyOff',!settings.ruby],['fontSize',settings.big]]){const b=document.getElementById(id);b.classList.toggle('selected',v);b.setAttribute('aria-pressed',String(v));}}
document.getElementById('rubyOn').onclick=()=>{settings.ruby=true;save();applySettings();};
document.getElementById('rubyOff').onclick=()=>{settings.ruby=false;save();applySettings();};
document.getElementById('fontSize').onclick=()=>{settings.big=!settings.big;save();applySettings();};
function nav(){return `<nav class="nav" aria-label="学習メニュー">${[['tf','○×問題',74],['past','本試験の過去問',9],['wrong','間違えた問題',count(ALL,'wrong')]].map(([m,t,n])=>`<button data-mode="${m}" class="${mode===m?'selected':''}" aria-pressed="${mode===m}">${U(t)} <b>${n}</b></button>`).join('')}</nav>`;}
function header(){return `<section class="intro"><div class="eyebrow">SOCIAL SECURITY / CHECK TEST</div><h1>${U('社会保障制度の適用関係')}<br>${U('確認テスト')}</h1><p class="subtitle">解説を読んでから、一問一答で基礎を確認し、過去問で力を試しましょう。</p><div class="stats"><div><strong>74</strong><span>${U('○×問題')}</span></div><div><strong>9</strong><span>${U('本試験の過去問')}</span></div><div><strong>${count(ALL,'correct')}<small style="font-size:15px"> / 83</small></strong><span>${U('正解した問題')}</span></div></div></section>`;}
function footer(){document.getElementById('footer').innerHTML=`<p>${U(storageOK?'学習記録は、このブラウザ内に保存されます。':'この環境では学習記録を保存できません。画面を閉じると記録が消えます。')}</p><details><summary>${U('出典と教材について')}</summary><p>${U('確認テスト原稿・社会保障適用関係テキストを基に作成。')} 2026.11.08</p><p>各項目の解説は、講義資料「社会保障給付の優先関係」を基に作成。 2026.11.23</p><p>${U('○×問題の出題回は元原稿の関連回です。過去問そのものは別に収録しています。')}</p><p>${U('問題文と選択肢は出題当時の内容です。')}</p><p><a href="https://www.sssc.or.jp/shakai/past_exam/" target="_blank" rel="noopener">社会福祉振興・試験センター</a></p><p>${U('このテストは学習用です。国家試験の合否判定ではありません。')}</p></details><p style="margin-top:13px"><button data-action="reset">${U('記録をすべて消去')}</button></p>`;}
function goTop(){window.scrollTo({top:0,behavior:'instant'});document.querySelector('h2')?.focus({preventScroll:true});}
function home(){active=null;render();goTop();}
function lecture(i){return document.getElementById('lec'+i)?.innerHTML||'';}
function start(qs,title,category=null){active={ids:qs.map(q=>q.id),title,category,view:category!==null&&lecture(category)?'lecture':'quiz'};render();goTop();}
function viewTabs(n){return `<div class="nav viewtabs" role="group" aria-label="解説と問題の切り替え">${[['lecture','解説を読む',''],['quiz','問題を解く',n]].map(([v,t,c])=>`<button data-view="${v}" class="${active.view===v?'selected':''}" aria-pressed="${active.view===v}">${t}${c===''?'':` <b>${c}</b>`}</button>`).join('')}</div>`;}
function retry(){for(const id of active.ids){delete answers[id];delete results[id];}save();render();goTop();}
function dashboard(){
 if(mode==='tf')return `<div class="section-heading"><h2>${U('項目を選んで学習')}</h2><button data-action="alltf">${U('全問に挑戦')} →</button></div><div class="grid">${DATA.categories.map((title,i)=>{const qs=DATA.questions.filter(q=>q.category===i),c=count(qs,'correct');return `<button class="tile cat" data-cat="${i}" style="--tone:${tones[i]}"><div class="tile-head"><span class="number">${i+1}</span><span class="pill${c===qs.length?' done':''}">${c===qs.length?'✓ 全問正解':qs.length+' '+U('問')}</span></div><span class="tile-il il${i}" aria-hidden="true"></span><div class="tile-name">${title}</div><div class="tile-sub">${SUBS[i]}</div><div class="tile-foot">${lecture(i)?'<span class="tile-lec">解説つき</span>':''}${U('正解数')} ${c} / ${qs.length}</div><div class="track"><div class="fill" style="width:${c/qs.length*100}%"></div></div></button>`;}).join('')}</div>`;
 if(mode==='past')return `<div class="section-heading"><h2>${U('本試験の過去問')}</h2><button data-action="allpast">${U('全問に挑戦')} →</button></div><p class="muted">${U('正しい選択肢を1つ選んでください。')}</p><div class="grid" style="margin-top:15px">${DATA.past.map(q=>`<button class="tile" data-past="${q.id}" style="--tone:#357ea1"><div class="tile-head"><span class="number">${q.num}</span><span class="pill">${U(status(q.id)==='correct'?'正解':status(q.id)==='wrong'?'不正解':status(q.id)==='unanswered'?'未回答':'未採点')}</span></div><div class="tile-name">${q.label}</div><div class="tile-foot">${q.categories.map(i=>DATA.categories[i]).join(' ／ ')}</div></button>`).join('')}</div>`;
 const wrong=ALL.filter(q=>status(q.id)==='wrong');const unanswered=ALL.filter(q=>status(q.id)==='unanswered');return `<div class="section-heading"><h2>${U('間違えた問題')} ${wrong.length}${U('問')}</h2></div>${wrong.length?`<p class="muted">${U('解説を確認して、もう一度挑戦しましょう。')}</p><div class="actions"><button class="primary" data-action="review">${U('もう一度解く')} →</button></div><div class="grid">${wrong.map(q=>`<button class="tile" data-single="${q.id}" style="--tone:#a75e61"><span class="tile-name">${q.kind==='tf'?U('○×問題')+' '+q.num:q.label}</span><span class="tile-foot">${q.kind==='tf'?DATA.categories[q.category]:U('本試験の過去問')}</span></button>`).join('')}</div>`:`<div class="empty"><h3>${U('まだ該当する問題はありません。')}</h3><p class="muted">${U('問題を解いて採点すると、復習する問題が表示されます。')}</p></div>`}${unanswered.length?`<div class="actions"><button data-action="unanswered">${U('未回答の問題')} ${unanswered.length}${U('問')} →</button></div>`:''}`;
}
function question(q,i){const graded=Boolean(results[q.id]),a=answers[q.id],s=results[q.id],label=s==='correct'?'正解':s==='wrong'?'不正解':'未回答';return `<article class="question" id="q-${q.id}" aria-label="問題${q.num}"><div class="q-top"><span class="q-num">${q.kind==='tf'?U('問題')+' '+q.num:q.label}</span>${graded?`<span class="status-${s}">${U(label)}</span>`:`<span class="muted">${i+1} / ${active.ids.length}</span>`}</div><div class="${q.kind==='tf'?'tf-layout':''}"><div><p class="q-text">${q.text}</p>${q.source?`<p class="source">${q.source}</p>`:''}</div>${q.kind==='tf'?`<div class="tf-options" role="group" aria-label="問題${q.num}の回答">${[1,0].map(v=>`<button data-answer="${q.id}" data-value="${v}" aria-label="${v?'○ 正しい':'× 誤り'}" aria-pressed="${a===v}" ${graded?'disabled':''}>${v?'○':'×'}</button>`).join('')}</div>`:''}</div>${q.case?`<div class="case"><strong>${U('事例')}</strong>${q.case}</div>`:''}${q.kind==='past'?`<div class="options" role="group" aria-label="選択肢">${q.options.map((text,j)=>`<button class="option" data-answer="${q.id}" data-value="${j+1}" aria-pressed="${a===j+1}" ${graded?'disabled':''}><span class="opt-num">${j+1}</span><span>${text}</span></button>`).join('')}</div>`:''}${q.kind==='past'&&!graded?`<div class="actions"><button class="primary" data-grade="${q.id}" ${a===undefined?'disabled':''}>この問題を採点する</button></div>`:''}${graded?`<div class="explanation"><div class="key">${U('正答')}：${q.kind==='tf'?(q.answer?'○':'×'):q.answer} <small class="muted">${U('回答')}：${a===undefined?U('未回答'):q.kind==='tf'?(a?'○':'×'):a}</small></div>${q.kind==='tf'?`<p>${q.explanation}</p>`:`<h3>${U('選択肢ごとの解説')}</h3><ol>${q.explanations.map((e,j)=>`<li><span class="verdict ${q.answer===j+1?'status-correct':'status-wrong'}">${j+1}　${q.answer===j+1?'○':'×'}</span>${e}</li>`).join('')}</ol>`}</div>`:''}</article>`;}
function session(){const qs=active.ids.map(id=>BYID[id]),done=qs.every(q=>results[q.id]),n=qs.filter(q=>results[q.id]).length,ok=qs.filter(q=>results[q.id]==='correct').length,alltf=qs.every(q=>q.kind==='tf'),s=scoreQuestions(qs,answers);let related=active.category===null?[]:DATA.past.filter(q=>q.categories.includes(active.category));const hasLec=active.category!==null&&Boolean(lecture(active.category));if(hasLec&&active.view==='lecture')return `<button data-action="home">← ${U('項目一覧へ')}</button><section class="session-head"><h2 tabindex="-1">${active.title}</h2><p>まず解説を読んで、制度の関係を整理しましょう。読み終えたら「問題を解く」へ進みます。</p></section>${viewTabs(qs.length)}<section class="lec">${lecture(active.category)}</section><div class="lec-next"><button class="primary" data-view="quiz">問題を解く（${qs.length}問） →</button></div>`;return `<button data-action="home">← ${U(mode==='past'?'過去問一覧へ':'項目一覧へ')}</button><section class="session-head"><h2 tabindex="-1">${active.title}</h2><p>${U(qs.every(q=>q.kind==='tf')?'正しいと思う場合は○、誤りと思う場合は×を選んでください。':'選択肢を選んで「この問題を採点する」を押すと、正答と解説が表示されます。')}</p></section>${hasLec?viewTabs(qs.length):''}<div class="session-tools"><span class="muted" id="answered">${U('回答済み')} ${n} / ${qs.length}</span><span class="muted">${done?U('解答と解説'):alltf?'○か×を押すと、その場で正解と解説が表示されます。':'1問ごとに採点できます。'}</span></div><div id="questions">${qs.map(question).join('')}</div>${done?`<section class="result" role="status" tabindex="-1"><span>${U('得点')}</span><div><strong class="score">${s.correct}</strong> / ${s.total} ${U('点')} <span class="muted">（${Math.round(s.correct/s.total*100)}%）</span></div><p>${U(s.correct===s.total?'全問正解です。よく理解できています。':'解説を確認して、もう一度挑戦しましょう。')}</p><div class="muted">${U('不正解')} ${s.wrong}　／　${U('未回答')} ${s.unanswered}</div><div class="actions"><button data-action="retry">${U('もう一度解く')}</button>${s.wrong?`<button data-action="sessionWrong">${U('間違えた問題')} ${s.wrong}${U('問')} →</button>`:''}</div></section>`:''}${related.length?`<section class="session-head"><h3>${U('この項目の関連過去問')}</h3><div class="related">${related.map(q=>`<button data-past="${q.id}">${q.label} →</button>`).join('')}</div></section>`:''}<div class="bottom-bar"><span id="bottomCount">${U('回答済み')} ${n} / ${qs.length}　${U('正解')} ${ok}</span><div class="tools"><button data-action="home">${U('戻る')}</button>${done?`<button class="primary" data-action="retry">${U('もう一度解く')}</button>`:''}</div></div>`;}
function render(){document.getElementById('app').innerHTML=(active?'':header())+nav()+(active?session():dashboard())+(readError?`<div class="notice">${U('保存した記録を読み込めませんでした。新しく開始します。')}</div>`:'');footer();applySettings();}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.mode){mode=b.dataset.mode;home();return;}
 if(b.dataset.view){active.view=b.dataset.view;render();goTop();return;}
 if(b.dataset.jump){const h=document.getElementById(b.dataset.jump);h?.scrollIntoView({behavior:'instant',block:'start'});h?.focus({preventScroll:true});return;}
 if(b.dataset.cat!==undefined){const i=Number(b.dataset.cat);start(DATA.questions.filter(q=>q.category===i),`${i+1}　${DATA.categories[i]}`,i);return;}
 if(b.dataset.past){mode='past';const q=BYID[b.dataset.past];start([q],q.label);return;}
 if(b.dataset.single){const q=BYID[b.dataset.single];start([q],q.kind==='tf'?U('○×問題')+' '+q.num:q.label);retry();return;}
 if(b.dataset.answer){const id=b.dataset.answer,q=BYID[id];answers[id]=Number(b.dataset.value);if(q.kind==='tf'){gradeQuestions([q]);render();return;}save();document.querySelectorAll(`[data-answer="${id}"]`).forEach(x=>x.setAttribute('aria-pressed',String(Number(x.dataset.value)===answers[id])));const g=document.querySelector(`[data-grade="${id}"]`);if(g)g.disabled=false;return;}
 if(b.dataset.grade){const q=BYID[b.dataset.grade];if(answers[q.id]===undefined)return;gradeQuestions([q]);render();return;}
 switch(b.dataset.action){case'home':home();break;case'alltf':start(DATA.questions,U('○×問題')+' 74'+U('問'));break;case'allpast':start(DATA.past,U('本試験の過去問')+' 9'+U('問'));break;case'grade':gradeQuestions(active.ids.map(id=>BYID[id]));render();document.querySelector('.result')?.focus();document.querySelector('.result')?.scrollIntoView({behavior:'instant',block:'start'});break;case'retry':retry();break;case'review':{const qs=ALL.filter(q=>status(q.id)==='wrong');start(qs,U('間違えた問題'));retry();break;}case'sessionWrong':{mode='wrong';const qs=active.ids.map(id=>BYID[id]).filter(q=>status(q.id)==='wrong');start(qs,U('間違えた問題'));retry();break;}case'unanswered':{const qs=ALL.filter(q=>status(q.id)==='unanswered');start(qs,U('未回答の問題'));retry();break;}case'reset':if(confirm('このブラウザに保存した回答と採点結果をすべて消去します。よろしいですか？')){answers={};results={};history={};save();home();}break;}
});
save();render();
</script></body></html>
