<script>
/* <![CDATA[ */
(()=>{
'use strict';
const host=document.currentScript.previousElementSibling;
const root=host.attachShadow({mode:'open'});
const QUESTIONS=[{"id":1,"question":"乳幼児期の発達に関する次の組み合わせのうち，最も適切なものを1つ選びなさい。","options":["定頸 ― 生後1か月","座位 ―　生後3 か月","つかまり立ち ― 生後10 か月","一人で階段の上り下りをする ― 1 歳","三輪車をこぐ　― 2 歳"],"answer":[3],"explanation":"つかまり立ちは、生後10か月頃が目安です。発達には個人差があります。","subject":0},{"id":2,"question":"事例を読んで，緩和ケアに関する次の記述のうち，最も適切なものを1 つ選びなさい。\n\n〔事例〕\nＡさん（45 歳，女性）は，肺がんstage Ⅳで抗がん剤治療を受けていたが，全身状態不良のためＢ病院に入院となった。胸部痛の訴えがあり，オピオイドを内服しているが，疼痛コントロールは不良である。入院時に主治医より，Ａさん及びキーパーソンである夫に対して，予後は3 か月ほどであり，今後の方針としては緩和ケアに移行すると告知した。その後，Ａさんは不安や抑うつ気分を呈するようになった。入院して2 週間が経過したが，Ａさんの不安や抑うつ気分は改善を認めない。Ａさんは入院継続を希望しており，夫も自宅での生活に不安を抱えている。","options":["訪問診療を導入し，自宅退院を促す。","不安や抑うつ気分に対して薬物療法を行う。","Ａさんの緩和ケアに対する心理的な抵抗感は少ない。","夫は緩和ケアの対象ではない。","疼痛コントロールは積極的に行わない。"],"answer":[2],"explanation":"持続する不安・抑うつへの治療も緩和ケアです。痛みの緩和と家族への支援も行います。","subject":0},{"id":3,"question":"ホルモンに関する次の記述のうち，正しいものを1 つ選びなさい。","options":["インスリンは血糖値を上げる。","アドレナリンは心拍数を下げる。","アルドステロンは血圧を下げる。","バソプレシンは尿の生成を促す。","エリスロポエチンは赤血球数を増加させる。"],"answer":[5],"explanation":"エリスロポエチンは赤血球の産生を促します。インスリンは血糖値を下げます。","subject":0},{"id":4,"question":"事例を読んで，次のうち，Ａさんの希望を踏まえた訓練やサポートを行う主な職種として，最も適切なものを1 つ選びなさい。\n\n〔事例〕\nＡさん（58 歳，男性）は脳梗塞を発症し，右片麻痺と構音障害の症状があるため，回復期リハビリテーション病棟に入院中である。利き手である右手を実用的に使うことは難しく，左手を使って身の回りのことができるよう練習している。退院後は一人で入浴できるようになりたいと希望しており，自宅の浴室に手すりを設置する予定である。","options":["理学療法士","作業療法士","言語聴覚士","義肢装具士","看護師"],"answer":[2],"explanation":"作業療法士は、入浴など日常生活動作の訓練や生活環境の調整を支援します。","subject":0},{"id":5,"question":"疾病の予防に関する次の組み合わせとして，最も適切なものを1 つ選びなさい。","options":["がん検診 一次予防","減塩指導 二次予防","早期治療 三次予防","予防接種 一次予防","リハビリテーション 二次予防"],"answer":[4],"explanation":"予防接種は発病を防ぐ一次予防です。早期発見・早期治療は二次予防です。","subject":0},{"id":6,"question":"事例を読んで，次のうち，本症例で発生した可能性が最も高い不整脈を1つ選びなさい。\n\n〔事例〕\n会社員のＡさん（54 歳，男性）は，糖尿病で診療所の外来に通院している。趣味のテニスをしている最中に，突然意識を失って倒れた。同僚が119 番通報し，呼吸を確認したところ死戦期呼吸（下顎呼吸）を認めたため，直ちに胸骨圧迫と人工呼吸を開始した。施設職員が自動体外式除細動器（ＡＥＤ）を持参して除細動を実施し，Ａさんの意識は回復した。その後，救急隊により病院へ搬送された。","options":["徐脈","期外収縮","心室細動","洞不全症候群","房室ブロック"],"answer":[3],"explanation":"心室細動は心停止を起こす危険な不整脈で、AEDによる電気ショックの対象です。","subject":0},{"id":7,"question":"事例を読んで，次のうち，現在のＡさんに生じている状況を説明する現象として，最も適切なものを1 つ選びなさい。\n\n〔事例〕\nＡさん（25 歳）は，1 年半前，バスの中で息苦しくなり，このまま心臓が止まってしまうのではないかと恐怖に襲われる経験をした。その後，バスに乗ると強い恐怖を感じるようになってしまい，バスに乗れなくなってしまった。病院を受診したところ，身体的な異常は認められなかった。しかし，現在では電車などのバス以外の乗り物にも恐怖を感じるようになってしまった。","options":["強化","消去","般化","弁別","馴化"],"answer":[3],"explanation":"バスへの恐怖が電車にも広がるように、似た刺激にも反応することを「般化」といいます。","subject":1},{"id":8,"question":"次の記述のうち，確証バイアスが生じている事例として，最も適切なものを1 つ選びなさい。","options":["利用者が集団活動を拒否する理由として，活動の魅力が低いことではなく，その利用者が集団活動を嫌いな人であるからと考えた。","感染症対策を特にしなくても，自分は感染しないだろうと楽観視してしまった。","利用者の転倒事故が起きた後に，前から事故が起きそうだったとわかっていたと発言する人が何人か現れた。","ちょっと嫌いな人だという第一印象をもった相手について，いやな行動ばかりが目について，ますます嫌いになってしまった。","自分の主張は多数派だと考えていたが，実際にアンケート調査をしたら賛成する人は少数であり，意外だった。"],"answer":[4],"explanation":"確証バイアスは、自分の思い込みを裏づける情報に注目しやすくなる傾向です。","subject":1},{"id":9,"question":"次の記述のうち，1 歳頃の子どもにおける一般的な言語発達の状況として，最も適切なものを1 つ選びなさい。","options":["「アー」，「クー」といった喉を鳴らすような発声をするようになる。","「バババ」といった明瞭な音を発声するようになる。","「ママ」，「マンマ」などの1 単語を発するようになる。","「パパ ダッコ」，「コレ ワンワン」などの2 単語を文のように話すようになる。","「ボク ハ イヤ」などの助詞を使った文を話すようになる。"],"answer":[3],"explanation":"1歳頃は「ママ」などの一語文が目安です。二語文は一般にその後に現れます。","subject":1},{"id":10,"question":"次の記述のうち，アントノフスキー（Antonovsky, A.）が定義した首尾一貫感覚（ＳＯＣ：Sense of Coherence）の説明として，正しいものを2 つ選びなさい。","options":["疾病リスクを特定し，その低減を目的とした理論の一つである。","自分に起こる出来事や状況が理解可能であり，予測可能であるという感覚を含んでいる。","汎適応症候群の一つとして経験される感覚である。","困難なことが起きたら，自分には対処できないというあきらめの感覚である。","自分の人生や自分が経験することには意味があるという感覚を含んでいる。"],"answer":[2,5],"explanation":"首尾一貫感覚は、把握可能感・処理可能感・有意味感の3要素からなります。","subject":1},{"id":11,"question":"事例を読んで，Ａ社会福祉士の対応に関する次の記述のうち，「動機づけ面接」の方法を用いて，クライエントのデイケアへの参加の動機づけを高める対応として，最も適切なものを1 つ選びなさい。\n\n〔事例〕\nＢさん（40 歳，男性）は，うつ病であったが症状は軽快し，2 週間前から復職プログラムを実施する精神科デイケアに通っている。しかし，これまで10 日のうち遅刻が8 日，欠席が1 日であった。デイケアスタッフのＡがＢさんと面談することとなり，Ｂさんの話を傾聴すると「毎日，遅刻しないで参加したいが，一方で参加したくない気持ちもあり，アラームで目が覚めてからベッドでぐずぐずしてしまい，遅刻してしまった」と話した。「二つの気持ちの間で揺れているのですね」と応答した後で，Ａは，Ｂさんが目覚めた後に早めに行動することへの動機づけを高める働きかけを試みることにした。","options":["「もう少し早く寝るとよいと思いますよ」","「なぜベッドからなかなか起きることができないのだと思いますか」","「そのことばかりを考えていても仕方がありません」","「このまま遅刻が続くと，復職は難しくなってしまいますよ」","「目が覚めて，すぐに行動することができたら，どんな良いことがあると思いますか」"],"answer":[5],"explanation":"動機づけ面接では、変化する利点を本人の言葉で語ってもらい、内発的な動機を引き出します。","subject":1},{"id":12,"question":"次の記述のうち，発達障害のあるＡさん（10 歳，男性）に対して，応用行動分析（ＡＢＡ：Applied Behavior Analysis）に基づく支援として，最も適切なものを1 つ選びなさい。","options":["Ａさんの多動の背景には，無意識の欲求があると考え，自由連想法を行う。","Ａさんの支援に関わる職員に生じている逆転移への対応を優先する。","Ａさんの身体に硬さが現れているようであれば，リラクゼーションを行う。","Ａさんの家族を対象としたカウンセリングを行う。","Ａさんの行動とＡさんの支援に関わる職員の対応との関連性について明らかにする。"],"answer":[5],"explanation":"応用行動分析では、行動と、その前後の環境・周囲の対応との関係を調べます。","subject":1},{"id":13,"question":"デュルケーム（Durkheim, É.）の「自殺論」に関する次の記述のうち，最も適切なものを1 つ選びなさい。","options":["自殺傾向は，流行現象として捉える必要があるとした。","自己本位的自殺は，戦争時に増加する。","集団本位的自殺は，人々の欲求への規制が弱まることで生じる。","アノミー的自殺は，経済的に衰退した時も，繁栄の時期にも増加する。","宿命的自殺は，自己決定意欲が高まると増加する。"],"answer":[4],"explanation":"アノミー的自殺は、急激な社会変動で規範が揺らぐ際に増えます。不況時にも好況時にも生じます。","subject":2},{"id":14,"question":"現在の日本のＮＰＯ法人（特定非営利活動法人）に関する次の記述のうち，最も適切なものを1 つ選びなさい。","options":["特例認定ＮＰＯ法人は，パブリック・サポート・テストを受けなければならない。","収益事業の実施は認められていない。","1980 年代の難民救援活動を契機として急増した。","認定ＮＰＯ法人は，クラウドファンディングを用いて資金調達を行うことはできない。","3 年以上，事業報告書等を提出しなかった場合，所轄庁は認証を取り消すことができる。"],"answer":[5],"explanation":"NPO法人が3年以上事業報告書等を提出しない場合、所轄庁は設立認証を取り消せます。","subject":2},{"id":15,"question":"人口統計で用いられる用語に関する次の記述のうち，最も適切なものを1つ選びなさい。","options":["人口学的方程式とは，出生数から死亡数を減じることにより人口を求める計算式である。","合計特殊出生率は，18 歳から49 歳までの女性の年齢別出生率を足し上げて算出する。","生産年齢人口は，ある年の15 歳から69 歳までの者の総数である。","団塊の世代とは，1971 年から1974 年生まれの人々である。","人口置換水準は，先進国より発展途上国の方が高い。"],"answer":[5],"explanation":"人口置換水準は人口を維持する出生水準です。死亡率が高い社会では、より高い出生水準が必要です。","subject":2},{"id":16,"question":"エスピン－アンデルセン（Esping-Andersen, G.）の福祉国家レジーム論に関する次の記述のうち，適切なものを2 つ選びなさい。","options":["福祉国家レジームは，左派勢力，カトリック政党，権威主義的国家の歴史的遺制の影響によって形作られる。","脱商品化とは，労働者が労働能力を喪失することである。","自由主義レジームの特徴は，エンタイトルメントが厳格であり，スティグマを伴いがちであるということである。","社会民主主義レジームの特徴は，家族の福祉機能が限界に達したときに自治体や国がこれを補完することを前提としている。","コーポラティズム・レジームの特徴は，社会政策に階級と職業的地位の差異が影響しないことである。"],"answer":[1,3],"explanation":"福祉国家の形成には政治的・歴史的条件が影響します。自由主義型では給付要件が厳しくなりがちです。","subject":2},{"id":17,"question":"次の記述のうち，人々の生活に関連する社会学の概念についての説明として，最も適切なものを1 つ選びなさい。","options":["ライフスタイルとは，社会経済的地位によって決まる日常生活のパターンを表す概念である。","ライフステージとは，ある特定の時期にある特定の出来事を同時に経験するような人生の段階を表す概念である。","出生コーホートとは，同じ年に生まれた人々の生活や人生に関する評価を規定する価値観などの諸要因の複合を表す概念である。","ライフコースとは，人々の生活や人生を生まれた時代や歴史的な出来事と関連づけて捉える概念である。","ライフイベントとは，人間が誕生してから死に至るまでの過程における各段階を表す概念である。"],"answer":[4],"explanation":"ライフコースは、個人の人生を、出生した時代や歴史的出来事との関わりで捉えます。","subject":2},{"id":18,"question":"事例を読んで，次のうち，社会福祉士としてひとり親世帯であるＡさん親子の状況を把握するうえで，妥当な社会学の概念として，最も適切なものを1 つ選びなさい。\n\n〔事例〕\n非正規の仕事を2 つ掛け持ちしながら小学生の子どもＢさんを育てている母親Ａさんから相談が入った。「怒鳴っても子どもが言うことを聞かなくて困っている。子どもをしつけるにはどうしたらよいか」という。詳しく話を聞いたところ，Ｂさんは流行りのゲーム機を買ってもらえないため駄々をこねているという。また「自分は親に怒鳴られて育ってきた。おかげでまともな人間になったと思っているし，怒鳴る以外に言うことを聞かない子どもをしつけるやり方もわからない」とのことである。","options":["予言の自己成就","相対的剥奪","社会的孤立","役割葛藤","互酬性"],"answer":[2],"explanation":"周囲の人々と比べ、一般的な生活や所有物が得られないと感じる状態が相対的剥奪です。","subject":2},{"id":19,"question":"次の記述のうち，イギリスのスピーナムランド制度の説明として，最も適切なものを1 つ選びなさい。","options":["救済を求めて都市部に集中する貧民を分散するために，生まれ故郷の教区へ強制的に送還した。","救済を申し込んだ貧民の労働能力の有無をテストするために，労役場を活用した。","労働能力のある貧民が雇用されるまでの間は自宅に待機させ，貧民救済委員会による救済を施した。","最低賃金制度がない状態で，パンの価格と家族の大きさによる基準と賃金との差額を賃金補助したため，賃金の引き下げ圧力を生むとともに，救貧税負担の増大を招いた。","救済を受ける貧民の救済水準は，独立自活している最下層の労働者の生活水準を下回るものとした。"],"answer":[4],"explanation":"スピーナムランド制度は、パンの価格と家族人数を基準に不足する賃金を補いました。","subject":3},{"id":20,"question":"内閣府「令和7 年版 男女共同参画白書」における女性の就業に関する次の記述のうち，最も適切なものを1 つ選びなさい。","options":["2024 年（令和6 年）時点で，20 歳代後半から30 歳代前半の女性の就業率は約50 ％である。","2024 年（令和6 年）時点で，妻が64 歳以下の世帯では，「男性雇用者と無業の妻から成る世帯」と「雇用者の共働き世帯」の数はほぼ等しい。","妻が64 歳以下の雇用者の共働き世帯では，1985 年（昭和60 年）から2024 年（令和6 年）の間に，妻が週35 時間以上就業する世帯の数が約2 倍に増加している。","2023 年（令和5 年）時点の「男女間賃金格差」の国際比較をみると，日本と韓国は経済協力開発機構（ＯＥＣＤ）加盟国の平均値と比べて男女間の賃金格差が大きい。","2024 年（令和6 年）時点で，女性の年齢階級別正規雇用比率をグラフに示すと，30 歳代前半でピークを迎えた後は低下を続けている。"],"answer":[4],"explanation":"設問の2023年の比較では、日本と韓国の男女間賃金格差はOECD平均より大きくなっています。","subject":3,"note":" 「男女間賃金格差」とは，フルタイム労働者について男性賃金の中央値を100 とした場合の女性賃金の中央値の水準を割合表示した数値のことである。"},{"id":21,"question":"孤独・孤立対策推進法に関する次の記述のうち，最も適切なものを1 つ選びなさい。","options":["孤独・孤立の状態が，青年期と高齢期に生じやすく，その状況も深刻であることに鑑み，若者と高齢者の孤独・孤立対策を重点的に講じる。","自ら望んで孤独・孤立の状態にある者とそうでない者とを区別し，前者については孤独・孤立対策の対象とはしない。","孤独・孤立の状態やその要因が多様であることに鑑み，孤独・孤立の状態にある者や，その家族等にも状況に応じた支援を行う。","本法の基本理念の実現に向けて，「当事者等への支援を行う者」と「地域住民」の両者が相互に連携を図りながら協力するよう努めるものと規定されている。","孤独・孤立対策に関する施策に関し，国と地方公共団体との調整を目的として，孤独・孤立対策地域協議会を設置する。"],"answer":[3],"explanation":"孤独・孤立の状況は多様です。当事者だけでなく家族等にも、状況に応じた支援を行います。","subject":3},{"id":22,"question":"日本における自助・共助・公助等に関する次の記述のうち，適切なものを2 つ選びなさい。","options":["新経済社会7 ヵ年計画（1979 年（昭和54 年））は，自助努力や家庭及び社会の連帯の限界を踏まえ，公的福祉を最大限に拡充するとした。","21 世紀福祉ビジョン（1994 年（平成6 年））は，地域社会を中心とする自助，社会保障による共助，企業による商助とが適切に組み合わされた重層的な福祉構造を実現するとした。","社会保障の在り方に関する懇談会の最終報告書（2006 年（平成18 年））は，自助を基本に，共助が補完し，これらでは対応できない状況に公助で対応するとした。","「地域包括ケア研究会報告書」（2009 年（平成21 年））は，介護保険制度を含む社会保険と社会福祉の2 分野を公助の仕組みに位置づけた。","社会保障制度改革推進法（2012 年（平成24 年））は，自助，共助及び公助が最も適切に組み合わされるよう留意しつつ，国民が自立した生活を営むことができるよう，家族相互及び国民相互の助け合いの仕組みを通じてその実現を支援していくとした。"],"answer":[3,5],"explanation":"2006年の報告は自助・共助・公助の関係を整理しました。2012年の法律も適切な組合せを掲げています。","subject":3,"note":" 「地域包括ケア研究会報告書」とは，平成20 年度老人保健健康増進等事業「地域包括ケア研究会報告書〜今後の検討のための論点整理〜」（2009 年（平成21 年）5月22 日）のことである。"},{"id":23,"question":"「ロッシ（Rossi, P.H.）ら」による福祉サービスのプログラム評価における「成果」（アウトカム）の例として，次のうち，最も適切なものを1 つ選びなさい。","options":["サービスの利用者数","サービスの費用対効果","サービスの実施計画と実施された内容との適合性","サービスを受けた人々の生活の質（ＱＯＬ）の向上","サービスの予算額"],"answer":[4],"explanation":"アウトカムは支援によって生じた成果です。利用者のQOL向上が該当し、利用者数はアウトプットです。","subject":3,"note":" 「ロッシ（Rossi, P.H.）ら」とは，ロッシ（Rossi, P.H.），フリーマン（Freeman,H.E.），リプセィ（Lipsey, M.W.）のことである。"},{"id":24,"question":"1990 年（平成2 年）の「福祉関係八法改正」に関する次の記述のうち，適切なものを2 つ選びなさい。","options":["地域において必要な福祉サービスを総合的に提供されるように，社会福祉を目的とする事業の広範かつ計画的な実施に努めなければならないとされた。","地域福祉の推進に努める観点から，市町村地域福祉計画と都道府県地域福祉支援計画を策定することとされた。","市町村は，老人保健福祉計画，障害者計画，地方版エンゼルプラン（児童育成計画）をそれぞれ策定することとされた。","国，地方公共団体，社会福祉事業を経営する者は，社会福祉を目的とする事業の実施にあたり，地域に即した創意と工夫を行うこととされた。","社会福祉を目的とする事業を経営する者は，福祉サービスの利用者の意向を十分に尊重することとされた。"],"answer":[1,4],"explanation":"1990年の改正では、地域での福祉事業の広範・計画的実施と、地域に即した創意工夫が示されました。","subject":3,"note":" 「福祉関係八法改正」とは，「老人福祉法等の一部を改正する法律」のことである。"},{"id":25,"question":"社会的包摂（ソーシャル・インクルージョン）に関する次の記述のうち，適切なものを2 つ選びなさい。","options":["1999 年（平成11 年）の国際労働機関（ＩＬＯ）総会において，「社会的包摂」の実現がＩＬＯの活動の主要な目標として位置づけられた。","「1995 年（平成7 年）の社会保障制度審議会勧告」において，社会保障推進の原則の一つとして「包摂性」という概念が用いられた。","日本政府が掲げる「持続可能な開発目標（ＳＤＧｓ）実施指針」の主要原則の一つに，「包摂性」がある。","セン（Sen, A.）が行った，与えられた財を活用する能力に注目する福祉の測定方法は「社会的包摂アプローチ」と呼ばれる。","欧州連合（ＥＵ）の「リスボン条約（2007）」を基盤とした「統合版（2008）」では，社会政策の章において，社会的排除との闘いを掲げている。"],"answer":[3,5],"explanation":"SDGs実施指針は包摂性を重視します。EUの条約でも社会的排除への対処を掲げています。","subject":3,"note":"1 「1995 年（平成7 年）の社会保障制度審議会勧告」とは，総理府社会保障制度審議会「社会保障体制の再構築（勧告）〜安心して暮らせる21 世紀の社会をめざして〜」（1995 年（平成7 年）7 月4 日）のことである。2 「持続可能な開発目標（ＳＤＧｓ）実施指針」とは，内閣の持続可能な開発目標（ＳＤＧｓ）推進本部が2016 年（平成28 年）12 月22 日に決定した同名の文書のことである。3 「リスボン条約（2007）」とは，2007 年の「欧州連合条約及び欧州共同体設立条約を修正するリスボン条約」のことである。4 「統合版（2008）」とは，2008 年の「欧州連合条約と欧州連合の機能に関する条約の統合版」のことである。"},{"id":26,"question":"労働者協同組合法による組合に関する次の記述のうち，最も適切なものを1 つ選びなさい。","options":["地域における多様な労働需要に応じるための労働者派遣事業が実施できる。","議決権は出資額に応じて付与される。","総組合員の5 分の4 以上の数の組合員は，組合の行う事業に従事しなければならない。","設立には主たる所在地の都道府県による許認可が必要である。","組合と組合員との間の労働契約の締結は免除される。"],"answer":[3],"explanation":"労働者協同組合では、総組合員の5分の4以上が事業に従事します。議決権は原則1人1票です。","subject":3},{"id":27,"question":"国際人権規約に関する次の記述のうち，適切なものを2 つ選びなさい。","options":["国際人権規約は，その前文で「すべての人民とすべての国とが達成すべき共通の基準」であると位置づけている。","日本は，「自由権規約」への違反に関し，個人や集団が自由権規約人権委員会に通報できることを規定した「選択議定書」を批准している。","日本は，「社会権規約」のうち，公務員のストライキ権等の一部の規定については，これに拘束されない権利を留保している。","日本は，「社会権規約」のうち，中等教育及び高等教育における無償教育の漸進的な導入に関する規定に拘束されている。","「社会権規約」は，障害者に合理的配慮が提供されることを確保されるための適切な措置をとることを締約国に求めている。"],"answer":[3,4],"explanation":"日本は社会権規約の一部を留保していますが、中等・高等教育の無償化に関する留保は撤回しています。","subject":3,"note":"1 「自由権規約」とは，国際人権規約の「市民的及び政治的権利に関する国際規約」（いわゆる「Ｂ規約」）のことである。2 「社会権規約」とは，国際人権規約の「経済的，社会的及び文化的権利に関する国際規約」（いわゆる「Ａ規約」）のことである。3 「選択議定書」とは，国際人権規約の「市民的及び政治的権利に関する国際規約の選択議定書」（第一選択議定書）のことである。"},{"id":28,"question":"次の記述のうち，「社会保障と税の一体改革」において実施された一連の施策として，適切なものを2 つ選びなさい。","options":["厚生年金保険の給付費に係る国庫負担が，3 分の1 から2 分の1 に恒久的に引き上げられた。","子ども手当制度が創設され，それに伴い児童手当制度が廃止された。","公的医療保険のうち被用者の医療保険が，健康保険に一元化された。","遺族基礎年金の支給対象が父子家庭に拡大された。","市町村とともに都道府県も国民健康保険の保険者となった。"],"answer":[4,5],"explanation":"一体改革では、遺族基礎年金の父子家庭への拡大や、国民健康保険への都道府県の参画が進められました。","subject":4,"note":" 「社会保障と税の一体改革」とは，「社会保障・税一体改革大綱」（平成24 年2 月17 日閣議決定）の方針に基づき，「社会保障制度改革推進法」（平成24 年8 月22日）を含む「社会保障・税一体改革関連法」等により進められた一連の改革のことである。"},{"id":29,"question":"「令和5 年度社会保障費用統計」（国立社会保障・人口問題研究所）による2023 年度（令和5 年度）の社会保障給付費に関する次の記述のうち，正しいものを1つ選びなさい。","options":["総額は，前年度より増えている。","対国内総生産比は，40 ％を超えている。","部門別（「医療」，「年金」，「福祉その他」）の構成割合をみると，最も大きな割合を占めるのは「医療」である。","機能別（「高齢」，「保健医療」，「家族」，「失業」など）の構成割合をみると，「家族」の割合は1 割に満たない。","総額は，2023 年度（令和5 年度）の国の一般会計歳出予算の総額よりも小さい。"],"answer":[4],"explanation":"2023年度の社会保障給付費では、機能別の「家族」の割合は1割未満です。部門別では年金が最大です。","subject":4},{"id":30,"question":"社会保険の保険料に関する次の記述のうち，最も適切なものを1 つ選びなさい。","options":["労働者災害補償保険の保険料は，特別加入者については全額が免除となる。","雇用保険の保険料率は，事業主の負担分の方が労働者の負担分よりも大きい。","生活保護受給者による介護保険の保険料負担分は，介護扶助に加算される。","協会けんぽ（全国健康保険協会管掌健康保険）の保険料率は全国一律に設定されている。","介護休業期間中は，厚生年金保険の保険料負担が労使ともに免除される。"],"answer":[2],"explanation":"雇用保険は事業主の負担割合が労働者より大きく、雇用保険二事業分は事業主のみが負担します。","subject":4},{"id":31,"question":"労働保険の適用に関する次の記述のうち，最も適切なものを1 つ選びなさい。","options":["労働者のうち昼間学生には，労働者災害補償保険が適用されない。","派遣労働者については，派遣先が労働者災害補償保険の適用事業となる。","事業主が労災保険料を滞納する間は，労働者災害補償保険の給付は行われない。","雇用保険が適用される被保険者の年齢には，上限が設けられていない。","従業員を使用しない個人事業主は，雇用保険の被保険者となる。"],"answer":[4],"explanation":"雇用保険の適用に年齢の上限はありません。高齢の労働者も要件を満たせば対象です。","subject":4},{"id":32,"question":"日本の公的医療保険の給付に関する次の記述のうち，最も適切なものを1つ選びなさい。","options":["海外旅行中の傷病で現地の医療機関で受診した場合，特別療養費が支給される。","高額療養費の自己負担限度額は，被保険者の所得などに応じて設定されている。","傷病手当金は，被扶養者の人数に応じて加算される。","出産手当金は，被扶養者が出産したときに支給される。","健康保険において，出産育児一時金と家族出産育児一時金とは支給額が異なる。"],"answer":[2],"explanation":"高額療養費の自己負担限度額は、年齢や所得区分などによって異なります。","subject":4},{"id":33,"question":"事例を読んで，社会保険の保険料に関する次の記述のうち，最も適切なものを1 つ選びなさい。\n\n〔事例〕\nＡさん（21 歳，学生）は，両親であるＢさん（50 歳）とＣさん（52 歳）と3 人で暮らしている。Ａさんはアルバイトとして働いている。Ｂさんは，民間企業の正社員として働いており厚生年金保険の被保険者である。Ｃさんは就労経験がなく，Ｂさんの収入で生活しているので，申告書を提出している。","options":["Ｂさんの年収によっては，Ａさんは国民年金保険料の学生納付特例制度を利用できない。","Ｂさんは，国民年金保険料と厚生年金保険料の両方を納付する必要がある。","Ｂさんの介護保険料は，健康保険の保険料と一体的に徴収されている。","Ｃさんは，自ら介護保険料を納付する必要がある。","Ｃさんは，国民健康保険の保険料（税）を納付する必要がある。"],"answer":[3],"explanation":"40～64歳の医療保険加入者の介護保険料は、医療保険料と一体的に徴収されます。","subject":4},{"id":34,"question":"2000 年（平成12 年）以降の公的年金の制度改正に関する次の記述のうち，最も適切なものを1 つ選びなさい。","options":["20 歳以上の学生を国民年金の強制加入とした。","国民年金に障害基礎年金制度が創設された。","厚生年金保険において，離婚時の年金分割制度を導入した。","年金額の改定の仕組みとして，物価スライド制を導入した。","国民年金に第3 号被保険者を設けた。"],"answer":[3],"explanation":"厚生年金の離婚時年金分割は2000年以降の制度改正です。合意分割は2007年に始まりました。","subject":4},{"id":35,"question":"事例を読んで，労働保険の給付等に関する次の記述のうち，最も適切なものを1 つ選びなさい。\n\n〔事例〕\nＡさん（35 歳）は，職場で嫌がらせを受けたことで適応障害を生じ，業務災害の認定を受けた。労災病院で治療を受けながら就業を続けていたが，嫌がらせが止まないため15 年間勤続した会社を退職した。次の仕事を探す気がなかなか起きなかったが，無収入の状態が続くことに不安を感じ，雇用保険被保険者離職票を持って公共職業安定所（ハローワーク）に赴き，職業紹介を受けることにした。","options":["Ａさんの療養補償給付については，療養の費用が支給される。","Ａさんが退職したことによって，療養補償給付の受給権は消滅する。","Ａさんに適用される基本手当の所定給付日数に，離職理由は関係しない。","Ａさんは，求職の申込みをしなくても基本手当の支給を受けることができる。","Ａさんが，正当な理由なく紹介された職業に就くことを拒むと，基本手当は1 か月間支給されない。"],"answer":[5],"explanation":"正当な理由なく紹介された職業への就職を拒むと、基本手当は1か月間支給されません。","subject":4},{"id":36,"question":"事例を読んで，Ａさんの家族に適用される社会保障制度に関する次の記述のうち，最も適切なものを1 つ選びなさい。\n\n〔事例〕\n5 年前に夫と死別したＡさん（40 歳）は，遺族基礎年金を受給しながら中学生の子どもＢさんと2 人で暮らしていたが，会社員のＣさんと再婚し3 人で一緒に暮らすようになった。Ｃさんは健康保険組合の被保険者である。ＡさんとＢさんはＣさんに生計を維持されるようになったが，ＣさんとＢさんは養子縁組をする予定はない。","options":["再婚前に，Ａさんは児童扶養手当の支給を受けることができた。","再婚前に，Ａさんは寡婦年金の支給を受けることができた。","再婚後も，Ａさんは引き続き遺族基礎年金の支給を受けることができる。","再婚後は，ＡさんとＢさんはＣさんの健康保険の被扶養者になることができる。","再婚後は，ＡさんではなくＣさんが児童手当の支給を受けることになる。"],"answer":[4],"explanation":"再婚後、収入・生計維持などの要件を満たせば、配偶者と子は健康保険の被扶養者になれます。","subject":4},{"id":37,"question":"民法の婚姻にかかる規定及び解釈に関する次の記述のうち，最も適切なものを1 つ選びなさい。","options":["未成年者は，親権者の同意がなければ婚姻できない。","成年被後見人は，成年後見人の同意がなければ婚姻できない。","夫婦は同居しなければならない。","離婚は裁判によらなければならない。","内縁の夫婦が内縁関係を解消する場合，財産分与を請求することはできない。"],"answer":[3],"explanation":"民法は夫婦の同居・協力・扶助の義務を定めています。婚姻に成年後見人の同意は不要です。","subject":5},{"id":38,"question":"事例を読んで，次のうち，事件当時にＡさんに備わっていたか否かが問われる能力として，最も適切なものを1 つ選びなさい。\n\n〔事例〕\nＡさん（15 歳）は，口論の末，Ｂさんを殴ってしまい，Ｂさんにけがを負わせてしまった。Ｂさんは，Ａさんに対し，治療費を請求することを考えている。","options":["行為能力","事理弁識能力","意思能力","権利能力","責任能力"],"answer":[5],"explanation":"不法行為について責任を負うかを判断する際に問われるのが責任能力です。","subject":5},{"id":39,"question":"次のうち，介護保険制度において行政行為に当たるものとして，正しいものを1 つ選びなさい。","options":["行政直営の地域包括支援センター職員による介護保険制度に関する教示","行政直営の地域包括支援センター職員による介護予防ケアプランの作成","指定介護サービス事業者に対する改善勧告","介護保険審査会への審査請求","市町村による要介護認定"],"answer":[5],"explanation":"要介護認定は、市町村が公権力に基づいて行う行政行為です。相談や勧告とは区別します。","subject":5},{"id":40,"question":"事例におけるＡさんとＢさんの会話を読んで，〔甲〕に入る文章として，次のうち，最も適切なものを1 つ選びなさい。\n\n〔事例〕\nＡさん 「私は，将来に備えて，任意後見制度の利用を検討しているんだ」Ｂさん 「それはいいことだね。任意後見制度は〔甲〕と聞いているよ」Ａさん 「それは安心だね」","options":["いつでも任意後見契約の効力を生じさせることができる","家庭裁判所が任意後見人を選任する","任意後見人が家庭裁判所から直接監督を受ける","本人が希望すれば，公正証書で任意後見契約を締結することもできる","任意後見契約の効力が生じる場合には必ず任意後見監督人が選任される"],"answer":[5],"explanation":"任意後見契約は、公正証書で締結し、家庭裁判所が任意後見監督人を選任した時に効力が生じます。","subject":5},{"id":41,"question":"次のうち，「成年後見関係事件の概況（令和6 年1 月〜12 月）」（最高裁判所事務総局家庭局）に示された「成年後見関係事件」の申立人のうち最も多い者として，正しいものを1 つ選びなさい。","options":["市区町村長","本人","本人の子","本人の兄弟姉妹","本人の任意後見人"],"answer":[1],"explanation":"設問の令和6年の統計では、成年後見関係事件の申立人で最も多いのは市区町村長です。","subject":5,"note":" 「成年後見関係事件」とは，後見開始，保佐開始，補助開始及び任意後見監督人選任事件のことである。"},{"id":42,"question":"事例を読んで，Ａさんの日常生活自立支援事業の利用に関する次の記述のうち，最も適切なものを1 つ選びなさい。\n\n〔事例〕\n有料老人ホームで暮らす軽度の認知症のあるＡさん（80 歳代）は，最近，自ら金銭管理をすることが困難となってきた。有料老人ホームの職員の助言により，Ａさんは社会福祉協議会が実施する日常生活自立支援事業の利用を検討している。","options":["Ａさんの判断能力の確認には，医師の鑑定書が不可欠である。","Ａさんの本事業における支援計画は，社会福祉協議会の生活支援員が作成する。","Ａさんの本事業における支援計画に基づく日常的金銭管理は，有料老人ホームの職員に委託できる。","Ａさん本人からの申出がなければ，本事業の支援計画を見直すことはできない。","Ａさんに対する本事業における支援は，Ａさん本人から代理権を授与されたうえで，代理による援助を行うことができる。"],"answer":[5],"explanation":"日常生活自立支援事業では、本人から代理権を授与されて代理による援助を行うこともできます。","subject":5},{"id":43,"question":"国内外のセツルメントの歴史に関する次の記述のうち，適切なものを2 つ選びなさい。","options":["バーネット（Barnett, S.）がトインビー・ホール（ロンドン）を設立した当初，主に活動したのは外部から移り住んだ大学の卒業生達であった。","アダムス（Addams, J.）がハル・ハウス（シカゴ）を設立した当初，ヨーロッパからの移民が集住する地域で学習機会提供を含む様々な支援活動が展開された。","岡山博愛会は，社会階層の高い住民の割合が大きい地域の中で，排除された人々が気軽に立ち寄り交流する場を提供した。","キングスレー館は，1924 年（大正13 年）の関東大震災を契機として，東京帝国大学セツルメントの関係者によって設立された。","我が国の隣保事業は，明治後期に同和対策事業として，政府による公設セツルメントとして始まった。"],"answer":[1,2],"explanation":"トインビー・ホールでは大学卒業生等が住み込み、ハル・ハウスでは移民への教育・生活支援を行いました。","subject":6},{"id":44,"question":"地域福祉の動向に関する次の記述のうち，正しいものを1 つ選びなさい。","options":["2023 年（令和5 年）施行の「改正個人情報保護法」では，多機関連携を推進するため，地方公共団体ごとに個人情報保護条例を制定し，情報共有ルールを明確にすることが規定された。","2024 年（令和6 年）の「民生委員・児童委員の選任要件に関する検討会」により，居住要件が撤廃されることになった。","2024 年（令和6 年）に改訂された「農福連携等推進ビジョン」では，障害者の就労に特化した福祉農園の普及・拡大を提言した。","2025 年（令和7 年）に公表された「2040 年に向けたサービス提供体制等のあり方に関するとりまとめ」では，中山間・人口減少地域での高齢者の集住促進を提言した。","2025 年（令和7 年）に公表された「『地域共生社会の在り方検討会議』中間とりまとめ」では，身寄りのない高齢者に対する死後事務支援などを提供することができる事業を社会福祉事業として位置づけることとした。"],"answer":[5],"explanation":"2025年の中間とりまとめは、身寄りのない高齢者等への死後事務を含む支援の制度化を示しています。","subject":6,"note":" 「改正個人情報保護法」とは，2021 年（令和3 年）に改正された「個人情報の保護に関する法律」のことである。"},{"id":45,"question":"地域社会に関する次の記述のうち，最も適切なものを1 つ選びなさい。","options":["中山間地域とは，住宅地と山間地の中間地域のことである。","限界集落とは，75 歳以上の人口が50 ％以上の地域のことである。","消滅可能性自治体とは，2010 年（平成22 年）から30 年間に0 歳から17 歳の児童が半数以下に減少する自治体のことである。","公共交通の空白地域とは，過疎地域において，一定の距離の範囲内に駅やバス停がない地域のことである。","食料品アクセス困難人口とは，店舗まで500 m 以上かつ自動車の利用が困難な65 歳以上の高齢者の人口のことである。"],"answer":[5],"explanation":"食料品アクセス困難人口は、店舗から500m以上離れ、自動車利用が困難な65歳以上の人口です。","subject":6},{"id":46,"question":"事例を読んで，多文化共生ソーシャルワークの実践を進めるためにＡコミュニティソーシャルワーカー（社会福祉士）が日本における外国人を取り巻く制度や動向について調べたことのうち，最も適切なものを1 つ選びなさい。\n\n〔事例〕\nＢ国出身のＣさん（23 歳，男性）は，農業関係の第1 号技能実習生として半年前から日本で働いている。ある時，Ｄ市社会福祉協議会のフードパントリーにＣさんが食べ物をもらいたいと来所し，Ａが話を聴いたところ，今までの時間外労働の賃金が支払われておらず，困っているということだった。Ａは，Ｃさんの了解を得て労働局の総合労働相談窓口に同行して支援を行うとともに，多文化共生に向けたソーシャルワーク実践として，地域住民が技能実習生を取り巻く制度や動向について知ることができる勉強会を開催することとし，調査した。","options":["実習実施者に対する監督指導における主な違反事項（2023 年（令和5 年））として最も多かったのは，賃金の支払である。","第1 号技能実習生には，労働基準法が適用されない。","技能実習生の国籍別構成（2023 年度（令和5 年度））で最も多い国籍はインドネシアである。","特定技能の在留資格をもつ者は，所属機関との契約を期間途中で解除し，異なる機関と新たな雇用契約を結ぶことができない。","今後，技能実習制度は育成就労制度へ移行することになっている。"],"answer":[5],"explanation":"技能実習制度は育成就労制度へ移行することになっています。技能実習生にも労働基準法は適用されます。","subject":6},{"id":47,"question":"事例を読んで，次の記述のうち，Ａ自治体職員の対応として，適切なものを2 つ選びなさい。\n\n〔事例〕\nＡは，住民に対するニーズ調査から災害時の福祉支援の必要性が浮き彫りになったことから，災害時の福祉支援体制を強化するために，従来，バラバラであった周辺の自治体との連携の強化を含め，現在の重層的支援体制整備事業の実施体制を見直すこととした。","options":["災害対策会議と重層的支援会議のメンバーが重複するため，時間を切り分けて同日に実施することとした。","災害時における避難行動要支援者への福祉支援を強化するため，アウトリーチ等を通じた継続的支援事業を発災時に実施する仕組みに変更した。","災害に備えて，福祉支援の必要性が高いケースに関しては，速やかに諮るため，支援会議を随時開催とし，定例開催と同様に本人同意がなくても行うこととした。","重層的支援体制整備事業実施計画は，各種福祉計画の上位計画であるため，自治体の地域防災計画の内容を含めて，見直すことにした。","災害対策は広域的な対応が重要であるため，重層的支援体制整備事業の実施主体を複数の市町村で構成される広域連合に変更することとした。"],"answer":[1,3],"explanation":"会議の日程調整は可能です。社会福祉法の支援会議では、守秘義務の下、本人同意がなくても情報共有できます。","subject":6},{"id":48,"question":"生活困窮者自立支援法に関する次の記述のうち，正しいものを2 つ選びなさい。","options":["生活困窮者に対する自立の支援は，生活困窮者の資産及び収入の状況，健康状態，地域社会からの孤立の状況に応じて，包括的かつ早期に行わなければならないとしている。","生活困窮者家計改善支援事業は，被保護者を対象とすることはできないとしている。","福祉事務所設置自治体は，居住支援法人が行う業務や関連施策との連携を図るよう努めるものとしている。","福祉事務所設置自治体は，生活困窮者就労準備支援事業を実施しなければならないとしている。","福祉事務所設置自治体は，支援会議の開催，地域住民相互の交流を行う拠点との連携や訪問等により，生活困窮者の状況を把握するよう努めるものとしている。"],"answer":[3,5],"explanation":"居住支援法人等との連携と、訪問や支援会議などを通じた生活困窮者の把握が努力義務とされています。","subject":6},{"id":49,"question":"地域福祉における支援・配慮を要する者に関する次の記述のうち，正しいものを1 つ選びなさい。","options":["子ども・若者育成支援推進法に基づくヤングケアラーとは，家族の介護その他の日常生活上の世話を過度に行っていると認められる18 歳未満の者をいう。","「困難女性支援法」における困難な問題を抱える女性とは，犯罪等により害を被った女性及びその家族又は遺族をいう。","「住宅セーフティネット法」における住宅確保要配慮者とは，生活困窮者自立支援制度による住居確保給付金の支給対象にならない者をいう。","災害対策基本法における避難行動要支援者とは，都道府県が作成する避難行動要支援者名簿への登載を希望する者をいう。","「ひきこもり支援ハンドブック」におけるひきこもり支援対象者とは，社会的に孤立し，孤独を感じている状態にある人や，様々な生きづらさを抱えている状態の人をいう。"],"answer":[5],"explanation":"2025年のハンドブックは、孤立や孤独、様々な生きづらさを抱えた人を幅広く支援対象と捉えています。","subject":6,"note":"1 「困難女性支援法」とは，「困難な問題を抱える女性への支援に関する法律」のことである。2 「住宅セーフティネット法」とは，「住宅確保要配慮者に対する賃貸住宅の供給の促進に関する法律」のことである。3 「ひきこもり支援ハンドブック」とは，厚生労働省社会福祉推進事業「ひきこもり支援にかかる支援マニュアルの策定に向けた調査研究事業」の成果物であり，2025 年（令和7 年）に発出された「ひきこもり支援ハンドブック〜寄り添うための羅針盤〜」のことである。"},{"id":50,"question":"事例を読んで，次のうち，総合相談窓口のＡ相談員（社会福祉士）が他機関とともに地域生活支援を検討するために，考えられる会議体として，適切なものを2 つ選びなさい。\n\n〔事例〕\nＢ市では，総合相談窓口を行政直営で運営している。ある時，地域住民から総合相談窓口に対して，近所の家が庭にごみを溜めており，異臭がするので撤去してほしいという相談が入った。Ａが当該地区の民生委員に連絡すると，以前は高齢の母親と60 歳代前半の息子Ｃさんが暮らしていたが，去年，母親が認知症グループホームに入居してからは訪問する機会がなかったとのことだった。Ｃさんについては，子どもの頃は養護学校に通っていたらしいが，詳しくはわからず，またＣさんには妹がおり，母親の入居手続きを行う際，Ｃさんには一切関わりたくないと言っていたことが分かった。そこでＡは，Ｃさん宅を訪問し，最初は会うこともできなかったが，次第に言葉を交わすようになり，ごみを片付けたいが体調が悪くお金もないので悩んでいることが分かり，Ｃさんの同意は得られていないが，関係者による情報共有や支援体制構築に向けた会議の開催を検討することとした。","options":["行政相談委員法に基づく行政相談懇談会","生活困窮者自立支援法に基づく支援会議","「障害者総合支援法」に基づく地域連携推進会議","社会福祉法に基づく支援会議","社会福祉法に基づく重層的支援会議"],"answer":[2,4],"explanation":"生活困窮者自立支援法と社会福祉法の「支援会議」は、守秘義務により本人同意前の情報共有にも対応します。","subject":6,"note":" 「障害者総合支援法」とは，「障害者の日常生活及び社会生活を総合的に支援するための法律」のことである。"},{"id":51,"question":"事例を読んで，次のうち，Ａ市の地域包括支援センターのＢ社会福祉士が連携すべき相手として，適切なものを2 つ選びなさい。\n\n〔事例〕\nＢは，民生委員から一人暮らしのＣさん（70 歳，男性）に関する相談を受けた。Ｃさんに結婚歴はなく，65 歳の時にＡ市に転入し，警備会社で働いていたが，69歳の時に脳梗塞を発症して退職し，老齢厚生年金で生活している。右半身に不全感が残っており，文字を書くことに不自由さがあるが，生活に支障はない。先日，民生委員が高齢者実態調査のために訪問した際，Ｃさんが住む民間賃貸住宅は以前から建て替えをすることが決まっており，立ち退きを求められていたが，周辺地域の家賃が高騰しており，引っ越し手続きや保証人等をどうしたらよいか分からないとの相談があった。","options":["居住支援法人の担当者","生活支援体制整備事業の担当者","消費生活センターの担当者","日常生活自立支援事業の担当者","生活困窮者住居確保給付金の担当者"],"answer":[1,5],"explanation":"住まいの確保には居住支援法人や住居確保給付金の担当者と連携し、住宅・家賃面の支援を検討します。","subject":6},{"id":52,"question":"障害者福祉の理念などに関する次の記述のうち，最も適切なものを1 つ選びなさい。","options":["バンク－ミケルセン（Bank-Mikkelsen, N.）は，ノーマライゼーションの理念に適合しているか否かの観点から，福祉サービスの質を評価する手段として「ＰＡＳＳ」を開発した。","ヴォルフェンスベルガー（Wolfensberger, W.）は，デンマークにおいてノーマライゼーションの理念に基づく知的障害者福祉法の制定に尽力した。","ニィリエ（Nirje, B.）は，知的障害者に一日のノーマルなリズムを提供する観点から，ノーマライゼーションの8 つの原則を示した。","ソロモン（Solomon, B.）は，カリフォルニアでの身体障害者の自立生活運動のリーダーとなり，障害者の生活に大きな影響を与えた。","ロバーツ（Roberts, E.）は，カナダで生まれたセルフアドボカシー団体であるピープルファーストの活動に尽力した。"],"answer":[3],"explanation":"ニィリエはノーマライゼーションを、一日・一週・一年の生活リズムなど8つの原則に整理しました。","subject":7},{"id":53,"question":"障害者に関する施策の展開について，次の記述のうち，最も適切なものを1 つ選びなさい。","options":["身体障害者福祉法が制定された際（1949 年（昭和24 年））に，当該法による身体障害児を含む身体障害者に対する福祉サービスの提供が始まった。","身体障害者雇用促進法が「障害者雇用促進法」に改正，改称された際（1987 年（昭和62 年））に，知的障害者が法定雇用率の算定基礎に追加された。","心身障害者対策基本法が障害者基本法に改正，改称された際（1993 年（平成5年））に，精神障害には発達障害が含まれることが明確にされた。","精神保健法が「精神保健福祉法」に改正，改称された際（1995 年（平成7 年））に，精神障害者保健福祉手帳の制度が法定された。","障害者自立支援法が「障害者総合支援法」に改正，改称された際（2012 年（平成24年））に，身体，知的，精神の3 障害に共通の自立支援給付の制度が創設された。"],"answer":[4],"explanation":"1995年の精神保健福祉法への改正で、精神障害者保健福祉手帳制度が設けられました。","subject":7,"note":"1 「障害者雇用促進法」とは，「障害者の雇用の促進等に関する法律」のことである。2 「精神保健福祉法」とは，「精神保健及び精神障害者福祉に関する法律」のことである。3 「障害者総合支援法」とは，「障害者の日常生活及び社会生活を総合的に支援するための法律」のことである。"},{"id":54,"question":"「医療的ケア児支援法」に関する次の記述のうち，適切なものを2 つ選びなさい。","options":["この法律の目的には，医療的ケア児の健やかな成長とその家族の離職の防止が含まれている。","この法律における医療的ケア児とは，恒常的に医療的ケアを受けることが不可欠である者のうち，15 歳未満の児童をいう。","この法律における医療的ケア児にかかる医療費については，この法律に基づき公費による負担が行われる。","この法律において，保育所・学校の設置者は，保育所・学校において医療的ケア児が専門的なケア等を受けられるように，保護者の付き添いを求めないことと規定している。","医療的ケア児支援センターは，医療，保健，福祉，教育，労働等に関する業務に従事する者に対し，医療的ケアについての情報の提供及び研修を行う。"],"answer":[1,5],"explanation":"医療的ケア児支援法は家族の離職防止も目的とし、支援センターは関係職種への情報提供・研修も行います。","subject":7,"note":" 「医療的ケア児支援法」とは，「医療的ケア児及びその家族に対する支援に関する法律」のことである。"},{"id":55,"question":"「障害者虐待防止法」に関する次の記述のうち，最も適切なものを1 つ選びなさい。","options":["この法律において，障害者虐待は，障害者福祉施設従事者による障害者虐待及び使用者による障害者虐待の2 つをいう。","この法律の対象となる障害者は，身体障害者，知的障害者，精神障害者（発達障害者を含む）であって，障害者手帳を保持している者と定めている。","この法律において，精神科病院の業務従事者は，障害者福祉施設従事者に含まれるものとされている。","この法律において，使用者は，障害者を雇用する事業主をいい，事業の経営担当者等はこれに含まれないものとされている。","この法律において，使用者による障害者虐待には，雇用されている障害者に対する他の従業員の差別的言動を使用者が放置することも含まれる。"],"answer":[5],"explanation":"使用者が他の従業員による差別的言動を放置することも、使用者による障害者虐待に含まれます。","subject":7,"note":" 「障害者虐待防止法」とは，「障害者虐待の防止，障害者の養護者に対する支援等に関する法律」のことである。"},{"id":56,"question":"視覚障害のあるＡさんは，出張に際して用務地に近いホテルを予約した。用務が終わり，ホテルにチェックインしようとしたところ，チェックインは，備え付けのタブレット端末で行うよう言われた。しかし，視覚障害のあるＡさんは，タッチパネル式のタブレット端末を利用することができずに困ってしまった。次の記述のうち，視覚障害者がホテルを利用できるよう，予めの準備も含め，ホテルが法令に基づき行うことが求められる対応として，適切なものを2 つ選びなさい。","options":["ホテルが導入したタッチパネル式のチェックインシステムは，「障害者情報アクセシビリティ・コミュニケーション施策推進法」が求めるユニバーサルなシステムに合致しないので，撤去する。","「バリアフリー法」に基づき定められた建築物移動等円滑化基準に従い，視覚障害者が使用できる点字ディスプレイを用いたチェックインシステムを導入する。","タブレット端末でのチェックイン以外のチェックイン方法を合理的配慮の提供として利用できるようにしておく。","タッチパネル式のチェックインシステムを利用できない者に対しては，その旨の事前連絡を必須として求める。","視覚障害を含む障害のある利用者への適切なサービス提供のために，従業員向けの研修に努める。"],"answer":[3,5],"explanation":"端末を使えない人には代替手段を用意するなどの合理的配慮を行い、従業員研修にも努めます。","subject":7,"note":"1 「障害者情報アクセシビリティ・コミュニケーション施策推進法」とは，「障害者による情報の取得及び利用並びに意思疎通に係る施策の推進に関する法律」のことである。2 「バリアフリー法」とは，「高齢者，障害者等の移動等の円滑化の促進に関する法律」のことである。"},{"id":57,"question":"事例を読んで，次のうち，Ｂ市のＣ担当者（社会福祉士）がＤさんに利用を助言する機関又は事業所として，最も適切なものを1 つ選びなさい。\n\n〔事例〕\nＤさんは，軽度知的障害のある男性で，療育手帳を所持している。特別支援学校を卒業してすぐに障害者雇用に理解のある地元のスーパーに一般就労で就職し，3か月が経過したが，最近仕事を休んだり，遅刻したりすることが増えている。Ｄさんは真面目に仕事を続けたいと思っているが，慣れない環境でのストレスから，深夜までゲームに没頭して仕事に行けなくなったり，遅刻したりしてしまうことのほか，間食の摂り過ぎによって体重が増加したり，金銭管理がルーズになってしまったりなどの問題も抱え，生活面でのサポートも必要とするようになってきている。Ｄさんと二人暮らしの母親は，フルタイムで働いておりＤさんのサポートを十分にできないため，Ｂ市の相談窓口に相談した。対応したＣは，Ｄさんが利用できる機関又は事業所について助言した。","options":["公共職業安定所（ハローワーク）","地域障害者職業センター","就労定着支援事業を行う事業所","障害者就業・生活支援センター","就労継続支援Ａ型事業を行う事業所"],"answer":[4],"explanation":"障害者就業・生活支援センターは、就業面と生活面を一体的に支援する機関です。","subject":7},{"id":58,"question":"刑法上の刑罰に関する次の記述のうち，正しいものを1 つ選びなさい。","options":["付加刑として罰金，科料及び没収の3 種が定められている。","有期拘禁刑は，1 年以上20 年以下の期間と定められている。","拘禁刑は，刑事施設に拘置して所定の作業を行わせると定められている。","罰金の金額は，1 万円以上とされる。","罰金を完納することができない者は，所定の期間，協力雇用主の下での労働を義務づけられる。"],"answer":[4],"explanation":"罰金は原則1万円以上です。科料とは金額の範囲が異なります。","subject":8},{"id":59,"question":"事例を読んで，次のうち，この中間決定を表す用語として，最も適切なものを1 つ選びなさい。\n\n〔事例〕\n少年のＡさん（16 歳）は，窃盗を行ったことで家庭裁判所の審判に付された。ただ，家庭裁判所の裁判官は，最終的な判断を出す前に，Ａさんに自宅での生活を送らせながら，要保護性の変化を見ていくための中間決定を行った。そこで，3 か月間ほど，Ａさんは，家庭裁判所調査官と定期的に面接をし，また遵守事項として定められた社会奉仕活動にもきちんと参加した。最終的に，家庭裁判所の裁判官は，Ａさんの要保護性が既に十分解消されているとして，不処分決定を行った。","options":["保護処分","観護処遇","試験観察","補導援護","改善指導"],"answer":[3],"explanation":"試験観察は、最終処分の前に一定期間、少年の行動や生活状況を観察する中間的な措置です。","subject":8},{"id":60,"question":"事例を読んで，更生保護法におけるＡさんの生活環境の調整に関する次の記述のうち，最も適切なものを1 つ選びなさい。\n\n〔事例〕\n刑務所で受刑中であるＡさん（80 歳）は，生活環境の調整が進められており，釈放後は引受人の長男のもとに帰住することが決まっているが，認知症が進み介護が必要な状態になりつつある。","options":["Ａさんの生活環境の調整は，社会復帰調整官が担当している。","Ａさんは，特別調整の対象者である。","Ａさんの帰住予定地を管轄する保護観察所は，当該地域の地域生活定着支援センターに福祉サービスの調整を依頼することができる。","Ａさんの生活環境の調整を保護司が担当することはない。","Ａさんの生活環境の調整の状況は，地方検察庁に通知される。"],"answer":[3],"explanation":"保護観察所は、地域生活定着支援センターに福祉サービスの利用調整を依頼できます。","subject":8},{"id":61,"question":"更生保護の活動に関与する個人，団体等に関する次の記述のうち，適切なものを2 つ選びなさい。","options":["保護司は，非常勤の地方公務員である。","ＢＢＳ会は，青年のボランティア団体である。","更生保護女性会の活動は，犯罪をした男性や非行のある男子少年は対象としない。","協力雇用主になるには，現に保護観察対象者を雇用していなければならない。","地域生活定着支援センターは，地域生活定着促進事業に基づき，すべての都道府県に設置されている。"],"answer":[2,5],"explanation":"BBS会は青年のボランティア団体です。地域生活定着支援センターは全都道府県に設置されています。","subject":8},{"id":62,"question":"「医療観察法」及び医療観察制度に関する次の記述のうち，正しいものを1つ選びなさい。","options":["医療観察制度の対象は，病気を理由に刑の執行停止を受けて刑務所を釈放された者である。","社会復帰調整官は，地方更生保護委員会に配置される。","「医療観察法」の目的は，地域社会において刑罰を執行することにある。","「医療観察法」に基づく「入院をさせる旨の決定」は医療機関が行う。","「医療観察法」において，入院によらない医療を行う期間中は，精神保健観察に付することとされている。"],"answer":[5],"explanation":"医療観察法による通院医療の期間中は精神保健観察が行われ、保護観察所の社会復帰調整官が関わります。","subject":8,"note":" 「医療観察法」とは，「心神喪失等の状態で重大な他害行為を行った者の医療及び観察等に関する法律」のことである。"},{"id":63,"question":"事例を読んで，次のうち，Ａさんが利用できる制度として，適切なものを2 つ選びなさい。\n\n〔事例〕\nＡさん（55 歳）は，放火の被害に遭い，ケガはなかったものの自宅が全焼した。Ａさんは，加害者の受刑中の処遇状況を知りたいと考えている。また，加害者の仮釈放の審理が行われる場合には，審理する機関に対して仮釈放に対する自身の考えを伝えたいと思っている。","options":["被害者等通知制度","検察審査会に対する審査申立制度","国選被害者参加弁護士制度","被害者参加制度","意見等聴取制度"],"answer":[1,5],"explanation":"被害者等通知制度で事件等の情報を受けられます。意見等聴取制度では仮釈放等について意見を述べられます。","subject":8},{"id":64,"question":"次のうち，社会福祉士及び介護福祉士法における社会福祉士の義務等について，その違反に対し行政処分が規定されているものとして，正しいものを2 つ選びなさい。","options":["誠実義務","信用失墜行為の禁止","秘密保持義務","連携","資質向上の責務"],"answer":[2,3],"explanation":"信用失墜行為の禁止と秘密保持義務への違反には、登録取消し等の行政処分が規定されています。","subject":9},{"id":65,"question":"次の記述のうち，社会福祉士及び介護福祉士法の制定にかかる福祉関係三審議会合同企画分科会の意見具申の内容に関するものとして，適切なものを2 つ選びなさい。","options":["ボランティアの振興は不可欠なものであるが，資格の法制化が，それを阻害するものであってはならないとした。","専門職のあり方では職務の標準化より専門職化を重視し，スペシャリスト，専門職者（上級ソーシャルワーカー，中級ソーシャルワーカー），準専門職者に区分した。","社会福祉職員の量質両面での充実を図るため，公私の社会福祉専門職者を包括的に捉える専門職として社会福祉士（仮称）制度を提言し，処遇改善を図ろうとした。","社会福祉事業従事者が専門的な教育・訓練を受け，利用者に充分な処遇を行い，またそのための適切な従事者の確保と，職務にふさわしい社会的な地位と処遇の確立が急がれる，とした。","高齢化と福祉ニードへの専門的な対応，国際化と福祉専門家の養成，シルバーサービスの動向と資格制度の必要性に鑑み，法律に基づく資格制度の導入が必要であるとした。"],"answer":[1,5],"explanation":"資格の法制化はボランティア活動を妨げず、高齢化・国際化等に対応する専門家養成を進めるものとされました。","subject":9},{"id":66,"question":"事例を読んで，次のうち，Ｂ現業員（社会福祉士）の発言の背景にある理論を提唱した人物として，最も適切なものを1 つ選びなさい。\n\n〔事例〕\n福祉事務所で生活保護担当のＡ現業員（社会福祉士）は，保護受給中のＣさん（35歳）の就職活動をどう進めればよいか悩んでいる。うつ状態で半年前に退職し療養中だったが，今回の受診で主治医から軽労働可の診断が出た。「本人も速やかに再就職して経済的に自立したいと言っている」と先輩のＢに相談した。Ｂは「福祉事務所の役割や生活保護の趣旨と制度の活用をＣさんと共有し，Ｃさんが援助過程の各段階を意識しながら，仕事，収入，人間関係，療養といった問題への取り組み方を，Ｃさん自身が徐々に決めることができるよう働きかけてはどうか」と助言した。","options":["ハーン（Hearn, G.）","スモーリー（Smalley, R.）","シポリン（Siporin, M.）","ヤングハズバンド（Younghusband, E.）","ゴールドシュタイン（Goldstein, H.）"],"answer":[2],"explanation":"スモーリーの機能主義では、機関の機能と援助過程を活用し、本人の主体的な選択・成長を支えます。","subject":9},{"id":67,"question":"次の記述のうち，多文化ソーシャルワーク（Multicultural Social Work）について著したスー（Sue, D.W.）による言説として，最も適切なものを1 つ選びなさい。","options":["文化的コンピテンス（Cultural Competence）を「ソーシャルワーカーの最適な発達を最大限に促したり，そのための環境を創出する教育的能力」と捉えた。","マイクロアグレッション（Microaggression）を「不特定多数の者に対して突発的に行う，根拠なき侮蔑行為」と捉えた。","文化（Culture）を「歴史の中で，人々が，行い，信じ，大切にし，そして享受するために学んだすべてのこと」と捉えた。","バイカルチュラリズム（Biculturalism）を「二つの異なる文化圏で誕生したアメリカ社会が人々の生活を拘束していること」と捉えた。","人種／民族の曖昧さ（Racial/Ethnic Ambiguity）を「多文化社会での暮らしや雑婚により，自身の人種・民族的なアイデンティティが曖昧さの中で失われること」と捉えた。"],"answer":[3],"explanation":"スーは文化を、人々が歴史の中で学んできた行動、信念、価値、楽しみなどを含むものと捉えました。","subject":9},{"id":68,"question":"事例を読んで，次のうち，利用者の自立を支援する観点から，両親へのこの段階での応答として，適切なものを2 つ選びなさい。\n\n〔事例〕\n就労継続支援事業所のＡ生活支援員（社会福祉士）のところに，発達障害があるＢさん（19 歳）の両親が相談に訪れた。話によると，Ｂさんは他人に関心がなく，集団行動も苦手であったが，2 か月前に通所サービスの利用を始めて，他の利用者さんの話を聞いたようで「一人暮らしをしたい。みんな毎日楽しいと言っている」と羨んでいる。人付き合いが苦手なＢさんは，帰宅後は一人ゲームに没頭するなど生活がパターン化しており，「自分の身の回りのことを自分でできていないのだから難しい」と諭すと苛立ってかんしゃくを起こす。いずれは自立してほしいと思うが，通所を始めたばかりであり，どうすればよいか悩んでいるとのことであった。","options":["「一人暮らしは難しいという現実にＢさんが直面できるようにしましょう」","「Ｂさんができることや好きなこともお話していただけますか」","「現実には，Ｂさんは将来，一人で生活することは難しいと思うのですが」","「Ｂさんがかんしゃくを起こした時にはどのように対応されていますか」","「Ｂさんの生い立ちについて聞かせてもらえますか」"],"answer":[2,4],"explanation":"本人の強みや得意なことを把握し、かんしゃくへの家族の対応を確認して、具体的な支援につなげます。","subject":9},{"id":69,"question":"次のうち，「性的指向及びジェンダーアイデンティティの多様性に関する国民の理解の増進に関する法律」で事業主への努力義務に定められているものとして，適切なものを2 つ選びなさい。","options":["各事業主による取組状況の公表","就業環境に関する相談体制の整備","研修の実施","地域住民との連携","他の事業主との連携"],"answer":[2,3],"explanation":"事業主には、理解増進のための研修と、就業環境に関する相談体制の整備などの努力義務があります。","subject":9},{"id":70,"question":"事例を読んで，相談支援事業所のＢ相談支援専門員（社会福祉士）がＣさんへの再アセスメントで行うことに関する次の記述のうち，適切なものを2 つ選びなさい。\n\n〔事例〕\nＣさん（27 歳，男性）は，19 歳で統合失調症を発症し2 か月入院した。退院後は，デイケアやグループホームを活用して生活訓練を行ってきた。2 年前からは，日中は週5 日間，就労継続支援Ａ型事業所で，清掃作業とチラシの折り込み作業を行っている。現在は症状も安定し，服薬管理も問題なく，事業所の給料と年金で一人暮らしをしている。Ｃさんは，引き続き，相談支援計画を作成しているＢに「Ａ型事業所の職員を見ていて，正社員の仕事に就きたいと思うようになった」と相談してきた。","options":["ピアスタッフとしてＡ型事業所で働くことの意思の有無を確認する。","正社員での就労に向けた課題を確認する。","Ａ型事業所で働くメンバーにＣさんの転職の可能性を確認する。","正社員での就労に向けた具体的な手段と手続きを決めて，Ｃさんに確認する。","就労意欲の高まりと，現実認識の程度を確認する。"],"answer":[2,5],"explanation":"再アセスメントでは、本人の就労意欲や現実認識、希望する働き方に向けた課題を確認します。","subject":10},{"id":71,"question":"ハートマン（Hartman, A.）によって開発されたエコマップに関する次の記述のうち，適切なものを2 つ選びなさい。","options":["クライエントを含む生態系システムとその境界を可視化することができる。","介入前後の変化を確認するツールとして活用できる。","関係性を強く示す線は，破線で記すことで関係性の濃淡を視覚的に捉えられる。","クライエントの状態をいくつかの典型例に分類することで，クライエントのニーズを把握できる。","これまでの複雑な家族ダイナミクスの展開を理解することができる。"],"answer":[1,2],"explanation":"エコマップは本人・家族と周囲の資源との関係を可視化し、支援前後の変化の確認にも使えます。","subject":10},{"id":72,"question":"事例を読んで，Ａ病院の医療福祉相談室でソーシャルワーク実習中のＢが，急性硬膜下血腫と診断されたクライエントのＣさん（32 歳）とＤソーシャルワーカーの面接に同席した日の実習記録の形式として，次のうち，最も適切なものを1つ選びなさい。\n\n〔事例〕\n〈8 月31 日実習記録〉外来の看護師から「医師に入院・手術を要すると言われたＣさんがお金がないと繰り返すので，相談に乗ってほしい」と連絡があった。10 分後にＣさんが来室。建設現場での作業中に転倒し，その後，頭痛が続くので受診したという。ＣさんはＤに「金がないと治療できない。入院したら仕事もろくにできない。どうしろっていうんだ」と声を荒げた。Ｄは，深くうなずきながら傾聴し，Ｃさんの気持ちを受け止めた上で，仕事中のけがは労働者災害補償制度が適用されるなどの説明をしていた。","options":["インターライ方式","ＳＯＡＰ","過程叙述体","ＤＡＰ","要約体"],"answer":[3],"explanation":"過程叙述体は、面接でのやり取りや支援過程を具体的に記録する形式です。","subject":10},{"id":73,"question":"事例を読んで，次の記述のうち，特別養護老人ホームのＢ生活相談員（社会福祉士）が行う支援として，最も適切なものを1 つ選びなさい。\n\n〔事例〕\nＡさん（80 歳，女性，要介護4 ）は，半年前に特別養護老人ホームに入居した。脳梗塞の後遺症により左半身に麻痺があり，アルツハイマー型認知症と診断されている。1 年前に長男を亡くし，麻痺で身体が思うように動かず，長男の看病を十分にできなかったことを今でも悔やんでは涙ぐんでいる。Ａさんは若い頃は生け花の師範として活動しており，居室には作品の写真が飾ってある。ある日，ＡさんはＢに「施設の入口にお花を飾ったら華やかになるわよ。私も昔は，三ツ星ホテルのロビーに花を生けていたのよ」と話した。","options":["「それでは，職員で花を飾るようにしましょう」と答える。","長男の話を始めたときには，悲しみに暮れないように意図的に別の話題に変える。","施設内の別の余暇活動に誘い，楽しみを見つけられるよう励ます。","Ａさんに「ホテルで花を生けていた時のことを聞かせてください」と問いかける。","「入口をいつも生け花で飾るのは手間や時間がかかるので，どうしましょう」と尋ねる。"],"answer":[4],"explanation":"本人が大切にしてきた経験を聴き、強みや役割を再発見できるよう働きかけます。","subject":10},{"id":74,"question":"次の記述のうち，ボルクマン（Borkman, T.）によるセルフヘルプ・グループの「体験的知識」（Experiential Knowledge）と「専門的知識」（ProfessionalKnowledge）に関する説明として，最も適切なものを1 つ選びなさい。","options":["「専門的知識」では，理論的，標準化された方法やエビデンスよりも実践的であることに価値が置かれている。","「専門的知識」は，メンバーが行動することを通して学び，変化することで培われる。","「体験的知識」では，自分の感情的側面や自己評価が加味されている。","「専門的知識」では，“ 今，ここ” での具体的な行動と次の観察可能な結果が重視される。","「体験的知識」と「専門的知識」は，相互排他的である。"],"answer":[3],"explanation":"体験的知識は、実際の経験から得られ、本人の感情や自己評価を含みます。専門的知識とも補い合えます。","subject":10},{"id":75,"question":"事例を読んで，次の記述のうち，Ａ生活支援員（社会福祉士）が行う支援として，適切なものを2 つ選びなさい。\n\n〔事例〕\n宿泊型自立訓練施設で出会ったＢさん（26 歳，女性）とＣさん（28 歳，男性）は，ともに軽度の知的障害がある。2 年間の交際をしており，親元を離れて生活したいと思い，3 か月前からアパートで一緒に暮らし始めた。二人は結婚を考えているが，Ｂさんは「親には勝手にすればと言われた。生活費や家事の分担が心配だし，子どもが生まれたら子育てできるのか不安」，Ｃさんは「親の理解が得られない」と話している。Ｂさんの親は無関心であり，Ｃさんの親は結婚することには慎重であることから，親の狭間で二人に迷いが出てきたため，以前からかかわりのあるＡに相談に来た。","options":["親たちと本人たちの意見をいずれも尊重できるように話し合いの場をもつ。","本人たちの意思表明を支援するため，生活能力や経済状況をアセスメントし，将来設計の選択肢を整理する。","出産や子育てについて考えるのは時期尚早であるため，結婚後に改めて話しましょうと伝える。","親の支援がなくても生活や育児ができるようにサービスやサポートの調整をする。","本人たちが現実吟味をして他の選択肢を考えられるよう支援する。"],"answer":[1,2],"explanation":"本人たちの意思を中心に家族と話し合い、生活能力・経済状況を把握して将来の選択肢を整理します。","subject":10},{"id":76,"question":"次のうち，ピンカス（Pincus, A.）とミナハン（Minahan, A.）の提示した「ターゲットシステム」に該当するものとして，最も適切なものを1 つ選びなさい。","options":["変化をもたらすために働く人や機関","ソーシャルワークの支援や利益を享受する人々","目標達成に向けて協働する人々","機能不全状態にある社会制度や人々","目標を達成するために変化を必要とする人々"],"answer":[5],"explanation":"ターゲットシステムは、支援目標を達成するために変化を必要とする人々や対象です。","subject":10},{"id":77,"question":"次の記述のうち，ジャーメイン（Germain, C.）とギッターマン（Gitterman,A.）が提唱したライフモデルにおける「適応」（adaptation）に関するものとして，適切なものを2 つ選びなさい。","options":["環境を変えることにより，個人の特性やニーズに合致する。","個人の能力と環境条件が拮抗することによって，均衡が保たれる。","個人と環境が相互に影響し合うことで，バランスのとれた支援関係を築く継続的なプロセスである。","人々と環境との関係の中で，個人が能力を発揮することによって適応が確保される。","個人はニーズに合わせるために環境を変え，自らもその変化に適合させる。"],"answer":[3,5],"explanation":"ライフモデルの適応は、人と環境の相互作用の過程です。人が環境を変え、自らも変化に対応します。","subject":10},{"id":78,"question":"事例を読んで，ひきこもり地域支援センターのＡ相談員（社会福祉士）の支援の内容に関する次の記述のうち，最も適切なものを1 つ選びなさい。\n\n〔事例〕\nＢさん（30 歳，男性）は，2 年前に人間関係に悩み仕事を辞めて以来，ひきこもるようになった。現在は，深夜にコンビニや散歩に外出する程度である。半年前からＡが支援するようになり，月2 回の訪問と月1 回のケース会議を実施している。支援開始から3 か月間は，Ｂさんの表情や会話量は増えていたが，最近は訪問日延期の申し出が多くなっている。先日，Ｂさんの母親から「部屋にこもる時間が多くなり心配です」と電話相談があったため，母親と個別面談を行った。","options":["ＡがＢさんを訪問して話ができるように母親に依頼する。","母親にＢさんがセルフモニタリングができるよう助言する。","母親からの情報をもとにＢさんへの訪問を中止し，本人が望むまで支援を待つ。","母親の情報とこれまでの記録を整理し，ケース会議で支援の見直しを提案する。","母親にＢさんの行動記録を依頼し，行動変化の蓄積から計画の見直しをする。"],"answer":[4],"explanation":"新たな情報と記録を整理し、ケース会議で支援計画を見直します。一方的な訪問や支援の中断は避けます。","subject":10},{"id":79,"question":"高齢者の通所型サービス事業を経営するＡ社会福祉法人では，地域における公益的な取組の内容を検討するため，地域の高齢者に対する無記名の質問紙調査を企画し，高齢者福祉を専門とするＢ教授の協力を得て，調査を実施することにした。その際，調査結果は，Ｂ教授の論文執筆にも用いることで合意した。次の記述のうち，調査実施における倫理への対応として，最も適切なものを1 つ選びなさい。","options":["Ａ社会福祉法人のサービス利用者を調査対象から除外した。","調査結果はＡ社会福祉法人による地域における公益的な取組の内容検討と，Ｂ教授の論文執筆に用いることを依頼文に記載した。","Ａ社会福祉法人からＢ教授への利益供与とみなされないために，調査費用の負担をＢ教授に求めた。","調査対象の設定において，Ｂ教授がこれまで実施してきた調査の回答者名簿を活用することとした。","Ｂ教授は，調査によって得られたデータの中から，自らの仮説に適合する一部のデータを選出して論文を執筆した。"],"answer":[2],"explanation":"調査協力を求める際は、事業の検討と論文執筆というデータの利用目的を事前に明示します。","subject":11},{"id":80,"question":"調査デザインに関する次の記述のうち，適切なものを2 つ選びなさい。","options":["有意抽出は，標本数が限定されている場合に，標本抽出の確率を等しくする方法である。","無作為抽出による標本調査は，標本の特性を推論することを目指す方法である。","実験計画法は，因果関係の検証に適した方法である。","縦断調査は，複数の母集団を対象に一時点のデータを収集する方法である。","パイロット調査は，調査地域や実施計画，調査にかかるコスト等の適切さを確認するために，まずは小規模な標本に対して行う方法である。"],"answer":[3,5],"explanation":"実験計画法は因果関係の検証に適しています。パイロット調査は本調査前に小規模で行う試行です。","subject":11},{"id":81,"question":"Ａ市では，市内の小中学生を対象とする生活実態調査を行うこととなった。本調査の検討を行う委員会において，中学生になると朝食を摂らない生徒が多くなることが指摘され，調査では小学生と中学生の朝食の摂取状況の違いをクロス集計によって検証することとなった。調査票では，朝食を摂る頻度に関する質問を設け，その選択肢を「週に3 回以上／週に1 〜2 回程度／月に1 〜2 回程度」とした。次のうち，この選択肢に当てはまるものとして，最も適切なものを1 つ選びなさい。","options":["ＳＤ法","比例尺度","順序尺度","複数回答法","リッカート法"],"answer":[3],"explanation":"頻度の多い・少ないという順序はありますが、選択肢の間隔は等しくないため、順序尺度です。","subject":11},{"id":82,"question":"統計法に関する次の記述のうち，適切なものを2 つ選びなさい。","options":["公的統計を国民にとって合理的な意思決定を行うための基盤となる重要な情報として位置づけている。","調査票情報の二次利用が禁じられている。","国勢調査の報告の求めであると人を誤認させるような説明をして，個人又は団体から情報を取得した者に対しては，罰則が適用される。","厚生労働省が実施する介護サービス施設・事業所調査は，基幹統計に含まれる。","都道府県に統計委員会を設置する。"],"answer":[1,3],"explanation":"統計法は公的統計を意思決定の基盤と位置づけ、国勢調査などを装って情報を得る行為に罰則を設けています。","subject":11},{"id":83,"question":"インタビューデータの整理と分析に関する次の記述のうち，適切なものを2 つ選びなさい。","options":["調査者自身の意見と合致する内容を録音データから抜き出し，逐語録を作成した。","対象者の発言内容を，関連する専門用語に当てはめてコーディングを行った。","カテゴリーの数が先行研究と近似するように，コードを分類した。","分析を終えるまで，インタビューの逐語録を繰り返し参照した。","解釈の妥当性を確認するために，分析結果を図式化した概念図を対象者に説明し，意見を求めた。"],"answer":[4,5],"explanation":"分析では逐語録に繰り返し立ち返り、対象者への確認によって解釈の妥当性を高めます。","subject":11},{"id":84,"question":"事例を読んで，次のうち，社会福祉法人Ａ会が行った評価・分析の方法に該当するものとして，最も適切なものを1 つ選びなさい。\n\n〔事例〕\n社会福祉法人Ａ会では，中期事業計画の策定に際し，法人の現状について，他の法人と比べて優れている内部の資源や能力，改善の余地がある内部の課題などの内部環境要因を洗い出し，それに影響を与える活用可能な外部環境の好条件や，成長や存続を妨げる外部リスクなどの外部環境要因も含めて，将来の方向性を整理した。","options":["ＰＤＣＡ","ＳＷＯＴ分析","バランス・スコアカードによる評価","ロジックモデル","トライアンギュレーション"],"answer":[2],"explanation":"SWOT分析は、内部の強み・弱みと、外部の機会・脅威を整理する方法です。","subject":11},{"id":85,"question":"事例を読んで，Ａ介護老人保健施設のＢ支援相談員（社会福祉士）によるＣさんの特性への理解として，次の記述のうち，最も適切なものを1 つ選びなさい。\n\n〔事例〕\nＢが担当する入所者のＣさん（86 歳，女性）は，定年退職まで約40 年の間，幼稚園教諭として勤め，5 年前に夫を亡くし，自宅で一人暮らしをしていた。1 年前にアルツハイマー型認知症と診断され要介護1 の認定を受けたが，介護サービス等の利用はなかった。1 か月前から，夜間に近所を歩き回り，自宅に戻れなくなることが何度かあり，民生委員と主治医の助言で10 日前にＡ施設に入所した。入所後，Ｃさんは夜間に十分な睡眠ができるようになり，昼間は他の入所者と趣味活動で交流し，穏やかに過ごしている。今日，Ａ施設を小学校の児童が訪問して童謡を合唱した際，Ｃさんが「私がピアノを弾いてもよいか」と言い，見事に合唱のピアノ伴奏をした。ＣさんはＢに向かって満面の笑みを浮かべた。","options":["Ｃさんの1 か月前からの行動は，中核症状によるものと理解する。","Ｃさんの認知機能障害の特徴は，まだら認知症の典型的な例だと理解する。","Ｃさんの感覚記憶は保たれていると理解する。","Ｃさんの結晶性知能の低下は緩やかであると理解する。","Ｃさんは，心気症状がやや進んだ状態であると理解する。"],"answer":[4],"explanation":"経験や知識の蓄積に基づく結晶性知能は、加齢による低下が比較的緩やかです。","subject":12},{"id":86,"question":"高齢者の生活実態に関する次の記述のうち，正しいものを1 つ選びなさい。","options":["「令和2 年国勢調査」（総務省）によると，65 歳以上の単独世帯の人口は，2020 年（令和2 年）に初めて1,000 万人を上回った。","「令和4 年度介護保険事業状況報告（年報）」（厚生労働省）によると，第1 号被保険者の要介護（要支援）認定者は，2022 年（令和4 年）に初めて500 万人を超えた。","「2022（令和4 ）年国民生活基礎調査の概況」（厚生労働省）によると，同居の配偶者が要介護や要支援認定者の「主な介護者」である割合は，3 割を上回っている。","「労働力調査（基本集計）2024 年（令和6 年）平均結果」（総務省）によると，65 歳から69 歳の者の就業率は，2024 年（令和6 年）では5 割を上回っている。","「家計調査報告（貯蓄・負債編）－2024 年（令和6 年）平均結果の概要－（二人以上の世帯）」（総務省）によると，世帯主が65 歳以上の世帯（二人以上の世帯）の貯蓄現在高の中央値は，およそ600 万円である。"],"answer":[4],"explanation":"設問の2024年の労働力調査では、65～69歳の就業率は5割を超えています。","subject":12},{"id":87,"question":"高年齢者等の雇用の安定等に関する法律について，次の記述のうち，正しいものを2 つ選びなさい。","options":["事業主は，雇用する高年齢者が職業生活の充実を図ることができるようにするため，職業生活の設計について必要な援助を行うよう努めるものとされている。","事業主は，雇用する労働者の定年の定めをする場合，鉱業における坑内作業の業務を除き，60 歳を下回ることができない。","定年を65 歳未満と定めている事業主は，高年齢者雇用確保措置として，70 歳までの継続雇用制度の措置を講じなければならない。","定年を65 歳以上70 歳未満の範囲に定めている事業主は，高年齢者就業確保措置として，高年齢者の定年を75 歳まで引き上げる措置を講じなければならない。","定年を65 歳以上70 歳未満と定めている事業主は，創業支援等措置として，高年齢者が75 歳まで継続的に従事できる社会貢献事業を実施しなければならない。"],"answer":[1,2],"explanation":"定年は原則60歳以上です。事業主は高年齢者の職業生活設計への援助にも努めます。","subject":12},{"id":88,"question":"介護保険制度に関わる各種の専門職の役割に関する次の記述のうち，最も適切なものを1 つ選びなさい。","options":["訪問介護における訪問介護員は，サービス提供責任者の指導のもと，利用者についての訪問介護計画を作成する業務を担う。","福祉用具貸与における福祉用具専門相談員は，介護支援専門員や医師と協議のうえ，利用者に対し，福祉用具の適合のための機能訓練を実施する。","居宅療養管理指導における歯科衛生士は，医師又は歯科医師の指示のもと，利用者の口腔衛生の向上を図るため，歯牙や口腔における療養上必要な業務を担う。","介護老人福祉施設における栄養士は，医師の指示のもと，利用者のうち傷病者に対する療養のための必要な栄養の指導を行う。","通所リハビリテーションにおける理学療法士は，医師の指示のもと，利用者に対し，応用的動作能力や社会的適応能力の回復を図るため，治療体操を実施する。"],"answer":[3],"explanation":"歯科衛生士は医師・歯科医師の指示に基づき、口腔衛生などの居宅療養管理指導を行います。","subject":12},{"id":89,"question":"事例を読んで，次のうち，Ａさんが利用する介護予防・日常生活支援総合事業によるサービス・事業として，最も適切なものを1 つ選びなさい。\n\n〔事例〕\n基本チェックリストによって事業対象者となったＡさん（82 歳，男性）は一人暮らしで，調理にあまり意欲的ではない。そのため，食事を十分には摂っておらず，ほぼ毎日同じインスタント食品ばかりを食べており，体重も減少傾向である。なお，かかりつけの医師と歯科医師によると，口腔の機能や咀嚼・嚥下には問題がないことがわかった。このような状況のため，地域包括支援センターや地域支援事業に関わる各種の専門職がサービス担当者会議により支援内容を検討し，Ａさんに食事内容の見直しに関する説明と助言を行った。それを聞いて納得したＡさんは，栄養の改善を目的とした食事のデリバリーサービスを利用しようと考えるに至った。","options":["通所型サービス（第1 号通所事業）","訪問型サービス（第1 号訪問事業）","その他の生活支援サービス（第1 号生活支援事業）","地域介護予防活動支援事業","介護予防把握事業"],"answer":[3],"explanation":"栄養改善を目的とする配食などは、総合事業の「その他の生活支援サービス」に当たります。","subject":12},{"id":90,"question":"事例を読んで，特定施設入居者生活介護の指定を受けたＡ養護老人ホームにおけるＢさんへの対応として，次の記述のうち，最も適切なものを1 つ選びなさい。\n\n〔事例〕\nＢさん（74 歳，男性）はＡ養護老人ホームに7 年前から入所している。数回の入院加療を経て，5 日前に末期の肝臓がんで余命が6 か月以内と主治医に診断された。現在のＢさんは意思表示・意思決定が十分に可能であり，病状や余命に関する告知を受け，それを理解したうえで「ここで最期まで暮らしたい」と希望している。なお，Ｂさんと家族・親族とのつながりは50 年以上の間，途絶えている。Ａ養護老人ホームではＡＣＰ（アドバンス・ケア・プランニング）の考え方を重視し，Ｂさんの同意のもと，Ｂさんに関する今後の介護や医療の方針を「ガイドライン」に則って，「医療・ケアチーム」を組織して協議・決定することとした。","options":["医療・ケアチームは，Ｂさんの病状に詳しい複数の看護職員で構成する組織で代替できる。","Ｂさんの意思決定を尊重し，方針に関する話し合いは繰り返さないようにする。","Ｂさんと医療・ケアチームが話し合った内容は，その都度文書にまとめておく。","Ｂさんと医療・ケアチームで方針の合意が得られない場合，施設長が判断する。","Ｂさんの意思が確認できなくなった場合は，家族の「推定意思」を尊重する。"],"answer":[3],"explanation":"人生の最終段階の方針は繰り返し話し合い、その都度記録します。本人の意思は変化し得ます。","subject":12,"note":" 「ガイドライン」とは，「人生の最終段階における医療・ケアの決定プロセスに関するガイドライン」（平成30 年3 月改訂，厚生労働省）のことである。"},{"id":91,"question":"児童福祉法に規定される児童の一時保護に関する次の記述のうち，正しいものを1 つ選びなさい。","options":["児童相談所長は，児童虐待のおそれがあるとき，少年法の規定により事件の送致を受けた場合等であって，必要があると認めるときは，一時保護を行うことができる。","児童相談所長は，児童の親権者等の意に反する場合には，裁判所にあらかじめ一時保護状を請求しなければ，一時保護を開始することができない。","一時保護の期間は，最長で二月とされており，延長するには，親権者等の同意の有無に関わらず，家庭裁判所の承認が必要である。","一時保護を行う施設の設備と運営の基準については，児童養護施設の基準を準用することとされている。","児童相談所長は，一時保護を行っている児童に対して，児童の親権者等の意向に基づき，監護及び教育に関し，その児童の福祉のため必要な措置を取らなければならない。"],"answer":[1],"explanation":"児童相談所長は、虐待のおそれ等があり必要と認める場合に、一時保護を行うことができます。","subject":13},{"id":92,"question":"事例を読んで，この時点におけるＡ市の子ども家庭課Ｂ職員（社会福祉士）の対応に関する次の記述のうち，最も適切なものを1 つ選びなさい。\n\n〔事例〕\nアパートの大家をしているＣさんからＡ市の子ども家庭課に相談があった。「部屋を貸している外国籍の夫婦は子どもと3 人で暮らしているが，就学年齢になっても子どもを小学校に通わせている様子がない。近隣との交流も乏しい様子である。このままで良いのか」というものだった。この相談を受け，Ｂが通訳とともに家庭訪問を行い，子どもと父母とに対面した上で，事情を聞いたところ，子どもは年齢相応の発達状況で健康上の問題もなく，室内も清潔であることがわかり，親子のやりとりも自然で，子どもには母国の通信教育を受けさせており，母親が学習指導をしているので就学の必要はないとの応答があって，通信教育の教材も見せてくれた。なお，この夫婦と子どもはほとんど日本語が話せないことがわかった。","options":["日本国籍を有しない場合でも子どもに普通教育を受ける権利があることを説明し，近くの公立小学校への通学を勧める。","学校に通学させていないことは，日本ではネグレクトになることを父母に説明し，児童相談所に送致することになると伝える。","子ども家庭課について説明し，教育委員会の関係課などと情報共有をしたい旨を伝える。","地域子育て支援拠点事業の対象として，子育て広場の利用を勧める。","Ｃさんの心配を払拭するために家庭訪問したことをＣさんに伝え，今後も何か気になることがあれば連絡するように依頼する。"],"answer":[5],"explanation":"母国の通信教育を受けている状況を確認したうえで、相談した大家との見守りのつながりを維持します。","subject":13},{"id":93,"question":"事例を読んで，次の記述のうち，母親の発言を受けた乳児院のＡ家庭支援専門相談員のこの時点での対応として，適切なものを2 つ選びなさい。\n\n〔事例〕\n乳児院に入所中のＢさんは1 歳である。出産直後に児童相談所が母親の同意を得て，乳児院への入所措置となった。母親（20 歳）は，生活が落ち着くまでは月1 回程度の頻度であったが，ここ半年程は週1 回から2 週に1 回の面会を重ねている。最近，母親が面会の際に，Ａに向かって「児童相談所から，はじめて取り組む養育であり，現実的に仕事と子育てとの両立は大変だろうと言われた」。続けて「でも，養子縁組は考えられないし，児童養護施設への措置変更も受け入れられない。2 歳の誕生日までには引き取りたい」と発言した。","options":["保育所に通わせることが，家庭引き取りの条件になることが多いので，この機会で保育所を利用するための申し込みを促した。","定期的に面会に来ていることの評価を踏まえ，2 歳の誕生日を目標に家族再統合に向けた取組を一緒にしてみないかと助言する。","親が家庭引き取りをすることを前提とし，面会交流ができる養育里親に関して説明した。","養子縁組は子どもに安定した家庭を提供する制度であることを丁寧に説明し，国や自治体が作成している資料やパンフレットなどを提供した。","小規模で家庭的な児童養護施設が増えていることを話して，児童養護施設への措置変更も選択肢の一つとして考えるように話した。"],"answer":[2,3],"explanation":"母親の面会の積み重ねと引取りの希望を尊重し、家族再統合や面会を続けられる養育里親を検討します。","subject":13},{"id":94,"question":"スクールソーシャルワーカー活用事業に関する次の記述のうち，最も適切なものを1 つ選びなさい。","options":["文部科学省は，すべてのスクールソーシャルワーカーを教育委員会に配置し，そこから学校へ出張する形態が望ましいとしている。","関係機関との連携は校長・副校長や担任教諭の専管事項であり，スクールソーシャルワーカーの職務ではないとされている。","事業の実施主体は，スーパーバイザーを教育委員会・学校等に配置し，スクールソーシャルワーカーに対して適切な指導・援助を実施することができる。","スクールソーシャルワーカーの職務として，保護者・教職員等への心理社会的支援が位置づけられている。","学校内におけるチーム体制の構築は校長の職務であり，スクールソーシャルワーカーは関与しないこととされている。"],"answer":[3],"explanation":"事業の実施主体は、スーパーバイザーを配置し、スクールソーシャルワーカーを指導・援助できます。","subject":13},{"id":95,"question":"事例を読んで，次の記述のうち，資料内容を検討した結果，明らかになったこととして，最も適切なものを1 つ選びなさい。\n\n〔事例〕\nＡ大学の児童・家庭福祉論の授業では，レポート課題として「世界の児童労働と家庭内暴力の実態について」というテーマが出された。その際，担当教授から国際労働機関（ＩＬＯ）やユニセフ（ＵＮＩＣＥＦ）が公表している条約や白書等を参考にすると良いとの助言があった。社会福祉士資格の取得を目指している2 年生のＢは，早速，課題に取り組むために，1999 年にＩＬＯで採択された「条約182 号」と「世界子供白書2024（要約版）」を収集し，資料内容の検討を行った。","options":["「条約182 号」では，児童を16 歳未満の全ての者と定めている。","「条約182 号」では，加盟国が児童労働の撤廃における教育の重要性を考慮に入れて，女子である児童の特別な事情を考慮するための効果的な措置をとることを定めている。","児童労働の比率については，サハラ以南のアフリカよりも中東・北アフリカの方が高くなっている。","妻に対するドメスティックバイオレンスの正当化の比率については，南アジアの女性よりもラテンアメリカ・カリブ海諸国の女性の方が高くなっている。","子どもに対する暴力的なしつけの比率については，サハラ以南のアフリカよりも東ヨーロッパ・中央アジアの方が高くなっている。"],"answer":[2],"explanation":"ILO第182号条約は、児童労働の撤廃に向け、教育の重要性と女子の特別な事情への配慮を求めています。","subject":13,"note":"1 「条約182 号」とは，「最悪の形態の児童労働の禁止及び撤廃のための即時の行動に関する条約（第182 号）」のことである。2 「世界子供白書2024（要約版）」とは，公益財団法人日本ユニセフ協会による「世界子供白書2024 2050 年の子どもたち 要約版」のことである。"},{"id":96,"question":"保育所に関する次の記述のうち，最も適切なものを1 つ選びなさい。","options":["保育所は，幼児の心身の発達を助長することを目的とする児童福祉法における児童福祉施設であると同時に，学校教育法における学校である。","保育の必要性の認定要件には，家庭において必要な保育を受けることが困難であるもののうち，求職活動を継続的に行っていることが含まれる。","子ども・子育て支援新制度が施行されたことにより，5 歳以下の全児童についての保育が無償化された。","保育所の利用にあたっては，複数の市町村圏域単位で保育の必要性などから優先順位をつけ，利用する保育所等の調整が行われる。","1 日に11 時間を超えて保育所を利用することはできない。"],"answer":[2],"explanation":"保育の必要性の認定事由には、継続的な求職活動も含まれます。就労中に限定されません。","subject":13},{"id":97,"question":"我が国の貧困問題に対する制度に関する次の記述のうち，正しいものを1つ選びなさい。","options":["1874 年（明治7 年）に制定された恤救規則は，救護の種類に生活扶助を明記した我が国では初めての貧困対策であった。","1929 年（昭和4 年）に成立した救護法において，世界恐慌の影響から失業者が救済対象と明記された。","1945 年（昭和20 年）に閣議決定された生活困窮者緊急生活援護要綱において，失業者は生活援護の対象から外された。","1946 年（昭和21 年）に制定された旧生活保護法において，素行不良な者は保護をなさないとする欠格条項は撤廃された。","1950 年（昭和25 年）に制定された生活保護法において，申請保護の原則が明記された。"],"answer":[5],"explanation":"現行の生活保護法は1950年に制定され、申請保護の原則を規定しています。急迫時は職権保護も行います。","subject":14},{"id":98,"question":"事例を読んで，Ａさんの就労に関する福祉事務所の対応について，次の記述のうち，最も適切なものを1 つ選びなさい。\n\n〔事例〕\nアパートで一人暮らしのＡさん（40 歳）は，派遣切りにあったのち，わずかな貯えで生活していた。入院をきっかけに生活保護となったが，先月退院し，アパートに戻った。しかし，まだ生活の見通しは立っていない。Ａさんは腰痛を訴えており定期的に通院をしているが，日常生活では問題は生じてはいないようである。","options":["稼働能力活用は生活保護の要件であることから就労指導を行い，それでも就労しない場合には，速やかに保護を廃止する。","主治医に対して病状調査を依頼し，主治医より就労可能の診断がされた場合は，直ちに就労指導についての文書による指示を行う。","Ａさんに公共職業安定所（ハローワーク）での求職を指示し，当月分保護費は公共職業安定所で求職したことを確認してから翌月に支給する。","年齢や医学的な面からの評価だけではなく，資格，生活歴，職歴を客観的総合的に勘案してＡさんの稼働能力の有無を評価する。","生活保護の目的が自立助長であることを説明し，自立意欲が無いならば生活保護の辞退届を提出させるように担当の現業員に指示する。"],"answer":[4],"explanation":"稼働能力は、年齢や病状だけでなく、資格・生活歴・職歴なども踏まえて総合的に評価します。","subject":14},{"id":99,"question":"2024 年（令和6 年）の生活困窮者自立支援法の改正内容に関する次の記述のうち，正しいものを2 つ選びなさい。","options":["生活困窮者自立相談支援事業の事業費負担について，国と都道府県で折半することとした。","生活困窮者自立相談支援事業において，居住に関する相談が加えられた。","同法に基づく新しい事業として進学・就職準備給付金事業を創設した。","「生活困窮者一時生活支援事業」が「生活困窮者居住支援事業」に改められた。","市町村は，地域の関係機関により協議する支援会議を設置しなければならないこととした。"],"answer":[2,4],"explanation":"2024年改正で居住相談が明確化され、一時生活支援事業は居住支援事業へと改められました。","subject":14},{"id":100,"question":"生活福祉資金貸付制度に関する次の記述のうち，最も適切なものを1 つ選びなさい。","options":["借入れの申し込みは，民生委員を介して行うことが要件とされている。","総合支援資金については，貸付を受けるにあたって，公共職業安定所（ハローワーク）で求職活動を行うことが要件とされている。","2025 年度（令和7 年度）の緊急小口資金の貸付限度額は50 万円である。","教育支援資金は，世帯内で連帯借受人を立てた場合には，連帯保証人は不要である。","不動産担保型生活資金は，親が40 歳未満のひとり親世帯も対象としている。"],"answer":[4],"explanation":"教育支援資金は、世帯内で連帯借受人を立てる場合、連帯保証人が不要となります。","subject":14},{"id":101,"question":"事例を読んで，Ｄ市生活困窮者自立相談支援機関のＢ相談支援員（社会福祉士）が考える支援の方向性に関する次の記述のうち，適切なものを2 つ選びなさい。\n\n〔事例〕\nＣさん（25 歳）は，高校卒業後に四国にあるＡ市の企業に就職したものの人間関係がうまくいかず2 年ほどで退職，その後，職業と住まいを転々として，現在は関西のＤ市内の公園でホームレス生活をしている。住民票は出身地Ａ市に置いているが，居住していない。Ｃさんがいつも公園の日陰にうずくまっているのを見て心配した近隣住民が，民生委員に相談し，民生委員がＤ市の生活困窮者自立相談支援機関に相談した。ＢがＣさんのもとを訪問したところ，Ｃさんから「この生活を何とかしたい」との意向が表明された。","options":["Ｃさんに対し，Ａ市を管轄する福祉事務所を訪問するよう促す。","Ｄ市内で活動しているホームレス支援団体に連絡し，協力を要請する。","Ｃさんの住民票がＡ市にあるので，Ａ市に支援会議の開催を要請する。","Ｄ市の福祉事務所につなぎ，生活保護の受給手続きを支援する。","Ｃさんの情報を近隣住民に伝えて，このまま見守りを継続するよう依頼する。"],"answer":[2,4],"explanation":"住民票のある自治体に戻すのではなく、現在地の福祉事務所や支援団体と連携し、生活保護につなげます。","subject":14},{"id":102,"question":"事例を読んで，生活困窮者自立相談支援機関の相談支援員（社会福祉士）の支援に関する次の記述のうち，適切なものを2 つ選びなさい。\n\n〔事例〕\nＡさん（80 歳）は息子のＢさん（52 歳）と二人暮らしである。Ｂさんは中学卒業後，高校には進学せず就職したが仕事を覚えられず転職を繰り返した。ここ10 年ほどは求職活動をせず家で過ごしているが，親子関係は良好である。現在はＡさんの老齢基礎年金と貯蓄でどうにか生活できているが，Ａさんは高齢であることから，今後のＢさんのことを心配している。Ａさんは，民生委員から紹介されたＣ市の生活困窮者自立相談支援機関に行って相談した。","options":["ＡさんからＢさんに働くよう強く求めることを提案する。","Ｂさんと面談できる機会を得られるようＡさんに働きかける。","Ｂさんの自立を促すため，ＡさんにＢさんとの別居を提案する。","Ａさんに，Ｂさんは地域若者サポートステーションを利用できると助言する。","Ａさんに，ＢさんはＣ市が行っている生活困窮者就労準備支援事業を利用できると助言をする。"],"answer":[2,5],"explanation":"息子本人との面談につなげ、生活・社会参加の準備から支える就労準備支援事業の利用を検討します。","subject":14},{"id":103,"question":"悪性新生物の2000 年以降の経年的な動向に関する次の記述のうち，正しいものを1 つ選びなさい。","options":["年齢調整死亡率は減少傾向にある。","粗死亡率は減少傾向にある。","年齢調整罹患率は減少傾向にある。","粗罹患率は減少傾向にある。","主な死因別にみた死亡率では第2 位である。"],"answer":[1],"explanation":"がんの年齢調整死亡率は減少傾向です。高齢化の影響を除いた死亡率と、粗死亡率を区別します。","subject":15},{"id":104,"question":"保健所及び市町村保健センターに関する次の記述のうち，最も適切なものを1 つ選びなさい。","options":["保健所は三次医療圏，市町村保健センターは二次医療圏を勘案して設置しなければならない。","保健所は二次予防，市町村保健センターは一次予防と役割分担がなされている。","保健所は対人保健，市町村保健センターは対物保健と役割分担がなされている。","都道府県の設置する保健所は，市町村の求めに応じて技術的助言を行うことができる。","保健所及び市町村保健センターの所長は，医師でなければならない。"],"answer":[4],"explanation":"都道府県の保健所は、市町村の求めに応じて技術的助言などを行います。","subject":15},{"id":105,"question":"事例を読んで，救急病院のＡソーシャルワーカー（社会福祉士）のＢさんへの対応に関する次の記述のうち，適切なものを2 つ選びなさい。\n\n〔事例〕\n住民票を移さないまま都市部に移り住んだＢさん（55 歳）は，ここ10 年ほど簡易宿泊所で寝起きし，週4 日程度の日雇労働に従事し，その日暮らしである。ある日，息切れと胸痛のため路上でうずくまっていたＢさんは救急病院で結核と診断され，さらに排菌しているため，入院を勧告された。簡易宿泊所で感染したものと考えられた。Ｂさんは健康保険の被保険者であるものの医療費の一部負担金が払えない，働かないと生活ができないと訴えて，入院を拒否している。","options":["入院した場合，公費負担により一部負担金が発生しないことを説明する。","傷病手当金について説明する。","療養補償給付について説明する。","住民票の住所地であれば医療扶助を申請できることを説明する。","選定療養費の対象になることを説明する。"],"answer":[1,2],"explanation":"この事例では、結核の勧告入院に係る公費負担と、休業中の所得を補う健康保険の傷病手当金を説明します。","subject":15},{"id":106,"question":"我が国の「臓器の移植に関する法律」に基づいた臓器提供に関する次の記述のうち，正しいものを1 つ選びなさい。","options":["臓器提供者の書面による意思表示及び家族の承諾が必要である。","脳死状態での臓器提供は認められていない。","死体移植件数より生体移植件数の方が多い。","臓器売買は，日本人が海外で行った場合は処罰対象とならない。","臓器提供者と移植患者に関する情報は相互に共有される。"],"answer":[3],"explanation":"日本では死体からの移植より生体移植が多く行われています。臓器提供には脳死下での提供もあります。","subject":15},{"id":107,"question":"事例を読んで，病院のＡソーシャルワーカー（社会福祉士）の対応として，次の記述のうち，適切なものを2 つ選びなさい。\n\n〔事例〕\nＢさん（18 歳，未婚，就業経験なし）は，腹痛を訴えて救急車で緊急入院となった。検査の結果，妊娠8 か月であり，切迫早産の危険性がある状態であった。さらに母子健康手帳の未交付，妊婦検診も未受診であった。救急担当医師からの依頼で，ＡがＢさんと面談を行った。その結果，友達の家を転々とし，経済的に困窮していること，お腹の子どもの父親は分からないとのことであった。","options":["特定妊婦と判断し，支援の必要性を説明する。","医療機関から他機関への情報提供を行わない旨を説明する。","出産手当金の申請が可能であることを説明する。","母子生活支援施設の入所が可能であることを説明する。","出産後，子どもを専門里親に託すことが可能であることを説明する。"],"answer":[1,4],"explanation":"出産後の養育に支援が必要な特定妊婦として説明し、母子生活支援施設などの支援につなげます。","subject":15},{"id":108,"question":"診療報酬の支払い方式などに関する次の記述のうち，最も適切なものを1つ選びなさい。","options":["出来高払い方式は，必要な診療の手控えを誘発させる可能性がある。","出来高払い方式の弊害として，医師の裁量が制約されやすい点がある。","包括払い方式では，過剰な診療を誘発させる可能性がある。","包括払い方式の弊害として，診療内容の透明性が失われやすい点がある。","医療費適正化対策に伴い，ＤＰＣ対象病院数は減少傾向にある。"],"answer":[4],"explanation":"包括払いは一定額で支払うため、個々の診療内容が見えにくくなる弊害があります。","subject":15},{"id":109,"question":"バートレット（Bartlett, H.）が示したソーシャルワークに関する次の記述のうち，最も適切なものを1 つ選びなさい。","options":["クライエントの自我の変化のための診断と介入による実践として示した。","ケースワーク，グループワーク，コミュニティワークのそれぞれの専門家を必要に応じて組み合わせるコンビネーションアプローチを提唱した。","診断主義と機能主義の折衷主義として，問題を持つ人が，専門職がいる場所で支援を受ける過程であると示した。","価値，知識，介入方法の可視化された総体であり，それらは個別の方法としても分離可能であるとした。","社会的役割と関係性の中での人々の機能に焦点を当て，環境との関係を重視することを示した。"],"answer":[5],"explanation":"バートレットは社会的機能に着目し、人々の役割や関係、環境との相互作用を重視しました。","subject":16},{"id":110,"question":"事例を読んで，Ａ市（政令市）またはＡ市が設置する機関でＢさんに対応する職員として，次のうち，適切なものを2 つ選びなさい。\n\n〔事例〕\nＢさんは，夫のギャンブル依存で離婚したばかりである。ぎりぎりの生活の中で仕事をしながら6 歳になる子どもを一人で育てている。Ｂさんは，収入も少なく，仕事と子育ての両立の懸念や住むところなどについて不安を抱えており，どのように生活をしていけばよいか，友人に相談をした。友人から，一度，市役所で相談してみてはとのアドバイスがあり，Ｂさんが居住するＡ市役所を訪問しその内容を窓口で伝えた。","options":["福祉事務所の現業員","母子・父子自立支援員","生活困窮者自立支援機関の相談支援員","家庭相談員","児童福祉司"],"answer":[2,3],"explanation":"ひとり親の生活・自立の相談には母子・父子自立支援員、生活困窮の相談には自立相談支援機関が対応します。","subject":16},{"id":111,"question":"次の記述のうち，メゾレベルの実践として示されたものとして，適切なものを2 つ選びなさい。","options":["Ａ市社会福祉協議会の社会福祉士が行う，50 歳代のひきこもり男性の母親と本人との間の調整。","難病患者を支援する社会福祉士が行う，全国難病患者の家族会の要望書を国会へ提出することの支援。","Ｂ県の社会福祉士会の会長が，委員としてＢ県の地域福祉支援計画策定に参画。","Ｃ障害者就労支援施設の社会福祉士が，特別支援学校の教員と協働で行う進路に関わるイベントの企画。","Ｄ市の生活保護担当の現業員が行う，Ｅ市の民生委員との意見交換会のファシリテーション。"],"answer":[4,5],"explanation":"メゾ実践は組織・集団・機関間への働きかけです。学校との共同企画や民生委員との意見交換が該当します。","subject":16},{"id":112,"question":"事例を読んで，Ｂさんが通院する病院のＡソーシャルワーカーの判断として，次の記述のうち，適切なものを2 つ選びなさい。\n\n〔事例〕\n高校2 年生のＢさんは呼吸器の障害があり，睡眠時にはＢｉＰＡＰの装着が必要である。3 泊4 日の修学旅行についてＢさんが主治医に相談したところ，宿泊先及び近隣の医療機関，機械のメーカーがトラブル時の対応についての調整ができれば参加可能との判断であった。必要な調整はできたが，高校は修学旅行期間中にＢｉＰＡＰの対応に慣れているＢさんの母親の同行を求めた。Ｂさんは，親の負担や友達との時間を考え，親の同行がない方がよいと思っており，そのことを主治医に相談した。主治医は，Ａに意見を求めた。","options":["「生命の安全を重視すれば，Ｂさんの母親も参加した方がよいのではないか」","「修学旅行は学校の行事であり，学校の判断に従う方がよいのではないか」","「学校関係者がＢｉＰＡＰの対応について，事前に学ぶ機会を持てばよいのではないか」","「関係者の希望や判断の違いを詳しく確認し，それぞれの意見のすり合わせをした方がよいのではないかと考えている」","「医学的根拠に基づく意見は重要であり，改めて親の同行は不要との意見を出してもらった方がよいのではないか」"],"answer":[4,5],"explanation":"本人の希望を踏まえ、関係者の意見を調整します。医師の医学的判断を明確にし、親の同行の必要性を検討します。","subject":16},{"id":113,"question":"事例を読んで，次の記述のうち，就労継続支援Ａ型事業所のＡ生活支援員（社会福祉士）が，Ｂさんの生活に関わる家族システムの好循環を意図して行った支援として，最も適切なものを1 つ選びなさい。\n\n〔事例〕\nＡは，活動に積極的に参加していたＢさんが，最近作業への意欲が低下している様に感じた。Ａは送迎時にＢさんの母親にそのことを伝えた。すると母親から，先週Ｂさんが，父親のお気に入りの時計を誤って壊してしまったが，そのことを父親に伝えることができないでいる。父親もＢさんが時計を壊したことに気づいてはいるが，Ｂさんを責めたくないので触れないでいるという話を聞いた。","options":["Ｂさんに，元気がないようなので少し作業の量を減らすことはどうかと話す。","Ｂさんに，母親から時計の話を聞いたことを伝えたうえで，父親に言えない気持ちや，父親の気持ちなどについて一緒に考えないかと話す。","母親に，時計の件でＢさんと父親が気持ちを話し合う機会を作るように話す。","母親に，Ｂさんが同じ過ちをしないような対策をＢさんと考えることはどうかと話す。","母親に，施設では間違ったことをしたときは謝ることが大切だよ，と言っていることから，父親に時計を壊したことを叱るのはどうかと話す。"],"answer":[2],"explanation":"本人が自分と父親の気持ちを考えられるよう支え、家族間の相互作用が改善するきっかけをつくります。","subject":16},{"id":114,"question":"ジェネラリストソーシャルワークに関する次の記述のうち，適切なものを2 つ選びなさい。","options":["ソーシャルワーク専門職が「体制」を維持し，抑圧を正当化しているとの批判から生まれた。","問題を文脈の中で捉え一般化し，状況に応じて効果的な方法を1 つ選んで介入する。","どのような対象に働きかけるときも，ソーシャルワークプロセスは同じである。","ニーズに適切に対応するために，多様なシステムに対する支援のレパートリーに関する知識を持つことが求められる。","問題や病理的なところをストレングスに変換することでエンパワメントを行う。"],"answer":[3,4],"explanation":"ジェネラリストは共通の支援過程を基盤に、多様な対象・システムへ働きかける知識と方法を活用します。","subject":16},{"id":115,"question":"ソーシャルワークにおける契約に関する次の記述のうち，適切なものを2つ選びなさい。","options":["ワーカーとクライエントとの契約によって，クライエントのみが支援の対象となる。","ワーカーが重点を置いている課題の解決について契約が結ばれる。","誤解や訴訟を減らす手法として，書面での契約を採用する。","契約内容については，支援の終了まで変更のないことに合意して結ばれる。","クライエントとワーカーそれぞれの問題解決に対する責任性が高まる。"],"answer":[3,5],"explanation":"契約は双方の役割や責任を明確にします。書面化は誤解を減らし、必要に応じて内容を見直します。","subject":17},{"id":116,"question":"事例を読んで，この段階でＡ市社会福祉協議会のＢ職員（社会福祉士）が担うソーシャルワーカーの役割として，次のうち，最も適切なものを1 つ選びなさい。\n\n〔事例〕\nＣ民生委員や地域住民が中心となって，3 年前から商店街の空き店舗を活用した子ども食堂を開いている。独居高齢者やサービスを利用していない障害者など，見守りを必要としている人が多数いると感じているＡ市のＣ民生委員は，子ども食堂に日常的に関わっているＢへ，「子どもだけでなく，地域全体を見守るようなネットワークをつくれないだろうか。商店街には空いている店舗があるので拠点として利用できないだろうか」と相談した。ＢはＣ民生委員の意向を踏まえて空き店舗の活用に取り組むことにした。","options":["メディエーター","ファシリテーター","コンサルティ","プログラムディベロッパー","コンビナー"],"answer":[4],"explanation":"新たな見守りの仕組みや拠点を企画・開発する役割が、プログラムディベロッパーです。","subject":17},{"id":117,"question":"事例を読んで，次のうち，Ａ母子支援員（社会福祉士）が用いる単一事例実験計画法の記述として，適切なものを2 つ選びなさい。\n\n〔事例〕\nＢ母子生活支援施設のＡは，夫の失踪による経済的困窮により6 か月前から入所している軽度の知的障害のあるＣさん（28 歳）とＤさん（6 歳）を担当している。日頃からＤさんの泣き声が聞こえているため事情を尋ねると次のように話した。「子どもの些細な失敗に対してイライラし，つい怒鳴ってしまう。子どもも泣くし，私も落ち込んでしまう」。これを聞いたＡは，「怒鳴りたくなった時の気持ちの落ち着け方について，定期的に私と検討し，実際に取り組んでみませんか」と提案した。また，Ｃさんの同意を得たうえで単一事例実験計画法を用いることにした。","options":["Ｃさんに怒鳴られたときのＤさんの表情を観察し，記録した。","入所している他の母親にインタビューを行い，Ｃさんの課題を把握した。","Ｃさんの怒鳴った回数をグラフ化し変化を可視化する。","「セルフアンカード・レイティング・スケール」を用いて，Ｃさんの気持ちの落ち込みの変化を把握する。","取組後のＤさんの変化を観察し，記録した。"],"answer":[3,4],"explanation":"単一事例実験計画法では、対象者の行動回数や気分の尺度などを継続測定し、介入による変化を捉えます。","subject":17},{"id":118,"question":"事例を読んで，次の記述のうち，Ａ総合病院のＢソーシャルワーカー（社会福祉士）が面接で把握したクライエントニーズへの対応について，適切なものを2 つ選びなさい。\n\n〔事例〕\nＣさん（55 歳，男性，独居）はＡ総合病院で5 年前に糖尿病と診断された。某メーカーの営業職で多忙な日々を過ごしていたＣさんは，血糖値のコントロールも良好ではなく，最近の受診も中断していた。ある日，営業中に倒れ，Ａ総合病院に緊急入院となったＣさんは医師から「糖尿病は進行している。しかし，まだ改善の可能性（余地）はある」と告げられた。入院中の糖尿病教室で服薬及び栄養指導を受けたＣさんであったが，退院後の生活に不安を抱くようになり，Ｂの元を訪れ「退院後の生活がとても不安で。元の生活に戻ってはいけないと思うのですが，節制した生活をとても一人では続けていくことができないと感じています」と話した。Ｂは，Ｃさん以外の糖尿病患者数人からも同様の話を聞いていた。","options":["主治医に現在のＣさんの糖尿病の医学的状況について問い合わせる。","病院の公開講座で，糖尿病治療に関する医師・患者をシンポジストとするシンポジウムを開催する。","不安がなくなるよう繰り返し糖尿病教室に参加するよう勧める。","管理栄養士にＣさんへの栄養指導上の課題について確認する。","院内の同じような課題を抱えた糖尿病患者の自助グループの結成を支援する。"],"answer":[2,5],"explanation":"患者同士が経験や不安を共有できる自助グループや、医師・患者がともに参加する学習の場をつくります。","subject":17},{"id":119,"question":"事例を読んで，次の記述のうち，Ａスクールソーシャルワーカーによるシステム論に基づくアセスメントとして，最も適切なものを1 つ選びなさい。\n\n〔事例〕\n5 年前に妻を亡くしたＢさん（35 歳）は，子のＣさん（11 歳）と二人暮らしである。Ｂさん家族はＳＮＳで知り合った女性Ｄさん（36 歳）と交流があった。Ｄさんとの再婚を考えたＢさんはＣさんに相談したところ黙りこみ，まったく口をきかなくなり，学校も休みがちになった。この状況に困ったＢさんが，Ｃさんの担任に相談したところ，Ａを紹介された。ＡはＢさんと面接を行い，Ｂさんがこれまでの経緯について話した。","options":["勝手に再婚を決めたＢさんに対してＣさんは怒りを感じている。","再婚がＣさんに与える影響について，ＢさんとＤさんで十分に話し合われていない。","ＢさんがＣさんに再婚について，十分に説明できていないことが原因である。","ＢさんとＣさんはお互いの気持ちを十分に話し合うことができない膠着状態に陥っている。","Ｃさんの思春期特有の問題が影響している。"],"answer":[4],"explanation":"システム論では、誰か一人を原因とせず、親子のやり取りや相互作用が停滞している状態に着目します。","subject":17},{"id":120,"question":"事例を読んで，次の記述のうち，Ａ町地域創生課のＢ職員（社会福祉士）の相談に対し，Ａ町として考えた対応策として，適切なものを2 つ選びなさい。\n\n〔事例〕\nＡ町は昔から地域特有の農作物の生産が盛んな地域であったが，近年は農業者の高齢化や後継者不足により耕作放棄地が増え，農業の衰退が地域課題となっている。Ａ町では相談窓口の設置や，新規就農者への助成事業を実施したりしているが，なかなか課題の解決にはつながっていない。Ｂは，新しい農福連携を視野に入れた地域課題の解決についてＡ町農業振興課に相談した。","options":["人材確保が喫緊の課題のため，公共職業安定所（ハローワーク）に求人申し込みをする。","Ａ町や近隣の市町村のボランティアセンターに依頼して，農業ボランティア登録の強化をお願いする。","農業者と就労継続支援事業所や小中学校の協力を得て，農業体験プログラムを企画する。","隣のＣ市にある特別支援学校に依頼して，農業実習を必修化してもらう。","農業振興課主導で，近隣地域の飲食店に地産地消への協力を求める。"],"answer":[2,3],"explanation":"農業ボランティアを広げ、就労支援事業所や学校と農業体験を企画し、地域の参加とつながりを育てます。","subject":17},{"id":121,"question":"事例を読んで，次の記述のうち，ＤＷＡＴ（災害派遣福祉チーム）の社会福祉士が主となって行うこの段階での活動として，適切なものを2 つ選びなさい。\n\n〔事例〕\nＡ県Ｂ市では大型台風の影響によって河川の氾濫や土砂災害が発生し，多くの家屋が被害を受け，複数の避難所が設置された。災害発生の翌日，Ｂ市からＡ県に対してＤＷＡＴ（災害派遣福祉チーム）の派遣要請が入り，その7 日後にチームがＢ市の避難所に入った。","options":["避難所等を巡回し衛生管理を行う。","生活不活病対策のためのプログラムを実施する。","避難所等において，被災した住民の生活課題のスクリーニングを行う。","社会福祉協議会と協力し，「ＢＣＰ」の再検討を行う。","被災地において報告される情報や在宅等の巡回を通じて要配慮者の把握を行う。"],"answer":[3,5],"explanation":"DWATの社会福祉士は、避難所や在宅の要配慮者を把握し、生活課題をスクリーニングして支援につなぎます。","subject":17,"note":" 「ＢＣＰ」とは，事業継続計画のことである。"},{"id":122,"question":"ソーシャルワークの支援に関する次の記述のうち，適切なものを2 つ選びなさい。","options":["パーソン・センタード・アプローチでは，不適応はその人の問題というより環境の問題と捉え，環境を人に合うように変えたり調整したりする。","エンパワメント・アプローチは，クライエントが自身の思考パターンを見い出し，誤った信念を修正して，内面化された抑圧に対処させる方法である。","ナラティブ・アプローチでは，クライエントがこれまでに気づいていなかった真実や過去の出来事に対する新たな解釈を見い出し，人生を「書き直す」ための助けをする。","認知行動アプローチは，まず偏った行動を変えることにより思考プロセスの変化を促すための支援方法である。","課題中心アプローチでは，支援者が専門的な観点から優先順位が高いと判断した課題に焦点を当てて解決する。"],"answer":[1,3],"explanation":"本人に合うよう環境を調整する視点を重視します。ナラティブでは、語りを通じて経験の新たな意味を見いだします。","subject":17},{"id":123,"question":"次のうち，アウトリーチに該当するものとして，適切なものを2 つ選びなさい。","options":["ひきこもり当事者に対するＳＮＳやチャットを利用した関係性づくり","子どもが通う保育所で，いつも迎えに来る母親の代わりに来た父親からの相談","要介護認定の区分変更申請を受けた自治体の職員による訪問調査","認知症高齢者のための地域の居場所づくり","地域イベントにおけるつながりを創出するための街角相談会の開催"],"answer":[1,5],"explanation":"アウトリーチは支援者から接点をつくる働きかけです。SNSでの関係づくりや街角相談会も含まれます。","subject":17},{"id":124,"question":"社会福祉事業などを行う法人の設立や運営に関する次の記述のうち，適切なものを2 つ選びなさい。","options":["特定非営利活動法人は，設立に際し3 名以上の理事が必要である。","一般社団法人は，法人の事業として公益的活動を実施する必要がある。","公益財団法人は，設立の当初から公益財団法人として設立することができる。","社会福祉連携推進法人は，社会福祉に係る業務の連携を推進し，社会福祉法人の経営基盤の強化に資すること等を目的に設立する一般社団法人である。","医療法人は，社会福祉事業を行うことにより社会医療法人と認定される。"],"answer":[1,4],"explanation":"NPO法人には理事3人以上が必要です。社会福祉連携推進法人は、認定を受けた一般社団法人です。","subject":18},{"id":125,"question":"事例を読んで，Ａ社会福祉士を中心に実施した一連の取組において重視した次の考え方のうち，適切なものを2 つ選びなさい。\n\n〔事例〕\nＢ障害福祉施設では，中堅・ベテラン職員による「経験に基づく支援・業務」が最も重視され，若手職員が育成されないまま離職してしまうということが相次いだ。そこでＡは，会議を定期的に開催して，他の職員と一緒に特に定型的な業務にかかる時間を測定し，不適切な手順や無駄な動作のある業務を洗い出し，効率的な方法を検討した。また，利用者の特性に応じた支援マニュアルなどを作成した。会議は継続して行われ，支援方法の改善や不要な業務の廃止に取り組んだ。会議での議論の積み重ねから，法人理念の改訂について，理事会へ提案するなどの活動にも至った。これら一連の取組の中で，職員間のコミュニケーションも増え，職員の定着率も上がっていった。","options":["エンゲージメント","リスキー・シフト","ダブル・ループ学習","科学的管理法","ハインリッヒの法則"],"answer":[3,4],"explanation":"作業時間・手順の分析は科学的管理法、組織の前提や理念まで見直すことはダブル・ループ学習です。","subject":18},{"id":126,"question":"次の記述のうち，心理的安全が確保されているといえるサービス提供組織の特徴として，最も適切なものを1 つ選びなさい。","options":["上司が強いリーダーシップを発揮することにより，部下の安心の基盤となる。","組織の安定性を優先させるために，意見の不一致や対立を回避する。","失敗や危惧，疑問などの情報も共有し，組織のパフォーマンスを高める。","職種・職位などに伴う権限を重視したコミュニケーションを行う。","業務改善や新規事業の推進は，発案した人が責任者となる暗黙のルールがある。"],"answer":[3],"explanation":"心理的安全性がある組織では、失敗・懸念・疑問も安心して共有し、改善につなげられます。","subject":18},{"id":127,"question":"次の記述のうち，社会福祉法人の決算期の計算書類の承認のプロセスとして，正しいものを1 つ選びなさい。","options":["理事会で承認し，その後，監事による監査を経て，評議員会にて承認する。","理事会で承認し，その後，評議員会での承認を経て，監事による監査で承認する。","評議員会で承認し，その後，理事会での承認を経て，監事による監査で承認する。","監事による監査を受け，その後，理事会での承認を経て，評議員会にて承認する。","監事による監査を受け，その後，理事会での承認を経て，所轄庁に提出する。"],"answer":[4],"explanation":"計算書類は、監事の監査を受けた後、理事会の承認を経て評議員会で承認するのが基本です。","subject":18},{"id":128,"question":"福祉サービスの経営に関する理論とその説明の組み合わせとして，次のうち，最も適切なものを1 つ選びなさい。","options":["ブルー・オーシャン戦略 一般的な支援を総合的に提供するのではなく，従来存在しなかった全く新しい領域の事業を開始する。","ポジショニング理論 特定のターゲットを明確にして事業を考えるのではなく，地域の他の事業所も行っている一般的な支援を総合的に提供する。","コア・コンピテンス理論 法人設立当初からの事業で培った専門分野を生かすのではなく，新しい分野のサービスを開発・実施する。","リソース・ベースド・ビュー（資源ベース理論）事業所内部の職員や設備の特徴・専門性を生かすのではなく，補助金や報酬制度の変化に応じて事業計画を立案する。","ＳＤＣＡサイクル 支援方法は現場職員の判断を重視して組織的課題にはせず，支援の改善内容の継続はそれぞれの職員の判断で行う。"],"answer":[1],"explanation":"ブルー・オーシャン戦略は、既存の競争にとらわれず、新しい市場や価値を生み出す考え方です。","subject":18},{"id":129,"question":"職員の人材育成や評価に関する次の記述のうち，適切なものを2 つ選びなさい。","options":["目標管理制度とは，組織全体の目標を踏まえ，職員が自主的に目標を立てることで動機づけを図り，自己統制と業績の向上を図ることをいう。","能力評価とは，職員に備わっている積極性や責任感，協調性などを評価することをいう。","人材の評価におけるハロー効果とは，人から期待されると，その期待に添うように行動し，職員の能力が伸びていくことを指す。","360 度評価とは，1 人の職員の能力・性格・志向などを，指標に基づき多面的に評価する手法のことをいう。","コンピテンシー評価とは，高業績者に共通してみられる行動特性や思考の特徴を抽出してモデル化したものによって評価することをいう。"],"answer":[1,5],"explanation":"目標管理は自主的な目標で意欲を高めます。コンピテンシー評価は、高業績者に共通する行動特性等を基準にします。","subject":18}], SUBJECTS=["医学概論", "心理学と心理的支援", "社会学と社会システム", "社会福祉の原理と政策", "社会保障", "権利擁護を支える法制度", "地域福祉と包括的支援体制", "障害者福祉", "刑事司法と福祉", "ソーシャルワークの基盤と専門職", "ソーシャルワークの理論と方法", "社会福祉調査の基礎", "高齢者福祉", "児童・家庭福祉", "貧困に対する支援", "保健医療と福祉", "ソーシャルワークの基盤と専門職（専門）", "ソーシャルワークの理論と方法（専門）", "福祉サービスの組織と経営"];

for(const [id,v] of Object.entries(results)){if(!QUESTIONS[id-1]||!v||!Array.isArray(v.selected)){delete results[id]}}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const equal=(a,b)=>a.length===b.length&&[...a].sort().every((v,i)=>v===[...b].sort()[i]);

function save(){try{localStorage.setItem(KEY,JSON.stringify({results,marks,index}))}catch(e){storageOK=false}}

<\/style><div class="wrap"><header class="top"><div><div class="brand">いとう総研 · STUDY PRACTICE<\/div><h1>第38回 社会福祉士試験<\/h1><p class="lead">一問ずつ、理解を積み重ねる。全129問・解説付き<\/p><\/div><span class="edition">2026年実施<\/span><\/header><div class="stats" id="stats"><\/div><div class="layout"><aside class="sidebar"><div><label class="control-label" for="subject">科目から選ぶ<\/label><select id="subject"><option value="all">全科目 · 129問<\/option>${SUBJECTS.map((s,i)=>`<option value="${i}">${esc(s)}<\/option>`).join('')}<\/select><\/div><div class="filters" role="group" aria-label="出題範囲">${[['all','すべて'],['unseen','未回答'],['wrong','間違えた'],['marks','あとで復習']].map(([v,t])=>`<button data-mode="${v}">${t}<\/button>`).join('')}<\/div><div style="grid-column:1/-1"><button id="reviewwrong" style="width:100%;font-weight:bold">全科目の間違えた問題だけ</button><p class="hint" id="wronghelp" aria-live="polite"></p></div><div class="sidebuttons"><button id="shuffle">シャッフル<\/button><button id="sort">番号順<\/button><\/div><details class="map"><summary>問題一覧から選ぶ <span id="listcount"><\/span><\/summary><div class="grid" id="grid"><\/div><p class="legend">緑：正解 ／ 橙：不正解 ／ •：あとで復習<\/p><\/details><p class="storage" id="storage"><\/p><button class="reset" id="reset">学習記録をリセット<\/button><\/aside><main><article class="card" id="card"><\/article><nav class="navigation" aria-label="問題の移動"><button id="prev">← 前の問題<\/button><button id="next">次の問題 →<\/button><\/nav><\/main><\/div><footer class="footer">問題：社会福祉振興・試験センター 第38回社会福祉士国家試験<br>正答は公式発表に準拠。解説は学習用に作成し、試験時点の制度・統計に対応しています。<br><a href="https://www.sssc.or.jp/shakai/past_exam/" target="_blank" rel="noopener">公式の試験問題<\/a><a href="https://www.mhlw.go.jp/content/12004000/001660620.pdf" target="_blank" rel="noopener">公式正答<\/a><\/footer><\/div>`;
const $=s=>root.querySelector(s);
function matches(q){return (subject==='all'||q.subject===Number(subject))&&(mode==='all'||mode==='unseen'&&!results[q.id]||mode==='wrong'&&results[q.id]&&!correct(q.id)||mode==='marks'&&marks[q.id])}
function rebuild(){order=QUESTIONS.filter(matches).map(q=>q.id);if(!order.includes(index))index=order[0];render()}
function stats(){const wrongCount=QUESTIONS.filter(q=>results[q.id]&&!correct(q.id)).length;$('#reviewwrong').textContent=`全科目の間違えた問題だけ（${wrongCount}問）`;$('#wronghelp').textContent='最後の解答が不正解の問題を抽出します。正解すると次回の抽出から外れます。';const answered=Object.keys(results).length,n=Object.keys(results).filter(correct).length;$('#stats').innerHTML=`<div class="stat"><b>${answered}<small style="font-size:12px;color:#72858c"> / 129<\/small><\/b><span>回答済み<\/span><\/div><div class="stat"><b>${n}<\/b><span>正解<\/span><\/div><div class="stat"><b>${answered?Math.round(n/answered*100):0}<small style="font-size:12px">%<\/small><\/b><span>正答率<\/span><\/div><div class="progress" role="progressbar" aria-label="回答済み" aria-valuenow="${answered}" aria-valuemin="0" aria-valuemax="129"><i style="width:${answered/129*100}%"><\/i><\/div>`;$('#storage').textContent=storageOK?'学習記録はこのブラウザに自動保存されます。':'この環境では記録を保存できません。ページを閉じると記録が消えます。';}
function nav(){const pos=order.indexOf(index);$('#prev').disabled=pos<=0;$('#next').disabled=pos<0||pos===order.length-1;$('#listcount').textContent=`(${order.length}問)`;$('#grid').innerHTML=[...new Set(QUESTIONS.map(q=>q.subject))].map(subjectId=>{const ids=order.filter(id=>QUESTIONS[id-1].subject===subjectId).sort((a,b)=>a-b);if(!ids.length)return '';return `<section class="subject-group"><h3 class="subject-title">${esc(SUBJECTS[subjectId])}</h3><p class="subject-range">問題 ${ids[0]}${ids.length>1?'〜'+ids[ids.length-1]:''} · ${ids.length}問</p><div class="subject-numbers">`+ids.map(id=>`<button data-id="${id}" class="${results[id]?(correct(id)?'done':'miss'):''} ${index===id?'current':''} ${marks[id]?'flag':''}" aria-label="問題${id}${results[id]?(correct(id)?' 正解':' 不正解'):' 未回答'}${marks[id]?' あとで復習':''}" ${index===id?'aria-current="true"':''}>${id}<\/button>`).join('')+'</div></section>';}).join('');}
function render(){save();stats();nav();root.querySelectorAll('[data-mode]').forEach(b=>{b.classList.toggle('active',b.dataset.mode===mode);b.setAttribute('aria-pressed',String(b.dataset.mode===mode))});const q=QUESTIONS[index-1];if(!q||!order.includes(index)){$('#card').innerHTML='<div class="empty"><h2>この範囲の問題はありません<\/h2><p>科目や出題範囲を変更して、学習を続けましょう。<\/p><button id="showall" class="primary">全問に戻る<\/button><\/div>';$('#showall').onclick=()=>{subject='all';mode='all';$('#subject').value='all';rebuild()};return}
revealed=!!results[index]&&retrying!==index;selection=revealed?[...results[index].selected]:[];
const parts=q.question.split('\n\n〔事例〕\n');
$('#card').innerHTML=`<div class="qtop"><span class="tag">${esc(SUBJECTS[q.subject])}<\/span><button id="mark" aria-pressed="${!!marks[index]}">${marks[index]?'★ 復習に登録済み':'☆ あとで復習'}<\/button><\/div><h2 class="qnum" tabindex="-1">問題 ${q.id}<span class="count">${order.indexOf(index)+1} / ${order.length} 問<\/span><\/h2><div class="instruction">${q.answer.length}つ選んで解答してください<\/div><p class="question">${esc(parts[0])}<\/p>${parts.length>1?`<div class="case">〔事例〕<br>${esc(parts.slice(1).join('\n'))}<\/div>`:''}<form id="form"><div class="opts" role="group" aria-label="選択肢">${q.options.map((t,i)=>`<label class="option" data-option="${i+1}"><input type="${q.answer.length===1?'radio':'checkbox'}" name="choice" value="${i+1}" ${selection.includes(i+1)?'checked':''} ${revealed?'disabled':''}><span class="number">${i+1}<\/span><span class="opttext">${esc(t)}<\/span><\/label>`).join('')}<\/div>${q.note?`<details class="notebox"><summary>問題の注記を読む<\/summary><p>${esc(q.note)}<\/p><\/details>`:''}<div class="submitrow" ${revealed?'hidden style="display:none"':''}><button type="submit" class="primary" id="submit" disabled>解答する<\/button><span class="hint" id="hint">${q.answer.length}つ選択してください<\/span><\/div><\/form><div id="feedback" aria-live="polite"><\/div>`;
$('#mark').onclick=()=>{marks[index]=!marks[index];save();$('#mark').textContent=marks[index]?'★ 復習に登録済み':'☆ あとで復習';$('#mark').setAttribute('aria-pressed',String(!!marks[index]));nav()};
$('#form').onchange=()=>{selection=[...root.querySelectorAll('input[name="choice"]:checked')].map(e=>Number(e.value));$('#submit').disabled=selection.length!==q.answer.length;$('#hint').textContent=selection.length>q.answer.length?`${q.answer.length}つに絞ってください`:`${selection.length} / ${q.answer.length}つ選択`;root.querySelectorAll('.option').forEach(el=>el.classList.toggle('selected',selection.includes(Number(el.dataset.option))))};
$('#form').onsubmit=e=>{e.preventDefault();if(selection.length!==q.answer.length||revealed)return;results[index]={selected:[...selection]};retrying=null;render();$('#feedback').scrollIntoView({behavior:'smooth',block:'nearest'})};
if(revealed){const ok=correct(index);root.querySelectorAll('.option').forEach(el=>{const n=Number(el.dataset.option);if(q.answer.includes(n)){el.classList.add('good');el.querySelector('.opttext').insertAdjacentHTML('afterbegin','<span class="optbadge">正答<\/span>')}else if(selection.includes(n)){el.classList.add('bad');el.querySelector('.opttext').insertAdjacentHTML('afterbegin','<span class="optbadge" style="background:#f7d7c8;color:#9d4229">あなたの選択<\/span>')}});$('#feedback').innerHTML=`<section class="feedback ${ok?'':'wrong'}"><div class="resulttitle">${ok?'✓ 正解です！':'もう一度、ポイントを確認しましょう'}<\/div><div class="answer">正答 ${q.answer.join('・')}<\/div><p class="hint">あなたの解答：${selection.join('・')}${q.answer.length>1?' ／ すべて一致で正解':''}<\/p><div class="explabel">シンプル解説<\/div><p class="explanation">${esc(q.explanation)}<\/p><button id="retry" class="retry">この問題を解き直す<\/button>${order.indexOf(index)===order.length-1?'<p class="summarynote">この範囲の最後の問題です。科目や復習モードを切り替えて続けられます。<\/p>':''}<\/section>`;$('#retry').onclick=()=>{retrying=index;render()}}
}
$('#reviewwrong').onclick=()=>{retrying=null;subject='all';mode='wrong';$('#subject').value='all';rebuild();$('.map').open=true;$('#card').scrollIntoView({behavior:'smooth',block:'start'})};
$('#subject').onchange=e=>{subject=e.target.value;rebuild()};root.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{retrying=null;mode=b.dataset.mode;rebuild();if(mode==='wrong')$('.map').open=true});$('#grid').onclick=e=>{const b=e.target.closest('button[data-id]');if(b){index=Number(b.dataset.id);render()}};
function move(step){const n=order.indexOf(index)+step;if(n<0||n>=order.length)return;index=order[n];render();$('.qnum')?.focus({preventScroll:true});$('#card').scrollIntoView({behavior:'smooth',block:'start'})}
$('#prev').onclick=()=>move(-1);$('#next').onclick=()=>move(1);
$('#shuffle').onclick=()=>{order=QUESTIONS.filter(matches).map(q=>q.id);for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}index=order[0];render()};$('#sort').onclick=()=>rebuild();
$('#reset').onclick=()=>{if(confirm('全129問の解答記録と復習マークを削除しますか？')){results={};marks={};retrying=null;index=1;subject='all';mode='all';$('#subject').value='all';rebuild()}};
rebuild();
})();
