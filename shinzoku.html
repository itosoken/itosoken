</ruby>","options":["<ruby>離婚後<rt>りこんご</rt></ruby>に<ruby>父母双方<rt>ふぼそうほう</rt></ruby>を<ruby>親権者<rt>しんけんしゃ</rt></ruby>とすることは<ruby>認<rt>みと</rt></ruby>められない。","<ruby>共同親権<rt>きょうどうしんけん</rt></ruby>である<ruby>以上<rt>いじょう</rt></ruby>、<ruby>子<rt>こ</rt></ruby>の<ruby>緊急<rt>きんきゅう</rt></ruby>の<ruby>医療行為<rt>いりょうこうい</rt></ruby>も、<ruby>父母<rt>ふぼ</rt></ruby>の<ruby>合意<rt>ごうい</rt></ruby>ができるまで<ruby>必<rt>かなら</rt></ruby>ず<ruby>待<rt>ま</rt></ruby>たなければならない。","<ruby>子<rt>こ</rt></ruby>の<ruby>利益<rt>りえき</rt></ruby>のため<ruby>急迫<rt>きゅうはく</rt></ruby>の<ruby>事情<rt>じじょう</rt></ruby>があれば、<ruby>母<rt>はは</rt></ruby>は<ruby>単独<rt>たんどく</rt></ruby>で<ruby>親権<rt>しんけん</rt></ruby>を<ruby>行使<rt>こうし</rt></ruby>できる。","<ruby>子<rt>こ</rt></ruby>の<ruby>日常<rt>にちじょう</rt></ruby>の<ruby>食事<rt>しょくじ</rt></ruby>や<ruby>服装<rt>ふくそう</rt></ruby>についても、<ruby>必<rt>かなら</rt></ruby>ず<ruby>父母<rt>ふぼ</rt></ruby>が<ruby>共同<rt>きょうどう</rt></ruby>して<ruby>決<rt>き</rt></ruby>めなければならない。","<ruby>離婚<rt>りこん</rt></ruby>した<ruby>父<rt>ちち</rt></ruby>は、<ruby>親権<rt>しんけん</rt></ruby>の<ruby>有無<rt>うむ</rt></ruby>にかかわらず、<ruby>子<rt>こ</rt></ruby>を<ruby>扶養<rt>ふよう</rt></ruby>する<ruby>責務<rt>せきむ</rt></ruby>を<ruby>負<rt>お</rt></ruby>わない。"],"answer":[3],"explanations":["<ruby>離婚後<rt>りこんご</rt></ruby>の<ruby>親権者<rt>しんけんしゃ</rt></ruby>は、<ruby>父母双方<rt>ふぼそうほう</rt></ruby>または<ruby>一方<rt>いっぽう</rt></ruby>と<ruby>定<rt>さだ</rt></ruby>めることができます。","<ruby>子<rt>こ</rt></ruby>の<ruby>利益<rt>りえき</rt></ruby>のため<ruby>急迫<rt>きゅうはく</rt></ruby>の<ruby>事情<rt>じじょう</rt></ruby>があるときは、<ruby>単独<rt>たんどく</rt></ruby>で<ruby>行使<rt>こうし</rt></ruby>できる<ruby>例外<rt>れいがい</rt></ruby>があります。","<ruby>緊急<rt>きんきゅう</rt></ruby>の<ruby>医療行為<rt>いりょうこうい</rt></ruby>が<ruby>必要<rt>ひつよう</rt></ruby>な<ruby>場合<rt>ばあい</rt></ruby>など、<ruby>急迫<rt>きゅうはく</rt></ruby>の<ruby>事情<rt>じじょう</rt></ruby>があれば<ruby>単独行使<rt>たんどくこうし</rt></ruby>が<ruby>可能<rt>かのう</rt></ruby>です。","<ruby>子<rt>こ</rt></ruby>の<ruby>監護<rt>かんご</rt></ruby>・<ruby>教育<rt>きょういく</rt></ruby>に<ruby>関<rt>かん</rt></ruby>する<ruby>日常<rt>にちじょう</rt></ruby>の<ruby>行為<rt>こうい</rt></ruby>は、<ruby>単独<rt>たんどく</rt></ru const GUIDE=["<h3 class=\"g-theme\">親族の規定と社会保障<\/h3><p class=\"g-lead\">大学生のための社会保障　｜　『サザエさん』の家系図で学ぶ　｜　2026年11月現在<\/p><p class=\"g-figtitle\">サザエさんを「本人」として見る家系図<\/p><figure class=\"g-fig g-wide\"><img src=\"shinzoku-assets/image1.png\" alt=\"本人はフグ田サザエ。父母は磯野波平・磯野フネ、弟妹は磯野カツオ・磯野ワカメ。夫はフグ田マスオ、子はフグ田タラオ。伯父は磯野海平、叔母は波野なぎえ、その子が波野ノリスケ、孫が波野イクラ。マスオの兄はフグ田サケオ、その子はフグ田ノリオ。\" width=\"1400\" height=\"543\" loading=\"lazy\"><\/figure><h4 class=\"g-h\">民法が「親族」とする３つの範囲<\/h4><div class=\"g-tablewrap g-stackwrap\"><table class=\"g-table g-stack\"><colgroup><col style=\"width:17.1%\"><col style=\"width:33.4%\"><col style=\"width:49.4%\"><\/colgroup><tr class=\"g-head\"><th scope=\"col\"><strong>区分<\/strong><\/th><th scope=\"col\"><strong>サザエから見た例<\/strong><\/th><th scope=\"col\"><strong>範囲の見方<\/strong><\/th><\/tr><tr><th scope=\"row\"><strong>配偶者<\/strong><\/th><td data-label=\"サザエから見た例\">夫のマスオ<\/td><td data-label=\"範囲の見方\"><div class=\"g-teach g-small\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>婚姻の届出をした相手です。夫婦の間に親等はつけません。<\/p><\/div><\/div><\/td><\/tr><tr><th scope=\"row\"><strong>６親等内の血族<\/strong><\/th><td data-label=\"サザエから見た例\">波平・フネ、タラオ、カツオ・ワカメ、海平、ノリスケ、イクラなど<\/td><td data-label=\"範囲の見方\"><div class=\"g-teach g-small\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>親子関係をたどって６親等までです。養子縁組で生じる法律上の血族も含みます。<\/p><\/div><\/div><\/td><\/tr><tr><th scope=\"row\"><strong>３親等内の姻族<\/strong><\/th><td data-label=\"サザエから見た例\">マスオの母（１親等）・兄のフグ田 サケオ（２親等）・サケオの子ノリオ（３親等）<\/td><td data-label=\"範囲の見方\"><div class=\"g-teach g-small\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>配偶者の血族と、自分の血族の配偶者です。夫婦を結ぶ線は親等に加えません。<\/p><\/div><\/div><\/td><\/tr><\/table><\/div><h4 class=\"g-h\">３人の親族を、制度別に見比べる<\/h4><div class=\"g-tablewrap\"><table class=\"g-table\"><colgroup><col style=\"width:29.8%\"><col style=\"width:23.0%\"><col style=\"width:24.2%\"><col style=\"width:23.0%\"><\/colgroup><tr class=\"g-head\"><th scope=\"col\"><strong>制度<\/strong><\/th><th scope=\"col\"><strong><small>磯野 <\/small><\/strong><strong>カツオ（弟）<\/strong><br><strong>２親等<\/strong><\/th><th scope=\"col\"><strong><small>磯野 <\/small><\/strong><strong>海平（伯父）<\/strong><br><strong>３親等<\/strong><\/th><th scope=\"col\"><strong><small>波野 <\/small><\/strong><strong>ノリスケ（いとこ）<\/strong><br><strong>４親等<\/strong><\/th><\/tr><tr><th scope=\"row\"><strong>健康保険の被扶養者<\/strong><\/th><td>別居でも可<\/td><td>同一世帯が必要<\/td><td>範囲外<\/td><\/tr><tr><th scope=\"row\"><strong>介護休業の対象家族<\/strong><\/th><td>対象<\/td><td>範囲外<\/td><td>範囲外<\/td><\/tr><tr><th scope=\"row\"><strong>後見開始の申立て<\/strong><\/th><td>申立て可（成人を仮定）<\/td><td>申立て可<\/td><td>申立て可<\/td><\/tr><\/table><\/div><p class=\"g-figtitle\">いとこのノリスケに注目すると<\/p><div class=\"g-teach\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>ノリスケの母は、波平・海平の妹、波野 なぎえ（旧姓・磯野）です。右端の列で、制度ごとの扱いを比べられます。就労・年齢など、作品と異なる仮定は各章で示します。<\/p><\/div><\/div><p class=\"g-sources\"><strong>根拠　<\/strong>民法第７条・第725～727条、健康保険法第３条第７項、育児・介護休業法第２条ほか。　｜　<a href=\"https://laws.e-gov.go.jp/law/129AC0000000089\" target=\"_blank\" rel=\"noopener\">民法<\/a> ／ <a href=\"https://www.nenkin.go.jp/service/kounen/tekiyo/hihokensha1/20141202.html\" target=\"_blank\" rel=\"noopener\">被扶養者の認定<\/a><br>人物関係　アニメ『サザエさん』公式サイト　<a href=\"https://www.sazaesan.jp/characters.html\" target=\"_blank\" rel=\"noopener\">磯野家・フグ田家<\/a> ／ <a href=\"https://www.sazaesan.jp/characters-2.html\" target=\"_blank\" rel=\"noopener\">波野家<\/a> ／ <a href=\"https://www.sazaesan.jp/characters-4.html\" target=\"_blank\" rel=\"noopener\">親戚<\/a><strong>（公式サイトでは２人を続柄で紹介）<\/strong><\/p><h3 class=\"g-theme\">親等は、親子の線を数える<\/h3><div class=\"g-teach\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>親や子へまっすぐたどれる関係を<strong class=\"g-key\">直系<\/strong>といいます。兄弟姉妹やいとこのように枝が分かれる<strong class=\"g-key\">傍系<\/strong>では、最も近い共通の祖先まで上り、相手まで下ります。サザエからノリスケまでは、共通の祖父母まで２本上り、そこから２本下るので、４親等です。<\/p><\/div><\/div><p class=\"g-figtitle\">サザエからノリスケまで、親子の線を４本たどる<\/p><figure class=\"g-fig g-wide\"><img src=\"shinzoku-assets/image3.png\" alt=\"サザエから父の波平、波平の親、波平の妹・波野なぎえ、ノリスケまで、４つの親子関係をたどる。\" width=\"1400\" height=\"353\" loading=\"lazy\"><\/figure><h4 class=\"g-h\">本人から見た親等の早見表<\/h4><div class=\"g-tablewrap g-stackwrap\"><table class=\"g-table g-stack\"><colgroup><col style=\"width:11.2%\"><col style=\"width:30.1%\"><col style=\"width:58.7%\"><\/colgroup><tr class=\"g-head\"><th scope=\"col\"><strong>親等<\/strong><\/th><th scope=\"col\"><strong>血族の例<\/strong><\/th><th scope=\"col\"><strong>たどり方・姻族の例<\/strong><\/th><\/tr><tr><th scope=\"row\"><strong>１親等<\/strong><\/th><td data-label=\"血族の例\">父母・子<\/td><td data-label=\"たどり方・姻族の例\"><div class=\"g-teach g-small\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>サザエから波平、フネ、タラオへは、それぞれ親子の線が１本です。マスオの母は１親等の姻族です。<\/p><\/div><\/div><\/td><\/tr><tr><th scope=\"row\"><strong>２親等<\/strong><\/th><td data-label=\"血族の例\">祖父母・孫・兄弟姉妹<\/td><td data-label=\"たどり方・姻族の例\"><div class=\"g-teach g-small\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>弟のカツオまでは、サザエから波平を通って親子の線を２本たどります。マスオの兄・サケオは２親等の姻族です。<\/p><\/div><\/div><\/td><\/tr><tr><th scope=\"row\"><strong>３親等<\/strong><\/th><td data-label=\"血族の例\">曾祖父母・ひ孫・おじ・おば・甥・姪<\/td><td data-label=\"たどり方・姻族の例\"><div class=\"g-teach g-small\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>海平は波平の兄で、サザエの伯父です。マスオの兄・サケオの子であるノリオは３親等の姻族です。<\/p><\/div><\/div><\/td><\/tr><tr><th scope=\"row\"><strong>４親等<\/strong><\/th><td data-label=\"血族の例\">高祖父母・ひ孫の子・いとこ<\/td><td data-label=\"たどり方・姻族の例\"><div class=\"g-teach g-small\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>ノリスケまでは、上の図のように親子の線を４本たどります。マスオのいとこは４親等の姻族で、民法の親族の範囲外です。<\/p><\/div><\/div><\/td><\/tr><tr><th scope=\"row\"><strong>５・６親等<\/strong><\/th><td data-label=\"血族の例\">いとこの子（５）・いとこの孫（６）<\/td><td data-label=\"たどり方・姻族の例\"><div class=\"g-teach g-small\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>ノリスケの子・イクラは５親等です。仮にイクラに子が生まれれば６親等、孫が生まれれば７親等です。<\/p><\/div><\/div><\/td><\/tr><\/table><\/div><p class=\"g-figtitle\">イクラの次の世代が、血族６親等の境目<\/p><figure class=\"g-fig g-wide\"><img src=\"shinzoku-assets/image4.png\" alt=\"サザエから見て、ノリスケは４親等、イクラは５親等。仮にイクラに子・孫がいれば６・７親等。\" width=\"1400\" height=\"155\" loading=\"lazy\"><\/figure><p class=\"g-sources\"><strong>根拠　<\/strong>民法第725～727条。　｜　<a href=\"https://laws.e-gov.go.jp/law/129AC0000000089\" target=\"_blank\" rel=\"noopener\">民法<\/a><\/p>", "<h3 class=\"g-theme\">夫婦を結ぶ線と、内縁の扱い<\/h3><div class=\"g-teach\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>サザエとマスオを結ぶ二重線は婚姻を示します。夫婦の間に親等はありません。マスオの母はサザエにとって１親等の姻族、マスオの兄・サケオは２親等の姻族です。夫婦には同居・協力・扶助の義務があります。<\/p><\/div><\/div><p class=\"g-figtitle\">サザエとマスオを結ぶ線<\/p><figure class=\"g-fig g-wide\"><img src=\"shinzoku-assets/image5.png\" alt=\"サザエとマスオを結ぶ二重線が婚姻を示す。\" width=\"1400\" height=\"244\" loading=\"lazy\"><\/figure><h4 class=\"g-h\">婚姻の成立から離婚まで<\/h4><div class=\"g-tablewrap g-stackwrap\"><table class=\"g-table g-stack\"><colgroup><col style=\"width:19.9%\"><col style=\"width:80.1%\"><\/colgroup><tr class=\"g-head\"><th scope=\"col\"><strong>場面<\/strong><\/th><th scope=\"col\"><strong>サザエとマスオに当てはめると<\/strong><\/th><\/tr><tr><th scope=\"row\"><strong>婚姻できる年齢<\/strong><\/th><td data-label=\"サザエとマスオに当てはめると\"><div class=\"g-teach g-small\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>男女とも18歳以上です。17歳では、父母が同意しても婚姻できません。<\/p><\/div><\/div><\/td><\/tr><tr><th scope=\"row\"><strong>婚姻の意思と届出<\/strong><\/th><td data-label=\"サザエとマスオに当てはめると\"><div class=\"g-teach g-small\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>二人に婚姻する意思があり、届出をして婚姻が成立します。成年被後見人も意思能力があれば、成年後見人の同意を得ずに婚姻できます。<\/p><\/div><\/div><\/td><\/tr><tr><th scope=\"row\"><strong>夫婦の扶助<\/strong><\/th><td data-label=\"サザエとマスオに当てはめると\"><div class=\"g-teach g-small\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>サザエとマスオには、同居し、互いに協力して扶助する義務があります。生活費を分担することもその一つです。<\/p><\/div><\/div><\/td><\/tr><tr><th scope=\"row\"><strong>協議離婚<\/strong><\/th><td data-label=\"サザエとマスオに当てはめると\"><div class=\"g-teach g-small\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>二人が合意し、届け出て離婚できます。合意できない場合は、家庭裁判所の調停などの手続があります。<\/p><\/div><\/div><\/td><\/tr><\/table><\/div><h4 class=\"g-h\">仮に、婚姻の届出をせずに暮らしていたら<\/h4><div class=\"g-teach\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>夫婦として共同生活を営む二人が、生前に内縁を解消した場合は、共同生活で築いた財産について分与が認められることがあります。<\/p><p><strong class=\"g-key\">健康保険・介護休業<\/strong>では、事実婚の相手も配偶者に含まれます。<strong class=\"g-key\">法定相続<\/strong>では、内縁の相手には配偶者としての相続権がありません。<\/p><\/div><\/div><p class=\"g-sources\"><strong>根拠　<\/strong>民法第731条・第738～739条・第752条・第763条・第768条・第890条、最決平成12年３月10日。　｜　<a href=\"https://laws.e-gov.go.jp/law/129AC0000000089\" target=\"_blank\" rel=\"noopener\">民法<\/a><\/p>", "<h3 class=\"g-theme\">生活を支える義務を負う人<\/h3><div class=\"g-teach\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>サザエから親子の線を上ると父の波平と母のフネ、下ると子のタラオがいます。この３人と、弟のカツオ・妹のワカメには、サザエとの間に<strong class=\"g-key\">相互の扶養義務<\/strong>があります。<\/p><\/div><\/div><p class=\"g-figtitle\">サザエの生活を支える義務を、続柄から見る<\/p><figure class=\"g-fig g-wide\"><img src=\"shinzoku-assets/image6.png\" alt=\"サザエの配偶者マスオの扶助、波平など直系血族・弟妹の相互扶養、海平などその他の３親等内の親族の条件を区別した図。\" width=\"1400\" height=\"543\" loading=\"lazy\"><\/figure><h4 class=\"g-h\">扶養義務が生じる根拠<\/h4><div class=\"g-tablewrap g-stackwrap\"><table class=\"g-table g-stack\"><colgroup><col style=\"width:19.9%\"><col style=\"width:24.4%\"><col style=\"width:55.6%\"><\/colgroup><tr class=\"g-head\"><th scope=\"col\"><strong>根拠<\/strong><\/th><th scope=\"col\"><strong>家系図の人<\/strong><\/th><th scope=\"col\"><strong>どのように決まるか<\/strong><\/th><\/tr><tr><th scope=\"row\"><strong>夫婦間の扶助<\/strong><\/th><td data-label=\"家系図の人\">夫のマスオ<\/td><td data-label=\"どのように決まるか\"><div class=\"g-teach g-small\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>夫婦が互いに生活を支えます（民法第752条）。<\/p><\/div><\/div><\/td><\/tr><tr><th scope=\"row\"><strong>直系血族・兄弟姉妹<\/strong><\/th><td data-label=\"家系図の人\">波平・フネ、タラオ、カツオ・ワカメなど<\/td><td data-label=\"どのように決まるか\"><div class=\"g-teach g-small\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>法律上、相互に扶養義務を負います（第877条第１項）。直系血族には、親等による上限がありません。<\/p><\/div><\/div><\/td><\/tr><tr><th scope=\"row\"><strong>その他の３親等内の親族<\/strong><\/th><td data-label=\"家系図の人\">伯父の海平、マスオの母、兄のサケオとその子ノリオなど<\/td><td data-label=\"どのように決まるか\"><div class=\"g-teach g-small\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>特別の事情があるとき、家庭裁判所が扶養義務を負わせることができます（同条第２項）。<\/p><\/div><\/div><\/td><\/tr><tr><th scope=\"row\"><strong>４親等のいとこ<\/strong><\/th><td data-label=\"家系図の人\">ノリスケ<\/td><td data-label=\"どのように決まるか\"><div class=\"g-teach g-small\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>傍系４親等のため、第１項・第２項のいずれにも該当しません。<\/p><\/div><\/div><\/td><\/tr><\/table><\/div><p class=\"g-figtitle\">生活保持義務と生活扶助義務<\/p><div class=\"g-teach\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>夫婦間や親の未成熟の子に対する扶養は、自分と同じ程度の生活を支える<strong class=\"g-key\">生活保持義務<\/strong>です。子が18歳を迎えても、自立して生活できるかを考えます。兄弟姉妹間では一般に、自分の生活を維持したうえで余力の範囲で支える<strong class=\"g-key\">生活扶助義務<\/strong>を負います。<\/p><\/div><\/div><p class=\"g-sources\"><strong>根拠　<\/strong>民法第730条（直系血族と同居の親族の互助）・第752条・第817条の12・第877条・第879条。　｜　<a href=\"https://laws.e-gov.go.jp/law/129AC0000000089\" target=\"_blank\" rel=\"noopener\">民法<\/a> ／ <a href=\"https://www.courts.go.jp/saiban/syurui/syurui_kazi/kazi_07_11/index.html\" target=\"_blank\" rel=\"noopener\">扶養請求調停<\/a><\/p>", "<h3 class=\"g-theme\">生活保護を申請できる人<\/h3><div class=\"g-teach\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>サザエが生活に困ったときは、自分で生活保護を申請できます。家族の同意を得ることや、別居の家族に先に援助を頼むことは、申請の条件ではありません。<\/p><\/div><\/div><p class=\"g-figtitle\">サザエのために生活保護を申請できる人<\/p><figure class=\"g-fig g-wide\"><img src=\"shinzoku-assets/image7.png\" alt=\"サザエの申請者となる本人・配偶者・扶養義務者・その他の同居の親族を区別する。例として、波平は別居でも、ノリスケは同居なら申請可能。\" width=\"1400\" height=\"543\" loading=\"lazy\"><\/figure><h4 class=\"g-h\">申請・扶養照会・保護の決定<\/h4><div class=\"g-tablewrap g-stackwrap\"><table class=\"g-table g-stack\"><colgroup><col style=\"width:17.1%\"><col style=\"width:27.2%\"><col style=\"width:55.6%\"><\/colgroup><tr class=\"g-head\"><th scope=\"col\"><strong>場面<\/strong><\/th><th scope=\"col\"><strong>家系図の人<\/strong><\/th><th scope=\"col\"><strong>何を確認するか<\/strong><\/th><\/tr><tr><th scope=\"row\"><strong>申請<\/strong><\/th><td data-label=\"家系図の人\">サザエ本人、配偶者、扶養義務者、その他の同居の親族<\/td><td data-label=\"何を確認するか\"><div class=\"g-teach g-small\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>父の波平は、別居していても扶養義務者として申請できます。いとこのノリスケは、サザエと同居していれば「その他の同居の親族」として申請できます。<\/p><\/div><\/div><\/td><\/tr><tr><th scope=\"row\"><strong>扶養照会<\/strong><\/th><td data-label=\"家系図の人\">援助が期待できる扶養義務者<\/td><td data-label=\"何を確認するか\"><div class=\"g-teach g-small\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>福祉事務所が、本人の事情を聴いて援助の見込みを確認します。虐待やＤＶなどにより扶養の履行を期待できない場合は、直接の照会を行わない取扱いがあります。<\/p><\/div><\/div><\/td><\/tr><tr><th scope=\"row\"><strong>保護の決定<\/strong><\/th><td data-label=\"家系図の人\">原則としてサザエの世帯<\/td><td data-label=\"何を確認するか\"><div class=\"g-teach g-small\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>扶養義務者による扶養は保護に優先します。実際に受けている仕送りなどを収入として考慮し、最低生活費に足りない分を補います。<\/p><\/div><\/div><\/td><\/tr><\/table><\/div><p class=\"g-figtitle\">サザエの申請と父の波平の扶養義務<\/p><div class=\"g-teach\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>親族に法律上の扶養義務があることと、現にその人から援助を受けられることは、別々に確認します。急迫した状況では、申請がなくても必要な保護を行うことができます。<\/p><\/div><\/div><p class=\"g-sources\"><strong>根拠　<\/strong>生活保護法第４条第２項・第７～８条・第10条。　｜　<a href=\"https://laws.e-gov.go.jp/law/325AC0000000144\" target=\"_blank\" rel=\"noopener\">生活保護法<\/a> ／ <a href=\"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/hukushi_kaigo/seikatsuhogo/seikatsuhogopage.html\" target=\"_blank\" rel=\"noopener\">生活保護の申請<\/a> ／ <a href=\"https://www.mhlw.go.jp/content/12501000/000978684.pdf\" target=\"_blank\" rel=\"noopener\">扶養照会の取扱い<\/a><\/p>", "<h3 class=\"g-theme\">別居でもよい人、同一世帯が必要な人<\/h3><div class=\"g-teach\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>サザエが会社で働き、勤務先の健康保険に加入していると仮定します。家族を被扶養者にできるかは、まず<strong class=\"g-key\">サザエから見た続柄<\/strong>で、次に<strong class=\"g-key\">同一世帯が必要か<\/strong>で判断します。<\/p><\/div><\/div><p class=\"g-figtitle\">サザエの健康保険で、被扶養者になり得る人<\/p><figure class=\"g-fig g-wide\"><img src=\"shinzoku-assets/image8.png\" alt=\"サザエの被扶養者。父母・弟妹・夫・子などは別居可、海平・マスオの母などは同一世帯が必要、ノリスケ・イクラは範囲外。\" width=\"1400\" height=\"543\" loading=\"lazy\"><\/figure><h4 class=\"g-h\">続柄と世帯の範囲<\/h4><div class=\"g-tablewrap g-stackwrap\"><table class=\"g-table g-stack\"><colgroup><col style=\"width:18.5%\"><col style=\"width:31.5%\"><col style=\"width:50.0%\"><\/colgroup><tr class=\"g-head\"><th scope=\"col\"><strong>世帯の条件<\/strong><\/th><th scope=\"col\"><strong>制度上の範囲<\/strong><\/th><th scope=\"col\"><strong>サザエの家族の場合<\/strong><\/th><\/tr><tr><th scope=\"row\"><strong>別居でも可<\/strong><\/th><td data-label=\"制度上の範囲\">配偶者（事実婚を含む）・直系尊属・子・孫・兄弟姉妹<\/td><td data-label=\"サザエの家族の場合\"><div class=\"g-teach g-small\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>弟のカツオや子のタラオは、別居していても、サザエが主に生計を支え、収入などの条件を満たせば対象になります。<\/p><\/div><\/div><\/td><\/tr><tr><th scope=\"row\"><strong>同一世帯が必要<\/strong><\/th><td data-label=\"制度上の範囲\">上の欄以外の３親等内の親族<\/td><td data-label=\"サザエの家族の場合\"><div class=\"g-teach g-small\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>伯父の海平やマスオの母は、サザエと同居し、家計を共にする必要があります。養子縁組していない再婚相手の子もこの区分です。<\/p><\/div><\/div><\/td><\/tr><tr><th scope=\"row\"><strong>範囲外<\/strong><\/th><td data-label=\"制度上の範囲\">上のいずれにも該当しない人<\/td><td data-label=\"サザエの家族の場合\"><div class=\"g-teach g-small\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>いとこのノリスケは傍系４親等です。同一世帯でサザエが生活費をすべて負担していても対象外です。<\/p><\/div><\/div><\/td><\/tr><\/table><\/div><p class=\"g-figtitle\">事実婚の相手と、その家族<\/p><div class=\"g-teach\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>事実婚の相手自身は別居でも対象になり得ます。その相手の父母・子には同一世帯の要件があります。相手の死亡後も、引き続き同一世帯で、生計維持などの要件を満たす場合は対象に含まれます。<\/p><\/div><\/div><p class=\"g-sources\"><strong>根拠　<\/strong>健康保険法第３条第７項。　｜　<a href=\"https://laws.e-gov.go.jp/law/211AC0000000070\" target=\"_blank\" rel=\"noopener\">健康保険法<\/a> ／ <a href=\"https://www.nenkin.go.jp/service/kounen/tekiyo/hihokensha1/20141202.html\" target=\"_blank\" rel=\"noopener\">被扶養者の認定<\/a><\/p><h3 class=\"g-theme\">続柄の次に、収入と加入先を確認する<\/h3><div class=\"g-teach\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>サザエが被保険者の場合、夫のマスオ、子のタラオ、父の波平は、いずれも続柄の範囲に入ります。次に、<strong class=\"g-key\">認定を受ける人の年齢<\/strong>で年間収入の基準を見分けます。<\/p><\/div><\/div><p class=\"g-figtitle\">３人の収入基準を比べる（タラオと波平の年齢は学習用の仮定）<\/p><figure class=\"g-fig g-wide\"><img src=\"shinzoku-assets/image9.png\" alt=\"収入基準の仮定例。夫マスオは原則130万円未満、20歳と仮定した子タラオは150万円未満、70歳と仮定した父波平は180万円未満。\" width=\"1400\" height=\"242\" loading=\"lazy\"><\/figure><h4 class=\"g-h\">年間収入の目安<\/h4><div class=\"g-tablewrap g-stackwrap\"><table class=\"g-table g-stack\"><colgroup><col style=\"width:31.7%\"><col style=\"width:18.8%\"><col style=\"width:49.4%\"><\/colgroup><tr class=\"g-head\"><th scope=\"col\"><strong>対象者<\/strong><\/th><th scope=\"col\"><strong>年間収入の基準<\/strong><\/th><th scope=\"col\"><strong>図の読み方<\/strong><\/th><\/tr><tr><th scope=\"row\"><strong>原則<\/strong><\/th><td data-label=\"年間収入の基準\">130万円未満<\/td><td data-label=\"図の読み方\"><div class=\"g-teach g-small\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>マスオが自分の勤務先の健康保険に加入していない場合の例です。19～22歳向けの150万円基準は、配偶者には適用されません。<\/p><\/div><\/div><\/td><\/tr><tr><th scope=\"row\"><strong>19歳以上23歳未満の人<\/strong><br><strong>（被保険者の配偶者を除く）<\/strong><\/th><td data-label=\"年間収入の基準\">150万円未満<\/td><td data-label=\"図の読み方\"><div class=\"g-teach g-small\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>タラオが20歳だと仮定した例です。学生かどうかは問いません。年齢は認定日の属する年の12月31日時点で判断します。<\/p><\/div><\/div><\/td><\/tr><tr><th scope=\"row\"><strong>60歳以上、または一定の障害がある人<\/strong><\/th><td data-label=\"年間収入の基準\">180万円未満<\/td><td data-label=\"図の読み方\"><div class=\"g-teach g-small\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>波平が70歳だと仮定した例です。障害の程度は、障害厚生年金の受給要件に当たる程度が目安です。<\/p><\/div><\/div><\/td><\/tr><\/table><\/div><h4 class=\"g-h\">生計維持・居住・本人の加入先<\/h4><div class=\"g-teach\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p><strong class=\"g-key\">生計維持<\/strong>　今後１年間の見込み収入で判断します。原則、同居なら対象者の収入がサザエの収入の２分の１未満、別居ならサザエからの仕送り額未満であることを確かめます。<\/p><p><strong class=\"g-key\">居住・加入先<\/strong>　原則として国内に住所が必要ですが、海外留学などの場合には例外があります。タラオが勤務先で健康保険の加入要件を満たせば、自分の勤務先で加入します。<\/p><p><strong class=\"g-key\">後期高齢者医療<\/strong>　波平が75歳になるなどして後期高齢者医療の被保険者になると、健康保険の被扶養者から外れます。65～74歳でも一定の障害の認定を受けて加入する場合があります。<\/p><\/div><\/div><p class=\"g-figtitle\">2026年４月からの取扱い<\/p><div class=\"g-teach\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>給与以外の収入が見込まれず、労働契約上の賃金から見込む年収が基準未満であるなど、所定の要件を満たす場合は、その契約内容に基づいて認定されます。<\/p><\/div><\/div><p class=\"g-sources\"><strong>根拠　<\/strong>健康保険法第３条、日本年金機構の被扶養者認定の取扱い。　｜　<a href=\"https://www.nenkin.go.jp/service/kounen/tekiyo/hihokensha1/20141202.html\" target=\"_blank\" rel=\"noopener\">被扶養者の認定<\/a> ／ <a href=\"https://www.nenkin.go.jp/oshirase/taisetu/2025/202508/0819.html\" target=\"_blank\" rel=\"noopener\">19～22歳の収入要件<\/a> ／ <a href=\"https://www.nenkin.go.jp/oshirase/taisetu/jigyosho/2026/202605/0501.html\" target=\"_blank\" rel=\"noopener\">労働契約と年間収入<\/a><\/p>", "<h3 class=\"g-theme\">３つの年金で「遺族」の範囲を比べる<\/h3><div class=\"g-teach\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>厚生年金に加入して働くサザエが亡くなり、サザエが家族の生計を支えていたと仮定します。子のタラオは３制度に登場します。弟のカツオと妹のワカメまで含むのは<strong class=\"g-key\">労災の遺族補償年金<\/strong>です。<\/p><\/div><\/div><p class=\"g-figtitle\">遺族になり得る続柄の範囲（年齢・順位は下表で確認）<\/p><figure class=\"g-fig g-wide\"><img src=\"shinzoku-assets/image10.png\" alt=\"遺族の続柄の範囲。夫と子は基礎・厚生・労災の一覧に登場する。父母・祖父母は厚生・労災、弟妹は労災のみ。年齢などは別に判定する。\" width=\"1400\" height=\"543\" loading=\"lazy\"><\/figure><h4 class=\"g-h\">家族の範囲と、給付を受けるための条件<\/h4><div class=\"g-tablewrap g-stackwrap\"><table class=\"g-table g-stack\"><colgroup><col style=\"width:18.5%\"><col style=\"width:30.3%\"><col style=\"width:51.1%\"><\/colgroup><tr class=\"g-head\"><th scope=\"col\"><strong>制度<\/strong><\/th><th scope=\"col\"><strong>続柄の範囲<\/strong><\/th><th scope=\"col\"><strong>家系図の人に当てはめると<\/strong><\/th><\/tr><tr><th scope=\"row\"><strong>遺族基礎年金<\/strong><\/th><td data-label=\"続柄の範囲\">子のある配偶者、または子<\/td><td data-label=\"家系図の人に当てはめると\"><div class=\"g-teach g-small\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>マスオは、要件を満たす子のタラオと生計を同じくしていれば「子のある配偶者」の候補です。<\/p><\/div><\/div><\/td><\/tr><tr><th scope=\"row\"><strong>遺族厚生年金<\/strong><\/th><td data-label=\"続柄の範囲\">配偶者・子・父母・孫・祖父母<\/td><td data-label=\"家系図の人に当てはめると\"><div class=\"g-teach g-small\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>夫・父母・祖父母は死亡当時55歳以上が要件です。28歳のマスオは対象外です。支給開始は原則60歳ですが、夫が遺族基礎年金を受けられる場合は特例があります。<\/p><\/div><\/div><\/td><\/tr><tr><th scope=\"row\"><strong>労災保険の<\/strong><br><strong>遺族補償年金<\/strong><\/th><td data-label=\"続柄の範囲\">配偶者・子・父母・孫・祖父母・兄弟姉妹<\/td><td data-label=\"家系図の人に当てはめると\"><div class=\"g-teach g-small\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>サザエが業務災害で死亡した場合です。カツオ・ワカメも年齢などの要件を満たせば候補となり、有資格者のうち最先順位の人が受給します。<\/p><\/div><\/div><\/td><\/tr><\/table><\/div><p class=\"g-figtitle\">「子」の年齢と配偶者の再婚<\/p><div class=\"g-teach\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>遺族基礎・厚生年金の「子」は未婚で、原則18歳到達年度の末日までです。障害等級１・２級に該当する場合は20歳未満です。配偶者が再婚（事実婚を含む）すると、その配偶者の遺族基礎年金の受給権は消滅します。<\/p><p>マスオが遺族基礎年金を受けている間は、タラオ自身への遺族基礎年金の支給は停止されます。同じ「夫」でも、遺族厚生年金では死亡時の年齢が受給を左右します。<\/p><\/div><\/div><p class=\"g-sources\"><strong>根拠　<\/strong>国民年金法第37条の２・第40～41条、厚生年金保険法第59条、労災保険法第16条の２。　｜　<a href=\"https://www.nenkin.go.jp/service/jukyu/seido/izokunenkin/jukyu-yoken/20150401-04.html\" target=\"_blank\" rel=\"noopener\">遺族基礎年金<\/a> ／ <a href=\"https://www.nenkin.go.jp/service/jukyu/seido/izokunenkin/jukyu-yoken/20150424.html\" target=\"_blank\" rel=\"noopener\">遺族厚生年金<\/a> ／ <a href=\"https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/0000154482.html\" target=\"_blank\" rel=\"noopener\">労災の遺族給付<\/a><\/p>", "<h3 class=\"g-theme\">介護のために休業できる家族<\/h3><div class=\"g-teach\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>サザエが働きながら家族を介護すると仮定します。自分の母のフネも、夫であるマスオの母も対象です。<strong class=\"g-key\">どちらの母についても、同居は条件ではありません。<\/strong><\/p><\/div><\/div><p class=\"g-figtitle\">サザエが介護する場合、どの家族が対象になるか<\/p><figure class=\"g-fig g-wide\"><img src=\"shinzoku-assets/image11.png\" alt=\"サザエの介護休業の対象となる家族。波平、フネ、タラオ、マスオ、マスオの母、カツオ、ワカメ、祖父母。伯父の海平やいとこのノリスケなどは範囲外。\" width=\"1400\" height=\"543\" loading=\"lazy\"><\/figure><h4 class=\"g-h\">法令に定める７つの続柄<\/h4><div class=\"g-tablewrap g-stackwrap\"><table class=\"g-table g-stack\"><colgroup><col style=\"width:17.7%\"><col style=\"width:29.8%\"><col style=\"width:52.5%\"><\/colgroup><tr class=\"g-head\"><th scope=\"col\"><strong>サザエとの関係<\/strong><\/th><th scope=\"col\"><strong>対象家族<\/strong><\/th><th scope=\"col\"><strong>範囲の境目<\/strong><\/th><\/tr><tr><th scope=\"row\"><strong>直系の家族<\/strong><\/th><td data-label=\"対象家族\">父母・子・祖父母・孫<\/td><td data-label=\"範囲の境目\"><div class=\"g-teach g-small\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>父の波平、母のフネ、子のタラオは対象です。別居の祖父母も対象です。曾祖父母は対象外です。子には養子も含みます。<\/p><\/div><\/div><\/td><\/tr><tr><th scope=\"row\"><strong>横に分かれる家族<\/strong><\/th><td data-label=\"対象家族\">兄弟姉妹<\/td><td data-label=\"範囲の境目\"><div class=\"g-teach g-small\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>カツオ・ワカメは対象です。伯父の海平やいとこのノリスケ、甥・姪は、同居していても対象外です。<\/p><\/div><\/div><\/td><\/tr><tr><th scope=\"row\"><strong>配偶者の側<\/strong><\/th><td data-label=\"対象家族\">配偶者（事実婚を含む）・配偶者の父母<\/td><td data-label=\"範囲の境目\"><div class=\"g-teach g-small\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>マスオ本人とマスオの母は対象です。マスオの兄・サケオは法定の対象家族に含まれません。<\/p><\/div><\/div><\/td><\/tr><\/table><\/div><h4 class=\"g-h\">介護休業の期間<\/h4><div class=\"g-teach\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>負傷・疾病・障害により、<strong class=\"g-key\">２週間以上にわたり常時介護を必要とする状態<\/strong>にある対象家族を介護するための休業です。対象家族１人につき、<strong class=\"g-key\">通算93日まで、３回まで<\/strong>に分けて取得できます。<\/p><\/div><\/div><p class=\"g-figtitle\">伯父の海平を、健康保険と比べる<\/p><div class=\"g-teach\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>健康保険では、海平はサザエと同一世帯で、生計維持・収入などの要件を満たせば被扶養者になり得ます。介護休業の対象家族には伯父が含まれないため、同居しても対象外です。<\/p><\/div><\/div><p class=\"g-sources\"><strong>根拠　<\/strong>育児・介護休業法第２条・第11～15条、同法施行規則第３条。　｜　<a href=\"https://www.mhlw.go.jp/seisakunitsuite/bunya/koyou_roudou/koyoukintou/ryouritsu/kaigo/leave/index.html\" target=\"_blank\" rel=\"noopener\">介護休業制度<\/a><\/p>", "<h3 class=\"g-theme\">後見を申し立てる人と、入院に同意する人<\/h3><div class=\"g-teach\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>サザエについて、いとこのノリスケは４親等内の親族として後見開始を申し立てられます。医療保護入院では、本人との続柄に加え、法律で定める<strong class=\"g-key\">「家族等」<\/strong>に該当するかを確認します。<\/p><\/div><\/div><p class=\"g-figtitle\">申立てと同意の両方に関われる人、どちらかに限られる人<\/p><figure class=\"g-fig g-wide\"><img src=\"shinzoku-assets/image12.png\" alt=\"夫のマスオと父母の波平・フネは後見申立てと医療保護入院の家族等の両方の候補。ノリスケは４親等のいとことして申立て可能。未成年のカツオは同意不可。\" width=\"1400\" height=\"385\" loading=\"lazy\"><\/figure><h4 class=\"g-h\">二つの手続で異なる「家族」の範囲<\/h4><div class=\"g-tablewrap g-stackwrap\"><table class=\"g-table g-stack\"><colgroup><col style=\"width:16.6%\"><col style=\"width:41.3%\"><col style=\"width:42.1%\"><\/colgroup><tr class=\"g-head\"><th scope=\"col\"><strong>手続<\/strong><\/th><th scope=\"col\"><strong>制度上、関われる人<\/strong><\/th><th scope=\"col\"><strong>家系図での具体例<\/strong><\/th><\/tr><tr><th scope=\"row\"><strong>後見開始の審判<\/strong><br><strong>の申立て<\/strong><\/th><td data-label=\"制度上、関われる人\"><div class=\"g-teach g-small\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>本人・配偶者・４親等内の親族・検察官などが申し立てられます。福祉関係法の要件を満たせば市町村長も申し立てられます。<\/p><\/div><\/div><\/td><td data-label=\"家系図での具体例\"><div class=\"g-teach g-small\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>いとこのノリスケは４親等の血族として申し立てられます。後見を開始する場合、家庭裁判所が成年後見人を選任します。<\/p><\/div><\/div><\/td><\/tr><tr><th scope=\"row\"><strong>医療保護入院<\/strong><br><strong>の家族等の同意<\/strong><\/th><td data-label=\"制度上、関われる人\"><div class=\"g-teach g-small\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>「家族等」に当たるのは、配偶者・親権を行う者・扶養義務者・後見人または保佐人です。未成年者や、本人に一定の暴力・虐待をした者などは除かれます。<\/p><\/div><\/div><\/td><td data-label=\"家系図での具体例\"><div class=\"g-teach g-small\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>夫のマスオや父母の波平・フネは候補です。弟のカツオ、妹のワカメ、子のタラオは未成年のため、家族等として同意できません。<\/p><\/div><\/div><\/td><\/tr><\/table><\/div><p class=\"g-figtitle\">海平がサザエの成年後見人に選任されたら<\/p><div class=\"g-teach\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>海平は、伯父という続柄だけで医療保護入院に同意する「家族等」には入りません。家庭裁判所がサザエの成年後見人に選任すれば、その資格で家族等に該当し得ます。親族でない成年後見人・保佐人も同様です。<\/p><p>医療保護入院には、精神保健指定医による診察・判定など、家族等の同意以外の法定要件もあります。<\/p><\/div><\/div><p class=\"g-sources\"><strong>根拠　<\/strong>民法第７条・第843条、精神保健福祉法第５条第２項・第33条。　｜　<a href=\"https://www.courts.go.jp/saiban/syurui/syurui_kazi/kazi_06_01/index.html\" target=\"_blank\" rel=\"noopener\">後見開始の申立て<\/a> ／ <a href=\"https://www.mhlw.go.jp/content/001525947.pdf\" target=\"_blank\" rel=\"noopener\">医療保護入院の家族等<\/a><\/p>", "<h3 class=\"g-theme\">配偶者と、先順位の血族が相続する<\/h3><div class=\"g-teach\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>サザエが亡くなったと仮定した場合、夫のマスオは相続放棄などがなければ常に相続人です。血族は、<strong class=\"g-key\">子の系統、直系尊属、兄弟姉妹の順<\/strong>に見ます。タラオが相続すれば、波平やカツオには順位が回りません。<\/p><\/div><\/div><p class=\"g-figtitle\">サザエの相続で見る、配偶者と血族の順位<\/p><figure class=\"g-fig g-wide\"><img src=\"shinzoku-assets/image13.png\" alt=\"サザエの相続人。配偶者はマスオ。血族はタラオが第１順位、波平・フネなど直系尊属が第２順位、カツオ・ワカメが第３順位。\" width=\"1400\" height=\"543\" loading=\"lazy\"><\/figure><h4 class=\"g-h\">配偶者と一緒に相続する血族の順位<\/h4><div class=\"g-tablewrap g-stackwrap\"><table class=\"g-table g-stack\"><colgroup><col style=\"width:15.4%\"><col style=\"width:52.5%\"><col style=\"width:32.0%\"><\/colgroup><tr class=\"g-head\"><th scope=\"col\"><strong>血族の順位<\/strong><\/th><th scope=\"col\"><strong>サザエの家族で見ると<\/strong><\/th><th scope=\"col\"><strong>配偶者がいる場合の法定相続分<\/strong><\/th><\/tr><tr><th scope=\"row\"><strong>第１順位<\/strong><\/th><td data-label=\"サザエの家族で見ると\"><div class=\"g-teach g-small\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>第１順位は、子のタラオです。仮にタラオが先に亡くなり、タラオに子がいれば、その子（サザエの孫）が代襲します。<\/p><\/div><\/div><\/td><td data-label=\"配偶者がいる場合の法定相続分\">マスオが１/２、子の側が合計１/２<\/td><\/tr><tr><th scope=\"row\"><strong>第２順位<\/strong><\/th><td data-label=\"サザエの家族で見ると\"><div class=\"g-teach g-small\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>第１順位がいない場合は波平・フネです。祖父母もいるときは、親等の近い父母が先です。<\/p><\/div><\/div><\/td><td data-label=\"配偶者がいる場合の法定相続分\">マスオが２/３、直系尊属が合計１/３<\/td><\/tr><tr><th scope=\"row\"><strong>第３順位<\/strong><\/th><td data-label=\"サザエの家族で見ると\"><div class=\"g-teach g-small\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>第１・第２順位がいない場合はカツオ・ワカメです。仮にカツオが先に亡くなり、子がいれば、その子が代襲します。<\/p><\/div><\/div><\/td><td data-label=\"配偶者がいる場合の法定相続分\">マスオが３/４、兄弟姉妹の側が合計１/４<\/td><\/tr><\/table><\/div><p class=\"g-figtitle\">代襲相続の境目<\/p><div class=\"g-teach\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>子の系統は孫、ひ孫へと再代襲することがあります。兄弟姉妹の系統から代襲できるのは甥・姪までです。<strong class=\"g-key\">相続放棄<\/strong>は代襲の原因になりません。子の系統では、先に死亡した場合のほか、相続欠格や廃除も代襲の原因になります。<\/p><p>法定相続分は法律上の持分です。遺言がなく、相続人全員が合意すれば、異なる割合で遺産を分けることもできます。<\/p><\/div><\/div><p class=\"g-sources\"><strong>根拠　<\/strong>民法第887条・第889～890条・第900条・第907条・第939条。　｜　<a href=\"https://laws.e-gov.go.jp/law/129AC0000000089\" target=\"_blank\" rel=\"noopener\">民法<\/a> ／ <a href=\"https://www.nta.go.jp/taxes/shiraberu/taxanswer/sozoku/4132.htm\" target=\"_blank\" rel=\"noopener\">法定相続人と相続分<\/a><\/p>", "<h3 class=\"g-theme\">離婚後も、父と母が子の養育を担う<\/h3><div class=\"g-teach\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>サザエとマスオが離婚したと仮定します。タラオは未成年です。どちらが親権者になるかにかかわらず、タラオから母のサザエ、父のマスオに伸びる親子の線は２本とも残ります。<\/p><\/div><\/div><p class=\"g-figtitle\">離婚を仮定したときの、タラオから見た父母（苗字は離婚前の表記）<\/p><figure class=\"g-fig g-wide\"><img src=\"shinzoku-assets/image14.png\" alt=\"仮に父母が離婚した場合も、タラオと父マスオ、タラオと母サザエの二つの親子関係が続く。\" width=\"1400\" height=\"272\" loading=\"lazy\"><\/figure><h4 class=\"g-h\">親権者と、子を扶養する人<\/h4><div class=\"g-tablewrap g-stackwrap\"><table class=\"g-table g-stack\"><colgroup><col style=\"width:24.7%\"><col style=\"width:75.3%\"><\/colgroup><tr class=\"g-head\"><th scope=\"col\"><strong>場面<\/strong><\/th><th scope=\"col\"><strong>母・サザエと父・マスオの扱い<\/strong><\/th><\/tr><tr><th scope=\"row\"><strong>離婚後の親権者<\/strong><\/th><td data-label=\"母・サザエと父・マスオの扱い\"><div class=\"g-teach g-small\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>2026年４月１日施行の改正民法により、父母の双方または一方を親権者と定めます。協議が調わない場合などは家庭裁判所が判断します。<\/p><\/div><\/div><\/td><\/tr><tr><th scope=\"row\"><strong>単独親権とすべき場合<\/strong><\/th><td data-label=\"母・サザエと父・マスオの扱い\"><div class=\"g-teach g-small\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>虐待によって子の心身に害を及ぼすおそれがある場合や、ＤＶなどにより共同で親権を行うことが困難な場合など、子の利益を害するときは、家庭裁判所は一方を親権者と定めます。<\/p><\/div><\/div><\/td><\/tr><tr><th scope=\"row\"><strong>共同親権での日常の行為<\/strong><\/th><td data-label=\"母・サザエと父・マスオの扱い\"><div class=\"g-teach g-small\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>食事や服装、通常の予防接種など、子の監護・教育に関する日常の行為は、サザエとマスオのどちらも単独で行えます。<\/p><\/div><\/div><\/td><\/tr><tr><th scope=\"row\"><strong>共同親権での重要な決定<\/strong><\/th><td data-label=\"母・サザエと父・マスオの扱い\"><div class=\"g-teach g-small\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>進学先の決定などは、原則として父母が共同で行います。子の利益のため急迫の事情があるときは、緊急の治療への同意などを一方の親が単独で行えます。<\/p><\/div><\/div><\/td><\/tr><tr><th scope=\"row\"><strong>養育費の分担<\/strong><\/th><td data-label=\"母・サザエと父・マスオの扱い\"><div class=\"g-teach g-small\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>仮にサザエだけが親権者になっても、マスオにもタラオを扶養する責務があります。父母は婚姻や親権の有無にかかわらず、子が自分と同程度の生活を送れるように支えます。<\/p><\/div><\/div><\/td><\/tr><\/table><\/div><p class=\"g-figtitle\">家系図に残る２本の線<\/p><div class=\"g-teach\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>タラオから見ると、離婚後もサザエとマスオはどちらも１親等の直系血族です。タラオの生活を支える責務は父母双方にあります。<\/p><\/div><\/div><p class=\"g-sources\"><strong>根拠　<\/strong>民法第766条・第817条の12・第819条・第824条の２。　｜　<a href=\"https://www.moj.go.jp/MINJI/minji07_00357.html\" target=\"_blank\" rel=\"noopener\">離婚後の親権・養育<\/a> ／ <a href=\"https://www.courts.go.jp/saiban/syurui/syurui_kazi/kazi_shinken/index.html\" target=\"_blank\" rel=\"noopener\">離婚後の親権者<\/a><\/p>", "<h3 class=\"g-theme\">同じ家族を、制度を変えて見比べる<\/h3><div class=\"g-teach\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>サザエを本人として、家系図で見てきた人物を制度ごとに並べました。たとえば「マスオの母」の行を横に読むと、健康保険と介護休業では、同居の扱いが異なることが分かります。<\/p><\/div><\/div><h4 class=\"g-h\">扶養義務・健康保険・介護休業<\/h4><div class=\"g-tablewrap\"><table class=\"g-table\"><colgroup><col style=\"width:23.6%\"><col style=\"width:27.0%\"><col style=\"width:27.0%\"><col style=\"width:22.5%\"><\/colgroup><tr class=\"g-head\"><th scope=\"col\"><strong>サザエから見た人<\/strong><\/th><th scope=\"col\"><strong>民法の扶助・扶養<\/strong><\/th><th scope=\"col\"><strong>健康保険の被扶養者<\/strong><\/th><th scope=\"col\"><strong>介護休業の対象<\/strong><\/th><\/tr><tr><th scope=\"row\"><strong>夫の<\/strong><strong><small>フグ田 <\/small><\/strong><strong>マスオ<\/strong><\/th><td>夫婦間の扶助<\/td><td>別居でも可<\/td><td>対象<\/td><\/tr><tr><th scope=\"row\"><strong><small>磯野 <\/small><\/strong><strong>波平・<\/strong><strong><small>磯野 <\/small><\/strong><strong>フネ、<\/strong><strong><small>フグ田 <\/small><\/strong><strong>タラオ<\/strong><\/th><td>相互に扶養<\/td><td>別居でも可<\/td><td>対象<\/td><\/tr><tr><th scope=\"row\"><strong><small>磯野 <\/small><\/strong><strong>カツオ・<\/strong><strong><small>磯野 <\/small><\/strong><strong>ワカメ<\/strong><\/th><td>相互に扶養<\/td><td>別居でも可<\/td><td>対象<\/td><\/tr><tr><th scope=\"row\"><strong><small>磯野 <\/small><\/strong><strong>海平（伯父）など<\/strong><\/th><td>家裁の判断で義務<\/td><td>同一世帯が必要<\/td><td>対象外<\/td><\/tr><tr><th scope=\"row\"><strong><small>波野 <\/small><\/strong><strong>ノリスケ（いとこ）<\/strong><\/th><td>扶養義務の範囲外<\/td><td>対象外<\/td><td>対象外<\/td><\/tr><tr><th scope=\"row\"><strong>マスオの母<\/strong><\/th><td>家裁の判断で義務<\/td><td>同一世帯が必要<\/td><td>対象<\/td><\/tr><tr><th scope=\"row\"><strong><small>フグ田 <\/small><\/strong><strong>サケオ（マスオの兄）<\/strong><\/th><td>家裁の判断で義務<\/td><td>同一世帯が必要<\/td><td>対象外<\/td><\/tr><tr><th scope=\"row\"><strong><small>フグ田 <\/small><\/strong><strong>ノリオ（夫の甥）<\/strong><\/th><td>家裁の判断で義務<\/td><td>同一世帯が必要<\/td><td>対象外<\/td><\/tr><\/table><\/div><div class=\"g-teach\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>「家裁の判断」は、特別の事情がある場合に家庭裁判所が扶養義務を負わせ得ることを示します。健康保険では、生計維持・収入などの要件も必要です。<\/p><\/div><\/div><h4 class=\"g-h\">弟・伯父・いとこで見分ける、申請・給付・相続<\/h4><div class=\"g-tablewrap\"><table class=\"g-table\"><colgroup><col style=\"width:32.6%\"><col style=\"width:22.5%\"><col style=\"width:22.5%\"><col style=\"width:22.5%\"><\/colgroup><tr class=\"g-head\"><th scope=\"col\"><strong>制度・手続<\/strong><\/th><th scope=\"col\"><strong><small>磯野 <\/small><\/strong><strong>カツオ（弟）<\/strong><\/th><th scope=\"col\"><strong><small>磯野 <\/small><\/strong><strong>海平（伯父）<\/strong><\/th><th scope=\"col\"><strong><small>波野 <\/small><\/strong><strong>ノリスケ（いとこ）<\/strong><\/th><\/tr><tr><th scope=\"row\"><strong>生活保護の申請<\/strong><\/th><td>別居でも可<\/td><td>同居なら可※<\/td><td>同居なら可<\/td><\/tr><tr><th scope=\"row\"><strong>遺族厚生年金<\/strong><\/th><td>対象外<\/td><td>対象外<\/td><td>対象外<\/td><\/tr><tr><th scope=\"row\"><strong>労災の遺族補償年金<\/strong><\/th><td>年齢等の要件あり<\/td><td>対象外<\/td><td>対象外<\/td><\/tr><tr><th scope=\"row\"><strong>後見開始の申立て<\/strong><\/th><td>申立て可<\/td><td>申立て可<\/td><td>申立て可<\/td><\/tr><tr><th scope=\"row\"><strong>法定相続<\/strong><\/th><td>第３順位<\/td><td>対象外<\/td><td>対象外<\/td><\/tr><\/table><\/div><div class=\"g-teach\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>※ 海平に家庭裁判所が扶養義務を課していない場合です。申請・申立ての欄では、カツオが成人した場面を想定します。<\/p><\/div><\/div><p class=\"g-figtitle\">いとこのノリスケに注目すると<\/p><div class=\"g-teach\"><img src=\"shinzoku-assets/teacher.png\" alt=\"\" width=\"56\" height=\"60\"><div class=\"g-bubble\"><p>ノリスケはサザエの<strong class=\"g-key\">４親等の血族<\/strong>です。後見開始は「４親等内の親族」として申し立てられます。健康保険の「その他の親族」は３親等内に限られるので、同一世帯でも被扶養者にはなれません。<\/p><\/div><\/div>"];

let answers={},results={},history={},settings={ruby:false,big:false},storageOK=true,readError=false;
function relatedTo(i){return DATA.past.filter(q=>q.categories.includes(i));}
function catQuestions(i){return [...DATA.questions.filter(q=>q.category===i),...relatedTo(i)];}
function catState(i){const qs=catQuestions(i),c=count(qs,'correct'),w=count(qs,'wrong');return c===qs.length?'perfect':c+w===qs.length?'done':c+w>0?'doing':'new';}
function hasAnswer(q,a){return q.kind==='tf'?[0,1].includes(a):Array.isArray(a)&&a.length>0;}
function isCorrect(q,a){return q.kind==='tf'?a===q.answer:Array.isArray(a)&&a.length===q.answer.length&&new Set(a).size===a.length&&q.answer.every(v=>a.includes(v));}

try{let saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved){if(saved.version!==1)throw Error('version');for(const q of ALL){const a=saved.answers?.[q.id];const valid=q.kind==='tf'?[0,1].includes(a):Array.isArray(a)&&a.length<=q.answer.length&&new Set(a).size===a.length&&a.every(v=>Number.isInteger(v)&&v>=1&&v<=5);if(valid)answers[q.id]=a;const r=saved.results?.[q.id];if(['correct','wrong','unanswered'].includes(r)&&r===(!hasAnswer(q,answers[q.id])?'unanswered':isCorrect(q,answers[q.id])?'correct':'wrong'))results[q.id]=r;const h=saved.history?.[q.id]||results[q.id];if(['correct','wrong','unanswered'].includes(h))history[q.id]=h;}settings={ruby:saved.settings?.ruby===true,big:saved.settings?.big===true};}}catch(e){if(e instanceof SyntaxError)readError=true;else storageOK=false;}

 const sw=active.view?`<div class="view-switch" role="group" aria-label="表示の切り替え"><button data-view="guide" aria-pressed="${active.view==='guide'}"><span>1</span>解説を読む</button><button data-view="quiz" aria-pressed="${active.view==='quiz'}"><span>2</span>問題を解く</button></div>`:'';
 if(active.view==='guide')return `<button data-action="home">← ${U('項目一覧へ')}</button><section class="session-head"><h2 tabindex="-1">${active.title}</h2></section>${sw}<article class="guide" style="--tone:${tones[active.category]}">${GUIDE[active.category]}</article><p class="guide-next"><button class="primary" data-view="quiz">問題を解く →</button></p>`;
 return `<button data-action="home">← ${U(mode==='past'?'過去問一覧へ':mode==='practice'?'五肢選択一覧へ':mode==='wrong'?'復習一覧へ':'項目一覧へ')}</button><section class="session-head"><h2 tabindex="-1">${active.title}</h2><p>${mixed?U('正しいと思う場合は○、誤りと思う場合は×を選んでください。')+U('問題ごとに、指定された数の選択肢を選んでください。'):U(qs.every(q=>q.kind==='tf')?'正しいと思う場合は○、誤りと思う場合は×を選んでください。':'回答後に採点すると、正答と根拠を確認できます。')}</p></section>${sw}${done?`<section class="result" role="status" tabindex="-1"><span>${U('得点')}</span><div><strong class="score">${s.correct}</strong> / ${s.total} ${U('点')} <span class="muted">（${Math.round(s.correct/s.total*100)}%）</span></div><p>${U(s.correct===s.total?'全問正解です。よく理解できています。':'解説を確認して、もう一度挑戦しましょう。')}</p>${active.category!==null&&['done','perfect'].includes(catState(active.category))?`<p class="cat-finish"><span class="cat-finish-mark">✓</span><span>「${DATA.categories[active.category]}」の学習が完了しました！</span><button class="primary" data-action="home">次の項目へ →</button></p>`:''}<div class="muted">${U('不正解')} ${s.wrong}　／　${U('未回答')} ${s.unanswered}</div><div class="actions"><button data-action="retry">${U('もう一度解く')}</button>${s.wrong?`<button data-action="sessionWrong">${U('間違えた問題')} ${s.wrong}${U('問')} →</button>`:''}</div></section>`:''}<div class="session-tools"><span class="muted" id="answered">${U('回答済み')} ${n} / ${qs.length}</span><span class="muted">${done?U('解答と解説'):'回答すると、1問ずつ正答と解説が表示されます。'}</span></div><div id="questions">${qs.map((q,i)=>(mixed&&(i===0||(q.kind==='past'&&qs[i-1].kind==='tf'))?`<h3 class="part-heading">${U(q.kind==='tf'?'○×問題':'五肢選択問題')} <span class="pill">${qs.filter(x=>x.kind===q.kind).length} ${U('問')}</span></h3>`:'')+question(q,i)).join('')}</div>${related.length?`<section class="session-head"><h3>${U('この項目の関連問題')}</h3><div class="related">${related.map(q=>`<button data-past="${q.id}">${q.label} →</button>`).join('')}</div></section>`:''}<div class="bottom-bar${done?' is-done':''}"><span id="bottomCount">${done?`<strong>全問の採点が終わりました　${U('得点')} ${s.correct} / ${s.total}</strong>`:`${U('回答済み')} ${n} / ${qs.length}`}</span><div class="tools"><button data-action="home">${U('戻る')}</button>${done?`<button data-action="retry">${U('もう一度解く')}</button><button class="primary" data-action="showResult">結果を見る ↑</button>`:''}</div></div>`;}
function render(){document.getElementById('app').innerHTML=(active?'':header())+(active?session():dashboard())+(readError?`<div class="notice">${U('保存した記録を読み込めませんでした。新しく開始します。')}</div>`:'');footer();applySettings();}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.mode){mode=b.dataset.mode;home();return;}
 if(b.dataset.cat!==undefined){const i=Number(b.dataset.cat);start([...DATA.questions.filter(q=>q.category===i),...relatedTo(i)],`${i+1}　${DATA.categories[i]}`,i,true);return;}
 if(b.dataset.view&&active){active.view=b.dataset.view;save();render();goTop();return;}
 if(b.dataset.past){const q=BYID[b.dataset.past];mode=q.group==='practice'?'practice':'past';start([q],q.label);return;}
 if(b.dataset.single){const q=BYID[b.dataset.single];start([q],q.kind==='tf'?U('○×問題')+' '+q.num:q.label);retry();return;}
 if(b.dataset.answer){const id=b.dataset.answer,q=BYID[id],v=Number(b.dataset.value);if(q.kind==='tf')answers[id]=v;else if(q.answer.length===1)answers[id]=[v];else{const prior=Array.isArray(answers[id])?answers[id]:[];answers[id]=prior.includes(v)?prior.filter(x=>x!==v):prior.length<q.answer.length?[...prior,v].sort((a,b)=>a-b):prior;}save();document.querySelectorAll(`[data-answer="${id}"]`).forEach(x=>{const yes=selected(q,answers[id],Number(x.dataset.value));x.setAttribute('aria-pressed',String(yes));if(q.kind==='past')x.disabled=q.answer.length>1&&answers[id].length>=q.answer.length&&!yes;});if(q.kind==='past')document.getElementById('choice-'+id).innerHTML=U('選択数')+' '+answers[id].length+' / '+q.answer.length+'　'+U(q.answer.length===2?'2つとも正解で1点です。':'1つ選んでください。');let n=active.ids.filter(id=>hasAnswer(BYID[id],answers[id])).length;for(const el of ['answered','bottomCount'])document.getElementById(el).innerHTML=U('回答済み')+' '+n+' / '+active.ids.length;if(q.kind==='past'){const g=document.querySelector(`[data-grade-one="${id}"]`);if(g)g.disabled=answers[id].length!==q.answer.length;footer();}else gradeOne(id);return;}
 if(b.dataset.gradeOne){gradeOne(b.dataset.gradeOne);return;}

 switch(b.dataset.action){case'home':mode='tf';home();break;case'allpast':{const qs=mode==='practice'?PRACTICE:EXAM;start(qs,U(mode==='practice'?'五肢選択問題':'本試験の過去問')+' '+qs.length+U('問'));break;}case'grade':gradeQuestions(active.ids.map(id=>BYID[id]));render();document.querySelector('.result')?.focus();document.querySelector('.result')?.scrollIntoView({behavior:'instant',block:'start'});break;case'retry':retry();break;case'summary':active={ids:[],title:'まとめ　制度別・続柄別の早見表',category:null,summary:true};render();goTop();break;case'showResult':document.querySelector('.result')?.focus({preventScroll:true});document.querySelector('.result')?.scrollIntoView({behavior:'instant',block:'start'});break;case'review':{const qs=ALL.filter(q=>status(q.id)==='wrong');start(qs,U('間違えた問題'));retry();break;}case'sessionWrong':{const qs=active.ids.map(id=>BYID[id]).filter(q=>status(q.id)==='wrong');start(qs,U('間違えた問題'));retry();break;}case'unanswered':{const qs=ALL.filter(q=>status(q.id)==='unanswered');start(qs,U('未回答の問題'));retry();break;}case'reset':if(confirm('このブラウザに保存した回答と採点結果をすべて消去します。よろしいですか？')){answers={};results={};history={};save();home();}break;}
});
save();render();
</script></body></html>
