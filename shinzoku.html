const ALL=[...DATA.questions,...DATA.past], BYID=Object.fromEntries(ALL.map(q=>[q.id,q])), KEY='itosoken-kinship-v1';
const EXAM=DATA.past.filter(q=>q.group==='exam'), PRACTICE=DATA.past.filter(q=>q.group==='practice');
const U=s=>DATA.ui[s]||s;
const tones=['#247c69','#aa6b2d','#6f64a6','#357ea1','#626f89','#a75e61','#718844','#9b6b91','#3d8992','#9a7443'];
let answers={},results={},history={},settings={ruby:false,big:false},storageOK=true,readError=false;
function hasAnswer(q,a){return q.kind==='tf'?[0,1].includes(a):Array.isArray(a)&&a.length>0;}
function isCorrect(q,a){return q.kind==='tf'?a===q.answer:Array.isArray(a)&&a.length===q.answer.length&&new Set(a).size===a.length&&q.answer.every(v=>a.includes(v));}
function answerLabel(q,a){return !hasAnswer(q,a)?U('未回答'):q.kind==='tf'?(a?'○':'×'):[...a].sort((x,y)=>x-y).join('・');}
function selected(q,a,v){return q.kind==='tf'?a===v:Array.isArray(a)&&a.includes(v);}
try{let saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved){if(saved.version!==1)throw Error('version');for(const q of ALL){const a=saved.answers?.[q.id];const valid=q.kind==='tf'?[0,1].includes(a):Array.isArray(a)&&a.length<=q.answer.length&&new Set(a).size===a.length&&a.every(v=>Number.isInteger(v)&&v>=1&&v<=5);if(valid)answers[q.id]=a;const r=saved.results?.[q.id];if(['correct','wrong','unanswered'].includes(r)&&r===(!hasAnswer(q,answers[q.id])?'unanswered':isCorrect(q,answers[q.id])?'correct':'wrong'))results[q.id]=r;const h=saved.history?.[q.id]||results[q.id];if(['correct','wrong','unanswered'].includes(h))history[q.id]=h;}settings={ruby:saved.settings?.ruby===true,big:saved.settings?.big===true};}}catch(e){if(e instanceof SyntaxError)readError=true;else storageOK=false;}

let mode='tf',active=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify({version:1,answers,results,history,settings}));storageOK=true;}catch(e){storageOK=false;}}
function status(id){return history[id]||'';}
function count(qs,which){return qs.filter(q=>status(q.id)===which).length;}
function scoreQuestions(qs,a){return qs.reduce((s,q)=>{if(!hasAnswer(q,a[q.id]))s.unanswered++;else if(isCorrect(q,a[q.id]))s.correct++;else s.wrong++;return s;},{correct:0,wrong:0,unanswered:0,total:qs.length});}
function gradeQuestions(qs){for(const q of qs){results[q.id]=!hasAnswer(q,answers[q.id])?'unanswered':isCorrect(q,answers[q.id])?'correct':'wrong';history[q.id]=results[q.id];}save();}
function applySettings(){document.body.classList.toggle('ruby-off',!settings.ruby);document.body.classList.toggle('big',settings.big);for(const [id,v] of [['rubyOn',settings.ruby],['rubyOff',!settings.ruby],['fontSize',settings.big]]){const b=document.getElementById(id);b.classList.toggle('selected',v);b.setAttribute('aria-pressed',String(v));}}
document.getElementById('rubyOn').onclick=()=>{settings.ruby=true;save();applySettings();};
document.getElementById('rubyOff').onclick=()=>{settings.ruby=false;save();applySettings();};
document.getElementById('fontSize').onclick=()=>{settings.big=!settings.big;save();applySettings();};
function nav(){return `<nav class="nav" aria-label="学習メニュー">${[['tf','○×問題',DATA.questions.length],['practice','五肢選択問題',PRACTICE.length],['past','本試験の過去問',EXAM.length],['wrong','間違えた問題',count(ALL,'wrong')]].map(([m,t,n])=>`<button data-mode="${m}" class="${mode===m?'selected':''}" aria-pressed="${mode===m}">${U(t)} <b>${n}</b></button>`).join('')}</nav>`;}

function dashboard(){
 if(mode==='tf')return `<div class="section-heading"><h2>${U('項目を選んで学習')}</h2><button data-action="alltf">${U('全問に挑戦')} →</button></div><div class="grid">${DATA.categories.map((title,i)=>{const qs=DATA.questions.filter(q=>q.category===i),c=count(qs,'correct');return `<button class="tile" data-cat="${i}" style="--tone:${tones[i]}"><div class="tile-head"><span class="number">${i+1}</span><span class="pill">${qs.length} ${U('問')}</span></div><div class="tile-name">${title}</div><div class="tile-foot">${U('正解数')} ${c} / ${qs.length}</div><div class="track"><div class="fill" style="width:${c/qs.length*100}%"></div></div></button>`;}).join('')}</div>`;

 const wrong=ALL.filter(q=>status(q.id)==='wrong');const unanswered=ALL.filter(q=>status(q.id)==='unanswered');return `<div class="section-heading"><h2>${U('間違えた問題')} ${wrong.length}${U('問')}</h2></div>${wrong.length?`<p class="muted">${U('解説を確認して、もう一度挑戦しましょう。')}</p><div class="actions"><button class="primary" data-action="review">${U('もう一度解く')} →</button></div><div class="grid">${wrong.map(q=>`<button class="tile" data-single="${q.id}" style="--tone:#a75e61"><span class="tile-name">${q.kind==='tf'?U('○×問題')+' '+q.num:q.label}</span><span class="tile-foot">${q.kind==='tf'?DATA.categories[q.category]:U(q.group==='practice'?'五肢選択問題':'本試験の過去問')}</span></button>`).join('')}</div>`:`<div class="empty"><h3>${U('まだ該当する問題はありません。')}</h3><p class="muted">${U('問題を解いて採点すると、復習する問題が表示されます。')}</p></div>`}${unanswered.length?`<div class="actions"><button data-action="unanswered">${U('未回答の問題')} ${unanswered.length}${U('問')} →</button></div>`:''}`;
}
function question(q,i){const graded=Boolean(results[q.id]),a=answers[q.id],s=results[q.id],label=s==='correct'?'正解':s==='wrong'?'不正解':'未回答';return `<article class="question" id="q-${q.id}" aria-label="問題${q.num}"><div class="q-top"><span class="q-num">${q.kind==='tf'?U('問題')+' '+q.num:q.label}</span>${graded?`<span class="status-${s}">${U(label)}</span>`:`<span class="muted">${i+1} / ${active.ids.length}</span>`}</div><div class="${q.kind==='tf'?'tf-layout':''}"><div><p class="q-text">${q.text}</p>${q.source?`<p class="source">${q.source}</p>`:''}</div>${q.kind==='tf'?`<div class="tf-options" role="group" aria-label="問題${q.num}の回答">${[1,0].map(v=>`<button data-answer="${q.id}" data-value="${v}" aria-label="${v?'○ 正しい':'× 誤り'}" aria-pressed="${a===v}" ${graded?'disabled':''}>${v?'○':'×'}</button>`).join('')}</div>`:''}</div>${q.case?`<div class="case"><strong>${U('事例')}</strong>${q.case}${q.note?`<p class="source">${q.note}</p>`:''}</div>`:''}${q.kind==='past'?`<p class="choice-count" id="choice-${q.id}" aria-live="polite">${U('選択数')} ${a?.length||0} / ${q.answer.length}　${q.answer.length===2?U('2つとも正解で1点です。'):U('1つ選んでください。')}</p><div class="options" role="group" aria-label="選択肢">${q.options.map((text,j)=>`<button class="option" data-answer="${q.id}" data-value="${j+1}" aria-pressed="${selected(q,a,j+1)}" ${(graded||(q.answer.length>1&&a?.length>=q.answer.length&&!selected(q,a,j+1)))?'disabled':''}><span class="opt-num">${j+1}</span><span>${text}</span></button>`).join('')}</div>`:''}${graded?`<div class="explanation"><div class="key">${U('正答')}：${answerLabel(q,q.answer)} <small class="muted">${U('回答')}：${answerLabel(q,a)}</small></div>${q.kind==='tf'?`<p>${q.explanation}</p>`:`<h3>${U('選択肢ごとの解説')}</h3><ol>${q.explanations.map((e,j)=>`<li><span class="verdict ${q.answer.includes(j+1)?'status-correct':'status-wrong'}">${j+1}　${q.answer.includes(j+1)?'○':'×'}</span>${e}</li>`).join('')}</ol>`}</div>`:''}</article>`;}
function session(){const qs=active.ids.map(id=>BYID[id]),done=qs.every(q=>results[q.id]),n=qs.filter(q=>hasAnswer(q,answers[q.id])).length,s=scoreQuestions(qs,answers);let related=active.category===null?[]:DATA.past.filter(q=>q.categories.includes(active.category));return `<button data-action="home">← ${U(mode==='past'?'過去問一覧へ':mode==='practice'?'五肢選択一覧へ':mode==='wrong'?'復習一覧へ':'項目一覧へ')}</button><section class="session-head"><h2 tabindex="-1">${active.title}</h2><p>${U(qs.every(q=>q.kind==='tf')?'正しいと思う場合は○、誤りと思う場合は×を選んでください。':'回答後に採点すると、正答と根拠を確認できます。')}</p></section>${done?`<section class="result" role="status" tabindex="-1"><span>${U('得点')}</span><div><strong class="score">${s.correct}</strong> / ${s.total} ${U('点')} <span class="muted">（${Math.round(s.correct/s.total*100)}%）</span></div><p>${U(s.correct===s.total?'全問正解です。よく理解できています。':'解説を確認して、もう一度挑戦しましょう。')}</p><div class="muted">${U('不正解')} ${s.wrong}　／　${U('未回答')} ${s.unanswered}</div><div class="actions"><button data-action="retry">${U('もう一度解く')}</button>${s.wrong?`<button data-action="sessionWrong">${U('間違えた問題')} ${s.wrong}${U('問')} →</button>`:''}</div></section>`:''}<div class="session-tools"><span class="muted" id="answered">${U('回答済み')} ${n} / ${qs.length}</span><span class="muted">${done?U('解答と解説'):U('採点前です。回答を選んでください。')}</span></div><div id="questions">${qs.map(question).join('')}</div>${related.length?`<section class="session-head"><h3>${U('この項目の関連問題')}</h3><div class="related">${related.map(q=>`<button data-past="${q.id}">${q.label} →</button>`).join('')}</div></section>`:''}<div class="bottom-bar"><span id="bottomCount">${U('回答済み')} ${n} / ${qs.length}</span><div class="tools"><button data-action="home">${U('戻る')}</button><button class="primary" data-action="${done?'retry':'grade'}">${U(done?'もう一度解く':'採点する')}</button></div></div>`;}
function render(){document.getElementById('app').innerHTML=(active?'':header())+nav()+(active?session():dashboard())+(readError?`<div class="notice">${U('保存した記録を読み込めませんでした。新しく開始します。')}</div>`:'');footer();applySettings();}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.mode){mode=b.dataset.mode;home();return;}
 if(b.dataset.cat!==undefined){const i=Number(b.dataset.cat);start(DATA.questions.filter(q=>q.category===i),`${i+1}　${DATA.categories[i]}`,i);return;}
 if(b.dataset.past){const q=BYID[b.dataset.past];mode=q.group==='practice'?'practice':'past';start([q],q.label);return;}
 if(b.dataset.single){const q=BYID[b.dataset.single];start([q],q.kind==='tf'?U('○×問題')+' '+q.num:q.label);retry();return;}
 if(b.dataset.answer){const id=b.dataset.answer,q=BYID[id],v=Number(b.dataset.value);if(q.kind==='tf')answers[id]=v;else if(q.answer.length===1)answers[id]=[v];else{const prior=Array.isArray(answers[id])?answers[id]:[];answers[id]=prior.includes(v)?prior.filter(x=>x!==v):prior.length<q.answer.length?[...prior,v].sort((a,b)=>a-b):prior;}save();document.querySelectorAll(`[data-answer="${id}"]`).forEach(x=>{const yes=selected(q,answers[id],Number(x.dataset.value));x.setAttribute('aria-pressed',String(yes));if(q.kind==='past')x.disabled=q.answer.length>1&&answers[id].length>=q.answer.length&&!yes;});if(q.kind==='past')document.getElementById('choice-'+id).innerHTML=U('選択数')+' '+answers[id].length+' / '+q.answer.length+'　'+U(q.answer.length===2?'2つとも正解で1点です。':'1つ選んでください。');let n=active.ids.filter(id=>hasAnswer(BYID[id],answers[id])).length;for(const el of ['answered','bottomCount'])document.getElementById(el).innerHTML=U('回答済み')+' '+n+' / '+active.ids.length;footer();return;}

 switch(b.dataset.action){case'home':home();break;case'alltf':start(DATA.questions,U('○×問題')+' '+DATA.questions.length+U('問'));break;case'allpast':{const qs=mode==='practice'?PRACTICE:EXAM;start(qs,U(mode==='practice'?'五肢選択問題':'本試験の過去問')+' '+qs.length+U('問'));break;}case'grade':gradeQuestions(active.ids.map(id=>BYID[id]));render();document.querySelector('.result')?.focus();document.querySelector('.result')?.scrollIntoView({behavior:'instant',block:'start'});break;case'retry':retry();break;case'review':{const qs=ALL.filter(q=>status(q.id)==='wrong');start(qs,U('間違えた問題'));retry();break;}case'sessionWrong':{mode='wrong';const qs=active.ids.map(id=>BYID[id]).filter(q=>status(q.id)==='wrong');start(qs,U('間違えた問題'));retry();break;}case'unanswered':{const qs=ALL.filter(q=>status(q.id)==='unanswered');start(qs,U('未回答の問題'));retry();break;}case'reset':if(confirm('このブラウザに保存した回答と採点結果をすべて消去します。よろしいですか？')){answers={};results={};history={};save();home();}break;}
});
save();render();
</script></body></html>
