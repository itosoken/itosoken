/* <![CDATA[ */
(()=>{
'use strict';
const host=document.currentScript.previousElementSibling;
const root=host.attachShadow({mode:'open'});
const QUESTIONS=[{"id":1,"question":"Ａさん（76 歳，女性，要支援1 ）は，一人暮らしである。週1 回介護予防 通所リハビリテーションを利用しながら，近所の友人たちとの麻雀を楽しみに生 活している。最近，膝に痛みを感じ，変形性膝関節症（knee osteoarthritis）と診断された。同時期に友人が入院し，楽しみにしていた麻雀ができなくなった。Ａさんは徐々に今後の生活に不安を感じるようになった。ある日，「自宅で暮らし続けたいけど，心配なの…」と介護福祉職に話した。Ａさんに対する介護福祉職の対応として，最も適切なものを1 つ選びなさい。","options":["要介護認定の申請を勧める。","友人のお見舞いを勧める。","膝の精密検査を勧める。","別の趣味活動の希望を聞く。","生活に対する思いを聞く。"],"answer":[5],"subject":0,"explanation":"まず本人の生活への思いと不安を聴き、自宅で暮らす希望を支える方法を考えます。"},{"id":2,"question":"次の記述のうち，介護を必要とする人の自立についての考え方として，最も適切なものを1 つ選びなさい。","options":["自立は，他者の支援を受けないことである。","精神的自立は，生活の目標をもち，自らが主体となって物事を進めていくことである。","社会的自立は，社会的な役割から離れて自由になることである。","身体的自立は，介護者の身体的負担を軽減することである。","経済的自立は，経済活動や社会活動に参加せずに，生活を営むことである。"],"answer":[2],"subject":0,"explanation":"精神的自立とは、自分の目標や意思をもち、主体的に生活することです。支援を受けても自立は成り立ちます。"},{"id":3,"question":"Ｕ介護老人福祉施設では，利用者の介護計画を担当の介護福祉職が作成している。このため，利用者の個別の介護目標を，介護福祉職のチーム全員で共有することが課題になっている。この課題を解決するための取り組みとして，最も適切なものを1 つ選びなさい。","options":["管理職がチーム全体に注意喚起して，集団規範を形成する。","現場経験の長い介護福祉職の意見を優先して，同調行動を促す。","チームメンバーの懇談会を実施して，内集団バイアスを強化する。","チームメンバー間の集団圧力を利用して，多数派の意見に統一する。","担当以外のチームメンバーもカンファレンス（conference）に参加して，集団凝 集性を高める。"],"answer":[5],"subject":1,"explanation":"担当者以外も話し合いに参加すると、目標を共有でき、チームのまとまりが高まります。"},{"id":4,"question":"Ｂさん（90 歳，女性，要介護3 ）は，介護老人福祉施設に入所している。入浴日に，担当の介護福祉職が居室を訪問し，「Ｂさん，今日はお風呂の日です。時間は午後3 時からです」と伝えた。しかし，Ｂさんは言っていることがわからなかったようで，「はい，何ですか」と困った様子で言った。このときの，介護福祉職の準言語を活用した対応として，最も適切なものを1 つ選びなさい。","options":["強い口調で伝えた。","抑揚をつけずに伝えた。","大きな声でゆっくり伝えた。","急かすように伝えた。","早口で伝えた。"],"answer":[3],"subject":1,"explanation":"準言語には声の大きさや速さ、抑揚などがあります。聞き取りやすい声でゆっくり伝えます。"},{"id":5,"question":"Ｖ介護老人福祉施設では，感染症が流行したために，緊急的な介護体 制で事業を継続することになった。さらに労務管理を担当する職員からは，介護 福祉職の精神的健康を守ることを目的とした組織的なマネジメントに取り組む必要 性について提案があった。次の記述のうち，このマネジメントに該当するものとして，最も適切なものを 1 つ選びなさい。","options":["感染防止対策を強化する。","多職種チームでの連携を強化する。","利用者のストレスをコントロールする。","介護福祉職の燃え尽き症候群（バーンアウト（burnout））を防止する。","利用者家族の面会方法を見直す。"],"answer":[4],"subject":1,"explanation":"職員の精神的健康を守るには、負担を調整し、燃え尽き症候群を予防する取り組みが必要です。"},{"id":6,"question":"次のうち，介護老人福祉施設における全体の指揮命令系統を把握するために必要なものとして，最も適切なものを1 つ選びなさい。","options":["組織図","勤務表","経営理念","施設の歴史","資格保有者数"],"answer":[1],"subject":1,"explanation":"組織図を見ると、各部署の関係や指揮命令の流れを把握できます。"},{"id":7,"question":"次のうち，セルフヘルプグループ（self-help group）の活動に該当するものとして，最も適切なものを1 つ選びなさい。","options":["断酒会","施設の社会貢献活動","子ども食堂の運営","傾聴ボランティア","地域の町内会"],"answer":[1],"subject":2,"explanation":"断酒会は、同じ悩みをもつ当事者が経験を分かち合い、支え合う自助グループです。"},{"id":8,"question":"特定非営利活動法人（ＮＰＯ法人）に関する次の記述のうち，最も適切なものを1 つ選びなさい。","options":["社会福祉法に基づいて設置される。","市町村が認証する。","保健，医療又は福祉の増進を図る活動が最も多い。","収益活動は禁じられている。","宗教活動を主たる目的とする団体もある。"],"answer":[3],"subject":2,"explanation":"試験時点では、ＮＰＯ法人の活動分野で最も多いのは、保健・医療・福祉の増進です。"},{"id":9,"question":"地域福祉において，19 世紀後半に始まった，貧困地域に住み込んで実態 調査を行いながら住民への教育や生活上の援助を行ったものとして，最も適 切なものを1 つ選びなさい。","options":["世界保健機関（ＷＨＯ）","福祉事務所","地域包括支援センター","生活協同組合","セツルメント"],"answer":[5],"subject":2,"explanation":"セツルメントは、支援者が地域に住み込み、住民と共に生活課題の解決に取り組む活動です。"},{"id":10,"question":"社会福祉基礎構造改革に関する次の記述のうち，適切なものを1 つ選びなさい。","options":["社会福祉法が社会福祉事業法に改正された。","利用契約制度から措置制度に変更された。","サービス提供事業者は，社会福祉法人に限定された。","障害福祉分野での制度改正は見送られた。","判断能力が不十分な者に対する地域福祉権利擁護事業が創設された。"],"answer":[5],"subject":2,"explanation":"改革では利用者の権利擁護を重視し、判断能力が不十分な人を支える地域福祉権利擁護事業が創設されました。"},{"id":11,"question":"Ｃさん（77 歳，男性）は，60 歳で公務員を定年退職し，年金生活をしている。持病や障害はなく，退職後も趣味のゴルフを楽しみながら健康に過ごしている。ある日，Ｃさんはゴルフ中にけがをして医療機関を受診した。このとき，Ｃさんに適用される公的医療制度として，正しいものを1 つ選びなさい。","options":["国民健康保険","後期高齢者医療制度","共済組合保険","育成医療","更生医療"],"answer":[2],"subject":2,"explanation":"原則として75歳以上の人は、後期高齢者医療制度の対象です。以前の職業では判断しません。"},{"id":12,"question":"次のうち，介護保険法に基づき，都道府県・指定都市・中核市が指定（許 可），監督を行うサービスとして，正しいものを1 つ選びなさい。","options":["地域密着型介護サービス","居宅介護支援","施設サービス","夜間対応型訪問介護","介護予防支援"],"answer":[3],"subject":2,"explanation":"施設サービスの指定・許可や監督は、都道府県や権限をもつ指定都市・中核市が行います。"},{"id":13,"question":"「障害者差別解消法」に関する次の記述のうち，適切なものを1 つ選びなさい。","options":["法の対象者は，身体障害者手帳を交付された者に限定されている。","合理的配慮は，実施するときの負担の大小に関係なく提供する。","個人による差別行為への罰則規定がある。","雇用分野での，障害を理由とした使用者による虐待の禁止が目的である。","障害者基本法の基本的な理念を具体的に実施するために制定された。"],"answer":[5],"subject":2,"note":" 「障害者差別解消法」とは，「障害を理由とする差別の解消の推進に関する法律」のことである。","explanation":"障害者差別解消法は、障害者基本法の差別禁止の理念を具体化する法律です。"},{"id":14,"question":"「障害者総合支援法」に規定された移動に関する支援の説明として，最も適切なものを1 つ選びなさい。","options":["移動支援については，介護給付費が支給される。","行動援護は，周囲の状況把握ができない視覚障害者が利用する。","同行援護は，危険を回避できない知的障害者が利用する。","重度訪問介護は，重度障害者の外出支援も行う。","共同生活援助（グループホーム）は，地域で生活する障害者の外出支援を行う。"],"answer":[4],"subject":2,"note":" 「障害者総合支援法」とは，「障害者の日常生活及び社会生活を総合的に支援するための法律」のことである。","explanation":"重度訪問介護には、居宅内の介護だけでなく、外出時の移動の支援も含まれます。"},{"id":15,"question":"Ｄさん（80 歳，男性，要介護2 ）は，認知症（dementia）がある。訪問介護（ホームヘルプサービス）を利用しながら一人暮らしをしている。ある日，訪問介護員（ホームヘルパー）がＤさんの自宅を訪問すると，近所に住むＤさんの長女から，「父が，高額な投資信託の電話勧誘を受けて，契約しようかどうか悩んでいるようで心配だ」と相談された。訪問介護員（ホームヘルパー）が長女に助言する相談先として，最も適切なものを1 つ選びなさい。","options":["公正取引委員会","都道府県障害者権利擁護センター","運営適正化委員会","消費生活センター","市町村保健センター"],"answer":[4],"subject":2,"explanation":"契約や勧誘などの消費者トラブルは、消費生活センターに相談できます。"},{"id":16,"question":"災害時の福祉避難所に関する次の記述のうち，適切なものを1 つ選びなさい。","options":["介護老人福祉施設の入所者は，原則として福祉避難所の対象外である。","介護保険法に基づいて指定される避難所である。","医療的ケアを必要とする者は対象にならない。","訪問介護員（ホームヘルパー）が，災害対策基本法に基づいて派遣される。","同行援護のヘルパーが，災害救助法に基づいて派遣される。"],"answer":[1],"subject":2,"explanation":"福祉避難所は主に在宅の要配慮者を対象とします。施設入所者は原則として入所施設で対応します。"},{"id":17,"question":"「感染症法」に基づいて，結核（tuberculosis）を発症した在宅の高齢者に，医療費の公費負担の申請業務や家庭訪問指導などを行う機関として，適切なものを1 つ選びなさい。","options":["基幹相談支援センター","地域活動支援センター","保健所","老人福祉センター","医療保護施設"],"answer":[3],"subject":2,"note":" 「感染症法」とは，「感染症の予防及び感染症の患者に対する医療に関する法律」のことである。","explanation":"保健所は、結核の公費負担に関する手続きや家庭訪問などを行います。"},{"id":18,"question":"Ｅさん（55 歳，女性，障害の有無は不明）は，ひきこもりの状態にあり，就労していない。父親の年金で父親とアパートで暮らしていたが，父親が亡くなり，一人暮らしになった。遠方に住む弟は，姉が家賃を滞納していて，生活に困っているようだと，家主から連絡を受けた。心配した弟が相談する機関として，最も適切なものを1 つ選びなさい。","options":["地域包括支援センター","福祉事務所","精神保健福祉センター","公共職業安定所（ハローワーク）","年金事務所"],"answer":[2],"subject":2,"explanation":"生活費や住まいに困っているため、生活保護などの相談窓口である福祉事務所が適切です。"},{"id":19,"question":"次のうち，マズロー（Maslow, A.H.）の欲求階層説で成長欲求に該当するものとして，正しいものを1 つ選びなさい。","options":["承認欲求","安全欲求","自己実現欲求","生理的欲求","所属・愛情欲求"],"answer":[3],"subject":3,"explanation":"自己実現欲求は、自分の可能性を発揮し、成長しようとする欲求です。"},{"id":20,"question":"次のうち，交感神経の作用に該当するものとして，正しいものを1 つ選びなさい。","options":["血管収縮","心拍数減少","気道収縮","消化促進","瞳孔収縮"],"answer":[1],"subject":3,"explanation":"交感神経は活動時に働き、多くの血管を収縮させ、心拍数を増やします。"},{"id":21,"question":"Ｆさん（82 歳，女性）は，健康診断で骨粗鬆症（osteoporosis）と診断され，内服治療が開始された。杖歩行で時々ふらつくが，ゆっくりと自立歩行することができる。昼間は自室にこもり，ベッドで横になっていることが多い。リハビリテーションとして週3 日歩行訓練を行い，食事は普通食を毎食8 割以上摂取している。Ｆさんの骨粗鬆症（osteoporosis）の進行を予防するための支援として，最も適 切なものを1 つ選びなさい。","options":["リハビリテーションを週1 日に変更する。","繊維質の多い食事を勧める。","日光浴を日課に取り入れる。","車いすでの移動に変更する。","ビタミンＡ（vitamin A）の摂取を勧める。"],"answer":[3],"subject":3,"explanation":"日光を浴びると体内でビタミンＤが作られ、カルシウムの吸収と骨の健康に役立ちます。"},{"id":22,"question":"中耳にある耳小骨として，正しいものを1 つ選びなさい。","options":["ツチ骨","蝶形骨","前頭骨","頬骨","上顎骨"],"answer":[1],"subject":3,"explanation":"耳小骨は、ツチ骨・キヌタ骨・アブミ骨です。音の振動を内耳へ伝えます。"},{"id":23,"question":"成人の爪に関する次の記述のうち，正しいものを1 つ選びなさい。","options":["主成分はタンパク質である。","1 日に1 mm 程度伸びる。","爪の外表面には爪床がある。","正常な爪は全体が白色である。","爪半月は角質化が進んでいる。"],"answer":[1],"subject":3,"explanation":"爪の主成分は、タンパク質の一種であるケラチンです。"},{"id":24,"question":"食物が入り誤嚥が生じる部位として，適切なものを1 つ選びなさい。","options":["扁桃","食道","耳管","気管","咽頭"],"answer":[4],"subject":3,"explanation":"誤嚥は、食物などが食道ではなく、気管などの気道に入ることです。"},{"id":25,"question":"Ｇさん（79 歳，男性）は，介護老人保健施設に入所している。Ｇさんは普 段から食べ物をかきこむように食べる様子がみられ，最近はむせることが多くなった。義歯は使用していない。食事は普通食を摂取している。ある日の昼食時，唐 揚げを口の中に入れたあと，喉をつかむようなしぐさをし，苦しそうな表情になった。Ｇさんに起きていることとして，最も適切なものを1 つ選びなさい。","options":["心筋梗塞（myocardial infarction）","蕁麻疹（urticaria）","誤嚥性肺炎（aspiration pneumonia）","食中毒（foodborne disease）","窒息（choking）"],"answer":[5],"subject":3,"explanation":"食事中に急に喉をつかんで苦しむ様子は、食物が気道を塞ぐ窒息を疑うサインです。"},{"id":26,"question":"Ｈさん（60 歳，男性）は，身長170 cm，体重120 kg である。Ｈさんは浴 槽で入浴しているときに毎回，「お風呂につかると，からだが軽く感じて楽になります」と話す。胸が苦しいなど，ほかの訴えはない。Ｈさんが話している内容に関連する入浴の作用として，最も適切なものを1 つ選びなさい。","options":["静水圧作用","温熱作用","清潔作用","浮力作用","代謝作用"],"answer":[4],"subject":3,"explanation":"水の浮力が体重を支えるため、浴槽ではからだが軽く感じられます。"},{"id":27,"question":"男性に比べて女性に尿路感染症（urinary tract infection）が起こりやすい要因として，最も適切なものを1 つ選びなさい。","options":["子宮の圧迫がある。","尿道が短く直線的である。","腹部の筋力が弱い。","女性ホルモンの作用がある。","尿道括約筋が弛緩している。"],"answer":[2],"subject":3,"explanation":"女性は尿道が短く、細菌が膀胱まで入りやすいため、尿路感染症が起こりやすくなります。"},{"id":28,"question":"次のうち，眠りが浅くなる原因として，最も適切なものを1 つ選びなさい。","options":["抗不安薬","就寝前の飲酒","抗アレルギー薬","抗うつ薬","足浴"],"answer":[2],"subject":3,"explanation":"寝る前の飲酒は、途中で目が覚める原因となり、睡眠の質を低下させます。"},{"id":29,"question":"概日リズム睡眠障害（circadian rhythm sleep disorder）に関する次の記述のうち，最も適切なものを1 つ選びなさい。","options":["早朝に目が覚める。","睡眠中に下肢が勝手にピクピクと動いてしまう。","睡眠中に呼吸が止まる。","睡眠中に突然大声を出したり身体を動かしたりする。","夕方に強い眠気を感じて就寝し，深夜に覚醒してしまう。"],"answer":[5],"subject":3,"explanation":"夕方に眠り深夜に目覚める状態は、睡眠の時刻が前にずれた概日リズムの障害に当たります。"},{"id":30,"question":"鎮痛薬としてモルヒネを使用している利用者に，医療職と連携した介護を実践するときに留意すべき観察点として，最も適切なものを1 つ選びなさい。","options":["不眠","下痢","脈拍","呼吸","体温"],"answer":[4],"subject":3,"explanation":"モルヒネには呼吸を抑制する作用があります。呼吸数や呼吸の状態を観察します。"},{"id":31,"question":"スキャモン（Scammon, R.E.）の発達曲線に関する次の記述のうち，適 切なものを1 つ選びなさい。","options":["神経系の組織は，4 歳ごろから急速に発達する。","筋骨格系の組織は，4 歳ごろから急速に発達する。","生殖器系の組織は，12 歳ごろから急速に発達する。","循環器系の組織は，20 歳ごろから急速に発達する。","リンパ系の組織は，20 歳ごろから急速に発達する。"],"answer":[3],"subject":4,"explanation":"生殖器系は、思春期に入る12歳ごろから急速に発達します。"},{"id":32,"question":"幼稚園児のＪさん（6 歳，男性）には，広汎性発達障害（pervasive developmental disorder）がある。砂場で砂だんごを作り，きれいに並べることが好きで，毎日，一人で砂だんごを作り続けている。ある日，園児が帰宅した後に，担任が台風に備えて砂場に青いシートをかけておいた。翌朝，登園したＪさんが，いつものように砂場に行くと，青いシートがかかっていた。Ｊさんはパニックになり，その場で泣き続け，なかなか落ち着くことができなかった。担任は，Ｊさんにどのように対応すればよかったのか，最も適切なものを1 つ選びなさい。","options":["前日に，「あしたは，台風が来るよ」と伝える。","前日に，「あしたは，台風が来るので砂場は使えないよ」と伝える。","前日に，「あしたは，おだんご屋さんは閉店です」と伝える。","その場で，「今日は，砂場は使えないよ」と伝える。","その場で，「今日は，おだんご屋さんは閉店です」と伝える。"],"answer":[2],"subject":4,"explanation":"予定の変更は、前もって具体的に伝えます。「砂場が使えない」と知らせると見通しをもちやすくなります。"},{"id":33,"question":"生理的老化に関する次の記述のうち，最も適切なものを1 つ選びなさい。","options":["環境によって起こる現象である。","訓練によって回復できる現象である。","個体の生命活動に有利にはたらく現象である。","人間固有の現象である。","遺伝的にプログラムされた現象である。"],"answer":[5],"subject":4,"explanation":"生理的老化は、病気による変化とは異なり、遺伝的な仕組みに基づく加齢の変化です。"},{"id":34,"question":"エイジズム（ageism）に関する次の記述のうち，最も適切なものを1 つ選びなさい。","options":["高齢を理由にして，偏見をもったり差別したりすることである。","高齢になっても生産的な活動を行うことである。","高齢になることを嫌悪する心理のことである。","加齢に抵抗して，健康的に生きようとすることである。","加齢を受容して，活動的に生きようとすることである。"],"answer":[1],"subject":4,"explanation":"エイジズムとは、年齢を理由に偏見をもったり、差別したりすることです。"},{"id":35,"question":"Ｋさん（80 歳，男性）は，40 歳ごろから職場の健康診査で高血圧と高コレステロール血症（hypercholesterolemia）を指摘されていた。最近，階段を上るときに胸の痛みを感じていたが，しばらく休むと軽快していた。喉の違和感や嚥下痛はない。今朝，朝食後から冷や汗を伴う激しい胸痛が起こり，30 分しても軽快しないので，救急車を呼んだ。Ｋさんに考えられる状況として，最も適切なものを1 つ選びなさい。","options":["喘息（bronchial asthma）","肺炎（pneumonia）","脳梗塞（cerebral infarction）","心筋梗塞（myocardial infarction）","逆流性食道炎（reflux esophagitis）"],"answer":[4],"subject":4,"explanation":"冷や汗を伴う強い胸痛が長く続いているため、心筋梗塞が疑われます。"},{"id":36,"question":"次のうち，健康寿命の説明として，適切なものを1 つ選びなさい。","options":["0 歳児の平均余命","65 歳時の平均余命","65 歳時の平均余命から介護期間を差し引いたもの","介護状態に至らずに死亡する人の平均寿命","健康上の問題で日常生活が制限されることなく生活できる期間"],"answer":[5],"subject":4,"explanation":"健康寿命は、健康上の問題による日常生活の制限がなく生活できる期間です。"},{"id":37,"question":"次のうち，前立腺肥大症（prostatic hypertrophy）に関する記述として，最も適切なものを1 つ選びなさい。","options":["抗利尿ホルモンが関与している。","症状が進むと無尿になる。","初期には頻尿が出現する。","進行すると透析の対象になる。","骨盤底筋訓練で回復が期待できる。"],"answer":[3],"subject":4,"explanation":"前立腺が大きくなると排尿に影響し、初期から頻尿などがみられます。"},{"id":38,"question":"次のうち，高齢期に多い筋骨格系の疾患に関する記述として，適切なものを1 つ選びなさい。","options":["骨粗鬆症（osteoporosis）は男性に多い。","変形性膝関節症（knee osteoarthritis）ではＸ脚に変形する。","関節リウマチ（rheumatoid arthritis）は軟骨の老化によって起こる。","腰部脊柱管狭窄症（lumbar spinal canal stenosis）では下肢のしびれがみられる。","サルコペニア（sarcopenia）は骨量の低下が特徴である。"],"answer":[4],"subject":4,"explanation":"腰部脊柱管狭窄症では神経が圧迫され、脚のしびれや痛みが生じます。"},{"id":39,"question":"高齢者の自動車運転免許に関する次の記述のうち，正しいものを1 つ選びなさい。","options":["75 歳から免許更新時の認知機能検査が義務づけられている。","80 歳から免許更新時の運転技能検査が義務づけられている。","軽度認知障害（mild cognitive impairment）と診断された人は運転免許取消しになる。","認知症（dementia）の人はサポートカー限定免許であれば運転が可能である。","認知症（dementia）による運転免許取消しの後，運転経歴証明書が交付される。"],"answer":[1],"subject":5,"note":" 「サポートカー限定免許」とは，道路交通法第91 条の2 の規定に基づく条件が付された免許のことである。","explanation":"試験時点の制度では、75歳以上の人は免許更新時に認知機能検査を受けます。"},{"id":40,"question":"認知症（dementia）の行動・心理症状（ＢＰＳＤ）であるアパシー（apathy）に関する次の記述のうち，適切なものを1 つ選びなさい。","options":["感情の起伏がみられない。","将来に希望がもてない。","気持ちが落ち込む。","理想どおりにいかず悩む。","自分を責める。"],"answer":[1],"subject":5,"explanation":"アパシーは意欲や関心が低下した状態で、感情の動きが乏しくなります。"},{"id":41,"question":"認知症（dementia）の人にみられる，せん妄に関する次の記述のうち，最も適切なものを1 つ選びなさい。","options":["ゆっくりと発症する。","意識は清明である。","注意機能は保たれる。","体調の変化が誘因になる。","日中に多くみられる。"],"answer":[4],"subject":5,"explanation":"せん妄は、感染や脱水などの体調変化をきっかけに、急に起こることがあります。"},{"id":42,"question":"レビー小体型認知症（dementia with Lewy bodies）にみられる歩行障害として，最も適切なものを1 つ選びなさい。","options":["しばらく歩くと足に痛みを感じて，休みながら歩く。","最初の一歩が踏み出しにくく，小刻みに歩く。","動きがぎこちなく，酔っぱらったように歩く。","下肢は伸展し，つま先を引きずるように歩く。","歩くごとに骨盤が傾き，腰を左右に振って歩く。"],"answer":[2],"subject":5,"explanation":"レビー小体型認知症では、すくみ足や小刻み歩行などのパーキンソン症状がみられます。"},{"id":43,"question":"次の記述のうち，若年性認知症（dementia with early onset）の特徴として，最も適切なものを1 つ選びなさい。","options":["高齢の認知症（dementia）に比べて，症状の進行速度は緩やかなことが多い。","男性よりも女性の発症者が多い。","50 歳代よりも30 歳代の有病率が高い。","特定健康診査で発見されることが多い。","高齢の認知症（dementia）に比べて，就労支援が必要になることが多い。"],"answer":[5],"subject":5,"explanation":"若年性認知症は働く世代にも起こるため、仕事の継続や再就職への支援が必要になりやすいです。"},{"id":44,"question":"Ｌさん（78 歳，女性，要介護1 ）は，3 年前にアルツハイマー型認知症（dementia of the Alzheimer’s type）と診断された。訪問介護（ホームヘルプサービス）を利用し，夫の介護を受けながら二人で暮らしている。ある日，訪問介護員（ホームヘルパー）が訪問すると夫から，「用事で外出しようとすると『外で女性に会っている』と言って興奮することが増えて困っている」と相談を受けた。Ｌさんの症状に該当するものとして，最も適切なものを1 つ選びなさい。","options":["誤認","観念失行","嫉妬妄想","視覚失認","幻視"],"answer":[3],"subject":5,"explanation":"根拠なく配偶者の浮気を確信する状態は、嫉妬妄想に当たります。"},{"id":45,"question":"認知機能障害による生活への影響に関する記述として，最も適切なものを1 つ選びなさい。","options":["遂行機能障害により，自宅がわからない。","記憶障害により，出された食事を食べない。","相貌失認により，目の前の家族がわからない。","視空間認知障害により，今日の日付がわからない。","病識低下により，うつ状態になりやすい。"],"answer":[3],"subject":5,"explanation":"相貌失認では、顔を見ても誰なのか判断しにくくなり、家族の顔もわからないことがあります。"},{"id":46,"question":"バリデーション（validation）に基づく，認知症（dementia）の人の動きや感 情に合わせるコミュニケーション技法として，正しいものを1 つ選びなさい。","options":["センタリング（centering）","リフレージング（rephrasing）","レミニシング（reminiscing）","ミラーリング（mirroring）","カリブレーション（calibration）"],"answer":[4],"subject":5,"alternatives":[[4],[5]],"explanation":"公式発表では、4と5のどちらを選んでも正解です。問題文の「動きや感情に合わせる」は両方の技法に当てはまります。"},{"id":47,"question":"Ｍさん（80 歳，女性，要介護1 ）は，アルツハイマー型認知症（dementia of the Alzheimer’s type）であり，3 日前に認知症対応型共同生活介護（認知症高齢 者グループホーム）に入居した。主治医から向精神薬が処方されている。居室では穏やかに過ごしていた。夕食後，表情が険しくなり，「こんなところにはいられません。私は家に帰ります」と大声を上げ，ほかの利用者にも，「あなたも一緒に帰りましょう」と声をかけて皆が落ち着かなくなることがあった。Ｍさんの介護を検討するときに優先することとして，最も適切なものを1 つ選びなさい。","options":["Ｍさんが訴えている内容","Ｍさんの日中の過ごし方","ほかの利用者が落ち着かなくなったこと","対応に困ったこと","薬が効かなかったこと"],"answer":[1],"subject":5,"explanation":"まず本人の訴えを聴き、帰りたい気持ちや不安の背景を理解します。"},{"id":48,"question":"Ａさん（80 歳，男性，要介護1 ）は，認知症（dementia）で，妻の介護を受けながら二人で暮らしている。「夫は昼夜逆転がある。在宅介護を続けたいが，私が体調を崩し数日間の入院が必要になった」と言う妻に提案する，Ａさんへの介護サービスとして，最も適切なものを1 つ選びなさい。","options":["認知症対応型通所介護（認知症対応型デイサービス）","短期入所生活介護（ショートステイ）","認知症対応型共同生活介護（認知症高齢者グループホーム）","特定施設入居者生活介護","介護老人福祉施設"],"answer":[2],"subject":5,"explanation":"妻の短期間の入院中は、宿泊して介護を受けられるショートステイが適しています。"},{"id":49,"question":"次のうち，ノーマライゼーション（normalization）の原理を盛り込んだ法 律（いわゆる「1959 年法」）を制定した最初の国として，正しいものを1 つ選びなさい。","options":["デンマーク","イギリス","アメリカ","スウェーデン","ノルウェー"],"answer":[1],"subject":6,"explanation":"デンマークの1959年法に、ノーマライゼーションの考え方が盛り込まれました。"},{"id":50,"question":"法定後見制度において，成年後見人等を選任する機関等として，正しいものを1 つ選びなさい。","options":["法務局","家庭裁判所","都道府県知事","市町村長","福祉事務所"],"answer":[2],"subject":6,"explanation":"法定後見制度の成年後見人・保佐人・補助人は、家庭裁判所が選任します。"},{"id":51,"question":"次の記述のうち，障害を受容した心理的段階にみられる言動として，最も適切なものを1 つ選びなさい。","options":["障害があるという自覚がない。","周囲に不満をぶつける。","自分が悪いと悲観する。","価値観が転換し始める。","できることに目を向けて行動する。"],"answer":[5],"subject":6,"explanation":"障害の受容は、できないことだけでなく、できることや自分の価値に目を向けて生活する姿に表れます。"},{"id":52,"question":"統合失調症（schizophrenia）の特徴的な症状として，最も適切なものを1 つ選びなさい。","options":["振戦せん妄","妄想","強迫性障害","抑うつ気分","健忘"],"answer":[2],"subject":6,"explanation":"妄想は、統合失調症にみられる代表的な陽性症状の一つです。"},{"id":53,"question":"Ｂさん（60 歳，男性）は，一人暮らしをしている。糖尿病性網膜症（diabetic retinopathy）による視覚障害（身体障害者手帳1 級）があり，末梢神経 障害の症状がでている。Ｂさんの日常生活において，介護福祉職が留意すべき点として，最も適切なものを1 つ選びなさい。","options":["水晶体の白濁","口腔粘膜や外陰部の潰瘍","振戦や筋固縮","足先の傷や壊疽などの病変","感音性の難聴"],"answer":[4],"subject":6,"explanation":"糖尿病の末梢神経障害では傷に気づきにくくなります。足先の傷や壊疽を観察します。"},{"id":54,"question":"Ｃさん（55 歳，男性）は，5 年前に筋萎縮性側索硬化症（amyotrophic lateral sclerosis：ＡＬＳ）と診断された。現在は症状が進行して，日常生活動作に介護が必要で，自宅では電動車いすと特殊寝台を使用している。次の記述のうち，Ｃさんの現在の状態として，最も適切なものを1 つ選びなさい。","options":["誤嚥せずに食事することが可能である。","明瞭に話すことができる。","身体の痛みがわかる。","自力で痰を排出できる。","箸を上手に使える。"],"answer":[3],"subject":6,"explanation":"ＡＬＳでは主に運動機能が障害され、痛みなどの感覚は一般に保たれます。"},{"id":55,"question":"Ｄさん（36 歳，女性，療育手帳所持）は，一人暮らしをしながら地域の作 業所に通っている。身の回りのことはほとんど自分でできるが，お金の計算，特に計画的にお金を使うのが苦手だった。そこで，社会福祉協議会の生活支援員と一 緒に銀行へ行って，1 週間ごとにお金をおろして生活するようになった。小遣い帳に記録をするようにアドバイスを受けて，お金を計画的に使うことができるようになった。次のうち，Ｄさんが活用した支援を実施する事業として，最も適切なものを1 つ選びなさい。","options":["障害者相談支援事業","自立生活援助事業","日常生活自立支援事業","成年後見制度利用支援事業","日常生活用具給付等事業"],"answer":[3],"subject":6,"explanation":"日常生活自立支援事業では、福祉サービスの利用援助や日常的な金銭管理を支援します。"},{"id":56,"question":"次のうち，障害の特性に応じた休憩時間の調整など，柔軟に対応することで障害者の権利を確保する考え方を示すものとして，最も適切なものを1 つ選びなさい。","options":["全人間的復権","合理的配慮","自立生活運動","意思決定支援","共同生活援助"],"answer":[2],"subject":6,"explanation":"障害による不利益を減らすため、個別の状況に応じて方法を調整することが合理的配慮です。"},{"id":57,"question":"「障害者総合支援法」において，障害福祉サービスを利用する人の意向のもとにサービス等利用計画案を作成する事業所に置かなければならない専門職として，最も適切なものを1 つ選びなさい。","options":["介護支援専門員（ケアマネジャー）","社会福祉士","介護福祉士","民生委員","相談支援専門員"],"answer":[5],"subject":6,"note":" 「障害者総合支援法」とは，「障害者の日常生活及び社会生活を総合的に支援するための法律」のことである。","explanation":"サービス等利用計画の作成を担う専門職は、相談支援専門員です。"},{"id":58,"question":"家族の介護力をアセスメントするときの視点に関する記述として，最も適切なものを1 つ選びなさい。","options":["障害者個人のニーズを重視する。","家族のニーズを重視する。","家族構成員の主観の共通部分を重視する。","家族を構成する個人と家族全体の生活を見る。","支援者の視点や価値観を基準にする。"],"answer":[4],"subject":6,"explanation":"家族の介護力は、個々の家族の健康や思いと、家族全体の生活状況から把握します。"},{"id":59,"question":"次の記述のうち，喀痰吸引等を実施する訪問介護事業所として登録するときに，事業所が行うべき事項として，正しいものを1 つ選びなさい。","options":["登録研修機関になる。","医師が設置する安全委員会に参加する。","喀痰吸引等計画書の作成を看護師に依頼する。","介護支援専門員（ケアマネジャー）の文書による指示を受ける。","医療関係者との連携体制を確保する。"],"answer":[5],"subject":7,"explanation":"喀痰吸引等を安全に行うため、医師や看護職などとの連携体制を整える必要があります。"},{"id":60,"question":"次のうち，呼吸器官の部位の説明に関する記述として，正しいものを1 つ選びなさい。","options":["鼻腔は，上葉・中葉・下葉に分かれている。","咽頭は，左右に分岐している。","喉頭は，食べ物の通り道である。","気管は，空気の通り道である。","肺は，腹腔内にある。"],"answer":[4],"subject":7,"explanation":"気管は、喉頭から気管支へ空気を運ぶ通り道です。"},{"id":61,"question":"次のうち，痰の吸引の準備に関する記述として，最も適切なものを1 つ選びなさい。","options":["吸引器は，陰圧になることを確認する。","吸引びんは，滅菌したものを用意する。","吸引チューブのサイズは，痰の量に応じたものにする。","洗浄水は，決められた消毒薬を入れておく。","清浄綿は，次亜塩素酸ナトリウムに浸しておく。"],"answer":[1],"subject":7,"explanation":"吸引器は陰圧を利用して痰を吸い出します。使用前に正常に陰圧がかかることを確認します。"},{"id":62,"question":"次のうち，経管栄養で起こるトラブルに関する記述として，最も適切なものを1 つ選びなさい。","options":["チューブの誤挿入は，下痢を起こす可能性がある。","注入速度が速いときは，嘔吐を起こす可能性がある。","注入物の温度の調整不良は，脱水を起こす可能性がある。","注入物の濃度の間違いは，感染を起こす可能性がある。","注入中の姿勢の不良は，便秘を起こす可能性がある。"],"answer":[2],"subject":7,"explanation":"栄養剤を速く注入すると胃に負担がかかり、嘔吐などを起こすことがあります。"},{"id":63,"question":"Ｅさん（75 歳，女性）は，介護老人福祉施設に入所している。脳梗塞（cerebral infarction）の後遺症があり，介護福祉士が胃ろうによる経管栄養を行っている。ある日，半座位で栄養剤の注入を開始し，半分程度を順調に注入したところで，体調に変わりがないかを聞くと，「少しお腹が張ってきたような気がする」とＥさんは答えた。意識レベルや顔色に変化はなく，腹痛や嘔気はない。次のうち，介護福祉士が看護職員に相談する前に行う対応として，最も適切なものを1 つ選びなさい。","options":["嘔吐していないので，そのまま様子をみる。","仰臥位（背臥位）にする。","腹部が圧迫されていないかを確認する。","注入速度を速める。","栄養剤の注入を終了する。"],"answer":[3],"subject":7,"explanation":"この事例では、まず衣服や姿勢による腹部の圧迫を確認し、看護職員へ状態を伝えます。"},{"id":64,"question":"介護を取り巻く状況に関する次の記述のうち，最も適切なものを1 つ選びなさい。","options":["ダブルケアとは，夫婦が助け合って子育てをすることである。","要介護・要支援の認定者数は，介護保険制度の導入時から年々減少している。","家族介護を支えていた家制度は，地域包括ケアシステムによって廃止された。","要介護・要支援の認定者のいる三世代世帯の構成割合は，介護保険制度の導入時から年々増加している。","家族が担っていた介護の役割は，家族機能の低下によって社会で代替する必要が生じた。"],"answer":[5],"subject":8,"explanation":"家族の規模や役割の変化に伴い、介護を社会全体で支える必要が生じました。"},{"id":65,"question":"介護福祉士に関する次の記述のうち，適切なものを1 つ選びなさい。","options":["傷病者に対する療養上の世話又は診療の補助を業とする。","喀痰吸引を行うときは市町村の窓口に申請する。","業務独占の資格である。","資格を更新するために5 年ごとに研修を受講する。","信用を傷つけるような行為は禁止されている。"],"answer":[5],"subject":8,"explanation":"介護福祉士には、資格への信用を傷つける行為をしてはならない義務があります。"},{"id":66,"question":"施設利用者の個人情報の保護に関する次の記述のうち，最も適切なものを1 つ選びなさい。","options":["職員がすべての個人情報を自由に閲覧できるように，パスワードを共有する。","個人情報を記載した書類は，そのまま新聞紙と一緒に捨てる。","個人情報保護に関する研修会を定期的に開催し，意識の向上を図る。","職員への守秘義務の提示は，採用時ではなく退職時に書面で行う。","利用者の音声情報は，同意を得ずに使用できる。"],"answer":[3],"subject":8,"explanation":"個人情報を適切に扱うには、継続的な研修で職員の意識と知識を高めます。"},{"id":67,"question":"個別性や多様性を踏まえた介護に関する次の記述のうち，最も適切なものを1 つ選びなさい。","options":["その人らしさは，障害特性から判断する。","生活習慣は，生活してきた環境から理解する。","生活歴は，成人期以降の情報から収集する。","生活様式は，同居する家族と同一にする。","衣服は，施設の方針によって統一する。"],"answer":[2],"subject":8,"explanation":"生活習慣は、それまで暮らしてきた地域や家庭などの環境と合わせて理解します。"},{"id":68,"question":"Ａさん（48 歳，女性，要介護1 ）は，若年性認知症（dementia with early onset）で，夫，長女（高校1 年生）と同居している。Ａさんは家族と過ごすことを希望し，小規模多機能型居宅介護で通いを中心に利用を始めた。Ａさんのことが心配な長女は，部活動を諦めて学校が終わるとすぐに帰宅していた。ある日，夫が，「長女が，学校の先生たちにも相談しているが，今の状況をわかってくれる人がいないと涙を流すことがある」と介護福祉職に相談をした。夫の話を聞いた介護福祉職の対応として，最も適切なものを1 つ選びなさい。","options":["長女に，掃除や洗濯の方法を教える。","家族でもっと頑張るように，夫を励ます。","同じような体験をしている人と交流できる場について情報を提供する。","介護老人福祉施設への入所の申込みを勧める。","介護支援専門員（ケアマネジャー）に介護サービスの変更を提案する。"],"answer":[3],"subject":8,"explanation":"同じ体験をした人との交流は、長女の孤立感を減らし、気持ちを支えることにつながります。"},{"id":69,"question":"Ｂさん（61 歳，男性，要介護3 ）は，脳梗塞（cerebral infarction）による 左片麻痺がある。週2 回訪問介護（ホームヘルプサービス）を利用し，妻（58 歳）と二人暮らしである。自宅での入浴が好きで，妻の介助を受けながら，毎日入浴している。サービス提供責任者に，Ｂさんから，「浴槽から立ち上がるのがつらくなってきた。何かいい方法はないですか」と相談があった。Ｂさんへのサービス提供責任者の対応として，最も適切なものを1 つ選びなさい。","options":["Ｂさんがひとりで入浴できるように，自立生活援助の利用を勧める。","浴室を広くするために，居宅介護住宅改修費を利用した改築を勧める。","妻の入浴介助の負担が軽くなるように，行動援護の利用を勧める。","入浴補助用具で本人の力を生かせるように，特定福祉用具販売の利用を勧める。","Ｂさんが入浴を継続できるように，通所介護（デイサービス）の利用を勧める。"],"answer":[4],"subject":8,"explanation":"入浴補助用具は特定福祉用具販売の対象です。本人の力を生かし、自宅での入浴を支えます。"},{"id":70,"question":"社会奉仕の精神をもって，住民の立場に立って相談に応じ，必要な援助を行い，社会福祉の増進に努める者として，適切なものを1 つ選びなさい。","options":["民生委員","生活相談員","訪問介護員（ホームヘルパー）","通所介護職員","介護支援専門員（ケアマネジャー）"],"answer":[1],"subject":8,"explanation":"民生委員は、住民の立場で相談に応じ、必要な援助につなぐ地域の担い手です。"},{"id":71,"question":"3 階建て介護老人福祉施設がある住宅地に，下記の図記号に関連した警戒レベル3 が発令された。介護福祉職がとるべき行動として，最も適切なものを1 つ選びなさい。","options":["玄関のドアを開けたままにする。","消火器で，初期消火する。","垂直避難誘導をする。","利用者家族に安否情報を連絡する。","転倒の危険性があるものを固定する。"],"answer":[3],"subject":8,"explanation":"図は洪水に関する記号です。この場面では、利用者を安全な上階へ誘導する垂直避難が適切です。","figure":"data:image/png;base64,iVBORw0KGgoAAAANSUhE 断で処分する。","多種類の薬を処方された場合は，介護福祉士が一包化する。","内服薬の用量は，利用者のその日の体調で決める。","副作用の知識をもって，服薬の介護を行う。"],"answer":[5],"subject":8,"explanation":"薬の副作用を理解し、服薬後の変化を観察します。薬の量や時間を独断で変えません。"},{"id":74,"question":"Ｃさん（85 歳，女性，要介護3 ）は，介護老人保健施設に入所しており，軽度の難聴がある。数日前から，職員は感染症対策として日常的にマスクを着用して勤務することになった。ある日，Ｄ介護福祉職がＣさんの居室を訪問すると，「孫が絵を描いて送ってくれたの」と笑いながら絵を見せてくれた。Ｄ介護福祉職はＣさんの言動に共感的理 解を示すために，意図的に非言語コミュニケーションを用いて対応した。このときのＤ介護福祉職のＣさんへの対応として，最も適切なものを1 つ選びなさい。","options":["「よかったですね」と紙に書いて渡した。","目元を意識した笑顔を作り，大きくうなずいた。","「お孫さんの絵が届いて，うれしかったですね」と耳元で話した。","「私もうれしいです」と，ゆっくり話した。","「えがとてもじょうずです」と五十音表を用いて伝えた。"],"answer":[2],"subject":9,"explanation":"笑顔やうなずきは非言語コミュニケーションです。マスク越しでも共感を伝えられます。"},{"id":75,"question":"利用者の家族との信頼関係の構築を目的としたコミュニケーションとして，最も適切なものを1 つ選びなさい。","options":["家族に介護技術を教える。","家族に介護をしている当事者の会に参加することを提案する。","家族から介護の体験を共感的に聴く。","家族に介護を続ける強い気持ちがあるかを質問する。","家族に介護保険が使える範囲を説明する。"],"answer":[3],"subject":9,"explanation":"家族の介護体験や気持ちを共感的に聴くことが、信頼関係の土台になります。"},{"id":76,"question":"Ｅさん（70 歳，女性）は，脳梗塞（cerebral infarction）の後遺症で言語に障害がある。発語はできるが，話したいことをうまく言葉に言い表せない。聴覚 機能に問題はなく，日常会話で使用する単語はだいたい理解できるが，単語がつながる文章になるとうまく理解できない。ある日，Ｅさんに介護福祉職が，「お風呂は，今日ではなくあしたですよ」と伝えると，Ｅさんはしばらく黙って考え，理解できない様子だった。このとき，Ｅさんへの介護福祉職の対応として，最も適切なものを1 つ選びなさい。","options":["「何がわからないのか教えてください」と質問する。","「お風呂，あした」と短い言葉で伝える。","「今日，お風呂に入りたいのですね」と確かめる。","「あしたがお風呂の日で，今日は違いますよ」と言い換える。","「お・ふ・ろ・は・あ・し・た」と1 音ずつ言葉を区切って伝える。"],"answer":[2],"subject":9,"explanation":"文章を理解しにくい場合は、意味のまとまりを保った短い言葉で伝えます。"},{"id":77,"question":"Ｆさん（70 歳，女性）は，最近，抑うつ状態（depressive state）にあり，ベッドに寝ていることが多く，「もう死んでしまいたい」とつぶやいていた。Ｆさんの発言に対する，介護福祉職の言葉かけとして，最も適切なものを1 つ選びなさい。","options":["「落ちこんだらだめですよ」","「とてもつらいのですね」","「どうしてそんなに寝てばかりいるのですか」","「食堂へおしゃべりに行きましょう」","「元気を出して，頑張ってください」"],"answer":[2],"subject":9,"explanation":"まず「とてもつらい」と感じる気持ちを受け止めます。励ましを押しつけず、安全確保と職員間の共有につなげます。"},{"id":78,"question":"Ｇさん（70 歳，女性，要介護1 ）は，有料老人ホームに入居していて，網膜色素変性症（retinitis pigmentosa）による夜盲がある。ある日の夕方，Ｇさんがうす暗い廊下を歩いているのをＨ介護福祉職が発見し，「Ｈです。大丈夫ですか」と声をかけた。Ｇさんは，「びっくりした。見えにくくて，わからなかった…」と暗い表情で返事をした。このときのＧさんに対するＨ介護福祉職の受容的な対応として，最も適切なものを1 つ選びなさい。","options":["「驚かせてしまいましたね。一緒に歩きましょうか」","「明るいところを歩きましょう。電気をつけたほうがいいですよ」","「見えにくくなってきたのですね。一緒に点字の練習を始めましょう」","「白杖があるかを確認しておきます。白杖を使うようにしましょう」","「暗い顔をしないでください。頑張りましょう」"],"answer":[1],"subject":9,"explanation":"驚いた気持ちを受け止めたうえで、本人の意向を確かめながら援助を申し出ます。"},{"id":79,"question":"事例検討の目的に関する次の記述のうち，最も適切なものを1 つ選びなさい。","options":["家族に介護計画を説明し，同意を得る。","上司に利用者への対応の結果を報告し，了解を得る。","介護計画の検討をとおして，チームの交流を深める。","チームで事例の課題を共有し，解決策を見いだす。","各職種の日頃の悩みを共有する。"],"answer":[4],"subject":9,"explanation":"事例検討は、チームで課題を整理・共有し、よりよい支援方法を考えるために行います。"},{"id":80,"question":"介護老人福祉施設における，レクリエーション活動に関する次の記述のうち，最も適切なものを1 つ選びなさい。","options":["利用者全員が参加することを重視する。","毎回，異なるプログラムを企画する。","プログラムに買い物や調理も取り入れる。","利用者の過去の趣味を，プログラムに取り入れることは避ける。","地域のボランティアの参加は，遠慮してもらう。"],"answer":[3],"subject":10,"explanation":"買い物や調理など、生活に身近で楽しみや役割を感じられる活動も取り入れます。"},{"id":81,"question":"関節リウマチ（rheumatoid arthritis）で，関節の変形や痛みがある人への住まいに関する介護福祉職の助言として，最も適切なものを1 つ選びなさい。","options":["手すりは，握らずに利用できる平手すりを勧める。","いすの座面の高さは，低いものを勧める。","ベッドよりも，床に布団を敷いて寝るように勧める。","部屋のドアは，開き戸を勧める。","2 階建ての家の場合，居室は2 階にすることを勧める。"],"answer":[1],"subject":10,"explanation":"平手すりは、強く握らなくても手や前腕を置いて支えられ、関節への負担を減らせます。"},{"id":82,"question":"心身機能が低下した高齢者の住環境の改善に関する次の記述のうち，最も適切なものを1 つ選びなさい。","options":["玄関から道路までは，コンクリートから砂利敷きにする。","扉の取っ手は，レバーハンドルから丸いドアノブにする。","階段の足が乗る板と板の先端部分は，反対色から同系色にする。","車いすを使用する居室の床は，畳から板製床材（フローリング）にする。","浴槽は，和洋折衷式から洋式にする。"],"answer":[4],"subject":10,"explanation":"フローリングは畳より車いすを動かしやすく、移動の負担を減らせます。"},{"id":83,"question":"仰臥位（背臥位）から半座位（ファーラー位）にするとき，ギャッチベッドの背上げを行う前の介護に関する次の記述のうち，最も適切なものを1 つ選びなさい。","options":["背部の圧抜きを行う。","臀部をベッド中央部の曲がる部分に合わせる。","ベッドの高さを最も低い高さにする。","利用者の足がフットボードに付くまで水平移動する。","利用者のからだをベッドに対して斜めにする。"],"answer":[2],"subject":10,"explanation":"背上げ前に、臀部をベッドの曲がる位置に合わせると、ずれや圧迫を防ぎやすくなります。"},{"id":84,"question":"回復期にある左片麻痺の利用者が，ベッドで端座位から立位になるときの基本的な介護方法に関する次の記述のうち，最も適切なものを1 つ選びなさい。","options":["利用者の右側に立つ。","利用者に，ベッドに深く座るように促す。","利用者に，背すじを伸ばして真上に立ち上がるように促す。","利用者の左側に荷重がかかるように支える。","利用者の左の膝頭に手を当てて保持し，膝折れを防ぐ。"],"answer":[5],"subject":10,"explanation":"麻痺側の膝を支えて膝折れを防ぎ、安定して立ち上がれるようにします。"},{"id":85,"question":"標準型車いすを用いた移動の介護に関する次の記述のうち，適切なものを1 つ選びなさい。","options":["急な上り坂は，すばやく進む。","急な下り坂は，前向きで進む。","踏切を渡るときは，駆動輪を上げて進む。","エレベーターに乗るときは，正面からまっすぐに進む。","段差を降りるときは，前輪から下りる。"],"answer":[4],"subject":10,"explanation":"エレベーターには入口に対してまっすぐ進み、段差や扉に注意して乗り込みます。"},{"id":86,"question":"医学的管理の必要がない高齢者の爪の手入れに関する次の記述のうち，最も適切なものを1 つ選びなさい。","options":["爪は，入浴の前に切る。","爪の先の白い部分は，残らないように切る。","爪は，一度にまっすぐ横に切る。","爪の両端は，切らずに残す。","爪切り後は，やすりをかけて滑らかにする。"],"answer":[5],"subject":10,"explanation":"爪切り後にやすりをかけ、引っかかりや皮膚を傷つける角をなくします。"},{"id":87,"question":"左片麻痺の利用者が，端座位でズボンを着脱するときの介護に関する次の記述のうち，最も適切なものを1 つ選びなさい。","options":["最初に，左側の腰を少し上げて脱ぐように促す。","右膝を高く上げて，脱ぐように促す。","左足を右の大腿の上にのせて，ズボンを通すように促す。","立ち上がる前に，ズボンを膝下まで上げるように促す。","介護福祉職は右側に立って，ズボンを上げるように促す。"],"answer":[3],"subject":10,"explanation":"麻痺側の左足を右の大腿にのせると、動かせる右手でズボンに足を通しやすくなります。"},{"id":88,"question":"次のうち，嚥下機能の低下している利用者に提供するおやつとして，最も適切なものを1 つ選びなさい。","options":["クッキー","カステラ","もなか","餅","プリン"],"answer":[5],"subject":10,"explanation":"この選択肢では、まとまりがよく滑らかなプリンが適切です。実際には本人の嚥下機能に合わせます。"},{"id":89,"question":"介護老人福祉施設の介護福祉職が，管理栄養士と連携することが必要な利用者の状態として，最も適切なものを1 つ選びなさい。","options":["利用者の食べ残しが目立つ。","経管栄養をしている利用者が嘔吐する。","利用者の食事中の姿勢が不安定である。","利用者の義歯がぐらついている。","利用者の摂食・嚥下の機能訓練が必要である。"],"answer":[1],"subject":10,"explanation":"食べ残しが多いと栄養不足につながります。管理栄養士と食事量や内容を検討します。"},{"id":90,"question":"次の記述のうち，血液透析を受けている利用者への食事の介護として，最も適切なものを1 つ選びなさい。","options":["塩分の多い食品をとるように勧める。","ゆでこぼした野菜をとるように勧める。","乳製品を多くとるように勧める。","水分を多くとるように勧める。","魚や肉を使った料理を多くとるように勧める。"],"answer":[2],"subject":10,"explanation":"野菜をゆでこぼすと、カリウムを減らせます。食事の量や制限は個別の指示に合わせます。"},{"id":91,"question":"介護老人福祉施設の一般浴（個浴）で，右片麻痺の利用者が移乗台に座っている。その状態から安全に入浴をするための介護福祉職の助言として，最も適 切なものを1 つ選びなさい。","options":["「浴槽に入るときは，右足から入りましょう」","「湯につかるときは，左膝に手をついてゆっくり入りましょう」","「浴槽内では，足で浴槽の壁を押すようにして姿勢を安定させましょう」","「浴槽内では，後ろの壁に寄りかかり足を伸ばしましょう」","「浴槽から出るときは，真上方向に立ち上がりましょう」"],"answer":[3],"subject":10,"explanation":"浴槽の壁に足を当てて支えると、からだが滑るのを防ぎ、姿勢が安定します。"},{"id":92,"question":"次の記述のうち，椅座位で足浴を行う介護方法として，最も適切なものを1 つ選びなさい。","options":["ズボンを脱いだ状態で行う。","湯温の確認は，介護福祉職より先に利用者にしてもらう。","足底は，足浴用容器の底面に付いていることを確認する。","足に付いた石鹸の泡は，洗い流さずに拭き取る。","足浴用容器から足を上げた後は，自然乾燥させる。"],"answer":[3],"subject":10,"explanation":"足底を容器の底につけると、足が安定し、楽な姿勢で足浴できます。"},{"id":93,"question":"身体機能が低下している高齢者が，ストレッチャータイプの特殊浴槽を利 用するときの入浴介護の留意点として，最も適切なものを1 つ選びなさい。","options":["介護福祉職2 名で，洗髪と洗身を同時に行う。","背部を洗うときは，側臥位にして行う。","浴槽に入るときは，両腕の上から固定ベルトを装着する。","浴槽では，首までつかるようにする。","浴槽につかる時間は，20 分程度とする。"],"answer":[2],"subject":10,"explanation":"背中を洗うときは、安全に側臥位にして行います。無理な姿勢や転落を防ぎます。"},{"id":94,"question":"Ｊさん（84 歳，女性，要介護3 ）は，認知症（dementia）があり，夫（86 歳，要支援1 ）と二人暮らしである。Ｊさんは尿意はあるが，夫の介護負担を軽減するため終日おむつを使用しており，尿路感染症（urinary tract infection）を繰り返していた。夫が体調不良になったので，Ｊさんは介護老人福祉施設に入所した。Ｊさんの尿路感染症（urinary tract infection）を予防する介護として，最も適 切なものを1 つ選びなさい。","options":["尿の性状を観察する。","体温の変化を観察する。","陰部洗浄の回数を検討する。","おむつを使わないで，トイレに誘導する。","膀胱留置カテーテルの使用を提案する。"],"answer":[4],"subject":10,"explanation":"尿意を生かしてトイレに誘導し、おむつに頼りすぎない排泄を支援します。"},{"id":95,"question":"夜間，自宅のトイレでの排泄が間に合わずに失敗してしまう高齢者への介 護福祉職の助言として，最も適切なものを1 つ選びなさい。","options":["水分摂取量を減らすように勧める。","終日，リハビリパンツを使用するように勧める。","睡眠薬を服用するように勧める。","泌尿器科を受診するように勧める。","夜間は，ポータブルトイレを使用するように勧める。"],"answer":[5],"subject":10,"explanation":"夜間に間に合わない場合は、寝床の近くで使えるポータブルトイレを検討します。"},{"id":96,"question":"介護福祉職が行うことができる，市販のディスポーザブルグリセリン浣 腸器を用いた排便の介護に関する次の記述のうち，最も適切なものを1 つ選びなさい。","options":["浣腸液は，39℃～40℃に温める。","浣腸液を注入するときは，立位をとるように声をかける。","浣腸液は，すばやく注入する。","浣腸液を注入したら，すぐに排便するように声をかける。","排便がない場合は，新しい浣腸液を再注入する。"],"answer":[1],"subject":10,"explanation":"浣腸液は39〜40℃程度に温めます。使用の可否を確認し、製品の手順や医療職の指示に従います。"},{"id":97,"question":"訪問介護員（ホームヘルパー）が行う見守り的援助として，最も適切なものを1 つ選びなさい。","options":["ゴミの分別ができるように声をかける。","利用者がテレビを見ている間に洗濯物を干す。","着られなくなった服を作り直す。","調理したものを盛り付け，食事を提供する。","冷蔵庫の中を整理し，賞味期限が切れた食品を捨てておく。"],"answer":[1],"subject":10,"explanation":"本人ができるように声をかけて支えることが、見守り的援助です。"},{"id":98,"question":"高齢者が靴下・靴を選ぶときの介護福祉職の対応として，最も適切なものを1 つ選びなさい。","options":["靴下は，指つきのきついものを勧める。","靴下は，足底に滑り止めがあるものを勧める。","靴は，床面からつま先までの高さが小さいものを勧める。","靴は，踵のない脱ぎやすいものを勧める。","靴は，先端部に0.5～1 cm の余裕があるものを勧める。"],"answer":[5],"subject":10,"explanation":"靴の先端に適度な余裕を確保し、足の指が圧迫されないようにします。"},{"id":99,"question":"Ｋさん（77 歳，女性，要支援2 ）は，もの忘れが目立ちはじめ，訪問介護（ホームヘルプサービス）を利用しながら夫と二人で生活している。訪問時，Ｋさん夫婦から，「Ｋさんがテレビショッピングで購入した健康食品が毎月届いてしまい，高額の支払いが発生して困っている」と相談があった。Ｋさん夫婦に対する訪問介護員（ホームヘルパー）の発言として，最も適切なものを1 つ選びなさい。","options":["「健康食品は処分しましょう」","「クーリング・オフをしましょう」","「買い物は夫がするようにしましょう」","「契約内容を一緒に確認しましょう」","「テレビショッピングでの買い物はやめましょう」"],"answer":[4],"subject":10,"explanation":"まず定期購入などの契約内容を一緒に確認します。通信販売には一般的なクーリング・オフ制度はありません。"},{"id":100,"question":"消化管ストーマを造設した利用者への睡眠の介護に関する記述として，最も適切なものを1 つ選びなさい。","options":["寝る前にストーマから出血がある場合は，軟膏を塗布する。","寝る前に，パウチに便がたまっていたら捨てる。","寝る前に，ストーマ装具を新しいものに交換する。","便の漏れが心配な場合は，パウチの上からおむつを強く巻く。","睡眠を妨げないように，パウチの観察は控える。"],"answer":[2],"subject":10,"explanation":"就寝前にたまった便を捨てると、パウチの膨らみや漏れを防ぎやすくなります。"},{"id":101,"question":"Ｌさん（79 歳，男性，要介護2 ）は，介護老人保健施設に入所して1 か月が経過した。睡眠中に大きないびきをかいていることが多く，いびきの音が途切れることもある。夜間に目を覚ましていたり，起床時にだるそうにしている様子もしばしば見られている。介護福祉職がＬさんについて収集すべき情報として，最も優先度の高いものを1 つ選びなさい。","options":["枕の高さ","マットレスの硬さ","掛け布団の重さ","睡眠中の足の動き","睡眠中の呼吸状態"],"answer":[5],"subject":10,"explanation":"いびきが途切れるため、睡眠時の無呼吸を疑い、呼吸状態を優先して確認します。"},{"id":102,"question":"Ｍさん（98 歳，男性，要介護5 ）は，介護老人福祉施設に入所している。誤嚥性肺炎（aspiration pneumonia）で入退院を繰り返し，医師からは終末期が近い状態であるといわれている。介護福祉職が確認すべきこととして，最も優先度の高いものを1 つ選びなさい。","options":["主治医の今後の見通し","誤嚥性肺炎（aspiration pneumonia）の発症時の入院先","経口摂取に対する本人の意向","経口摂取に対する家族の意向","延命治療に対する家族の希望"],"answer":[3],"subject":10,"explanation":"本人が口から食べることをどう望んでいるかを確認し、その意向を支援の中心に置きます。"},{"id":103,"question":"デスカンファレンス（death conference）の目的に関する次の記述のうち，最も適切なものを1 つ選びなさい。","options":["一般的な死の受容過程を学習する。","終末期を迎えている利用者の介護について検討する。","利用者の家族に対して，死が近づいたときの身体の変化を説明する。","亡くなった利用者の事例を振り返り，今後の介護に活用する。","終末期の介護に必要な死生観を統一する。"],"answer":[4],"subject":10,"explanation":"デスカンファレンスでは、亡くなった人へのケアを振り返り、今後の支援の改善に生かします。"},{"id":104,"question":"福祉用具を活用するときの基本的な考え方として，最も適切なものを1 つ選びなさい。","options":["福祉用具が活用できれば，住宅改修は検討しない。","複数の福祉用具を使用するときは，状況に合わせた組合せを考える。","福祉用具の選択に迷うときは，社会福祉士に選択を依頼する。","家族介護者の負担軽減を最優先して選ぶ。","福祉用具の利用状況のモニタリング（monitoring）は不要である。"],"answer":[2],"subject":10,"explanation":"福祉用具は、本人の状態や環境に合わせ、組み合わせたときの使いやすさと安全性も確認します。"},{"id":105,"question":"以下の図のうち，握力の低下がある利用者が使用する杖として，最も適 切なものを1 つ選びなさい。","options":["1","2","3","4","5"],"answer":[3],"subject":10,"explanation":"図3はロフストランドクラッチです。握りに加えて前腕を支える部分があり、握力の低下を補います。","figure":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA1wAAAO2CAIAAABzWAF3AAAACXBIWXMAAA7EAAAOxAGVKw4bAADCqElEQVR4nOzdh1tUeZ7o//uf7LNzd+bu3r07v53Q09PRNgdyzjnnKBIlJ8mgIOZubUObY4s5tNq2OSC2WRQjBlQEBeX3VXpp20bOAarOqW/xfj3nmdHii36qmuN5VzhV/6sHAAAAI97/0nsAAAAA6I8oBAAAAFEIAAAAohAAAAA9RCEAAAB6iEIAAAD0EIUAAADoIQoBAADQQxQCAACghygEAABAD1EIAACAHqIQAAAAPUQhAAAAeohCAAAA9BCFAAAA6CEKAQAA0EMUAgAAoIcoBAAAQA9RCAAAgB7DRuGLFy+ePHliwD8QgJbELny+qenWrVt6DwJgiNra2s6ePfvo0SO9B4GUhhuFHR0d4udvzerVudnZ//zoo4Xz5xtkLABaunTpUqC/f0xUVGJCwuhRo/7+178uW7r09evXes8FQK0DP/wweeJEf19fsSOLXXjcmDG7d+/WeyhIZrhReL6pKTUlRRxI/vu//usP//IvC4hCQDYnT5z4/NNPW1paen/b1dWVnJQkdue5c+boOxgAlX7Yv//f/vVfMzMyen/74MGDKZMmib14+7Zt+g4GuRjs6eOaqiqiEJDRuDFj/Hx83r2kvb39z//5n//+pz89e/ZMp6EADIKTg4M4BK9ds6bvkn1794pLRn3+uY5TQToGi0KRg0QhIJ0bN26IPVf038OHD9+93M7GRlx+7NgxvQYDoJ6/r6/YYY/89FPfJR0dHeISsT1+/FjHwSAXohAY0Z4+ffrvf/yj2HlPnTz57uWjR40SFx48eFCvwQCo9/Lly+bm5ncvaW9vF7vw//uP/3j16pVeU0E6RCEw0p05c6Zh69Z3L7l79+4f//CHf/vXf229f1+vqQAMx549e8RBuaiwUO9BIBOiEMD7crKzxe6cGB+v9yAAhuLRo0eTJ050d3Xt7OzUexbIhCgE8BtHjxz54x/+MGHsWF6KBMjl4MGD9XV1BXl5rs7OixYu7Orq0nsiSIYoBPCr1tbWTz/+eOL48bdv39Z7FgCDc/z48SWLFxfm54/+8svE+HjeiB6DRRQC+EVnZ6ejvb27i0tbW5veswAYOnHvztrS8r/+7/9tbGzUexbIhCgE8IvY6Ojw0NCXL1/qPQiA4Wo6d+7f/vVf//nRR8+fP9d7FkiDKATwRk1VVURYWHd3t96DADAMy8mTxXH5vfcWAAZAFALo2bJ5s7Oj43snKi5bulRcrtdIANS7du3a7z9/KCoiQhyXFy1cqMdEkBJRCIx04nDy1RdfPHjw4N0L29ravvzss9OnT+s1FQCVTp44IY6/kydOfO9yW2trcfn+fft0mQoyIgqBkc7Px2fVypXvXnL06FF7W9v/9x//wVtaAKZv9apVv/+Y46tXr/6ff/u3P//nfz7hvDGoZrAojAwPFz+UocHBhvoDAWjgxPHjYs+dMmlS7zb6yy///U9/6v3IVA83N72nA6Cs9f79v//lL59/+mnfvTgRgk4ODmIv3rhhg76zQS7DjcKjR4+KI8fkiRN7jyJi++yTT8Ql4nKD 「施設に慣れ，安心して生活する（3 か月）」と設定し，計画は順調に進んでいた。Ａさんは施設の大正琴クラブに自ら進んで参加し，演奏したり，ほかの利用者に大正琴を笑顔で教えたりしていた。ある日，クラブの終了後に，Ａさんは部屋に戻らずに，エレベーターの前で立ち止まっていた。介護職員が声をかけると，Ａさんが，「あの子たちが待っているの」と強い口調で言った。","options":["介護職員の声かけのタイミング","Ａさんが演奏した時間","「あの子たちが待っているの」という発言","クラブに参加した利用者の人数","居室とエレベーターの位置関係"],"answer":[3],"subject":11,"explanation":"本人の発言は、行動の意味や気持ちを知る重要な情報です。過去の経験と合わせて理解します。"},{"id":110,"question":"Ａさんの状況から支援を見直すことになった。次の記述のうち，新たな支援の方向性として，最も適切なものを1 つ選びなさい。\n\n〔事例〕\nＡさん（75 歳，女性）は，一人暮らしで，身体機能に問題はない。70 歳まで地域の子どもたちに大正琴を教えていた。認知症（dementia）の進行が疑われて，心配した友人が地域包括支援センターに相談した結果，Ａさんは介護老人福祉施設に入所することになった。入所時のＡさんの要介護度は3 であった。入所後，短期目標を，「施設に慣れ，安心して生活する（3 か月）」と設定し，計画は順調に進んでいた。Ａさんは施設の大正琴クラブに自ら進んで参加し，演奏したり，ほかの利用者に大正琴を笑顔で教えたりしていた。ある日，クラブの終了後に，Ａさんは部屋に戻らずに，エレベーターの前で立ち止まっていた。介護職員が声をかけると，Ａさんが，「あの子たちが待っているの」と強い口調で言った。","options":["介護職員との関係を改善する。","身体機能を改善する。","演奏できる自信を取り戻す。","エレベーターの前に座れる環境を整える。","大正琴を教える役割をもつ。"],"answer":[5],"subject":11,"explanation":"大正琴を教えてきた経験と得意なことを生かし、役割をもって生活できるように支えます。"},{"id":111,"question":"生活支援員の声かけに対し，Ｂさんが大声を出した理由を解釈する視点として，最も適切なものを1 つ選びなさい。\n\n〔事例〕\nＢさん（50 歳，男性，障害支援区分3 ）は，49 歳のときに脳梗塞（cerebral infarction）を発症し，左片麻痺で高次脳機能障害（higher brain dysfunction）と診断された。以 前は大工で，手先が器用だったと言っている。現在は就労継続支援Ｂ型事業所に通っている。短期目標を，「右手を使い，作業を自分ひとりで行える（3 か月）」と設定し，製品を箱に入れる単純作業を任されていた。ほかの利用者との人間関係も良好で，左片麻痺に合わせた作業台で，毎日の作 業目標を達成していた。生活支援員には，「将来は手先を使う仕事に就きたい」と希望を話していた。将来に向けて，生活支援員が新たに製品の組立て作業を提案すると，Ｂさんも喜んで受け入れた。初日に，「ひとりで頑張る」と始めたが，途中で何度も手が止まり，完成品に不備が見られた。生活支援員が声をかけると，「こんなの，できない」と大声を出した。","options":["ほかの利用者との人間関係","生活支援員に話した将来の希望","製品を箱に入れる毎日の作業量","製品の組立て作業の状況","左片麻痺に合わせた作業台"],"answer":[4],"subject":11,"explanation":"新しい組立て作業のどこで困っているかを確認すると、大声の背景を理解できます。"},{"id":112,"question":"Ｂさんに対するカンファレンス（conference）が開催され，短期目標を達成するための具体的な支援について見直すことになった。次の記述のうち，見直した支援内容として，最も適切なものを1 つ選びなさい。\n\n〔事例〕\nＢさん（50 歳，男性，障害支援区分3 ）は，49 歳のときに脳梗塞（cerebral infarction）を発症し，左片麻痺で高次脳機能障害（higher brain dysfunction）と診断された。以 前は大工で，手先が器用だったと言っている。現在は就労継続支援Ｂ型事業所に通っている。短期目標を，「右手を使い，作業を自分ひとりで行える（3 か月）」と設定し，製品を箱に入れる単純作業を任されていた。ほかの利用者との人間関係も良好で，左片麻痺に合わせた作業台で，毎日の作 業目標を達成していた。生活支援員には，「将来は手先を使う仕事に就きたい」と希望を話していた。将来に向けて，生活支援員が新たに製品の組立て作業を提案すると，Ｂさんも喜んで受け入れた。初日に，「ひとりで頑張る」と始めたが，途中で何度も手が止まり，完成品に不備が見られた。生活支援員が声をかけると，「こんなの，できない」と大声を出した。","options":["完成品の不備を出すことへの反省を促す。","左側に部品を置いて作業するように促す。","完成までの手順を理解しやすいように示す。","生活支援員が横に座り続けて作業内容を指示する。","製品を箱に入れる単純作業も同時に行うように調整する。"],"answer":[3],"subject":11,"explanation":"手順を見てわかる形で示すことで、作業の見通しをもち、自分で進めやすくなります。"},{"id":113,"question":"事例研究を行うときに，遵守すべき倫理的配慮として，適切なものを1 つ選びなさい。","options":["研究内容を説明して，事例対象者の同意を得る。","個人が特定できるように，氏名を記載する。","得られたデータは，研究終了後すぐに破棄する。","論文の一部であれば，引用元を明示せずに利用できる。","研究成果を得るために，事実を拡大解釈する。"],"answer":[1],"subject":11,"explanation":"事例研究では、目的や内容を説明し、対象者の同意を得ることが基本です。"},{"id":114,"question":"Ｃさんが八百屋でとった行動から考えられる状態として，最も適切なものを1 つ選びなさい。\n\n〔事例〕\nＣさん（59 歳，男性）は，妻（55 歳）と二人暮らしであり，専業農家である。Ｃさんはおとなしい性格であったが，最近怒りやすくなったと妻は感じていた。Ｃさんは毎 日同じ時間に同じコースを散歩している。ある日，散歩コースの途中にあり，昔からよく行く八百屋から，「Ｃさんが代金を支払わずに商品を持っていった。今回で2 回目になる。お金を支払いにきてもらえないか」と妻に連絡があった。妻がＣさんに確認したところ，悪いことをした認識がなかった。心配になった妻がＣさんと病院に行くと，前頭側頭型認知症（frontotemporal dementia）と診断を受けた。妻は今後 同じようなことが起きないように，Ｃさんの行動を常に見守り，外出を制限したが，疲労がたまり，今後の生活に不安を感じた。そこで，地域包括支援センターに相談し，要介護認定の申請を行い，訪問介護（ホームヘルプサービス）を利用することになった。","options":["脱抑制","記憶障害","感情失禁","見当識障害","遂行機能障害"],"answer":[1],"subject":12,"explanation":"脱抑制は、行動を抑える力が弱くなる状態です。前頭側頭型認知症でみられることがあります。"},{"id":115,"question":"Ｃさんの介護保険制度の利用に関する次の記述のうち，適切なものを1 つ選びなさい。\n\n〔事例〕\nＣさん（59 歳，男性）は，妻（55 歳）と二人暮らしであり，専業農家である。Ｃさんはおとなしい性格であったが，最近怒りやすくなったと妻は感じていた。Ｃさんは毎 日同じ時間に同じコースを散歩している。ある日，散歩コースの途中にあり，昔からよく行く八百屋から，「Ｃさんが代金を支払わずに商品を持っていった。今回で2 回目になる。お金を支払いにきてもらえないか」と妻に連絡があった。妻がＣさんに確認したところ，悪いことをした認識がなかった。心配になった妻がＣさんと病院に行くと，前頭側頭型認知症（frontotemporal dementia）と診断を受けた。妻は今後 同じようなことが起きないように，Ｃさんの行動を常に見守り，外出を制限したが，疲労がたまり，今後の生活に不安を感じた。そこで，地域包括支援センターに相談し，要介護認定の申請を行い，訪問介護（ホームヘルプサービス）を利用することになった。","options":["介護保険サービスの利用者負担割合は1 割である。","介護保険料は特別徴収によって納付する。","要介護認定の結果が出る前に介護保険サービスを利用することはできない。","要介護認定の利用者負担割合は2 割である。","介護保険サービスの費用はサービスの利用回数に関わらず定額である。"],"answer":[1],"subject":12,"explanation":"Ｃさんは第2号被保険者に当たり、介護保険サービスの利用者負担は1割です。"},{"id":116,"question":"その後，妻に外出を制限されたＣさんは不穏となった。困った妻が訪問 介護員（ホームヘルパー）に相談したところ，「八百屋に事情を話して事前にお金を渡して，Ｃさんが品物を持ち去ったときは，渡したお金から商品代金を支払うようにお願いしてはどうか」とアドバイスを受けた。訪問介護員（ホームヘルパー）が意図したＣさんへの関わりをＩＣＦ（International Classification of Functioning, Disability and Health：国際生活機能分類）に当てはめた記述として，最も適切なものを1 つ選びなさい。\n\n〔事例〕\nＣさん（59 歳，男性）は，妻（55 歳）と二人暮らしであり，専業農家である。Ｃさんはおとなしい性格であったが，最近怒りやすくなったと妻は感じていた。Ｃさんは毎 日同じ時間に同じコースを散歩している。ある日，散歩コースの途中にあり，昔からよく行く八百屋から，「Ｃさんが代金を支払わずに商品を持っていった。今回で2 回目になる。お金を支払いにきてもらえないか」と妻に連絡があった。妻がＣさんに確認したところ，悪いことをした認識がなかった。心配になった妻がＣさんと病院に行くと，前頭側頭型認知症（frontotemporal dementia）と診断を受けた。妻は今後 同じようなことが起きないように，Ｃさんの行動を常に見守り，外出を制限したが，疲労がたまり，今後の生活に不安を感じた。そこで，地域包括支援センターに相談し，要介護認定の申請を行い，訪問介護（ホームヘルプサービス）を利用することになった。","options":["個人因子への影響を意図して，健康状態に働きかける。","健康状態への影響を意図して，心身機能に働きかける。","活動への影響を意図して，身体構造に働きかける。","参加への影響を意図して，環境因子に働きかける。","環境因子への影響を意図して，個人因子に働きかける。"],"answer":[4],"subject":12,"explanation":"店の協力という環境因子を整え、地域での買い物や外出への参加を支えています。"},{"id":117,"question":"次のうち，Ｄさんが提案を受けた施設として，最も適切なものを1 つ選びなさい。\n\n〔事例〕\nＤさん（70 歳，男性）は，自宅で妻と二人暮らしで，年金収入で生活している。ある日，車を運転中に事故に遭い救急搬送された。医師からは，第4 胸髄節まで機能が残存している脊髄損傷（spinal cord injury）と説明を受けた。Ｄさんは，入 院中に要介護3 の認定を受けた。Ｄさんは，退院後は自宅で生活することを望んでいた。妻は一緒に暮らしたいと思うが，Ｄさんの身体状況を考えると不安を感じていた。介護支援専門員（ケアマネジャー）は，「退院後は，在宅復帰を目的に，一定の期間，リハビリテーション専門 職がいる施設で生活してはどうか」とＤさんに提案した。Ｄさんは妻と退院後の生活について話し合った結果，一定期間施設に入所して，その間に，自宅の住宅改修を行うことにして，介護支援専門員（ケアマネジャー）に居宅介護住宅改修費について相談した。","options":["養護老人ホーム","軽費老人ホーム","介護老人福祉施設","介護老人保健施設","介護医療院"],"answer":[4],"subject":12,"explanation":"介護老人保健施設は、リハビリテーションなどを行い、在宅復帰を支援する施設です。"},{"id":118,"question":"次のうち，介護支援専門員（ケアマネジャー）がＤさんに説明する居宅介護 住宅改修費の支給限度基準額として，適切なものを1 つ選びなさい。\n\n〔事例〕\nＤさん（70 歳，男性）は，自宅で妻と二人暮らしで，年金収入で生活している。ある日，車を運転中に事故に遭い救急搬送された。医師からは，第4 胸髄節まで機能が残存している脊髄損傷（spinal cord injury）と説明を受けた。Ｄさんは，入 院中に要介護3 の認定を受けた。Ｄさんは，退院後は自宅で生活することを望んでいた。妻は一緒に暮らしたいと思うが，Ｄさんの身体状況を考えると不安を感じていた。介護支援専門員（ケアマネジャー）は，「退院後は，在宅復帰を目的に，一定の期間，リハビリテーション専門 職がいる施設で生活してはどうか」とＤさんに提案した。Ｄさんは妻と退院後の生活について話し合った結果，一定期間施設に入所して，その間に，自宅の住宅改修を行うことにして，介護支援専門員（ケアマネジャー）に居宅介護住宅改修費について相談した。","options":["10 万円","15 万円","20 万円","25 万円","30 万円"],"answer":[3],"subject":12,"explanation":"住宅改修費の支給限度基準額は原則20万円です。実際の給付は利用者負担分を差し引きます。"},{"id":119,"question":"Ｄさんが施設入所してから3 か月後，住宅改修を終えた自宅に戻ることになった。Ｄさんは自宅での生活を楽しみにしている。その一方で，不安も抱えていたため，担当の介護福祉士は，理学療法士と作業療法士に相談して，生活上の留意点を記載した冊子を作成して，Ｄさんに手渡した。次の記述のうち，冊子の内容として，最も適切なものを1 つ選びなさい。\n\n〔事例〕\nＤさん（70 歳，男性）は，自宅で妻と二人暮らしで，年金収入で生活している。ある日，車を運転中に事故に遭い救急搬送された。医師からは，第4 胸髄節まで機能が残存している脊髄損傷（spinal cord injury）と説明を受けた。Ｄさんは，入 院中に要介護3 の認定を受けた。Ｄさんは，退院後は自宅で生活することを望んでいた。妻は一緒に暮らしたいと思うが，Ｄさんの身体状況を考えると不安を感じていた。介護支援専門員（ケアマネジャー）は，「退院後は，在宅復帰を目的に，一定の期間，リハビリテーション専門 職がいる施設で生活してはどうか」とＤさんに提案した。Ｄさんは妻と退院後の生活について話し合った結果，一定期間施設に入所して，その間に，自宅の住宅改修を行うことにして，介護支援専門員（ケアマネジャー）に居宅介護住宅改修費について相談した。","options":["食事では，スプーンを自助具で手に固定する。","移動には，リクライニング式車いすを使用する。","寝具は，エアーマットを使用する。","更衣は，ボタンエイドを使用する。","外出するときには，事前に多機能トイレの場所を確認する。"],"answer":[5],"subject":12,"explanation":"胸髄損傷では上肢機能を活用できます。外出前に使えるトイレを確認すると安心につながります。"},{"id":120,"question":"Ｅさんの食事の様子から，今後，引き起こされる可能性が高いと考えられる二次障害として，最も適切なものを1 つ選びなさい。\n\n〔事例〕\nＥさん（34 歳，女性，障害支援区分3 ）は，特別支援学校の高等部を卒業後，週2 回，生活介護を利用しながら自宅で生活している。Ｅさんはアテトーゼ型（athetosis）の脳性麻痺（cerebral palsy）で不随意運動があり，首を振る動作が見られる。食事は首の動きに合わせて，自助具を使って食べている。食事中は不随意運動が強く，食事が終わると，「首が痛い，しびれる」と言ってベッドに横になるときがある。また，お茶を飲むときは取っ手つきのコップで飲んでいるが，コップを口元に運ぶまでにお茶がこぼれるようになってきた。日頃から自分のことは自分でやりたいと考えていて，お茶が上手に飲めなくなってきたことを気にしている。Ｅさんは，生活介護事業所で油絵を描くことを楽しみにしている。以前から隣町の油絵教室に通い技術を高めたいと話していた。そこでＥさんは，「自宅から油絵 教室に通うときの介助をお願いするにはどうしたらよいか」と介護福祉職に相談した。","options":["変形性股関節症（coxarthrosis）","廃用症候群（disuse syndrome）","起立性低血圧（orthostatic hypotension）","脊柱側弯症（scoliosis）","頚椎症性脊髄症（cervical spondylotic myelopathy）"],"answer":[5],"subject":12,"explanation":"首の不随意運動が繰り返されると、頚椎や脊髄に負担がかかり、痛みやしびれが生じることがあります。"},{"id":121,"question":"Ｅさんがお茶を飲むときの介護福祉職の対応として，最も適切なものを 1 つ選びなさい。\n\n〔事例〕\nＥさん（34 歳，女性，障害支援区分3 ）は，特別支援学校の高等部を卒業後，週2 回，生活介護を利用しながら自宅で生活している。Ｅさんはアテトーゼ型（athetosis）の脳性麻痺（cerebral palsy）で不随意運動があり，首を振る動作が見られる。食事は首の動きに合わせて，自助具を使って食べている。食事中は不随意運動が強く，食事が終わると，「首が痛い，しびれる」と言ってベッドに横になるときがある。また，お茶を飲むときは取っ手つきのコップで飲んでいるが，コップを口元に運ぶまでにお茶がこぼれるようになってきた。日頃から自分のことは自分でやりたいと考えていて，お茶が上手に飲めなくなってきたことを気にしている。Ｅさんは，生活介護事業所で油絵を描くことを楽しみにしている。以前から隣町の油絵教室に通い技術を高めたいと話していた。そこでＥさんは，「自宅から油絵 教室に通うときの介助をお願いするにはどうしたらよいか」と介護福祉職に相談した。","options":["吸い飲みに変更する。","ストローつきコップに変更する。","重いコップに変更する。","コップを両手で持つように伝える。","全介助を行う。"],"answer":[2],"subject":12,"explanation":"ストローつきコップなら、口までコップを持ち上げずに飲め、自分で飲みたい気持ちを支えられます。"},{"id":122,"question":"介護福祉職は，Ｅさんが隣町の油絵教室に通うことができるようにサービスを提案したいと考えている。次のうち，Ｅさんが利用するサービスとして，最も適切なものを1 つ選びなさい。\n\n〔事例〕\nＥさん（34 歳，女性，障害支援区分3 ）は，特別支援学校の高等部を卒業後，週2 回，生活介護を利用しながら自宅で生活している。Ｅさんはアテトーゼ型（athetosis）の脳性麻痺（cerebral palsy）で不随意運動があり，首を振る動作が見られる。食事は首の動きに合わせて，自助具を使って食べている。食事中は不随意運動が強く，食事が終わると，「首が痛い，しびれる」と言ってベッドに横になるときがある。また，お茶を飲むときは取っ手つきのコップで飲んでいるが，コップを口元に運ぶまでにお茶がこぼれるようになってきた。日頃から自分のことは自分でやりたいと考えていて，お茶が上手に飲めなくなってきたことを気にしている。Ｅさんは，生活介護事業所で油絵を描くことを楽しみにしている。以前から隣町の油絵教室に通い技術を高めたいと話していた。そこでＥさんは，「自宅から油絵 教室に通うときの介助をお願いするにはどうしたらよいか」と介護福祉職に相談した。","options":["自立生活援助","療養介護","移動支援","自立訓練","同行援護"],"answer":[3],"subject":12,"explanation":"余暇活動などの外出を支えるサービスとして、移動支援が適しています。"},{"id":123,"question":"次のうち，Ｆさんが自宅に帰ってきたときの状態に該当するものとして，最も適切なものを1 つ選びなさい。\n\n〔事例〕\nＦさん（20 歳，男性）は，自閉症スペクトラム障害（autism spectrum disorder）と重度の知的障害があり，自宅で母親（50 歳），姉（25 歳）と3 人で暮らしている。Ｆさんは生活介護事業所を利用している。事業所では比較的落ち着いているが，自宅に帰ってくると母親に対してかみつきや頭突きをすることがあった。また，自分で頭をたたくなどの自傷行為もたびたび見られる。仕事をしている母親に代わり，小さい頃から食事や排泄の介護をしている姉は，これまでＦさんの行動を止めることができていたが，最近ではからだが大きくなり力も強くなって，母親と協力しても止めることが難しくなっていた。家族で今後のことを考えた結果，Ｆさんは障害者支援施設に入所することになった。","options":["学習障害","注意欠陥多動性障害","高次脳機能障害","強度行動障害","気分障害"],"answer":[4],"subject":12,"explanation":"強い自傷や他害などが繰り返され、生活に大きな困難が生じる状態は強度行動障害に当たります。"},{"id":124,"question":"Ｆさんが入所してからも月1 ，2 回は，姉が施設を訪ね，Ｆさんの世話をしている。ある日，担当の介護福祉職が姉に声をかけると，「小学生の頃から，学校が終わると友だちと遊ばずにまっすぐ家に帰り，母親に代わって，弟の世話をしてきた。今は，弟を見捨てたようで，申し訳ない」などと話す。介護福祉職の姉への対応として，最も適切なものを1 つ選びなさい。\n\n〔事例〕\nＦさん（20 歳，男性）は，自閉症スペクトラム障害（autism spectrum disorder）と重度の知的障害があり，自宅で母親（50 歳），姉（25 歳）と3 人で暮らしている。Ｆさんは生活介護事業所を利用している。事業所では比較的落ち着いているが，自宅に帰ってくると母親に対してかみつきや頭突きをすることがあった。また，自分で頭をたたくなどの自傷行為もたびたび見られる。仕事をしている母親に代わり，小さい頃から食事や排泄の介護をしている姉は，これまでＦさんの行動を止めることができていたが，最近ではからだが大きくなり力も強くなって，母親と協力しても止めることが難しくなっていた。家族で今後のことを考えた結果，Ｆさんは障害者支援施設に入所することになった。","options":["「これからもＦさんのお世話をしっかり行ってください」","「Ｆさんは落ち着いていて，自傷他害行為があるようには見えませんね」","「お姉さんは，小さい頃からお母さんの代わりをしてきたのですね」","「訪問回数を減らしてはどうですか」","「施設入所を後悔しているのですね。もう一度在宅ケアを考えましょう」"],"answer":[3],"subject":12,"explanation":"幼い頃から介護を担ってきた経験を受け止め、姉の思いや負担を丁寧に聴きます。"},{"id":125,"question":"Ｆさんが施設に入所して1 年が経った。介護福祉職は，Ｆさん，母親，姉と共にこれまでの生活と支援を振り返り，当面，施設で安定した生活が送れるように検討した。次のうち，Ｆさんの支援を修正するときに利用するサービスとして，正しいものを1 つ選びなさい。\n\n〔事例〕\nＦさん（20 歳，男性）は，自閉症スペクトラム障害（autism spectrum disorder）と重度の知的障害があり，自宅で母親（50 歳），姉（25 歳）と3 人で暮らしている。Ｆさんは生活介護事業所を利用している。事業所では比較的落ち着いているが，自宅に帰ってくると母親に対してかみつきや頭突きをすることがあった。また，自分で頭をたたくなどの自傷行為もたびたび見られる。仕事をしている母親に代わり，小さい頃から食事や排泄の介護をしている姉は，これまでＦさんの行動を止めることができていたが，最近ではからだが大きくなり力も強くなって，母親と協力しても止めることが難しくなっていた。家族で今後のことを考えた結果，Ｆさんは障害者支援施設に入所することになった。","options":["地域定着支援","計画相談支援","地域移行支援","基幹相談支援","基本相談支援"],"answer":[2],"subject":12,"explanation":"計画相談支援では、サービスの利用状況を確認し、必要に応じて計画の見直しを行います。"}], SUBJECTS=["人間の尊厳と自立", "人間関係とコミュニケーション", "社会の理解", "こころとからだのしくみ", "発達と老化の理解", "認知症の理解", "障害の理解", "医療的ケア", "介護の基本", "コミュニケーション技術", "生活支援技術", "介護過程", "総合問題"];

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const equal=(a,b)=>a.length===b.length&&[...a].sort().every((v,i)=>v===[...b].sort()[i]);

<\/style><div class="wrap"><header class="top"><div><div class="brand">いとう総研 · STUDY PRACTICE<\/div><h1>第36回 介護福祉士試験<\/h1><p class="lead">一問ずつ、理解を積み重ねる。全125問・漢字にルビ・シンプル解説付き<\/p><\/div><span class="edition">2024年実施<\/span><\/header><div class="stats" id="stats"><\/div><div class="layout"><aside class="sidebar"><div><label class="control-label" for="subject">科目から選ぶ<\/label><details id="subject"><summary id="subjectsummary">全13科目 · 125問<\/summary><div class="subjectchoices"><button data-subject="all">全13科目 · 125問<\/button>${SUBJECTS.map((s,i)=>`<button data-subject="${i}">${esc(s)}<\/button>`).join('')}<\/div><\/details><\/div><div class="filters" role="group" aria-label="出題範囲">${[['all','すべて'],['unseen','未回答'],['wrong','間違えた'],['marks','あとで復習']].map(([v,t])=>`<button data-mode="${v}">${t}<\/button>`).join('')}<\/div><div class="sidebuttons"><button id="shuffle">シャッフル<\/button><button id="sort">番号順<\/button><\/div><details class="map"><summary>問題一覧から選ぶ <span id="listcount"><\/span><\/summary><div class="grid" id="grid"><\/div><p class="legend">緑：正解 ／ 橙：不正解 ／ •：あとで復習<\/p><\/details><p class="storage" id="storage"><\/p><button class="reset" id="reset">学習記録をリセット<\/button><\/aside><main><article class="card" id="card"><\/article><nav class="navigation" aria-label="問題の移動"><button id="prev">← 前の問題<\/button><button id="next">次の問題 →<\/button><\/nav><\/main><\/div><footer class="footer">問題：社会福祉振興・試験センター 第36回介護福祉士国家試験<br>正答は公式発表に準拠。解説は学習用に作成し、試験時点の制度・統計に対応しています。<br><a href="https://www.sssc.or.jp/kaigo/past_exam/" target="_blank" rel="noopener">公式の試験問題<\/a><a href="https://www.sssc.or.jp/kaigo/past_exam/pdf/no36/k_kijun_seitou.pdf" target="_blank" rel="noopener">公式正答<\/a><\/footer><\/div>`;
const $=s=>root.querySelector(s);
function matches(q){return (subject==='all'||q.subject===Number(subject))&&(mode==='all'||mode==='unseen'&&!results[q.id]||mode==='wrong'&&results[q.id]&&!correct(q.id)||mode==='marks'&&marks[q.id])}
function rebuild(){order=QUESTIONS.filter(matches).map(q=>q.id);if(!order.includes(index))index=order[0];render()}
function stats(){$('#subjectsummary').textContent=subject==='all'?'全13科目 · 125問':SUBJECTS[Number(subject)];const answered=Object.keys(results).length,n=Object.keys(results).filter(correct).length;$('#stats').innerHTML=`<div class="stat"><b>${answered}<small style="font-size:12px;color:#72858c"> / 125<\/small><\/b><span>回答済み<\/span><\/div><div class="stat"><b>${n}<\/b><span>正解<\/span><\/div><div class="stat"><b>${answered?Math.round(n/answered*100):0}<small style="font-size:12px">%<\/small><\/b><span>正答率<\/span><\/div><div class="progress" role="progressbar" aria-label="回答済み" aria-valuenow="${answered}" aria-valuemin="0" aria-valuemax="125"><i style="width:${answered/125*100}%"><\/i><\/div>`;$('#storage').textContent=storageOK?'学習記録はこのブラウザに自動保存されます。':'この環境では記録を保存できません。ページを閉じると記録が消えます。';}
function nav(){const pos=order.indexOf(index);$('#prev').disabled=pos<=0;$('#next').disabled=pos<0||pos===order.length-1;$('#listcount').textContent=`(${order.length}問)`;$('#grid').innerHTML=order.map(id=>`<button data-id="${id}" class="${results[id]?(correct(id)?'done':'miss'):''} ${index===id?'current':''} ${marks[id]?'flag':''}" aria-label="問題${id}${results[id]?(correct(id)?' 正解':' 不正解'):' 未回答'}${marks[id]?' あとで復習':''}" ${index===id?'aria-current="true"':''}>${id}<\/button>`).join('');}
function render(){save();stats();nav();root.querySelectorAll('[data-mode]').forEach(b=>{b.classList.toggle('active',b.dataset.mode===mode);b.setAttribute('aria-pressed',String(b.dataset.mode===mode))});const q=QUESTIONS[index-1];if(!q||!order.includes(index)){$('#card').innerHTML='<div class="empty"><h2>この範囲の問題はありません<\/h2><p>科目や出題範囲を変更して、学習を続けましょう。<\/p><button id="showall" class="primary">全問に戻る<\/button><\/div>';$('#showall').onclick=()=>{subject='all';mode='all';rebuild()};return}
revealed=!!results[index];selection=revealed?[...results[index].selected]:[];
const parts=q.question.split('\n\n〔事例〕\n');
$('#card').innerHTML=`<div class="qtop"><span class="tag">${esc(SUBJECTS[q.subject])}<\/span><button id="mark" aria-pressed="${!!marks[index]}">${marks[index]?'★ 復習に登録済み':'☆ あとで復習'}<\/button><\/div><h2 class="qnum" tabindex="-1">問題 ${q.id}<span class="count">${order.indexOf(index)+1} / ${order.length} 問<\/span><\/h2><div class="instruction">${q.answer.length}つ選んで解答してください<\/div><p class="question">${esc(parts[0])}<\/p>${parts.length>1?`<div class="case">〔事例〕<br>${esc(parts.slice(1).join('\n'))}<\/div>`:''}${q.figure?`<figure class="figure"><img src="${q.figure}" alt="このもんだいのず"><figcaption>図を見て選択してください。<\/figcaption><\/figure>`:''}<form id="form"><div class="opts" role="group" aria-label="選択肢">${q.options.map((t,i)=>`<label class="option" data-option="${i+1}"><input type="${q.answer.length===1?'radio':'checkbox'}" name="choice" value="${i+1}" ${selection.includes(i+1)?'checked':''} ${revealed?'disabled':''}><span class="number">${i+1}<\/span><span class="opttext">${esc(t)}<\/span><\/label>`).join('')}<\/div>${q.note?`<details class="notebox"><summary>問題の注記を読む<\/summary><p>${esc(q.note)}<\/p><\/details>`:''}<div class="submitrow" ${revealed?'hidden style="display:none"':''}><button type="submit" class="primary" id="submit" disabled>解答する<\/button><span class="hint" id="hint">${q.answer.length}つ選択してください<\/span><\/div><\/form><div id="feedback" aria-live="polite"><\/div>`;
$('#mark').onclick=()=>{marks[index]=!marks[index];save();$('#mark').textContent=marks[index]?'★ 復習に登録済み':'☆ あとで復習';$('#mark').setAttribute('aria-pressed',String(!!marks[index]));nav()};
$('#form').onchange=()=>{selection=[...root.querySelectorAll('input[name="choice"]:checked')].map(e=>Number(e.value));$('#submit').disabled=selection.length!==q.answer.length;$('#hint').textContent=selection.length>q.answer.length?`${q.answer.length}つに絞ってください`:`${selection.length} / ${q.answer.length}つ選択`;root.querySelectorAll('.option').forEach(el=>el.classList.toggle('selected',selection.includes(Number(el.dataset.option))))};
$('#form').onsubmit=e=>{e.preventDefault();if(selection.length!==q.answer.length||revealed)return;results[index]={selected:[...selection]};render();$('#feedback').scrollIntoView({behavior:'smooth',block:'nearest'})};
if(revealed){const ok=correct(index);root.querySelectorAll('.option').forEach(el=>{const n=Number(el.dataset.option);if((q.alternatives||[q.answer]).some(a=>a.includes(n))){el.classList.add('good');el.querySelector('.opttext').insertAdjacentHTML('afterbegin','<span class="optbadge">正答<\/span>')}else if(selection.includes(n)){el.classList.add('bad');el.querySelector('.opttext').insertAdjacentHTML('afterbegin','<span class="optbadge" style="background:#f7d7c8;color:#9d4229">あなたの選択<\/span>')}});$('#feedback').innerHTML=`<section class="feedback ${ok?'':'wrong'}"><div class="resulttitle">${ok?'✓ 正解です！':'もう一度、ポイントを確認しましょう'}<\/div><div class="answer">正答 ${q.alternatives?q.alternatives.map(a=>a.join('・')).join(' または '):q.answer.join('・')}<\/div><p class="hint">あなたの解答：${selection.join('・')}${q.answer.length>1?' ／ すべて一致で正解':''}<\/p><div class="explabel">シンプル解説<\/div><p class="explanation">${esc(q.explanation)}<\/p><button id="retry" class="retry">この問題を解き直す<\/button>${order.indexOf(index)===order.length-1?'<p class="summarynote">この範囲の最後の問題です。科目や復習モードを切り替えて続けられます。<\/p>':''}<\/section>`;$('#retry').onclick=()=>{delete results[index];render()}}

root.querySelectorAll('[data-subject]').forEach(b=>b.onclick=()=>{subject=b.dataset.subject;$('#subject').open=false;rebuild()});root.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;rebuild()});$('#grid').onclick=e=>{const b=e.target.closest('button[data-id]');if(b){index=Number(b.dataset.id);render()}};

$('#prev').onclick=()=>move(-1);$('#next').onclick=()=>move(1);
$('#shuffle').onclick=()=>{order=QUESTIONS.filter(matches).map(q=>q.id);for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}index=order[0];render()};$('#sort').onclick=()=>rebuild();
$('#reset').onclick=()=>{if(confirm('125もんの きろくと ふくしゅうマークを けしますか？')){results={};marks={};index=1;subject='all';mode='all';rebuild()}};

t>しえん<\/rt><\/ruby>の<ruby>説明<rt>せつめい<\/rt><\/ruby>として，<ruby>最<rt>もっと<\/rt><\/ruby>も<ruby>適切<rt>てきせつ<\/rt><\/ruby>なものを1 つ<ruby>選<rt>えら<\/rt><\/ruby>びなさい。"," 「障害者総合支援法」とは，「障害者の日常生活及び社会生活を総合的に支援するための法律」のことである。":" 「<ruby>障害者総合支援法<rt>しょうがいしゃそうごうしえんほう<\/rt><\/ruby>」とは，「<ruby>障害者<rt>しょうがいしゃ<\/rt><\/ruby>の<ruby>日常生活及<rt>にちじょうせいかつおよ<\/rt><\/ruby>び<ruby>社会生活<rt>しゃかいせいかつ<\/rt><\/ruby>を<ruby>総合的<rt>そうごうてき<\/rt><\/ruby>に<ruby>支援<rt>しえん<\/rt><\/ruby>するための<ruby>法律<rt>ほうりつ<\/rt><\/ruby>」のことである。","移動支援については，介護給付費が支給される。":"<ruby>移動支援<rt>いどうしえん<\/rt><\/ruby>については，<ruby>介護給付費<rt>かいごきゅうふひ<\/rt><\/ruby>が<ruby>支給<rt>しきゅう<\/rt><\/ruby>される。","行動援護は，周囲の状況把握ができない視覚障害者が利用する。":"<ruby>行動援護<rt>こうどうえんご<\/rt><\/ruby>は，<ruby>周囲<rt>しゅうい<\/rt><\/ruby>の<ruby>状況把握<rt>じょうきょうはあく<\/rt><\/ruby>ができない<ruby>視覚障害者<rt>しかくしょうがいしゃ<\/rt><\/ruby>が<ruby>利用<rt>りよう<\/rt><\/ruby>する。","同行援護は，危険を回避できない知的障害者が利用する。":"<ruby>同行援護<rt>どうこうえんご<\/rt><\/ruby>は，<ruby>危険<rt>きけん<\/rt><\/ruby>を<ruby>回避<rt>かいひ<\/rt><\/ruby>できない<ruby>知的障害者<rt>ちてきしょうがいしゃ<\/rt><\/ruby>が<ruby>利用<rt>りよう<\/rt><\/ruby>する。","重度訪問介護は，重度障害者の外出支援も行う。":"<ruby>重度訪問介護<rt>じゅうどほうもんかいご<\/rt><\/ruby>は，<ruby>重度障害者<rt>じゅうどしょうがいしゃ<\/rt><\/ruby>の<ruby>外出支援<rt>がいしゅつしえん<\/rt><\/ruby>も<ruby>行<rt>おこな<\/rt><\/ruby>う。","共同生活援助（グループホーム）は，地域で生活する障害者の外出支援を行う。":"<ruby>共同生活援助<rt>きょうどうせいかつえんじょ<\/rt><\/ruby>（グループホーム）は，<ruby>地域<rt>ちいき<\/rt><\/ruby>で<ruby>生活<rt>せいかつ<\/rt><\/ruby>する<ruby>障害者<rt>しょうがいしゃ<\/rt><\/ruby>の<ruby>外出支援<rt>がいしゅつしえん<\/rt><\/ruby>を<ruby>行<rt>おこな<\/rt><\/ruby>う。","重度訪問介護には、居宅内の介護だけでなく、外出時の移動の支援も含まれます。":"<ruby>重度訪問介護<rt>じゅうどほうもんかいご<\/rt><\/ruby>には、<ruby>居宅<rt>きょたく<\/rt><\/ruby><ruby>内<rt>ない<\/rt><\/ruby>の<ruby>介護<rt>かいご<\/rt><\/ruby>だけでなく、<ruby>外出<rt>がいしゅつ<\/rt><\/ruby><ruby>時の<rt>ときの<\/rt><\/ruby><ruby>移動<rt>いどう<\/rt><\/ruby>の<ruby>支援<rt>しえん<\/rt><\/ruby>も<ruby>含ま<rt>ふくま<\/rt><\/ruby>れます。","Ｄさん（80 歳，男性，要介護2 ）は，認知症（dementia）がある。訪問介護（ホームヘルプサービス）を利用しながら一人暮らしをしている。ある日，訪問介護員（ホームヘルパー）がＤさんの自宅を訪問すると，近所に住むＤさんの長女から，「父が，高額な投資信託の電話勧誘を受けて，契約しようかどうか悩んでいるようで心配だ」と相談された。訪問介護員（ホームヘルパー）が 75 歳から免許更新時の認知機能検査が義務づけられている。":"75 <ruby>歳<rt>さい<\/rt><\/ruby>から<ruby>免許更新時<rt>めんきょこうしんじ<\/rt><\/ruby>の<ruby>認知機能検査<rt>にんちきのうけんさ<\/rt><\/ruby>が<ruby>義務<rt>ぎむ<\/rt><\/ruby>づけられている。","80 歳から免許更新時の運転技能検査が義務づけられている。":"80 <ruby>歳<rt>さい<\/rt><\/ruby>から<ruby>免許更新時<rt>めんきょこうしんじ<\/rt><\/ruby>の<ruby>運転技能検査<rt>うんてんぎのうけんさ<\/rt><\/ruby>が<ruby>義務<rt>ぎむ<\/rt><\/ruby>づけられている。","軽度認知障害（mild cognitive impairment）と診断された人は運転免許取消しになる。":"<ruby>軽度認知障害<rt>けいどにんちしょうがい<\/rt><\/ruby>（mild cognitive impairment）と<ruby>診断<rt>しんだん<\/rt><\/ruby>された<ruby>人<rt>ひと<\/rt><\/ruby>は<ruby>運転免許取消<rt>うんてんめんきょとりけ<\/rt><\/ruby>しになる。","認知症（dementia）の人はサポートカー限定免許であれば運転が可能である。":"<ruby>認知症<rt>にんちしょう<\/rt><\/ruby>（dementia）の<ruby>人<rt>ひと<\/rt><\/ruby>はサポートカー<ruby>限定免許<rt>げんていめんきょ<\/rt><\/ruby>であれば<ruby>運転<rt>うんてん<\/rt><\/ruby>が<ruby>可能<rt>かのう<\/rt><\/ruby>である。","認知症（dementia）による運転免許取消しの後，運転経歴証明書が交付される。":"<ruby>認知症<rt>にんちしょう<\/rt><\/ruby>（dementia）による<ruby>運転免許取消<rt>うんてんめんきょとりけ<\/rt><\/ruby>しの<ruby>後<rt>あと<\/rt><\/ruby>，<ruby>運転経歴証明書<rt>うんてんけいれきしょうめいしょ<\/rt><\/ruby>が<ruby>交付<rt>こうふ<\/rt><\/ruby>される。","試験時点の制度では、75歳以上の人は免許更新時に認知機能検査を受けます。":"<ruby>試験<rt>しけん<\/rt><\/ruby><ruby>時点<rt>じてん<\/rt><\/ruby>の<ruby>制度<rt>せいど<\/rt><\/ruby>では、<ruby>75歳<rt>ななじゅうごさい<\/rt><\/ruby><ruby>以上<rt>いじょう<\/rt><\/ruby>の<ruby>人<rt>ひと<\/rt><\/ruby>は<ruby>免許更新時<rt>めんきょこうしんじ<\/rt><\/ruby>に<ruby>認知機能検査<rt>にんちきのうけんさ<\/rt><\/ruby>を<ruby>受け<rt>うけ<\/rt><\/ruby>ます。","認知症（dementia）の行動・心理症状（ＢＰＳＤ）であるアパシー（apathy）に関する次の記述のうち，適切なものを1 つ選びなさい。":"<ruby>認知症<rt>にんちしょう<\/rt><\/ruby>（dementia）の<ruby>行動<rt>こうどう<\/rt><\/ruby>・<ruby>心理症状<rt>しんりしょうじょう<\/rt><\/ruby>（ＢＰＳＤ）であるアパシー（apathy）に<ruby>関<rt>かん<\/rt><\/ruby>する<ruby>次<rt>つぎ<\/rt><\/ruby>の<ruby>記述<rt>きじゅつ<\/rt><\/ruby>のうち，<ruby>適切<rt>てきせつ<\/rt><\/ruby>なものを1 つ<ruby>選<rt>えら<\/rt><\/ruby>びなさい。","感情の起伏がみられない。":"<ruby>感情<rt>かんじょう<\/rt><\/ruby>の<ruby>起伏<rt>きふく<\/rt><\/ruby>がみられない。","将来に希望がもてない。":"<ruby>将来<rt>しょうらい<\/rt><\/ruby>に<ruby>希望<rt>きぼう<\/rt><\/ruby>がもてない。","気持ちが落ち込む。":"<ruby>気持<rt>きも<\/rt><\/ruby>ちが<ruby>落<rt>お< bral infarction）の<ruby>後遺症<rt>こういしょう<\/rt><\/ruby>があり，<ruby>介護福祉士<rt>かいごふくしし<\/rt><\/ruby>が<ruby>胃<rt>い<\/rt><\/ruby>ろうによる<ruby>経管栄養<rt>けいかんえいよう<\/rt><\/ruby>を<ruby>行<rt>おこな<\/rt><\/ruby>っている。ある<ruby>日<rt>ひ<\/rt><\/ruby>，<ruby>半座位<rt>はんざい<\/rt><\/ruby>で<ruby>栄養剤<rt>えいようざい<\/rt><\/ruby>の<ruby>注入<rt>ちゅうにゅう<\/rt><\/ruby>を<ruby>開始<rt>かいし<\/rt><\/ruby>し，<ruby>半分程度<rt>はんぶんていど<\/rt><\/ruby>を<ruby>順調<rt>じゅんちょう<\/rt><\/ruby>に<ruby>注入<rt>ちゅうにゅう<\/rt><\/ruby>したところで，<ruby>体調<rt>たいちょう<\/rt><\/ruby>に<ruby>変<rt>か<\/rt><\/ruby>わりがないかを<ruby>聞<rt>き<\/rt><\/ruby>くと，「<ruby>少<rt>すこ<\/rt><\/ruby>しお<ruby>腹<rt>なか<\/rt><\/ruby>が<ruby>張<rt>は<\/rt><\/ruby>ってきたような<ruby>気<rt>き<\/rt><\/ruby>がする」とＥさんは<ruby>答<rt>こた<\/rt><\/ruby>えた。<ruby>意識<rt>いしき<\/rt><\/ruby>レベルや<ruby>顔色<rt>かおいろ<\/rt><\/ruby>に<ruby>変化<rt>へんか<\/rt><\/ruby>はなく，<ruby>腹痛<rt>ふくつう<\/rt><\/ruby>や<ruby>嘔気<rt>おうき<\/rt><\/ruby>はない。<ruby>次<rt>つぎ<\/rt><\/ruby>のうち，<ruby>介護福祉士<rt>かいごふくしし<\/rt><\/ruby>が<ruby>看護職員<rt>かんごしょくいん<\/rt><\/ruby>に<ruby>相談<rt>そうだん<\/rt><\/ruby>する<ruby>前<rt>まえ<\/rt><\/ruby>に<ruby>行<rt>おこな<\/rt><\/ruby>う<ruby>対応<rt>たいおう<\/rt><\/ruby>として，<ruby>最<rt>もっと<\/rt><\/ruby>も<ruby>適切<rt>てきせつ<\/rt><\/ruby>なものを1 つ<ruby>選<rt>えら<\/rt><\/ruby>びなさい。","嘔吐していないので，そのまま様子をみる。":"<ruby>嘔吐<rt>おうと<\/rt><\/ruby>していないので，そのまま<ruby>様子<rt>ようす<\/rt><\/ruby>をみる。","仰臥位（背臥位）にする。":"<ruby>仰臥位<rt>ぎょうがい<\/rt><\/ruby>（<ruby>背臥位<rt>はいがい<\/rt><\/ruby>）にする。","腹部が圧迫されていないかを確認する。":"<ruby>腹部<rt>ふくぶ<\/rt><\/ruby>が<ruby>圧迫<rt>あっぱく<\/rt><\/ruby>されていないかを<ruby>確認<rt>かくにん<\/rt><\/ruby>する。","注入速度を速める。":"<ruby>注入速度<rt>ちゅうにゅうそくど<\/rt><\/ruby>を<ruby>速<rt>はや<\/rt><\/ruby>める。","栄養剤の注入を終了する。":"<ruby>栄養剤<rt>えいようざい<\/rt><\/ruby>の<ruby>注入<rt>ちゅうにゅう<\/rt><\/ruby>を<ruby>終了<rt>しゅうりょう<\/rt><\/ruby>する。","この事例では、まず衣服や姿勢による腹部の圧迫を確認し、看護職員へ状態を伝えます。":"この<ruby>事例<rt>じれい<\/rt><\/ruby>では、まず<ruby>衣服<rt>いふく<\/rt><\/ruby>や<ruby>姿勢<rt>しせい<\/rt><\/ruby>による<ruby>腹部<rt>ふくぶ<\/rt><\/ruby>の<ruby>圧迫<rt>あっぱく<\/rt><\/ruby>を<ruby>確認<rt>かくにん<\/rt><\/ruby>し、<ruby>看護職員<rt>かんごしょくいん<\/rt><\/ruby>へ<ruby>状態<rt>じょう <ruby>本人<rt>ほんにん<\/rt><\/ruby>の<ruby>力<rt>ちから<\/rt><\/ruby>を<ruby>生<rt>い<\/rt><\/ruby>かせるように，<ruby>特定福祉用具販売<rt>とくていふくしようぐはんばい<\/rt><\/ruby>の<ruby>利用<rt>りよう<\/rt><\/ruby>を<ruby>勧<rt>すす<\/rt><\/ruby>める。","Ｂさんが入浴を継続できるように，通所介護（デイサービス）の利用を勧める。":"Ｂさんが<ruby>入浴<rt>にゅうよく<\/rt><\/ruby>を<ruby>継続<rt>けいぞく<\/rt><\/ruby>できるように，<ruby>通所介護<rt>つうしょかいご<\/rt><\/ruby>（デイサービス）の<ruby>利用<rt>りよう<\/rt><\/ruby>を<ruby>勧<rt>すす<\/rt><\/ruby>める。","入浴補助用具は特定福祉用具販売の対象です。本人の力を生かし、自宅での入浴を支えます。":"<ruby>入浴補助用具<rt>にゅうよくほじょようぐ<\/rt><\/ruby>は<ruby>特定福祉用具販売<rt>とくていふくしようぐはんばい<\/rt><\/ruby>の<ruby>対象<rt>たいしょう<\/rt><\/ruby>です。<ruby>本人<rt>ほんにん<\/rt><\/ruby>の<ruby>力<rt>ちから<\/rt><\/ruby>を<ruby>生か<rt>いか<\/rt><\/ruby>し、<ruby>自宅<rt>じたく<\/rt><\/ruby>での<ruby>入浴<rt>にゅうよく<\/rt><\/ruby>を<ruby>支え<rt>ささえ<\/rt><\/ruby>ます。","社会奉仕の精神をもって，住民の立場に立って相談に応じ，必要な援助を行い，社会福祉の増進に努める者として，適切なものを1 つ選びなさい。":"<ruby>社会奉仕<rt>しゃかいほうし<\/rt><\/ruby>の<ruby>精神<rt>せいしん<\/rt><\/ruby>をもって，<ruby>住民<rt>じゅうみん<\/rt><\/ruby>の<ruby>立場<rt>たちば<\/rt><\/ruby>に<ruby>立<rt>た<\/rt><\/ruby>って<ruby>相談<rt>そうだん<\/rt><\/ruby>に<ruby>応<rt>おう<\/rt><\/ruby>じ，<ruby>必要<rt>ひつよう<\/rt><\/ruby>な<ruby>援助<rt>えんじょ<\/rt><\/ruby>を<ruby>行<rt>おこな<\/rt><\/ruby>い，<ruby>社会福祉<rt>しゃかいふくし<\/rt><\/ruby>の<ruby>増進<rt>ぞうしん<\/rt><\/ruby>に<ruby>努<rt>つと<\/rt><\/ruby>める<ruby>者<rt>もの<\/rt><\/ruby>として，<ruby>適切<rt>てきせつ<\/rt><\/ruby>なものを1 つ<ruby>選<rt>えら<\/rt><\/ruby>びなさい。","生活相談員":"<ruby>生活相談員<rt>せいかつそうだんいん<\/rt><\/ruby>","訪問介護員（ホームヘルパー）":"<ruby>訪問介護員<rt>ほうもんかいごいん<\/rt><\/ruby>（ホームヘルパー）","通所介護職員":"<ruby>通所介護職員<rt>つうしょかいごしょくいん<\/rt><\/ruby>","民生委員は、住民の立場で相談に応じ、必要な援助につなぐ地域の担い手です。":"<ruby>民生委員<rt>みんせいいいん<\/rt><\/ruby>は、<ruby>住民<rt>じゅうみん<\/rt><\/ruby>の<ruby>立場<rt>たちば<\/rt><\/ruby>で<ruby>相談<rt>そうだん<\/rt><\/ruby>に<ruby>応じ<rt>おうじ<\/rt><\/ruby>、<ruby>必要<rt>ひつよう<\/rt><\/ruby>な<ruby>援助<rt>えんじょ<\/rt><\/ruby>につなぐ<ruby>地域<rt>ちいき<\/rt><\/ruby>の<ruby>担い手<rt>にないて<\/rt><\/ruby>です。","3 階建て介護老人福祉施設がある住宅地に，下記の図記号に関連した警戒レベル3 が発令された。介護福祉職がとるべき行動として，最も適切なものを1 つ選びなさい。":"3 <ruby>階建<rt>かいだ<\/rt><\/ruby>て<ruby>介護老人福祉施設<rt>かいごろうじ <\/ruby>いだす。","各職種の日頃の悩みを共有する。":"<ruby>各職種<rt>かくしょくしゅ<\/rt><\/ruby>の<ruby>日頃<rt>ひごろ<\/rt><\/ruby>の<ruby>悩<rt>なや<\/rt><\/ruby>みを<ruby>共有<rt>きょうゆう<\/rt><\/ruby>する。","事例検討は、チームで課題を整理・共有し、よりよい支援方法を考えるために行います。":"<ruby>事例検討<rt>じれいけんとう<\/rt><\/ruby>は、チームで<ruby>課題<rt>かだい<\/rt><\/ruby>を<ruby>整理<rt>せいり<\/rt><\/ruby>・<ruby>共有<rt>きょうゆう<\/rt><\/ruby>し、よりよい<ruby>支援<rt>しえん<\/rt><\/ruby><ruby>方法<rt>ほうほう<\/rt><\/ruby>を<ruby>考え<rt>かんがえ<\/rt><\/ruby>るために<ruby>行い<rt>おこない<\/rt><\/ruby>ます。","介護老人福祉施設における，レクリエーション活動に関する次の記述のうち，最も適切なものを1 つ選びなさい。":"<ruby>介護老人福祉施設<rt>かいごろうじんふくししせつ<\/rt><\/ruby>における，レクリエーション<ruby>活動<rt>かつどう<\/rt><\/ruby>に<ruby>関<rt>かん<\/rt><\/ruby>する<ruby>次<rt>つぎ<\/rt><\/ruby>の<ruby>記述<rt>きじゅつ<\/rt><\/ruby>のうち，<ruby>最<rt>もっと<\/rt><\/ruby>も<ruby>適切<rt>てきせつ<\/rt><\/ruby>なものを1 つ<ruby>選<rt>えら<\/rt><\/ruby>びなさい。","利用者全員が参加することを重視する。":"<ruby>利用者全員<rt>りようしゃぜんいん<\/rt><\/ruby>が<ruby>参加<rt>さんか<\/rt><\/ruby>することを<ruby>重視<rt>じゅうし<\/rt><\/ruby>する。","毎回，異なるプログラムを企画する。":"<ruby>毎回<rt>まいかい<\/rt><\/ruby>，<ruby>異<rt>こと<\/rt><\/ruby>なるプログラムを<ruby>企画<rt>きかく<\/rt><\/ruby>する。","プログラムに買い物や調理も取り入れる。":"プログラムに<ruby>買<rt>か<\/rt><\/ruby>い<ruby>物<rt>もの<\/rt><\/ruby>や<ruby>調理<rt>ちょうり<\/rt><\/ruby>も<ruby>取<rt>と<\/rt><\/ruby>り<ruby>入<rt>い<\/rt><\/ruby>れる。","利用者の過去の趣味を，プログラムに取り入れることは避ける。":"<ruby>利用者<rt>りようしゃ<\/rt><\/ruby>の<ruby>過去<rt>かこ<\/rt><\/ruby>の<ruby>趣味<rt>しゅみ<\/rt><\/ruby>を，プログラムに<ruby>取<rt>と<\/rt><\/ruby>り<ruby>入<rt>い<\/rt><\/ruby>れることは<ruby>避<rt>さ<\/rt><\/ruby>ける。","地域のボランティアの参加は，遠慮してもらう。":"<ruby>地域<rt>ちいき<\/rt><\/ruby>のボランティアの<ruby>参加<rt>さんか<\/rt><\/ruby>は，<ruby>遠慮<rt>えんりょ<\/rt><\/ruby>してもらう。","買い物や調理など、生活に身近で楽しみや役割を感じられる活動も取り入れます。":"<ruby>買い物<rt>かいもの<\/rt><\/ruby>や<ruby>調理<rt>ちょうり<\/rt><\/ruby>など、<ruby>生活<rt>せいかつ<\/rt><\/ruby>に<ruby>身近<rt>みじか<\/rt><\/ruby>で<ruby>楽しみ<rt>たのしみ<\/rt><\/ruby>や<ruby>役割<rt>やくわり<\/rt><\/ruby>を<ruby>感じ<rt>かんじ<\/rt><\/ruby>られる<ruby>活動<rt>かつどう<\/rt><\/ruby>も<ruby>取り入れ<rt>とりいれ<\/rt><\/ruby>ます。","関節リウマチ（rheumatoid arthritis）で，関節の変形や痛みがある人への住まいに関する介護福祉職の助言として，最も適切なものを1 つ選びなさい。": ruby>妻<rt>つま<\/rt><\/ruby>は<ruby>今後<rt>こんご<\/rt><\/ruby> <ruby>同<rt>おな<\/rt><\/ruby>じようなことが<ruby>起<rt>お<\/rt><\/ruby>きないように，Ｃさんの<ruby>行動<rt>こうどう<\/rt><\/ruby>を<ruby>常<rt>つね<\/rt><\/ruby>に<ruby>見守<rt>みまも<\/rt><\/ruby>り，<ruby>外出<rt>がいしゅつ<\/rt><\/ruby>を<ruby>制限<rt>せいげん<\/rt><\/ruby>したが，<ruby>疲労<rt>ひろう<\/rt><\/ruby>がたまり，<ruby>今後<rt>こんご<\/rt><\/ruby>の<ruby>生活<rt>せいかつ<\/rt><\/ruby>に<ruby>不安<rt>ふあん<\/rt><\/ruby>を<ruby>感<rt>かん<\/rt><\/ruby>じた。そこで，<ruby>地域包括支援<rt>ちいきほうかつしえん<\/rt><\/ruby>センターに<ruby>相談<rt>そうだん<\/rt><\/ruby>し，<ruby>要介護認定<rt>ようかいごにんてい<\/rt><\/ruby>の<ruby>申請<rt>しんせい<\/rt><\/ruby>を<ruby>行<rt>おこな<\/rt><\/ruby>い，<ruby>訪問介護<rt>ほうもんかいご<\/rt><\/ruby>（ホームヘルプサービス）を<ruby>利用<rt>りよう<\/rt><\/ruby>することになった。","脱抑制":"<ruby>脱抑制<rt>だつよくせい<\/rt><\/ruby>","記憶障害":"<ruby>記憶障害<rt>きおくしょうがい<\/rt><\/ruby>","感情失禁":"<ruby>感情失禁<rt>かんじょうしっきん<\/rt><\/ruby>","見当識障害":"<ruby>見当識障害<rt>けんとうしきしょうがい<\/rt><\/ruby>","遂行機能障害":"<ruby>遂行機能障害<rt>すいこうきのうしょうがい<\/rt><\/ruby>","脱抑制は、行動を抑える力が弱くなる状態です。前頭側頭型認知症でみられることがあります。":"<ruby>脱抑制<rt>だつよくせい<\/rt><\/ruby>は、<ruby>行動<rt>こうどう<\/rt><\/ruby>を<ruby>抑え<rt>おさえ<\/rt><\/ruby>る<ruby>力<rt>ちから<\/rt><\/ruby>が<ruby>弱く<rt>よわく<\/rt><\/ruby>なる<ruby>状態<rt>じょうたい<\/rt><\/ruby>です。<ruby>前頭側頭型認知症<rt>ぜんとうそくとうがたにんちしょう<\/rt><\/ruby>でみられることがあります。","Ｃさんの介護保険制度の利用に関する次の記述のうち，適切なものを1 つ選びなさい。":"Ｃさんの<ruby>介護保険制度<rt>かいごほけんせいど<\/rt><\/ruby>の<ruby>利用<rt>りよう<\/rt><\/ruby>に<ruby>関<rt>かん<\/rt><\/ruby>する<ruby>次<rt>つぎ<\/rt><\/ruby>の<ruby>記述<rt>きじゅつ<\/rt><\/ruby>のうち，<ruby>適切<rt>てきせつ<\/rt><\/ruby>なものを1 つ<ruby>選<rt>えら<\/rt><\/ruby>びなさい。","介護保険サービスの利用者負担割合は1 割である。":"<ruby>介護保険<rt>かいごほけん<\/rt><\/ruby>サービスの<ruby>利用者負担割合<rt>りようしゃふたんわりあい<\/rt><\/ruby>は1 <ruby>割<rt>わり<\/rt><\/ruby>である。","介護保険料は特別徴収によって納付する。":"<ruby>介護保険料<rt>かいごほけんりょう<\/rt><\/ruby>は<ruby>特別徴収<rt>とくべつちょうしゅう<\/rt><\/ruby>によって<ruby>納付<rt>のうふ<\/rt><\/ruby>する。","要介護認定の結果が出る前に介護保険サービスを利用することはできない。":"<ruby>要介護認定<rt>ようかいごにんてい<\/rt><\/ruby>の<ruby>結果<rt>けっか<\/rt><\/ruby>が<ruby>出<rt>で<\/rt><\/ruby>る<ruby>前<rt>まえ<\/rt><\/ruby>に<ruby>介護保険<rt>かいごほけん<\/rt>
