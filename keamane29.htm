<script>
/* <![CDATA[ */
(()=>{
'use strict';
const host=document.currentScript.previousElementSibling;
const root=host.attachShadow({mode:'open'});
const QUESTIONS=[{"id":1,"subject":0,"question":"日本の社会保険について正しいものはどれか。 2つ選べ。","options":["介護保険は、社会保険に含まれる。","雇用保険は、社会保険に含まれる。","生活保護は、社会保険に含まれる。","年金保険は、基本的に任意加入である。","財源は、全額が公費である。"],"answer":[1,2],"explanation":"介護保険と雇用保険は社会保険です。生活保護は公的扶助に当たります。公的年金は原則として強制加入で、社会保険の財源には保険料と公費が使われます。"},{"id":2,"subject":0,"question":"2024（令和6）年度の全国における介護保険給付の状況について正しいものはどれか。 2つ選べ。","options":["年間実受給者数は、居宅サービスの方が施設サービスより多い。","年間実受給者数は、介護予防サービスの方が介護サービスより多い。","居宅サービスでは、訪問リハビリテーションの費用額が最も多い。","介護予防サービスでは、介護予防訪問入浴介護の費用額が最も多い。","施設サービスでは、介護福祉施設サービスの費用額が最も多い。"],"answer":[1,5],"explanation":"年間実受給者数は、施設サービスより居宅サービスの方が多く、介護予防サービスより介護サービスの方が多くなっています。施設サービスの費用額は、介護福祉施設サービスが最も多くなっています。"},{"id":3,"subject":0,"question":"介護保険制度における住所地特例の適用があるものとして正しいものはどれか。 3つ選べ。","options":["指定介護老人福祉施設","介護老人保健施設","指定認知症対応型共同生活介護","介護医療院","指定小規模多機能型居宅介護"],"answer":[1,2,4],"explanation":"介護老人福祉施設、介護老人保健施設、介護医療院は住所地特例の対象です。認知症対応型共同生活介護と小規模多機能型居宅介護は対象に含まれません。"},{"id":4,"subject":0,"question":"介護保険制度における被保険者資格について正しいものはどれか。 3つ選べ。","options":["介護保険料を1月以上滞納した第1号被保険者は、被保険者資格を喪失する。","第1号被保険者が生活保護受給者になった場合は、被保険者資格を喪失する。","医療保険加入者が40歳に達したとき、住所を有する市町村の被保険者資格を取得する。","被保険者が死亡した場合は、その翌日から、被保険者資格を喪失する。","生活保護法に規定する救護施設など、介護保険の適用除外施設に入所した65歳以上の者は、第1号被保険者とならない。"],"answer":[3,4,5],"explanation":"医療保険加入者は40歳になると第2号被保険者になります。死亡による資格喪失は翌日です。保険料の滞納や生活保護の受給だけで第1号被保険者の資格を失うわけではありません。"},{"id":5,"subject":0,"question":"介護保険の被保険者証の取扱いとして正しいものはどれか。 3つ選べ。","options":["給付の対象であるサービスを受けようとする被保険者は、事業者に提示する。","第2号被保険者については、交付の申請を行った場合に交付される。","死亡により被保険者が資格を喪失した場合は、返還する必要はない。","破り、又は汚した場合は、その被保険者証を添付し、再交付を申請しなければならない。","世帯単位で発行される。"],"answer":[1,2,4],"explanation":"被保険者証は個人単位で交付され、サービスを受ける際に提示します。第2号被保険者は申請により交付を受けます。破損・汚損時は再交付を申請し、死亡による資格喪失時は返還します。"},{"id":6,"subject":0,"question":"要介護認定について正しいものはどれか。 3つ選べ。","options":["要介護認定を受けようとする第1号被保険者は、被保険者証を添付して申請をしなければならない。","介護医療院は、申請に関する手続を代行することができない。","地域包括支援センターは、申請に関する手続を代行することができない。","被保険者が遠隔地に居住するときは、市町村は、認定調査を他の市町村に嘱託することができる。","被保険者が正当な理由なく認定調査に応じないときは、市町村は、申請を却下することができる。"],"answer":[1,4,5],"explanation":"第1号被保険者の認定申請には被保険者証を添付します。介護医療院や地域包括支援センターも申請を代行できます。遠隔地では他の市町村への調査の嘱託ができ、正当な理由のない調査拒否は却下の理由となります。"},{"id":7,"subject":0,"question":"介護認定審査会について正しいものはどれか。 3つ選べ。","options":["市町村長が定める基準に従い、審査及び判定を行う。","必要があると認めるときは、審査対象の被保険者の意見を聴くことができる。","第2号被保険者については、要介護状態の原因である身体上又は精神上の障害が特定疾病によって生じたものであるか、審査及び判定を行う。","審査対象者を担当する介護支援専門員が参加しなければならない。","委員は、職務上知り得た秘密を漏らしてはならない。"],"answer":[2,3,5],"explanation":"介護認定審査会は、厚生労働大臣が定める全国共通の基準に従います。本人の意見を聴くことができ、第2号被保険者の特定疾病も審査します。委員には守秘義務があります。"},{"id":8,"subject":0,"question":"介護保険法における介護支援専門員について正しいものはどれか。 3つ選べ。","options":["介護支援専門員証の交付を受けていなくても、介護支援専門員としてその業務を行うことができる。","専門的知識や技術の水準を向上させ、資質の向上を図るよう努めなければならない。","介護支援専門員の信用を傷つけるような行為をしてはならない。","サービスが特定の種類や事業者に不当に偏ることのないよう、公正かつ誠実にその業務を行わなければならない。","業務に関して知り得た人の秘密を漏らしてはならない期間は、5年である。"],"answer":[2,3,4],"explanation":"介護支援専門員として業務を行うには介護支援専門員証が必要です。資質の向上、信用の保持、公正・誠実な業務が求められます。守秘義務に「5年間」という期限はありません。"},{"id":9,"subject":0,"question":"介護保険法における保険給付について正しいものはどれか。 3つ選べ。","options":["介護給付、予防給付、市町村特別給付がある。","居宅介護サービス計画費の支給は、現物給付化されている。","施設介護サービス費の支給は、現物給付化が認められていない。","高額介護サービス費の負担上限額は、被保険者の家計に与える影響を考慮して定められている。","福祉用具購入費は、居宅介護サービス費等に関する区分支給限度基準額の算定対象である。"],"answer":[1,2,4],"explanation":"保険給付には介護給付、予防給付、市町村特別給付があります。居宅介護サービス計画費や施設介護サービス費は現物給付化されています。福祉用具購入費の支給限度は、居宅サービスの月ごとの限度額とは別枠です。"},{"id":10,"subject":0,"question":"介護保険料を滞納している第1号被保険者に対する介護保険法上の措置として正しいものはどれか。 3つ選べ。","options":["介護保険給付額の減額","医療保険給付の支給停止","介護保険給付の一時差止め","要介護認定の取消し","介護保険給付の現物給付から償還払いへの変更"],"answer":[1,3,5],"explanation":"保険料の滞納に対しては、滞納期間等に応じて償還払いへの変更、保険給付の一時差止め、給付額の減額が行われます。医療保険給付の停止や要介護認定の取消しではありません。"},{"id":11,"subject":0,"question":"地域支援事業のうち包括的支援事業として正しいものはどれか。 3つ選べ。","options":["生活支援体制整備事業","家族介護支援事業","介護給付等費用適正化事業","認知症総合支援事業","在宅医療・介護連携推進事業"],"answer":[1,4,5],"explanation":"生活支援体制整備事業、認知症総合支援事業、在宅医療・介護連携推進事業は包括的支援事業です。家族介護支援事業と介護給付等費用適正化事業は任意事業に分類されます。"},{"id":12,"subject":0,"question":"介護サービス情報の公表制度について正しいものはどれか。 3つ選べ。","options":["指定居宅サービス事業者は、当該介護サービスを提供する事業所の所在地を管轄する都道府県知事に介護サービス情報を報告しなければならない。","介護サービス情報の報告は、都道府県知事が毎年定める計画に従って行うものとする。","介護サービス情報の公表制度の対象サービスに、居宅介護支援は含まれる。","介護サービス情報の公表は、国民健康保険団体連合会が行う。","介護サービス事業者が虚偽の報告をした場合、厚生労働大臣は当該事業者の指定を取り消すことができる。"],"answer":[1,2,3],"explanation":"介護サービス情報は都道府県知事に報告し、知事が公表します。報告は毎年定める計画に従い、居宅介護支援も対象です。国民健康保険団体連合会が公表する制度ではありません。"},{"id":13,"subject":0,"question":"介護保険審査会への審査請求が認められるものとして正しいものはどれか。 2つ選べ。","options":["要介護認定に関する処分","指定介護老人福祉施設の指定の取消しに関する処分","介護支援専門員の資格に関する処分","財政安定化基金拠出金への拠出額に関する処分","被保険者証の交付の請求に関する処分"],"answer":[1,5],"explanation":"要介護認定や被保険者証の交付請求に関する処分は、介護保険審査会への審査請求の対象です。事業者の指定や介護支援専門員の資格に関する処分とは区別します。"},{"id":14,"subject":0,"question":"介護保険法における消滅時効について正しいものはどれか。 3つ選べ。","options":["消滅時効とは、権利を行使しない状態が一定期間継続することにより、その権利が消滅することをいう。","介護保険料の還付を受ける権利には、消滅時効がない。","保険者が介護保険料の支払を督促しても、消滅時効は更新されない。","介護保険料を徴収する権利には、消滅時効がある。","償還払い方式による介護給付費の請求権には、消滅時効がある。"],"answer":[1,4,5],"explanation":"介護保険料の徴収・還付を受ける権利や保険給付を受ける権利は、原則として2年で時効により消滅します。保険料の納入の告知や督促には、時効を更新する効力があります。"},{"id":15,"subject":0,"question":"指定居宅介護支援事業者の記録の整備について正しいものはどれか。 3つ選べ。","options":["指定居宅サービス事業者等との連絡調整に関する記録は、支援の完結後も定められた期間保存しなければならない。","会計に関する記録は、整備しておかなければならない。","自らが居宅サービス計画に位置付けたサービス等に対する苦情の内容等の記録は、支援の完結後も定められた期間保存しなければならない。","利用者の課題に関するアセスメントの結果の記録は、支援が完結すればその時点で廃棄してよい。","利用者に対する指定居宅介護支援の提供により発生した事故の状況についての記録は、支援の完結後は保存しなくてよい。"],"answer":[1,2,3],"explanation":"会計の記録を整備するとともに、連絡調整、苦情、アセスメント、事故等の記録を保存します。支援が完結しても、定められた保存期間が終わるまで廃棄できません。"},{"id":16,"subject":0,"question":"指定居宅介護支援の提供の開始について適切なものはどれか。 3つ選べ。","options":["その事業所の介護支援専門員の人員体制では利用申込に応じきれない場合であっても、利用申込を拒むことはできない。","要介護認定を受けていない利用申込者に対しては、事業者は認定申請に必要な援助を行わなくてもよい。","あらかじめ、利用申込者又はその家族に対し、運営規程等の重要事項を記した文書を交付して説明を行い、指定居宅介護支援の提供開始について同意を得なければならない。","あらかじめ、利用者又はその家族に対し、利用者について入院する必要が生じた場合には、当該利用者に係る介護支援専門員の氏名と連絡先を入院先の病院や診療所に伝えるよう求めなければならない。","あらかじめ、利用者又はその家族に対し、複数の指定居宅サービス事業者等を紹介するよう求めることができることを説明しなければならない。"],"answer":[3,4,5],"explanation":"重要事項の説明と同意、入院先へ担当者の氏名・連絡先を伝えるよう求めること、複数の事業者の紹介を求められる旨の説明が必要です。認定申請の援助も行い、人員不足等で受けられない場合は他事業者の紹介等を行います。"},{"id":17,"subject":0,"question":"居宅サービス計画の作成について適切なものはどれか。 2つ選べ。","options":["その地域における指定居宅サービス事業者等に関するサービスの内容、利用料等の情報を適正に利用者又はその家族に対して提供するものとする。","介護給付等対象サービス以外のサービスを位置付けてはならない。","サービス提供事業者の選択は、利用者本人の意向にかかわらず、介護支援専門員が行う。","原案について利用者が了解した場合は、サービス担当者会議の開催は不要である。","利用者が通所リハビリテーションの利用を希望しているときは、利用者の同意を得て主治の医師等の意見を求めなければならない。"],"answer":[1,5],"explanation":"サービスの情報を提供し、本人の意向を尊重して計画を作成します。保険給付以外のサービスも位置付けられます。通所リハビリテーションの利用では、本人の同意を得て主治医等の意見を求めます。"},{"id":18,"subject":0,"question":"指定居宅介護支援に係るモニタリングについて、より適切なものはどれか。 2つ選べ。","options":["少なくとも半年に1回、利用者の居宅を訪問して面接しなければならない。","訪問月以外にテレビ電話装置等を活用して面接する場合、文書により利用者の同意を得ていなければならない。","目標の達成度の把握は、含まれる。","居宅サービス計画に位置付けたサービス事業者の第三者評価の内容を確認することが義務付けられている。","結果は、居宅サービス計画書に添えて保険者に提出しなければならない。"],"answer":[2,3],"explanation":"モニタリングでは目標の達成度も把握します。原則として毎月居宅を訪問し、一定の要件を満たす場合は2月に1回以上の訪問とテレビ電話等による面接を組み合わせられます。その場合も文書による同意が必要です。"},{"id":19,"subject":0,"question":"介護予防サービス計画について正しいものはどれか。 3つ選べ。","options":["介護予防短期入所生活介護を位置付ける場合には、その利用日数が1月あたり10日を超えてはならない。","介護予防福祉用具貸与を位置付ける場合には、貸与が必要な理由を記載しなければならない。","地域の住民による自発的な活動によるサービス等の利用も含めて位置付けるよう努めなければならない。","介護予防訪問看護を位置付ける場合には、主治の医師等の指示がなければならない。","計画に位置付けた指定介護予防サービス事業者から、利用者の状態等に関する報告を少なくとも半年に1回、聴取しなければならない。"],"answer":[2,3,4],"explanation":"福祉用具貸与が必要な理由を計画に記載し、住民の自発的な活動も活用します。訪問看護には主治医等の指示が必要です。サービス事業者からは、少なくとも毎月、利用者の状態等の報告を受けます。"},{"id":20,"subject":0,"question":"指定介護老人福祉施設の施設サービス計画について正しいものはどれか。 2つ選べ。","options":["入所者ごとに作成しなければならない。","介護支援専門員でない者でも作成することができる。","原案の内容については、入所者の同意は必要がない。","アセスメントは、入所者及びその家族に面接して行わなければならない。","モニタリングのための利用者との面接は必要がない。"],"answer":[1,4],"explanation":"施設サービス計画は、計画担当介護支援専門員が入所者ごとに作成します。本人・家族との面接によるアセスメント、本人の同意、面接を含むモニタリングが必要です。"},{"id":21,"subject":0,"question":"要介護認定等基準時間に含まれる行為として正しいものはどれか。 3つ選べ。","options":["洗濯、掃除等の家事援助","歩行訓練","認定調査票の特記事項の確認","本人の経済的状況の把握","入浴、排せつ、食事等の介護"],"answer":[1,2,5],"explanation":"家事援助は間接生活介助、歩行訓練は機能訓練、入浴・排せつ・食事の介護は直接生活介助に当たり、基準時間に含まれます。認定調査票の確認や経済状況の把握そのものは含まれません。"},{"id":22,"subject":0,"question":"要介護認定について正しいものはどれか。 2つ選べ。","options":["一次判定は、認定調査票の特記事項と主治医意見書に基づき行われる。","二次判定では、ケアプランの原案を使用する。","介護認定審査会は、認定の有効期間について意見を付すことができる。","二次判定では、一次判定の結果を変更できる。","二次判定では、一次判定で非該当になった者の審査は行わない。"],"answer":[3,4],"explanation":"一次判定は基本調査等に基づくコンピュータ判定です。二次判定では特記事項や主治医意見書等も確認し、一次判定の結果の変更や認定有効期間への意見の付記ができます。一次判定が非該当の人も審査します。"},{"id":23,"subject":0,"question":"Aさん（77歳、女性）は自宅での転倒による骨折のため入院し、歩行器を使って歩けるまで回復した。自宅への退院が決まり、要介護認定の申請手続きを進めている。同居している長女（53歳）が居宅介護支援事業所に連絡し、介護支援専門員が病院を訪れ、Aさんと長女との面接を行うこととなった。そのときの介護支援専門員の対応として、より適切なものはどれか。 3つ選べ。","options":["介護保険制度や介護支援専門員の役割を説明する。","Aさんの現在の歩行能力の状態を聞き取る。","利用するサービスを決めるため、通所リハビリテーション事業所の職員を面接に同行させる。","退院後の生活に関する意向や不安についてAさんと長女から聞き取る。","自宅の居住環境について聞き取る必要はない。"],"answer":[1,2,4],"explanation":"最初の面接では、制度や担当者の役割を説明し、本人の状態、本人・家族の希望や不安、住環境を把握します。十分に状況を確認する前に、利用するサービスを決めつけないことが大切です。"},{"id":24,"subject":0,"question":"Aさん（80歳、男性、独居）は要支援2の認定を受けて、家事援助の訪問サービスを利用している。Aさんは閉じこもりがちで外出の機会も少なく、体力が低下してきている。さらにかかりつけ医からは、血圧や血糖値の上昇を指摘されている。以前は食事に無頓着であったが、現在は食生活について改善したいとの意向を持っている。担当の介護支援専門員の対応として、より適切なものはどれか。 3つ選べ。","options":["食生活の状況について聞き取る。","社会参加の状況や対人関係を把握する。","食生活の改善について、かかりつけ医に相談するよう提案する。","介護支援専門員が自ら栄養指導をする。","通所サービスの利用については、本人の意向を確認しない。"],"answer":[1,2,3],"explanation":"食生活や社会参加の状況を確認し、本人の改善したいという思いを支えます。血圧・血糖値の上昇もあるため、かかりつけ医への相談を促し、必要に応じて管理栄養士等と連携します。"},{"id":25,"subject":0,"question":"Aさん（52歳、男性、会社員）は、人の顔や名前を忘れたり、通勤経路が分からなくなることがあるので、妻（50歳、会社員）と一緒に医療機関を受診した。その結果、アルツハイマー型認知症と診断され、要介護1の認定を受けた。Aさんはこれまでどおり自宅で生活し、仕事も続けたいと言っているが、夫婦ともに将来に不安がある。担当の介護支援専門員の対応として、より適切なものはどれか。 3つ選べ。","options":["有料老人ホームへすぐに入所するよう勧める。","若年性認知症本人とその家族の集いの場についての情報を提供する。","Aさん夫婦の希望を尊重して、今後の方針を話し合う。","Aさん夫婦の了解を得ないまま近隣の家を訪問して、Aさんに異変があれば自分に連絡してもらうよう依頼する。","Aさんの仕事の継続について、かかりつけ医や産業医へ相談するよう勧める。"],"answer":[2,3,5],"explanation":"本人と妻の希望を尊重して方針を話し合い、交流の場や相談先の情報を提供します。仕事の継続は主治医や産業医等に相談します。本人たちの了解なく近隣に個人情報を伝えることは適切ではありません。"},{"id":26,"subject":1,"question":"高齢者の疾患の特徴として、より適切なものはどれか。 3つ選べ。","options":["若年者に比べて、脱水のリスクが高い。","症状は、定型的であることが多い。","一人で多くの疾患を併せ持つことが多い。","骨密度の低下が見られることが多い。","予後は、社会的要因に影響されない。"],"answer":[1,3,4],"explanation":"高齢者は脱水や骨密度低下のリスクがあり、複数の疾患を併せ持ちやすいという特徴があります。典型的な症状が出ないこともあり、予後は生活環境や支援体制などの社会的要因にも影響されます。"},{"id":27,"subject":1,"question":"次の記述のうち、より適切なものはどれか。 3つ選べ。","options":["体温は、24時間を通じて一定である。","呼吸状態が悪くなると、皮膚や粘膜が青紫色になることがある。","一般的には、血圧は安静時に測定する。","寝ている間に血圧が異常に上昇する状態を、起立性低血圧という。","バイタルサインの一つに、意識レベルがある。"],"answer":[2,3,5],"explanation":"体温には日内変動があり、血圧は一般に安静時に測定します。低酸素状態ではチアノーゼが現れることがあります。起立性低血圧は立ち上がった際などの血圧低下で、意識レベルも重要な観察項目です。"},{"id":28,"subject":1,"question":"次の記述のうち、より適切なものはどれか。 3つ選べ。","options":["BMI（Body Mass Index）は、認知機能の指標である。","ヘモグロビンA1cは、糖尿病の管理に用いられる。","LDLコレステロール値が高い状態は、高尿酸血症と呼ばれる。","便潜血検査が「陽性」の場合は、大腸で出血している可能性がある。","血清クレアチニン値は、腎機能の指標となる。"],"answer":[2,4,5],"explanation":"ヘモグロビンA1cは血糖管理、血清クレアチニンは腎機能の指標です。便潜血陽性は消化管出血の可能性を示します。BMIは体格の指標で、LDLコレステロール高値は脂質異常症に関係します。"},{"id":29,"subject":1,"question":"次の記述のうち、より適切なものはどれか。 3つ選べ。","options":["床に就いてもなかなか眠れないことを中途覚醒という。","エアマットなどの体圧分散寝具を用いた場合には、体位変換を行う必要はない。","ベッドから車いすへの移乗を介助している人には、腰痛が生じることがある。","入浴介助の際には、皮膚炎や褥そうなどの有無を確認する。","口腔内・口腔周囲を動かすことは、オーラルフレイルの予防につながる。"],"answer":[3,4,5],"explanation":"寝床に入っても眠れない状態は入眠障害です。体圧分散寝具を使っていても体位変換は必要です。移乗時の腰痛予防、入浴時の皮膚観察、口腔機能を保つ運動も大切です。"},{"id":30,"subject":1,"question":"リハビリテーションについて、より適切なものはどれか。 3つ選べ。","options":["患者の状態に応じて、できるだけ早く始める。","残存機能の活用が含まれる。","廃用症候群は、予防することはできない。","食事中の「むせ」は、その時の姿勢とは無関係である。","多職種が連携して行う。"],"answer":[1,2,5],"explanation":"リハビリテーションは状態に応じて早期に開始し、残存機能を活用して多職種で進めます。廃用症候群の予防も目的の一つです。食事中のむせには、食事の姿勢も関係します。"},{"id":31,"subject":1,"question":"認知症について、より適切なものはどれか。 3つ選べ。","options":["運動不足によって、発症リスクが高まることはない。","認知症の有病率は、年齢にかかわらず一定である。","社会的孤立の解消は、認知症の予防につながる。","本人の意思決定を支援することが大切である。","本人のみならず、その家族への支援も大切である。"],"answer":[3,4,5],"explanation":"加齢や運動不足は認知症の発症リスクに関係します。社会的孤立を防ぎ、本人の意思決定を支えることが重要です。本人だけでなく、家族への相談支援や負担軽減も行います。"},{"id":32,"subject":1,"question":"高齢者の精神障害について、より適切なものはどれか。 3つ選べ。","options":["妄想性障害がある患者への対応としては、まずは患者の話をよく聞くことが大切である。","老年期うつ病では、家族、友人などの喪失体験が発症のきっかけとなることはない。","老年期うつ病の治療方法として、薬物療法や精神療法がある。","せん妄は、若年者と比べて高齢者の方が発症しにくい。","アルコール依存症のケアでは、自助グループなどの地域の社会資源の活用も有効である。"],"answer":[1,3,5],"explanation":"妄想のある人には、まず話をよく聴きます。喪失体験はうつ病のきっかけとなり、薬物療法や精神療法が用いられます。高齢者はせん妄を起こしやすく、依存症では自助グループ等も役立ちます。"},{"id":33,"subject":1,"question":"次の記述のうち、より適切なものはどれか。 3つ選べ。","options":["医師個人の経験だけに頼るのではなく、科学的根拠に基づいた医療をエビデンス・ベースド・メディスン（Evidence Based Medicine：EBM）という。","患者が、医療者から病状や治療方法等の説明を十分に受けた上で同意することをインフォームド・コンセントという。","認知機能が低下している場合には、治療方法についての説明は本人には行わない。","患者に関する情報を得るために必要があれば、本人と家族とを別々に面談することがある。","緩和ケアは、在宅では行われない。"],"answer":[1,2,4],"explanation":"EBMは科学的根拠に基づく医療、インフォームド・コンセントは十分な説明を受けた上での同意です。認知機能が低下していても本人への説明を大切にします。緩和ケアは在宅でも受けられます。"},{"id":34,"subject":1,"question":"高齢者の栄養・食生活について、より適切なものはどれか。 3つ選べ。","options":["居宅での食事支援では、介護する家族の状況を考える必要がある。","高齢になっても味覚は低下しない。","低栄養になる要因として、口腔機能の低下がある。","必要な栄養を間食で補うことは適当ではない。","摂食・嚥下機能に応じて、食形態を調整する。"],"answer":[1,3,5],"explanation":"食事支援では本人の口腔機能や嚥下機能に合った食形態を選び、家族の状況も考えます。加齢で味覚が低下することがあり、食事だけで栄養が不足する場合は間食等で補います。"},{"id":35,"subject":1,"question":"在宅医療について、より適切なものはどれか。 3つ選べ。","options":["酸素療法を行うことがある。","中心静脈栄養法を行うことがある。","胃ろうに栄養剤を注入する際には、半座位で行うことはない。","インスリンの自己注射の効果は、体調にかかわらず一定である。","ストーマを造設しても、入浴は可能である。"],"answer":[1,2,5],"explanation":"在宅でも酸素療法や中心静脈栄養が行われ、ストーマ造設後も入浴できます。胃ろうへの注入では逆流を防ぐ姿勢が重要です。インスリンの作用や血糖値は、食事や体調等の影響を受けます。"},{"id":36,"subject":1,"question":"感染症について、より適切なものはどれか。 3つ選べ。","options":["高齢者は、感染症に対する抵抗力が低下していることが多い。","ノロウイルス感染症は、夏に多い。","インフルエンザの感染経路として、飛沫感染がある。","発熱していなければ、インフルエンザの感染を疑う必要はない。","帯状疱疹ワクチンの接種が、高齢者に推奨されている。"],"answer":[1,3,5],"explanation":"高齢者は感染への抵抗力が低下しやすく、発熱が目立たない場合もあります。ノロウイルスは冬季に多く、インフルエンザは飛沫等で感染します。帯状疱疹ワクチンは発症・重症化の予防に役立ちます。"},{"id":37,"subject":1,"question":"緊急時の対応について、より適切なものはどれか。 2つ選べ。","options":["衣類の下の皮膚に「やけど」をした場合は、その衣類を脱がせて流水で冷やす。","窒息が疑われる場合は、直ちに異物の有無を確認し、あればその除去を試みる。","激しく出血している場合は、出血部位よりも心臓から遠い部位を圧迫して止血する。","寝たきりの高齢者が嘔吐した場合には、側臥位にしてはいけない。","両手足に力が入らず、頸髄損傷が疑われる場合は、できるだけ身体を動かさない。"],"answer":[2,5],"explanation":"窒息時は異物を確認して適切な除去を行い、頸髄損傷が疑われる場合は不用意に動かしません。衣類の下のやけどは無理に脱がさず冷やし、出血は傷口を直接圧迫します。嘔吐時は誤嚥の予防が重要です。"},{"id":38,"subject":1,"question":"次の記述について、より適切なものはどれか。 3つ選べ。","options":["就労、ボランティア活動などを通じた社会参加は、フレイル予防に役立たない。","糖尿病の悪化予防には、血糖値の管理が有効である。","前立腺肥大症の場合は、尿意を感じてもなるべく排尿を我慢させる。","高齢者の転倒による骨折は、大腿骨頸部に起きやすい。","心不全の場合は、塩分摂取の管理も重要である。"],"answer":[2,4,5],"explanation":"社会参加はフレイル予防に役立ちます。糖尿病では血糖管理、心不全では塩分管理が重要です。高齢者の転倒では大腿骨頸部骨折に注意し、前立腺肥大症の人に排尿を我慢させないようにします。"},{"id":39,"subject":1,"question":"在宅のケアチームにおける多職種連携について、より適切なものはどれか。 3つ選べ。","options":["利用者を中心として展開する。","構成するメンバー間の相互理解は、不要である。","利用者の状態が変化した場合でも、再編成の検討は行わない。","インフォーマルサービスを担当する関係者も参加する。","構成するメンバーは、その専門性や能力を発揮することが求められる。"],"answer":[1,4,5],"explanation":"ケアチームは利用者を中心に、各職種が専門性を発揮し、相互に理解しながら支援します。インフォーマルな支援者も参加でき、本人の状態が変わればチームの構成も見直します。"},{"id":40,"subject":1,"question":"ターミナルケアについて、より適切なものはどれか。 3つ選べ。","options":["アドバンス・ケア・プランニング（ACP）には、家族は参加できない。","口腔内の保湿や清潔を保つ。","呼吸状態にかかわらず、ベッドを水平に保つ。","下顎呼吸は、臨終が近いことを示している。","臨終が近づいても、本人に声をかけるなど、その人の尊厳を保つケアを行う。"],"answer":[2,4,5],"explanation":"ACPには本人の希望に応じて家族等も参加します。口腔の清潔・保湿や呼吸が楽になる姿勢を整え、最期まで尊厳を守ります。下顎呼吸は臨終が近い時期にみられる呼吸の一つです。"},{"id":41,"subject":1,"question":"介護保険における訪問看護について適切なものはどれか。 2つ選べ。","options":["心身の機能の維持回復を目指すものであり、要介護状態の悪化防止は含まない。","事業所は、24時間365日、サービスを提供することが義務付けられている。","保険医療機関の指定を受けている病院は、介護保険の指定訪問看護事業者とみなされる。","家族に対しても適切な指導を行う。","急性増悪時に主治の医師から特別訪問看護指示書が交付された場合でも、介護保険から給付が行われる。"],"answer":[3,4],"explanation":"訪問看護は機能の維持回復に加え、状態の悪化防止や家族への指導も行います。保険医療機関の病院等は指定を受けたものとみなされます。特別訪問看護指示書に基づく訪問看護は医療保険の対象です。"},{"id":42,"subject":1,"question":"居宅療養管理指導を行うことができる職種として正しいものはどれか。 3つ選べ。","options":["社会福祉士","医師","薬剤師","介護福祉士","管理栄養士"],"answer":[2,3,5],"explanation":"居宅療養管理指導は、医師、歯科医師、薬剤師、歯科衛生士等、管理栄養士が行います。選択肢では医師・薬剤師・管理栄養士が該当し、社会福祉士と介護福祉士は該当しません。"},{"id":43,"subject":1,"question":"介護保険における通所リハビリテーションについて適切なものはどれか。 2つ選べ。","options":["低栄養状態にある高齢者は、利用できない。","通所リハビリテーションを利用している者は、訪問介護を利用できない。","若年性認知症により要介護認定を受けた者は、利用できる。","生活相談員を配置する必要はない。","介護支援専門員は、通所リハビリテーション計画を作成しなければならない。"],"answer":[3,4],"explanation":"通所リハビリテーションは若年性認知症の人も利用でき、低栄養だけを理由に対象外にはなりません。訪問介護との併用も可能です。生活相談員の配置義務はなく、計画は医師等が共同で作成します。"},{"id":44,"subject":1,"question":"指定定期巡回・随時対応型訪問介護看護について適切なものはどれか。 3つ選べ。","options":["利用者が尊厳を保持し、可能な限りその居宅において、その有する能力に応じ自立した日常生活を営むことができるよう援助を行う。","施設サービスである。","オペレーターとは、随時対応サービスとして、利用者やその家族等からの通報に対応する従業者をいう。","計画の作成責任者は、医師でなければならない。","事業者は、サービスの提供の開始に際し、利用者の提示する被保険者証によって、要介護認定の有無等を確かめなければならない。"],"answer":[1,3,5],"explanation":"定期巡回・随時対応型訪問介護看護は、在宅生活を支える地域密着型サービスです。オペレーターが通報に対応し、開始時には被保険者証等を確認します。計画作成責任者は医師に限定されません。"},{"id":45,"subject":1,"question":"介護老人保健施設について適切なものはどれか。 3つ選べ。","options":["計画的なリハビリテーションを行う。","医師を配置しなくてもよい。","保健医療サービス又は福祉サービスを提供する者との密接な連携に努めなければならない。","医療法人は、開設できる。","入所者が終末期になった場合には、退所させることが義務付けられている。"],"answer":[1,3,4],"explanation":"介護老人保健施設では医師を配置し、計画的なリハビリテーションと関係機関との連携を行います。医療法人も開設できます。終末期になったことだけを理由に退所させる義務はありません。"},{"id":46,"subject":2,"question":"面接場面におけるコミュニケーション技術について適切なものはどれか。 3つ選べ。","options":["コミュニケーション手段としては、言語的なものと非言語的なものがある。","面接の焦点を絞ることは、面接を効果的に実施する上で重要である。","初回面接では、チェックリストに従って、次々と「はい」又は「いいえ」の答えを求める。","イラストや写真などの活用は、クライエントを混乱させるので、避けるべきである。","面接を行う部屋の広さ、室温、静けさなどの外的条件は、円滑なコミュニケーションを図る上で重要である。"],"answer":[1,2,5],"explanation":"言葉だけでなく表情や身振り等もコミュニケーションに含まれます。話題の焦点と面接環境を整え、相手に合わせて図や写真も使います。初回から機械的に質問を続けず、話を聴く姿勢が大切です。"},{"id":47,"subject":2,"question":"ソーシャルワークに関する次の記述のうち適切なものはどれか。 3つ選べ。","options":["意図的な感情表出とは、相談援助者の価値観に基づいてクライエントの態度を批判したり決めつけないことである。","プランニングとは、クライエントが生まれてから現在までの生活歴を作成することである。","モニタリングとは、援助計画の進捗を定期的、継続的に観察して評価することである。","セルフヘルプグループとは、当事者同士が情報交換や支え合いなどを行うグループのことである。","ラポールとは、相談援助者とクライエントとの間で築かれる信頼関係のことである。"],"answer":[3,4,5],"explanation":"モニタリングは支援の経過の確認、セルフヘルプグループは当事者同士の支え合い、ラポールは信頼関係です。意図的な感情表出は本人の感情表現を支えることで、プランニングは援助計画の作成を指します。"},{"id":48,"subject":2,"question":"相談援助者の基本姿勢として、より適切なものはどれか。 3つ選べ。","options":["クライエントの多様性を尊重することが重要である。","クライエントを一人ひとり個別の存在として理解することが重要である。","自らの感情や態度を意識的にコントロールすることが重要である。","職業倫理の違反を防ぐ上で、スーパービジョンを受けることは有効ではない。","クライエントの個人情報は、クライエント本人の不利益にならなければ、私的に利用してもよい。"],"answer":[1,2,3],"explanation":"多様性と個別性を尊重し、援助者自身の感情や価値観が支援に及ぼす影響を自覚します。スーパービジョンは倫理的な支援にも役立ちます。個人情報を私的に利用してはいけません。"},{"id":49,"subject":2,"question":"ソーシャルワークにおける地域援助として、より適切なものはどれか。 2つ選べ。","options":["自治体による生活困窮世帯への家計改善に係る個別相談","社会福祉協議会による地域住民の支え合い活動の組織化","特別養護老人ホームの生活相談員による入所者を対象とした絵手紙教室","医療機関の医療ソーシャルワーカーによる入院患者に対する相談支援","地域のNPOと住民が協力して行う認知症に関する地域での啓発活動"],"answer":[2,5],"explanation":"地域援助では、住民や団体をつなぎ、支え合いの仕組みや地域の理解を育てます。住民活動の組織化や地域での啓発活動が該当します。個別相談や施設内の集団活動とは区別します。"},{"id":50,"subject":2,"question":"介護保険における訪問介護について正しいものはどれか。 3つ選べ。","options":["認知症のある利用者が、リハビリパンツやパットの交換をできるだけ一人でできるよう、見守り・声かけを行うこと。","爪の周囲の皮膚に化膿や炎症があり、専門的な管理が必要な利用者の爪を切ること。","調剤薬局で利用者の処方薬を受け取ること。","ボタン付け等、利用者の被服の補修を行うこと。","犬の散歩等、利用者が飼っているペットの世話をすること。"],"answer":[1,3,4],"explanation":"本人の自立を支える見守り・声かけ、処方薬の受取り、被服の補修は訪問介護に含まれます。化膿等があり専門的管理を要する爪の処置や、ペットの世話は対象になりません。"},{"id":51,"subject":2,"question":"介護保険における通所介護について正しいものはどれか。 2つ選べ。","options":["利用者が自立した日常生活を営むことができるよう生活機能の維持又は向上を目指すものである。","居宅サービス計画に通所介護の利用が位置付けられていれば、通所介護計画は作成しなくてもよい。","指定通所介護の提供に当たっては、介護技術の進歩に対応し、適切な介護技術をもってサービスの提供を行うものとする。","通常の事業の実施地域以外の地域に居住する利用者から、利用料以外の料金として送迎に要する費用の支払を受けることはできない。","生活相談員の確保すべき勤務延時間数には、利用者の地域生活を支える取組のために必要な時間を含めることはできない。"],"answer":[1,3],"explanation":"通所介護は生活機能の維持・向上を目指し、適切な技術で行います。居宅サービス計画があっても通所介護計画は必要です。通常の実施地域外への送迎費用は、説明と同意の上で受け取れます。"},{"id":52,"subject":2,"question":"介護保険における訪問入浴介護について正しいものはどれか。 2つ選べ。","options":["管理者は、看護師でなければならない。","指定訪問入浴介護事業者は、事業所ごとに看護職員を常勤換算で2.5人以上配置しなければならない。","指定訪問入浴介護事業者は、事業所ごとに機能訓練指導員を配置しなければならない。","利用者の肌に直接触れるタオル等は、利用者一人ごとに取り替えるか個人専用のものを使う等、安全清潔なものを使用する。","緊急時等の対応のため、協力医療機関は、事業の通常の実施地域内にあることが望ましい。"],"answer":[4,5],"explanation":"訪問入浴介護では看護職員1人以上、介護職員2人以上を配置します。管理者を看護師に限定する規定や機能訓練指導員の配置義務はありません。用品の清潔を保ち、緊急時に対応できる協力医療機関を確保します。"},{"id":53,"subject":2,"question":"介護保険における短期入所生活介護について正しいものはどれか。 3つ選べ。","options":["目的には、利用者の家族の身体的負担及び精神的負担の軽減は含まれない。","事業所ごとに、常勤の管理者を置かなければならない。","食事の提供と機能訓練に支障のない広さを確保できるのであれば、食堂と機能訓練室は同一の場所とすることができる。","夕食時間は、午後5時より早い時間が望ましい。","利用者に病状の急変が生じた場合は、速やかに主治の医師等への連絡を行う等の必要な措置を講じなければならない。"],"answer":[2,3,5],"explanation":"短期入所生活介護には家族の負担を軽減する目的もあります。常勤の管理者を置き、支障がなければ食堂と機能訓練室を兼用できます。急変時は主治医等へ連絡し、必要な措置を講じます。"},{"id":54,"subject":2,"question":"介護保険における福祉用具について正しいものはどれか。 3つ選べ。","options":["利用者の日常生活上の便宜を図り、その機能訓練に資するとともに、利用者を介護する者の負担の軽減を図るものでなければならない。","指定特定福祉用具販売事業者は、その事業を行う事業所ごとに福祉用具専門相談員を配置しなければならない。","貸与又は販売のいずれかを利用者が選択することができる福祉用具の種目がある。","自動排泄処理装置の交換可能部品は、福祉用具貸与の対象となる。","移動用リフトのつり具の部分は、福祉用具貸与の対象となる。"],"answer":[1,2,3],"explanation":"福祉用具は自立支援と介護者の負担軽減に役立て、販売事業所にも専門相談員を配置します。一部種目は貸与と販売を選択できます。自動排泄処理装置の交換可能部品とリフトのつり具は販売の対象です。"},{"id":55,"subject":2,"question":"介護保険における小規模多機能型居宅介護について正しいものはどれか。 3つ選べ。","options":["機能訓練を行うことは、含まれる。","登録者の居宅サービス計画は、居宅介護支援事業所の介護支援専門員が作成する。","サテライト型ではない指定小規模多機能型居宅介護事業所には、従業者として、看護師又は准看護師を置かなければならない。","管理者の要件には、認知症高齢者の介護に従事した経験は含まれない。","指定小規模多機能型居宅介護事業所の登録定員には、上限が定められている。"],"answer":[1,3,5],"explanation":"小規模多機能型居宅介護には機能訓練も含まれ、居宅サービス計画は当該事業所の介護支援専門員が作成します。看護職員を配置し、管理者には経験等の要件があります。通常の事業所の登録定員は29人以下です。"},{"id":56,"subject":2,"question":"介護保険における認知症対応型共同生活介護について正しいものはどれか。 3つ選べ。","options":["事業者は、入居申込者の入居に際しては、主治の医師の診断書等により当該申込者が認知症である者であることの確認をしなければならない。","利用者の処遇上必要と認められる場合であれば、1つの居室に対して定員を2人にすることができる。","事業者は、利用者の負担により、当該事業所の介護従業者以外の者による介護を受けさせることができる。","事業所は、住宅地又は住宅地と同程度に利用者の家族や地域住民との交流の機会が確保される地域にあるようにしなければならない。","事業者は、提供するサービスの質について、定期的に外部評価を受けていれば、自己評価を行う必要はない。"],"answer":[1,2,4],"explanation":"認知症対応型共同生活介護は診断書等で認知症を確認して利用します。居室は原則1人ですが、処遇上必要な場合は2人にできます。地域交流を確保し、外部評価だけでなく自己評価も必要です。"},{"id":57,"subject":2,"question":"指定介護老人福祉施設について正しいものはどれか。 3つ選べ。","options":["可能な限り、居宅での生活への復帰を念頭に置いて、入所者がその有する能力に応じ自立した日常生活を営むことができるようにすることを目指さなければならない。","生活相談員を配置しなければならない。","計画担当介護支援専門員は、定期的に入所者との面接を行う必要はない。","計画担当介護支援専門員は、入所者の希望及び入所者についてのアセスメントの結果に基づき、その家族の希望を勘案して、施設サービス計画の原案を作成しなければならない。","定期的な外出の機会を確保していれば、教養娯楽設備等は備えなくてもよい。"],"answer":[1,2,4],"explanation":"介護老人福祉施設でも、居宅生活への復帰を念頭に自立を支援します。生活相談員を配置し、本人の希望とアセスメント、家族の希望を踏まえて計画を作成します。定期的な面接や教養娯楽設備も必要です。"},{"id":58,"subject":2,"question":"生活保護制度について正しいものはどれか。 2つ選べ。","options":["国が生活に困窮するすべての国民に対し、その困窮の程度に応じ、必要な保護を行い、その最低限度の生活を保障するとともに、その自立を助長することを目的とする。","医療扶助は、原則として、金銭給付である。","生活保護の申請は、世帯主以外は行うことができない。","介護扶助には、要介護者に対する福祉用具に関する給付は含まれない。","保護を必要とする状態にある者が急迫した状況にあるときは、保護の申請がなくても、必要な保護を行うことができる。"],"answer":[1,5],"explanation":"生活保護は最低限度の生活の保障と自立の助長を目的とします。医療扶助は原則として現物給付で、介護扶助には福祉用具も含まれます。急迫した場合には申請がなくても保護できます。"},{"id":59,"subject":2,"question":"後期高齢者医療制度について正しいものはどれか。 2つ選べ。","options":["被保険者は、60歳以上の者である。","運営主体は、都道府県ごとにすべての市町村が加入する後期高齢者医療広域連合である。","後期高齢者医療給付には、療養の給付が含まれる。","保険料は、全国一律である。","患者の一部負担の割合は、所得にかかわらず1割である。"],"answer":[2,3],"explanation":"後期高齢者医療は都道府県単位の広域連合が運営し、療養の給付等を行います。原則75歳以上と、一定の障害認定を受けた65～74歳が対象です。窓口負担は所得等に応じて1割・2割・3割となります。"},{"id":60,"subject":2,"question":"生活困窮者自立支援制度について適切なものはどれか。 3つ選べ。","options":["関係機関及び民間団体との緊密な連携その他必要な支援体制の整備に配慮して行われなければならない。","生活困窮者とは、現に経済的に困窮し、最低限度の生活を維持することができなくなるおそれのある者をいう。","高齢者は、対象ではない。","生活困窮者住居確保給付金の目的には、就職を容易にするため住居を確保することが含まれる。","生活困窮者自立相談支援事業は、含まれない。"],"answer":[1,2,4],"explanation":"生活困窮者自立支援制度は、最低限度の生活を維持できなくなるおそれのある人を支援し、高齢者も対象です。関係機関と連携し、自立相談支援や住居確保給付金等を通じて生活の立て直しを支えます。"}], SUBJECTS=["介護支援分野（問題1～25）", "保健医療サービス（問題26～45）", "福祉サービス（問題46～60）"];

const $=s=>root.querySelector(s);
function matches(q){return (subject==='all'||q.subject===Number(subject))&&(mode==='all'||mode==='unseen'&&!results[q.id]||mode==='wrong'&&results[q.id]&&!correct(q.id)||mode==='marks'&&marks[q.id])}
function rebuild(){order=QUESTIONS.filter(matches).map(q=>q.id);if(!order.includes(index))index=order[0];render()}
function stats(){const care=QUESTIONS.filter(q=>q.id<=25&&correct(q.id)).length,health=QUESTIONS.filter(q=>q.id>25&&correct(q.id)).length;
$('#scores').innerHTML=`<span>介護支援：<strong>${care} / 25点<\/strong>（暫定採点）<\/span><span>保健医療福祉：<strong>${health} / 35点<\/strong>（暫定採点）<\/span><small><strong>第29回の合格基準は未公表です。<\/strong> 学習用の暫定解答で採点しています。正式な正答・合格基準は2026年11月24日公表予定です（2026年11月7日確認）。<\/small><small>${Object.keys(results).length===60?'全60問の解答が完了しました。':'未回答の問題は得点に含みません。'} 合否判定は行いません。1問1点・指定数すべて一致で正解（部分点なし）。<\/small>`;
const answered=Object.keys(results).length,n=Object.keys(results).filter(correct).length;$('#stats').innerHTML=`<div class="stat"><b>${answered}<small style="font-size:12px;color:#72858c"> / 60<\/small><\/b><span>回答済み<\/span><\/div><div class="stat"><b>${n}<\/b><span>正解<\/span><\/div><div class="stat"><b>${answered?Math.round(n/answered*100):0}<small style="font-size:12px">%<\/small><\/b><span>正答率<\/span><\/div><div class="progress" role="progressbar" aria-label="回答済み" aria-valuenow="${answered}" aria-valuemin="0" aria-valuemax="60"><i style="width:${answered/60*100}%"><\/i><\/div>`;$('#storage').textContent=storageOK?'学習記録はこのブラウザに自動保存されます。':'この環境では記録を保存できません。ページを閉じると記録が消えます。';}
function nav(){const pos=order.indexOf(index);$('#prev').disabled=pos<=0;$('#next').disabled=pos<0||pos===order.length-1;$('#listcount').textContent=`(${order.length}問)`;$('#grid').innerHTML=order.map(id=>`<button data-id="${id}" class="${results[id]?(correct(id)?'done':'miss'):''} ${index===id?'current':''} ${marks[id]?'flag':''}" aria-label="問題${id}${results[id]?(correct(id)?' 正解':' 不正解'):' 未回答'}${marks[id]?' あとで復習':''}" ${index===id?'aria-current="true"':''}>${id}<\/button>`).join('');}
function render(){save();stats();nav();root.querySelectorAll('[data-mode]').forEach(b=>{b.classList.toggle('active',b.dataset.mode===mode);b.setAttribute('aria-pressed',String(b.dataset.mode===mode))});const q=QUESTIONS[index-1];if(!q||!order.includes(index)){$('#card').innerHTML='<div class="empty"><h2>この範囲の問題はありません<\/h2><p>分野や出題範囲を変更して、学習を続けましょう。<\/p><button id="showall" class="primary">全問に戻る<\/button><\/div>';$('#showall').onclick=()=>{subject='all';mode='all';$('#subject').value='all';rebuild()};return}
revealed=!!results[index];selection=revealed?[...results[index].selected]:[];
const parts=q.question.split('\n\n〔事例〕\n');
$('#card').innerHTML=`<div class="qtop"><span class="tag">${esc(SUBJECTS[q.subject])}<\/span><button id="mark" aria-pressed="${!!marks[index]}">${marks[index]?'★ 復習に登録済み':'☆ あとで復習'}<\/button><\/div><h2 class="qnum" tabindex="-1">問題 ${q.id}<span class="count">${order.indexOf(index)+1} / ${order.length} 問<\/span><\/h2><div class="instruction">${q.answer.length}つ選んで解答してください<\/div><p class="question">${esc(parts[0])}<\/p>${parts.length>1?`<div class="case">〔事例〕<br>${esc(parts.slice(1).join('\n'))}<\/div>`:''}<form id="form"><div class="opts" role="group" aria-label="選択肢">${q.options.map((t,i)=>`<label class="option" data-option="${i+1}"><input type="${q.answer.length===1?'radio':'checkbox'}" name="choice" value="${i+1}" ${selection.includes(i+1)?'checked':''} ${revealed?'disabled':''}><span class="number">${i+1}<\/span><span class="opttext">${esc(t)}<\/span><\/label>`).join('')}<\/div>${q.note?`<details class="notebox"><summary>問題の注記を読む<\/summary><p>${esc(q.note)}<\/p><\/details>`:''}<div class="submitrow" ${revealed?'hidden style="display:none"':''}><button type="submit" class="primary" id="submit" disabled>解答する<\/button><span class="hint" id="hint">${q.answer.length}つ選択してください<\/span><\/div><\/form><div id="feedback" aria-live="polite"><\/div>`;
$('#mark').onclick=()=>{marks[index]=!marks[index];save();$('#mark').textContent=marks[index]?'★ 復習に登録済み':'☆ あとで復習';$('#mark').setAttribute('aria-pressed',String(!!marks[index]));nav()};
$('#form').onchange=()=>{selection=[...root.querySelectorAll('input[name="choice"]:checked')].map(e=>Number(e.value));$('#submit').disabled=selection.length!==q.answer.length;$('#hint').textContent=selection.length>q.answer.length?`${q.answer.length}つに絞ってください`:`${selection.length} / ${q.answer.length}つ選択`;root.querySelectorAll('.option').forEach(el=>el.classList.toggle('selected',selection.includes(Number(el.dataset.option))))};
$('#form').onsubmit=e=>{e.preventDefault();if(selection.length!==q.answer.length||revealed)return;results[index]={selected:[...selection]};render();$('#feedback').scrollIntoView({behavior:'smooth',block:'nearest'})};

}
$('#subject').onchange=e=>{subject=e.target.value;rebuild()};root.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;rebuild()});$('#grid').onclick=e=>{const b=e.target.closest('button[data-id]');if(b){index=Number(b.dataset.id);render()}};
function move(step){const n=order.indexOf(index)+step;if(n<0||n>=order.length)return;index=order[n];render();$('.qnum')?.focus({preventScroll:true});$('#card').scrollIntoView({behavior:'smooth',block:'start'})}
$('#prev').onclick=()=>move(-1);$('#next').onclick=()=>move(1);

function syncRubyDisplay(){

const rubyWordPattern=new RegExp(Object.keys(RUBY_WORDS).sort((a,b)=>b.length-a.length).join('|'),'g');
function annotateText(text){
 return RUBY_TEXT[text]||esc(text).replace(rubyWordPattern,w=>`<ruby>${w}<rt>${RUBY_WORDS[w]}<\/rt><\/ruby>`);
}
function applyRuby(){
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),nodes=[];
 while(walker.nextNode()){
  const node=walker.currentNode;
  if(/[㐀-鿿々〆]/.test(node.data)&&!node.parentElement.closest('style,script,ruby,textarea,input,select,option'))nodes.push(node);
 }
 for(const node of nodes){
  const annotated=annotateText(node.data);
  if(!annotated.includes('<ruby>'))continue;
  const template=document.createElement('template');template.innerHTML=annotated;node.replaceWith(template.content);
 }
}
const rubyObserver=new MutationObserver(()=>{
 rubyObserver.disconnect();applyRuby();rubyObserver.observe(root,{childList:true,subtree:true,characterData:true});
});
