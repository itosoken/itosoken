(()=>{
'use strict';
const host=document.currentScript.previousElementSibling;
const root=host.attachShadow({mode:'open'});
const QUESTIONS=[{"id":1,"question":"次のうち、1995年（平成7年）の「精神保健福祉法」への改正の内容として、正しいものを1つ選びなさい。","options":["通院医療費公費負担制度の新設","任意入院制度の新設","精神医療審査会制度の新設","保護者制度の廃止","精神障害者保健福祉手帳制度の新設"],"answer":[5],"subject":0,"note":"「精神保健福祉法」とは、「精神保健及び精神障害者福祉に関する法律」のことである。","explanation":"1995年の改正で、精神障害者保健福祉手帳制度が創設されました。福祉施策の充実が図られた改正です。"},{"id":2,"question":"次のうち、神経性大食症の患者に認められる、過食に対する不適切な代償行為として、正しいものを1つ選びなさい。","options":["虚言","睡眠薬の大量服薬","緩下剤乱用","ネット依存","リストカット"],"answer":[3],"subject":0,"explanation":"神経性大食症では、過食を埋め合わせようとする不適切な代償行為がみられます。選択肢では緩下剤乱用が該当します。"},{"id":3,"question":"次のうち、統合失調症の陰性症状として、正しいものを1つ選びなさい。","options":["言葉のサラダ","貧困妄想","感情鈍麻","作為体験","思考抑制"],"answer":[3],"subject":0,"explanation":"感情鈍麻は感情の表出が乏しくなる陰性症状です。幻覚や妄想などは陽性症状に分類されます。"},{"id":4,"question":"うつ病で入院中の患者が、「私はがんにかかっていて死ぬのを待っているだけだ」と訴えている。身体的な検査をしたところ、特に異常はなく、がんの所見は認められなかった。次のうち、患者にみられる症状として、正しいものを1つ選びなさい。","options":["妄想気分","心気妄想","注察妄想","罪業妄想","関係妄想"],"answer":[2],"subject":0,"explanation":"客観的な根拠がないのに、重大な病気にかかっていると確信するのが心気妄想です。"},{"id":5,"question":"次のうち、ほかの精神疾患よりも、アルツハイマー型認知症を疑う症状として、正しいものを1つ選びなさい。","options":["微小妄想","妄想知覚","観念奔逸","連合弛緩","物盗られ妄想"],"answer":[5],"subject":0,"explanation":"物を置いた場所を忘れ、他人に盗まれたと思い込む「物盗られ妄想」は、アルツハイマー型認知症でみられます。"},{"id":6,"question":"次のうち、強迫性障害に最もよくみられる症状として、正しいものを1つ選びなさい。","options":["対人恐怖","解離","儀式行為","幻嗅","パニック発作"],"answer":[3],"subject":0,"explanation":"強迫観念による不安を和らげるために、一定の行為を繰り返すのが強迫行為です。儀式的な行動が該当します。"},{"id":7,"question":"次のうち、認知症のスクリーニングに有用な心理検査として、適切なものを2つ選びなさい。","options":["文章完成テスト","ミニメンタルステート検査","ウェクスラー成人知能検査","ミネソタ多面人格テスト","改訂長谷川式簡易知能評価スケール"],"answer":[2,5],"subject":0,"explanation":"MMSEと改訂長谷川式簡易知能評価スケール（HDS-R）は、認知機能を評価する検査です。"},{"id":8,"question":"次のうち、認知行動療法に関連の深い人物として、正しいものを1つ選びなさい。","options":["ベック（Beck, A.）","ユング（Jung, C.）","ソーンダイク（Thorndike, E.）","ロジャーズ（Rogers, C.）","カルフ（Kalff, D.）"],"answer":[1],"subject":0,"explanation":"ベックは認知療法を発展させました。考え方と感情・行動の関係に着目する認知行動療法につながっています。"},{"id":9,"question":"統合失調症の維持期における治療に関する次の記述のうち、適切なものを2つ選びなさい。","options":["医療者は、患者と治療のゴールや内容について話し合い、決定できるよう支援する。","抗精神病薬の服用は、患者本人の判断に委ねる。","入院による治療を優先的に行う。","患者の再発予防のため、家族への心理教育を行う。","病状悪化のきっかけになるので、患者が希望しても就労はしないよう助言する。"],"answer":[1,4],"subject":0,"explanation":"維持期は、本人と治療方針を共有し、家族にも病気や対応を学ぶ機会を設けます。再発予防と生活の安定を支えます。"},{"id":10,"question":"Ａさん（20歳、男性）は、両親と兄の4人家族である。Ａさんは、3か月前から自室で独り言をつぶやきながら、くぎを壁に抜き差しするなどの奇異な行動があった。母親に注意されると、「テレパシーが送られてきた。『やめたらお前の負けだ』という声が聞こえてくる」と言い、夜間も頻回に行っていた。また、過去には、母親が早く寝るように言うと、殴りかかろうとしたこともあった。Ａさんは、次第に食事や睡眠が取れなくなり、父親と兄に伴われ、精神科病院を受診した。Ａさんは、父親と精神保健指定医による入院の勧めに同意した。次のうち、この場合の入院形態として、正しいものを1つ選びなさい。","options":["措置入院","任意入院","医療保護入院","緊急措置入院","応急入院"],"answer":[2],"subject":0,"explanation":"本人が入院に同意しているため、任意入院が適切です。症状や過去の行動だけで入院形態を決めません。"},{"id":11,"question":"次のうち、青年期の発達課題は、同一性（アイデンティティ）の確立に特徴づけられると規定した人物として、正しいものを1つ選びなさい。","options":["エリクソン（Erikson, E.）","カプラン（Caplan, G.）","ピアジェ（Piaget, J.）","フロイト（Freud, S.）","ハヴィガースト（Havighurst, R.）"],"answer":[1],"subject":1,"explanation":"エリクソンは、青年期の発達課題を自我同一性（アイデンティティ）の確立としました。"},{"id":12,"question":"市の保健センターに勤務するＢ精神保健福祉士は、同僚の保健師から、「訪問に行っていると、家族も含めて、ストレスへの対処の仕方が分からない人がそれなりにいるんです。住民の皆さんにストレス対処についての正しい知識を知ってもらう必要があると思います」と聞いた。このため、センターとして一般住民向けにストレス対処に関する普及啓発用のパンフレットの作成に取り組むことにした。次のうち、この取組の考え方として、適切なものを1つ選びなさい。","options":["ユニバーサルデザイン","第二次予防","ハイリスクアプローチ","支持的精神保健","ポピュレーションアプローチ"],"answer":[5],"subject":1,"explanation":"特定の高リスク者だけでなく、住民全体に働きかける方法がポピュレーションアプローチです。"},{"id":13,"question":"グリーフケアに関する次の記述のうち、正しいものを1つ選びなさい。","options":["遺族が悲しみを表現してから開始する。","故人への怒りの感情を表出しないよう助言する。","傾聴よりも励ますことが重視されている。","悲嘆は正常な反応であることを伝える。","故人のことを早く忘れるよう働きかける。"],"answer":[4],"subject":1,"explanation":"大切な人を失った後の悲嘆は、自然な反応として生じます。悲しみを表すことや本人のペースを尊重します。"},{"id":14,"question":"次のうち、不登校児童生徒の社会的自立に資する相談・指導を行う目的で教育委員会等が設置するものとして、正しいものを1つ選びなさい。","options":["教育支援センター","児童自立支援施設","地域若者サポートステーション","児童相談所","放課後児童クラブ"],"answer":[1],"subject":1,"explanation":"教育支援センターは、不登校の児童生徒を支援します。学校復帰だけに限定せず、社会的自立を目指します。"},{"id":15,"question":"次の記述のうち、労働と精神保健に関連する法律の説明として、正しいものを1つ選びなさい。","options":["労働安全衛生法に基づくストレスチェック制度で高ストレス者と判定された労働者には、医師による面接指導を受ける義務がある。","過労死等防止対策推進法が規定する過労死等の原因には、精神障害が含まれている。","「男女雇用機会均等法」は、妊娠中及び産後の危険有害業務の就業制限を規定している。","健康増進法は、事業者に対してパワーハラスメント防止のための措置を講じなければならないと規定している。","労働契約法では、国が労働者の心の健康の保持増進のための指針を策定することが規定されている。"],"answer":[2],"subject":1,"note":"「男女雇用機会均等法」とは、「雇用の分野における男女の均等な機会及び待遇の確保等に関する法律」のことである。","explanation":"過労死等防止対策推進法は、業務の強い心理的負荷による精神障害も対象としています。"},{"id":16,"question":"Ｎ県で大規模災害が発生したことから、Ｐ県に勤務するＣ精神保健福祉士に対し、その担当部署より被災地支援チームの一員として参加するよう要請がなされた。当該支援チームの主な活動内容は、急性期の精神科医療ニーズへの対応、精神保健医療ニーズの把握、他の保健医療体制との連携、専門性の高い精神科医療の提供と精神保健活動の支援である。Ｃ精神保健福祉士は国が認めた専門的な研修・訓練も受け、同チームの構成メンバーとして登録されている。次のうち、このチームの名称として、正しいものを1つ選びなさい。","options":["ＤＨＥＡＴ","ＤＭＡＴ","ＤＰＡＴ","ＤＷＡＴ","ＪＭＡＴ"],"answer":[3],"subject":1,"explanation":"DPATは災害派遣精神医療チームです。被災地の精神医療ニーズを把握し、精神科医療や活動支援を行います。"},{"id":17,"question":"次のうち、第2 期アルコール健康障害対策推進基本計画において、わが国で増加傾向にあることが示されているものとして、正しいものを1つ選びなさい。","options":["飲酒習慣のある男性の割合","生活習慣病のリスクを高める量を飲酒している女性の割合","20歳未満の者の飲酒の割合","妊娠中に飲酒している女性の割合","酒類の販売（消費）数量"],"answer":[2],"subject":1,"explanation":"第2期計画では、生活習慣病のリスクを高める量を飲酒する女性の割合が増加していることが課題とされています。"},{"id":18,"question":"次のうち、グループホーム等の新設に際して地域住民から反対運動が起こることを意味する用語として、正しいものを1つ選びなさい。","options":["異文化間コンフリクト","バリアフリー・コンフリクト","接近－接近コンフリクト","施設コンフリクト","ロール・コンフリクト"],"answer":[4],"subject":1,"explanation":"施設の開設などに対する地域住民の反対や対立を、施設コンフリクトといいます。"},{"id":19,"question":"日本いのちの電話連盟に関する次の記述のうち、正しいものを2つ選びなさい。","options":["フリーダイヤル相談を行う。","自殺対策基本法の成立を受けて創設された。","一般市民への自殺予防に関する普及啓発事業を行う。","ひきこもり専門のデイケア事業を行う。","訪問介護事業を行う。"],"answer":[1,3],"subject":1,"explanation":"日本いのちの電話連盟は、フリーダイヤルによる相談や、自殺予防についての啓発活動を行っています。"},{"id":20,"question":"次の記述のうち、「ＷＨＯの手引き」で推奨されている、自殺が生じた際の責任ある報道の在り方として、正しいものを1つ選びなさい。","options":["報道記事を目立つところに配置する。","発生した場所の詳細を伝える。","自殺がよくある普通のこととみなす言葉を使う。","用いられた手段を明確に表現する。","どこに支援を求めるかについて正しい情報を提供する。"],"answer":[5],"subject":1,"note":"「ＷＨＯの手引き」とは、「自殺対策を推進するためにメディア関係者に知ってもらいたい基礎知識 2017年最新版」のことである。","explanation":"WHOの指針では、支援を受けられる場所などの情報を伝えることを勧めています。報道による予防効果を重視します。"},{"id":21,"question":"次のうち、2010年（平成22年）の精神保健福祉士法改正で精神保健福祉士の義務等に、新たに設けられたものとして、正しいものを2つ選びなさい。","options":["信用失墜行為の禁止","資質向上の責務","名称の使用制限","秘密保持義務","誠実義務"],"answer":[2,5],"subject":2,"explanation":"2010年の法改正で、誠実義務と資質向上の責務が規定されました。専門職として適切な支援と研さんが求められます。"},{"id":22,"question":"次の記述のうち、社会福祉士及び介護福祉士法制定の背景として、適切なものを1つ選びなさい。","options":["社会福祉基礎構造改革の議論が行われ、個人の多様な需要に対し、地域での総合的な支援のための人材が求められた。","障害福祉サービスにおいて、ケアマネジメントを用いた生活支援を展開するための人材が求められた。","増大する介護需要に対応するために、老人、身体障害者等に関する福祉に対する相談や介護を依頼することができる専門的能力を有する人材が求められた。","福祉三法が整備される中、各都道府県等に社会福祉行政を担当する人材を配置することが求められた。","高齢者が住み慣れた地域で自立した生活を営めるよう、地域包括ケアシステムの構築を推進する人材が求められた。"],"answer":[3],"subject":2,"explanation":"高齢化などにより福祉・介護のニーズが高まり、専門職の確保と資質向上が求められたことが法制定の背景です。"},{"id":23,"question":"次の記述のうち、ソーシャルワーカーのコーディネーターとしての役割を説明するものとして、適切なものを1つ選びなさい。","options":["クライエントの生活を支援するために、専門職間の連携を図り、連絡調整を行う。","クライエント自身が問題を解決することを可能にするため、側面的援助を行う。","クライエントの問題解決に向けて、クライエントに自発的、能動的な行動を促す。","クライエントの権利擁護のために交渉し、クライエントを保護する。","クライエントの生活問題を把握・分析し、福祉サービスの課題を明らかにする。"],"answer":[1],"subject":2,"explanation":"コーディネーターは、関係機関や専門職の間を調整し、連携を進める役割を担います。"},{"id":24,"question":"「ソーシャルワーク専門職のグローバル定義」（2014年）におけるソーシャルワークに関する次の記述のうち、正しいものを2つ選びなさい。","options":["実践に基づいた専門職であり学問である。","原理の一つに社会正義がある。","集団的権利ではなく個人の権利を尊重する。","西洋の諸理論を基準に展開される。","「人々とともに」ではなく「人々のために」働くという考え方をとる。"],"answer":[1,2],"subject":2,"note":"「ソーシャルワーク専門職のグローバル定義」とは、2014年7月の国際ソーシャルワーカー連盟（ＩＦＳＷ）と国際ソーシャルワーク学校連盟（ＩＡＳＳＷ）の総会・合同会議で採択されたものを指す。","explanation":"グローバル定義は、ソーシャルワークを実践に基づく専門職であり学問としています。社会正義も中核的な原理です。"},{"id":25,"question":"相談援助の理念に関する次の記述のうち、適切なものを1つ選びなさい。","options":["自立支援とは、不十分な生活スキルを訓練して克服し、地域での暮らしを可能にするための実践的理念をいう。","ノーマライゼーションとは、障害者が地域において普通の生活を営むことが、当たり前である社会をつくる理念をいう。","ハームリダクションとは、罪悪感に働きかけて薬物を断つ動機を高めることを目指す支援理念をいう。","ボランタリズムとは、国や行政による福祉サービスの恩恵を自発的に受けて自立を実現する理念をいう。","ソーシャルイクオリティとは、信頼・規範・ネットワークという人々の協調行動を重視した活動の理念をいう。"],"answer":[2],"subject":2,"explanation":"ノーマライゼーションは、障害のある人も地域で他の人と同じように日常生活を送れる社会を目指す考え方です。"},{"id":26,"question":"相談援助過程におけるインテークに関する次の記述のうち、適切なものを2つ選びなさい。","options":["面接は複数回に及ぶ場合がある。","クライエントとの契約から始まる。","クライエントの主訴を明確化する。","クライエントと一緒に援助計画を考える。","ラポール形成にこだわらずに多くの情報を収集する。"],"answer":[1,3],"subject":2,"explanation":"インテークでは本人の主訴を明らかにし、相談関係を築きます。必要に応じて複数回の面接で進めます。"},{"id":27,"question":"次の記述のうち、精神科医療機関に勤務する専門職が患者に対して行う業務として、正しいものを1つ選びなさい。","options":["公認心理師は、主治医の指示がなくても心理検査や心理療法を実施することができる。","薬剤師は、医師等の処方箋に疑わしい点がある場合には、自身の判断で調剤変更することができる。","看護師は、薬剤の投与や採血、創部の処置などを、医師の指示なく、自身の判断で行うことができる。","作業療法士は、医師の指示の下に、社会的適応能力等の回復を図るため、手芸、工作その他の作業を行なわせることができる。","精神保健指定医は、入院患者に対し、信書の発受を制限することができる。"],"answer":[4],"subject":2,"explanation":"作業療法士は、医師の指示の下で作業療法を行います。手芸などの活動も用いて生活への適応を支援します。"},{"id":28,"question":"次の記述のうち、精神保健福祉士が行う権利擁護における発見機能として、適切なものを1つ選びなさい。","options":["生活費の管理に課題を抱えるクライエントに対し、日常生活自立支援事業の活用を促す。","退院後に単身生活を控えているクライエントに対し、アパートの物件情報を提供する。","ソーシャルワークの理念と組織・制度の問題を結び付けるために、クライエント集団と地域福祉政策とを結び付ける。","市民を対象とした精神保健福祉講座の運営を通して、精神障害に対する理解を求める。","長期入院にあるクライエントに対し、地域生活のイメージを描けるような働きかけを行う。"],"answer":[5],"subject":2,"explanation":"アドボカシーの発見機能は、表面化していないニーズや権利の課題を見いだすことです。退院への希望を引き出す支援が該当します。"},{"id":29,"question":"Ｄさん（43歳、女性）は、ひきこもり経験を経て、一人暮らしをしながらＵ精神科クリニックに通院している。Ｕ精神科クリニックのＥ精神保健福祉士は、Ｄさんの今後の生活について継続して相談に乗っていた。最近Ｄさんは通院しておらず、気になったＥ精神保健福祉士が自宅を訪問してみると、Ｄさんは横になっており、右足首がギプスで固定されていた。Ｄさんは、「骨折して入院し、退院してから歩くには松葉づえが必要で、通院だけでなく買物もおっくうになっています」と話した。食卓の上には薬が入ったままの薬袋が幾つか置かれていた。Ｅ精神保健福祉士は現在の状況を踏まえ、連携する機関を考えた。次のうち、連携する機関として、適切なものを2つ選びなさい。","options":["ひきこもり地域支援センター","地域活動支援センター","訪問看護ステーション","精神科病院","障害者相談支援事業所"],"answer":[3,5],"subject":2,"explanation":"訪問看護は服薬や健康状態を支え、相談支援は生活上の困り事やサービス利用を調整します。両者の連携が有効です。"},{"id":30,"question":"次のうち、この時点でのＦさんの揺らぎに焦点を当てたＧワーカーの声かけの根拠となるソーシャルワークの価値として、最も適切なものを1つ選びなさい。\n\n〔事例〕\nＦさん（41歳、女性）は、会社員として働いていた25歳の時にＷ精神科病院を受診し、うつ病と診断された。その後、幾つか通院先を変え、1年前からＶ精神科クリニックに通っている。ある日、ＦさんはＶ精神科クリニックのＧ精神保健福祉士（以下「Ｇワーカー」という。）に障害年金の申請に関する相談をした。Ｆさんとの面接の中で、母親とＨ社会保険労務士（以下「Ｈ社労士」という。）が、申請の手続を進めようとしていることが分かったが、Ｆさんは、「申請が必要なのか悩んでいるんです」と語った。そこでＧワーカーは、「Ｆさんとお母さんの考えを出し合ってよく話し合いましょう」と話しかけた。（問題30）\n\nその後、障害年金の申請について、主治医を交えて四者で面談するために、ＦさんとＨ社労士が来院した。面談の中でＨ社労士は、経済的な基盤ができることが最重要ではないかと発言し、主治医は、継続的な受診が必要で、年金を受給できる状態であると述べた。面談の間、Ｆさんは押し黙ったままであり、ＧワーカーはＦさんの受給に対する意向や考えを明確にすることが大切だと考え、「Ｆさんはどう思いますか」と尋ねたところ、「ずっと、迷っています」とつぶやいた。そこでＧワーカーは、「Ｆさんの障害年金に対する思いを皆で詳しく聞いてみませんか」と提案した。（問題31）\n\n四者での面談から2週間ほど経過した後、ＧワーカーはＦさんに改めて意向を確認した。「母は今後の生活を考え申請を勧めてくるが、障害者として生きていくということですよね」と話し始め、病気にならなければ違った人生になったかもしれないという思いが語られた。そこでＧワーカーは、Ｆさんに、同じ病気を経験した人と交流できる場を紹介した。交流の場に参加したＦさんは、参加者が自分の人生を前向きに捉えており、その場での経験がＦさんにとって、将来を考えるきっかけとなった。この体験を通しＦさんは、障害年金の申請を自分の権利として積極的に捉えるようになった。この考え方の変化をＧワーカーへ伝え、早速、Ｈ社労士にも連絡を取り、受診歴や初診時の年金加入条件等を調べてもらうことにした。（問題32）","options":["自己覚知","人間の社会性","自己実現","変化の可能性","パーソナリティの発達"],"answer":[4],"subject":2,"explanation":"本人の考えや気持ちが変わる可能性を認め、対話を続けています。結論を急がず、変化の可能性を尊重する姿勢です。"},{"id":31,"question":"次の記述のうち、この段階でのチームビルディングの特徴として、最も適切なものを1つ選びなさい。\n\n〔事例〕\nＦさん（41歳、女性）は、会社員として働いていた25歳の時にＷ精神科病院を受診し、うつ病と診断された。その後、幾つか通院先を変え、1年前からＶ精神科クリニックに通っている。ある日、ＦさんはＶ精神科クリニックのＧ精神保健福祉士（以下「Ｇワーカー」という。）に障害年金の申請に関する相談をした。Ｆさんとの面接の中で、母親とＨ社会保険労務士（以下「Ｈ社労士」という。）が、申請の手続を進めようとしていることが分かったが、Ｆさんは、「申請が必要なのか悩んでいるんです」と語った。そこでＧワーカーは、「Ｆさんとお母さんの考えを出し合ってよく話し合いましょう」と話しかけた。（問題30）\n\nその後、障害年金の申請について、主治医を交えて四者で面談するために、ＦさんとＨ社労士が来院した。面談の中でＨ社労士は、経済的な基盤ができることが最重要ではないかと発言し、主治医は、継続的な受診が必要で、年金を受給できる状態であると述べた。面談の間、Ｆさんは押し黙ったままであり、ＧワーカーはＦさんの受給に対する意向や考えを明確にすることが大切だと考え、「Ｆさんはどう思いますか」と尋ねたところ、「ずっと、迷っています」とつぶやいた。そこでＧワーカーは、「Ｆさんの障害年金に対する思いを皆で詳しく聞いてみませんか」と提案した。（問題31）\n\n四者での面談から2週間ほど経過した後、ＧワーカーはＦさんに改めて意向を確認した。「母は今後の生活を考え申請を勧めてくるが、障害者として生きていくということですよね」と話し始め、病気にならなければ違った人生になったかもしれないという思いが語られた。そこでＧワーカーは、Ｆさんに、同じ病気を経験した人と交流できる場を紹介した。交流の場に参加したＦさんは、参加者が自分の人生を前向きに捉えており、その場での経験がＦさんにとって、将来を考えるきっかけとなった。この体験を通しＦさんは、障害年金の申請を自分の権利として積極的に捉えるようになった。この考え方の変化をＧワーカーへ伝え、早速、Ｈ社労士にも連絡を取り、受診歴や初診時の年金加入条件等を調べてもらうことにした。（問題32）","options":["チームの目標づくりを目指し、同時に各メンバーの役割について話し合う。","メンバーが集まり、各自の情報が交換され相互理解を図る。","メンバーそれぞれが振り返り作業を行い、その体験を整理する。","相互の信頼が醸成され、タスク達成に向けて実践する。","メンバー間の考え方の相違が明らかになり、役割に関する対立が表面化する。"],"answer":[2],"subject":2,"explanation":"本人と関係する専門職が情報や考えを共有し、相互理解を深める場です。チーム形成につながる対応です。"},{"id":32,"question":"次のうち、事例を通してＧワーカーが行ったＦさんへの支援の焦点として、適切なものを1つ選びなさい。\n\n〔事例〕\nＦさん（41歳、女性）は、会社員として働いていた25歳の時にＷ精神科病院を受診し、うつ病と診断された。その後、幾つか通院先を変え、1年前からＶ精神科クリニックに通っている。ある日、ＦさんはＶ精神科クリニックのＧ精神保健福祉士（以下「Ｇワーカー」という。）に障害年金の申請に関する相談をした。Ｆさんとの面接の中で、母親とＨ社会保険労務士（以下「Ｈ社労士」という。）が、申請の手続を進めようとしていることが分かったが、Ｆさんは、「申請が必要なのか悩んでいるんです」と語った。そこでＧワーカーは、「Ｆさんとお母さんの考えを出し合ってよく話し合いましょう」と話しかけた。（問題30）\n\nその後、障害年金の申請について、主治医を交えて四者で面談するために、ＦさんとＨ社労士が来院した。面談の中でＨ社労士は、経済的な基盤ができることが最重要ではないかと発言し、主治医は、継続的な受診が必要で、年金を受給できる状態であると述べた。面談の間、Ｆさんは押し黙ったままであり、ＧワーカーはＦさんの受給に対する意向や考えを明確にすることが大切だと考え、「Ｆさんはどう思いますか」と尋ねたところ、「ずっと、迷っています」とつぶやいた。そこでＧワーカーは、「Ｆさんの障害年金に対する思いを皆で詳しく聞いてみませんか」と提案した。（問題31）\n\n四者での面談から2週間ほど経過した後、ＧワーカーはＦさんに改めて意向を確認した。「母は今後の生活を考え申請を勧めてくるが、障害者として生きていくということですよね」と話し始め、病気にならなければ違った人生になったかもしれないという思いが語られた。そこでＧワーカーは、Ｆさんに、同じ病気を経験した人と交流できる場を紹介した。交流の場に参加したＦさんは、参加者が自分の人生を前向きに捉えており、その場での経験がＦさんにとって、将来を考えるきっかけとなった。この体験を通しＦさんは、障害年金の申請を自分の権利として積極的に捉えるようになった。この考え方の変化をＧワーカーへ伝え、早速、Ｈ社労士にも連絡を取り、受診歴や初診時の年金加入条件等を調べてもらうことにした。（問題32）","options":["父権主義の尊重","障害の受容","社会的役割の確立","不正義の解消","社会的復権の実現"],"answer":[2],"subject":2,"explanation":"障害のある自分をどう捉えるかという葛藤に向き合う、障害受容に関する支援です。本人の気持ちとペースを尊重します。"},{"id":33,"question":"次の記述のうち、この時のＫ精神保健福祉士の対応として、適切なものを2つ選びなさい。\n\n〔事例〕\nＪさん（55歳、男性）は、高校生の時に統合失調症を発症したが、今は病状も落ち着き、通院しながらアパートで一人暮らしをしている。Ｊさんは、3年ほど前から、Ｋ精神保健福祉士が勤めている地域活動支援センターで週に1 ～2日過ごしているほか、昨年からは月に1度保健所で開かれている「精神保健福祉を考える集い」（以下「集い」という。）に参加している。「集い」では精神障害当事者のほか、病院や地域の精神保健福祉士や地域住民など20名ほどが集まり、その月の出来事などを語り合っている。「集い」の代表は統合失調症を経験したＬさんであり、「集い」の運営や事務を行っている。人との交流の少ないＪさんにとってはいろいろな人と出会う大切な機会となっている。ある日、Ｋ精神保健福祉士は暗い表情をしたＪさんから、「Ｌさんが県外に転居することになった。Ｌさんがいなくなったら『集い』はどうなってしまうのだろう」と消え入るような声で相談を受けた。（問題33）\n\nＬさんの転居後約1年の間に、様々な広報活動の効果もあり、「集い」は精神障害当事者の参加が増え、病気を抱えながら生活する日々の出来事が前向きに捉え直されたり、元気づけられたり、また地域住民との間で共有される場面が多くなった。やがて「集い」には精神科病院から、「ここで話されているようなことを入院中の方とも話してほしい」という依頼が来るようになった。Ｊさんも数回精神科病院で入院中の方と話をした。ある日ＪさんはＫ精神保健福祉士に、「入院中の方に退院後の生活や自分の体験を話すことで自分が人の力になれるように感じた。精神科病院を訪問した仲間たちの間で、『このような活動を続けるために精神障害当事者の会を立ち上げたい』と話しているので相談に乗ってほしい」と伝えた。（問題34）\n\nＫ精神保健福祉士は、地域活動支援センターで一人静かに時を過ごし、「集い」に参加し始めた頃のＪさんを思い出し、「Ｊさんは変わられましたね」と声をかけた。（問題35）","options":["Ｊさんに、Ｌさんの後を継ぐように勧める。","ＪさんのためにＬさんに連絡を取り、方針を決めてもらう。","Ｊさんの「集い」に対するこれまでの気持ちを聞き取る。","Ｊさんのために「集い」に参加し「集い」が継続するように、力を尽くす。","Ｊさんに、他の参加者と一緒に「集い」のこれからを考えていけるよう促す。"],"answer":[3,5],"subject":2,"explanation":"集いへの思いを聴き、参加者自身が今後を話し合えるように支えます。支援者が一方的に運営方針を決めません。"},{"id":34,"question":"次のうち、Ｊさんたちが始めようとしている会の活動として、適切なものを1つ選びなさい。\n\n〔事例〕\nＪさん（55歳、男性）は、高校生の時に統合失調症を発症したが、今は病状も落ち着き、通院しながらアパートで一人暮らしをしている。Ｊさんは、3年ほど前から、Ｋ精神保健福祉士が勤めている地域活動支援センターで週に1 ～2日過ごしているほか、昨年からは月に1度保健所で開かれている「精神保健福祉を考える集い」（以下「集い」という。）に参加している。「集い」では精神障害当事者のほか、病院や地域の精神保健福祉士や地域住民など20名ほどが集まり、その月の出来事などを語り合っている。「集い」の代表は統合失調症を経験したＬさんであり、「集い」の運営や事務を行っている。人との交流の少ないＪさんにとってはいろいろな人と出会う大切な機会となっている。ある日、Ｋ精神保健福祉士は暗い表情をしたＪさんから、「Ｌさんが県外に転居することになった。Ｌさんがいなくなったら『集い』はどうなってしまうのだろう」と消え入るような声で相談を受けた。（問題33）\n\nＬさんの転居後約1年の間に、様々な広報活動の効果もあり、「集い」は精神障害当事者の参加が増え、病気を抱えながら生活する日々の出来事が前向きに捉え直されたり、元気づけられたり、また地域住民との間で共有される場面が多くなった。やがて「集い」には精神科病院から、「ここで話されているようなことを入院中の方とも話してほしい」という依頼が来るようになった。Ｊさんも数回精神科病院で入院中の方と話をした。ある日ＪさんはＫ精神保健福祉士に、「入院中の方に退院後の生活や自分の体験を話すことで自分が人の力になれるように感じた。精神科病院を訪問した仲間たちの間で、『このような活動を続けるために精神障害当事者の会を立ち上げたい』と話しているので相談に乗ってほしい」と伝えた。（問題34）\n\nＫ精神保健福祉士は、地域活動支援センターで一人静かに時を過ごし、「集い」に参加し始めた頃のＪさんを思い出し、「Ｊさんは変わられましたね」と声をかけた。（問題35）","options":["コンサルテーション","スーパービジョン","ソーシャルアクション","ピアサポート","アファーマティブアクション"],"answer":[4],"subject":2,"explanation":"同じような経験をもつ当事者同士が支え合う活動は、ピアサポートです。体験を共有する力を生かします。"},{"id":35,"question":"次のうち、Ｋ精神保健福祉士の発言の背景にある考え方として、適切なものを1つ選びなさい。\n\n〔事例〕\nＪさん（55歳、男性）は、高校生の時に統合失調症を発症したが、今は病状も落ち着き、通院しながらアパートで一人暮らしをしている。Ｊさんは、3年ほど前から、Ｋ精神保健福祉士が勤めている地域活動支援センターで週に1 ～2日過ごしているほか、昨年からは月に1度保健所で開かれている「精神保健福祉を考える集い」（以下「集い」という。）に参加している。「集い」では精神障害当事者のほか、病院や地域の精神保健福祉士や地域住民など20名ほどが集まり、その月の出来事などを語り合っている。「集い」の代表は統合失調症を経験したＬさんであり、「集い」の運営や事務を行っている。人との交流の少ないＪさんにとってはいろいろな人と出会う大切な機会となっている。ある日、Ｋ精神保健福祉士は暗い表情をしたＪさんから、「Ｌさんが県外に転居することになった。Ｌさんがいなくなったら『集い』はどうなってしまうのだろう」と消え入るような声で相談を受けた。（問題33）\n\nＬさんの転居後約1年の間に、様々な広報活動の効果もあり、「集い」は精神障害当事者の参加が増え、病気を抱えながら生活する日々の出来事が前向きに捉え直されたり、元気づけられたり、また地域住民との間で共有される場面が多くなった。やがて「集い」には精神科病院から、「ここで話されているようなことを入院中の方とも話してほしい」という依頼が来るようになった。Ｊさんも数回精神科病院で入院中の方と話をした。ある日ＪさんはＫ精神保健福祉士に、「入院中の方に退院後の生活や自分の体験を話すことで自分が人の力になれるように感じた。精神科病院を訪問した仲間たちの間で、『このような活動を続けるために精神障害当事者の会を立ち上げたい』と話しているので相談に乗ってほしい」と伝えた。（問題34）\n\nＫ精神保健福祉士は、地域活動支援センターで一人静かに時を過ごし、「集い」に参加し始めた頃のＪさんを思い出し、「Ｊさんは変わられましたね」と声をかけた。（問題35）","options":["リカバリー","コ・プロダクション","コンピテンス","ライフヒストリー","ワーカビリティ"],"answer":[1],"subject":2,"explanation":"リカバリーは、本人が希望をもち、自分にとって意味のある生活を築く過程です。症状の消失だけを意味しません。"},{"id":36,"question":"次の記述のうち、第二次世界大戦後のアメリカの精神保健福祉に関する説明として、正しいものを1つ選びなさい。","options":["クラブハウスモデルとしてファウンテンハウスが設立された。","精神科病院中心の医療からセクター制度への転換が進められた。","法律第180 号を制定して公立精神科病院の閉鎖を国の政策とした。","精神科サバイバー・ネットワークがオヘイガン（O’Hagan, M.）らによって立ち上げられた。","「精神保健に関するナショナル・サービス・フレームワーク」が公表された。"],"answer":[1],"subject":3,"explanation":"ファウンテンハウスは、米国で発展したクラブハウスモデルの代表例です。当事者が協働して地域生活を築きます。"},{"id":37,"question":"次の記述のうち、エンパワメントに関する説明として、正しいものを1つ選びなさい。","options":["障害者が差別されず、社会の中に組み入れられていくこと。","専門家による最小限の介入で、自分の選んだ環境で落ち着き、満足できるようにすること。","逆境や困難を克服することで強化される、人間に本来備わっている復元力のこと。","人々がお互いに責任を果たすことで、個人の権利が日常レベルで実現されること。","社会的に不利な状況に置かれた人が、自己決定能力を高め主体的に行動できるようになること。"],"answer":[5],"subject":3,"explanation":"エンパワメントは、本人が力を発揮し、生活を自ら選び決められるように支える考え方です。"},{"id":38,"question":"精神科病院に医療保護入院しているＭさん（30代、女性）は、Ａ退院後生活環境相談員の支援を受け、退院後の生活についてイメージを育んできた。そのような中、Ｍさんの退院支援委員会が開催され、Ｍさんも参加した。そこで、主治医より、退院に向けた今後の治療方針が説明された。Ｍさんは不安なことや確認したいことについてＡ退院後生活環境相談員のサポートを受けながら、治療プログラムの理解を深めた。その後、Ｍさんは治療プログラムに主体的に取り組み始めた。次のうち、Ｍさんの主体的な取組を表す用語として、適切なものを1つ選びなさい。","options":["インフォームドコンセント","アカウンタビリティ","アドヒアランス","コンプライアンス","シェイピング"],"answer":[3],"subject":3,"explanation":"アドヒアランスは、本人が治療内容を理解・納得し、治療に主体的に参加することです。"},{"id":39,"question":"次の記述のうち、精神保健福祉士が退院支援をしているクライエントから、「俳優になりたい」と聞いたとき、プランニング段階での関わりとして、適切なものを1つ選びなさい。","options":["症状の安定に努め、俳優のことは退院後に検討することを伝える。","過去の職歴を聞き、合っている仕事は何か一緒に検討する。","病棟での患者ミーティングの司会を担って、人前で話すことに慣れるよう勧める。","俳優になるために何が必要かを話し合う。","入院中にオーディションを受けられるよう調整する。"],"answer":[4],"subject":3,"explanation":"本人の希望を出発点として、必要な支援や課題を一緒に整理します。支援者の判断で目標を否定しません。"},{"id":40,"question":"解決志向アプローチに関する次の記述のうち、正しいものを1つ選びなさい。","options":["解決を要する問題行動の生じる頻度を測定する。","問題に対するこれまでの対処方法は用いず、新しい方法を提案する。","問題が解決した場合の状況について質問する。","専門的知見から、問題解決のイメージを提案する。","問題を解決するために、直接的な原因を追究して除去する。"],"answer":[3],"subject":3,"explanation":"解決志向アプローチでは、望む未来や既にうまくいっていることに着目します。解決後の姿を尋ねる質問が該当します。"},{"id":41,"question":"地域アセスメントに関する次の記述のうち、正しいものを1つ選びなさい。","options":["介入を行い、地域の変化を観察する。","提供したサービスの効果を評価する。","地域で生活する精神障害者のもとへ出向いて働きかける。","地域における潜在的な資源力を把握する。","地域課題に対する援助を所属する機関で行えるか否かを判断する。"],"answer":[4],"subject":3,"explanation":"地域アセスメントでは、既存の制度・サービスだけでなく、地域に潜在する資源や強みも把握します。"},{"id":42,"question":"次のうち、相談援助過程におけるモニタリングとして、正しいものを1つ選びなさい。","options":["援助関係の契約","支援の進捗状況や適切性の確認","支援ネットワークの形成","相談援助過程の総括","ニーズの背景を分析"],"answer":[2],"subject":3,"explanation":"モニタリングでは、支援の実施状況や目標の達成状況を確認し、計画が適切かを検討します。"},{"id":43,"question":"Ｂ精神保健福祉士は、精神科デイ・ケアで自立生活に関する学習会を担当している。5回目のテーマは前回に続き「互いの経験から学ぶ」である。参加者Ｃさんが、「私は病気になって、自分なんて価値がないと思っていたけど、今は生きていていいと思えるようになりました」と話した。すると参加者Ｄさんが、「でもやっぱり、なんで病気になったんだろう」とつぶやいた。Ｂ精神保健福祉士はＤさんの気持ちを受け止めて、Ｃさんに、「なぜそう思えるようになったのですか」と発言を促した。Ｃさんは、「前回、生き生きと自分の体験を語っていた人の話を聞いたことがきっかけですね」と話した。するとＤさんが、「僕もあのように堂々と生きていきたいなって思った」と語った。次の記述のうち、Ｂ精神保健福祉士の促しによって、グループに生まれた効果として、適切なものを2つ選びなさい。","options":["生活に必要な生きた情報が共有される。","社会的に必要なスキルを身に付ける。","他者の乗り越えた体験を知り希望を抱く。","自分だけの問題ではないという安心感を得る。","他者への関わりの結果から対人関係について学ぶ。"],"answer":[3,4],"subject":3,"explanation":"他の参加者の経験から希望を得たり、自分だけではないと感じたりすることは、グループの治療的要因です。"},{"id":44,"question":"障害者就業・生活支援センターに相談に来所したＥさんは、これまで就職しては半年以内に退職することを繰り返していた。Ｅさんは、「いつも今度こそは長く続けようと思って仕事をするんですが、疲れてしまって、うまくいかないんです。仕事が続かない自分はだめなんです」と話した。Ｆ精神保健福祉士は気持ちを受け止め、「Ｅさんは、諦めずに何度も仕事に挑戦されていますよね」と話した。次のうち、Ｆ精神保健福祉士の用いた技法として、適切なものを1つ選びなさい。","options":["リフレーミング","アサーション","リンケージ","リフレクティング","ストレス・インタビュー"],"answer":[1],"subject":3,"explanation":"失敗の繰り返しという見方を、何度も挑戦できる強みとして捉え直しています。これがリフレーミングです。"},{"id":45,"question":"Ｇさんの精神科病院での精神保健福祉援助実習は、中盤に差し掛かっている。この日、デイケアでは統合失調症のメンバーを対象とした社会生活技能訓練を行い、Ｇさんはコ・リーダーを担った。ロールプレイの場面でＧさんは、それまでずっと発言しなかったメンバーＨさんに対し、「今の場面で良かったところはどこですか」と発言を促した。すると、Ｈさんは何も言わずに怒った様子で部屋を出ていってしまった。その様子を見たＧさんは、何も言えずにぼう然としてしまい、その後のコ・リーダーとしての役割ができなくなった。夕方の振り返りでＧさんは、「うまくできなくて、Ｈさんを怒らせてしまった。実習を続けていけるだろうか。精神保健福祉士には向いてないかも」と実習指導者Ｊさんに涙ぐみながら話した。次の記述のうち、この場面で実習指導者ＪさんがＧさんに行う実習スーパービジョンにおける発言として、最も適切なものを1つ選びなさい。","options":["「今後はＨさんと少し距離を置くようにしましょう」","「Ｈさんの行動は症状からくるものだから、大丈夫ですよ」","「ロールプレイ時の状況を振り返って、Ｇさんの行動を確認してみませんか」","「Ｇさんの担当教員に実習中断の連絡をしておきます」","「社会生活技能訓練をもう一度学ぶために課題を出します」"],"answer":[3],"subject":3,"explanation":"スーパービジョンでは、実習生が場面と自分の対応を振り返り、理解を深められるよう支援します。"},{"id":46,"question":"Ｋさん（65歳）は、精神科病院に入退院を繰り返していたが、両親が他界してからは入院が数年続いている。現在は精神症状が軽減しており、病棟でも落ち着いて過ごしている。そこで、指定一般相談支援事業所のＬ精神保健福祉士も参加して地域移行に向けたケア会議が開かれた。Ｋさんは、「自分のような長期入院者が退院できるのか」「初めての一人暮らしで不安だ」「日中はどう過ごせばいいのか」「家事や日常生活での金銭管理に自信がない」と話した。次のうち、この時のＬ精神保健福祉士がＫさんに提案した内容として、適切なものを2つ選びなさい。","options":["ピアサポーターとの交流","就労継続支援Ａ型事業所への通所","障害福祉サービスによる療養介護の利用","グループホームでの宿泊体験","成年後見制度の利用"],"answer":[1,4],"subject":3,"explanation":"退院後の生活への不安には、地域生活を送る当事者との交流やグループホームの体験利用が役立ちます。"},{"id":47,"question":"次のうち、行政の精神保健福祉士が企画する精神障害者の生活上の困りごとを理解するための民生委員研修として、最も適切なものを1つ選びなさい。","options":["精神科医による精神疾患の病因と症状に関する講義","行政職員による「精神保健福祉法」についての講義","精神科医による薬物療法の効果と副作用についての講義","民生委員の大変さを分かち合うグループワーク","小グループでの精神障害のある当事者との話合い"],"answer":[5],"subject":3,"note":"「精神保健福祉法」とは、「精神保健及び精神障害者福祉に関する法律」のことである。","explanation":"当事者と少人数で直接対話する機会は、具体的な生活や思いへの理解を促し、偏見を減らすことにつながります。"},{"id":48,"question":"精神障害者のケアマネジメントに関する次の記述のうち、適切なものを1つ選びなさい。","options":["精神保健福祉士が示した方針に基づき立案する。","社会資源の調整、改善及び開発を行う。","治療目標に沿って計画を作成する。","単一のサービス利用者を対象にする。","家族の同意を得てから実施する。"],"answer":[2],"subject":3,"explanation":"ケアマネジメントには、既存の資源の調整だけでなく、資源の改善や新たな資源の開発も含まれます。"},{"id":49,"question":"次の記述のうち、この時のＡ精神保健福祉士の対応として、最も適切なものを1つ選びなさい。\n\n〔事例〕\nＭさん（30歳、男性）は、高校3年生の時に統合失調症を発症した。その後、服薬を中断し、幻聴によって大声を出し、騒ぎになっては入院することが度々あった。25歳の時に高校の同窓会の案内が届いた。高校の同級生は皆大学を出て働いており、このままでは同窓会に出られないと思い、治療を受け続ける覚悟を決めた。そして、病気で受験を諦めていたが、大学に入学し、卒業後に同級生と同じように就職したいと思うようになった。それからＭさんは、服薬を継続し、予備校に通い受験勉強に取り組んだが、模擬試験で思うような成績が得られず、焦りから両親への八つ当たりが増えた。ある日、Ｍさんは通院先の医療相談室のＡ精神保健福祉士に、「両親から『受験をやめてはどうか』と言われてしまった。大学には絶対行きたいが、再発して入院にならないか心配だ」と相談してきた。（問題49）\n\nＭさんは2年後に大学に入学することができ、入学後間もなく学生支援室のＢキャンパスソーシャルワーカー（以下「Ｂワーカー」という。）を訪ね、心配事の相談をした。Ｍさんは、「聞きたいことを先生にうまく伝えられない」「授業のグループディスカッションは、参加したいのに緊張して議論に加われず、休みがちになった」「頑張って同級生に話しかけても、うまくいかず自信をなくした」「関心のある授業を取りすぎたせいか、夕方の授業は疲れて内容が頭に入らない」と語った。（問題50）\n\nその後、ＭさんはＢワーカーの支援を受け、体調の波と付き合いながらも単位を取得し、卒業の目途がついた4年次には企業のインターンシップに参加した。しかし、緊張もあって社員の指示が理解できず、簡単な書類作成をミスするなど失敗を重ね、中断となってしまった。相談を受けたＢワーカーは、一緒にインターンシップの経験を振り返り、ミスを繰り返しても人に聞けなかったが、慣れるまで時間がかかるもののパソコン作業は正確にこなせることが分かった。Ｍさんは、「パソコン作業の仕事に就きたいが、病気があり、自信がない。学生生活やインターンシップと同じようになるのではないか。会社には相談できる場はないし」と話した。（問題51）","options":["再発が心配なため、大学受験を先延ばしにするよう勧める。","両親に心配をかけないよう、ひそかに受験勉強することを提案する。","服薬を忘れないように服薬管理を両親に依頼する。","Ｍさんが行きたい大学のオープンキャンパスの参加を勧める。","一緒にクライシスプランを作成することを提案する。"],"answer":[5],"subject":3,"explanation":"クライシスプランは、調子を崩す兆候や対応を本人と共有する計画です。進学後の再発への不安に備えます。"},{"id":50,"question":"次の記述のうち、この時のＢワーカーの支援として、適切なものを2つ選びなさい。\n\n〔事例〕\nＭさん（30歳、男性）は、高校3年生の時に統合失調症を発症した。その後、服薬を中断し、幻聴によって大声を出し、騒ぎになっては入院することが度々あった。25歳の時に高校の同窓会の案内が届いた。高校の同級生は皆大学を出て働いており、このままでは同窓会に出られないと思い、治療を受け続ける覚悟を決めた。そして、病気で受験を諦めていたが、大学に入学し、卒業後に同級生と同じように就職したいと思うようになった。それからＭさんは、服薬を継続し、予備校に通い受験勉強に取り組んだが、模擬試験で思うような成績が得られず、焦りから両親への八つ当たりが増えた。ある日、Ｍさんは通院先の医療相談室のＡ精神保健福祉士に、「両親から『受験をやめてはどうか』と言われてしまった。大学には絶対行きたいが、再発して入院にならないか心配だ」と相談してきた。（問題49）\n\nＭさんは2年後に大学に入学することができ、入学後間もなく学生支援室のＢキャンパスソーシャルワーカー（以下「Ｂワーカー」という。）を訪ね、心配事の相談をした。Ｍさんは、「聞きたいことを先生にうまく伝えられない」「授業のグループディスカッションは、参加したいのに緊張して議論に加われず、休みがちになった」「頑張って同級生に話しかけても、うまくいかず自信をなくした」「関心のある授業を取りすぎたせいか、夕方の授業は疲れて内容が頭に入らない」と語った。（問題50）\n\nその後、ＭさんはＢワーカーの支援を受け、体調の波と付き合いながらも単位を取得し、卒業の目途がついた4年次には企業のインターンシップに参加した。しかし、緊張もあって社員の指示が理解できず、簡単な書類作成をミスするなど失敗を重ね、中断となってしまった。相談を受けたＢワーカーは、一緒にインターンシップの経験を振り返り、ミスを繰り返しても人に聞けなかったが、慣れるまで時間がかかるもののパソコン作業は正確にこなせることが分かった。Ｍさんは、「パソコン作業の仕事に就きたいが、病気があり、自信がない。学生生活やインターンシップと同じようになるのではないか。会社には相談できる場はないし」と話した。（問題51）","options":["同級生に話しかける場面を設定し、ロールプレイを行う。","グループディスカッションを免除してもらうよう教員に働きかける。","卒業を最優先と考え、出席するよう励ます。","履修状況を確認し、必要な見直しを行う。","授業後に聞きたい点について、Ｍさんの代わりに教員に聞きに行く。"],"answer":[1,4],"subject":3,"explanation":"対人場面を練習し、履修科目や負担を本人と見直します。本人が学業を続けやすい方法を具体的に考えます。"},{"id":51,"question":"次の記述のうち、この後のＢワーカーの支援として、適切なものを1つ選びなさい。\n\n〔事例〕\nＭさん（30歳、男性）は、高校3年生の時に統合失調症を発症した。その後、服薬を中断し、幻聴によって大声を出し、騒ぎになっては入院することが度々あった。25歳の時に高校の同窓会の案内が届いた。高校の同級生は皆大学を出て働いており、このままでは同窓会に出られないと思い、治療を受け続ける覚悟を決めた。そして、病気で受験を諦めていたが、大学に入学し、卒業後に同級生と同じように就職したいと思うようになった。それからＭさんは、服薬を継続し、予備校に通い受験勉強に取り組んだが、模擬試験で思うような成績が得られず、焦りから両親への八つ当たりが増えた。ある日、Ｍさんは通院先の医療相談室のＡ精神保健福祉士に、「両親から『受験をやめてはどうか』と言われてしまった。大学には絶対行きたいが、再発して入院にならないか心配だ」と相談してきた。（問題49）\n\nＭさんは2年後に大学に入学することができ、入学後間もなく学生支援室のＢキャンパスソーシャルワーカー（以下「Ｂワーカー」という。）を訪ね、心配事の相談をした。Ｍさんは、「聞きたいことを先生にうまく伝えられない」「授業のグループディスカッションは、参加したいのに緊張して議論に加われず、休みがちになった」「頑張って同級生に話しかけても、うまくいかず自信をなくした」「関心のある授業を取りすぎたせいか、夕方の授業は疲れて内容が頭に入らない」と語った。（問題50）\n\nその後、ＭさんはＢワーカーの支援を受け、体調の波と付き合いながらも単位を取得し、卒業の目途がついた4年次には企業のインターンシップに参加した。しかし、緊張もあって社員の指示が理解できず、簡単な書類作成をミスするなど失敗を重ね、中断となってしまった。相談を受けたＢワーカーは、一緒にインターンシップの経験を振り返り、ミスを繰り返しても人に聞けなかったが、慣れるまで時間がかかるもののパソコン作業は正確にこなせることが分かった。Ｍさんは、「パソコン作業の仕事に就きたいが、病気があり、自信がない。学生生活やインターンシップと同じようになるのではないか。会社には相談できる場はないし」と話した。（問題51）","options":["緊張を克服できるように、アルバイトを幾つもやってみることを勧める。","就職時のジョブコーチの利用について情報を提供する。","パソコンスキル向上のために、就労移行支援事業所につなげる。","自信を付けるために、就労継続支援Ｂ型事業所の利用を提案する。","事務に限らず、営業や販売などにも広げて就職活動することを勧める。"],"answer":[2],"subject":3,"explanation":"ジョブコーチは、職場で本人と事業主の双方に支援を行います。仕事への適応や職場との調整に役立ちます。"},{"id":52,"question":"次の記述のうち、この面接時のＤ精神保健福祉士のＣさんへの発言として、適切なものを1つ選びなさい。\n\n〔事例〕\nＣさん（25歳、男性）は、19歳の時に友人に勧められて覚醒剤を使用し、警察に逮捕され、その後、保護観察処分を受けた。保護観察期間が終わってからは、その友人とも距離を置き、就職して23歳の時に結婚して子どもも生まれた。ところが新しい上司との相性が悪く、ミスを叱責されたことから口論となって仕事を辞め、再び覚醒剤を勧めた友人と会うようになった。働かずブラブラしているＣさんをみた妻は、子どもを連れて家を出てしまった。Ｃさんは、失意と孤独から抑うつ状態に陥り、覚醒剤を再使用したいという欲求にかられ、精神科クリニックを訪れた。診察した医師はクリニックで実施しているＳＭＡＲＰＰ（せりがや覚せい剤依存再発防止プログラム）への参加を勧め、担当のＤ精神保健福祉士がプログラム導入のための面接を行った。Ｃさんは、面接室に座るなり、「保護観察の時にも更生プログラムを受けた。本当に効果があるんですか」と疑心暗鬼な様子で尋ねた。Ｄ精神保健福祉士はＣさんがクリニックに来たことをねぎらい、面接を始めた。（問題52）\n\nＣさんは、Ｄ精神保健福祉士との面接を経て、プログラムに参加することになった。プログラムを始めたばかりのＣさんは、身体もつらそうで緊張した面持ちだったが、「妻からは、『覚醒剤を勧めた友人と縁を切って、働くようになったらまた一緒に暮らしても良い』と言われた。頑張って妻と子どもに回復した姿を見せたい」と週1回の参加を続けた。4週目には、薬物の再使用の「引き金」について考えるプログラムに参加した。Ｃさんは自分の「引き金」が対人関係のつまずきと考え、Ｄ精神保健福祉士やほかのメンバーと一緒にその対処方法について確認した。（問題53）\n\nその後、順調にみえていたＣさんだったが、プログラムが始まって2か月が過ぎた頃からイライラしてプログラムのメンバーと何度か言い争う姿がみられた。心配したＤ精神保健福祉士が、Ｃさんと面談すると、「妻と子どものことを考えると、もう絶対覚醒剤はやってはいけないと思うが、ふとした時にまた無性に覚醒剤を使いたいと思うことがある」「妻と子どもに会いたい」と訴えた。（問題54）","options":["「覚醒剤がいかに危険なものか分かっていますか」","「覚醒剤を使うことをどのように思っていますか」","「最初に、治療プログラムについて説明します」","「あなたがしたことで、ご家族がどんな思いをしたか考えてください」","「そのような態度では、覚醒剤を再使用してしまいますよ」"],"answer":[2],"subject":3,"explanation":"まず薬物使用について本人がどう考えているかを聴きます。一方的に説得せず、本人の理解と動機を確かめます。"},{"id":53,"question":"次の記述のうち、Ｃさんと確認した対処方法として、適切なものを1つ選びなさい。\n\n〔事例〕\nＣさん（25歳、男性）は、19歳の時に友人に勧められて覚醒剤を使用し、警察に逮捕され、その後、保護観察処分を受けた。保護観察期間が終わってからは、その友人とも距離を置き、就職して23歳の時に結婚して子どもも生まれた。ところが新しい上司との相性が悪く、ミスを叱責されたことから口論となって仕事を辞め、再び覚醒剤を勧めた友人と会うようになった。働かずブラブラしているＣさんをみた妻は、子どもを連れて家を出てしまった。Ｃさんは、失意と孤独から抑うつ状態に陥り、覚醒剤を再使用したいという欲求にかられ、精神科クリニックを訪れた。診察した医師はクリニックで実施しているＳＭＡＲＰＰ（せりがや覚せい剤依存再発防止プログラム）への参加を勧め、担当のＤ精神保健福祉士がプログラム導入のための面接を行った。Ｃさんは、面接室に座るなり、「保護観察の時にも更生プログラムを受けた。本当に効果があるんですか」と疑心暗鬼な様子で尋ねた。Ｄ精神保健福祉士はＣさんがクリニックに来たことをねぎらい、面接を始めた。（問題52）\n\nＣさんは、Ｄ精神保健福祉士との面接を経て、プログラムに参加することになった。プログラムを始めたばかりのＣさんは、身体もつらそうで緊張した面持ちだったが、「妻からは、『覚醒剤を勧めた友人と縁を切って、働くようになったらまた一緒に暮らしても良い』と言われた。頑張って妻と子どもに回復した姿を見せたい」と週1回の参加を続けた。4週目には、薬物の再使用の「引き金」について考えるプログラムに参加した。Ｃさんは自分の「引き金」が対人関係のつまずきと考え、Ｄ精神保健福祉士やほかのメンバーと一緒にその対処方法について確認した。（問題53）\n\nその後、順調にみえていたＣさんだったが、プログラムが始まって2か月が過ぎた頃からイライラしてプログラムのメンバーと何度か言い争う姿がみられた。心配したＤ精神保健福祉士が、Ｃさんと面談すると、「妻と子どものことを考えると、もう絶対覚醒剤はやってはいけないと思うが、ふとした時にまた無性に覚醒剤を使いたいと思うことがある」「妻と子どもに会いたい」と訴えた。（問題54）","options":["特に予定を入れずに毎日を気ままに過ごす。","覚醒剤を使用したくなる場面を徐々に増やす。","お酒を飲んでリラックスする。","誰とも連絡を取らず、一人で過ごす。","深呼吸して気分を変え、妻と子どもの写真を見る。"],"answer":[5],"subject":3,"explanation":"使用欲求が高まる場面に備え、気分転換や家族を思い出す方法など、本人に合った対処方法を考えます。"},{"id":54,"question":"次の記述のうち、Ｃさんの訴えに対するＤ精神保健福祉士の対応として、適切なものを1つ選びなさい。\n\n〔事例〕\nＣさん（25歳、男性）は、19歳の時に友人に勧められて覚醒剤を使用し、警察に逮捕され、その後、保護観察処分を受けた。保護観察期間が終わってからは、その友人とも距離を置き、就職して23歳の時に結婚して子どもも生まれた。ところが新しい上司との相性が悪く、ミスを叱責されたことから口論となって仕事を辞め、再び覚醒剤を勧めた友人と会うようになった。働かずブラブラしているＣさんをみた妻は、子どもを連れて家を出てしまった。Ｃさんは、失意と孤独から抑うつ状態に陥り、覚醒剤を再使用したいという欲求にかられ、精神科クリニックを訪れた。診察した医師はクリニックで実施しているＳＭＡＲＰＰ（せりがや覚せい剤依存再発防止プログラム）への参加を勧め、担当のＤ精神保健福祉士がプログラム導入のための面接を行った。Ｃさんは、面接室に座るなり、「保護観察の時にも更生プログラムを受けた。本当に効果があるんですか」と疑心暗鬼な様子で尋ねた。Ｄ精神保健福祉士はＣさんがクリニックに来たことをねぎらい、面接を始めた。（問題52）\n\nＣさんは、Ｄ精神保健福祉士との面接を経て、プログラムに参加することになった。プログラムを始めたばかりのＣさんは、身体もつらそうで緊張した面持ちだったが、「妻からは、『覚醒剤を勧めた友人と縁を切って、働くようになったらまた一緒に暮らしても良い』と言われた。頑張って妻と子どもに回復した姿を見せたい」と週1回の参加を続けた。4週目には、薬物の再使用の「引き金」について考えるプログラムに参加した。Ｃさんは自分の「引き金」が対人関係のつまずきと考え、Ｄ精神保健福祉士やほかのメンバーと一緒にその対処方法について確認した。（問題53）\n\nその後、順調にみえていたＣさんだったが、プログラムが始まって2か月が過ぎた頃からイライラしてプログラムのメンバーと何度か言い争う姿がみられた。心配したＤ精神保健福祉士が、Ｃさんと面談すると、「妻と子どものことを考えると、もう絶対覚醒剤はやってはいけないと思うが、ふとした時にまた無性に覚醒剤を使いたいと思うことがある」「妻と子どもに会いたい」と訴えた。（問題54）","options":["プログラムで、今の気持ちをメンバーと共有することを提案する。","保護観察処分を受けたことがあるため、保護観察所に対応の指示を得る。","クリニックでのプログラムを中止し、司法のプログラムに変更することを伝える。","クリニックへの立入りを制限し、底つき体験を促す。","妻に連絡し、Ｃさんに会いに行くよう依頼する。"],"answer":[1],"subject":3,"explanation":"使用欲求や気持ちの揺れをグループで共有し、対処を考えます。失敗を責めず、回復への取り組みを支えます。"},{"id":55,"question":"次のうち、マトリックス表の作成時に用いられた方法として、正しいものを1つ選びなさい。\n\n〔事例〕\n人口7万人のＱ市は、人口減少や世帯の小規模化が進み、地域のつながりの希薄化が課題となっている。Ｘ障害者基幹相談支援センターのＥ相談支援専門員（精神保健福祉士）（以下「Ｅ専門員」という。）はピアサポーターから、「地域の事業所は、精神障害への偏見の修正や生活のしづらさの改善のために、地域にどう関わり、支援に活かしているのか」と聞かれた。Ｅ専門員は地域内の取組を伝えながら、幾つかの課題が頭に浮かび、それを整理する必要があると考えた。そこでＥ専門員は、翌月開催されたＱ市「協議会」の部会で、「各事業所及び事業所がある地区の強みと弱みなどを可視化して、現状や課題を探ってみませんか」と参加者に提案した。その後、8事業所から参加協力を得て学習会を開催し、市内各地区のマトリックス表を作成した。実施後に参加者から、「地区別の各事業所の課題と役割が分かった」「市全域と各地区との関係が分かった」「現状を各地区の実践にどう活かすかが今後の課題だ」と報告があった。（問題55）\n\nＥ専門員は報告を取りまとめ、「この結果を実践に活かすために、各事業所が個々の支援で工夫していることや課題と、今回地区ごとに可視化できたこととを結び付けてみてはどうでしょう。それらを精査して、地区やＱ市の戦略的方策を考えていきませんか」と学習会において新たに提案した。（問題56）\n\nその後、学習会で検討した結果、「取組はあるが、その実践スキルやノウハウが集約できていない」「取組成果が地域に発信されていない」「住民からフィードバックを受ける仕組みが整っていない」ことが整理された。そこで「協議会」ではそれらを戦略的方策として、地域住民や当事者、その家族と事業所の協働で、地域実践を蓄積する方法を開発し、外部評価の仕組み作りを進めていった。この活動が継続していくと、参加する住民や団体も増え、Ｑ市各地区での信頼感や結束力の高まりがみられるようになった。（問題57）","options":["ＰＥＲＴ法","グラウンデッド・セオリー","ＳＷＯＴ分析","デルファイ法","アクションリサーチ"],"answer":[3],"subject":3,"explanation":"SWOT分析は、強み・弱み・機会・脅威を整理する方法です。地域の状況を多面的に把握するために用います。","note":"「協議会」は、「障害者の日常生活及び社会生活を総合的に支援するための法律」に基づき、障害者等への支援体制の整備を図るため、保健医療関係者、福祉関係者等で構成される。"},{"id":56,"question":"次のうち、この時点でＥ専門員が活用を意図したコミュニティソーシャルワークの機能として、適切なものを1つ選びなさい。\n\n〔事例〕\n人口7万人のＱ市は、 "ソーシャルベンチャー","ソーシャルファーム","コミュニティビジネス","コミュニティチェスト","ソーシャルキャピタル"],"answer":[5],"subject":3,"explanation":"ソーシャルキャピタルは、人々の信頼・つながり・互酬性などを指します。協働によって地域の支え合う力を育てます。","note":"「協議会」は、「障害者の日常生活及び社会生活を総合的に支援するための法律」に基づき、障害者等への支援体制の整備を図るため、保健医療関係者、福祉関係者等で構成される。"},{"id":58,"question":"次のうち、この時にＦ精神保健福祉士が行った面接として、正しいものを1つ選びなさい。\n\n〔事例〕\nＦ精神保健福祉士が勤務する精神科病院に、10日前、アルコール依存症のＧさん（52歳、男性）が入院となった。Ｇさんはこれまで2度入院し、その都度Ｆ精神保健福祉士が担当していた。離脱症状が治まったため、Ｆ精神保健福祉士は病棟の面接室でＧさんと面接を行った。Ｇさんは、「大学を出て今の会社に就職して、趣味もなく仕事ばかりの生活だった。3年前に管理職に昇進して、慣れない内容が増えてそのストレスを飲酒でごまかすようになり、そのうち時々早退して昼から酒を飲むようになった。その様子を見兼ねた妻が病院に連れて来た。今まで自分で酒を断とうとしたけど、うまくいかなかった。こんな僕だけど、家族のためにも酒のない生活に変わりたい気持ちはある。妻や社長からは、今回は入院してしっかり治して帰ってくるようにと言われているけど、迷惑をかけて、つくづく自分はだめな人間だと思う」とやっと本音を話した。Ｆ精神保健福祉士は、「そう思いつつも、Ｇさん自身はこれから酒のない生活に変わっていきたいんですね」と話を続けた。（問題58）\n\n翌週、妻から面談の希望があり、Ｆ精神保健福祉士が対応した。「私も仕事をしているのでお金のことは心配ない。でも、また夫が酒浸りになるんじゃないかと一人で考えていると胸が苦しくなってくる。このことは、誰にでも話せることじゃないし、どうしたらいいでしょうか」と相談された。そこで、Ｆ精神保健福祉士は、「私たちも相談に乗りますし、地域にも相談できる所がありますよ」と提案した。（問題59）\n\n入院から1か月後、Ｇさんを含めた病棟カンファレンスが開催された。その際、Ｆ精神保健福祉士は、Ｇさんが自宅へ退院しても断酒が継続できるよう、今後を見据えたＧさんへの支援を提案した。（問題60）","options":["構造化面接","指示的面接","居宅訪問面接","動機づけ面接","生活場面面接"],"answer":[4],"subject":3,"explanation":"動機づけ面接は、本人の迷いを受け止め、変わりたいという気持ちを引き出す方法です。"},{"id":59,"question":"次のうち、この時にＦ精神保健福祉士が妻に提案した社会資源として、正しいものを2つ選びなさい。\n\n〔事例〕\nＦ精神保健福祉士が勤務する精神科病院に、10日前、アルコール依存症のＧさん（52歳、男性）が入院となった。Ｇさんはこれまで2度入院し、その都度Ｆ精神保健福祉士が担当していた。離脱症状が治まったため、Ｆ精神保健福祉士は病棟の面接室でＧさんと面接を行った。Ｇさんは、「大学を出て今の会社に就職して、趣味もなく仕事ばかりの生活だった。3年前に管理職に昇進して、慣れない内容が増えてそのストレスを飲酒でごまかすようになり、そのうち時々早退して昼から酒を飲むようになった。その様子を見兼ねた妻が病院に連れて来た。今まで自分で酒を断とうとしたけど、うまくいかなかった。こんな僕だけど、家族のためにも酒のない生活に変わりたい気持ちはある。妻や社長からは、今回は入院してしっかり治して帰ってくるようにと言われているけど、迷惑をかけて、つくづく自分はだめな人間だと思う」とやっと本音を話した。Ｆ精神保健福祉士は、「そう思いつつも、Ｇさん自身はこれから酒のない生活に変わっていきたいんですね」と話を続けた。（問題58）\n\n翌週、妻から面談の希望があり、Ｆ精神保健福祉士が対応した。「私も仕事をしているのでお金のことは心配ない。でも、また夫が酒浸りになるんじゃないかと一人で考えていると胸が苦しくなってくる。このことは、誰にでも話せることじゃないし、どうしたらいいでしょうか」と相談された。そこで、Ｆ精神保健福祉士は、「私たちも相談に乗りますし、地域にも相談できる所がありますよ」と提案した。（問題59）\n\n入院から1か月後、Ｇさんを含めた病棟カンファレンスが開催された。その際、Ｆ精神保健福祉士は、Ｇさんが自宅へ退院しても断酒が継続できるよう、今後を見据えたＧさんへの支援を提案した。（問題60）","options":["保健所","ギャマノン（GAM-ANON）","アラノン（Al-Anon）","婦人相談所","地域包括支援センター"],"answer":[1,3],"subject":3,"explanation":"家族自身も支援の対象です。保健所への相談や、家族の自助グループであるアラノンにつなぎます。"},{"id":60,"question":"次のうち、この時にＦ精神保健福祉士が提案した内容として、最も適切なものを1つ選びなさい。\n\n〔事例〕\nＦ精神保健福祉士が勤務する精神科病院に、10日前、アルコール依存症のＧさん（52歳、男性）が入院となった。Ｇさんはこれまで2度入院し、その都度Ｆ精神保健福祉士が担当していた。離脱症状が治まったため、Ｆ精神保健福祉士は病棟の面接室でＧさんと面接を行った。Ｇさんは、「大学を出て今の会社に就職して、趣味もなく仕事ばかりの生活だった。3年前に管理職に昇進して、慣れない内容が増えてそのストレスを飲酒でごまかすようになり、そのうち時々早退して昼から酒を飲むようになった。その様子を見兼ねた妻が病院に連れて来た。今まで自分で酒を断とうとしたけど、うまくいかなかった。こんな僕だけど、家族のためにも酒のない生活に変わりたい気持ちはある。妻や社長からは、今回は入院してしっかり治して帰ってくるようにと言われているけど、迷惑をかけて、つくづく自分はだめな人間だと思う」とやっと本音を話した。Ｆ精神保健福祉士は、「そう思いつつも、Ｇさん自身はこれから酒のない生活に変わっていきたいんですね」と話を続けた。（問題58）\n\n翌週、妻から面談の希望があり、Ｆ精神保健福祉士が対応した。「私も仕事をしているのでお金のことは心配ない。でも、また夫が酒浸りになるんじゃないかと一人で考えていると胸が苦しくなってくる。このことは、誰にでも話せることじゃないし、どうしたらいいでしょうか」と相談された。そこで、Ｆ精神保健福祉士は、「私たちも相談に乗りますし、地域にも相談できる所がありますよ」と提案した。（問題59）\n\n入院から1か月後、Ｇさんを含めた病棟カンファレンスが開催された。その際、Ｆ精神保健福祉士は、Ｇさんが自宅へ退院しても断酒が継続できるよう、今後を見据えたＧさんへの支援を提案した。（問題60）","options":["ひとりＳＳＴの実施","アルコール依存症回復支援施設への入所","入院中からの自助グループ参加","日常生活自立支援事業の申請準備","復職を想定した職場の仕事内容の確認作業"],"answer":[3],"subject":3,"explanation":"入院中から自助グループに参加し、退院後もつながりを継続できるようにすることが、断酒を支えます。"},{"id":61,"question":"次のうち、「精神保健福祉法」に規定される者として、正しいものを2つ選びなさい。","options":["退院支援相談員","精神保健福祉相談員","相談支援専門員","退院後生活環境相談員","成年後見人"],"answer":[2,4],"subject":4,"note":"「精神保健福祉法」とは、「精神保健及び精神障害者福祉に関する法律」のことである。","explanation":"精神保健福祉相談員と退院後生活環境相談員は、精神保健福祉法に規定されています。"},{"id":62,"question":"障害者基本法に関する次の記述のうち、正しいものを2つ選びなさい。","options":["障害者週間を設けることが規定されている。","法の制定当初から、障害を理由とする差別を禁じている。","精神障害者の長期入院の解消について規定されている。","法改正により、「障害者の家族にあつては、障害者の自立の促進に努めなければならない」という規定が削除されている。","障害者の定義から、発達障害者は除外されている。"],"answer":[1,4],"subject":4,"explanation":"障害者基本法は障害者週間を定めています。また、改正によって家族等の責務に関する規定は削除されました。"},{"id":63,"question":"介護保険制度に関する次の記述のうち、正しいものを2つ選びなさい。","options":["要介護状態区分は、1 ～6 まで設定されている。","要介護認定・要支援認定には、有効期間がある。","第2 号被保険者であっても、初老期における認知症である場合、要介護認定を受けることができる。","予防給付は、要介護の認定を受けた人でも利用できる。","救護施設に入所している者も、介護保険の給付を利用できる。"],"answer":[2,3],"subject":4,"explanation":"要介護認定には有効期間があります。40～64歳の第2号被保険者も、初老期における認知症などの特定疾病が原因なら対象になります。"},{"id":64,"question":"生活保護制度に関する次の記述のうち、正しいものを1つ選びなさい。","options":["医療扶助は、原則として金銭給付される。","障害厚生年金3級を受給している場合、障害者加算が認められる。","障害者加算の金額は、在宅者と入院者で同額である。","精神障害者保健福祉手帳3級に相当する場合、障害者加算が認められる。","入院患者日用品費は、原則として金銭給付される。"],"answer":[5],"subject":4,"explanation":"入院患者日用品費は、入院中に必要な日用品等の費用に対応する生活扶助です。医療そのものの費用とは区別します。"},{"id":65,"question":"更生緊急保護に関する次の記述のうち、正しいものを1つ選びなさい。","options":["矯正施設の長からの申出により実施される。","保護の期間は、最長で3年である。","仮釈放中の者も対象に含まれる。","公共の衛生福祉に関する機関等による保護が優先される。","社会福祉法に規定されている社会福祉事業に含まれる。"],"answer":[4],"subject":4,"explanation":"更生緊急保護は、福祉制度などによる保護を優先し、それらを直ちに受けられない場合などに行われます。"},{"id":66,"question":"「医療観察法」における鑑定入院に関する次の記述のうち、正しいものを1つ選びなさい。","options":["入院期間は、6か月が限度である。","地方裁判所の命令に基づく。","精神保健審判員が鑑定する。","医療観察病棟で実施される。","精神保健福祉士を付添人として選任できる。"],"answer":[2],"subject":4,"note":"「医療観察法」とは、「心神喪失等の状態で重大な他害行為を行った者の医療及び観察等に関する法律」のことである。","explanation":"医療観察法の鑑定入院は、地方裁判所の命令により行われます。審判に必要な鑑定を行うための制度です。"},{"id":67,"question":"精神保健参与員に関する次の記述のうち、正しいものを1つ選びなさい。","options":["審判の合議体の構成員である。","生活環境調査を行う。","保護観察所に配置される。","ＣＰＡ会議を主催する。","審判期日で意見を述べる。"],"answer":[5],"subject":4,"explanation":"精神保健参与員は、精神保健福祉の専門的な立場から審判で意見を述べます。審判の決定を担う合議体の構成員ではありません。"},{"id":68,"question":"次の記述のうち、社会調査におけるオプトアウトの説明として、正しいものを1つ選びなさい。","options":["外部との経済的な利益関係等によって、研究が適正に行われないことを指す。","調査対象者に研究の目的やリスクなど十分に説明を行い、同意を得ることを指す。","調査対象者の既存の個人情報を調査で利用することについて、本人に拒否の機会を保障することを指す。","調査対象者の心的外傷に触れる質問をすることで、調査対象者の精神的負担が生じることを指す。","調査対象者の人格や尊厳を傷つけるような言動や行為になっていないか、常に意識することを指す。"],"answer":[3],"subject":4,"explanation":"オプトアウトは、情報を公開し、対象者が研究への利用を拒否できる機会を保障する方法です。利用できる条件があります。"},{"id":69,"question":"精神科デイ・ケアの業務改善のために、Ｈ精神保健福祉士は大学の研究者と共に利用者に、「デイケアを利用して感じている効果や不満」についてフォーカスグループインタビューを複数回行った。その結果得られたテキストデータをＨ精神保健福祉士は、意味のある単位に区切ってラベルを付ける作業を行った。次のうち、この作業を示す用語として、正しいものを1つ選びなさい。","options":["トライアンギュレーション","クラスター分析","サンプリング","コーディング","エディティング"],"answer":[4],"subject":4,"explanation":"質的研究では、語りなどのデータを意味のまとまりごとに整理し、コードを付けて分析します。"},{"id":70,"question":"次のうち、Ｊさんの入院の同意者として、正しいものを1つ選びなさい。\n\n〔事例〕\n地元の中小企業で正社員として勤務するＪさん（55歳、男性）は、学生時代に統合失調症を発症し、入院をした。退院後に、症状はほぼ消失したため、現在の会社に就職し、何度か再発の危機はあったが、その都度外来治療で乗り越えてきた。ある日、勤務中に、「誰かが自分の命を狙っている」「窓の外に誰かがいる」などの発言がみられるようになり、心配した勤務先の同僚に付き添われてＹ精神科病院を受診した。Ｊさんは支離滅裂なことを言ったり、大きな声で叫んだことから、診察したＫ医師（精神保健指定医）は直ちに入院を必要とする状態と判断した。入院を勧めたが、Ｊさんは拒否したため、Ｋ医師は本人の意思によらない入院の手続を進めることとした。なお、Ｊさんの両親はすでに他界しており、兄弟等の親族もいない。（問題70）\n\n入院後間もなく、Ｊさんは徐々に落ち着きを取り戻した。ある日、Ｊさんは相談室のＬ精神保健福祉士に対して、「給与が出なくなり、経済的に不安だ」と訴えた。そこで、Ｌ精神保健福祉士は、Ｊさんに対して、健康保険法に基づく制度を紹介し、申請方法について説明した。その後のＪさんは、この制度を利用できたことにより経済的な不安が解消し、退院後の自分の生活について考えられるようになった。（問題71）\n\n3か月後、ＪさんはＹ精神科病院を退院した。その後、外来時にＪさんは相談室に寄りＬ精神保健福祉士に対し、「しばらくは働かずに、自宅で療養して過ごそうと思います。ただ、家に一人でいるのも不安があるので、誰かと話したり、趣味である絵を描いたりする場所が欲しいと思っています」と相談してきた。そこで、Ｌ精神保健福祉士は、「障害者総合支援法」において、創作的活動や生産活動の機会の提供、社会との交流の促進等を行うＺセンターの紹介を検討した。（問題72）","options":["市町村長","都道府県知事","Ｊさんの勤務先の同僚","Ｙ精神科病院の管理者","保健所長"],"answer":[1],"subject":4,"explanation":"本人が入院に同意できず、同意する家族等もいない場合には、法定の要件の下で市町村長の同意による医療保護入院が可能です。","note":"「障害者総合支援法」とは、「障害者の日常生活及び社会生活を総合的に支援するための法律」のことである。"},{"id":71,"question":"次のうち、この時点でＪさんが利用した制度として、最も適切なものを1つ選びなさい。\n\n〔事例〕\n地元の中小企業で正社員として勤務するＪさん（55歳、男性）は、学生時代に統合失調症を発症し、入院をした。退院後に、症状はほぼ消失したため、現在の会社に就職し、何度か再発の危機はあったが、その都度外来治療で乗り越えてきた。ある日、勤務中に、「誰かが自分の命を狙っている」「窓の外に誰かがいる」などの発言がみられるようになり、心配した勤務先の同僚に付き添われてＹ精神科病院を受診した。Ｊさんは支離滅裂なことを言ったり、大きな声で叫んだことから、診察したＫ医師（精神保健指定医）は直ちに入院を必要とする状態と判断した。入院を勧めたが、Ｊさんは拒否したため、Ｋ医師は本人の意思によらない入院の手続を進めることとした。なお、Ｊさんの両親はすでに他界しており、兄弟等の親族もいない。（問題70）\n\n入院後間もなく、Ｊさんは徐々に落ち着きを取り戻した。ある日、Ｊさんは相談室のＬ精神保健福祉士に対して、「給与が出なくなり、経済的に不安だ」と訴えた。そこで、Ｌ精神保健福祉士は、Ｊさんに対して、健康保険法に基づく制度を紹介し、申請方法について説明した。その後のＪさんは、この制度を利用できたことにより経済的な不安が解消し、退院後の自分の生活について考えられるようになった。（問題71）\n\n3か月後、ＪさんはＹ精神科病院を退院した。その後、外来時にＪさんは相談室に寄りＬ精神保健福祉士に対し、「しばらくは働かずに、自宅で療養して過ごそうと思います。ただ、家に一人でいるのも不安があるので、誰かと話したり、趣味である絵を描いたりする場所が欲しいと思っています」と相談してきた。そこで、Ｌ精神保健福祉士は、「障害者総合支援法」において、創作的活動や生産活動の機会の提供、社会との交流の促進等を行うＺセンターの紹介を検討した。（問題72）","options":["障害基礎年金","障害厚生年金","傷病手当金","自立支援医療（精神通院医療）","一般求職者給付"],"answer":[3],"subject":4,"explanation":"健康保険の傷病手当金は、業務外の病気等で働けず、給与を受けられない場合などの所得を保障する給付です。","note":"「障害者総合支援法」とは、「障害者の日常生活及び社会生活を総合的に支援するための法律」のことである。"},{"id":72,"question":"Ｚセンターに関する次の記述のうち、正しいものを1つ選びなさい。\n\n〔事例〕\n地元の中小企業で正社員として勤務するＪさん（55歳、男性）は、学生時代に統合失調症を発症し、入院をした。退院後に、症状はほぼ消失したため、現在の会社に就職し、何度か再発の危機はあったが、その都度外来治療で乗り越えてきた。ある日、勤務中に、「誰かが自分の命を狙っている」「窓の外に誰かがいる」などの発言がみられるようになり、心配した勤務先の同僚に付き添われてＹ精神科病院を受診した。Ｊさんは支離滅裂なことを言ったり、大きな声で叫んだことから、診察したＫ医師（精神保健指定医）は直ちに入院を必要とする状態と判断した。入院を勧めたが、Ｊさんは拒否したため、Ｋ医師は本人の意思によらない入院の手続を進めることとした。なお、Ｊさんの両親はすでに他界しており、兄弟等の親族もいない。（問題70）\n\n入院後間もなく、Ｊさんは徐々に落ち着きを取り戻した。ある日、Ｊさんは相談室のＬ精神保健福祉士に対して、「給与が出なくなり、経済的に不安だ」と訴えた。そこで、Ｌ精神保健福祉士は、Ｊさんに対して、健康保険法に基づく制度を紹介し、申請方法について説明した。その後のＪさんは、この制度を利用できたことにより経済的な不安が解消し、退院後の自分の生活について考えられるようになった。（問題71）\n\n3か月後、ＪさんはＹ精神科病院を退院した。その後、外来時にＪさんは相談室に寄りＬ精神保健福祉士に対し、「しばらくは働かずに、自宅で療養して過ごそうと思います。ただ、家に一人でいるのも不安があるので、誰かと話したり、趣味である絵を描いたりする場所が欲しいと思っています」と相談してきた。そこで、Ｌ精神保健福祉士は、「障害者総合支援法」において、創作的活動や生産活動の機会の提供、社会との交流の促進等を行うＺセンターの紹介を検討した。（問題72）","options":["市町村地域生活支援事業である。","自立支援給付の介護給付である。","自立支援給付の訓練等給付である。","都道府県地域生活支援促進事業である。","地域相談支援である。"],"answer":[1],"subject":4,"explanation":"地域活動支援センターは、創作活動や交流の機会などを提供します。市町村の地域生活支援事業に位置付けられます。","note":"「障害者総合支援法」とは、「障害者の日常生活及び社会生活を総合的に支援するための法律」のことである。"},{"id":73,"question":"「障害者差別解消法」に関する次の記述のうち、正しいものを2つ選びなさい。","options":["事業者には、差別の解消を図るために必要な啓発活動を行うことが義務づけられている。","公的機関には、合理的配慮の提供は努力義務として規定されている。","障害者の権利に関する条約の批准に向けてこの法律が制定された。","この法律における障害者の定義では、障害者手帳の所持が規定されている。","社会的障壁の定義では、社会における慣行や観念も含まれている。"],"answer":[3,5],"subject":5,"note":"「障害者差別解消法」とは、「障害を理由とする差別の解消の推進に関する法律」のことである。","explanation":"障害者差別解消法の背景には障害者権利条約の採択があります。社会的障壁には制度だけでなく慣行や観念も含まれます。"},{"id":74,"question":"次の記述のうち、住宅入居等支援事業（居住サポート事業）の説明として、正しいものを1つ選びなさい。","options":["指定相談支援事業者による実施が義務づけられている。","2020年度（令和2年度）において全市町村の8割が実施している。","事業内容には、家主への相談・助言が含まれている。","住宅確保要配慮者居住支援協議会の設置が義務づけられている。","「障害者総合支援法」における自立支援給付に位置づけられている。"],"answer":[3],"subject":5,"note":"「障害者総合支援法」とは、「障害者の日常生活及び社会生活を総合的に支援するための法律」のことである。","explanation":"居住支援では、入居希望者への支援に加え、貸主の不安に応える相談や助言も行います。"},{"id":75,"question":"次のうち、「障害者総合支援法」に規定される自立生活援助として、正しいものを1つ選びなさい。","options":["医療機関における機能訓練及び日常生活上の世話","主として夜間において、相談、入浴、排せつ又は食事の介護その他の日常生活上の援助","身体機能又は生活能力の向上のための訓練","一定期間にわたる、定期的な巡回訪問等による相談、助言等の援助","障害者が行動する際の危険回避のために必要な援護"],"answer":[4],"subject":5,"explanation":"自立生活援助は、定期的な訪問や相談対応などにより、一人暮らし等への移行を一定期間支えるサービスです。"},{"id":76,"question":"次の記述のうち、障害者トライアル雇用助成金における障害者短時間トライアルコースの説明として、正しいものを1つ選びなさい。","options":["助成期間は6か月を上限とする。","雇入れ時に求められる週所定労働時間は20 時間以上である。","企業在籍型職場適応援助者（企業在籍型ジョブコーチ）が配置されている企業への助成を目的とする。","訓練生に訓練手当が支給される。","発達障害者も対象である。"],"answer":[5],"subject":5,"explanation":"障害者短時間トライアル雇用は、精神障害者や発達障害者などを対象に、短時間からの雇用を通じて職場への適応を目指します。"},{"id":77,"question":"次のうち、保健所における精神保健福祉業務として、正しいものを1つ選びなさい。","options":["定期病状報告の受理","精神医療審査会の事務","退院支援委員会の主催","自立支援医療（精神通院医療）の支給認定","障害年金の申請受理"],"answer":[1],"subject":5,"explanation":"保健所は、精神科病院から提出される定期病状報告などに関する事務を担います。"},{"id":78,"question":"次のうち、この障害福祉サービスとして、最も適切なものを1つ選びなさい。\n\n〔事例〕\nＭさん（30歳、女性）は、大学卒業後に就職したが、3年目に統合失調症を発症し退職した。数か月の入院を経て、退院後は精神科デイケアに数年通いながら、再発することなく地域生活を続けていた。デイケアのＡ精神保健福祉士は、Ｍさんとの面談を通して、改めて一般就労にチャレンジしたいというＭさんの意欲を評価するとともに、対人面での緊張が強いことや体力面の課題があることを確認した。主治医からは、一般就労に向けて準備してもよいのではないかという意見が得られた。そこで、Ａ精神保健福祉士は障害福祉サービスの利用を提案し、Ｍさんも希望した。Ａ精神保健福祉士はこのサービスの利用に向けてＵ事業所のＢ相談支援専門員（精神保健福祉士）に連絡を取った。Ｂ相談支援専門員はＭさんと話し合いながら、Ｖ事業所が提供する一般就労を目指した「障害者総合支援法」に基づく障害福祉サービスの利用を検討した。（問題78）\n\nその後、Ｂ相談支援専門員は、Ｍさんがこのサービスを利用するために市役所に申請を行った。（問題79）\n\nＭさんは企業の事務補助の仕事に就くことができた。その後、Ｖ事業所によるフォローもあり、不定期に休むことはありつつも、仕事を続けることができた。しかしＭさんは、一人で悩みを抱え込む性格から疲れやすく、職場の上司や同僚もＭさんを心配していた。Ｍさん自身、これからも仕事や生活面の不安をＶ事業所の担当職員に相談したいと話した。継続的な支援の必要性がＭさん、企業、Ｖ事業所で共有された。そこで、Ｖ事業所が提供する新たな障害福祉サービスの利用を検討した。（問題80）\n\nＭさんは、Ｖ事業所が提供する新たな障害福祉サービスを利用しながら、事務補助の仕事を継続している。","options":["日常生活支援","就労継続支援Ａ型","就労継続支援Ｂ型","自立訓練","就労移行支援"],"answer":[5],"subject":5,"explanation":"一般就労を希望し、就労に向けた訓練や支援が必要なため、就労移行支援が適しています。"},{"id":79,"question":"次のうち、Ｍさんがこのサービスを利用するために必要なこととして、正しいものを2つ選びなさい。\n\n〔事例〕\nＭさん（30歳、女性）は、大学卒業後に就職したが、3年目に統合失調症を発症し退職した。数か月の入院を経て、退院後は精神科デイケアに数年通いながら、再発することなく地域生活を続けていた。デイケアのＡ精神保健福祉士は、Ｍさんとの面談を通して、改めて一般 // 第25回の公式合格基準。専門6科目は5科目群にまとめて判定する。
const EXAM={"edition":25,"specialistMark":49,"fullMark":95,"commonTotal":83,"officialKey":"https://www.mhlw.go.jp/content/12205000/001067033.pdf"};
const PASS_GROUPS=[[0],[1],[2],[3],[4,5]];
const COMMON_GROUPS=[{"name":"人体の構造と機能及び疾病","total":7,"first":1,"last":7},{"name":"心理学理論と心理的支援","total":7,"first":8,"last":14},{"name":"社会理論と社会システム","total":7,"first":15,"last":21},{"name":"現代社会と福祉","total":10,"first":22,"last":31},{"name":"地域福祉の理論と方法","total":10,"first":32,"last":41},{"name":"福祉行財政と福祉計画","total":7,"first":42,"last":48},{"name":"社会保障","total":7,"first":49,"last":55},{"name":"障害者に対する支援と障害者自立支援制度","total":7,"first":56,"last":62},{"name":"低所得者に対する支援と生活保護制度","total":7,"first":63,"last":69},{"name":"保健医療サービス","total":7,"first":70,"last":76,"bonus":1},{"name":"権利擁護と成年後見制度","total":7,"first":77,"last":83}];
const KEY='ito-seishin25-v1';
let saved={},storageOK=true;
try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){storageOK=false}
let rubyEnabled=saved.rubyEnabled!==false;
let passMode=saved.passMode==='full'?'full':'exempt';
let commonScores=COMMON_GROUPS.map((g,i)=>Array.isArray(saved.commonScores)&&['string','number'].includes(typeof saved.commonScores[i])?String(saved.commonScores[i]):'');
let results=saved.results||{},marks=saved.marks||{},index=Number(saved.index)||1,subject='all',mode='all',order=[],selection=[],revealed=false,retrying=null;
for(const [id,v] of Object.entries(results)){if(!QUESTIONS[id-1]||!v||!Array.isArray(v.selected)){delete results[id]}}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const equal=(a,b)=>a.length===b.length&&[...a].sort().every((v,i)=>v===[...b].sort()[i]);
const correct=id=>results[id]&&equal(results[id].selected,QUESTIONS[id-1].answer);
function save(){try{localStorage.setItem(KEY,JSON.stringify({results,marks,index,passMode,commonScores,rubyEnabled}))}catch(e){storageOK=false}}
function readCommonScore(value,max){
 const text=String(value??'').trim();
 if(text==='')return null;
 const score=Number(text);
 return Number.isInteger(score)&&score>=0&&score<=max?score:null;
}
function getPassStatus(record,route=passMode,common=commonScores){
 const groups=PASS_GROUPS.map((subjects,i)=>{
  const questions=QUESTIONS.filter(q=>subjects.includes(q.subject));
  const answered=questions.filter(q=>record[q.id]&&Array.isArray(record[q.id].selected));
  return {number:i+1,name:subjects.map(id=>SUBJECTS[id]).join('、'),total:questions.length,answered:answered.length,
   score:answered.filter(q=>equal(record[q.id].selected,q.answer)).length,first:questions[0].id,last:questions[questions.length-1].id};
 });
 const specialistScore=groups.reduce((sum,g)=>sum+g.score,0);
 const answered=groups.reduce((sum,g)=>sum+g.answered,0),full=route==='full';
 if(full)COMMON_GROUPS.forEach((g,i)=>groups.push({...g,number:i+6,common:true,score:readCommonScore(common[i],g.total-(g.bonus||0))===null?null:readCommonScore(common[i],g.total-(g.bonus||0))+(g.bonus||0)}));
 const pendingGroups=groups.filter(g=>g.score===null),zeroGroups=groups.filter(g=>g.score===0);
 const score=groups.reduce((sum,g)=>sum+(g.score??0),0),mark=full?EXAM.fullMark:EXAM.specialistMark;
 return {groups,zeroGroups,pendingGroups,specialistScore,score,mark,full,answered,total:QUESTIONS.length+(full?EXAM.commonTotal:0),
  remaining:QUESTIONS.length-answered,shortage:Math.max(0,mark-score),complete:answered===QUESTIONS.length&&pendingGroups.length===0,
  meetsCriteria:pendingGroups.length===0&&score>=mark&&zeroGroups.length===0};
}
function renderPassCheck(){
 const p=getPassStatus(results),count=p.groups.length,pending=p.pendingGroups.length;
 $('#pass-rule').textContent=`第${EXAM.edition}回・${p.full?'共通科目あり':'共通科目免除'}：${p.mark}点以上 / ${p.total}点 ＋ ${count}科目群すべてで得点`;
 $('#pass-overview').textContent=`現在 ${p.score} / ${p.total}点${pending?'（入力済み分）':''} · 得点のある科目群 ${p.groups.filter(g=>g.score>0).length} / ${count}群 · 専門科目 回答済み ${p.answered} / ${QUESTIONS.length}問`;
 $('#common-entry').hidden=!p.full;
 let title,message;
 if(p.answered===0){title='解答を進めると、合格ラインを確認できます';message='まずは一問ずつ取り組みましょう。各問題で「解答する」を押した結果を集計します。'}
 else if(!p.complete){title=p.meetsCriteria?'途中経過：合格ラインを満たしています':'途中経過：合格ラインを確認しましょう';message=[p.remaining?`専門科目の未解答があと${p.remaining}問あります。`:`専門科目${QUESTIONS.length}問の解答が完了しました。`,pending?`共通科目の${pending}科目群で得点が未入力、または入力範囲外です。`:'', '専門科目の全問解答'+(p.full?`と共通科目${COMMON_GROUPS.length}群の得点入力`:'')+'が完了すると最終判定を表示します。'].join('');}
 else if(p.meetsCriteria){title='おめでとうございます！ 合格です！';message=`${p.full?'共通科目あり':'共通科目免除'}の基準（${p.mark}点以上・${count}科目群すべてで得点）を満たしました。最後までよく頑張りました！`;}

いしんほけんふくしし<\/rt><\/ruby>は、<ruby>意味<rt>いみ<\/rt><\/ruby>のある<ruby>単位<rt>たんい<\/rt><\/ruby>に<ruby>区切<rt>くぎ<\/rt><\/ruby>ってラベルを<ruby>付<rt>つ<\/rt><\/ruby>ける<ruby>作業<rt>さぎょう<\/rt><\/ruby>を<ruby>行<rt>おこな<\/rt><\/ruby>った。<ruby>次<rt>つぎ<\/rt><\/ruby>のうち、この<ruby>作業<rt>さぎょう<\/rt><\/ruby>を<ruby>示<rt>しめ<\/rt><\/ruby>す<ruby>用語<rt>ようご<\/rt><\/ruby>として、<ruby>正<rt>ただ<\/rt><\/ruby>しいものを1つ<ruby>選<rt>えら<\/rt><\/ruby>びなさい。","精神科医による精神疾患の病因と症状に関する講義":"<ruby>精神科医<rt>せいしんかい<\/rt><\/ruby>による<ruby>精神疾患<rt>せいしんしっかん<\/rt><\/ruby>の<ruby>病因<rt>びょういん<\/rt><\/ruby>と<ruby>症状<rt>しょうじょう<\/rt><\/ruby>に<ruby>関<rt>かん<\/rt><\/ruby>する<ruby>講義<rt>こうぎ<\/rt><\/ruby>","精神科医による薬物療法の効果と副作用についての講義":"<ruby>精神科医<rt>せいしんかい<\/rt><\/ruby>による<ruby>薬物<rt>やくぶつ<\/rt><\/ruby><ruby>療法<rt>りょうほう<\/rt><\/ruby>の<ruby>効果<rt>こうか<\/rt><\/ruby>と<ruby>副作用<rt>ふくさよう<\/rt><\/ruby>についての<ruby>講義<rt>こうぎ<\/rt><\/ruby>","精神科病院":"<ruby>精神科<rt>せいしんか<\/rt><\/ruby><ruby>病院<rt>びょういん<\/rt><\/ruby>","精神科病院に医療保護入院しているＭさん（30代、女性）は、Ａ退院後生活環境相談員の支援を受け、退院後の生活についてイメージを育んできた。そのような中、Ｍさんの退院支援委員会が開催され、Ｍさんも参加した。そこで、主治医より、退院に向けた今後の治療方針が説明された。Ｍさんは不安なことや確認したいことについてＡ退院後生活環境相談員のサポートを受けながら、治療プログラムの理解を深めた。その後、Ｍさんは治療プログラムに主体的に取り組み始めた。次のうち、Ｍさんの主体的な取組を表す用語として、適切なものを1つ選びなさい。":"<ruby>精神科<rt>せいしんか<\/rt><\/ruby><ruby>病院<rt>びょういん<\/rt><\/ruby>に<ruby>医療保護入院<rt>いりょうほごにゅういん<\/rt><\/ruby>しているＭさん（30<ruby>代<rt>だい<\/rt><\/ruby>、<ruby>女性<rt>じょせい<\/rt><\/ruby>）は、Ａ<ruby>退院後<rt>たいいんご<\/rt><\/ruby><ruby>生活<rt>せいかつ<\/rt><\/ruby><ruby>環境<rt>かんきょう<\/rt><\/ruby><ruby>相談員<rt>そうだんいん<\/rt><\/ruby>の<ruby>支援<rt>しえん<\/rt><\/ruby>を<ruby>受<rt>う<\/rt><\/ruby>け、<ruby>退院後<rt>たいいんご<\/rt><\/ruby>の<ruby>生活<rt>せいかつ<\/rt><\/ruby>についてイメージを<ruby>育<rt>はぐく<\/rt><\/ruby>んできた。そのような<ruby>中<rt>なか<\/rt><\/ruby>、Ｍさんの<ruby>退院<rt>たいいん<\/rt><\/ruby><ruby>支援<rt>しえん<\/rt><\/ruby><ruby>委員会<rt>いいんかい<\/rt><\/ruby>が<ruby>開催<rt>かいさい<\/rt><\/ruby>され、Ｍさんも<ruby>参加<rt>さんか<\/rt><\/ruby>した。そこで、<ruby>主治医<rt>しゅじい<\/rt><\/ruby>より、<ruby>退院<rt>たいいん<\/rt><\/ruby>に<ruby>向<rt>む<\/rt><\/ruby>けた<ruby>今後<rt>こんご<\/rt><\/ruby>の<ruby>治療<rt>ちりょう<\ function syncRubyDisplay(){

});
const rubyWordPattern=new RegExp(Object.keys(RUBY_WORDS).sort((a,b)=>b.length-a.length).join('|'),'g');
function annotateText(text){
 return RUBY_TEXT[text]||esc(text).replace(rubyWordPattern,w=>`<ruby>${w}<rt>${RUBY_WORDS[w]}<\/rt><\/ruby>`);
}
function applyRuby(){
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),nodes=[];
 while(walker.nextNode()){
  const node=walker.currentNode;
  if(/[㐀-鿿々〆]/.test(node.data)&&!node.parentElement.closest('style,script,ruby,textarea,input,select,option'))nodes.push(node);
 }
 for(const node of nodes){
  const annotated=annotateText(node.data);
  if(!annotated.includes('<ruby>'))continue;
  const template=document.createElement('template');template.innerHTML=annotated;node.replaceWith(template.content);
 }
}
const rubyObserver=new MutationObserver(()=>{
 rubyObserver.disconnect();applyRuby();rubyObserver.observe(root,{childList:true,subtree:true,characterData:true});
});
syncRubyDisplay();rebuild();applyRuby();rubyObserver.observe(root,{childList:true,subtree:true,characterData:true});
