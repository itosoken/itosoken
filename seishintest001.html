const app=document.getElementById('app');
const KEY='itosoken-seishin33-v1',RUBY_KEY='itosoken-seishin33-ruby';

const counts=domains.map((_,d)=>DATA.filter(u=>u.domain===d).length);
let domain=0,unit=null,idx=0,answers={},selections={},query='',review=false,queue=[],history={},storageOK=true;

const GROUPS=[{"c": 1, "name": "統計データ", "title": "<ruby>統計<rt>とうけい</rt></ruby>データ", "from": 1, "to": 1}, {"c": 2, "name": "脳の仕組み", "title": "<ruby>脳<rt>のう</rt></ruby>の<ruby>仕組<rt>しく</rt></ruby>み", "from": 2, "to": 2}, {"c": 3, "name": "代表的な精神疾患", "title": "<ruby>代表的<rt>だいひょうてき</rt></ruby>な<ruby>精神疾患<rt>せいしんしっかん</rt></ruby>", "from": 3, "to": 8}, {"c": 4, "name": "精神疾患の治療", "title": "<ruby>精神疾患<rt>せいしんしっかん</rt></ruby>の<ruby>治療<rt>ちりょう</rt></ruby>", "from": 9, "to": 10}, {"c": 5, "name": "精神保健", "title": "<ruby>精神保健<rt>せいしんほけん</rt></ruby>", "from": 11, "to": 12}, {"c": 6, "name": "リハビリテーション", "title": "リハビリテーション", "from": 13, "to": 13}, {"c": 7, "name": "障害者福祉の概要", "title": "<ruby>障害者福祉<rt>しょうがいしゃふくし</rt></ruby>の<ruby>概要<rt>がいよう</rt></ruby>", "from": 14, "to": 15}, {"c": 8, "name": "医療支援", "title": "<ruby>医療<rt>いりょう</rt></ruby><ruby>支援<rt>しえん</rt></ruby>", "from": 16, "to": 18}, {"c": 9, "name": "経済的支援", "title": "<ruby>経済的<rt>けいざいてき</rt></ruby><ruby>支援<rt>しえん</rt></ruby>", "from": 19, "to": 20}, {"c": 10, "name": "生活支援", "title": "<ruby>生活<rt>せいかつ</rt></ruby><ruby>支援<rt>しえん</rt></ruby>", "from": 21, "to": 22}, {"c": 11, "name": "就労支援", "title": "<ruby>就労<rt>しゅうろう</rt></ruby><ruby>支援<rt>しえん</rt></ruby>", "from": 23, "to": 24}, {"c": 12, "name": "その他", "title": "その<ruby>他<rt>た</rt></ruby>", "from": 25, "to": 26}, {"c": 13, "name": "精神保健福祉士", "title": "<ruby>精神保健福祉士<rt>せいしんほけんふくしし</rt></ruby>", "from": 27, "to": 28}, {"c": 14, "name": "ソーシャルワーク", "title": "ソーシャルワーク", "from": 29, "to": 32}, {"c": 15, "name": "まとめて整理", "title": "まとめて<ruby>整理<rt>せいり</rt></ruby>", "from": 33, "to": 33}];
for(const u of DATA){const g=GROUPS.find(g=>u.n>=g.from&&u.n<=g.to);u.course=g.c;u.courseName=g.name;u.courseTitle=g.title}
const HUES={1:205,2:250,3:290,4:330,5:10,6:35,7:150,8:185,9:215,10:260,11:305,12:345,13:25,14:140,15:342};
function palette(c){const h=HUES[c],dk=h>=40&&h<=195;return `--accent:hsl(${h} ${dk?70:64}% ${dk?29:40}%);--tint:hsl(${h} 85% 92%);--border:hsl(${h} 55% 68%);--ink:hsl(${h} 70% ${dk?19:25}%)`}
function passed(u){const h=history[u.n];return !!h&&(h.pass===true||h.score===u.questions.length)}
function hero(){const ok=DATA.filter(passed).length,total=DATA.length,pct=Math.round(ok/total*100),rest=total-ok;
 const msg=ok===0?`まずは1${r('単元')}、<ruby>全問<rt>ぜんもん</rt></ruby>${r('正解')}をめざしましょう。`:rest===0?`33${r('単元')}すべて<ruby>合格<rt>ごうかく</rt></ruby>！ <ruby>全体像<rt>ぜんたいぞう</rt></ruby>が<ruby>完成<rt>かんせい</rt></ruby>しました。`:`あと <b>${rest}</b>${r('単元')}で、<ruby>全体像<rt>ぜんたいぞう</rt></ruby>が<ruby>完成<rt>かんせい</rt></ruby>します。`;
 return `<section class="hero" aria-label="全体の達成状況"><div class="hero-top"><div class="hero-count"><span class="hero-lbl"><ruby>全体<rt>ぜんたい</rt></ruby>の<ruby>達成<rt>たっせい</rt></ruby><ruby>状況<rt>じょうきょう</rt></ruby></span><div class="hero-num">33${r('単元')}<ruby>中<rt>ちゅう</rt></ruby> <strong>${ok}</strong>${r('単元')} <ruby>合格<rt>ごうかく</rt></ruby></div></div><div class="hero-pct"><strong>${pct}</strong>%</div></div>
 <div class="hero-bar" role="progressbar" aria-label="全体の達成率" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${ok/total*100}%"></i></div><p class="hero-msg">${msg}</p>
 <div class="hero-map" aria-label="33単元の合格マップ">${DATA.map((u,k)=>`${k&&DATA[k-1].domain!==u.domain?'<span class="gap"></span>':''}<button class="cell ${passed(u)?'on':''}" style="${palette(u.course)}" onclick="start(${u.n})" title="${u.n} ${escapeText(u.name)}${passed(u)?'（合格）':''}" aria-label="${u.n} ${escapeText(u.name)}${passed(u)?' 合格':''}">${u.n}</button>`).join('')}</div>
 <p class="hero-note"><ruby>色<rt>いろ</rt></ruby>がついたマスが<ruby>合格<rt>ごうかく</rt></ruby>した${r('単元')}です。マスをおすと、その${r('単元')}のテストがはじまります。</p></section>`}
function selectDomain(value){domain=value;query='';home()}
function home(){
 unit=null;document.body.dataset.domain=domain;app.style.cssText='';
 app.innerHTML=`${hero()}
 <div class="tabs" aria-label="領域を選ぶ">${domains.map((d,i)=>{const us=DATA.filter(u=>u.domain===i),ok=us.filter(passed).length,pct=Math.round(ok/us.length*100);
  return `<button data-domain="${i}" class="tab ${domain===i?'active':''}" aria-pressed="${domain===i}" onclick="selectDomain(${i})"><b class="tab-name">${d}</b><span class="tab-stat">${us.length}${r('単元')}<ruby>中<rt>ちゅう</rt></ruby> <strong>${ok}</strong>${r('単元')} <ruby>合格<rt>ごうかく</rt></ruby></span><span class="tab-meter"><span class="tab-bar" role="img" aria-label="達成率 ${pct}%"><i style="width:${ok/us.length*100}%"></i></span><span class="tab-pct">${pct}%</span></span><span class="tab-go">${domain===i?'▼ <ruby>表示中<rt>ひょうじちゅう</rt></ruby>':'ひらく ▶'}</span></button>`}).join('')}</div>
 <div class="toolbar"><h2>${domains[domain]}</h2><div class="filters"><input id="search" type="search" aria-label="単元をさがす" placeholder="単元名・番号でさがす" value="${escapeText(query)}"></div></div>
 <div id="units"></div><p class="muted notice" id="storageNotice">${r(storageOK?'学習記録は、このブラウザに保存されます。':'このブラウザでは学習記録を保存できません。テストはそのまま利用できます。')}</p>`;
 document.getElementById('search').oninput=e=>{query=e.target.value;cards()};cards();
}
function cards(){
 const term=query.trim().normalize('NFKC').toLowerCase();
 const list=DATA.filter(u=>u.domain===domain&&(`${u.n} ${u.name} ${u.courseName} 項目${u.course}`).normalize('NFKC').toLowerCase().includes(term));
 const groups=[];for(const u of list){let g=groups[groups.length-1];if(!g||g.course!==u.course){g={course:u.course,items:[]};groups.push(g)}g.items.push(u)}
 document.getElementById('units').innerHTML=groups.map(g=>{const G=GROUPS.find(x=>x.c===g.course),n=G.to-G.from+1;
  return `<section class="group" style="${palette(g.course)}" aria-label="項目${G.c} ${escapeText(G.name)}"><div class="group-head"><span class="tanzen"><ruby>項目<rt>こうもく</rt></ruby>${G.c}</span><b>${G.title}</b><small>${G.from===G.to?G.from:G.from+'〜'+G.to}　（${n}${r('単元')}）</small></div><div class="grid">${g.items.map(u=>`<button class="unit" onclick="start(${u.n})"><span class="line"><span class="no">${u.n}</span><b>${u.title}</b>${passed(u)?'<span class="pass">✓ <ruby>合格<rt>ごうかく</rt></ruby></span>':''}</span><small>${history[u.n]?`${history[u.n].score} / 12 · ${r('前のスコア')}`:'○× 10 + 5つからえらぶ 2'}　→</small></button>`).join('')}</div></section>`}).join('')||'<p>みつかりませんでした。キーワードをかえてください。</p>';
}
function start(n){const chosen=DATA.find(u=>u.n===n);if(!chosen)return;unit=chosen;domain=unit.domain;answers={};selections={};queue=unit.questions.map((_,i)=>i);idx=0;review=false;show();window.scrollTo(0,0)}
function jump(i){if(i<0||i>=queue.length)return;idx=i;show();window.scrollTo(0,0)}
function show(){
 document.body.dataset.domain=unit.domain;app.style.cssText=palette(unit.course);
 const qi=queue[idx],q=unit.questions[qi],answered=answers[qi]!==undefined,chosen=answered?answers[qi]:(selections[qi]||[]),multi=q.select>1,tf=q.options.length===2;
 const done=queue.filter(n=>answers[n]!==undefined).length;
 app.innerHTML=`<button onclick="home()">← ${r('単元')}をえらぶ</button><div class="course-heading muted">${domains[unit.domain]}　<ruby>項目<rt>こうもく</rt></ruby>${unit.course}　${unit.courseTitle}</div><div class="toolbar"><h2 class="screen-title" tabindex="-1">${unit.n}　${unit.title}</h2><span>${review?'もういちど · ':''}${idx+1} / ${queue.length}</span></div><div class="progress" role="progressbar" aria-label="解答済みの問題数" aria-valuenow="${done}" aria-valuemin="0" aria-valuemax="${queue.length}"><span style="width:${done/queue.length*100}%"></span></div>
 <section class="panel"><div class="muted">${qi+1} · ${tf?'○×':`5つから${q.select}つえらぶ`}</div><div class="question">${q.text}</div>
 ${multi?`<p class="multi-note">${q.select}つえらんで「${r('答えを確定する')}」をおしてください。</p>`:''}
 <div class="options ${tf?'tf':''}">${q.options.map((s,i)=>{
  const sel=chosen.includes(i),right=q.answer.includes(i);
  const cls=answered?(right?'correct ':'')+(sel?(right?'chosen':'wrong'):''):(sel?'selected':'');
  const disabled=answered||(multi&&!sel&&chosen.length>=q.select);
  return `<button class="option ${cls}" ${disabled?'disabled':''} ${multi&&!answered?`aria-pressed="${sel}"`:''} onclick="choose(${i})">${tf?s:`<span class="answer-mark">${i+1}.${multi&&sel?' ✓':''}</span> ${s}`}</button>`
 }).join('')}</div>
 ${multi&&!answered?`<div class="multi-confirm"><button class="primary" onclick="confirmAnswer()" ${chosen.length!==q.select?'disabled':''}>${r('答えを確定する')}</button><span>${r('選択中')} ${chosen.length} / ${q.select}</span></div>`:''}
 <div id="feedback" aria-live="polite">${answered?feedback(q,answers[qi]):''}</div>
 <div class="foot"><button onclick="jump(${idx-1})" ${idx===0?'disabled':''}>← まえへ</button><button class="primary" ${!answered?'disabled':''} onclick="next()">${idx===queue.length-1?r('結果')+'をみる':'つぎへ →'}</button></div></section>
 <div class="pills" aria-label="問題を選ぶ">${queue.map((n,i)=>`<button class="${i===idx?'current ':''}${answers[n]!==undefined?(same(answers[n],unit.questions[n].answer)?'done-ok':'done-bad'):''}" onclick="jump(${i})" ${i===idx?'aria-current="step"':''} aria-label="問題${n+1}${answers[n]!==undefined?(same(answers[n],unit.questions[n].answer)?' 正解':' 不正解'):''}">${n+1}${answers[n]!==undefined?(same(answers[n],unit.questions[n].answer)?' ✓':' ×'):''}</button>`).join('')}</div>`;
}
function answerLabel(q,a){return q.options.length===2?q.options[a[0]]:a.slice().sort((x,y)=>x-y).map(i=>i+1).join('・')}
function feedback(q,a){return `<div class="feedback ${same(q.answer,a)?'':'bad'}"><strong>${same(q.answer,a)?r('正解です！'):'もういちど、たしかめましょう。'}</strong><p>${r('正解')}：${answerLabel(q,q.answer)}</p>${q.explanation}<span class="source-ref">${q.reference}</span></div>`}
function choose(a){
 const qi=queue[idx],q=unit.questions[qi];if(answers[qi]!==undefined||!Number.isInteger(a)||a<0||a>=q.options.length)return;
 if(q.select===1){answers[qi]=[a];show();return}
 const s=selections[qi]||(selections[qi]=[]),at=s.indexOf(a);if(at>=0)s.splice(at,1);else if(s.length<q.select)s.push(a);show();
}
function confirmAnswer(){const qi=queue[idx],q=unit.questions[qi],s=selections[qi]||[];if(answers[qi]!==undefined||s.length!==q.select)return;answers[qi]=s.slice().sort((a,b)=>a-b);show()}
function next(){if(answers[queue[idx]]===undefined)return;if(idx<queue.length-1)jump(idx+1);else result()}
function result(){
 const unanswered=queue.findIndex(i=>answers[i]===undefined);if(unanswered!==-1){jump(unanswered);return}
 const wrong=queue.filter(i=>!same(answers[i],unit.questions[i].answer)),score=queue.length-wrong.length;
 if(!review){history[unit.n]={score,date:Date.now(),pass:score===unit.questions.length||passed(unit)};save()}
 app.innerHTML=`<button onclick="home()">← ${r('単元')}をえらぶ</button><div class="panel"><div class="brand">LESSON COMPLETE</div><h2>${unit.n}　${unit.title}</h2><p>${review?'もういちどの学習、おつかれさまでした。':'おつかれさまでした。'}</p><div class="score">${score}<span style="font-size:24px"> / ${queue.length}</span></div><p>${wrong.length?'まちがえたところを、もういちど。ひとつずつ身につけていきましょう。':'すべてできました！ よくがんばりました。'}</p>
 <div class="foot">${wrong.length?'<button class="primary" id="retry">まちがえたところだけ</button>':''}<button onclick="start(${unit.n})">はじめから</button>${unit.n<DATA.length?`<button onclick="start(${unit.n+1})">つぎの${r('単元')} →</button>`:''}</div>
 <div class="score-list" aria-label="解答の結果">${queue.map((qi,i)=>{const q=unit.questions[qi];return `<button onclick="jump(${i})">${qi+1} · ${same(answers[qi],q.answer)?'✓ '+r('正解'):'× '+r('不正解')}<small>${r('あなたの答え')}：${answerLabel(q,answers[qi])} ／ ${r('正解')}：${answerLabel(q,q.answer)}　${r('解説')}をみる →</small></button>`}).join('')}</div>${!storageOK?'<p class="notice">'+r('このブラウザでは学習記録を保存できませんでした。')+'</p>':''}</div>`;
 if(wrong.length)document.getElementById('retry').onclick=()=>{queue=wrong;wrong.forEach(i=>{delete answers[i];delete selections[i]});idx=0;review=true;show();window.scrollTo(0,0)};
 window.scrollTo(0,0);
}
home();
