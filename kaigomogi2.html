<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>第39回介護福祉士国家試験 模擬試験２</title>
<style>
:root{--ink:#111;--sub:#3d4652;--line:#d9dee5;--bg:#f5f6f8;--card:#fff;--accent:#1d4f91;--accent-weak:#e8eff8;--ok:#17754a;--ok-weak:#e6f4ec;--ng:#b83227;--ng-weak:#fbeceb}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","BIZ UDPGothic","Meiryo","Yu Gothic Medium","Yu Gothic",sans-serif;font-weight:500;font-size:17px;line-height:2.15}
rt{font-size:.5em;color:#222;font-weight:500}
header{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line)}
.hd{max-width:1200px;margin:0 auto;padding:8px 16px 0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-bottom:6px}
h1{margin:0;font-size:15px;font-weight:700;line-height:1.9}
.furi{flex:none;display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--sub);line-height:1.4}
.furi div{display:flex;border:1px solid var(--accent);border-radius:6px;overflow:hidden}
.furi button{font:inherit;border:0;background:#fff;color:var(--accent);padding:4px 12px;cursor:pointer}
.furi button[aria-pressed=true]{background:var(--accent);color:#fff;font-weight:700}
body.noruby rt{display:none}
body.noruby{line-height:1.8}
body.noruby h1{line-height:1.6}
.tabs{display:flex;gap:4px}
.tab{flex:1;border:0;background:none;font:inherit;color:var(--sub);padding:6px 4px 8px;border-bottom:3px solid transparent;cursor:pointer;line-height:1.5}
.tab b{display:block;font-size:16px}
.tab span{font-size:12.5px}
.tab[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent)}
main{max-width:1200px;margin:0 auto;padding:16px 16px 64px}
.part{display:none}.part.on{display:block}
.subject{margin:28px 0 12px;padding:2px 12px;border-left:5px solid var(--accent);font-weight:700;font-size:18px}
.part>.subject:first-child{margin-top:8px}
.case{background:var(--accent-weak);border-radius:8px;padding:12px 16px;margin:20px 0 12px}
.case .lead{font-weight:700}
.case p,.q p{margin:0 0 6px}
.q{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px 12px;margin:0 0 14px;scroll-margin-top:120px}
.qn{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--accent);margin-bottom:2px}
.res{display:none;font-size:13px;line-height:1.9;padding:0 10px;border-radius:99px}
.q img{display:block;max-width:100%;margin:8px auto 10px}
.q img.small{max-width:150px}
.opts{margin-top:8px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:5px 10px;margin:6px 0;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .no{flex:none;width:30px;height:30px;margin-top:4px;border:1.5px solid var(--sub);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;line-height:1;background:#fff}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-weak)}
.opt:has(input:checked) .no{background:var(--accent);border-color:var(--accent);color:#fff}
.opt:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.ex{display:none;font-size:14.5px;color:var(--sub);line-height:2}
.note{font-size:13.5px;color:var(--sub);line-height:2;margin-top:6px}
.foot{margin-top:24px;text-align:center}
.btn{font:inherit;font-weight:700;border:0;border-radius:8px;background:var(--accent);color:#fff;padding:8px 36px;cursor:pointer;min-width:240px}
.btn.ghost{background:none;color:var(--accent);border:1.5px solid var(--accent)}
.warn{display:none;text-align:left;background:#fff8e5;border:1px solid #e6c766;border-radius:8px;padding:12px 16px;margin:0 0 16px}
.warn a{display:inline-block;margin:0 8px 0 0;color:var(--accent)}
.warn .btn{margin-top:8px}
#result{display:none;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px 16px;margin-bottom:20px;text-align:center}
.rank{font-size:34px;font-weight:700;line-height:1.2;margin-bottom:6px}.rank b{font-size:110px;margin-right:4px}.rank .msg{font-size:24px;line-height:2;margin-top:4px}.rank .msg rt{color:inherit}
#result .score{font-size:44px;font-weight:700;line-height:1.3}
#result .score small{font-size:18px;font-weight:400;color:var(--sub)}
.verdict{display:inline-block;font-weight:700;font-size:20px;padding:0 28px;border-radius:99px;margin:6px 0 4px}
.pass{background:var(--ok-weak);color:var(--ok)}.fail{background:var(--ng-weak);color:var(--ng)}
#result table{width:100%;border-collapse:collapse;margin:12px 0 4px;font-size:15.5px}
#result th,#result td{border-top:1px solid var(--line);padding:4px 6px;text-align:center}
#result th{font-weight:400;color:var(--sub);font-size:13.5px}
#result td .verdict{font-size:14.5px;padding:0 12px;margin:0}
#result .memo{font-size:13.5px;color:var(--sub);line-height:2}
.link{font:inherit;font-size:14px;background:none;border:0;color:var(--sub);text-decoration:underline;cursor:pointer;margin-top:6px}
/* graded */
body.graded .opt{cursor:default}
body.graded .ex{display:block}
body.graded .res{display:inline-block}
body.graded .q.ok .res{background:var(--ok-weak);color:var(--ok)}
body.graded .q.ng .res{background:var(--ng-weak);color:var(--ng)}
body.graded .opt.correct{border-color:var(--ok);background:var(--ok-weak)}
body.graded .opt.correct .no{background:var(--ok);border-color:var(--ok);color:#fff}
body.graded .opt.wrong{border-color:var(--ng);background:var(--ng-weak)}
body.graded .opt.wrong .no{background:var(--ng);border-color:var(--ng);color:#fff}
body.graded #gradeFoot{display:none}
@media(min-width:1000px){body{font-size:19px}.hd,main{padding-left:28px;padding-right:28px}h1{font-size:17px}.tab b{font-size:18px}.tab span{font-size:14px}.q{padding:18px 22px 14px}}
@media(max-width:520px){body{font-size:16px}main{padding:12px 10px 56px}.q{padding:12px 12px 10px}.tab b{font-size:15px}}
</style>
</head>
<body>

<div class="top"><h1 id="title"></h1><div class="furi"><span>ふりがな</span><div><button data-furi="1">あり</button><button data-furi="0">なし</button></div></div></div>
<div class="tabs" role="tablist" id="tabs"></div>
</div></header>
<main>
<div id="result"></div>
<div id="parts"></div>
</main>

function setFuri(on){
  var y=window.pageYOffset,a=null,els=document.querySelectorAll(".part.on .q");
  for(var i=0;i<els.length;i++){if(els[i].getBoundingClientRect().bottom>110){a=els[i];break}}
  var before=a?a.getBoundingClientRect().top:0;
  document.body.classList.toggle("noruby",!on);
  [].forEach.call(document.querySelectorAll("[data-furi]"),function(b){b.setAttribute("aria-pressed",(b.dataset.furi=="1")==on)});
  if(a&&y>0)window.scrollBy(0,a.getBoundingClientRect().top-before);
  try{localStorage.setItem(KEY+"-furi",on?"1":"0")}catch(e){}
}

var scorm=null;

}
function counts(){
  var c=PARTS.map(function(){return{done:0,ok:0}}),miss=[];
  DATA.forEach(function(d){if(d.t!="q")return;var a=state.ans[d.n],x=c[partOf(d.n)];if(a){x.done++;if(a==d.a)x.ok++}else miss.push(d.n)});
  return{c:c,miss:miss};
}
function refreshTabs(){
  var c=counts().c;
  PARTS.forEach(function(P,i){var n=P.to-P.from+1;
    $("tc"+i).innerHTML=state.graded?c[i].ok+" / "+n+r("{点|てん}"):r("{問題|もんだい}")+P.from+"～"+P.to+"　"+c[i].done+"/"+n});
}
function show(i,q){
  cur=i;
  PARTS.forEach(function(P,j){$("part"+j).classList.toggle("on",j==i)});
  [].forEach.call(document.querySelectorAll(".tab"),function(t,j){t.setAttribute("aria-selected",j==i)});
  if(q){var el=$("q"+q);if(el)el.scrollIntoView()}else window.scrollTo(0,0);
}
function restore(){
  Object.keys(state.ans).forEach(function(n){var el=document.querySelector('input[name="q'+n+'"][value="'+state.ans[n]+'"]');if(el)el.checked=true});
}
function grade(){
  state.graded=true;save();
  var k=counts(),total=k.c[0].ok+k.c[1].ok+k.c[2].ok,passed=total>=PASS;
  document.body.classList.add("graded");
  DATA.forEach(function(d){if(d.t!="q")return;
    var sec=$("q"+d.n),a=state.ans[d.n],ok=a==d.a;
    sec.classList.add(ok?"ok":"ng");
    sec.querySelector(".res").innerHTML=r(ok?"{正解|せいかい}":a?"{不正解|ふせいかい}":"{未解答|みかいとう}");
    [].forEach.call(sec.querySelectorAll(".opt"),function(l,i){
      l.querySelector("input").disabled=true;
      if(i+1==d.a)l.classList.add("correct");else if(i+1==a)l.classList.add("wrong")});
  });
  var rk=total>=80?["Ａ","#d0021b","{合格|ごうかく}{間違|まちが}いなし！"]:total>=70?["Ｂ","#1558c0","{合格|ごうかく}レベルです"]:total>=60?["Ｃ","#178a3e","あと{一踏|ひとふ}ん{張|ば}り{頑張|がんば}りましょう"]:["Ｄ","#111","まだ{間|ま}に{合|あ}います。これから{最後|さいご}の{追|お}い{込|こ}みをかけましょう"];
  var h='<div class="rank" style="color:'+rk[1]+'"><b>'+rk[0]+'</b>ランク<div class="msg">'+r(rk[2])+'</div></div>';
  h+='<div class="score">'+total+'<small> / '+TOTAL+r("{点|てん}")+'</small></div>';
  h+='<div class="verdict '+(passed?"pass":"fail")+'">'+r(passed?"{合格|ごうかく}":"{不合格|ふごうかく}")+'</div>';
  h+='<div class="memo">'+r("{合格基準|ごうかくきじゅん}：{総得点|そうとくてん}"+PASS+"{点以上|てんいじょう}")+'</div>';
  h+='<div class="memo">'+r("Ａランク：80{点以上|てんいじょう}　Ｂランク：70～79{点|てん}　Ｃランク：60～69{点|てん}　Ｄランク：59{点以下|てんいか}")+'</div>';
  h+='<table><tr><th></th><th>'+r("{得点|とくてん}")+'</th>'+(passed?'':'<th>'+r("{基準|きじゅん}")+'</th><th>'+r("パート{合格|ごうかく}")+'</th>')+'</tr>';
  PARTS.forEach(function(P,i){var n=P.to-P.from+1,ok=k.c[i].ok>=P.pass;
    h+='<tr><td>'+P.name+'</td><td><b>'+k.c[i].ok+'</b> / '+n+'</td>'+(passed?'':'<td>'+P.pass+r("{点以上|てんいじょう}")+'</td><td><span class="verdict '+(ok?"pass":"fail")+'">'+r(ok?"{合格|ごうかく}":"{不合格|ふごうかく}")+'</span></td>')+'</tr>'});
  h+='</table>';
  if(!passed)h+='<div class="memo">'+r("{総得点|そうとくてん}が"+PASS+"{点|てん}に{満|み}たないため，パートごとに{合格|ごうかく}かどうかを{判定|はんてい}しています。")+'</div>';
  h+='<div class="memo">'+r("{下|した}の{各問題|かくもんだい}で，{正答|せいとう}と{解説|かいせつ}を{確認|かくにん}できます。")+'</div>';
  h+='<button class="link" id="retry">'+r("もう{一度|いちど}{最初|さいしょ}から{解|と}く")+'</button>';
  $("result").innerHTML=h;$("result").style.display="block";
  refreshTabs();
  return{total:total,passed:passed};
}
document.addEventListener("change",function(e){
  var t=e.target;if(t.type!="radio"||state.graded)return;
  state.ans[t.name.slice(1)]=+t.value;save();refreshTabs();$("warn").style.display="none";
});
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-go],[data-q],[data-furi],#grade,#force,#retry");if(!t)return;
  if(t.dataset.furi!=null){setFuri(t.dataset.furi=="1");return}
  if(t.dataset.go!=null){show(+t.dataset.go);return}
  if(t.dataset.q){e.preventDefault();show(partOf(+t.dataset.q),+t.dataset.q);return}
  if(t.id=="retry"){state={ans:{},graded:false};save();location.reload();return}
  if(t.id=="grade"){
    var miss=counts().miss;
    if(miss.length){
      $("warn").innerHTML=r("まだ{解答|かいとう}していない{問題|もんだい}が")+miss.length+r("{問|もん}あります。")+'<br>'+miss.map(function(n){return'<a href="#q'+n+'" data-q="'+n+'">'+n+'</a>'}).join("")+'<br><button class="btn ghost" id="force">'+r("このまま{採点|さいてん}する")+'</button>';
      $("warn").style.display="block";return}
  }
  var g=grade();scormSend(g.total,g.passed);show(0);
});
load();build();restore();scormInit();
var furi="1";try{furi=localStorage.getItem(KEY+"-furi")||"1"}catch(e){}setFuri(furi!="0");
if(state.graded)grade();
refreshTabs();show(0);
</script>
</body>
</html>
