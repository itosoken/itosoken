(()=>{
'use strict';
const host=document.currentScript.previousElementSibling;
const root=host.attachShadow({mode:'open'});
const QUESTIONS=[{"id":1,"question":"双極性障害の躁病エピソードに関する次の記述のうち、正しいものを2つ選びなさい。","options":["考えが次々と浮かんでくる。","性欲が低下する。","治療薬は、ＳＳＲＩ（選択的セロトニン再取り込み阻害薬）を使用する。","「自分は何でもできる」と気が大きくなる。","活動性が亢進するので、疲労を感じやすい。"],"answer":[1,4],"subject":0,"explanation":"躁病エピソードでは、考えが次々と浮かぶ観念奔逸や、自信が過剰になる誇大性がみられます。活動が増えても疲れを感じにくいことがあります。"},{"id":2,"question":"アルコール依存症の治療に関する次の記述のうち、正しいものを1つ選びなさい。","options":["向精神薬の使用は禁忌である。","本人の抱える問題は家族が代わって対処することが望ましい。","断酒会は、匿名で参加する自助グループである。","抗酒剤は、服用後に飲酒すると頭痛や嘔吐などを起こすことで飲酒を抑止する。","合併症のウェルニッケ脳症は断酒をすれば改善する。"],"answer":[4],"subject":0,"explanation":"抗酒剤は、服用中に飲酒すると不快な反応が起こる仕組みを利用します。本人の理解と同意、医師の管理のもとで用いる薬です。"},{"id":3,"question":"次の記述のうち、パニック症におけるパニック発作の典型的な症状として、正しいものを1つ選びなさい。","options":["動悸を感じる。","空虚感を認める。","興奮して走り出す。","大勢から注目を浴びることを避ける。","周囲からの視線が気になる。"],"answer":[1],"subject":0,"explanation":"パニック発作では、突然の強い不安とともに、動悸、息苦しさ、発汗などが起こります。"},{"id":4,"question":"Ａさん（74歳、女性）は、2年前に母親が亡くなった頃からふさぎ込むようになり、物忘れが徐々に目立ってきた。物忘れは、ついさっきのことを忘れることが多く、本人の物忘れへの自覚は乏しかった。数ヵ月前から、「お母さんが来ているでしょう」と夜中に何度も夫を起こすようになった。昼間は比較的しっかりしているが、時折、「誰かが財布を盗んだ」と訴えて、険しい表情になることがある。次のうち、Ａさんに疑われる診断名として、適切なものを1つ選びなさい。","options":["全般性不安症","認知症","うつ病","統合失調症","妄想症"],"answer":[2],"subject":0,"explanation":"最近の出来事を忘れ、本人の自覚が乏しく、徐々に進行しています。物を盗られたという訴えも含め、事例では認知症が疑われます。"},{"id":5,"question":"Ｂさん（28歳、女性）は、数年前から、紙幣に誰かの血液が付着しているかもしれないという考えにとらわれて、紙幣に直接触れることができない。やむを得ず触れた後には、長時間手を洗うため、生活に支障が生じており、困って自ら精神科を受診した。次のうち、Ｂさんの症状として、正しいものを1つ選びなさい。","options":["血統妄想","被毒妄想","強迫観念","妄想知覚","観念奔逸"],"answer":[3],"subject":0,"explanation":"強迫観念は、意思に反して繰り返し浮かび、払いのけにくい考えです。事例では汚染への不安と、それを和らげる手洗いがみられます。"},{"id":6,"question":"Ｃさん（26歳、男性）は、仕事上のささいなミスを上司に注意されてから、職場の雰囲気が変わったように感じ、漠然とした不安を抱くようになった。通勤の時の風景もいつもと違って見え、何か不吉なことが起きるのではないかと怖くなって外に出ることができなくなった。自室にひきこもってさかんに、「怖い」と訴えるため、心配した両親に連れられて精神科を受診した。次のうち、Ｃさんの精神症状として、正しいものを1つ選びなさい。","options":["関係妄想","妄想気分","罪業妄想","抑うつ気分","広場恐怖"],"answer":[2],"subject":0,"explanation":"妄想気分は、周囲がいつもと違い、何か不吉なことが起こりそうだと感じる状態です。まだ具体的な妄想の内容は明確ではありません。"},{"id":7,"question":"次の記述のうち、注意欠如・多動症（ＡＤＨＤ）の症状として、適切なものを1つ選びなさい。","options":["爽快気分が生じ楽観的に物事を考える。","身体に対する著しい認知の歪みを認める。","非言語的コミュニケーションが苦手である。","自分の考えが抜き取られるように感じる。","課題や活動を順序立てて行うことが困難である。"],"answer":[5],"subject":0,"explanation":"ADHDでは、不注意などにより、課題を整理して順序立てて進めることに難しさがみられます。"},{"id":8,"question":"Ｄさん（38歳、男性）は、不眠を主訴に精神科クリニックを受診した。医師が不眠の理由を尋ねると、「常に誰かに後を付けられている。道を行く全ての人が、自分のことを話している。自分を狙っている組織がある」と訴えた。診察の結果、Ｄさんは、統合失調症と診断され、薬物療法を含む治療が開始された。その後来院した時、Ｄさんは精神科クリニックのＥ精神保健福祉士に、「組織の人がそこに来ている気がする。どう思いますか」と心配そうに確認を求めてきた。次の記述のうち、Ｅ精神保健福祉士から、Ｄさんに対する声かけとして、適切なものを2つ選びなさい。","options":["「あなたの考えは間違っています」と明確に指摘する。","「大変ですね。おつらいですね」と共感を示す。","「あなたの心配を担当の医師に伝えてみませんか」と促す。","「どういう組織か詳しく教えてください」と説明を求める。","「組織が攻撃してくることはあり得ません」と述べた上でその理由を論理的に説明する。"],"answer":[2,3],"subject":0,"explanation":"妄想の内容を肯定したり、強く否定したりせず、本人のつらさを受け止めます。心配を主治医へ伝えることも支援します。"},{"id":9,"question":"次の記述のうち、精神分析療法として、正しいものを1つ選びなさい。","options":["物事の捉え方に焦点を当てて、修正する。","「あるがまま」の心的態度を身につける。","家族関係に生じている心理的問題に対して、家族を対象とした集団面接を行う。","心に浮かんだことを自由に連想して、語ってもらう。","芸術活動を通して心身の安定を図る。"],"answer":[4],"subject":0,"explanation":"精神分析療法では、心に浮かぶことを自由に語る「自由連想法」を用います。無意識の葛藤などを理解していきます。"},{"id":10,"question":"次の記述のうち、入院中の行動制限に関し、「精神保健福祉法」に基づく厚生労働大臣が定める基準として、正しいものを2つ選びなさい。","options":["病状に応じて、できる限り早期に患者に面会の機会を与える。","通信は基本的に自由であることを、患者や家族等に文書や口頭で伝える。","任意入院では、閉鎖病棟で処遇することは禁止されている。","12 時間を超えない隔離は、看護師の判断で実施できる。","身体的拘束を実施中、医師の診察は毎日1回とされている。"],"answer":[1,2],"subject":0,"note":"「精神保健福祉法」とは、「精神保健及び精神障害者福祉に関する法律」のことである。","explanation":"通信や面会の自由を尊重することが基本です。通信の自由を説明し、病状に応じてできるだけ早く面会の機会を確保します。"},{"id":11,"question":"次のうち、国際生活機能分類（ＩＣＦ）でいう心身機能の改善に焦点を当てたものとして、正しいものを1つ選びなさい。","options":["統合失調症患者の家族への心理教育","うつ病患者への薬物療法","高次脳機能障害の人にも使い方が分かりやすい道具の開発研究","認知症の人が生活しやすいグループホームの在り方の研究","偏見をもたずに精神障害者を雇用する職場を増やす啓発活動"],"answer":[2],"subject":1,"explanation":"心身機能は、身体や精神の働きを指します。うつ症状の改善を目指す薬物療法が、この側面に焦点を当てています。"},{"id":12,"question":"次のうち、不適切な養育を意味する用語として、正しいものを1つ選びなさい。","options":["アタッチメント","トラウマインフォームドケア","マルトリートメント","インプリンティング","アロマザリング"],"answer":[3],"subject":1,"explanation":"マルトリートメントは、不適切な養育を意味します。子どもの心身の健康や発達を損なう関わりを広く捉える用語です。"},{"id":13,"question":"いじめ防止対策推進法に関する次の記述のうち、正しいものを2つ選びなさい。","options":["児童生徒から教員に対して向けられる暴力の防止についての規定がある。","ソーシャル・ネットワーキング・サービス（ＳＮＳ）に書き込まれた誹謗中傷は、いじめの定義から除外されている。","校長に対する罰則の規定がある。","いじめの早期発見、いじめの再発を防止するための取組等について、学校の評価を適正に行うことが規定されている。","学校外で生じた児童生徒同士のトラブルは、いじめに該当することがある。"],"answer":[4,5],"subject":1,"explanation":"いじめは学校外やインターネット上でも起こります。学校評価では、早期発見や再発防止などの取組を適切に評価することが求められます。"},{"id":14,"question":"勤労者の過労自殺に関する次の記述のうち、正しいものを1つ選びなさい。","options":["過労死等防止対策推進法では、政府に対し、過労死等の防止のための対策に関する大綱を定めることとしている。","2018年（平成30年）の労働基準法の改正において、時間外労働の上限が月90 時間・年720 時間に規制された。","従業員支援プログラム（ＥＡＰ）は、職場の管理監督者が行う過労自殺防止を含めた健康相談プログラムである。","自殺未遂者に対する産業保健スタッフの支援は、自殺対策のポストベンションに該当する。","労働安全衛生法では、業務による心理的負荷による精神障害を原因とする自殺を過労死等の一つとして規定している。"],"answer":[1],"subject":1,"explanation":"過労死等防止対策推進法は、政府が防止対策に関する大綱を定めることを規定しています。"},{"id":15,"question":"災害時の精神保健に関する次の記述のうち、正しいものを1つ選びなさい。","options":["デブリーフィングは、災害時に備えた福祉施設での避難訓練である。","急性ストレス障害（ＡＳＤ）は、災害発生後1か月以上が経過してから初めて被災者に現れる精神症状である。","ＤＰＡＴは、厚生労働省に設置する災害時の情報センターである。","サイコロジカル・ファーストエイド（ＰＦＡ）は、重大な危機的出来事にあったばかりで苦しんでいる人びとへの人道的、支持的、かつ実際的な支援である。","トリアージは、災害時の精神科医による精神療法である。"],"answer":[4],"subject":1,"explanation":"PFAは、危機的な出来事で苦しむ人への、人道的で実際的な支援です。安全や生活上の必要に配慮し、無理に体験を語らせません。"},{"id":16,"question":"Ｎ市では、保健指導としてアルコール関連問題のスクリーニング調査と簡易的な面接指導を行う計画を立てている。次のうち、上記計画で使用するスクリーニングテストとして、適切なものを1つ選びなさい。","options":["ＡＵＤＩＴ","ＧＨＱ","ＳＤＳ","ＣＥＳ－Ｄ","ＢＤＩ"],"answer":[1],"subject":1,"explanation":"AUDITは、飲酒の状況やアルコール関連問題を把握するためのスクリーニングテストです。"},{"id":17,"question":"次のうち、薬物を社会規範から逸脱した目的や方法で自己摂取することを指す概念として、正しいものを1つ選びなさい。","options":["依存","離脱","中毒","乱用","耐性"],"answer":[4],"subject":1,"explanation":"薬物の乱用は、社会規範から外れた目的や方法で薬物を使用することです。依存や耐性とは別の概念です。"},{"id":18,"question":"犯罪被害者等基本法に関する次の記述のうち、正しいものを1つ選びなさい。","options":["国及び地方公共団体は、保健医療サービス及び福祉サービスが提供されるよう必要な施策を講ずるものとされている。","都道府県警察本部には、犯罪被害者等施策推進会議を設置することが定められている。","犯罪被害者の心理的外傷等に関する調査研究は、裁判所の責務とされている。","地方公共団体には、犯罪被害者等基本計画の策定が義務づけられている。","法務省内に犯罪被害者支援ネットワークを設置することが定められている。"],"answer":[1],"subject":1,"explanation":"犯罪被害者等基本法は、国や地方公共団体に、必要な保健医療・福祉サービスを受けられるための施策を求めています。"},{"id":19,"question":"次のうち、世界精神保健連盟（ＷＦＭＨ）が提唱し、国際連合が制定した国際デーとして、正しいものを1つ選びなさい。","options":["世界メンタルヘルスデー","世界自閉症啓発デー","国際障害者デー","世界患者安全デー","世界自殺予防デー"],"answer":[1],"subject":1,"explanation":"世界メンタルヘルスデーは10月10日です。心の健康への理解を広げ、偏見の解消などを目指します。"},{"id":20,"question":"Ｐ県に採用されたＦ精神保健福祉士は、児童・思春期の精神保健相談、各種依存症に関する相談や支援、市町村の障害者保健福祉施策に対する技術的援助、精神障害者保健福祉手帳の申請に対する判定業務等を行う機関に配属された。次のうち、Ｆ精神保健福祉士が配属された機関として、正しいものを1つ選びなさい。","options":["児童相談所","障害者更生相談所","精神保健福祉センター","保健所","県立精神科病院"],"answer":[3],"subject":1,"explanation":"専門的な精神保健相談、市町村への技術的援助、精神障害者保健福祉手帳の判定などを行うのは精神保健福祉センターです。"},{"id":21,"question":"次の記述のうち、社会福祉士及び介護福祉士法における社会福祉士の業について、正しいものを1つ選びなさい。","options":["身体上又は精神上の障害があることにより日常生活を営むのに支障がある者につき心身の状況に応じた介護を行う。","福祉に関する事務所において、援護又は育成の措置に関する事務を行う。","心理に関する支援を要する者に対し、その心理に関する相談に応じ、助言、指導その他の援助を行う。","専門的知識及び技術をもって、福祉に関する相談に応じ、助言、指導、福祉サービス関係者等との連絡及び調整その他の援助を行う。","社会復帰に関する相談に応じ、助言、指導、日常生活への適応のために必要な訓練その他の援助を行う。"],"answer":[4],"subject":2,"explanation":"社会福祉士は、専門的知識と技術を用い、福祉の相談・助言・指導や関係者との連絡調整などを行う専門職です。"},{"id":22,"question":"次の記述のうち、ソロモン（Solomon, B.）が提唱したソーシャルワーク理論の説明として、正しいものを1つ選びなさい。","options":["システム理論に生態学的な視点を導入し、有機体と環境との相互作用に焦点を合わせた生活モデルを確立した。","クライエントが社会から疎外され、抑圧され、力を奪われていく構造に目を向け、無力な状態からの脱却を目指した。","心理的な側面と社会的な側面の双方を視野に入れて、クライエントを状況の中にある人間として捉えた。","実践の構成要素を示しつつ、問題解決過程が人間のもつコンピテンスの拡大に関わると主張した。","直接的因果論や客観的事実を否定し、過去を重視せず、現在・未来志向の短期的アプローチを主張した。"],"answer":[2],"subject":2,"explanation":"ソロモンはエンパワメントを論じました。社会的な抑圧によって力を奪われた状況に注目し、本人が力を取り戻すことを目指します。"},{"id":23,"question":"次のうち、ソーシャルロール・バロリゼーションを提唱した人物として、正しいものを1つ選びなさい。","options":["ニィリエ（Nirje, B.）","ビアーズ（Beers, C.）","ヴォルフェンスベルガー（Wolfensberger, W.）","ラップ（Rapp, C.）","バンク－ミケルセン（Bank-Mikkelsen, N.）"],"answer":[3],"subject":2,"explanation":"ソーシャルロール・バロリゼーションを提唱したのはヴォルフェンスベルガーです。社会的に価値のある役割を得ることを重視します。"},{"id":24,"question":"6月のある日、大学のキャンパスソーシャルワーカーであるＧ精神保健福祉士のところに、留学生のＨさん（1年生）が留学生支援センターの職員に付き添われやって来て、面接することとなった。生気のない様子のＨさんはぽろぽろ涙をこぼしながら、「日本の大学に憧れて留学したが、同級生との会話は早すぎてついて行くことができない。授業の内容があまり理解できずに困っている。アパートの隣人からはゴミの分別について強い口調で注意され悲しい気持ちになった。母国にいる家族の期待を考えると苦しくて、もうどうしたらよいか分からない」と訴えた。次の記述のうち、この面接場面においてＧ精神保健福祉士が優先すべき対応として、適切なものを1つ選びなさい。","options":["同級生への話しかけ方の練習を提案する。","授業について行けるかが心配なので一緒に考えましょうと伝える。","留学生に慣れた家主や近隣の人々がいる物件を探して転居することを勧める。","うつ気味であることを心配し、精神科クリニックへの受診を促す。","ゆっくり話を聞きつつ、Ｈさんとともに状況の整理を行う。"],"answer":[5],"subject":2,"explanation":"まず、本人の話をゆっくり聴き、一緒に困りごとを整理します。安心して話せる関係をつくり、必要な支援を考えるためです。"},{"id":25,"question":"次のうち、ソーシャルグループワークについて、コノプカ（Konopka, G.）が提唱したものとして、正しいものを1つ選びなさい。","options":["社会的諸目標モデル","社会的学習理論","相互作用モデル","課題グループ","実践における14 の原則"],"answer":[5],"subject":2,"explanation":"コノプカは、グループワーク実践の14の原則を示しました。個別化や受容、参加者の主体性などを重視します。"},{"id":26,"question":"次の記述のうち、精神保健福祉相談員に関する説明として、正しいものを1つ選びなさい。","options":["精神障害者及びその家族等その他の関係者に対する訪問指導業務を行う。","厚生労働大臣が任命する。","精神保健福祉センターや保健所その他これらに準ずる施設に必置される。","精神保健福祉士が担う場合には、3年以上の実務経験が必要となる。","「障害者総合支援法」に規定されている。"],"answer":[1],"subject":2,"note":"「障害者総合支援法」とは、「障害者の日常生活及び社会生活を総合的に支援するための法律」のことである。","explanation":"精神保健福祉相談員は、精神障害者や家族等への相談対応、訪問指導などを担います。根拠は精神保健福祉法です。"},{"id":27,"question":"次の記述のうち、精神保健福祉士が行う権利擁護の調整機能に当たるものとして、適切なものを1つ選びなさい。","options":["生活に困窮して相談支援事業所を訪れた人に、生活困窮者自立支援事業の情報を提供する。","投票に行けない人々が見過ごされていることに対して問題を提起し、選挙権を行使できるよう活動する。","市が主催するイベントや地域のお祭りの機会を通じて、広く市民に対して障害への理解促進を働きかける。","勤務日の変更を提示され通院できなくなるため退職を考えているクライエントに、合理的配慮があることを説明する。","購入したばかりの高額商品のトラブルで困っている通院患者から依頼を受けて、消費生活センターにつなぐ。"],"answer":[5],"subject":2,"explanation":"消費生活センターなど、問題に対応できる機関につなぐことが権利擁護の調整機能です。本人の依頼を受けて支援を結び付けています。"},{"id":28,"question":"Ｊさん（16歳、女性）は、母親（42歳）と祖母（75歳）の三人暮らしであった。ある日、祖母が認知症のためＵ精神科病院に入院することになった。Ｕ精神科病院のＫ精神保健福祉士は入院に当たって、母親とＪさんと面談をした。母親は離婚後、パート勤務しているが、経済状況は厳しく、二つの仕事を掛け持ちしていた。そのため、母親の帰りは遅く、Ｊさんが祖母の介護を担っていた。祖母から目を離せない時には、Ｊさんは高校を休んでおり、周りには相談できる人もいない様子であった。Ｋ精神保健福祉士は、Ｊさんにも専門的な支援が必要であると考え、Ｊさんの同意を得て関連する機関に連絡をした。次のうち、Ｋ精神保健福祉士が行った活動として、適切なものを1つ選びなさい。","options":["コーディネート","コーピング","モデリング","ブローカリング","シェイピング"],"answer":[4],"subject":2,"explanation":"ブローカリングは、必要な支援や社会資源へ本人をつなぐことです。事例では、本人の同意を得て専門的な支援機関を紹介しています。"},{"id":29,"question":"次の記述のうち、チームアプローチにおけるトランスディシプリナリ・モデルの説明として、正しいものを1つ選びなさい。","options":["職種の専門分野を超えて役割を解放し、横断的に共有を図り課題を達成する。","チームにおいて専門職として各々の役割を果たすため、独立して業務を行う。","職種間の役割を一部流動させ、チームとして複合的な課題に取り組む。","協働・連携の下で各々の役割を果たすため、専門職間の相互作用が高まる。","チーム内の専門職間に階層性が存在し、医療現場では医師が中心となる。"],"answer":[1],"subject":2,"explanation":"トランスディシプリナリ・モデルでは、専門領域の枠を超えて役割を共有します。チーム全体で本人の課題に対応します。"},{"id":30,"question":"次のうち、この活動を表すものとして、適切なものを1つ選びなさい。\n\n〔事例〕\nＬ精神保健福祉士は、精神障害者を主な利用者とする就労継続支援Ｂ型事業所で働いている。作業が終わると利用者数人が集まり、人付き合いや生活上の困りごと、夢や願いなど様々なことを互いに話し合っていた。その話し合いの場は徐々に広がりを見せ、他の事業所の利用者も加わるようになっていった。Ｌ精神保健福祉士は、その活動の代表となったＭさんから話し合いの場所について相談を受け、公民館を紹介した。しばらくの間、Ｌ精神保健福祉士が会場予約を代わりにしていたが、Ｍさんたちは集まる時間や回数、ルールなどを決め、会場予約を含めて自分たちで運営するようになっていった。そして自分たちの活動に「α」と名前を付けた。（問題30）\n\nある日、Ｌ精神保健福祉士は、市の社会福祉協議会のＡ社会福祉士から「精神障害への理解と関わり」をテーマに市民を対象とした研修会の講師を依頼された。研修会でＬ精神保健福祉士は、精神疾患の発症頻度や症状、リカバリーの考え方などについて講義した。受講者からは、「精神疾患について初めて学ぶ機会を得た」「町内に障害者の事業所があるが、ほとんど交流がない」などの感想が述べられた。そこでＬ精神保健福祉士とＡ社会福祉士は、精神障害についての理解が地域ではなかなか得られにくく、見えない壁があると考え、次は当事者にも講師を担当してもらい研修会を企画しようと話し合った。Ｌ精神保健福祉士が「α」のメンバーに相談したところ、自分たちの経験を発信する機会にしたいと賛同が得られた。「α」のメンバーとＬ精神保健福祉士は、地域への発信の内容や方法をそれぞれの立場から学び合い、皆で考え準備を進めた。（問題31）\n\n半年後に「α」のメンバーが講師に加わった新たな研修会を開いた。研修会後、受講者から、「同じ地域社会の中で共に生活している人だと感じた」「一緒に町内のイベントなど何かをやれそうに思う、やってみたい」などの感想が寄せられた。（問題32）","options":["当事者研究","リカバリーカレッジ","セルフヘルプグループ","元気回復行動プラン","ソーシャルファーム"],"answer":[3],"subject":2,"explanation":"共通する経験や悩みをもつ人が、自主的に集まり支え合うのがセルフヘルプグループです。事例では当事者自身が運営しています。"},{"id":31,"question":"次のうち、ここでのＬ精神保健福祉士の関わりを表すものとして、適切なものを1つ選びなさい。\n\n〔事例〕\nＬ精神保健福祉士は、精神障害者を主な利用者とする就労継続支援Ｂ型事業所で働いている。作業が終わると利用者数人が集まり、人付き合いや生活上の困りごと、夢や願いなど様々なことを互いに話し合っていた。その話し合いの場は徐々に広がりを見せ、他の事業所の利用者も加わるようになっていった。Ｌ精神保健福祉士は、その活動の代表となったＭさんから話し合いの場所について相談を受け、公民館を紹介した。しばらくの間、Ｌ精神保健福祉士が会場予約を代わりにしていたが、Ｍさんたちは集まる時間や回数、ルールなどを決め、会場予約を含めて自分たちで運営するようになっていった。そして自分たちの活動に「α」と名前を付けた。（問題30）\n\nある日、Ｌ精神保健福祉士は、市の社会福祉協議会のＡ社会福祉士から「精神障害への理解と関わり」をテーマに市民を対象とした研修会の講師を依頼された。研修会でＬ精神保健福祉士は、精神疾患の発症頻度や症状、リカバリーの考え方などについて講義した。受講者からは、「精神疾患について初めて学ぶ機会を得た」「町内に障害者の事業所があるが、ほとんど交流がない」などの感想が述べられた。そこでＬ精神保健福祉士とＡ社会福祉士は、精神障害についての理解が地域ではなかなか得られにくく、見えない壁があると考え、次は当事者にも講師を担当してもらい研修会を企画しようと話し合った。Ｌ精神保健福祉士が「α」のメンバーに相談したところ、自分たちの経験を発信する機会にしたいと賛同が得られた。「α」のメンバーとＬ精神保健福祉士は、地域への発信の内容や方法をそれぞれの立場から学び合い、皆で考え準備を進めた。（問題31）\n\n半年後に「α」のメンバーが講師に加わった新たな研修会を開いた。研修会後、受講者から、「同じ地域社会の中で共に生活している人だと感じた」「一緒に町内のイベントなど何かをやれそうに思う、やってみたい」などの感想が寄せられた。（問題32）","options":["ナチュラルサポート","パートナーシップ","ボランティア","コンシューマー・イニシアティブ","チャリティ"],"answer":[2],"subject":2,"explanation":"当事者と専門職が、それぞれの立場から学び合い、対等に協力する関係はパートナーシップです。"},{"id":32,"question":"次のうち、Ｌ精神保健福祉士の一連の関わりの背景にある理念として、適切なものを2つ選びなさい。\n\n〔事例〕\nＬ精神保健福祉士は、精神障害者を主な利用者とする就労継続支援Ｂ型事業所で働いている。作業が終わると利用者数人が集まり、人付き合いや生活上の困りごと、夢や願いなど様々なことを互いに話し合っていた。その話し合いの場は徐々に広がりを見せ、他の事業所の利用者も加わるようになっていった。Ｌ精神保健福祉士は、その活動の代表となったＭさんから話し合いの場所について相談を受け、公民館を紹介した。しばらくの間、Ｌ精神保健福祉士が会場予約を代わりにしていたが、Ｍさんたちは集まる時間や回数、ルールなどを決め、会場予約を含めて自分たちで運営するようになっていった。そして自分たちの活動に「α」と名前を付けた。（問題30）\n\nある日、Ｌ精神保健福祉士は、市の社会福祉協議会のＡ社会福祉士から「精神障害への理解と関わり」をテーマに市民を対象とした研修会の講師を依頼された。研修会でＬ精神保健福祉士は、精神疾患の発症頻度や症状、リカバリーの考え方などについて講義した。受講者からは、「精神疾患について初めて学ぶ機会を得た」「町内に障害者の事業所があるが、ほとんど交流がない」などの感想が述べられた。そこでＬ精神保健福祉士とＡ社会福祉士は、精神障害についての理解が地域ではなかなか得られにくく、見えない壁があると考え、次は当事者にも講師を担当してもらい研修会を企画しようと話し合った。Ｌ精神保健福祉士が「α」のメンバーに相談したところ、自分たちの経験を発信する機会にしたいと賛同が得られた。「α」のメンバーとＬ精神保健福祉士は、地域への発信の内容や方法をそれぞれの立場から学び合い、皆で考え準備を進めた。（問題31）\n\n半年後に「α」のメンバーが講師に加わった新たな研修会を開いた。研修会後、受講者から、「同じ地域社会の中で共に生活している人だと感じた」「一緒に町内のイベントなど何かをやれそうに思う、やってみたい」などの感想が寄せられた。（問題32）","options":["ソーシャルインクルージョンの実現","メインストリーミングの保障","インテグレーションの確立","バリアフリーの推進","アクセシビリティの向上"],"answer":[1,4],"subject":2,"explanation":"地域で共に暮らす仲間として受け入れるソーシャルインクルージョンと、偏見などの見えない壁をなくすバリアフリーが背景にあります。"},{"id":33,"question":"次のうち、バイオサイコソーシャルモデルの視点でＢワーカーが着目したこととして、適切なものを1つ選びなさい。\n\n〔事例〕\n精神科クリニックで働くＢ精神保健福祉士（以下「Ｂワーカー」という。）は、中学の養護教諭からの紹介で、嫌なことがあるとリストカットするというＣさん（15歳、女性）のインテーク面接を行った。当日母親が付き添っていたが、はじめにＣさんから話を聞いた。Ｂワーカーがバイオサイコソーシャルモデルにのっとって話を聞く中で、Ｃさんはクラスの誰とも付き合いがなく、休み時間も机に伏していることや、摂食障害の傾向もあることが分かってきた。親については、「父親はいつも酔っている。母親は怒ってばかりなので何も話していない。今日も理由が何か分からずに来ている」と言う。ＢワーカーはＣさんが話してくれたことをねぎらい、医師の診察につなげた。（問題33）\n\n診察後、医師とＢワーカーは、Ｃさんにことわって、母親に状況を話した。母親は驚き、「夫のことで頭が一杯で気が付かなかった。夫は毎晩深酒しては、Ｃの成績や反抗的態度について私を責めるんです。だからついＣには厳しくしてしまって。Ｃが身体を傷つけたり、無理に食べて吐いたりするのをすぐにやめさせます」と言う。Ｂワーカーは、「急いでＣさんの行動をやめさせようとせず、まずＣさんの思いを聞きましょう」と伝えた。Ｃさんの通院が始まり、Ｂワーカーは、母親に対してＣさんへの対応を話し合うだけでよいのか気になったため、職能団体が実施するスーパービジョンを受けた。スーパーバイザーからは家族をシステムとして理解すること、母親もクライエントであるという視点をもつこと等の助言を得た。Ｂワーカーは母親のニーズと共に、親子3人の関係性からＣさんの問題を考え始めた。（問題34）\n\nＢワーカーはＣさんの話を聞くように努め始めた母親を称賛しつつ、母親のニーズを明確にしていった。そして母親に更なる気づきを促すために、「他の家族からも学びましょう」と保健所主催のアルコール問題を理解するための家族教室への参加を勧めた。（問題35）","options":["問題を親には言わずに抱えてきたＣさんの強さ","自傷行為や摂食障害に見られるＣさんの病理","学校でも家でも孤立し無力化しているＣさんの状態","母親が怒ってばかりの家庭に育ってきたというＣさんの物語","Ｃさんの心身の状態と学校や家庭での状態との相互関連性"],"answer":[5],"subject":2,"explanation":"バイオサイコソーシャルモデルは、生物・心理・社会の側面を関連づけて理解します。本人の心身と学校・家庭の状況との相互作用に注目します。"},{"id":34,"question":"次のうち、Ｂワーカーが受けたスーパービジョンの効果として、適切なものを1つ選びなさい。\n\n〔事例〕\n精神科クリニックで働くＢ精神保健福祉士（以下「Ｂワーカー」という。）は、中学の養護教諭からの紹介で、嫌なことがあるとリストカットするというＣさん（15歳、女性）のインテーク面接を行った。当日母親が付き添っていたが、はじめにＣさんから話を聞いた。Ｂワーカーがバイオサイコソーシャルモデルにのっとって話を聞く中で、Ｃさんはクラスの誰とも付き合いがなく、休み時間も机に伏していることや、摂食障害の傾向もあることが分かってきた。親については、「父親はいつも酔っている。母親は怒ってばかりなので何も話していない。今日も理由が何か分からずに来ている」と言う。ＢワーカーはＣさんが話してくれたことをねぎらい、医師の診察につなげた。（問題33）\n\n診察後、医師とＢワーカーは、Ｃさんにことわって、母親に状況を話した。母親は驚き、「夫のことで頭が一杯で気が付かなかった。夫は毎晩深酒しては、Ｃの成績や反抗的態度について私を責めるんです。だからついＣには厳しくしてしまって。Ｃが身体を傷つけたり、無理に食べて吐いたりするのをすぐにやめさせます」と言う。Ｂワーカーは、「急いでＣさんの行動をやめさせようとせず、まずＣさんの思いを聞きましょう」と伝えた。Ｃさんの通院が始まり、Ｂワーカーは、母親に対してＣさんへの対応を話し合うだけでよいのか気になったため、職能団体が実施するスーパービジョンを受けた。スーパーバイザーからは家族をシステムとして理解すること、母親もクライエントであるという視点をもつこと等の助言を得た。Ｂワーカーは母親のニーズと共に、親子3人の関係性からＣさんの問題を考え始めた。（問題34）\n\nＢワーカーはＣさんの話を聞くように努め始めた母親を称賛しつつ、母親のニーズを明確にしていった。そして母親に更なる気づきを促すために、「他の家族からも学びましょう」と保健所主催のアルコール問題を理解するための家族教室への参加を勧めた。（問題35）","options":["業務の枠組みの明確化","アセスメント能力の向上","個人的な課題についての自己洞察","バーンアウトの防止","業務の遂行状況の明確化"],"answer":[2],"subject":2,"explanation":"家族全体の関係や母親のニーズも捉えられるようになっています。状況を多面的に理解するアセスメント能力が高まったといえます。"},{"id":35,"question":"次の記述のうち、母親に保健所主催の家族教室を紹介した目的として、適切なものを1つ選びなさい。\n\n〔事例〕\n精神科クリニックで働くＢ精神保健福祉士（以下「Ｂワーカー」という。）は、中学の養護教諭からの紹介で、嫌なことがあるとリストカットするというＣさん（15歳、女性）のインテーク面接を行った。当日母親が付き添っていたが、はじめにＣさんから話を聞いた。Ｂワーカーがバイオサイコソーシャルモデルにのっとって話を聞く中で、Ｃさんはクラスの誰とも付き合いがなく、休み時間も机に伏していることや、摂食障害の傾向もあることが分かってきた。親については、「父親はいつも酔っている。母親は怒ってばかりなので何も話していない。今日も理由が何か分からずに来ている」と言う。ＢワーカーはＣさんが話してくれたことをねぎらい、医師の診察につなげた。（問題33）\n\n診察後、医師とＢワーカーは、Ｃさんにことわって、母親に状況を話した。母親は驚き、「夫のことで頭が一杯で気が付かなかった。夫は毎晩深酒しては、Ｃの成績や反抗的態度について私を責めるんです。だからついＣには厳しくしてしまって。Ｃが身体を傷つけたり、無理に食べて吐いたりするのをすぐにやめさせます」と言う。Ｂワーカーは、「急いでＣさんの行動をやめさせようとせず、まずＣさんの思いを聞きましょう」と伝えた。Ｃさんの通院が始まり、Ｂワーカーは、母親に対してＣさんへの対応を話し合うだけでよいのか気になったため、職能団体が実施するスーパービジョンを受けた。スーパーバイザーからは家族をシステムとして理解すること、母親もクライエントであるという視点をもつこと等の助言を得た。Ｂワーカーは母親のニーズと共に、親子3人の関係性からＣさんの問題を考え始めた。（問題34）\n\nＢワーカーはＣさんの話を聞くように努め始めた母親を称賛しつつ、母親のニーズを明確にしていった。そして母親に更なる気づきを促すために、「他の家族からも学びましょう」と保健所主催のアルコール問題を理解するための家族教室への参加を勧めた。（問題35）","options":["父親の飲酒による攻撃的な行動から母親とＣさんが避難するため。","父親の飲酒問題への母親の誤った対応を直ちにやめてもらうため。","父親が酒を飲む理由を排除するため。","父親を同伴し飲酒問題を解決してもらうため。","父親の飲酒問題が母親とＣさんにどう影響するかを理解してもらうため。"],"answer":[5],"subject":2,"explanation":"家族教室では、飲酒問題が家族に与える影響を学びます。母親や娘も支援を必要とする存在であることへの理解につながります。"},{"id":36,"question":"次の記述のうち、諸外国における精神保健医療福祉の歴史に関する内容として、正しいものを1つ選びなさい。","options":["ニュージーランドでは、自発的入院を認めた「法律第431 号」が成立した。","アメリカでは、精神保健サービスの基準を示す「ルッキング・フォワード」が公表された。","イタリアでは、公立精神科病院を解体する「精神疾患および知的障害者に関する大統領教書」が公表された。","フランスでは、精神保健政策を示した「ついに闇からの脱出」が公表された。","イギリスでは、ケアマネジメントを導入する「国民保健サービス及びコミュニティケア法」が成立した。"],"answer":[5],"subject":3,"explanation":"イギリスでは、1990年の国民保健サービス及びコミュニティケア法により、ケアマネジメントの導入が進められました。"},{"id":37,"question":"次のうち、2022年（令和4年）の精神保健福祉士法改正により、新たに規定された精神保健福祉士の業として、正しいものを1つ選びなさい。","options":["社会復帰に関する相談","地域相談支援の利用に関する相談","精神保健に関する課題を抱える者の精神保健に関する相談","医師その他の保健医療サービスを提供する者との連絡及び調整","応用的動作能力又は社会的適応能力の回復を図るための作業活動"],"answer":[3],"subject":3,"explanation":"2022年の法改正で、精神障害者に加え、精神保健に関する課題を抱える人への相談援助が精神保健福祉士の業務に明記されました。"},{"id":38,"question":"次の記述のうち、レジリエンス（resilience）の説明として、正しいものを1つ選びなさい。","options":["自己決定能力を高め、自己を主張し、生きていく力を発揮すること。","社会に完全かつ効果的に参加し、受け入れられていること。","病気自体は治っていなくても、人生における新しい意味と目的を発展させること。","困難な状況に耐え、やがて立ち直る力を本来的に有していること。","全ての人を社会の構成員として包み込むこと。"],"answer":[4],"subject":3,"explanation":"レジリエンスは、困難や逆境に直面しても、適応し、立ち直っていく力です。"},{"id":39,"question":"次のうち、国連総会で採択された「精神疾患を有する者の保護及びメンタルヘルスケアの改善のための諸原則」（1991年）の内容として、正しいものを2つ選びなさい。","options":["入院原則として、精神保健施設へのアクセスは他の疾患とは異なる方法で行われる。","患者の精神状態により、インフォームド・コンセントの権利を放棄するように求めたり、また放棄を勧めたりすることができる。","精神疾患を有するとの判定は、各国が独自に認めた医学的基準に即して行われるものとする。","不妊手術は、精神疾患の治療として、決してこれを行わないものとする。","すべての人は、可能な最善のメンタルヘルスケアを受ける権利を有する。"],"answer":[4,5],"subject":3,"note":"「精神疾患を有する者の保護及びメンタルヘルスケアの改善のための諸原則」の日本語訳は、厚生科学研究班の仮訳によるものである。","explanation":"1991年の国連原則は、最善のメンタルヘルスケアを受ける権利を示しています。また、精神疾患の治療としての不妊手術を認めていません。"},{"id":40,"question":"次の記述のうち、ＩＭＲ（疾病管理とリカバリー）のプログラムの説明として、正しいものを1つ選びなさい。","options":["物質依存症の人々のために開発された。","ストレス－脆弱性モデルを病気の自己管理の基礎としている。","家族と支援者は関与しないことが推奨されている。","個々のニーズに応じてオーダーメイドされた内容で構成される。","精神疾患の一次予防を目的としている。"],"answer":[2],"subject":3,"explanation":"IMRは、ストレス－脆弱性モデルを基礎に、病気の自己管理と本人のリカバリーを支えるプログラムです。"},{"id":41,"question":"Ｄさん（30歳）は半年前に精神科病院を退院し、週3日アルバイトを行い、1日は精神科デイ・ケアを利用している。病状は落ち着いており、デイケアには時間に遅れずにやって来て、メンバーとレクリエーションを楽しんでいた。ところが、Ｄさんがデイケアを休むことが続いたので、心配した担当の精神保健福祉士が電話をした。Ｄさんは、「メンバーからカラオケ店に頻繁に誘われるようになった。疲れるので行きたくないが、相手の気分を害するのではないかと思うと断れない」と話した。話を聞いた精神保健福祉士は、Ｄさんにデイケアの新たなプログラムへの参加を提案した。次のうち、精神保健福祉士がＤさんに提案したプログラムの目的として、適切なものを1つ選びなさい。","options":["正規雇用の仕事に就く準備","服薬の自己管理","生活リズムの改善","ソーシャルスキルの獲得","疾病や障害の正しい知識の学習"],"answer":[4],"subject":3,"explanation":"事例の困りごとは、誘いをうまく断れないことです。相手に配慮しながら自分の気持ちを伝えるなど、ソーシャルスキルの練習が役立ちます。"},{"id":42,"question":"次の記述のうち、精神科医療機関における退院に向けたチームアプローチの説明として、適切なものを2つ選びなさい。","options":["構成員同士の良好な関係性を保つため、率直な意見表明は控える。","利用者の意向を尊重するため、利用者参加を原則とする。","多様なニーズに対応するため、構成員の役割分担を明確化する。","構成員の対等性を重視するため、チームリーダーは見守りに徹する。","秘密保持を厳守するため、日常的なコミュニケーションは控える。"],"answer":[2,3],"subject":3,"explanation":"退院支援では、本人の参加と意向の尊重が基本です。多様なニーズに対応できるよう、チーム内の役割分担も明確にします。"},{"id":43,"question":"次の記述のうち、社会リハビリテーションにおけるアセスメントとして、正しいものを1つ選びなさい。","options":["地域移行に向けた外泊訓練の効果について検証する。","利用可能な福祉サービス事業所の状況を把握する。","一人暮らしに向けた支援体制をつくる。","新たなニーズが生じた際に支援できるよう地域のネットワークを確認する。","精神障害者保健福祉手帳取得で活用できるサービスの拡充を検討する。"],"answer":[2],"subject":3,"explanation":"アセスメントでは、本人の状態に加え、利用できる事業所などの社会資源の情報を集めて把握します。"},{"id":44,"question":"次の記述のうち、生活場面面接の特徴として、適切なものを2つ選びなさい。","options":["プライバシーに配慮して、匿名性を保ちながら行う。","クライエントの認知を改善し、行動を変容させる。","クライエントが、比較的リラックスした状態で話せる。","自宅や入所施設の自室、入院中の病室などで行う。","クライエントの生活困難課題を取り上げて、実際に再現してみる。"],"answer":[3,4],"subject":3,"explanation":"生活場面面接は、自宅や病室など、本人が生活する場所で行います。本人が比較的リラックスして話しやすいことが特徴です。"},{"id":45,"question":"次のうち、統合失調症の再発率を高めるとされる家族の状況として、適切なものを1つ選びなさい。","options":["共依存","イネイブリング","高い感情表出","投影性同一視","逆転移"],"answer":[3],"subject":3,"explanation":"批判的な言動、敵意、過度な情緒的巻き込まれなどの高い感情表出は、再発と関連します。家族を責めず、家族自身への支援も大切です。"},{"id":46,"question":"統合失調症の娘をもつＥさん（70歳、女性）は10年前より家族相談員として活動している。ある日の相談会に、Ｆさん（45歳、女性）が初めて相談に訪れ、「息子が病気になったのは親のせいなのでしょうか」と沈鬱な表情で話した。Ｅさんは、「私も娘が病気になった頃は自分を責めてばかりでした」と話すと、Ｆさんは、「Ｅさんもそうだったのですか」と言い、涙を流した。その後Ｆさんは度々相談会に訪れ、半年経った頃には、「自分を責めてもしょうがないですね。自分の人生を楽しんでもいいですよね」と笑顔で話すようになった。ＥさんはＦさんの変化に励まされ、相談員の活動にやりがいを感じた。次のうち、家族相談員の活動を通して、Ｅさんにもたらされたことを示す概念として、適切なものを1つ選びなさい。","options":["ピア・アドボケイト","カタルシス","ヘルパー・セラピー原理","バウンダリー","リフレーミング"],"answer":[3],"subject":3,"explanation":"ヘルパー・セラピー原理は、他者を援助する人自身も、その経験から力や充実感を得るという考え方です。"},{"id":47,"question":"精神科病院に入職して4か月たつＧ精神保健福祉士（22歳）は、入職8年目のＨ精神保健福祉士から、定期的にスーパービジョンを受けている。今日は、Ｈ精神保健福祉士が、Ｇ精神保健福祉士と入院患者との面接に同席した。面接が終わると、2人は相談室に戻り、振り返りを行った。Ｈ精神保健福祉士は、「よいタイミングで相づちを入れて話を引き出していましたね」と話した。Ｇ精神保健福祉士は、「次の話題へどのように進めればいいのか迷いました。あれでよかったのでしょうか」とＨ精神保健福祉士に話した。そこで、Ｈ精神保健福祉士は気づきを促した。次のうち、この場面で行われたスーパービジョンの形態に関する説明として、正しいものを1つ選びなさい。","options":["ピア・スーパービジョン","ライブ・スーパービジョン","セルフ・スーパービジョン","ユニット・スーパービジョン","グループ・スーパービジョン"],"answer":[2],"subject":3,"explanation":"実際の面接にスーパーバイザーが同席し、その場面をもとに指導するのはライブ・スーパービジョンです。"},{"id":48,"question":"Ｊさん（55歳）は、精神科病院を退院後、地域活動支援センターを利用しながら在宅生活を継続している。最近、健康診断を受けた結果、専門病院の受診を勧められ、初期の大腸がんが見つかった。地域活動支援センターのＫ精神保健福祉士は、Ｊさんの同意を得た後、がん治療を担当する主治医から、「治療をしていく中で、腹痛や嘔吐、血便、便秘などが出現することが予想されるため、支援を行う際は体調に気を付けて欲しい」との情報を得た。そこで、個別支援に反映させていくこととした。次のうち、Ｋ精神保健福祉士と主治医との間で行われたこととして、適切なものを1つ選びなさい。","options":["アサーション","フィードバック","スクリーニング","カンファレンス","コンサルテーション"],"answer":[5],"subject":3,"explanation":"別の専門職から、支援に必要な専門的助言を得ることはコンサルテーションです。事例では医師の情報を個別支援に生かしています。"},{"id":49,"question":"次のうち、この時のＬさんに対するＡさんの役割を表すものとして、正しいものを1つ選びなさい。\n\n〔事例〕\nＬさん（41歳、男性）は、20代で統合失調症と診断され、服薬を中断して体調を崩しては入退院を繰り返し、今回の入院となった。なかなか病状が安定しなかったが、入院して1年が過ぎ安定してきた。病棟担当の精神保健福祉士は、Ｌさんから、「両親とも70代で体調が悪いので、もう負担はかけられない。一人暮らしをして自立したいが、これまで家事は母親に任せきりだったため、いざ一人暮らしを考えると不安がある」と聞いた。そこで、地域移行支援を紹介し、利用することになった。後日、相談支援事業所のＭ精神保健福祉士とピアサポーターのＡさんがＬさんの元を訪れた。Ａさんは、「僕も退院が不安だったけど、いろいろな助けを借りて一人暮らしができているし、好きなことに打ち込めて楽しいよ」と話し、自身の生活や利用しているサービスについて説明した。（問題49）\n\nＬさんは、「両親が貯めてくれたお金があるので、しばらくは生活の心配はないと思う」「Ａさんのように一人暮らしを継続し、再入院しないで、好きな鉄道を自由に見に行きたい」「自炊したいし、家事や生活費のやりくりも頑張りたいが、自信がない」「ささいなことが心配になるので、相談できる場所があると助かる」と話した。Ｍ精神保健福祉士は、Ｌさんの思いを受け止め、地域移行支援計画案を作成した。（問題50）\n\nＬさんは、ＡさんやＭ精神保健福祉士の支援を受けて退院し、引き続き地域定着支援を受けながら一人暮らしを始めた。そして、地域活動支援センターのＢ精神保健福祉士の支援を受けながら、フリースペースの利用や毎日の夕食会に参加し始めた。さらに、居宅介護による掃除の支援や訪問看護を利用して生活に慣れていった。しかし、ほどなくしてフリースペースや夕食会に顔を見せなくなった。Ｂ精神保健福祉士は、Ｍ精神保健福祉士と訪問看護師にこのことを話し、訪問看護時に一緒にＬさん宅を訪れた。Ｌさんは、「夕食会で話の合う人がいないので居づらく、行けなくなってしまった。そのことに悩んだり、夕食作りなど家事を頑張ったので疲れてしまった。今は寝てばかりいて、家にひきこもっている。このままだとまた入院になってしまうのでしょうか」と話した。そこでケア会議が開催された。（問題51）","options":["セカンドオピニオン","アドボケーター","メディエーター","エデュケーター","ロールモデル"],"answer":[5],"subject":3,"explanation":"自分の経験を示して、これからの生活の参考になる存在はロールモデルです。ピアサポーターの暮らしが本人の希望につながっています。"},{"id":50,"question":"次の記述のうち、この計画案の内容として、適切なものを1つ選びなさい。\n\n〔事例〕\nＬさん（41歳、男性）は、20代で統合失調症と診断され、服薬を中断して体調を崩しては入退院を繰り返し、今回の入院となった。なかなか病状が安定しなかったが、入院して1年が過ぎ安定してきた。病棟担当の精神保健福祉士は、Ｌさんから、「両親とも70代で体調が悪いので、もう負担はかけられない。一人暮らしをして自立したいが、これまで家事は母親に任せきりだったため、いざ一人暮らしを考えると不安がある」と聞いた。そこで、地域移行支援を紹介し、利用することになった。後日、相談支援事業所のＭ精神保健福祉士とピアサポーターのＡさんがＬさんの元を訪れた。Ａさんは、「僕も退院が不安だったけど、いろいろな助けを借りて一人暮らしができているし、好きなことに打ち込めて楽しいよ」と話し、自身の生活や利用しているサービスについて説明した。（問題49）\n\nＬさんは、「両親が貯めてくれたお金があるので、しばらくは生活の心配はないと思う」「Ａさんのように一人暮らしを継続し、再入院しないで、好きな鉄道を自由に見に行きたい」「自炊したいし、家事や生活費のやりくりも頑張りたいが、自信がない」「ささいなことが心配になるので、相談できる場所があると助かる」と話した。Ｍ精神保健福祉士は、Ｌさんの思いを受け止め、地域移行支援計画案を作成した。（問題50）\n\nＬさんは、ＡさんやＭ精神保健福祉士の支援を受けて退院し、引き続き地域定着支援を受けながら一人暮らしを始めた。そして、地域活動支援センターのＢ精神保健福祉士の支援を受けながら、フリースペースの利用や毎日の夕食会に参加し始めた。さらに、居宅介護による掃除の支援や訪問看護を利用して生活に慣れていった。しかし、ほどなくしてフリースペースや夕食会に顔を見せなくなった。Ｂ精神保健福祉士は、Ｍ精神保健福祉士と訪問看護師にこのことを話し、訪問看護時に一緒にＬさん宅を訪れた。Ｌさんは、「夕食会で話の合う人がいないので居づらく、行けなくなってしまった。そのことに悩んだり、夕食作りなど家事を頑張ったので疲れてしまった。今は寝てばかりいて、家にひきこもっている。このままだとまた入院になってしまうのでしょうか」と話した。そこでケア会議が開催された。（問題51）","options":["服薬の自己管理をするために、心理教育プログラムに参加する。","生活費を自己管理するために、生活困窮者家計改善支援事業を利用する。","料理や掃除、洗濯が一人でできるようになるために、退院まで1年かけて練習する。","心配を軽減するために、アサーション・トレーニングを行う。","一人暮らしをするために、Ａさんにアパート探しを依頼する。"],"answer":[1],"subject":3,"explanation":"服薬中断による再入院を繰り返しているため、心理教育を通じて病気や服薬を理解し、自己管理を支えることが適切です。"},{"id":51,"question":"次の記述のうち、この時のケア会議の参加者がＬさんに話したこととして、適切なものを2つ選びなさい。\n\n〔事例〕\nＬさん（41歳、男性）は、20代で統合失調症と診断され、服薬を中断して体調を崩しては入退院を繰り返し、今回の入院となった。なかなか病状が安定しなかったが、入院して1年が過ぎ安定してきた。病棟担当の精神保健福祉士は、Ｌさんから、「両親とも70代で体調が悪いので、もう負担はかけられない。一人暮らしをして自立したいが、これまで家事は母親に任せきりだったため、いざ一人暮らしを考えると不安がある」と聞いた。そこで、地域移行支援を紹介し、利用することになった。後日、相談支援事業所のＭ精神保健福祉士とピアサポーターのＡさんがＬさんの元を訪れた。Ａさんは、「僕も退院が不安だったけど、いろいろな助けを借りて一人暮らしができているし、好きなことに打ち込めて楽しいよ」と話し、自身の生活や利用しているサービスについて説明した。（問題49）\n\nＬさんは、「両親が貯めてくれたお金があるので、しばらくは生活の心配はないと思う」「Ａさんのように一人暮らしを継続し、再入院しないで、好きな鉄道を自由に見に行きたい」「自炊したいし、家事や生活費のやりくりも頑張りたいが、自信がない」「ささいなことが心配になるので、相談できる場所があると助かる」と話した。Ｍ精神保健福祉士は、Ｌさんの思いを受け止め、地域移行支援計画案を作成した。（問題50）\n\nＬさんは、ＡさんやＭ精神保健福祉士の支援を受けて退院し、引き続き地域定着支援を受けながら一人暮らしを始めた。そして、地域活動支援センターのＢ精神保健福祉士の支援を受けながら、フリースペースの利用や毎日の夕食会に参加し始めた。さらに、居宅介護による掃除の支援や訪問看護を利用して生活に慣れていった。しかし、ほどなくしてフリースペースや夕食会に顔を見せなくなった。Ｂ精神保健福祉士は、Ｍ精神保健福祉士と訪問看護師にこのことを話し、訪問看護時に一緒にＬさん宅を訪れた。Ｌさんは、「夕食会で話の合う人がいないので居づらく、行けなくなってしまった。そのことに悩んだり、夕食作りなど家事を頑張ったので疲れてしまった。今は寝てばかりいて、家にひきこもっている。このままだとまた入院になってしまうのでしょうか」と話した。そこでケア会議が開催された。（問題51）","options":["訪問看護師：「生活リズムを立て直すために、入院を考えてみませんか」","Ｂ精神保健福祉士：「鉄道好きなメンバーがいるので、声を掛けてみましょうか」","Ｍ精神保健福祉士：「無理せず、ご実家で暮らすようにしますか」","ホームヘルパー：「家事ができるようになったので、もう少し頑張ると楽になりますよ」","Ａさん：「一緒に夕食のお惣菜を買いに行きませんか」"],"answer":[2,5],"subject":3,"explanation":"本人の鉄道への関心を生かした仲間づくりと、惣菜の購入による家事負担の軽減が適切です。地域生活を続けるための支援を調整します。"},{"id":52,"question":"次のうち、この時のＣさんに対するＤ精神保健福祉士が用いたアプローチとして、正しいものを1つ選びなさい。\n\n〔事例〕\nＣさん（45歳、女性）は、20歳の時に母親を亡くし、その後は父親と二人で暮らしてきた。35歳で統合失調症を発症し、入退院を繰り返したが、最近はデイケアに通いながら父親と家事を分担し、安定した生活を送っていた。ところが、父親が脳梗塞で倒れ、しばらく入院することになった。Ｃさん 福祉士は精神障害者保健福祉手帳の取得を支援した。そして、Ｖ就労移行支援事業所をＥさんに紹介し、利用できるよう支援した。（問題55）\n\nＶ就労移行支援事業所のＧ精神保健福祉士は、Ｅさんの訓練の様子を見て、地域のイベントで顔見知りになったＷ社の社長が頭に浮かんだ。そこで、Ｗ社に雇用の可能性について問い合わせたところ、「Ｅさんに合った仕事があるか分からない」とのことであった。（問題56）\n\nその後、ＥさんはＷ社において事務の仕事で職場実習を開始した。実習5日目に、Ｗ社の担当者からＧ精神保健福祉士に、「話があるので来て欲しい」と電話があった。Ｇ精神保健福祉士が訪問したところ、担当者は、「Ｅさんに何度も手順の間違いを指摘したが、同じ失敗を繰り返す」「何かあれば相談するよう伝えていたのに、今日は無断で遅刻した」「このままだと実習継続は厳しい」と話した。一方、Ｅさんは、「社員から何を注意されたか分からず、とても疲れた。今朝起きたら始業時間を過ぎていたので急いで来たが、実習を始めさせてもらえない」と話した。Ｇ精神保健福祉士は、担当者にＥさんの対応について助言した。（問題57）\n\nＧ精神保健福祉士のサポートによりＥさんの職場実習は順調に進み、Ｗ社はＥさんの雇用について前向きに検討し始めた。","options":["「遅刻した時は、理由を聞かずそっとしておきましょう」","「作業手順書を作成し、Ｅさんに渡してはどうでしょうか」","「発注データの確認作業を担当させることを検討しませんか」","「同じ部署の社員と仲良くなる機会を設けましょう」","「仕事に慣れるために、実習時間を増やしてみませんか」"],"answer":[2,3],"subject":3,"explanation":"視覚的に確認できる手順書を用意し、正確さや集中力を生かせる仕事を検討します。本人の特性に合わせた環境調整が大切です。"},{"id":58,"question":"次のうち、この後にＨ精神保健福祉士が行うこととして、適切なものを1つ選びなさい。\n\n〔事例〕\nＱ市障害福祉課に勤務するＨ精神保健福祉士に、地域包括支援センターの主任ケアマネジャーから電話があり、「ホームヘルパーから、『訪問に行くと、同居する子が部屋から出て来ないし外出もしないと言われ、その対応の仕方が分からない』と相談されて困っている」とのことだった。Ｈ精神保健福祉士は、その話を聞きながら、新型コロナウイルス感染症拡大の影響もあり、Ｑ市には同様のひきこもり課題を抱える事例が他にもあるのではないかと思った。（問題58）\n\nＱ市におけるひきこもりの事例では、「退職」や「新型コロナウイルス感染症」をきっかけとするものが目立ち、ひきこもり期間は「2年から3年未満」が多かった。Ｈ精神保健福祉士はのちに開催された「協議会」において現状を報告し、ひきこもり問題に対応するため、専門部会の立ち上げを提案して、承諾された。その後、保健所、基幹相談支援センター、ひきこもり地域支援センター、ひきこもり支援をしているＮＰＯ法人、Ｑ市社会福祉協議会、地域包括支援センターが集まり、第一回の専門部会を開催することとなった。専門部会ではＨ精神保健福祉士がＱ市の現状報告後、ファシリテーターとなり、参加者に支援の悩みやひきこもっている人のメンタルヘルスに関連する課題等について自由に意見を出し合ってもらった。意見としては、「女性のひきこもっている人の増加が目立ち始め、このままだと長期化し、メンタルヘルス問題の悪化が懸念される」こと、「それまであった人間関係も疎遠になって家族以外と会話していない」こと、「親を介護しながら扶養されている」こと、「自分の先行きが不安になって不眠に陥っている」こと等が挙がった。（問題59）\n\n数回にわたる専門部会のまとめとして、「女性の増加が目立ち、彼女たちは、もう一度誰かとつながりたいという気持ちがあるがなかなか自分からは行動しにくいようだ」ということで意見が一致した。そして、専門部会は新たな取組の提案と報告を行い、それを受けたＱ市は提案に基づく取組を行うこととした。（問題60）","options":["ソーシャルネットワーク","ソーシャルワークリサーチ","ソーシャルサポート","ソーシャルキャピタル","ソーシャルグループワーク"],"answer":[2],"subject":3,"explanation":"地域に同様の課題がどれほどあるかを調べ、支援の根拠を得る活動はソーシャルワークリサーチです。","note":"「協議会」とは、「障害者の日常生活及び社会生活を総合的に支援するための法律」に基づき行われる協議会のことである。"},{"id":59,"question":"次のうち、この時点でＨ精神保健福祉士がファシリテーターとなり、参加者と共に行ったこととして、正しいものを1つ選びなさい。\n\n〔事例〕\nＱ市障害福祉課に勤務するＨ精神保健福祉士に、地域包括支援センターの主任ケアマネジャーから電話があり、「ホームヘルパーから、『訪問に行くと、同居する子が部屋から出て来ないし外出もしないと言われ、その対応の仕方が分からない』と相談されて困っている」とのことだった。Ｈ精神保健福祉士は、その話を聞きながら、新型コロナウイルス感染症拡大の影響もあり、Ｑ市には同様のひきこもり課題を抱える事例が他にもあるのではないかと思った。（問題58）\n\nＱ市におけるひきこもりの事例では、「退職」や「新型コロナウイルス感染症」をきっかけとするものが目立ち、ひきこもり期間は「2年から3年未満」が多かった。Ｈ精神保健福祉士はのちに開催された「協議会」において現状を報告し、ひきこもり問題に対応するため、専門部会の立ち上げを提案して、承諾された。その後、保健所、基幹相談支援センター、ひきこもり地域支援センター、ひきこもり支援をしているＮＰＯ法人、Ｑ市社会福祉協議会、地域包括支援センターが集まり、第一回の専門部会を開催することとなった。専門部会ではＨ精神保健福祉士がＱ市の現状報告後、ファシリテーターとなり、参加者に支援の悩みやひきこもっている人のメンタルヘルスに関連する課題等について自由に意見を出し合ってもらった。意見としては、「女性のひきこもっている人の増加が目立ち始め、このままだと長期化し、メンタルヘルス問題の悪化が懸念される」こと、「それまであった人間関係も疎遠になって家族以外と会話していない」こと、「親を介護しながら扶養されている」こと、「自分の先行きが不安になって不眠に陥っている」こと等が挙がった。（問題59）\n\n数回にわたる専門部会のまとめとして、「女性の増加が目立ち、彼女たちは、もう一度誰かとつながりたいという気持ちがあるがなかなか自分からは行動しにくいようだ」ということで意見が一致した。そして、専門部会は新たな取組の提案と報告を行い、それを受けたＱ市は提案に基づく取組を行うこととした。（問題60）","options":["傾聴","参与観察","ＫＪ法","ブレインストーミング","ディベート"],"answer":[4],"subject":3,"explanation":"参加者が自由に意見やアイデアを出し合う方法はブレインストーミングです。まず多様な考えを集めることを重視します。","note":"「協議会」とは、「障害者の日常生活及び社会生活を総合的に支援するための法律」に基づき行われる協議会のことである。"},{"id":60,"question":"次の記述のうち、Ｑ市の新たな取組として、適切なものを1つ選びなさい。\n\n〔事例〕\nＱ市障害福祉課に勤務するＨ精神保健福祉士に、地域包括支援センターの主任ケアマネジャーから電話があり、「ホームヘルパーから、『訪問に行くと、同居する子が部屋から出て来ないし外出もしないと言われ、その対応の仕方が分からない』と相談されて困っている」とのことだった。Ｈ精神保健福祉士は、その話を聞きながら、新型コロナウイルス感染症拡大の影響もあり、Ｑ市には同様のひきこもり課題を抱える事例が他にもあるのではないかと思った。（問題58）\n\nＱ市におけるひきこもりの事例では、「退職」や「新型コロナウイルス感染症」をきっかけとするものが目立ち、ひきこもり期間は「2年から3年未満」が多かった。Ｈ精神保健福祉士はのちに開催された「協議会」において現状を報告し、ひきこもり問題に対応するため、専門部会の立ち上げを提案して、承諾された。その後、保健所、基幹相談支援センター、ひきこもり地域支援センター、ひきこもり支援をしているＮＰＯ法人、Ｑ市社会福祉協議会、地域包括支援センターが集まり、第一回の専門部会を開催することとなった。専門部会ではＨ精神保健福祉士がＱ市の現状報告後、ファシリテーターとなり、参加者に支援の悩みやひきこもっている人のメンタルヘルスに関連する課題等について自由に意見を出し合ってもらった。意見としては、「女性のひきこもっている人の増加が目立ち始め、このままだと長期化し、メンタルヘルス問題の悪化が懸念される」こと、「それまであった人間関係も疎遠になって家族以外と会話していない」こと、「親を介護しながら扶養されている」こと、「自分の先行きが不安になって不眠に陥っている」こと等が挙がった。（問題59）\n\n数回にわたる専門部会のまとめとして、「女性の増加が目立ち、彼女たちは、もう一度誰かとつながりたいという気持ちがあるがなかなか自分からは行動しにくいようだ」ということで意見が一致した。そして、専門部会は新たな取組の提案と報告を行い、それを受けたＱ市は提案に基づく取組を行うこととした。（問題60）","options":["居場所やつながりを作るために、同じ悩みを語り合うサロンづくりを進める。","一人暮らしの支援として、住宅入居等支援事業を開始する。","日常生活自立支援事業の広報を積極的に行う。","市内の精神科医療機関の一覧をひきこもっている人たちに送付する。","家族内での役割を獲得するための介護教室を開催する。"],"answer":[1],"subject":3,"explanation":"誰かとつながりたいというニーズに対して、悩みを語り合えるサロンなどの居場所づくりが適切です。","note":"「協議会」とは、「障害者の日常生活及び社会生活を総合的に支援するための法律」に基づき行われる協議会のことである。"},{"id":61,"question":"次の記述のうち、「精神保健福祉法」に規定される精神科病院の管理者の役割として、正しいものを2つ選びなさい。","options":["入院者からの退院請求に対し、その者の入院継続の要否を審査する。","措置入院者に自傷他害の恐れが消失した場合、直ちに、その者を退院させる。","医療保護入院を行う場合、その旨を本人に書面で知らせる。","入院者に対して、行政機関の職員との面会を制限する。","都道府県知事に対して、医療保護入院者の入院届を出す。"],"answer":[3,5],"subject":4,"note":"「精神保健福祉法」とは、「精神保健及び精神障害者福祉に関する法律」のことである。","explanation":"病院管理者は、医療保護入院について本人へ書面で告知し、都道府県知事へ入院届を提出します。"},{"id":62,"question":"ひきこもり地域支援センターに関する次の記述のうち、正しいものを1つ選びなさい。","options":["ひきこもりに関する家族からの相談は対象外である。","ひきこもり支援コーディネーターを置く。","「精神保健福祉法」に基づき設置されている。","ひきこもりの支援対象の年齢は15歳から49歳までである。","連絡協議会の設置が義務づけられている。"],"answer":[2],"subject":4,"explanation":"ひきこもり地域支援センターには、ひきこもり支援コーディネーターを置きます。本人や家族の相談を受け、関係機関と連携します。"},{"id":63,"question":"医療保険制度に関する次の記述のうち、正しいものを1つ選びなさい。","options":["75歳以上の高齢者等は、他の医療保険から独立した公的医療保険に加入する。","国民健康保険の保険者は、国である。","医療保険は、現金給付ではなく現物給付である。","居宅サービス計画に基づく訪問看護の費用は、医療保険から支払われる。","高額療養費の自己負担額は、一律に設定されている。"],"answer":[1],"subject":4,"explanation":"75歳以上の人などは、独立した医療保険制度である後期高齢者医療制度の対象になります。"},{"id":64,"question":"次のうち、市町村長が指定するものとして、正しいものを1つ選びなさい。","options":["応急入院させることができる医療機関","地域相談支援を行う事業者","発達障害者支援センター","精神保健指定医","計画相談支援を行う事業者"],"answer":[5],"subject":4,"explanation":"計画相談支援を行う指定特定相談支援事業者を指定するのは、市町村長です。"},{"id":65,"question":"次のうち、自殺総合対策大綱に示された取組により養成される、見守り等の役割を担う人材として、正しいものを1つ選びなさい。","options":["ゲートキーパー","コミュニティソーシャルワーカー","ペアレントメンター","ピアスタッフ","カウンセラー"],"answer":[1],"subject":4,"explanation":"ゲートキーパーは、悩みを抱える人の変化に気づき、声をかけ、話を聴き、必要な支援につなげて見守る役割です。"},{"id":66,"question":"地域生活定着支援センターに関する次の記述のうち、正しいものを1つ選びなさい。","options":["利用には、精神障害者保健福祉手帳の所持が要件となる。","職員の配置においては、精神保健福祉士が必置となっている。","支援は、矯正施設出所後に開始される。","設置は、各市町村に1か所となっている。","整備は、厚生労働省が所管する事業により進められている。"],"answer":[5],"subject":4,"explanation":"地域生活定着支援センターの整備は、厚生労働省所管の事業で進められてきました。司法と福祉をつなぎ、社会復帰を支援します。"},{"id":67,"question":"保護観察所に関する次の記述のうち、正しいものを2つ選びなさい。","options":["未成年者の保護観察は対象外である。","犯罪予防のための普及啓発を行う。","精神保健観察を行う。","刑事施設の仮釈放を決定する。","更生保護施設を併設する。"],"answer":[2,3],"subject":4,"explanation":"保護観察所は、犯罪予防の普及啓発に加え、医療観察制度における精神保健観察も行います。"},{"id":68,"question":"医療観察制度に関する次の記述のうち、正しいものを1つ選びなさい。","options":["「医療観察法」の目的は、対象者の社会復帰の促進である。","対象となる重大な他害行為には、恐喝が含まれる。","審判による処遇の決定は、精神保健指定医2名以上の診断に基づき行われる。","精神保健審判員には、精神保健福祉士が任用される。","入院処遇は、急性期、回復期の2段階に分けられる。"],"answer":[1],"subject":4,"note":"「医療観察法」とは、「心神喪失等の状態で重大な他害行為を行った者の医療及び観察等に関する法律」のことである。","explanation":"医療観察法は、適切な医療と必要な観察・指導によって、対象者の社会復帰を促進することを目的とします。"},{"id":69,"question":"精神科病院に勤務するＪ精神保健福祉士は、栄養士と共同の発案で、糖尿病を合併している統合失調症の患者に対する6か月間の運動・栄養指導の評価プログラムを、説明と同意の上で実施することとした。プログラムの開始前と終了時（6か月後）の2 時点において、ＩＤを付したプログラムへの参加者50名の空腹時の血糖値を測定した。参加者における2 時点の血糖値の平均値に、統計的有意差があるかを検証するために、統計的手法を用いた。次のうち、用いた統計的手法として、適切なものを1つ選びなさい。","options":["相関係数の算出","因子分析","リッカート法","対応のあるｔ検定","カイ二乗検定"],"answer":[4],"subject":4,"explanation":"同じ参加者の開始前と終了後の平均値を比較するため、対応のあるt検定を用います。別々の人の集団を比べる場合とは区別します。"},{"id":70,"question":"次の記述のうち、この時点でのＫさんの入院形態の説明として、正しいものを1つ選びなさい。\n\n〔事例〕\nＫさん（50歳、女性）は80代の両親と同居していたが、母親の死をきっかけに統合失調症が悪化し、幻聴や妄想の出現により父親に対する暴言が顕著となった。Ｋさんの様子を心配した父親は、Ｋさんが通院している精神科病院に受診させた。Ｋさんは入院を拒んだが、父親が同意しＫさんは入院した。担当のＬ精神保健福祉士は、Ｋさんの気持ちを受け止めながら、自らの役割などをＫさんに丁寧に説明した。Ｋさんの入院後、父親が介護保険の利用を開始するなど、生活環境は大きく変化し、またＫさんの症状が残っていることから入院期間は1年となってしまった。主治医はＫさんの入院継続の必要性を認め、Ｋさんも入院の継続に同意した。（問題70）\n\n入院から1年半後、主治医から退院に向けた今後の治療方針の説明がなされた。Ｌ精神保健福祉士は、Ｋさんと父親双方の今後の生活について丁寧に話を聞いた。父親はＫさんの面倒を見ることに限界を感じていた。またＫさん自身は、一人暮らしを希望していた。そこでＬ精神保健福祉士は、退院に向けて「障害者総合支援法」に規定される地域相談支援サービスの活用を提案した。Ｋさん、父親も同意したことから、Ｌ精神保健福祉士はそのサービスを提供するＸ事業所のＭ精神保健福祉士と連携し、アパートの体験利用を実施した。（問題71）\n\n退院後のアパートでの生活を継続するための話し合いをＫさん、父親、Ｌ精神保健福祉士及びＭ精神保健福祉士とで行った。Ｋさんからは、定期的な巡回訪問や随時の相談を受けて欲しいとの希望が出された。そこで「障害者総合支援法」に基づく別のサービスの利用の検討を行った。（問題72）","options":["審判期日によって入院が決定される。","入院には家族等の同意を必要とする。","精神保健指定医による退院制限は72 時間を限度とする。","都道府県知事の権限によって入院させる。","入院には精神保健指定医1名の診察を必要とする。"],"answer":[3],"subject":4,"explanation":"本人が入院継続に同意した時点では任意入院です。指定医が入院継続を必要と判断した場合、退院制限は72時間が限度です。","note":"「障害者総合支援法」とは、「障害者の日常生活及び社会生活を総合的に支援するための法律」のことである。"},{"id":71,"question":"次の記述のうち、Ｘ事業所が提供する地域相談支援サービスの説明として、正しいものを1つ選びなさい。\n\n〔事例〕\nＫさん（50歳、女性）は80代の両親と同居していたが、母親の死をきっかけに統合失調症が悪化し、幻聴や妄想の出現により父親に対する暴言が顕著となった。Ｋさんの様子を心配した父親は、Ｋさんが通院している精神科病院に受診させた。Ｋさんは入院を拒んだが、父親が同意しＫさんは入院した。担当のＬ精神保健福祉士は、Ｋさんの気持ちを受け止めながら、自らの役割などをＫさんに丁寧に説明した。Ｋさんの入院後、父親が介護保険の利用を開始するなど、生活環境は大きく変化し、またＫさんの症状が残っていることから入院期間は1年となってしまった。主治医はＫさんの入院継続の必要性を認め、Ｋさんも入院の継続に同意した。（問題70）\n\n入院から1年半後、主治医から退院に向けた今後の治療方針の説明がなされた。Ｌ精神保健福祉士は、Ｋさんと父親双方の今後の生活について丁寧に話を聞いた。父親はＫさんの面倒を見ることに限界を感じていた。またＫさん自身は、一人暮らしを希望していた。そこでＬ精神保健福祉士は、退院に向けて「障害者総合支援法」に規定される地域相談支援サービスの活用を提案した。Ｋさん、父親も同意したことから、Ｌ精神保健福祉士はそのサービスを提供するＸ事業所のＭ精神保健福祉士と連携し、アパートの体験利用を実施した。（問題71）\n\n退院後のアパートでの生活を継続するための話し合いをＫさん、父親、Ｌ精神保健福祉士及びＭ精神保健福祉士とで行った。Ｋさんからは、定期的な巡回訪問や随時の相談を受けて欲しいとの希望が出された。そこで「障害者総合支援法」に基づく別のサービスの利用の検討を行った。（問題72）","options":["おおむね週に1回以上の支援を行う。","都道府県に支給申請を行う。","障害支援区分の認定を必要とする。","支給決定の有効期間は3年である。","福祉事務所が作成する支援計画に基づき実施される。"],"answer":[1],"subject":4,"explanation":"事例のサービスは地域移行支援です。退院後の生活に向け、おおむね週1回以上、本人との面接などの支援を行います。","note":"「障害者総合支援法」とは、「障害者の日常生活及び社会生活を総合的に支援するための法律」のことである。"},{"id":72,"question":"次の記述のうち、このサービスに関する説明として、正しいものを1つ選びなさい。\n\n〔事例〕\nＫさん（50歳、女性）は80代の両親と同居していたが、母親の死をきっかけに統合失調症が悪化し、幻聴や妄想の出現により父親に対する暴言が顕著となった。Ｋさんの様子を心配した父親は、Ｋさんが通院している精神科病院に受診させた。Ｋさんは入院を拒んだが、父親が同意しＫさんは入院した。担当のＬ精神保健福祉士は、Ｋさんの気持ちを受け止めながら、自らの役割などをＫさんに丁寧に説明した。Ｋさんの入院後、父親が介護保険の利用を開始するなど、生活環境は大きく変化し、またＫさんの症状が残っていることから入院期間は1年となってしまった。主治医はＫさんの入院継続の必要性を認め、Ｋさんも入院の継続に同意した。（問題70）\n\n入院から1年半後、主治医から退院に向けた今後の治療方針の説明がなされた。Ｌ精神保健福祉士は、Ｋさんと父親双方の今後の生活について丁寧に話を聞いた。父親はＫさんの面倒を見ることに限界を感じていた。またＫさん自身は、一人暮らしを希望していた。そこでＬ精神保健福祉士は、退院に向けて「障害者総合支援法」に規定される地域相談支援サービスの活用を提案した。Ｋさん、父親も同意したことから、Ｌ精神保健福祉士はそのサービスを提供するＸ事業所のＭ精神保健福祉士と連携し、アパートの体験利用を実施した。（問題71）\n\n退院後のアパートでの生活を継続するための話し合いをＫさん、父親、Ｌ精神保健福祉士及びＭ精神保健福祉士とで行った。Ｋさんからは、定期的な巡回訪問や随時の相談を受けて欲しいとの希望が出された。そこで「障害者総合支援法」に基づく別のサービスの利用の検討を行った。（問題72）","options":["標準利用期間は6か月となっている。","サービス等利用計画の作成を必要とする。","宿泊型の訓練を実施する。","就労定着支援との併給ができる。","介護給付に基づくサービスである。"],"answer":[2],"subject":4,"explanation":"定期的な巡回訪問や随時の相談を行うのは自立生活援助です。障害福祉サービスとして、サービス等利用計画の作成が必要です。","note":"「障害者総合支援法」とは、「障害者の日常生活及び社会生活を総合的に支援するための法律」のことである。"},{"id":73,"question":"次の記述のうち、「障害者総合支援法」に基づく共同生活援助（グループホーム）として、正しいものを1つ選びなさい。","options":["地域生活支援事業に位置づけられる。","同一の建物に居室があることが要件である。","体験利用ができる。","公営住宅は使用可能な住宅から除外される。","利用期間は最長で12か月である。"],"answer":[3],"subject":5,"note":"「障害者総合支援法」とは、「障害者の日常生活及び社会生活を総合的に支援するための法律」のことである。","explanation":"共同生活援助のグループホームは、正式な入居前に体験利用ができます。本人が生活の場を選ぶための機会になります。"},{"id":74,"question":"「障害者総合支援法」に規定される就労移行支援に関する次の記述のうち、正しいものを2つ選びなさい。","options":["対象は60歳未満の者と規定されている。","標準利用期間が設定されている。","利用者と事業者は雇用契約を結ぶ。","一般就労に移行した利用者も一定期間支援の対象である。","自立支援医療（精神通院医療）受給者証の所持を利用条件とする。"],"answer":[2,4],"subject":5,"explanation":"就労移行支援には標準利用期間があり、原則2年です。一般就労後も、一定期間は職場定着に向けた支援を行います。"},{"id":75,"question":"次の記述のうち、厚生労働省が発表した障害者の雇用状況等について、正しいものを1つ選びなさい。","options":["「令和4年度障害者の職業紹介状況等」によれば、ハローワークを通じた身体障害者の就職件数は、ここ10年で増加している。","「令和4年障害者雇用状況の集計結果」によれば、民間企業における障害者の実雇用率はここ10年の間、1 ％以下となっている。","「令和4年度障害者の職業紹介状況等」によれば、ハローワークを通じた知的障害者の就職件数は、ここ10年で減少している。","「令和4年障害者雇用状況の集計結果」によれば、法定雇用率の未達成企業において、障害者を1人も雇用していない企業の割合は20 ％程度である。","「令和4年度障害者の職業紹介状況等」によれば、ハローワークを通じた精神障害者の就職件数は、ここ10年で増加している。"],"answer":[5],"subject":5,"note":"「令和4年度障害者の職業紹介状況等」とは、「令和4年度ハローワークを通じた障害者の職業紹介状況などの取りまとめを公表します ～障害者の就職件数が、コロナ禍以前の水準に向けさらに改善～」のことである。","explanation":"設問の令和4年度の資料では、ハローワークを通じた精神障害者の就職件数は、10年前と比べて増加しています。"},{"id":76,"question":"クラブハウスモデルに関する次の記述のうち、正しいものを2つ選びなさい。","options":["Nothing about us without us（私たち抜きに私たちのことを決めるな）を合言葉とする。","日本においても国際基準の認証を受けた当該モデルの活動がある。","運営していく責任はメンバーとスタッフにあり、最終的な責任は施設長が負う。","迅速な求職活動を原則とする。","リバーマン（Liberman, R.）によって考案された。"],"answer":[2,3],"subject":5,"explanation":"クラブハウスは、メンバーとスタッフが協働して運営します。最終責任は施設長が担い、日本にも国際認証を受けた活動があります。"},{"id":77,"question":"次のうち、都道府県に策定又は設置の義務が課せられているものとして、正しいものを1つ選びなさい。","options":["障害者基本計画","地方精神保健福祉審議会","自殺総合対策大綱","防災基本計画","精神医療審査会"],"answer":[5],"subject":5,"explanation":"精神医療審査会は、精神保健福祉法に基づき都道府県に設置が義務づけられています。"},{"id":78,"question":"次のうち、Ｚ機関の業務として、正しいものを1つ選びなさい。\n\n〔事例〕\nＡさん（40歳、男性）は、20代後半にうつ病で通院したことがある。その後、回復してＩＴ企業に就職し、仕事に懸命に取り組んでいた。ところが、最近、Ａさんが開発したソフトウェアの不具合が複数発生したため対応に追われ、疲労困憊し、食欲不振や不眠も現れ、ふさぎ込むようになった。心配した妻に連れられて、かつて通院していたＹ精神科病院を受診した。Ａさんは、診察の際に医師に、「死にたい」と言っており、うつ病の再発と診断されたため、休職して入院した。Ｙ精神科病院のＢ精神保健福祉士が、Ａさんに詳しく話を聞くと、「ここ数か月は毎日残業で、休日にも出勤していた」と話した。そこで、妻に、最近1か月の時間外労働の時間数を職場に確認してもらったところ、160 時間を超えていることが分かった。Ｂ精神保健福祉士は、この状況は、ある社会保険制度の「心理的負荷による精神障害の認定基準」（以下、認定基準）に該当するのではないかと考え、Ａさんにこの制度の説明をしたところ、申請の意思が示されたため、必要書類を一緒に準備し、Ｚ機関に提出した。（問題78）\n\n入院中のＡさんは、責任感や経済的な理由から復職を急いでおり、病状が安定しない日が続いたが、2か月後、Ｚ機関から「認定基準」に該当すると認定された。（問題79）\n\nその後、Ａさんは1か月ほどで退院することができた。退院してから半年がたち、通院中のＡさんからＢ精神保健福祉士は復職の相談を受けた。その中で、「復職を主治医に相談したところ、賛同してくれた。ただし、職場には時間外労働の在り方について考えてもらわなければいけないと言っていた」「今後は体調を崩さないように、今の自分に合った働き方を考えたい」などの言葉が聞かれたため、Ｂ精神保健福祉士は、Ｕ機関による精神障害者総合雇用支援の職場復帰支援の利用をＡさんと一緒に検討することとなった。（問題80）","options":["労働基準法の運用に関する事務","障害者雇用率の未達成企業への指導","障害者に対する就業や生活面の一体的な相談・支援","失業の認定","公共職業訓練の紹介"],"answer":[1],"subject":5,"explanation":"Z機関は労働基準監督署です。労働基準法に関する監督などに加え、労災保険給付の事務を行います。"},{"id":79,"question":"次のうち、この認定によりＡさんが受けたものとして、正しいものを2つ選びなさい。\n\n〔事例〕\nＡさん（40歳、男性）は、20代後半にうつ病で通院したことがある。その後、回復してＩＴ企業に就職し、仕事に懸命に取り組んでいた。ところが、最近、Ａさんが開発したソフトウェアの不具合が複数発生したため対応に追われ、疲労困憊し、食欲不振や不眠も現れ、ふさぎ込むようになった。心配した妻に連れられて、かつて通院していたＹ精神科病院を受診した。Ａさんは、診察の際に医師に、「死にたい」と言っており、うつ病の再発と診断されたため、休職して入院した。Ｙ精神科病院のＢ精神保健福祉士が、Ａさんに詳しく話を聞くと、「ここ数か月は毎日残業で、休日にも出勤していた」と話した。そこで、妻に、最近1か月の時間外労働の時間数を職場に確認してもらったところ、160 時間を超えていることが分かった。Ｂ精神保健福祉士は、この状況は、ある社会保険制度の「心理的負荷による精神障害の認定基準」（以下、認定基準）に該当するのではないかと考え、Ａさんにこの制度の説明をしたところ、申請の意思が示されたため、必要書類を一緒に準備し、Ｚ機関に提出した。（問題78）\n\n入院中のＡさんは、責任感や経済的な理由から復職を急いでおり、病状が安定しない日が続いたが、2か月後、Ｚ機関から「認定基準」に該当すると認定された。（問題79）\n\nその後、Ａさんは1か月ほどで退院することができた。退院してから半年がたち、通院中のＡさんからＢ精神保健福祉士は復職の相談を受けた。その中で、「復職を主治医に相談したところ、賛同してくれた。ただし、職場には時間外労働の在り方について考えてもらわなければいけないと言っていた」「今後は体調を崩さないように、今の自分に合った働き方を考えたい」などの言葉が聞かれたため、Ｂ精神保健福祉士は、Ｕ機関による精神障害者総合雇用支援の職場復帰支援の利用をＡさ // 第26回の公式合格基準。専門6科目は5科目群にまとめて判定する。
const EXAM={"edition":26,"specialistMark":44,"fullMark":95,"commonTotal":83,"officialKey":"https://www.sssc.or.jp/seishin/past_exam/pdf/no26/se_kijun_seitou.pdf"};
const PASS_GROUPS=[[0],[1],[2],[3],[4,5]];
const COMMON_GROUPS=[{"name":"人体の構造と機能及び疾病","total":7,"first":1,"last":7},{"name":"心理学理論と心理的支援","total":7,"first":8,"last":14},{"name":"社会理論と社会システム","total":7,"first":15,"last":21},{"name":"現代社会と福祉","total":10,"first":22,"last":31},{"name":"地域福祉の理論と方法","total":10,"first":32,"last":41},{"name":"福祉行財政と福祉計画","total":7,"first":42,"last":48},{"name":"社会保障","total":7,"first":49,"last":55},{"name":"障害者に対する支援と障害者自立支援制度","total":7,"first":56,"last":62},{"name":"低所得者に対する支援と生活保護制度","total":7,"first":63,"last":69},{"name":"保健医療サービス","total":7,"first":70,"last":76},{"name":"権利擁護と成年後見制度","total":7,"first":77,"last":83}];
const KEY='ito-seishin26-v1';
let saved={},storageOK=true;
try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){storageOK=false}
let rubyEnabled=saved.rubyEnabled!==false;
let passMode=saved.passMode==='full'?'full':'exempt';
let commonScores=COMMON_GROUPS.map((g,i)=>Array.isArray(saved.commonScores)&&['string','number'].includes(typeof saved.commonScores[i])?String(saved.commonScores[i]):'');
let results=saved.results||{},marks=saved.marks||{},index=Number(saved.index)||1,subject='all',mode='all',order=[],selection=[],revealed=false,retrying=null;
for(const [id,v] of Object.entries(results)){if(!QUESTIONS[id-1]||!v||!Array.isArray(v.selected)){delete results[id]}}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const equal=(a,b)=>a.length===b.length&&[...a].sort().every((v,i)=>v===[...b].sort()[i]);
const correct=id=>results[id]&&equal(results[id].selected,QUESTIONS[id-1].answer);
function save(){try{localStorage.setItem(KEY,JSON.stringify({results,marks,index,passMode,commonScores,rubyEnabled}))}catch(e){storageOK=false}}
function readCommonScore(value,max){
 const text=String(value??'').trim();
 if(text==='')return null;
 const score=Number(text);
 return Number.isInteger(score)&&score>=0&&score<=max?score:null;
}
function getPassStatus(record,route=passMode,common=commonScores){
 const groups=PASS_GROUPS.map((subjects,i)=>{
  const questions=QUESTIONS.filter(q=>subjects.includes(q.subject));
  const answered=questions.filter(q=>record[q.id]&&Array.isArray(record[q.id].selected));
  return {number:i+1,name:subjects.map(id=>SUBJECTS[id]).join('、'),total:questions.length,answered:answered.length,
   score:answered.filter(q=>equal(record[q.id].selected,q.answer)).length,first:questions[0].id,last:questions[questions.length-1].id};
 });
 const specialistScore=groups.reduce((sum,g)=>sum+g.score,0);
 const answered=groups.reduce((sum,g)=>sum+g.answered,0),full=route==='full';
 if(full)COMMON_GROUPS.forEach((g,i)=>groups.push({...g,number:i+6,common:true,score:readCommonScore(common[i],g.total-(g.bonus||0))===null?null:readCommonScore(common[i],g.total-(g.bonus||0))+(g.bonus||0)}));
 const pendingGroups=groups.filter(g=>g.score===null),zeroGroups=groups.filter(g=>g.score===0);
 const score=groups.reduce((sum,g)=>sum+(g.score??0),0),mark=full?EXAM.fullMark:EXAM.specialistMark;
 return {groups,zeroGroups,pendingGroups,specialistScore,score,mark,full,answered,total:QUESTIONS.length+(full?EXAM.commonTotal:0),
  remaining:QUESTIONS.length-answered,shortage:Math.max(0,mark-score),complete:answered===QUESTIONS.length&&pendingGroups.length===0,
  meetsCriteria:pendingGroups.length===0&&score>=mark&&zeroGroups.length===0};
}
function renderPassCheck(){
 const p=getPassStatus(results),count=p.groups.length,pending=p.pendingGroups.length;
 $('#pass-rule').textContent=`第${EXAM.edition}回・${p.full?'共通科目あり':'共通科目免除'}：${p.mark}点以上 / ${p.total}点 ＋ ${count}科目群すべてで得点`;
 $('#pass-overview').textContent=`現在 ${p.score} / ${p.total}点${pending?'（入力済み分）':''} · 得点のある科目群 ${p.groups.filter(g=>g.score>0).length} / ${count}群 · 専門科目 回答済み ${p.answered} / ${QUESTIONS.length}問`;
 $('#common-entry').hidden=!p.full;
 let title,message;
 if(p.answered===0){title='解答を進めると、合格ラインを確認できます';message='まずは一問ずつ取り組みましょう。各問題で「解答する」を押した結果を集計します。'}
 else if(!p.complete){title=p.meetsCriteria?'途中経過：合格ラインを満たしています':'途中経過：合格ラインを確認しましょう';message=[p.remaining?`専門科目の未解答があと${p.remaining}問あります。`:`専門科目${QUESTIONS.length}問の解答が完了しました。`,pending?`共通科目の${pending}科目群で得点が未入力、または入力範囲外です。`:'', '専門科目の全問解答'+(p.full?`と共通科目${COMMON_GROUPS.length}群の得点入力`:'')+'が完了すると最終判定を表示します。'].join('');}
 else if(p.meetsCriteria){title='おめでとうございます！ 合格です！';message=`${p.full?'共通科目あり':'共通科目免除'}の基準（${p.mark}点以上・${count}科目群すべてで得点）を満たしました。最後までよく頑張りました！`;}
 else{title='今回は合格基準に届きませんでした';message='下の得点と0点の科目群を確認し、間違えた問題を復習していきましょう。';}
 $('#pass-result').className='pass-result '+(p.complete?(p.meetsCriteria?'passed':'not-passed'):'in-progress');
 $('#pass-title').textContent=title;$('#pass-message').textContent=message;
 $('#pass-score').textContent=`${p.score} / ${p.total}点${pending?'（入力途中）':''}`;
 $('#pass-score-status').textContent=pending?'共通科目の得点入力後に総得点を確認します':p.shortage?`${p.mark}点まであと${p.shortage}点`:`✓ ${p.mark}点以上を達成`;
 $('#pass-score-status').className=pending||p.shortage?'pass-warning':'pass-ok';
 $('#pass-groups-status').textContent=[p.zeroGroups.length?`0点の科目群：${p.zeroGroups.map(g=>g.number+'群').join('・')}`:'',pending?`得点を要確認：${p.pendingGroups.map(g=>g.number+'群').join('・')}`:'',!p.zeroGroups.length&&!pending?`✓ ${count}科目群すべてで得点`:''].filter(Boolean).join(' ／ ');

/rt><\/ruby>","精神保健指定医による退院制限は72 時間を限度とする。":"<ruby>精神保健指定医<rt>せいしんほけんしていい<\/rt><\/ruby>による<ruby>退院<rt>たいいん<\/rt><\/ruby><ruby>制限<rt>せいげん<\/rt><\/ruby>は72 <ruby>時間<rt>じかん<\/rt><\/ruby>を<ruby>限度<rt>げんど<\/rt><\/ruby>とする。","精神保健福祉センター":"<ruby>精神保健福祉<rt>せいしんほけんふくし<\/rt><\/ruby>センター","精神保健福祉センターや保健所その他これらに準ずる施設に必置される。":"<ruby>精神保健福祉<rt>せいしんほけんふくし<\/rt><\/ruby>センターや<ruby>保健所<rt>ほけんじょ<\/rt><\/ruby>その<ruby>他<rt>た<\/rt><\/ruby>これらに<ruby>準<rt>じゅん<\/rt><\/ruby>ずる<ruby>施設<rt>しせつ<\/rt><\/ruby>に<ruby>必置<rt>ひっち<\/rt><\/ruby>される。","精神保健福祉士が担う場合には、3年以上の実務経験が必要となる。":"<ruby>精神保健福祉士<rt>せいしんほけんふくしし<\/rt><\/ruby>が<ruby>担<rt>にな<\/rt><\/ruby>う<ruby>場合<rt>ばあい<\/rt><\/ruby>には、3<ruby>年<rt>ねん<\/rt><\/ruby><ruby>以上<rt>いじょう<\/rt><\/ruby>の<ruby>実務経験<rt>じつむけいけん<\/rt><\/ruby>が<ruby>必要<rt>ひつよう<\/rt><\/ruby>となる。","精神保健福祉士法に目を通し、精神保健福祉士として適切な行動を確認する。":"<ruby>精神保健福祉士<rt>せいしんほけんふくしし<\/rt><\/ruby><ruby>法<rt>ほう<\/rt><\/ruby>に<ruby>目<rt>め<\/rt><\/ruby>を<ruby>通<rt>とお<\/rt><\/ruby>し、<ruby>精神保健福祉士<rt>せいしんほけんふくしし<\/rt><\/ruby>として<ruby>適切<rt>てきせつ<\/rt><\/ruby>な<ruby>行動<rt>こうどう<\/rt><\/ruby>を<ruby>確認<rt>かくにん<\/rt><\/ruby>する。","精神保健福祉相談員は、精神障害者や家族等への相談対応、訪問指導などを担います。根拠は精神保健福祉法です。":"<ruby>精神<rt>せいしん<\/rt><\/ruby><ruby>保健<rt>ほけん<\/rt><\/ruby><ruby>福祉<rt>ふくし<\/rt><\/ruby><ruby>相談員<rt>そうだんいん<\/rt><\/ruby>は、<ruby>精神障害者<rt>せいしんしょうがいしゃ<\/rt><\/ruby>や<ruby>家族<rt>かぞく<\/rt><\/ruby><ruby>等<rt>とう<\/rt><\/ruby>への<ruby>相談<rt>そうだん<\/rt><\/ruby><ruby>対応<rt>たいおう<\/rt><\/ruby>、<ruby>訪問<rt>ほうもん<\/rt><\/ruby><ruby>指導<rt>しどう<\/rt><\/ruby>などを<ruby>担<rt>にな<\/rt><\/ruby>います。<ruby>根拠<rt>こんきょ<\/rt><\/ruby>は<ruby>精神保健福祉法<rt>せいしんほけんふくしほう<\/rt><\/ruby>です。","精神保健観察を行う。":"<ruby>精神<rt>せいしん<\/rt><\/ruby><ruby>保健<rt>ほけん<\/rt><\/ruby><ruby>観察<rt>かんさつ<\/rt><\/ruby>を<ruby>行<rt>おこな<\/rt><\/ruby>う。","精神分析療法では、心に浮かぶことを自由に語る「自由連想法」を用います。無意識の葛藤などを理解していきます。":"<ruby>精神<rt>せいしん<\/rt><\/ruby><ruby>分析<rt>ぶんせき<\/rt><\/ruby><ruby>療法<rt>りょうほう<\/rt><\/ruby>では、<ruby>心<rt>こころ<\/rt><\/ruby>に<ruby>浮<rt>う<\/rt><\/ruby>かぶことを<ruby>自由<rt>じゆう<\/rt><\/ruby>に<ruby>語<rt>かた<\/rt><\/ruby>る「<ruby>自由<rt>じゆう<\/rt><\/ruby><ruby>連想<rt>れんそう<\/rt><\/ruby><ruby>法<rt>ほう<\/rt><\/ruby>」を<ruby>用<rt>もち<\/rt><\/ruby>います。<ruby>無意識<rt>むいしき<\/rt><\/ruby>の<ruby>葛藤<rt>かっとう<\/rt><\/ruby>などを<ruby>理解<rt>りかい<\/rt><\/ruby>していきます。","精神医療審査会":"<ruby>精神<rt>せいしん<\/rt><\/ruby><ruby>医療<rt>いりょう<\/rt><\/ruby><ruby>審査会<rt>しんさかい<\/rt><\/ruby>","精神医療審査会は、精神保健福祉法に基づき都道府県に設置が義務づけられています。":"<ruby>精神<rt>せいしん<\/rt><\/ruby><ruby>医療<rt>いりょう<\/rt><\/ruby><ruby>審査会<rt>しんさかい<\/rt><\/ruby>は、<ruby>精神保健福祉法<rt>せいしんほけんふくしほう<\/rt><\/ruby>に<ruby>基<rt>もと<\/rt><\/ruby>づき<ruby>都道府県<rt>とどうふけん<\/rt><\/ruby>に<ruby>設置<rt>せっち<\/rt><\/ruby>が<ruby>義務<rt>ぎむ<\/rt><\/ruby>づけられています。","精神疾患とその治療":"<ruby>精神疾患<rt>せいしんしっかん<\/rt><\/ruby>とその<ruby>治療<rt>ちりょう<\/rt><\/ruby>","精神疾患の一次予防を目的としている。":"<ruby>精神疾患<rt>せいしんしっかん<\/rt><\/ruby>の<ruby>一<rt>いち<\/rt><\/ruby><ruby>次<rt>じ<\/rt><\/ruby><ruby>予防<rt>よぼう<\/rt><\/ruby>を<ruby>目的<rt>もくてき<\/rt><\/ruby>としている。","精神疾患を有するとの判定は、各国が独自に認めた医学的基準に即して行われるものとする。":"<ruby>精神疾患<rt>せいしんしっかん<\/rt><\/ruby>を<ruby>有<rt>ゆう<\/rt><\/ruby>するとの<ruby>判定<rt>はんてい<\/rt><\/ruby>は、<ruby>各国<rt>かっこく<\/rt><\/ruby>が<ruby>独自<rt>どくじ<\/rt><\/ruby>に<ruby>認<rt>みと<\/rt><\/ruby>めた<ruby>医学的<rt>いがくてき<\/rt><\/ruby><ruby>基準<rt>きじゅん<\/rt><\/ruby>に<ruby>即<rt>そく<\/rt><\/ruby>して<ruby>行<rt>おこな<\/rt><\/ruby>われるものとする。","精神科クリニックで働くＢ精神保健福祉士（以下「Ｂワーカー」という。）は、中学の養護教諭からの紹介で、嫌なことがあるとリストカットするというＣさん（15歳、女性）のインテーク面接を行った。当日母親が付き添っていたが、はじめにＣさんから話を聞いた。Ｂワーカーがバイオサイコソーシャルモデルにのっとって話を聞く中で、Ｃさんはクラスの誰とも付き合いがなく、休み時間も机に伏していることや、摂食障害の傾向もあることが分かってきた。親については、「父親はいつも酔っている。母親は怒ってばかりなので何も話していない。今日も理由が何か分からずに来ている」と言う。ＢワーカーはＣさんが話してくれたことをねぎらい、医師の診察につなげた。（問題33）\n\n診察後、医師とＢワーカーは、Ｃさんにことわって、母親に状況を話した。母親は驚き、「夫のことで頭が一杯で気が付かなかった。夫は毎晩深酒しては、Ｃの成績や反抗的態度について私を責めるんです。だからついＣには厳しくしてしまって。Ｃが身体を傷つけたり、無理に食べて吐いたりするのをすぐにやめさせます」と言う。Ｂワーカーは、「急いでＣさんの行動をやめさせようとせず、まずＣさんの思いを聞きましょう」と伝えた。Ｃさんの通院が始まり、Ｂワーカーは、母親に対してＣさんへの対応を話し合うだけでよいのか気になったため、職能団体が実施するスーパービジョンを受けた。スーパーバイザーからは家族をシステムとして理解すること、母親もクライエントであるという視点をもつこと等の助言を得た。Ｂワーカーは母親のニーズと共に、親子3人の関係性からＣさんの問題を考え始めた。（問題34）\n\nＢワーカーはＣさんの話を聞くように努め始めた母親を称賛しつつ、母親のニーズを明確にしていった。そして母親に更なる気づきを促すために、「他の家族からも学びましょう」と保健所主催のアルコール問題を理解するための家族教室への参加を勧めた。（問題35）":"<ruby>精神科<rt>せいしんか<\/rt><\/ruby>クリニックで<ruby>働<rt>はたら<\/rt><\/ruby>くＢ<ruby>精神保健福祉士<rt>せいしんほけんふくしし<\/rt><\/ruby>（<ruby>以下<rt>いか<\/rt><\/ruby>「Ｂワーカー」という。）は、<ruby>中学<rt>ちゅうがく<\/rt><\/ruby>の<ruby>養護教諭<rt>ようごきょうゆ<\/rt><\/ruby>からの<ruby>紹介<rt>しょうかい<\/rt><\/ruby>で、<ruby>嫌<rt>いや<\/rt><\/ruby>なことがあるとリストカットするというＣさん（15<ruby>歳<rt>さい<\/rt><\/ruby>、<ruby>女性<rt>じょせい<\/rt><\/ruby>）のインテーク<ruby>面接<rt>めんせつ<\/rt><\/ruby>を<ruby>行<rt>おこな<\/rt><\/ruby>った。<ruby>当日<rt>とうじつ<\/rt><\/ruby><ruby>母親<rt>ははおや<\/rt><\/ruby>が<ruby>付<rt>つ<\/rt><\/ruby>き<ruby>添<rt>そ<\/rt><\/ruby>っていたが、はじめにＣさんから<ruby>話<rt>はなし<\/rt><\/ruby>を<ruby>聞<rt>き<\/rt><\/ruby>いた。Ｂワーカーがバイオサイコソーシャルモデルにのっとって<ruby>話<rt>はなし<\/rt><\/ruby>を<ruby>聞<rt>き<\/rt><\/ruby>く<ruby>中<rt>なか<\/rt><\/ruby>で、Ｃさんはクラスの<ruby>誰<rt>だれ<\/rt><\/ruby>とも<ruby>付<rt>つ<\/rt><\/ruby>き<ruby>合<rt>あ<\/rt><\/ruby>いがなく、<ruby>休<rt>やす<\/rt><\/ruby>み<ruby>時間<rt>じかん<\/rt><\/ruby>も<ruby>机<rt>つくえ<\/rt><\/ruby>に<ruby>伏<rt>ふ<\/rt><\/ruby>していることや、<ruby>摂食<rt>せっしょく<\/rt><\/ruby><ruby>障害<rt>しょうがい<\/rt><\/ruby>の<ruby>傾向<rt>けいこう<\/rt><\/ruby>もあることが<ruby>分<rt>わ<\/rt><\/ruby>かってきた。<ruby>親<rt>おや<\/rt><\/ruby>については、「<ruby>父親<rt>ちちおや<\/rt><\/ruby>はいつも<ruby>酔<rt>よ<\/rt><\/ruby>っている。<ruby>母親<rt>ははおや<\/rt><\/ruby>は<ruby>怒<rt>おこ<\/rt><\/ruby>ってばかりなので<ruby>何<rt>なん<\/rt><\/ruby>も<ruby>話<rt>はな<\/rt><\/ruby>していない。<ruby>今日<rt>きょう<\/rt><\/ruby>も<ruby>理由<rt>りゆう<\/rt><\/ruby>が<ruby>何<rt>なん<\/rt><\/ruby>か<ruby>分<rt>わ<\/rt><\/ruby>からずに<ruby>来<rt>き<\/rt><\/ruby>ている」と<ruby>言<rt>い<\/rt><\/ruby>う。ＢワーカーはＣさんが<ruby>話<rt>はな<\/rt><\/ruby>してくれたことをねぎらい、<ruby>医師<rt>いし<\/rt><\/ruby>の<ruby>診察<rt>しんさつ<\/rt><\/ruby>につなげた。（<ruby>問題<rt>もんだい<\/rt><\/ruby>33）\n\n<ruby>診察<rt>しんさつ<\/rt><\/ruby><ruby>後<rt>ご<\/rt><\/ruby>、<ruby>医師<rt>いし<\/rt><\/ruby>とＢワーカーは、Ｃさんにことわって、<ruby>母親<rt>ははおや<\/rt><\/ruby>に<ruby>状況<rt>じょうきょう<\/rt><\/ruby>を<ruby>話<rt>はな<\/rt><\/ruby>した。<ruby>母親<rt>ははおや<\/rt><\/ruby>は<ruby>驚<rt>おどろ<\/rt><\/ruby>き、「<ruby>夫<rt>おっと<\/rt><\/ruby>のことで<ruby>頭<rt>あたま<\/rt><\/ruby>が<ruby>一杯<rt>いっぱい<\/rt><\/ruby>で<ruby>気<rt>き<\/rt><\/ruby>が<ruby>付<rt>つ<\/rt><\/ruby>かなかった。<ruby>夫<rt>おっと<\/rt><\/ruby>は<ruby>毎晩<rt>まいばん<\/rt><\/ruby><ruby>深酒<rt>ふかざけ<\/rt><\/ruby>しては、Ｃの<ruby>成績<rt>せいせき<\/rt><\/ruby>や<ruby>反抗的<rt>はんこうてき<\/rt><\/ruby><ruby>態度<rt>たいど<\/rt><\/ruby>について<ruby>私<rt>わたし<\/rt><\/ruby>を<ruby>責<rt>せ<\/rt><\/ruby>めるんです。だからついＣには<ruby>厳<rt>きび<\/rt><\/ruby>しくしてしまって。Ｃが<ruby>身体<rt>しんたい<\/rt><\/ruby>を<ruby>傷<rt>きず<\/rt><\/ruby>つけたり、<ruby>無理<rt>むり<\/rt><\/ruby>に<ruby>食<rt>た<\/rt><\/ruby>べて<ruby>吐<rt>は<\/rt><\/ruby>いたりするのをすぐにやめさせます」と<ruby>言<rt>い<\/rt><\/ruby>う。Ｂワーカーは、「<ruby>急<rt>いそ<\/rt><\/ruby>いでＣさんの<ruby>行動<rt>こうどう<\/rt><\/ruby>をやめさせようとせず、まずＣさんの<ruby>思<rt>おも<\/rt><\/ruby>いを<ruby>聞<rt>き<\/rt><\/ruby>きましょう」と<ruby>伝<rt>つた<\/rt><\/ruby>えた。Ｃさんの<ruby>通院<rt>つういん<\/rt><\/ruby>が<ruby>始<rt>はじ<\/rt><\/ruby>まり、Ｂワーカーは、<ruby>母親<rt>ははおや<\/rt><\/ruby>に<ruby>対<rt>たい<\/rt><\/ruby>してＣさんへの<ruby>対応<rt>たいおう<\/rt><\/ruby>を<ruby>話<rt>はな<\/rt><\/ruby>し<ruby>合<rt>あ<\/rt><\/ruby>うだけでよいのか<ruby>気<rt>き<\/rt><\/ruby>になったため、<ruby>職能<rt>しょくのう<\/rt><\/ruby><ruby>団体<rt>だんたい<\/rt><\/ruby>が<ruby>実施<rt>じっし<\/rt><\/ruby>するスーパービジョンを<ruby>受<rt>う<\/rt><\/ruby>けた。スーパーバイザーからは<ruby>家族<rt>かぞく<\/rt><\/ruby>をシステムとして<ruby>理解<rt>りかい<\/rt><\/ruby>すること、<ruby>母親<rt>ははおや<\/rt><\/ruby>もクライエントであるという<ruby>視点<rt>してん<\/rt><\/ruby>をもつこと<ruby>等<rt>とう<\/rt><\/ruby>の<ruby>助言<rt>じょげん<\/rt><\/ruby>を<ruby>得<rt>え<\/rt><\/ruby>た。Ｂワーカーは<ruby>母親<rt>ははおや<\/rt><\/ruby>のニーズと<ruby>共<rt>とも<\/rt><\/ruby>に、<ruby>親子<rt>おやこ<\/rt><\/ruby>3<ruby>人<rt>にん<\/rt><\/ruby>の<ruby>関係性<rt>かんけいせい<\/rt><\/ruby>からＣさんの<ruby>問題<rt>もんだい<\/rt><\/ruby>を<ruby>考<rt>かんが<\/rt><\/ruby>え<ruby>始<rt>はじ<\/rt><\/ruby>めた。（<ruby>問題<rt>もんだい<\/rt><\/ruby>34）\n\nＢワーカーはＣさんの<ruby>話<rt>はなし<\/rt><\/ruby>を<ruby>聞<rt>き<\/rt><\/ruby>くように<ruby>努<rt>つと<\/rt><\/ruby>め<ruby>始<rt>はじ<\/rt><\/ruby>めた<ruby>母親<rt>ははおや<\/rt><\/ruby>を<ruby>称賛<rt>しょうさん<\/rt><\/ruby>しつつ、<ruby>母親<rt>ははおや<\/rt><\/ruby>のニーズを<ruby>明確<rt>めい
