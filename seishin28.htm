(()=>{
'use strict';
const host=document.currentScript.previousElementSibling;
const root=host.attachShadow({mode:'open'});
const QUESTIONS=[{"id":1,"question":"次のうち、海馬が担う重要な機能として、適切なものを1つ選びなさい。","options":["随意運動の制御","運動の協調性","記憶の保持","呼吸や心拍数の調整","意欲の抑制"],"answer":[3],"subject":0,"explanation":"海馬は、記憶を形成し保持する働きに重要な役割を果たします。特に新しい出来事を覚えることに関わります。"},{"id":2,"question":"次のうち、外因性に分類される精神障害として、正しいものを2つ選びなさい。","options":["双極性障害（躁うつ病）","統合失調症","アルコールによる精神病性障害","認知症","神経症"],"answer":[3,4],"subject":0,"explanation":"外因性の精神障害は、身体や脳の病気、物質の影響などによるものです。アルコールによる精神病性障害と認知症が該当します。"},{"id":3,"question":"Ａさん（34歳、男性）は、仕事上のストレスを感じていた時期に、友人から「気分転換になる」と誘われ、大麻を使用するようになった。次第に使用頻度が増し、仕事への集中困難や睡眠障害がみられるようになった。ある日、大麻所持中に警察官に職務質問を受け、現行犯で逮捕された。その後、保釈され、再使用を防ぐために薬物依存症治療に対応した精神科病院へ入院し、回復を目的としたプログラムに参加することとなった。プログラム開始時の面接でＡさんは「大麻は海外で合法の国もあるし、仕事では成果を出している。問題にすることではない」と話した。次のうち、面接時のＡさんの状態として、最も適切なものを1つ選びなさい。","options":["離脱症状","否認","身体依存","グッド・トリップ","作話"],"answer":[2],"subject":0,"explanation":"問題が起きているのに、その存在や深刻さを認めない状態を「否認」といいます。事例では大麻使用の問題を認めていません。"},{"id":4,"question":"次のうち、全生活史健忘で障害される認知機能として、正しいものを1つ選びなさい。","options":["暗算","短期記憶","手続き記憶","自伝的記憶","翌日の予定を覚えておくこと"],"answer":[4],"subject":0,"explanation":"自伝的記憶は、自分の人生に関する出来事の記憶です。全生活史健忘では、この記憶が広い範囲で失われます。"},{"id":5,"question":"Ａさん（50歳、女性）は、3週間前から抑うつ気分、意欲の低下、集中力の低下、早朝覚醒、食欲低下、易疲労感を認め、好きだったテレビ番組も楽しめなくなった。この状態に苦しみ、精神科クリニックを受診した。次のうち、Ａさんの症状に対して効果が期待できる向精神薬として、最も適切なものを1つ選びなさい。","options":["第二世代抗精神病薬","ＳＳＲＩ（選択的セロトニン再取り込み阻害薬）","抗てんかん薬","アセチルコリンエステラーゼ阻害薬","第一世代抗精神病薬"],"answer":[2],"subject":0,"explanation":"抑うつ気分や楽しめない状態など、うつ病を考える症状が示されています。SSRIは、うつ症状の治療に用いられる抗うつ薬です。"},{"id":6,"question":"次の記述のうち、自律訓練法の説明として、正しいものを1つ選びなさい。","options":["言語的交流が困難な子どもに対して、表現や交流の手段として遊びを用いる。","対人関係の持ち方や自立した生活を行うのに必要な生活技能を身に付ける。","レクリエーションを活用して、活動性、関心を高める。","作業を通じて、社会性の回復を促す。","注意を集中し、自己暗示をかけることにより、心身の安定を図る。"],"answer":[5],"subject":0,"explanation":"自律訓練法は、体の重さや温かさなどに注意を向け、自己暗示によって心身の緊張を和らげる方法です。"},{"id":7,"question":"次の記述のうち、「令和5年患者調査」（厚生労働省）における精神疾患を有する患者の状況として、正しいものを1つ選びなさい。","options":["入院患者のうち、1年以上の在院者が半数以上を占める。","外来患者で最も多い疾患は、「統合失調症、統合失調症型障害及び妄想性障害」である。","入院患者のうち、65歳以上の者が8割を占める。","総患者数は400万人を下回っている。","入院患者で最も多い疾患は、「気分［感情］障害（躁うつ病を含む）」である。"],"answer":[1],"subject":0,"explanation":"設問の令和5年患者調査では、精神疾患の入院患者のうち、在院期間1年以上の人が半数以上を占めています。"},{"id":8,"question":"「精神保健福祉法」において「精神科病院の管理者は、精神障害者を入院させる場合においては、本人の同意に基づいて入院が行われるように努めなければならない」と定められている。次のうち、この入院形態として、正しいものを1つ選びなさい。","options":["措置入院","緊急措置入院","医療保護入院","応急入院","任意入院"],"answer":[5],"subject":0,"note":"「精神保健福祉法」とは、「精神保健及び精神障害者福祉に関する法律」のことである。","explanation":"本人の同意に基づく入院は「任意入院」です。精神保健福祉法では、本人の同意による入院に努めることを定めています。"},{"id":9,"question":"精神科訪問看護に関する次の記述のうち、適切なものを1つ選びなさい。","options":["うつ病の患者は対象外である。","医師が訪問し生活支援を行う。","服薬の確認は業務に含まれる。","身体的な介護が主要な業務である。","訪問看護指示書は保健師又は看護師が交付する。"],"answer":[3],"subject":0,"explanation":"精神科訪問看護には、服薬状況の確認や、安定した療養生活を続けるための支援が含まれます。医師の指示書に基づいて行います。"},{"id":10,"question":"精神障害にも対応した地域包括ケアシステムに関する次の記述のうち、正しいものを2つ選びなさい。","options":["入院医療を中心とした支援体制の構築が目指される。","医療保険制度の枠組みの中で完結することが目的である。","住まいの確保と居住支援が含まれる。","精神障害の有無や程度にかかわらず、安心して暮らすことが目指される。","支援を受ける者は介護保険制度の要支援認定が必要である。"],"answer":[3,4],"subject":1,"explanation":"精神障害の有無や程度にかかわらず、地域で安心して暮らすことを目指します。医療・福祉に加え、住まいの確保や居住支援も含まれます。"},{"id":11,"question":"次のうち、リハビリテーションの観点から4段階の危機モデルを提唱した人物として、正しいものを1つ選びなさい。","options":["フィンク（Fink, S.）","マズロー（Maslow, A.）","ピアジェ（Piaget, J.）","サリヴァン（Sullivan, H.）","ハヴィガースト（Havighurst, R.）"],"answer":[1],"subject":1,"explanation":"4段階の危機モデルを提唱したのはフィンクです。衝撃、防御的退行、承認、適応の段階で危機への反応を捉えます。"},{"id":12,"question":"製造業を営む企業Ａでは、近年離職者や休職者が増加し、経営上の課題となっていた。精神保健福祉士の資格を持つ人事担当者は、管理職による個々の従業員の労務・心理的環境の把握に課題があると考え、管理職を対象として従業員のメンタルヘルスの管理向上を目的とした対策を計画した。まず管理職に対し年間を通して複数回の研修を行い、メンタルヘルスに関する全般的知識やコーチング、各種のハラスメントに関する理解の促進を図った。さらに部署ごとに職員全体の業務負荷とバランスを検討し、管理職間で改善策を作成することとした。次のうち、人事担当者が改善しようとしたケアとして、適切なものを1つ選びなさい。","options":["プライマリヘルスケア","セルフケア","ラインによるケア","事業場外資源によるケア","グリーフケア"],"answer":[3],"subject":1,"explanation":"「ラインによるケア」は、管理監督者が行う職場の環境改善や部下への相談対応などです。事例では管理職の対応力を高めています。"},{"id":13,"question":"性の多様性に関する次の記述のうち、正しいものを1つ選びなさい。","options":["ジェンダーとは、性的少数者を指す概念である。","性的指向とは、自己の性別の認識を指す概念である。","ＷＨＯが定めるＩＣＤ－11 では、性別不合（gender incongruence）を精神疾患に分類している。","トランスジェンダーは、生物学的・身体的性別と性自認が異なる状態を表す用語である。","ＤＳＭ－5－ＴＲの性別違和（gender dysphoria）の診断には、児童と成人で同じ基準が適用される。"],"answer":[4],"subject":1,"explanation":"トランスジェンダーは、出生時に割り当てられた性別と性自認が一致しない人を指します。性的指向とは別の概念です。"},{"id":14,"question":"次のうち、精神保健における三次予防の活動に該当するものとして、適切なものを1つ選びなさい。","options":["乳幼児健康診査","リワーク支援（職場復帰支援）","ストレスチェック制度","学校における薬物乱用防止教育","一般住民に対するこころの健康教室"],"answer":[2],"subject":1,"explanation":"三次予防は、再発防止や社会復帰を支える取組です。休職した人の職場復帰を支えるリワーク支援が該当します。"},{"id":15,"question":"2歳の男児と1歳の女児を同伴した母親のＡさんが夫の飲酒問題を相談するために保健所を訪れ、Ｂ精神保健福祉士が相談対応をした。Ａさんの訴えは以下のようなものであった。夫は1年ほど前から深酒を繰り返し、体調不良を理由にしばしば仕事も休むようになった。半年前より、酩酊してはＡさんの態度に不満を訴え、大声で罵倒したり、コップや食器を投げたりといった行動を繰り返すようになった。夫が子どもたちの面前でも同様の行動をすることもあってか、男児は夫の姿を見ると怯えた様子を示すことがあり、女児は夜泣きが増えている。夫は反省したのか、この1か月は飲酒をやめていたが、先週の土曜日から再び飲み始め、仕事も休んでいる。病院に行くよう勧めても「俺は病気じゃない」と繰り返すばかりであるとのことだった。次の記述のうち、この時のＢ精神保健福祉士の相談対応として、適切なものを1つ選びなさい。","options":["夫と面談しないと支援計画が立てられないので、まずは夫を連れてくるように話した。","夫が困り果てるまで、できるだけ夫と関わらないように助言した。","飲酒行動の自己コントロール障害なので、家にある酒類は見つけ次第廃棄することを勧めた。","夫の苦労に共感して、暴言もできるだけ受容するように助言した。","児童相談所に通告した上で、自宅訪問を提案した。"],"answer":[5],"subject":1,"explanation":"子どもの目の前でのDVは、心理的虐待に当たります。児童相談所に通告し、母子の安全を確認しながら関係機関と支援します。"},{"id":16,"question":"次のうち、精神的不調の早期発見と予防につながる、精神保健に関する正しい認識や態度・行動を表す用語として、正しいものを1つ選びなさい。","options":["インフォームド・コンセント","メンタルヘルスリテラシー","アドバンス・ケア・プランニング","モラトリアム","アドヒアランス"],"answer":[2],"subject":1,"explanation":"メンタルヘルスリテラシーは、心の健康に関する知識や理解、それに基づく態度・行動を指します。不調の早期発見や適切な相談につながります。"},{"id":17,"question":"精神保健福祉行政に関する次の記述のうち、正しいものを1つ選びなさい。","options":["市町村は、自立支援医療（精神通院医療）の申請窓口である。","児童相談所長は、要保護児童を精神科病院へ措置入院させることができる。","精神保健福祉センターは、精神科病院入院者の退院請求等に関する審査を行う。","福祉事務所は、医療保護の入院届や措置入院者の定期病状報告に関する事務を行う。","保健所は、精神障害者保健福祉手帳の交付事務を行う。"],"answer":[1],"subject":1,"explanation":"自立支援医療のうち精神通院医療は、市町村が申請窓口です。窓口と支給認定の主体を区別しましょう。"},{"id":18,"question":"ＷＨＯ（世界保健機関）のメンタルヘルス・ギャップ・アクション・プログラム（ｍｈＧＡＰ）に関する次の記述のうち、正しいものを1つ選びなさい。","options":["「メンタルヘルスなしに健康なし」を原則とした精神保健行動計画である。","疾患による損失生存年数と障害生存年数を合計して求める健康指標である。","ＳＤＧｓ（持続可能な開発目標）の採択に基づき作成された。","世界各国の精神保健資源に関する基礎データを収集した情報報告書である。","精神保健体制の国家間の格差を縮小することを目的としている。"],"answer":[5],"subject":1,"explanation":"mhGAPは、精神保健サービスの不足を改善するWHOの取組です。特に低・中所得国での支援拡充を通じ、格差の縮小を目指します。"},{"id":19,"question":"ある日、精神科病院に勤務するＡ精神保健福祉士は、週明けに行われた担当病棟の看護部の申し送りで、3か月前に入院した患者Ｂさん（30代、男性）の祖父が亡くなったことを知った。Ｂさんは幼い時に両親が離婚し、その後は母親の実家で育てられ、祖父を大変慕っていた。先週末に母親から病棟スタッフへ電話があり「本来はＢも葬儀に参列するべきであるが、祖父が亡くなったことへのショックや、慌ただしい葬儀への立会いの負担が病状に影響を与えるかもしれず、家族としても対応を決めかねている」とのことであった。そこで両者で検討の末、ようやく病状が落ち着いてきたＢさんには、今は知らせずに葬儀を執り行うことを決定したとのことであった。申し送りでその報告を聞いたＡ精神保健福祉士は、家族の気持ちは理解できるものの、一連の対応に何か釈然としないものを感じた。次のうち、Ｂさんに対する周囲の一連の対応を象徴するものとして、適切なものを1つ選びなさい。","options":["パターナリズム","マルトリートメント","インスティテューショナリズム","施設コンフリクト","イネイブリング"],"answer":[1],"subject":2,"explanation":"本人のためになると考え、周囲が本人の意思を確かめずに判断することをパターナリズムといいます。事例では本人に知らせず対応を決めています。"},{"id":20,"question":"次のうち、「精神保健福祉法」の精神障害者の定義に示されているものとして、正しいものを1つ選びなさい。","options":["社会的障壁により継続的に日常生活又は社会生活に相当な制限を受ける状態にある者","精神作用物質による急性中毒又はその依存症の者","発病の機構が明らかでなく、かつ、治療方法が確立していない希少な疾病の者","職業生活を営むことが著しく困難な者","静止時振戦、筋固縮、寡動・無動、姿勢反射障害の症状がみられる者"],"answer":[2],"subject":2,"note":"「精神保健福祉法」とは、「精神保健及び精神障害者福祉に関する法律」のことである。","explanation":"精神保健福祉法の精神障害者の定義には、精神作用物質による急性中毒や、その依存症が含まれます。"},{"id":21,"question":"精神保健福祉の歴史に関する次の記述のうち、正しいものを1つ選びなさい。","options":["バザーリア（Basaglia, F.）は、精神障害者を鎖から解放し人間的な処遇を提唱した。","ビアーズ（Beers, C.）は、自らの入院の体験を著し精神衛生運動に取り組んだ。","ピネル（Pinel, P.）は、精神科病院の廃止を訴え法律第180 号の制定運動に関わった。","ジョーンズ（Jones, M.）は、日本における私宅監置の状況を調査し医療施設の整備を主張した。","サリービー（Saleebey, D.）は、マディソン市でＡＣＴ（包括型地域生活支援プログラム）モデルの原型を創った。"],"answer":[2],"subject":2,"explanation":"ビアーズは、自らの精神科病院への入院体験を著し、精神衛生運動に取り組みました。ピネルやバザーリアの実績と区別しましょう。"},{"id":22,"question":"次のうち、障害者の権利に関する条約の批准に向けた国内法の整備にも関連し、新たに成立した法律として、正しいものを2つ選びなさい。","options":["障害者基本法","障害者自立支援法","「障害者差別解消法」","「障害者虐待防止法」","「障害者雇用促進法」"],"answer":[3,4],"subject":2,"note":"1 「障害者差別解消法」とは、「障害を理由とする差別の解消の推進に関する法律」のことである。\n2 「障害者虐待防止法」とは、「障害者虐待の防止、障害者の養護者に対する支援等に関する法律」のことである。\n3 「障害者雇用促進法」とは、「障害者の雇用の促進等に関する法律」のことである。","explanation":"障害者権利条約の批准に向けた国内法整備の中で、障害者差別解消法と障害者虐待防止法が新たに成立しました。"},{"id":23,"question":"次のうち、リカバリーを論じた際に、「多くの精神障害者は地域で暮らし、働き、愛し、重要な貢献をすることを求めている」旨を主張した人物として、正しいものを1つ選びなさい。","options":["ゴッフマン（Goffman, E.）","リバーマン（Liberman, R.）","ディーガン（Deegan, P.）","ウイング（Wing, J.）","マイヤー（Meyer, A.）"],"answer":[3],"subject":2,"explanation":"ディーガンは、精神障害の当事者としてリカバリーを論じました。症状の改善だけでなく、自分にとって意味のある人生を生きることを重視します。"},{"id":24,"question":"次の記述のうち、精神保健福祉士の援助における循環的関係を表すものとして、正しいものを1つ選びなさい。","options":["認知能力が低下しているクライエントに代わって、金銭管理を行った。","退院後の生活について、クライエントの希望を尊重し折り合いをつけながら支援計画を立てた。","提供できる医療や福祉サービスの内容を説明し、クライエントからサービス利用の同意を得た。","職場環境を改善するために、クライエントと共に精神障害に関する従業員の理解を促した。","クライエントの体験の語りに続く双方向のやり取りによって、共に相手の見方を通して、自分の見方を見直した。"],"answer":[5],"subject":2,"explanation":"循環的関係では、本人と援助者が互いに影響を受け、自分の見方を見直します。一方向に教えたり支援したりするだけではありません。"},{"id":25,"question":"次のうち、このエピソードの背景にあるものとして、適切なものを1つ選びなさい。\n\n〔事例〕\n相談支援事業所に勤務するＡ精神保健福祉士は、「障害者総合支援法」に基づき市に設置されている協議会の委員を務めている。Ａ精神保健福祉士は、協議会が主催する精神保健福祉ボランティア講座の講師を担った。精神障害に関する講義の後に行ったグループワークで、ある参加者から、知人が「精神障害者は危険なので病院に閉じ込めておくべきだ」と強く語っていたこと、その考えは誤りであると否定したが、うまく納得してもらえなかったエピソードが紹介された。（問題25）\n\nＡ精神保健福祉士は、このエピソードの背景にある課題の解決に向けた取組が必要と考え、協議会で問題提起した。そこで、Ａ精神保健福祉士は、この課題解決の取組を検討する議論に精神障害の当事者も加わり意見を反映させることが重要であると考え、当事者を委員に加えることを提案し、了承された。（問題26）\n\n次の協議会で、提起した課題が議論された。新たに参加した当事者委員から「病気になる前はストレスフルな状況が続いても無理をしていたが、自分が精神疾患になるとは思っていなかった」と語られた。また、病気になって周囲から差別を受けたり、精神疾患を理由に恋人との結婚を周囲から反対されたりしたこと、そのうち、障害者の仲間以外との関わりがほとんど無くなったことなど、生活での苦労の経験が語られた。一方で、Ａ精神保健福祉士がそれらの経験の中で得たことを質問すると、近所に病気や苦労を理解してくれる人がいて救われたことや、新たな生き方に価値を見いだせるようになったことが当事者委員から語られた。Ａ精神保健福祉士は、当事者委員が語った苦労の背景にある課題の改善に向けて、精神障害者の人生の価値を共有できるような市民向けの講座を行うことを提案した。協議会では他にも活発な意見が出され、講座の計画が作成された。（問題27）","options":["倫理的ジレンマ","マージナルマン","二重拘束性","スティグマ","優生思想"],"answer":[4],"subject":2,"explanation":"スティグマは、特定の属性に否定的な意味を結びつける社会的な烙印です。精神障害のある人を一律に危険とみなす偏見が該当します。","note":"「障害者総合支援法」とは、「障害者の日常生活及び社会生活を総合的に支援するための法律」のことである。"},{"id":26,"question":"次のうち、Ａ精神保健福祉士の提案の根拠となるものとして、適切なものを1つ選びなさい。\n\n〔事例〕\n相談支援事業所に勤務するＡ精神保健福祉士は、「障害者総合支援法」に基づき市に設置されている協議会の委員を務めている。Ａ精神保健福祉士は、協議会が主催する精神保健福祉ボランティア講座の講師を担った。精神障害に関する講義の後に行ったグループワークで、ある参加者から、知人が「精神障害者は危険なので病院に閉じ込めておくべきだ」と強く語っていたこと、その考えは誤りであると否定したが、うまく納得してもらえなかったエピソードが紹介された。（問題25）\n\nＡ精神保健福祉士は、このエピソードの背景にある課題の解決に向けた取組が必要と考え、協議会で問題提起した。そこで、Ａ精神保健福祉士は、この課題解決の取組を検討する議論に精神障害の当事者も加わり意見を反映させることが重要であると考え、当事者を委員に加えることを提案し、了承された。（問題26）\n\n次の協議会で、提起した課題が議論された。新たに参加した当事者委員から「病気になる前はストレスフルな状況が続いても無理をしていたが、自分が精神疾患になるとは思っていなかった」と語られた。また、病気になって周囲から差別を受けたり、精神疾患を理由に恋人との結婚を周囲から反対されたりしたこと、そのうち、障害者の仲間以外との関わりがほとんど無くなったことなど、生活での苦労の経験が語られた。一方で、Ａ精神保健福祉士がそれらの経験の中で得たことを質問すると、近所に病気や苦労を理解してくれる人がいて救われたことや、新たな生き方に価値を見いだせるようになったことが当事者委員から語られた。Ａ精神保健福祉士は、当事者委員が語った苦労の背景にある課題の改善に向けて、精神障害者の人生の価値を共有できるような市民向けの講座を行うことを提案した。協議会では他にも活発な意見が出され、講座の計画が作成された。（問題27）","options":["Nothing about us without us（私たち抜きに私たちのことを決めるな）","「この子らを世の光に」","当事者研究","「ダメ。ゼッタイ。」普及運動","「ごく当たり前の生活」"],"answer":[1],"subject":2,"explanation":"「私たち抜きに私たちのことを決めるな」は、当事者の参加と意見の反映を求める理念です。当事者を協議会の委員に加える提案が当たります。","note":"「障害者総合支援法」とは、「障害者の日常生活及び社会生活を総合的に支援するための法律」のことである。"},{"id":27,"question":"次のうち、この場面で協議会が計画を作成する際に、根拠にしたものとして、適切なものを1つ選びなさい。\n\n〔事例〕\n相談支援事業所に勤務するＡ精神保健福祉士は、「障害者総合支援法」に基づき市に設置されている協議会の委員を務めている。Ａ精神保健福祉士は、協議会が主催する精神保健福祉ボランティア講座の講師を担った。精神障害に関する講義の後に行ったグループワークで、ある参加者から、知人が「精神障害者は危険なので病院に閉じ込めておくべきだ」と強く語っていたこと、その考えは誤りであると否定したが、うまく納得してもらえなかったエピソードが紹介された。（問題25）\n\nＡ精神保健福祉士は、このエピソードの背景にある課題の解決に向けた取組が必要と考え、協議会で問題提起した。そこで、Ａ精神保健福祉士は、この課題解決の取組を検討する議論に精神障害の当事者も加わり意見を反映させることが重要であると考え、当事者を委員に加えることを提案し、了承された。（問題26）\n\n次の協議会で、提起した課題が議論された。新たに参加した当事者委員から「病気になる前はストレスフルな状況が続いても無理をしていたが、自分が精神疾患になるとは思っていなかった」と語られた。また、病気になって周囲から差別を受けたり、精神疾患を理由に恋人との結婚を周囲から反対されたりしたこと、そのうち、障害者の仲間以外との関わりがほとんど無くなったことなど、生活での苦労の経験が語られた。一方で、Ａ精神保健福祉士がそれらの経験の中で得たことを質問すると、近所に病気や苦労を理解してくれる人がいて救われたことや、新たな生き方に価値を見いだせるようになったことが当事者委員から語られた。Ａ精神保健福祉士は、当事者委員が語った苦労の背景にある課題の改善に向けて、精神障害者の人生の価値を共有できるような市民向けの講座を行うことを提案した。協議会では他にも活発な意見が出され、講座の計画が作成された。（問題27）","options":["ヘルパー・セラピー原則","こころのバリアフリー宣言","労働者の心の健康の保持増進のための指針","クラーク勧告","障害福祉サービス等の提供に係る意思決定支援ガイドライン"],"answer":[2],"subject":2,"explanation":"こころのバリアフリー宣言は、精神疾患への理解を深め、偏見をなくし、互いに支え合う社会を目指すものです。人生の価値を共有する講座に合います。","note":"「障害者総合支援法」とは、「障害者の日常生活及び社会生活を総合的に支援するための法律」のことである。"},{"id":28,"question":"次のうち、ソーシャルワークにおける「価値」として、正しいものを1つ選びなさい。","options":["援助関係形成の技術","自己覚知","多職種との連携","社会正義","専門的な知識"],"answer":[4],"subject":3,"explanation":"社会正義は、ソーシャルワークが大切にする価値です。援助技術や知識とは区別して捉えます。"},{"id":29,"question":"次の記述のうち、不登校傾向のある中学生に対するスクールソーシャルワーカー（精神保健福祉士）による初回面接時の関わりとして、適切なものを1つ選びなさい。","options":["話す言葉と同様に、本人の表情や態度からメッセージを捉える。","言葉と行動の不一致を明らかにして、本人に示す。","気持ちの同一化を図るため、精神保健福祉士自身の生活歴を話す。","不登校の理由が明確になるまで、質問を続ける。","友人のように接することで、陽性転移を生じさせる。"],"answer":[1],"subject":3,"explanation":"初回面接では、安心できる関係づくりが大切です。言葉だけでなく、表情や態度などの非言語的なメッセージにも目を向けます。"},{"id":30,"question":"次の記述のうち、アルコール依存症者の配偶者の態度変化に関するジャクソンの7段階説の第1段階に当てはまるものとして、正しいものを1つ選びなさい。","options":["飲酒する本人を無視したり、軽んじたりする。","家族関係がうまくいくように、飲酒を続ける本人と別居することを決心する。","飲酒する本人への対応方法が分からないまま、一人で問題を取り除こうとする。","家族の情緒的交流が解体し、家族としての目標を失う。","本人の飲酒問題を否認し、困惑しながら生活する。"],"answer":[5],"subject":3,"explanation":"ジャクソンの7段階説では、第1段階は飲酒問題の「否認」です。問題を認められず、困惑しながら生活する段階です。"},{"id":31,"question":"次の記述のうち、異なる機関に所属する専門職で構成されるチームの形成期の説明として、正しいものを1つ選びなさい。","options":["各構成員が能力を発揮し、強い信頼関係が生まれる。","チームマネジメントの状況について構成員間で評価し、新たな目標を設定する。","各構成員が自らの所属機関の機能を説明し、相互理解を深める。","各構成員の課題解決に対する意見の食い違いが表面化する。","構成員が一致団結し、目標達成に向けて活動する。"],"answer":[3],"subject":3,"explanation":"チームの形成期は、互いの役割や所属機関の機能を知り、理解を深める段階です。目標に向けて協働する土台をつくります。"},{"id":32,"question":"次の記述のうち、精神保健福祉士が行うコミュニティワークとして、適切なものを2つ選びなさい。","options":["薬物依存症の回復者と共に、薬物依存症の理解を促す市民講演会を開催する。","支援を拒む精神障害者の自宅を繰り返し訪問する。","身寄りの無い精神障害者がアパートを借りる際の保証人を探す。","地域若者サポートステーションの就労支援プログラムを担当する。","精神保健福祉領域で活動できるボランティアを育成する。"],"answer":[1,5],"subject":3,"explanation":"コミュニティワークは、地域の理解や支援体制を育てる働きかけです。市民講演会の開催とボランティアの育成が該当します。"},{"id":33,"question":"震災から数年後のある日、地域活動支援センターを利用しているＡさんは「震災の時の避難所は、人の声が途切れないし、人に見られている感じが息苦しかった。中に居られなかったので、車内で過ごした。とても不安で、体調も不安定になった。つらいことを誰にも言えず、我慢するしかなかった」とＢ精神保健福祉士に話した。後日開催された「協議会」の部会でも、同様の事例が幾つか出ていた。そこでＢ精神保健福祉士は、精神障害者の災害時避難対策のワーキンググループ設置を提案し、承認された。そして、早速活動を開始した。次の記述のうち、ワーキンググループ初期段階の活動として、最も適切なものを1つ選びなさい。","options":["避難所に個室ユニットを作る簡易テント購入のため、クラウドファンディングで資金を募る。","市に対して、メンタルヘルスに特化した避難所ガイドラインの作成を要望する。","精神障害当事者とその家族や支援者の声を集約し、困りごとを可視化する。","精神疾患の理解のため、啓発動画を作成して、ＳＮＳを通じて発信する。","地域防災フォーラムに当事者が登壇し、新たな仕組みを提案する機会を設ける。"],"answer":[3],"subject":3,"note":"「協議会」とは、「障害者の日常生活及び社会生活を総合的に支援するための法律」に基づき行われる協議会のことである。","explanation":"初期段階では、まず当事者・家族・支援者の声を集め、困りごとを把握します。その結果をもとに具体策を検討します。"},{"id":34,"question":"次の記述のうち、Ａ精神保健福祉士がこの場面で行うこととして、適切なものを1つ選びなさい。\n\n〔事例〕\nＡ精神保健福祉士（23歳、男性）は大学卒業後、精神科病院に就職し、精神科デイケアの担当となって半年が過ぎた。日々の業務には慣れてきたものの、経験の長いＢ精神保健福祉士の補助的な役割を担うことが多かった。ある日のスタッフ会議で、Ａ精神保健福祉士が翌月からプログラム活動を一つ企画して担当することになった。Ａ精神保健福祉士は、デイケアメンバーとの雑談の中で、運動不足を解消したいという声を幾つか聞き、軽スポーツのプログラム活動を企画立案した。5名のメンバーの参加があり、初回ミーティングを開いた。そこでＡ精神保健福祉士は、そのミーティングでグループワーカーを務めた。（問題34）\n\nプログラム活動が始まって3回目から、新たにデイケアを利用開始したＣさん（24歳、男性）が加わった。Ｃさんは、大学生だった21歳の時に統合失調症と診断され、外来通院していた。記録では、中学生の時にいじめられた出来事があり、人間関係に苦手意識があるとのことだった。当初のＣさんは、他のメンバーと距離を置き、活動にほとんど参加しなかった。そこでＡ精神保健福祉士は、Ｃさんが孤立するのを防ごうと面接を行った。Ｃさんは「みんなと話せるようになりたいけど、中学の時みたいになったらどうしようとも思う。自分がよく分からない」と語った。（問題35）\n\nその面接後、Ｃさんは、少しずつではあるが活動に参加するようになっていった。しかし、過去の出来事から、新たに参加した特定のメンバーが近づくと急に席を離れる等の反応を示し、場の雰囲気を悪くしてしまうことが度々あった。Ａ精神保健福祉士が、Ｃさんのその態度を面接で取り上げたところ、それ以降、ＣさんはＡ精神保健福祉士を避けるようになった。そこで、Ａ精神保健福祉士はＣさんとの関わりについて、Ｂ精神保健福祉士に時間をとってもらい、面談室で相談した。（問題36）\n\nその後、Ａ精神保健福祉士はＣさんとの関係を改善することができた。今ではＣさんもデイケアに馴染み、就労に関心を示すようになってきた。","options":["活動が停滞しないように、メンバーと活動目標を再確認する。","メンバー全員で各自の課題の達成状況の確認を行う。","メンバー間で起こる葛藤に、積極的に介入する。","グループの課題とメンバー各自の課題の解決が進むよう、メンバーに働きかける。","目標に向けた合意形成を図るために、メンバー間の意見交換を促進させる。"],"answer":[5],"subject":3,"explanation":"初回ミーティングでは、参加者の意見交換を促し、目標に向けた合意をつくります。参加者が主体的に関われるよう支えます。"},{"id":35,"question":"次の記述のうち、この時のＡ精神保健福祉士の対応として、適切なものを1つ選びなさい。\n\n〔事例〕\nＡ精神保健福祉士（23歳、男性）は大学卒業後、精神科病院に就職し、精神科デイケアの担当となって半年が過ぎた。日々の業務には慣れてきたものの、経験の長いＢ精神保健福祉士の補助的な役割を担うことが多かった。ある日のスタッフ会議で、Ａ精神保健福祉士が翌月からプログラム活動を一つ企画して担当することになった。Ａ精神保健福祉士は、デイケアメンバーとの雑談の中で、運動不足を解消したいという声を幾つか聞き、軽スポーツのプログラム活動を企画立案した。5名のメンバーの参加があり、初回ミーティングを開いた。そこでＡ精神保健福祉士は、そのミーティングでグループワーカーを務めた。（問題34）\n\nプログラム活動が始まって3回目から、新たにデイケアを利用開始したＣさん（24歳、男性）が加わった。Ｃさんは、大学生だった21歳の時に統合失調症と診断され、外来通院していた。記録では、中学生の時にいじめられた出来事があり、人間関係に苦手意識があるとのことだった。当初のＣさんは、他のメンバーと距離を置き、活動にほとんど参加しなかった。そこでＡ精神保健福祉士は、Ｃさんが孤立するのを防ごうと面接を行った。Ｃさんは「みんなと話せるようになりたいけど、中学の時みたいになったらどうしようとも思う。自分がよく分からない」と語った。（問題35）\n\nその面接後、Ｃさんは、少しずつではあるが活動に参加するようになっていった。しかし、過去の出来事から、新たに参加した特定のメンバーが近づくと急に席を離れる等の反応を示し、場の雰囲気を悪くしてしまうことが度々あった。Ａ精神保健福祉士が、Ｃさんのその態度を面接で取り上げたところ、それ以降、ＣさんはＡ精神保健福祉士を避けるようになった。そこで、Ａ精神保健福祉士はＣさんとの関わりについて、Ｂ精神保健福祉士に時間をとってもらい、面談室で相談した。（問題36）\n\nその後、Ａ精神保健福祉士はＣさんとの関係を改善することができた。今ではＣさんもデイケアに馴染み、就労に関心を示すようになってきた。","options":["Ｃさんの日常生活の課題を抽出し、解決策を提案した。","Ｃさんが自分の気持ちに気付けるように、両価的な気持ちを明確にした。","Ｃさんの過去の出来事に焦点を当て、その原因を究明した。","他のメンバーとの距離が近づくように、具体的な方法を教えた。","前もって準備した質問項目に沿って、Ｃさんから情報を聞き取った。"],"answer":[2],"subject":3,"explanation":"「話したい」と「また傷つくのが怖い」という両方の気持ちがあります。この両価的な気持ちを整理し、本人の気づきを支えます。"},{"id":36,"question":"次の記述のうち、この場面でＢ精神保健福祉士がＡ精神保健福祉士に対して行ったこととして、適切なものを1つ選びなさい。\n\n〔事例〕\nＡ精神保健福祉士（23歳、男性）は大学卒業後、精神科病院に就職し、精神科デイケアの担当となって半年が過ぎた。日々の業務には慣れてきたものの、経験の長いＢ精神保健福祉士の補助的な役割を担うことが多かった。ある日のスタッフ会議で、Ａ精神保健福祉士が翌月からプログラム活動を一つ企画して担当することになった。Ａ精神保健福祉士は、デイケアメンバーとの雑談の中で、運動不足を解消したいという声を幾つか聞き、軽スポーツのプログラム活動を企画立案した。5名のメンバーの参加があり、初回ミーティングを開いた。そこでＡ精神保健福祉士は、そのミーティングでグループワーカーを務めた。（問題34）\n\nプログラム活動が始まって3回目から、新たにデイケアを利用開始したＣさん（24歳、男性）が加わった。Ｃさんは、大学生だった21歳の時に統合失調症と診断され、外来通院していた。記録では、中学生の時にいじめられた出来事があり、人間関係に苦手意識があるとのことだった。当初のＣさんは、他のメンバーと距離を置き、活動にほとんど参加しなかった。そこでＡ精神保健福祉士は、Ｃさんが孤立するのを防ごうと面接を行った。Ｃさんは「みんなと話せるようになりたいけど、中学の時みたいになったらどうしようとも思う。自分がよく分からない」と語った。（問題35）\n\nその面接後、Ｃさんは、少しずつではあるが活動に参加するようになっていった。しかし、過去の出来事から、新たに参加した特定のメンバーが近づくと急に席を離れる等の反応を示し、場の雰囲気を悪くしてしまうことが度々あった。Ａ精神保健福祉士が、Ｃさんのその態度を面接で取り上げたところ、それ以降、ＣさんはＡ精神保健福祉士を避けるようになった。そこで、Ａ精神保健福祉士はＣさんとの関わりについて、Ｂ精神保健福祉士に時間をとってもらい、面談室で相談した。（問題36）\n\nその後、Ａ精神保健福祉士はＣさんとの関係を改善することができた。今ではＣさんもデイケアに馴染み、就労に関心を示すようになってきた。","options":["プログラム活動のメンバーを追加募集する方針を提示した。","Ｃさんとの関わりを振り返り、Ｃさんの行動の背景を考えさせた。","病院の理念を一緒に再確認した。","医学的な知見からＣさんに関する助言を得られるように、主治医と調整した。","プログラム活動の担当から外れることを提案した。"],"answer":[2],"subject":3,"explanation":"経験のある職員が、援助場面を一緒に振り返り、本人の行動の背景を考えるよう支援しています。スーパービジョンの教育的な働きです。"},{"id":37,"question":"次の記述のうち、精神障害リハビリテーションにおける資源のアセスメントに関する内容として、正しいものを1つ選びなさい。","options":["利用者の職場実習を行い、職業能力を評価する。","利用者のニーズと社会資源を結び付ける。","既存の社会資源を利用者が使いやすいように調整する。","利用者を取り巻く環境の情報を収集し、分析する。","地域に就労支援機関がないので、行政機関に設置を働きかける。"],"answer":[4],"subject":4,"explanation":"資源のアセスメントは、本人を取り巻く人や機関、生活環境などの情報を集めて分析することです。資源の調整や開発とは区別します。"},{"id":38,"question":"次の記述のうち、ＩＰＳ（Individual Placement and Support）モデルの特徴として、正しいものを1つ選びなさい。","options":["福祉的就労から始め、一般就労へのステップアップを目指す。","援助対象者の決定は、職業能力評価の結果に基づく。","支援は、一般就労した時点で終了となる。","就労先は、対象者の障害特性や職業能力に合わせて選定する。","就労支援と共に経済的側面に関する相談支援も行う。"],"answer":[5],"subject":4,"explanation":"IPSでは、本人の希望に沿った一般就労を支え、就職後も支援します。働くことによる収入や社会保障給付への影響などの相談も行います。"},{"id":39,"question":"2週間前に3 度目の入院をしてきたアルコール依存症のＡさん（35歳、男性）が、依存症病棟に勤務するＢ精神保健福祉士に「昨日の依存症プログラムに参加して、今度こそは断酒を頑張ってみようと思っている。今まで仕事のストレスを紛らわすために飲酒を繰り返し、仕事にも支障が出て、何度も会社から注意を受けたがやめられなくて、結局解雇されてしまった。本当に情けない。これまで何度も断酒しようとしては失敗しているから、自分には断酒できないのではないかと不安になる。こんな自分を妻はいつも心配し見守ってくれているが、これ以上妻に心配や迷惑をかけたくない。だから、今度こそは」と話した。そこで後日、Ｂ精神保健福祉士は、Ａさんの断酒に向けた動機を強化するための面接を行うことにした。次の記述のうち、面接での対応として、適切なものを1つ選びなさい。","options":["断酒ができた後の配偶者との生活について想像することを促す。","このままだと配偶者からも見放されるかもしれないので、断酒は必要であると助言する。","今までの生活について簡潔にまとめ、一緒に飲酒による失敗経験を可視化する。","退院後の就職活動のために、今からできることを一緒に考えようと提案する。","飲酒をしたくなったら、散歩などで体を動かして気分を変えることを提案する。"],"answer":[1],"subject":4,"explanation":"断酒後に望む生活を具体的に想像すると、本人が大切にしていることと断酒が結びつきます。本人の内側からの動機を強める対応です。"},{"id":40,"question":"次の記述のうち、Ｂワーカーが大学へ提案した内容として、適切なものを1つ選びなさい。\n\n〔事例〕\n大学1年生のＡさん（18歳、男性）は、前期の成績で多くの単位を落としてしまった。成績を見た母親が大学に相談したところ、学生支援室を紹介された。数日後、Ａさんと母親は学生支援室のキャンパスソーシャルワーカーであるＢ精神保健福祉士（以下「Ｂワーカー」という。）の元を訪れ、面談した。母親は「Ａは、小学校入学後に落ち着きの無さが目立ち、専門医の受診を勧められ、発達障害と診断された。高校までは学校側に発達障害を伝え、教員のサポートを受けて大きな問題は生じずに卒業できた。大学ではこれまでのようなサポートを申請するか迷っていた」と話した。Ｂワーカーは、本学には障害学生支援制度（以下「支援制度」という。）があり、これまでも支援制度を利用している学生が居ることなどを説明すると、Ａさんと母親は安心して申請を希望した。面談後、Ｂワーカーは発達障害がある学生が大学に相談に来ることも増えてきたことを踏まえ、今後大学として改めて取り組むべき事柄を、大学に提案した。（問題40）\n\nＡさんとＢワーカーは支援制度の申請に向けて面談を重ねた。Ａさんは、自分の発達障害について詳しいことは理解できていないとのことだった。そこでＢワーカーは、支援制度の申請と共に、学生支援室が後期に心理教育プログラムとして月1回の全6回シリーズで行う「発達障害についての学習会（以下「学習会」という。）」への参加を勧めた。（問題41）\n\nその後、Ａさんは支援制度を受けることになり、2年生時には単位を取得できるようになった。また、Ｂワーカーとの面談時に「半年にわたる学習会に参加して、自分のつらさを分かり合える仲間が居て、自分は一人ではないと実感でき、とてもうれしかった。自分のように困っている学生が学内で孤立しなくなる方法はないか、発達障害についてみんなに知ってもらうにはどうすれば良いか」と話した。そこで学習会の仲間と一緒に今度の大学祭で「発達障害のことを知ろう」という発表会の企画を開催することにした。（問題42）","options":["発達障害がある学生専用の学生寮を設置する。","発達障害がある学生に選択させるための合理的配慮内容のリストを前もって用意する。","教職員全員に向けて発達障害についての研修会を実施する。","障害の程度によって、単位認定基準を緩和することとする。","本人及び保護者以外の誰からでも支援制度の申請を可能にする。"],"answer":[3],"subject":4,"explanation":"教職員全体の理解を深める研修は、大学としての支援体制づくりにつながります。合理的配慮は本人との対話を通じて個別に検討します。"},{"id":41,"question":"次の記述のうち、この学習会の目的と方法として、最も適切なものを1つ選びなさい。\n\n〔事例〕\n大学1年生のＡさん（18歳、男性）は、前期の成績で多くの単位を落としてしまった。成績を見た母親が大学に相談したところ、学生支援室を紹介された。数日後、Ａさんと母親は学生支援室のキャンパスソーシャルワーカーであるＢ精神保健福祉士（以下「Ｂワーカー」という。）の元を訪れ、面談した。母親は「Ａは、小学校入学後に落ち着きの無さが目立ち、専門医の受診を勧められ、発達障害と診断された。高校までは学校側に発達障害を伝え、教員のサポートを受けて大きな問題は生じずに卒業できた。大学ではこれまでのようなサポートを申請するか迷っていた」と話した。Ｂワーカーは、本学には障害学生支援制度（以下「支援制度」という。）があり、これまでも支援制度を利用している学生が居ることなどを説明すると、Ａさんと母親は安心して申請を希望した。面談後、Ｂワーカーは発達障害がある学生が大学に相談に来ることも増えてきたことを踏まえ、今後大学として改めて取り組むべき事柄を、大学に提案した。（問題40）\n\nＡさんとＢワーカーは支援制度の申請に向けて面談を重ねた。Ａさんは、自分の発達障害について詳しいことは理解できていないとのことだった。そこでＢワーカーは、支援制度の申請と共に、学生支援室が後期に心理教育プログラムとして月1回の全6回シリーズで行う「発達障害についての学習会（以下「学習会」という。）」への参加を勧めた。（問題41）\n\nその後、Ａさんは支援制度を受けることになり、2年生時には単位を取得できるようになった。また、Ｂワーカーとの面談時に「半年にわたる学習会に参加して、自分のつらさを分かり合える仲間が居て、自分は一人ではないと実感でき、とてもうれしかった。自分のように困っている学生が学内で孤立しなくなる方法はないか、発達障害についてみんなに知ってもらうにはどうすれば良いか」と話した。そこで学習会の仲間と一緒に今度の大学祭で「発達障害のことを知ろう」という発表会の企画を開催することにした。（問題42）","options":["これまでの問題や困難の原因は環境要因でないことを理解する。","支援者の援助方針に従うことで問題解決が進むことを強調する。","発達障害の概念を専門的な用語を用いて説明する。","参加者同士の交流を学習会以外で行わないように注意する。","参加者がこれまでの生活でうまく対処できた点に着目する。"],"answer":[5],"subject":4,"explanation":"心理教育では、障害の理解に加え、本人がすでにできている対処にも注目します。成功経験や強みを今後の生活に生かします。"},{"id":42,"question":"次のうち、Ａさんたちが大学祭で企画した活動として、適切なものを1つ選びなさい。\n\n〔事例〕\n大学1年生のＡさん（18歳、男性）は、前期の成績で多くの単位を落としてしまった。成績を見た母親が大学に相談したところ、学生支援室を紹介された。数日後、Ａさんと母親は学生支援室のキャンパスソーシャルワーカーであるＢ精神保健福祉士（以下「Ｂワーカー」という。）の元を訪れ、面談した。母親は「Ａは、小学校入学後に落ち着きの無さが目立ち、専門医の受診を勧められ、発達障害と診断された。高校までは学校側に発達障害を伝え、教員のサポートを受けて大きな問題は生じずに卒業できた。大学ではこれまでのようなサポートを申請するか迷っていた」と話 院したが「今度はしっかり治してほしい」という両親の強い意向もあり、入院が約5年続いている。入院当初、Ａさんは周囲の言動に敏感に反応し、被害的となり暴言を吐くことも多かった。しかし最近では職員の話に耳を傾けるようになり、これまで避けてきたプログラムに参加し始めた。そこで、自分の病気と向き合い、次第に服薬の必要性を理解するようになると穏やかに過ごせる日が増えてきた。そのため、入院形態がＡさんの意思による入院に変更された。（問題46）\n\nある日、Ａさんは担当のＢ精神保健福祉士に「これ以上親に迷惑をかけたくない。だからこのまま入院する」と話した。このため、Ｂ精神保健福祉士はＡさんの思いに寄り添いつつ、主治医と相談し、入院中から住居の確保など退院の準備を行う「障害者総合支援法」に基づくサービスをＡさんに紹介した。初めは利用を拒んでいたＡさんも、面談を繰り返すうちに気持ちが前向きになっていき、そのサービスの利用に同意した。（問題47）\n\n支給決定後、施設見学などが行われていくと、病院の外に出ることが不安だったＡさんも「少しずつ慣れていきたい」と語るようになっていた。そうした中、Ａさんは「アパートでの一人暮らしに自信がない。相談できる人がすぐ近くに居ないのは心細い」と具体的な不安を口にした。そこで、Ｂ精神保健福祉士から、日常生活の支援が受けられる住居を提供する障害福祉サービスがあると伝えると、Ａさんは「興味がある」と関心を示した。（問題48）","options":["精神保健指定医が必要と認めれば、72 時間に限り退院制限ができる。","患者による処遇改善の請求権は対象外である。","病院の管理者は、入院後6か月ごとの入院継続の同意確認が義務づけられている。","退院後生活環境相談員が選任される。","入院には精神保健指定医の診察が不可欠である。"],"answer":[1],"subject":5,"explanation":"本人の意思による入院に変わったため、任意入院です。退院の申出があっても、指定医が入院継続を必要と判断した場合は72時間に限り制限できます。"},{"id":47,"question":"次の記述のうち、Ｂ精神保健福祉士が提案したサービスに関する説明として、正しいものを1つ選びなさい。\n\n〔事例〕\nＡさん（50歳、男性）は、20代後半に幻聴に悩まされるようになった。そのため、精神科を受診したところ、統合失調症と診断された。その後、勤務先を退職して両親の暮らす実家でひきこもる生活となった。服薬に抵抗感のあったＡさんは、やがて「両親が自分のことを生きていても意味がないと思っている」と信じ込むようになった。その影響から自宅で暴力的な言動が現れるようになり、通院先の病院で親の同意により入院することとなった。それ以降もＡさんは怠薬により入退院を繰り返し、40代半ばに再び入院したが「今度はしっかり治してほしい」という両親の強い意向もあり、入院が約5年続いている。入院当初、Ａさんは周囲の言動に敏感に反応し、被害的となり暴言を吐くことも多かった。しかし最近では職員の話に耳を傾けるようになり、これまで避けてきたプログラムに参加し始めた。そこで、自分の病気と向き合い、次第に服薬の必要性を理解するようになると穏やかに過ごせる日が増えてきた。そのため、入院形態がＡさんの意思による入院に変更された。（問題46）\n\nある日、Ａさんは担当のＢ精神保健福祉士に「これ以上親に迷惑をかけたくない。だからこのまま入院する」と話した。このため、Ｂ精神保健福祉士はＡさんの思いに寄り添いつつ、主治医と相談し、入院中から住居の確保など退院の準備を行う「障害者総合支援法」に基づくサービスをＡさんに紹介した。初めは利用を拒んでいたＡさんも、面談を繰り返すうちに気持ちが前向きになっていき、そのサービスの利用に同意した。（問題47）\n\n支給決定後、施設見学などが行われていくと、病院の外に出ることが不安だったＡさんも「少しずつ慣れていきたい」と語るようになっていた。そうした中、Ａさんは「アパートでの一人暮らしに自信がない。相談できる人がすぐ近くに居ないのは心細い」と具体的な不安を口にした。そこで、Ｂ精神保健福祉士から、日常生活の支援が受けられる住居を提供する障害福祉サービスがあると伝えると、Ａさんは「興味がある」と関心を示した。（問題48）","options":["地域相談支援の一つである。","入院期間が1年未満の者は対象外である。","申請窓口は精神保健福祉センターである。","利用期間は原則2年以内である。","指定特定相談支援事業所が支援を実施する。"],"answer":[1],"subject":5,"explanation":"退院に向けた住居の確保や外出同行などを行うのは地域移行支援です。地域定着支援とともに「地域相談支援」に位置づけられます。"},{"id":48,"question":"次のうち、Ｂ精神保健福祉士がＡさんに紹介したサービスとして、正しいものを1つ選びなさい。\n\n〔事例〕\nＡさん（50歳、男性）は、20代後半に幻聴に悩まされるようになった。そのため、精神科を受診したところ、統合失調症と診断された。その後、勤務先を退職して両親の暮らす実家でひきこもる生活となった。服薬に抵抗感のあったＡさんは、やがて「両親が自分のことを生きていても意味がないと思っている」と信じ込むようになった。その影響から自宅で暴力的な言動が現れるようになり、通院先の病院で親の同意により入院することとなった。それ以降もＡさんは怠薬により入退院を繰り返し、40代半ばに再び入院したが「今度はしっかり治してほしい」という両親の強い意向もあり、入院が約5年続いている。入院当初、Ａさんは周囲の言動に敏感に反応し、被害的となり暴言を吐くことも多かった。しかし最近では職員の話に耳を傾けるようになり、これまで避けてきたプログラムに参加し始めた。そこで、自分の病気と向き合い、次第に服薬の必要性を理解するようになると穏やかに過ごせる日が増えてきた。そのため、入院形態がＡさんの意思による入院に変更された。（問題46）\n\nある日、Ａさんは担当のＢ精神保健福祉士に「これ以上親に迷惑をかけたくない。だからこのまま入院する」と話した。このため、Ｂ精神保健福祉士はＡさんの思いに寄り添いつつ、主治医と相談し、入院中から住居の確保など退院の準備を行う「障害者総合支援法」に基づくサービスをＡさんに紹介した。初めは利用を拒んでいたＡさんも、面談を繰り返すうちに気持ちが前向きになっていき、そのサービスの利用に同意した。（問題47）\n\n支給決定後、施設見学などが行われていくと、病院の外に出ることが不安だったＡさんも「少しずつ慣れていきたい」と語るようになっていた。そうした中、Ａさんは「アパートでの一人暮らしに自信がない。相談できる人がすぐ近くに居ないのは心細い」と具体的な不安を口にした。そこで、Ｂ精神保健福祉士から、日常生活の支援が受けられる住居を提供する障害福祉サービスがあると伝えると、Ａさんは「興味がある」と関心を示した。（問題48）","options":["包括型地域生活支援","精神障害者地域生活支援広域調整等事業","住宅入居等支援事業","自立生活援助","共同生活援助"],"answer":[5],"subject":5,"explanation":"共同生活援助は、グループホームで相談や日常生活の支援を提供するサービスです。相談できる人が近くにいる暮らしを希望する事例に合います。"}], SUBJECTS=["精神医学と精神医療", "現代の精神保健の課題と支援", "精神保健福祉の原理", "ソーシャルワークの理論と方法（専門）", "精神障害リハビリテーション論", "精神保健福祉制度論"];

t><\/ruby><ruby>及<rt>およ<\/rt><\/ruby>び<ruby>妄想<rt>もうそう<\/rt><\/ruby><ruby>性<rt>せい<\/rt><\/ruby><ruby>障害<rt>しょうがい<\/rt><\/ruby>」である。","多職種との連携":"<ruby>多<rt>た<\/rt><\/ruby><ruby>職種<rt>しょくしゅ<\/rt><\/ruby>との<ruby>連携<rt>れんけい<\/rt><\/ruby>","多職種連携":"<ruby>多<rt>た<\/rt><\/ruby><ruby>職種<rt>しょくしゅ<\/rt><\/ruby><ruby>連携<rt>れんけい<\/rt><\/ruby>","大学1年生のＡさん（18歳、男性）は、前期の成績で多くの単位を落としてしまった。成績を見た母親が大学に相談したところ、学生支援室を紹介された。数日後、Ａさんと母親は学生支援室のキャンパスソーシャルワーカーであるＢ精神保健福祉士（以下「Ｂワーカー」という。）の元を訪れ、面談した。母親は「Ａは、小学校入学後に落ち着きの無さが目立ち、専門医の受診を勧められ、発達障害と診断された。高校までは学校側に発達障害を伝え、教員のサポートを受けて大きな問題は生じずに卒業できた。大学ではこれまでのようなサポートを申請するか迷っていた」と話した。Ｂワーカーは、本学には障害学生支援制度（以下「支援制度」という。）があり、これまでも支援制度を利用している学生が居ることなどを説明すると、Ａさんと母親は安心して申請を希望した。面談後、Ｂワーカーは発達障害がある学生が大学に相談に来ることも増えてきたことを踏まえ、今後大学として改めて取り組むべき事柄を、大学に提案した。（問題40）\n\nＡさんとＢワーカーは支援制度の申請に向けて面談を重ねた。Ａさんは、自分の発達障害について詳しいことは理解できていないとのことだった。そこでＢワーカーは、支援制度の申請と共に、学生支援室が後期に心理教育プログラムとして月1回の全6回シリーズで行う「発達障害についての学習会（以下「学習会」という。）」への参加を勧めた。（問題41）\n\nその後、Ａさんは支援制度を受けることになり、2年生時には単位を取得できるようになった。また、Ｂワーカーとの面談時に「半年にわたる学習会に参加して、自分のつらさを分かり合える仲間が居て、自分は一人ではないと実感でき、とてもうれしかった。自分のように困っている学生が学内で孤立しなくなる方法はないか、発達障害についてみんなに知ってもらうにはどうすれば良いか」と話した。そこで学習会の仲間と一緒に今度の大学祭で「発達障害のことを知ろう」という発表会の企画を開催することにした。（問題42）":"<ruby>大学<rt>だいがく<\/rt><\/ruby>1<ruby>年生<rt>ねんせい<\/rt><\/ruby>のＡさん（18<ruby>歳<rt>さい<\/rt><\/ruby>、<ruby>男性<rt>だんせい<\/rt><\/ruby>）は、<ruby>前期<rt>ぜんき<\/rt><\/ruby>の<ruby>成績<rt>せいせき<\/rt><\/ruby>で<ruby>多<rt>おお<\/rt><\/ruby>くの<ruby>単位<rt>たんい<\/rt><\/ruby>を<ruby>落<rt>お<\/rt><\/ruby>としてしまった。<ruby>成績<rt>せいせき<\/rt><\/ruby>を<ruby>見<rt>み<\/rt><\/ruby>た<ruby>母親<rt>ははおや<\/rt><\/ruby>が<ruby>大学<rt>だいがく<\/rt><\/ruby>に<ruby>相談<rt>そうだん<\/rt><\/ruby>したところ、<ruby>学生<rt>がくせい<\/rt><\/ruby><ruby>支援<rt>しえん<\/rt><\/ruby><ruby>室<rt>しつ<\/rt><\/ruby>を<ruby>紹介<rt>しょうかい<\/rt><\/ruby>された。<ruby>数<rt>すう<\/rt><\/ruby><ruby>日<rt>じつ<\/rt><\/ruby><ruby>後<rt>ご<\/rt><\/ruby>、Ａさんと<ruby>母親<rt>ははおや<\/rt><\/ruby>は<ruby>学生<rt>がくせい<\/rt><\/ruby><ruby>支援<rt>しえん<\/rt><\/ruby><ruby>室<rt>しつ<\/rt><\/ruby>のキャンパスソーシャルワーカーであるＢ<ruby>精神保健福祉士<rt>せいしんほけんふくしし<\/rt><\/r t>いっきゅう<\/rt><\/ruby>・2<ruby>級<rt>きゅう<\/rt><\/ruby>です。","離脱症状":"<ruby>離脱<rt>りだつ<\/rt><\/ruby><ruby>症状<rt>しょうじょう<\/rt><\/ruby>","震災から数年後のある日、地域活動支援センターを利用しているＡさんは「震災の時の避難所は、人の声が途切れないし、人に見られている感じが息苦しかった。中に居られなかったので、車内で過ごした。とても不安で、体調も不安定になった。つらいことを誰にも言えず、我慢するしかなかった」とＢ精神保健福祉士に話した。後日開催された「協議会」の部会でも、同様の事例が幾つか出ていた。そこでＢ精神保健福祉士は、精神障害者の災害時避難対策のワーキンググループ設置を提案し、承認された。そして、早速活動を開始した。次の記述のうち、ワーキンググループ初期段階の活動として、最も適切なものを1つ選びなさい。":"<ruby>震災<rt>しんさい<\/rt><\/ruby>から<ruby>数<rt>すう<\/rt><\/ruby><ruby>年<rt>ねん<\/rt><\/ruby><ruby>後<rt>ご<\/rt><\/ruby>のある<ruby>日<rt>ひ<\/rt><\/ruby>、<ruby>地域<rt>ちいき<\/rt><\/ruby><ruby>活動<rt>かつどう<\/rt><\/ruby><ruby>支援<rt>しえん<\/rt><\/ruby>センターを<ruby>利用<rt>りよう<\/rt><\/ruby>しているＡさんは「<ruby>震災<rt>しんさい<\/rt><\/ruby>の<ruby>時<rt>とき<\/rt><\/ruby>の<ruby>避難<rt>ひなん<\/rt><\/ruby><ruby>所<rt>しょ<\/rt><\/ruby>は、<ruby>人<rt>ひと<\/rt><\/ruby>の<ruby>声<rt>こえ<\/rt><\/ruby>が<ruby>途切<rt>とぎ<\/rt><\/ruby>れないし、<ruby>人<rt>ひと<\/rt><\/ruby>に<ruby>見<rt>み<\/rt><\/ruby>られている<ruby>感<rt>かん<\/rt><\/ruby>じが<ruby>息苦<rt>いきぐる<\/rt><\/ruby>しかった。<ruby>中<rt>なか<\/rt><\/ruby>に<ruby>居<rt>い<\/rt><\/ruby>られなかったので、<ruby>車内<rt>しゃない<\/rt><\/ruby>で<ruby>過<rt>す<\/rt><\/ruby>ごした。とても<ruby>不安<rt>ふあん<\/rt><\/ruby>で、<ruby>体調<rt>たいちょう<\/rt><\/ruby>も<ruby>不安定<rt>ふあんてい<\/rt><\/ruby>になった。つらいことを<ruby>誰<rt>だれ<\/rt><\/ruby>にも<ruby>言<rt>い<\/rt><\/ruby>えず、<ruby>我慢<rt>がまん<\/rt><\/ruby>するしかなかった」とＢ<ruby>精神保健福祉士<rt>せいしんほけんふくしし<\/rt><\/ruby>に<ruby>話<rt>はな<\/rt><\/ruby>した。<ruby>後日<rt>ごじつ<\/rt><\/ruby><ruby>開催<rt>かいさい<\/rt><\/ruby>された「<ruby>協議会<rt>きょうぎかい<\/rt><\/ruby>」の<ruby>部会<rt>ぶかい<\/rt><\/ruby>でも、<ruby>同様<rt>どうよう<\/rt><\/ruby>の<ruby>事例<rt>じれい<\/rt><\/ruby>が<ruby>幾<rt>いく<\/rt><\/ruby>つか<ruby>出<rt>で<\/rt><\/ruby>ていた。そこでＢ<ruby>精神保健福祉士<rt>せいしんほけんふくしし<\/rt><\/ruby>は、<ruby>精神障害者<rt>せいしんしょうがいしゃ<\/rt><\/ruby>の<ruby>災害時<rt>さいがいじ<\/rt><\/ruby><ruby>避難<rt>ひなん<\/rt><\/ruby><ruby>対策<rt>たいさく<\/rt><\/ruby>のワーキンググループ<ruby>設置<rt>せっち<\/rt><\/ruby>を<ruby>提案<rt>ていあん<\/rt><\/ruby>し、<ruby>承認<rt>しょうにん<\/rt><\/ruby>された。そして、<ruby>早速<rt>さっそく<\/rt><\/ruby><ruby>活動<rt>かつどう<\/rt><\/ruby>を<ruby>開始<rt>かいし<\/rt><\/ruby>した。<ruby>次<rt>つぎ<\/rt><\/ruby>の<ruby>記述<rt>きじゅつ<\/rt><\/ruby>のうち、ワーキンググループ<ruby>初期段階<rt>しょきだんかい<\/rt><\/ruby>の<ruby>活動<rt>かつどう<\/rt><\/ruby>として、<ruby>最<rt>もっと<\/rt><\/ruby>も<ruby>適切<rt>てきせつ<\/rt><\/ruby>なものを1つ<ruby>選<rt>えら<\/rt><\/ruby>びなさい。","静止時振戦、筋固縮、寡動・無動、姿勢反射障害の症状がみられる者":"<ruby>静止<rt>せいし<\/rt><\/ruby><ruby>時<rt>じ<\/rt><\/ruby><ruby>振戦<rt>しんせん<\/rt><\/ruby>、<ruby>筋固縮<rt>きんこしゅく<\/rt><\/ruby>、<ruby>寡動<rt>かどう<\/rt><\/ruby>・<ruby>無動<rt>むどう<\/rt><\/ruby>、<ruby>姿勢<rt>しせい<\/rt><\/ruby><ruby>反射<rt>はんしゃ<\/rt><\/ruby><ruby>障害<rt>しょうがい<\/rt><\/ruby>の<ruby>症状<rt>しょうじょう<\/rt><\/ruby>がみられる<ruby>者<rt>もの<\/rt><\/ruby>","飲酒する本人への対応方法が分からないまま、一人で問題を取り除こうとする。":"<ruby>飲酒<rt>いんしゅ<\/rt><\/ruby>する<ruby>本人<rt>ほんにん<\/rt><\/ruby>への<ruby>対応<rt>たいおう<\/rt><\/ruby><ruby>方法<rt>ほうほう<\/rt><\/ruby>が<ruby>分<rt>わ<\/rt><\/ruby>からないまま、<ruby>一人<rt>ひとり<\/rt><\/ruby>で<ruby>問題<rt>もんだい<\/rt><\/ruby>を<ruby>取<rt>と<\/rt><\/ruby>り<ruby>除<rt>のぞ<\/rt><\/ruby>こうとする。","飲酒する本人を無視したり、軽んじたりする。":"<ruby>飲酒<rt>いんしゅ<\/rt><\/ruby>する<ruby>本人<rt>ほんにん<\/rt><\/ruby>を<ruby>無視<rt>むし<\/rt><\/ruby>したり、<ruby>軽<rt>かろ<\/rt><\/ruby>んじたりする。","飲酒をしたくなったら、散歩などで体を動かして気分を変えることを提案する。":"<ruby>飲酒<rt>いんしゅ<\/rt><\/ruby>をしたくなったら、<ruby>散歩<rt>さんぽ<\/rt><\/ruby>などで<ruby>体<rt>からだ<\/rt><\/ruby>を<ruby>動<rt>うご<\/rt><\/ruby>かして<ruby>気分<rt>きぶん<\/rt><\/ruby>を<ruby>変<rt>か<\/rt><\/ruby>えることを<ruby>提案<rt>ていあん<\/rt><\/ruby>する。","飲酒行動の自己コントロール障害なので、家にある酒類は見つけ次第廃棄することを勧めた。":"<ruby>飲酒<rt>いんしゅ<\/rt><\/ruby><ruby>行動<rt>こうどう<\/rt><\/ruby>の<ruby>自己<rt>じこ<\/rt><\/ruby>コントロール<ruby>障害<rt>しょうがい<\/rt><\/ruby>なので、<ruby>家<rt>いえ<\/rt><\/ruby>にある<ruby>酒類<rt>しゅるい<\/rt><\/ruby>は<ruby>見<rt>み<\/rt><\/ruby>つけ<ruby>次第<rt>しだい<\/rt><\/ruby><ruby>廃棄<rt>はいき<\/rt><\/ruby>することを<ruby>勧<rt>すす<\/rt><\/ruby>めた。","Ａさん（34歳、男性）は、仕事上のストレスを感じていた時期に、友人から「気分転換になる」と誘われ、大麻を使用するようになった。次第に使用頻度が増し、仕事への集中困難や睡眠障害がみられるようになった。ある日、大麻所持中に警察官に職務質問を受け、現行犯で逮捕された。その後、保釈され、再使用を防ぐために薬物依存症治療に対応した精神科病院へ入院し、回復を目的としたプログラムに参加することとなった。プログラム開始時の面接でＡさんは「大麻は海外で合法の国もあるし、仕事では成果を出している。問題にすることではない」と話した。次のうち、面接時のＡさんの状態として、最も適切なものを1つ選びなさい。":"Ａさん（34<ruby>歳<rt>さい<\/rt><\/ruby>、<ruby>男性<rt>だんせい<\/rt><\/ruby>）は、<ruby>仕事<rt>しごと<\/rt><\/ruby><ruby>上<rt>じょう<\/rt><\/ruby>のストレスを<ruby>感<rt>かん<\/rt><\/ruby>じていた<ruby>時期<rt>じき<\/rt><\/ruby>に、<ruby>友人<rt>ゆうじん<\/rt><\/ruby>から「<ruby>気分転換<rt>きぶんてんかん<\/rt><\/ruby>になる」と<ruby>誘<rt>さそ<\/rt><\/ruby>われ、<ruby>大麻<rt>たいま<\/rt><\/ruby>を<ruby>使用<rt>しよう<\/rt><\/ruby>するようになった。<ruby>次第<rt>しだい<\/rt><\/ruby>に<ruby>使用<rt>しよう<\/rt><\/ruby><ruby>頻度<rt>ひんど<\/rt><\/ruby>が<ruby>増<rt>ま<\/rt><\/ruby>し、<ruby>仕事<rt>しごと<\/rt><\/ruby>への<ruby>集中<rt>しゅうちゅう<\/rt><\/ruby><ruby>困難<rt>こんなん<\/rt><\/ruby>や<ruby>睡眠<rt>すいみん<\/rt><\/ruby><ruby>障害<rt>しょうがい<\/rt><\/ruby>がみられるようになった。ある<ruby>日<rt>ひ<\/rt><\/ruby>、<ruby>大麻<rt>たいま<\/rt><\/ruby><ruby>所持<rt>しょじ<\/rt><\/ruby><ruby>中<rt>ちゅう<\/rt><\/ruby>に<ruby>警察官<rt>けいさつかん<\/rt><\/ruby>に<ruby>職務質問<rt>しょくむしつもん<\/rt><\/ruby>を<ruby>受<rt>う<\/rt><\/ruby>け、<ruby>現行犯<rt>げんこうはん<\/rt><\/ruby>で<ruby>逮捕<rt>たいほ<\/rt><\/ruby>された。その<ruby>後<rt>ご<\/rt><\/ruby>、<ruby>保釈<rt>ほしゃく<\/rt><\/ruby>され、<ruby>再使用<rt>さいしよう<\/rt><\/ruby>を<ruby>防<rt>ふせ<\/rt><\/ruby>ぐために<ruby>薬物<rt>やくぶつ<\/rt><\/ruby><ruby>依存症<rt>いぞんしょう<\/rt><\/ruby><ruby>治療<rt>ちりょう<\/rt><\/ruby>に<ruby>対応<rt>たいおう<\/rt><\/ruby>した<ruby>精神科<rt>せいしんか<\/rt><\/ruby><ruby>病院<rt>びょういん<\/rt><\/ruby>へ<ruby>入院<rt>にゅういん<\/rt><\/ruby>し、<ruby>回復<rt>かいふく<\/rt><\/ruby>を<ruby>目的<rt>もくてき<\/rt><\/ruby>としたプログラムに<ruby>参加<rt>さんか<\/rt><\/ruby>することとなった。プログラム<ruby>開始<rt>かいし<\/rt><\/ruby><ruby>時<rt>じ<\/rt><\/ruby>の<ruby>面接<rt>めんせつ<\/rt><\/ruby>でＡさんは「<ruby>大麻<rt>たいま<\/rt><\/ruby>は<ruby>海外<rt>かいがい<\/rt><\/ruby>で<ruby>合法<rt>ごうほう<\/rt><\/ruby>の<ruby>国<rt>くに<\/rt><\/ruby>もあるし、<ruby>仕事<rt>しごと<\/rt><\/ruby>では<ruby>成果<rt>せいか<\/rt><\/ruby>を<ruby>出<rt>だ<\/rt><\/ruby>している。<ruby>問題<rt>もんだい<\/rt><\/ruby>にすることではない」と<ruby>話<rt>はな<\/rt><\/ruby>した。<ruby>次<rt>つぎ<\/rt><\/ruby>のうち、<ruby>面接<rt>めんせつ<\/rt><\/ruby><ruby>時<rt>じ<\/rt><\/ruby>のＡさんの<ruby>状態<rt>じょうたい<\/rt><\/ruby>として、<ruby>最<rt>もっと<\/rt><\/ruby>も<ruby>適切<rt>てきせつ<\/rt><\/ruby>なものを1つ<ruby>選<rt>えら<\/rt><\/ruby>びなさい。","Ａさん（50歳、女性）は、3週間前から抑うつ気分、意欲の低下、集中力の低下、早朝覚醒、食欲低下、易疲労感を認め、好きだったテレビ番組も楽しめなくなった。この状態に苦しみ、精神科クリニックを受診した。次のうち、Ａさんの症状に対して効果が期待できる向精神薬として、最も適切なものを1つ選びなさい。":"Ａさん（50<ruby>歳<rt>さい<\/rt><\/ruby>、<ruby>女性<rt>じょせい<\/rt><\/ruby>）は、3<ruby>週間<rt>しゅうかん<\/rt><\/ruby><ruby>前<rt>まえ<\/rt><\/ruby>から<ruby>抑<rt>よく<\/rt><\/ruby>うつ<ruby>気分<rt>きぶん<\/rt><\/ruby>、<ruby>意欲<rt>いよく<\/rt><\/ruby>の<ruby>低下<rt>ていか<\/rt><\/ruby>、<ruby>集中力<rt>しゅうちゅうりょく<\/rt><\/ruby>の<ruby>低下<rt>ていか<\/rt><\/ruby>、<ruby>早朝<rt>そうちょう<\/rt><\/ruby><ruby>覚醒<rt>かくせい<\/rt><\/ruby>、<ruby>食欲<rt>しょくよく<\/rt><\/ruby><ruby>低下<rt>ていか<\/rt><\/ruby>、<ruby>易<rt>えき<\/rt><\/ruby><ruby>疲労感<rt>ひろうかん<\/rt><\/ruby>を<ruby>認<rt>みと<\/rt><\/ruby>め、<ruby>好<rt>す<\/rt><\/ruby>きだったテレビ<ruby>番組<rt>ばんぐみ<\/rt><\/ruby>も<ruby>楽<rt>たの<\/rt><\/ruby>しめなくなった。この<ruby>状態<rt>じょうたい<\/rt><\/ruby>に<ruby>苦<rt>くる<\/rt><\/ruby>しみ、<ruby>精神科<rt>せいしんか<\/rt><\/ruby>クリニックを<ruby>受診<rt>じゅしん<\/rt><\/ruby>した。<ruby>次<rt>つぎ<\/rt><\/ruby>のうち、Ａさんの<ruby>症状<rt>しょうじょう<\/rt><\/ruby>に<ruby>対<rt>たい<\/rt><\/ruby>して<ruby>効果<rt>こうか<\/rt><\/ruby>が<ruby>期待<rt>きたい<\/rt><\/ruby>できる<ruby>向<rt>こう<\/rt><\/ruby><ruby>精神<rt>せいしん<\/rt><\/ruby><ruby>薬<rt>やく<\/rt><\/ruby>として、<ruby>最<rt>もっと<\/rt><\/ruby>も<ruby>適切<rt>てきせつ<\/rt><\/ruby>なものを1つ<ruby>選<rt>えら<\/rt><\/ruby>びなさい。","Ａさん（50歳、男性）は、20代後半に幻聴に悩まされるようになった。そのため、精神科を受診したところ、統合失調症と診断された。その後、勤務先を退職して両親の暮らす実家でひきこもる生活となった。服薬に抵抗感のあったＡさんは、やがて「両親が自分のことを生きていても意味がないと思っている」と信じ込むようになった。その影響から自宅で暴力的な言動が現れるようになり、通院先の病院で親の同意により入院することとなった。それ以降もＡさんは怠薬により入退院を繰り返し、40代半ばに再び入院したが「今度はしっかり治してほしい」という両親の強い意向もあり、入院が約5年続いている。入院当初、Ａさんは周囲の言動に敏感に反応し、被害的となり暴言を吐くことも多かった。しかし最近では職員の話に耳を傾けるようになり、これまで避けてきたプログラムに参加し始めた。そこで、自分の病気と向き合い、次第に服薬の必要性を理解するようになると穏やかに過ごせる日が増えてきた。そのため、入院形態がＡさんの意思による入院に変更された。（問題46）\n\nある日、Ａさんは担当のＢ精神保健福祉士に「これ以上親に迷惑をかけたくない。だからこのまま入院する」と話した。このため、Ｂ精神保健福祉士はＡさんの思いに寄り添いつつ、主治医と相談し、入院中から住居の確保など退院の準備を行う「障害者総合支援法」に基づくサービスをＡさんに紹介した。初めは利用を拒んでいたＡさんも、面談を繰り返すうちに気持ちが前向きになっていき、そのサービスの利用に同意した。（問題47）\n\n支給決定後、施設見学などが行われてい function syncRubyDisplay(){

const rubyWordPattern=new RegExp(Object.keys(RUBY_WORDS).sort((a,b)=>b.length-a.length).join('|'),'g');
function annotateText(text){
 return RUBY_TEXT[text]||esc(text).replace(rubyWordPattern,w=>`<ruby>${w}<rt>${RUBY_WORDS[w]}<\/rt><\/ruby>`);
}
function applyRuby(){
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),nodes=[];
 while(walker.nextNode()){
  const node=walker.currentNode;
  if(/[㐀-鿿々〆]/.test(node.data)&&!node.parentElement.closest('style,script,ruby,textarea,input,select,option'))nodes.push(node);
 }
 for(const node of nodes){
  const annotated=annotateText(node.data);
  if(!annotated.includes('<ruby>'))continue;
  const template=document.createElement('template');template.innerHTML=annotated;node.replaceWith(template.content);
 }
}
const rubyObserver=new MutationObserver(()=>{
 rubyObserver.disconnect();applyRuby();rubyObserver.observe(root,{childList:true,subtree:true,characterData:true});
});
