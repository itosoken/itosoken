(()=>{
'use strict';
const host=document.currentScript.previousElementSibling;
const root=host.attachShadow({mode:'open'});
const QUESTIONS=[{"id":1,"subject":0,"question":"高齢化について正しいものはどれか。2つ選べ。","options":["2025(令和7)年には、いわゆる団塊の世代が85歳に到達する。","2021(令和3)年国民生活基礎調査によると、65歳以上の者のいる世帯では「三世代世帯」の割合が一番多い。","国立社会保障・人口問題研究所の「日本の世帯数の将来推計(全国推計)」(平成30年推計)によると、世帯主が65歳以上の世帯数は2040(令和22)年まで増加し続ける。","国立社会保障・人口問題研究所の「日本の将来推計人口」(平成29年推計)によると、前期高齢者の人口は、2015(平成27)年と比べて2045(令和27)年では倍増する。","2019(令和元)年度末における85歳以上の介護保険の被保険者に占める要介護又は要支援と認定された者の割合は、50%を超えている。"],"answer":[3,5],"sourcePage":3,"explanation":"設問で用いられた推計では、世帯主が65歳以上の世帯は2040年まで増加します。2019年度末の85歳以上では認定者が半数を超えています。団塊の世代は2025年に全員75歳以上となります。"},{"id":2,"subject":0,"question":"地域福祉や地域共生社会について正しいものはどれか。3つ選べ。","options":["市町村は、包括的な支援体制を整備するため重層的支援体制整備事業を実施しなければならない。","市町村は、市町村地域福祉計画を策定するよう努めるものとする。","地域共生社会とは、子供・高齢者・障害者などすべての人々が地域、暮らし、生きがいをともに創り、高め合うことができる社会のことである。","介護保険法に基づく地域支援事業等を提供する事業者が解決が困難な地域生活課題を把握したときは、その事業者が自ら課題を解決しなければならない。","高齢者と障害児・者が同一の事業所でサービスを受けやすくするための共生型サービスは、介護保険制度と障害福祉制度の両方に位置付けられている。"],"answer":[2,3,5],"sourcePage":3,"explanation":"地域福祉計画の策定は市町村の努力義務です。地域共生社会は立場を超えて支え合う社会を目指し、共生型サービスは介護保険と障害福祉の両制度に位置付けられています。"},{"id":3,"subject":0,"question":"社会保険について正しいものはどれか。2つ選べ。","options":["雇用保険は、含まれない。","自営業者は、介護保険の被保険者にならない。","医療保険は、労働者災害補償保険法の業務災害以外の疾病、負傷等を保険事故とする。","年金保険は、基本的に任意加入である。","財源は、加入者や事業主が払う保険料が中心であるが、国・地方公共団体や利用者も負担している。"],"answer":[3,5],"sourcePage":4,"explanation":"社会保険には医療・年金・介護・雇用・労災保険が含まれます。医療保険は業務外の疾病等を対象とし、保険料を中心に公費や利用者負担も組み合わせています。"},{"id":4,"subject":0,"question":"介護保険法第2条に示されている保険給付の基本的考え方として正しいものはどれか。3つ選べ。","options":["要介護状態等の軽減又は悪化の防止に資するよう行われなければならない。","被保険者の置かれている環境に配慮せず提供されなければならない。","可能な限り、被保険者の有する能力に応じ自立した日常生活を営むことができるように配慮されなければならない。","医療との連携に十分配慮して行われなければならない。","介護支援専門員の選択に基づき、サービス提供が行われなければならない。"],"answer":[1,3,4],"sourcePage":4,"explanation":"介護保険の給付は、状態の軽減・悪化防止、自立した生活、医療との連携を重視します。サービスは被保険者本人の選択を基本に提供します。"},{"id":5,"subject":0,"question":"介護保険制度における住所地特例の適用があるものはどれか。3つ選べ。","options":["介護老人福祉施設","地域密着型介護老人福祉施設","有料老人ホーム","介護老人保健施設","認知症対応型共同生活介護"],"answer":[1,3,4],"sourcePage":5,"explanation":"住所地特例は、介護老人福祉施設・介護老人保健施設・有料老人ホームなどが対象です。地域密着型の特養や認知症グループホームは対象外です。"},{"id":6,"subject":0,"question":"65歳以上の者であって、介護保険の被保険者とならないものはどれか。2つ選べ。","options":["老人福祉法に規定する養護老人ホームの入所者","児童福祉法に規定する医療型障害児入所施設の入所者","生活保護法に規定する更生施設の入所者","生活保護法に規定する救護施設の入所者","児童福祉法に規定する母子生活支援施設の入所者"],"answer":[2,4],"sourcePage":5,"explanation":"医療型障害児入所施設や救護施設などの入所者は、介護保険の適用除外です。65歳以上でも、適用除外施設に入所している間は被保険者になりません。"},{"id":7,"subject":0,"question":"介護保険と他制度との関係について正しいものはどれか。3つ選べ。","options":["労働者災害補償保険法の療養給付は、介護保険給付に優先する。","労働者災害補償保険法の介護補償給付は、介護保険の給付に相当する給付が受けられる限りにおいて、介護保険に優先する。","介護保険の訪問看護は、原則として、医療保険の訪問看護に優先する。","生活保護の被保護者は、介護保険給付を受給できない。","障害者総合支援法の給付を受けている障害者は、要介護認定を受けることができない。"],"answer":[1,2,3],"sourcePage":6,"explanation":"同じ内容の給付では労災保険が介護保険に優先します。要介護者等の訪問看護は原則として介護保険が医療保険に優先し、生活保護受給者も介護保険を利用する場合があります。"},{"id":8,"subject":0,"question":"介護保険法において現物給付化されている保険給付として正しいものはどれか。2つ選べ。","options":["居宅介護サービス計画費の支給","特定入所者介護サービス費の支給","居宅介護福祉用具購入費の支給","高額介護サービス費の支給","高額医療合算介護サービス費の支給"],"answer":[1,2],"sourcePage":6,"explanation":"居宅介護サービス計画費と特定入所者介護サービス費は、法定代理受領により現物給付化されています。福祉用具購入費や高額介護サービス費などは原則として償還払いです。"},{"id":9,"subject":0,"question":"介護保険法に定める指定居宅サービス事業者の責務として正しいものはどれか。3つ選べ。","options":["医師の診断書に基づき居宅サービス計画を作成しなければならない。","要介護者のため忠実に職務を遂行しなければならない。","自らサービスの質の評価を行うこと等により常に利用者の立場に立ってサービスを提供するように努めなければならない。","利用者が居宅において心身ともに健やかに養護されるよう、利用者の保護者を支援しなければならない。","法令遵守に係る義務の履行が確保されるよう、業務管理体制を整備しなければならない。"],"answer":[2,3,5],"sourcePage":7,"explanation":"居宅サービス事業者は要介護者のために忠実に職務を行い、サービスの質を評価して利用者の立場に立つことが求められます。法令を守るための業務管理体制も必要です。"},{"id":10,"subject":0,"question":"介護保険法に規定する介護保険等関連情報の調査及び分析について正しいものはどれか。3つ選べ。","options":["市町村は、介護保険等関連情報を分析した上で、その分析の結果を勘案して、市町村介護保険事業計画を作成するよう努めるものとする。","都道府県は、都道府県介護保険事業支援計画を作成するに当たって、介護保険等関連情報を分析する必要はない。","都道府県は、介護サービス事業者に対し、介護給付等に要する費用の額に関する地域別,年齢別又は要介護認定及び要支援認定別の状況に関する情報を提供しなければならない。","厚生労働大臣は、被保険者の要介護認定及び要支援認定における調査に関する状況について調査及び分析を行い、その結果を公表するものとする。","厚生労働大臣は、特定介護予防・日常生活支援総合事業を行う者に対し、介護保険等関連情報を提供するよう求めることができる。"],"answer":[1,4,5],"sourcePage":7,"explanation":"国は認定調査等の状況を調査・分析し、結果を公表します。市町村は分析を計画に活かすよう努め、国は対象事業者へ関連情報の提供を求めることができます。"},{"id":11,"subject":0,"question":"地域における医療及び介護の総合的な確保の促進に関する法律に規定する基金(地域医療介護総合確保基金)について正しいものはどれか。3つ選べ。","options":["医療及び介護の総合的な確保に関する目標を達成するために必要な事業に要する費用を支弁するため、都道府県が設ける。","公的介護施設等の整備に関する事業は、支弁の対象とならない。","医療従事者の確保に関する事業は、支弁の対象となる。","介護従事者の確保に関する事業は、支弁の対象となる。","国が負担する費用の財源は、所得税及び法人税である。"],"answer":[1,3,4],"sourcePage":8,"explanation":"地域医療介護総合確保基金は都道府県に設置され、施設整備や医療・介護従事者の確保などに使われます。国の負担分には消費税収が充てられます。"},{"id":12,"subject":0,"question":"社会保険診療報酬支払基金の介護保険関係業務として正しいものはどれか。2つ選べ。","options":["医療保険者から介護給付費・地域支援事業支援納付金を徴収する。","第1号被保険者の保険料に係る特別徴収を行う。","都道府県に対し介護給付費交付金を交付する。","市町村に対し地域支援事業支援交付金を交付する。","介護保険サービスに関する苦情への対応を行う。"],"answer":[1,4],"sourcePage":8,"explanation":"支払基金は医療保険者から納付金を徴収し、市町村に介護給付費交付金や地域支援事業支援交付金を交付します。第1号被保険者の保険料を直接徴収する機関ではありません。"},{"id":13,"subject":0,"question":"地域支援事業の包括的支援事業として正しいものはどれか。2つ選べ。","options":["家族介護支援事業","一般介護予防事業","在宅医療・介護連携推進事業","保健福祉事業","生活支援体制整備事業"],"answer":[3,5],"sourcePage":9,"explanation":"在宅医療・介護連携推進事業と生活支援体制整備事業は包括的支援事業です。家族介護支援事業は任意事業、一般介護予防事業は総合事業に含まれます。"},{"id":14,"subject":0,"question":"地域ケア会議の機能として正しいものはどれか。3つ選べ。","options":["個別課題の解決","地域づくり・資源開発","政策の形成","地域包括支援センターから提出された事業計画書の評価","日常生活自立支援事業の生活支援員の指名"],"answer":[1,2,3],"sourcePage":9,"explanation":"地域ケア会議は、個別課題の解決から地域の課題を見つけ、資源開発や政策につなげます。関係者のネットワーク構築も重要な機能です。"},{"id":15,"subject":0,"question":"介護サービス情報の公表制度において、介護サービスの提供開始時に事業者が都道府県知事へ報告すべき情報として規定されているものはどれか。3つ選べ。","options":["従業者の個人情報保護等のために講じる措置","従業者の教育訓練の実施状況","年代別の従業者の数","従業者の労働時間","従業者の健康診断の実施状況"],"answer":[2,4,5],"sourcePage":10,"explanation":"サービス開始時に報告する基本情報には、従業者の教育訓練、労働時間、健康診断の実施状況などが含まれます。利用者が事業所を比較するための情報です。"},{"id":16,"subject":0,"question":"介護保険審査会への審査請求が認められるものとして正しいものはどれか。2つ選べ。","options":["介護支援専門員の資格に関する処分","指定居宅サービス事業者の指定の取消しに関する処分","財政安定化基金拠出金への拠出額に関する処分","要介護認定に関する処分","被保険者証の交付の請求に関する処分"],"answer":[4,5],"sourcePage":10,"explanation":"介護保険審査会では、要介護認定や被保険者証の交付請求などへの不服を審査します。介護支援専門員の資格や事業者指定の取消しは、この審査請求の対象ではありません。"},{"id":17,"subject":0,"question":"介護保険法における消滅時効について正しいものはどれか。3つ選べ。","options":["償還払い方式による介護給付費の請求権の時効は、10年である。","法定代理受領方式による介護給付費の請求権の時効は、2年である。","滞納した介護保険料の徴収権が時効によって消滅した場合には、保険給付の減額対象とならない。","介護保険料の督促は、時効の更新の効力を生ずる。","介護保険審査会への審査請求は、時効の更新に関しては、裁判上の請求とみなされる。"],"answer":[2,4,5],"sourcePage":11,"explanation":"法定代理受領による介護給付費の請求権は2年で時効になります。保険料の督促は時効を更新し、審査請求は時効の更新について裁判上の請求とみなされます。"},{"id":18,"subject":0,"question":"要介護認定の申請について正しいものはどれか。2つ選べ。","options":["被保険者は、介護認定審査会に申請しなければならない。","地域包括支援センターは、申請に関する手続を代行することができる。","介護保険施設は、入所者の更新認定の申請に限って代行することができる。","要介護状態区分の変更申請には、医師の診断書を添付しなければならない。","更新認定の申請は、有効期間満了の日の60日前から行うことができる。"],"answer":[2,5],"sourcePage":11,"explanation":"認定申請は市町村に行い、地域包括支援センター等が手続を代行できます。更新申請は有効期間満了日の60日前から行えます。"},{"id":19,"subject":0,"question":"要介護認定について正しいものはどれか。2つ選べ。","options":["認定調査は申請者と面接して行わなければならないと、介護保険法に規定されている。","申請者が遠隔地に居住する場合には、認定調査を他の市町村に嘱託することができる。","新規認定の調査は、指定市町村事務受託法人に委託することができない。","一次判定は、認定調査票の基本調査の結果及び特記事項と主治医意見書に基づいて行う。","審査及び判定の基準は、市町村が定める。"],"answer":[1,2],"sourcePage":12,"explanation":"認定調査は本人との面接により行い、遠隔地なら他の市町村へ嘱託できます。認定の基準は全国共通で、特記事項は主に二次判定で用いられます。"},{"id":20,"subject":0,"question":"指定居宅介護支援について正しいものはどれか。3つ選べ。","options":["介護支援専門員は、居宅サービス計画書の作成に当たっては、地域の住民による自発的な活動によるサービス等の利用も含めて居宅サービス計画上に位置付けるよう努めなければならない。","事業者は、利用者の人権の擁護、虐待の防止等のため必要な体制の整備を行わなければならない。","指定居宅介護支援の提供に当たっては、公正中立に行われなければならない。","介護支援専門員の連絡調整の対象は、指定居宅サービス事業者に限定される。","事業者の連携の対象には、障害者総合支援法の指定特定相談支援事業者は含まれない。"],"answer":[1,2,3],"sourcePage":12,"explanation":"居宅介護支援は公正中立に行い、人権擁護や虐待防止の体制も整えます。保険サービスだけでなく、住民の自発的な活動なども計画への位置付けを検討します。"},{"id":21,"subject":0,"question":"居宅サービス計画の作成について適切なものはどれか。3つ選べ。","options":["課題分析の結果は、居宅サービス計画書に記載しない。","総合的な援助の方針は、利用者及び家族を含むケアチームが確認、検討の上、居宅サービス計画書に記載する。","居宅サービス計画の長期目標は、基本的に個々の解決すべき課題に対応して設定するものである。","週間サービス計画表には、提供されるサービス以外に主な日常生活上の活動も記載する。","サービス担当者会議の要点には、出席できないサービス担当者に対して行った照会の内容について記載しなくてよい。"],"answer":[2,3,4],"sourcePage":13,"explanation":"総合的な援助方針は本人・家族を含むチームで確認します。長期目標は課題に対応させ、週間計画には主な日常生活上の活動も記載します。"},{"id":22,"subject":0,"question":"指定介護老人福祉施設の施設サービス計画について正しいものはどれか。2つ選べ。","options":["モニタリングは、少なくとも月に1回行わなければならない。","アセスメントは、入所者及びその家族に面接して行わなければならない。","計画の交付は、家族に行えばよい。","地域の住民による自発的な活動によるサービス等の利用も含めて位置付けるよう努めなければならない。","介護支援専門員以外の者も作成できる。"],"answer":[2,4],"sourcePage":13,"explanation":"施設のアセスメントは入所者と家族への面接で行い、地域の活動なども計画に位置付けるよう努めます。モニタリングは定期的に行いますが、月1回という一律の規定ではありません。"},{"id":23,"subject":0,"question":"Aさん(72歳,男性,要介護2,認知症高齢者の日常生活自立度Ⅱa)は、妻(63歳)と二人暮らしで、小規模多機能型居宅介護事業所に登録し、週2回の通いサービスと週3回の訪問サービスを利用している。Aさんは、若い頃より散歩が趣味であったが、最近、散歩に出かけると自宅に戻れなくなることが増え、警察に保護されることがあった。妻は日中就労(週5日)のため、見守ることができずに困っている。この時点における計画作成担当者である介護支援専門員の対応として、より適切なものはどれか。3つ選べ。","options":["徘徊感知機器の情報を収集し、Aさんと妻に情報提供を行う。","Aさんや妻の同意を得ないで、Aさんの立ち寄りそうな店舗などに、Aさんの写真と妻の携帯電話番号を掲示してもらう。","Aさんの心身の状況や自宅周辺の環境をアセスメントし、自宅に戻れなかった理由を探る。","通いサービスの利用日以外は外出をしないように、Aさんを説得する。","近隣住民等による見守り体制が取れるかどうか民生委員に相談する。"],"answer":[1,3,5],"sourcePage":14,"explanation":"本人の散歩を一律に制限せず、戻れない理由や環境を確認します。機器の活用や地域の見守りを検討し、個人情報の共有には本人・家族の同意が必要です。"},{"id":24,"subject":0,"question":"Aさん(80歳、女性)は、最近、閉じこもりがちになり、体力が低下してきた。同居する娘は心配になって市役所に相談し、要支援1の認定を受けた。地域包括支援センターから委託を受けて、介護支援専門員が訪問したところ、娘は「母にはいつまでも元気でいてもらいたいが特に希望するサービスはない」と言う。介護支援専門員の対応として、より適切なものはどれか。","options":["特に希望するサービスがないので、今のところ支援の必要がないと考え、しばらく様子を見るよう娘に伝える。","指定訪問介護の生活援助を紹介する。","指定認知症対応型共同生活介護を紹介する。","Aさんの社会参加の状況や対人関係を把握する。","地域ケア会議などにおいて生活機能の改善のために必要な支援を検討する。"],"answer":[4,5],"sourcePage":15,"explanation":"希望するサービスが明確でなくても、社会参加や対人関係を把握して課題を整理します。地域ケア会議などで、生活機能を改善する支援を検討します。"},{"id":25,"subject":0,"question":"特別養護老人ホームに入所しているAさん(80歳,女性、要介護4)は、がんの末期で余命1か月程度と医師から告げられている。Aさんは自宅で最期を迎えたいと希望している。自宅で一人暮らしをしている夫は、Aさんの希望に沿いたいと考えているが、自宅での介護や看取りに不安を抱いている。Aさんの居宅介護支援の依頼を受けた介護支援専門員がAさんや夫との面談を進めるに当たっての対応として、より適切なものはどれか。3つ選べ。","options":["夫が何を不安に感じているのかを聴き取る。","施設の嘱託医に居宅療養管理指導を依頼する。","夫の負担を考慮し、施設での看取りを依頼する。","Aさんが自宅でどのように過ごしたいのかを聴き取る。","Aさんの自宅がある地域で看取りに対応している診療所の情報を収集する。"],"answer":[1,4,5],"sourcePage":16,"explanation":"本人の過ごし方の希望と夫の不安を丁寧に聴きます。自宅での看取りを支える医療機関などの情報を集め、希望を実現する体制を検討します。"},{"id":26,"subject":1,"question":"次の記述のうち適切なものはどれか。3つ選べ。","options":["「指輪っかテスト」は、サルコペニア(筋肉減弱症)の簡便な評価法である。","フレイルとは、健康な状態と介護を要する状態の中間的な状態である。","ロコモティブシンドロームとは、認知機能の低下によって起こるフレイルである。","要支援と認定された者では、介護が必要となった原因の第1位は認知症である。","配偶者との死別による心理的苦痛を和らげるには、ソーシャルサポートが有効である。"],"answer":[1,2,5],"sourcePage":18,"explanation":"指輪っかテストは筋肉量低下の目安を確認する簡便な方法です。フレイルは健康と要介護の中間段階で、死別の苦痛には周囲の支援も役立ちます。"},{"id":27,"subject":1,"question":"次の記述のうち正しいものはどれか。3つ選べ。","options":["脈拍数と心拍数は、常に一致する。","高体温とは、体温が36.5度以上である場合をいう。","一般的に動脈壁にかかる圧力を血圧という。","血圧には日内変動がある。","ジャパン・コーマ・スケール(JCS)は、意識レベルの評価に用いられる。"],"answer":[3,4,5],"sourcePage":18,"explanation":"血圧は動脈壁にかかる圧力で、時間帯によって変動します。JCSは意識状態の評価尺度です。不整脈などでは脈拍数と心拍数が一致しないことがあります。"},{"id":28,"subject":1,"question":"検査について適切なものはどれか。3つ選べ。","options":["腹囲が男性85cm以上,女性90cm以上の場合は、メタボリックシンドロームの診断において腹部型の肥満とされる。","AST(GOT)は、肝臓以外の臓器の疾患でも上昇する。","ヘモグロビンA1cは、採血時の血糖レベルを評価するのに適している。","尿検査は、尿路感染症の診断に有効である。","CRP(C反応性たんぱく質)は、体内で炎症が起きているときに低下する。"],"answer":[1,2,4],"sourcePage":19,"explanation":"腹囲はメタボリックシンドロームの判定に使い、ASTは肝臓以外の病気でも上昇します。尿検査は尿路感染症の診断に役立ち、HbA1cは過去1～2か月程度の血糖状態を反映します。"},{"id":29,"subject":1,"question":"褥瘡について適切なものはどれか。3つ選べ。","options":["しびれや麻痺は、原因となる。","細菌感染の原因となる。","寝たきりになると腹部にできやすい。","予防方法の一つに、栄養管理がある。","寝返りができない人に、体位変換は不要である。"],"answer":[1,2,4],"sourcePage":19,"explanation":"しびれや麻痺があると圧迫に気付きにくく、褥瘡のリスクが高まります。褥瘡は感染源にもなるため、体位変換や栄養管理で予防します。"},{"id":30,"subject":1,"question":"リハビリテーションについて適切なものはどれか。3つ選べ。","options":["多職種が連携して行う。","高齢者のケアは、リハビリテーション後置主義にのっとっている。","運動に伴って低血糖発作が起こることがある。","急性期病床は、急性期リハビリテーションの提供の場である。","回復が見込めない要介護高齢者に対しては、実施しない。"],"answer":[1,3,4],"sourcePage":20,"explanation":"リハビリテーションは多職種で連携し、急性期から行います。運動中は低血糖にも注意が必要です。回復が難しくても、残存機能の維持や生活支援を目的に実施します。"},{"id":31,"subject":1,"question":"認知症について適切なものはどれか。3つ選べ。","options":["認知症施策推進大綱においては、発症を遅らせることを目指している。","運動不足の改善は、認知症の予防につながらない。","自分の意思で決定できるように支援することが大切である。","MCI(軽度認知障害)は、すべて認知症に移行する。","前頭側頭型認知症の症状の一つとして、物品の名前が出てこない意味性認知症の症状がある。"],"answer":[1,3,5],"sourcePage":20,"explanation":"認知症施策では発症を遅らせることも目指し、本人の意思決定を支えます。前頭側頭型には意味性認知症も含まれ、MCIがすべて認知症になるわけではありません。"},{"id":32,"subject":1,"question":"次の記述のうち、より適切なものはどれか。3つ選べ。","options":["高齢者は、急激な環境の変化があっても、環境への適応力は高い。","せん妄の有病率は、年齢とともに上昇する。","せん妄については、その発症に至ったきっかけで除去可能な要因がないか検討する。","身体疾患の治療薬の中には、うつなどの精神症状を引き起こすものがある。","統合失調症の陰性症状とは、妄想や幻覚をいう。"],"answer":[2,3,4],"sourcePage":21,"explanation":"せん妄は高齢になるほど起こりやすく、薬剤や環境など取り除ける原因を探します。身体疾患の治療薬が精神症状を起こす場合もあります。"},{"id":33,"subject":1,"question":"傷病に関する次の記述のうち、より適切なものはどれか。3つ選べ。","options":["診察や検査は、医師の負担が少ないものから行う。","診断は、医師又は歯科医師が行う。","患者は、自分の傷病の内容を知り、どのような治療を受けるか、自己決定する権利を有している。","予後に関する説明では、患者の理解力なども考慮し、必要に応じて家族の立ちあいを求める。","介護サービスの選択を助言するに当たり、予後は考慮しなくてよい。"],"answer":[2,3,4],"sourcePage":21,"explanation":"診断は医師・歯科医師が行います。本人には病状を知って治療を選ぶ権利があり、説明は理解力に合わせ、必要に応じ家族にも同席してもらいます。"},{"id":34,"subject":1,"question":"次の記述のうち適切なものはどれか。3つ選べ。","options":["介護支援専門員は、利用者の入院時に、退院後の利用者・家族の生活について医療機関に伝えることが重要である。","退院後の居宅サービス計画の立案に役立つ情報には、入院期間中に介護支援専門員に共有される情報が含まれる。","退院前カンファレンスに家族が参加する場合もある。","退院後の訪問看護は、介護支援専門員が指示する。","退院当日は、介護保険サービスを利用できない。"],"answer":[1,2,3],"sourcePage":22,"explanation":"入院中から病院と在宅の情報を共有し、退院後の生活を考えます。退院前カンファレンスには家族も参加でき、退院当日に介護サービスを利用することもできます。"},{"id":35,"subject":1,"question":"高齢者の栄養・食生活について適切なものはどれか。3つ選べ。","options":["低栄養状態では、筋力の低下により転倒しやすい。","男性では、加齢とともに低栄養傾向の者の割合は減少する。","骨粗鬆症予防には、アルコールを摂取することが大切である。","使用している薬剤によっては、摂取してはならない食品がある。","一方的な指導ではなく、双方向的なコミュニケーションを重視した相談の場を設ける。"],"answer":[1,4,5],"sourcePage":22,"explanation":"低栄養は筋力低下や転倒につながります。薬と食品の相互作用にも注意し、一方的な指導ではなく本人と対話して食生活を支援します。"},{"id":36,"subject":1,"question":"次の記述のうち適切なものはどれか。2つ選べ。","options":["重症の糖尿病性ケトアシドーシスの患者では、異常な呼吸がみられることがある。","起座呼吸は、気管支喘息の患者にもみられる。","高齢者の肺活量の低下の一因として、肺の残気量の低下がある。","在宅酸素療法において、携帯用酸素ボンべの使用に慣れれば、介護支援専門員の判断で酸素流量を設定してよい。","簡易酸素マスクで酸素流量が不足する場合は、鼻カニューレに交換する。"],"answer":[1,2],"sourcePage":23,"explanation":"重い糖尿病性ケトアシドーシスでは異常な呼吸がみられます。起座呼吸は喘息などでも起こります。在宅酸素の流量は医師の指示に従います。"},{"id":37,"subject":1,"question":"感染症と主な感染経路の組合せについて、より適切なものはどれか。3つ選べ。","options":["季節性インフルエンザ ― 飛沫感染","腸管出血性大腸菌感染症 ― 接触感染","結核 ― 空気感染","疥癬 ― 飛沫感染","MRSA（メチシリン耐性黄色ブドウ球菌）感染症 ― 空気感染"],"answer":[1,2,3],"sourcePage":23,"explanation":"主な感染経路は、季節性インフルエンザが飛沫、腸管出血性大腸菌感染症が接触、結核が空気感染です。疥癬やMRSAでは接触感染への対策が重要です。"},{"id":38,"subject":1,"question":"高齢者に起こりやすい急変や急変時の対応について適切なものはどれか。3つ選べ。","options":["衣類の下の皮膚をやけどしたときは、衣類を脱がしてから冷やすようにする。","異物をのどに詰まらせたときは、前かがみにさせて背中を強く叩くと排出することがある。","心肺蘇生時の胸骨圧迫は、1分間に60回を目安に行う。","寝たきりの高齢者が嘔吐した場合には、側臥位にする方がよい。","せん妄の原因の一つに薬剤の投与がある。"],"answer":[2,4,5],"sourcePage":24,"explanation":"のどの異物には背部叩打法が有効な場合があります。寝たきりの人が嘔吐したら誤嚥を防ぐ姿勢にし、せん妄では薬剤の影響も確認します。"},{"id":39,"subject":1,"question":"次の記述のうち適切なものはどれか。3つ選べ。","options":["筋力トレーニングは、糖尿病の予防につながる。","大きな負荷で行う筋力トレーニングは、息を止めて行うと安全である。","冬の寒い時期の運動中は、汗をかかなくても水分補給が必要である。","疾病によるたんぱく質摂取に制限のない高齢者では、その摂取の目標量は1日30gである。","喫煙は、脳卒中のリスク因子である。"],"answer":[1,3,5],"sourcePage":24,"explanation":"筋力トレーニングは糖尿病の予防に役立ち、運動時は寒い季節も水分補給が必要です。喫煙は脳卒中のリスクを高めます。力むときも息を止めないようにします。"},{"id":40,"subject":1,"question":"ターミナルケアについて、より適切なものはどれか。3つ選べ。","options":["人生の最終段階を穏やかに過ごすことができる環境の整備は、法律に基づく政府の努力義務とされている。","介護保険の特定施設は、看取りの場となり得る。","看護師は、死亡診断書を作成することができる。","痛みの訴えは、身体的な要因によるものであるため、医療処置で対応できる。","グリーフケアとは、遺族の悲嘆への配慮や対応を行うことである。"],"answer":[1,2,5],"sourcePage":25,"explanation":"穏やかな最期を支える環境整備は政府の努力義務です。特定施設でも看取りは行われ、遺族の悲嘆を支えるグリーフケアも大切です。苦痛は身体面以外にも配慮します。"},{"id":41,"subject":1,"question":"指定通所リハビリテーションについて正しいものはどれか。3つ選べ。","options":["要介護認定を受けた若年性認知症患者は、利用できる。","通所リハビリテーション計画は、介護支援専門員が作成しなければならない。","介護職員は、リハビリテーション会議の構成員になれない。","介護老人保健施設は、提供することができる。","心身機能の維持回復を図り、日常生活の自立を助けるために行われる。"],"answer":[1,4,5],"sourcePage":25,"explanation":"通所リハビリテーションは心身機能の維持回復と自立支援を目的とします。要介護の若年性認知症の人も利用でき、介護老人保健施設などで提供されます。"},{"id":42,"subject":1,"question":"指定短期入所療養介護について正しいものはどれか。2つ選べ。","options":["検査、投薬、注射、処置等は、利用者の病状に照らして妥当適切に行うものとされている。","おむつ代は、利用者が負担するものとされている。","胃ろうがある場合には、利用できない。","日帰りの利用はできない。","短期入所療養介護計画は、既に居宅サービス計画が作成されている場合は、当該計画の内容に沿って作成しなければならない。"],"answer":[1,5],"sourcePage":26,"explanation":"検査・投薬などは病状に合う内容で行い、短期入所療養介護計画は居宅サービス計画に沿って作成します。おむつ代は給付に含まれ、胃ろうがあっても利用できます。"},{"id":43,"subject":1,"question":"指定看護小規模多機能型居宅介護について正しいものはどれか。3つ選べ。","options":["居宅で生活している要支援者も利用できる。","看護小規模多機能型居宅介護計画の作成に当たっては、利用者の多様な活動が確保されるものとなるように努めなければならない。","看護サービスの提供開始時は、主治の医師による指示を口頭で受けなければならない。","サテライト型指定看護小規模多機能型居宅介護事業所の登録定員は、18人以下である。","看護小規模多機能型居宅介護費は、月単位で設定されている。"],"answer":[2,4,5],"sourcePage":26,"explanation":"看護小規模多機能は要介護者向けで、本人の多様な活動を確保します。サテライトの登録定員は18人以下、費用は月単位です。看護には医師の文書による指示が必要です。"},{"id":44,"subject":1,"question":"介護老人保健施設について正しいものはどれか。3つ選べ。","options":["入所者は、病状が安定し入院治療の必要がない要介護3以上の認定を受けた者である。","保健医療サービス又は福祉サービスを提供する者との密接な連携に努めなければならない。","口腔衛生の管理体制を整備し、各入所者の状態に応じた口腔衛生の管理を計画的に行わなければならない。","理学療法士、作業療法士又は言語聴覚士を置かなければならない。","看取り等を行う際のターミナルケア加算は、算定できない。"],"answer":[2,3,4],"sourcePage":27,"explanation":"老健は関係する医療・福祉サービスと連携し、口腔衛生の管理体制を整えます。理学療法士・作業療法士・言語聴覚士のいずれかの配置も必要です。"},{"id":45,"subject":1,"question":"介護医療院について適切なものはどれか。2つ選べ。","options":["住まいと生活を医療が支える新たなモデルとして創設された。","開設者は、医療法人でなければならない。","療養床には、Ⅰ型療養床とⅡ型療養床がある。","併設型小規模介護医療院の入所定員は、25人以下である。","療養室入所者1人当たりの床面積は、5.0m²以上とされている。"],"answer":[1,3],"sourcePage":27,"explanation":"介護医療院は長期療養と生活の場を一体で提供し、Ⅰ型・Ⅱ型療養床があります。開設者は医療法人に限られず、併設型小規模の定員は19人以下です。"},{"id":46,"subject":2,"question":"面接場面におけるコミュニケーション技術について、より適切なものはどれか。3つ選べ。","options":["面接を行う部屋の雰囲気や相談援助者の服装などの外的条件は、円滑なコミュニケーションのために重要である。","相談援助者とクライエントの双方が事態を明確にしていくことが必要である。","クライエントが長く沈黙している場合には、話し始めるまで待たなければならない。","面接の焦点を的確に定めることは、面接を効果的に実施する上で重要である。","傾聴とは、クライエントの支援計画を立てることである。"],"answer":[1,2,4],"sourcePage":29,"explanation":"面接では部屋の雰囲気や服装にも配慮し、本人と援助者が状況を明確にします。焦点を定めつつ、沈黙の意味も考え、必要に応じて働きかけます。"},{"id":47,"subject":2,"question":"ソーシャルワークに関する次の記述のうち、より適切なものはどれか。2つ選べ。","options":["個人の問題解決力や対処能力を強化する役割がある。","支援の終結と事後評価の後のアフターケアが含まれる。","ラポールとは、特定領域の専門家から助言・指導を受けることである。","アドボカシーとは、クライエントが相談した機関では必要な援助ができないとき、他機関へ紹介することである。","送致とは、自己の権利を表明することが困難なクライエントに代わり、援助者が代理としてその権利獲得を行うことである。"],"answer":[1,2],"sourcePage":29,"explanation":"ソーシャルワークは本人の問題解決力や対処能力を高め、終結後のアフターケアも含みます。ラポールは信頼関係、アドボカシーは権利擁護、送致は他機関への紹介です。"},{"id":48,"subject":2,"question":"ソーシャルワークにおける相談援助者の基本姿勢として、より適切なものはどれか。3つ選べ。","options":["統制された情緒的関与とは、個々の人間の状況は独自なものであり、一つとして同じ問題はないと捉え、支援することである。","サービスについて様々な情報提供を行い、利用するサービスや事業者をクライエントが決定できるようにする。","非審判的態度で関わる必要がある。","クライエントを画一的に分類して、援助計画を立てることが必要である。","意図的な感情表出とは、クライエントが感情を自由に表現できるように、意識してクライエントに接することである。"],"answer":[2,3,5],"sourcePage":30,"explanation":"本人が選べるよう情報を提供し、善悪で裁かない姿勢を保ちます。意図的な感情表出は、本人が気持ちを自由に表せるよう援助者が意識して関わることです。"},{"id":49,"subject":2,"question":"ソーシャルワークにおける集団援助について、より適切なものはどれか。2つ選べ。","options":["グループで生じるメンバーの相互作用を意図的に活用する。","プログラム活動は、ソーシャルワーカーの興味や関心事から開始して、そのリーダーシップの下で展開する。","メンバーの個別課題と結びつけて支援するよりも、メンバーに共通する課題の解決を優先する。","他のメンバーの行動を観察することは、自分の問題について新たな見方を獲得する機会にはならない。","生きがいを喪失しているような心理的ニーズの高い高齢者に対しては、セルフヘルプグループのミーティングを活用することも効果的である。"],"answer":[1,5],"sourcePage":30,"explanation":"集団援助ではメンバー同士の相互作用を活かし、個々の課題にも対応します。同じ経験を持つ人のセルフヘルプグループが支えになることもあります。"},{"id":50,"subject":2,"question":"介護保険における訪問介護について正しいものはどれか。3つ選べ。","options":["掃除の際に特別な手間をかけて行う床のワックスがけは、生活援助として算定できる。","手助けや声かけ及び見守りしながら、利用者と一緒に行うシーツ交換は、身体介護として算定できる。","夏服と冬服を入れ替えるなどの衣類の整理は、生活援助として算定できる。","訪問介護員が車いす等での移動介助を行って店に行き、利用者本人が自ら品物を選べるようにする援助は、身体介護として算定できる。","安否確認を主たる目的とする訪問は、生活援助として算定できる。"],"answer":[2,3,4],"sourcePage":31,"explanation":"見守りや声かけをしながら本人と一緒に行う家事は、身体介護に該当する場合があります。衣替えは生活援助ですが、ワックスがけや安否確認だけの訪問は対象外です。"},{"id":51,"subject":2,"question":"介護保険における訪問入浴介護について正しいものはどれか。2つ選べ。","options":["訪問入浴介護従業者として、看護職員又は介護職員のうち1人以上は、常勤でなければならない。","指定訪問入浴介護事業者は、機能訓練指導員を配置しなければならない。","サービスの提供の責任者は、看護職員でなければならない。","サービスの提供方法等の説明には、入浴方法等の内容、作業手順、入浴後の留意点などが含まれる。","指定訪問入浴介護事業者は、協力医療機関を事業の通常の実施地域内と実施地域外に、それぞれ定めなければならない。"],"answer":[1,4],"sourcePage":31,"explanation":"訪問入浴介護では、看護職員又は介護職員の1人以上が常勤である必要があります。本人には入浴方法・手順・入浴後の注意点などを説明します。"},{"id":52,"subject":2,"question":"介護保険における通所介護について正しいものはどれか。2つ選べ。","options":["管理者は、社会福祉主事任用資格を有するものでなければならない。","看護職員は、看護職員としての業務に従事していない時間帯において、機能訓練指導員として勤務することができる。","外部のリハビリテーション専門職が事業所を訪問せず、テレビ電話を用いて利用者の状態を把握することは認められていない。","生活相談員の確保すべき勤務延時間数には、利用者の地域生活を支える取組のために必要な時間を含めることはできない。","指定通所介護事業者は、非常災害に関し定期的に避難、救出その他必要な訓練を行わなければならない。"],"answer":[2,5],"sourcePage":32,"explanation":"看護職員は、看護業務に従事しない時間に機能訓練指導員を兼務できます。通所介護事業所は災害に備え、定期的な避難・救出訓練等を行います。"},{"id":53,"subject":2,"question":"介護保険における短期入所生活介護について正しいものはどれか。3つ選べ。","options":["指定短期入所生活介護は、利用者の家族の身体的及び精神的負担の軽減を図るものでなければならない。","指定短期入所生活介護事業所に介護支援専門員の資格を有する者がいる場合、その者が短期入所生活介護計画のとりまとめを行うことが望ましい。","夕食時間は、午後5時以前が望ましい。","食事の提供に関する業務は、指定短期入所生活介護事業者自らが行うことが望ましい。","いかなる場合も、利用定員を超えてサービスを行うことは認められない。"],"answer":[1,2,4],"sourcePage":32,"explanation":"短期入所生活介護は家族の介護負担の軽減も目的です。資格を持つ職員による計画の取りまとめや、事業者自身による食事提供が望まれます。"},{"id":54,"subject":2,"question":"介護保険における住宅改修について正しいものはどれか。3つ選べ。","options":["同一の住宅に複数の被保険者が居住する場合においては、住宅改修費の支給限度額の管理は被保険者ごとに行われる。","リフト等動力により段差を解消する機器を設置する工事は、住宅改修費の支給対象となる。","洋式便器等への便器の取替えには、既存の便器の位置や向きを変更する場合も含まれる。","浴室内すのこを置くことによる段差の解消は、住宅改修費の支給対象となる。","手すりの取付けのための壁の下地補強は、住宅改修費の支給対象となる。"],"answer":[1,3,5],"sourcePage":33,"explanation":"住宅改修の限度額は住宅ごとではなく被保険者ごとに管理します。便器の位置・向きの変更や手すり設置に伴う下地補強も対象となります。"},{"id":55,"subject":2,"question":"介護保険における小規模多機能型居宅介護について正しいものはどれか。3つ選べ。","options":["サテライト型ではない指定小規模多機能型居宅介護事業所の管理者は、介護支援専門員に小規模多機能型居宅介護計画の作成を担当させるものとする。","養護老人ホームの入所者が、指定小規模多機能型居宅介護を利用することは想定されていない。","登録定員は、12人以下としなければならない。","おおむね6月に1回以上、運営推進会議に活動状況を報告し、評価を受けなければならない。","指定小規模多機能型居宅介護事業所は、住宅地又は住宅地と同程度に利用者の家族や地域住民との交流の機会が確保される地域にあるようにしなければならない。"],"answer":[1,2,5],"sourcePage":33,"explanation":"本体事業所では介護支援専門員が計画作成を担当します。養護老人ホーム入所者の利用は想定されず、家族や地域との交流が確保できる場所への設置が求められます。"},{"id":56,"subject":2,"question":"介護保険における認知症対応型通所介護について正しいものはどれか。3つ選べ。","options":["共用型指定認知症対応型通所介護の利用定員は、1施設1日当たり12人以下としなければならない。","サービスの提供方法等の説明には、利用日の行事及び日課等も含まれる。","認知症の原因となる疾患が急性の状態にある者は、対象とはならない。","単独型・併設型指定認知症対応型通所介護の場合、生活相談員、看護職員又は介護職員のうち2人以上は、常勤でなければならない。","あん摩マッサージ指圧師は、単独型・併設型指定認知症対応型通所介護事業所の機能訓練指導員になることができる。"],"answer":[2,3,5],"sourcePage":34,"explanation":"認知症対応型通所介護では当日の行事や日課も説明します。原因疾患が急性期の人は対象外です。あん摩マッサージ指圧師も機能訓練指導員になれます。"},{"id":57,"subject":2,"question":"指定介護老人福祉施設について正しいものはどれか。3つ選べ。","options":["可能な限り、居宅での生活への復帰を念頭に置いて、入所者がその有する能力に応じ自立した日常生活を営むことができるようにすることを目指さなければならない。","家庭的な雰囲気を保つため、廊下幅は1.6m以下としなければならない。","入所者が可能な限り離床して、食堂で食事を摂るよう支援しなければならない。","常勤の生活相談員を配置しなければならない。","食事の提供又は機能訓練に支障がない広さがあっても、食堂と機能訓練室を同一の場所とすることはできない。"],"answer":[1,3,4],"sourcePage":34,"explanation":"特養は本人の能力に応じた自立と、可能な限りの在宅復帰を目指します。離床して食堂で食べることを支援し、常勤の生活相談員を配置します。"},{"id":58,"subject":2,"question":"成年後見制度について正しいものはどれか。3つ選べ。","options":["成年後見人の職務には、身上保護(身上監護)と財産管理が含まれる。","後見開始の申立は、本人の所在地を管轄する地方裁判所に対し行わなければならない。","成年後見制度の利用の促進に関する法律では、国の責務が定められている。","法定後見制度は、本人の判断能力の程度に応じて、後見と補助の2類型に分かれている。","成年後見制度利用促進基本計画では、権利擁護支援の地域連携ネットワークづくりが必要とされている。"],"answer":[1,3,5],"sourcePage":35,"explanation":"成年後見人は身上保護と財産管理を担います。国には制度利用促進の責務があり、地域連携ネットワークを整えます。法定後見は後見・保佐・補助の3類型です。"},{"id":59,"subject":2,"question":"高齢者虐待防止法について正しいものはどれか。3つ選べ。","options":["「高齢者」とは、75歳以上の者をいう。","養護者が高齢者本人の財産を不当に処分することは、経済的虐待に該当する。","養護者が高齢者に対して著しく拒絶的な対応をすることは、心理的虐待に該当しない。","養介護施設には、介護老人保健施設も含まれる。","都道府県知事は、毎年度、養介護施設従事者等による高齢者虐待の状況等について公表するものとする。"],"answer":[2,4,5],"sourcePage":35,"explanation":"財産の不当な処分は経済的虐待です。老健も養介護施設に含まれ、都道府県知事は施設従事者等による虐待状況を毎年度公表します。法の高齢者は原則65歳以上です。"},{"id":60,"subject":2,"question":"生活保護制度について正しいものはどれか。3つ選べ。","options":["保護は、要保護者の年齢別,性別,健康状態等を考慮して行うものとする。","実施機関は、都道府県知事、市長及び福祉事務所を管理する町村長である。","生活保護費は、最低生活費に被保護者の収入額を加算して支給される。","福祉用具の利用は、生活扶助の対象である。","生活保護の申請は、要保護者、その扶養義務者又はその他の同居の親族が行うことができる。"],"answer":[1,2,5],"sourcePage":36,"explanation":"生活保護は年齢・性別・健康状態等を考慮して必要額を決めます。都道府県知事、市長、福祉事務所を管理する町村長が実施し、本人や扶養義務者等が申請できます。"}], SUBJECTS=["介護支援分野（問題1～25）", "保健医療サービス（問題26～45）", "福祉サービス（問題46～60）"];

function syncRubyDisplay(){
 host.setAttribute('data-ruby',rubyEnabled?'on':'off');
 root.querySelectorAll('[data-ruby-mode]').forEach(button=>button.setAttribute('aria-pressed',String((button.dataset.rubyMode==='on')===rubyEnabled)));
}
root.querySelectorAll('[data-ruby-mode]').forEach(button=>button.onclick=()=>{
 rubyEnabled=button.dataset.rubyMode==='on';syncRubyDisplay();save();stats();
});
const rubyWordPattern=new RegExp(Object.keys(RUBY_WORDS).sort((a,b)=>b.length-a.length).join('|'),'g');
function annotateText(text){
 return RUBY_TEXT[text]||esc(text).replace(rubyWordPattern,w=>`<ruby>${w}<rt>${RUBY_WORDS[w]}<\/rt><\/ruby>`);
}
function applyRuby(){
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),nodes=[];
 while(walker.nextNode()){
  const node=walker.currentNode;
  if(/[㐀-鿿々〆]/.test(node.data)&&!node.parentElement.closest('style,script,ruby,textarea,input,select,option'))nodes.push(node);
 }
 for(const node of nodes){
  const annotated=annotateText(node.data);
  if(!annotated.includes('<ruby>'))continue;
  const template=document.createElement('template');template.innerHTML=annotated;node.replaceWith(template.content);
 }
}
const rubyObserver=new MutationObserver(()=>{
 rubyObserver.disconnect();applyRuby();rubyObserver.observe(root,{childList:true,subtree:true,characterData:true});
});
syncRubyDisplay();rebuild();applyRuby();rubyObserver.observe(root,{childList:true,subtree:true,characterData:true});

})();
