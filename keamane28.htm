/* <![CDATA[ */
(()=>{
'use strict';
const host=document.currentScript.previousElementSibling;
const root=host.attachShadow({mode:'open'});
const QUESTIONS=[{"id":1,"subject":0,"answer":[3,4],"explanation":"社会保険は保険料と給付が結び付いた制度です。加入手続や保険料の納付状況によって、給付を受けられないことがあります。","sourcePage":3,"question":"日本の社会保険制度について適切なものはどれか。2つ選べ。","options":["営利企業が保険者となる。","公的扶助と比較して、救貧的機能が強い。","制度への加入手続をとらない者や保険料を納付しない者は、給付を受けられないことがある。","税方式と比較して、給付と負担の関係が明確である。","介護保険は、職域保険に位置付けられる。"]},{"id":2,"subject":0,"answer":[1,2,3],"explanation":"認知症基本法は、本人の意思に基づく生活と、切れ目のない医療・福祉サービスを重視します。地方公共団体も地域に応じた施策を進めます。","sourcePage":3,"question":"共生社会の実現を推進するための認知症基本法について正しいものはどれか。3つ選べ。","options":["すべての認知症の人が、自らの意思によって日常生活及び社会生活を営むことができるようにすることは、基本理念の一つである。","良質かつ適切な保健医療サービス及び福祉サービスが切れ目なく提供されることは、基本理念の一つである。","地方公共団体は、その地域の状況に応じた認知症施策を総合的かつ計画的に推進する責務を有する。","都道府県は、都道府県認知症施策推進計画の案を作成しようとするときは、あらかじめ、その都道府県内の市町村の意見を聴かなければならない。","市町村認知症施策推進計画は、地域医療構想と一体のものとして策定されなければならない。"]},{"id":3,"subject":0,"answer":[2,3,4],"explanation":"国民は、要介護状態の予防、要介護状態になった後の能力の維持向上、介護保険費用の公平な負担に努めます。","sourcePage":4,"question":"介護保険法第4条に定める「国民の努力及び義務」として正しいものはどれか。3つ選べ。","options":["高齢者の福祉の増進のため、その生活を支える事業を営むよう努める。","自ら要介護状態となることを予防するよう努める。","要介護状態となった場合においても、その有する能力の維持向上に努める。","介護保険事業に要する費用を公平に負担する。","認知症に関する知識の普及及び啓発に努める。"]},{"id":4,"subject":0,"answer":[3,4,5],"explanation":"市町村は介護保険の特別会計を設け、普通徴収の納期を条例で定めます。介護報酬の審査・支払いは国保連に委託できます。","sourcePage":4,"question":"介護保険に関する市町村の事務について正しいものはどれか。3つ選べ。","options":["地域における医療及び介護を総合的に確保するための基本的な方針（総合確保方針）を定めなければならない。","介護保険事業に係る保険給付の円滑な実施を確保するための基本的な指針（基本指針）を定めなければならない。","介護保険に関する収入及び支出について、特別会計を設けなければならない。","介護報酬の審査及び支払いを国民健康保険団体連合会に委託することができる。","普通徴収の方法によって徴収する保険料の納期は、条例で定める。"]},{"id":5,"subject":0,"answer":[2,3,5],"explanation":"登録の移転は申請できます。請求があれば介護支援専門員証を提示し、登録取消し後は返納します。名義貸しは認められません。","sourcePage":5,"question":"介護支援専門員について正しいものはどれか。3つ選べ。","options":["介護支援専門員証の有効期間は、10年である。","登録をしている都道府県以外の指定居宅介護支援事業者の業務に従事するときは、登録の移転の申請をすることができる。","その業務を行うに当たり、関係者から請求があったときは、介護支援専門員証を提示しなければならない。","理由がある場合には、その名義を他人に使用させることができる。","登録が消除された場合には、速やかに、介護支援専門員証をその交付を受けた都道府県知事に返納しなければならない。"]},{"id":6,"subject":0,"answer":[1,2,3],"explanation":"地域密着型サービスの指定権者は市町村長です。指定前の知事への届出、指定後の公示、人員基準の条例化が必要です。","sourcePage":5,"question":"指定地域密着型サービス事業者について正しいものはどれか。3つ選べ。","options":["市町村長は、事業者の指定をしようとするときは、あらかじめその旨を都道府県知事に届け出なければならない。","市町村長は、事業者の指定をしたときは、当該事業者の名称などを公示しなければならない。","サービスに従事する従業者に係る基準は、市町村の条例で定める。","事業者の指定は、毎年更新を受けなければ、その効力を失う。","事業者に対する立入検査の権限を持つのは、都道府県知事である。"]},{"id":7,"subject":0,"answer":[4,5],"explanation":"補足給付は、所得などの要件を満たす人の食費・居住費を支えます。短期入所や地域密着型特養も対象に含まれます。","sourcePage":6,"question":"特定入所者介護サービス費（補足給付）について正しいものはどれか。2つ選べ。","options":["生活保護受給者は、支給対象者に含まれない。","短期入所生活介護は、対象となるサービスではない。","地域密着型介護老人福祉施設入所者生活介護は、対象となるサービスではない。","食費は、支給対象に含まれる。","居住費は、支給対象に含まれる。"]},{"id":8,"subject":0,"answer":[1,2,4],"explanation":"都道府県の支援計画は、高齢者居住安定確保計画や医療計画との関係を踏まえます。介護支援専門員の確保・資質向上も盛り込みます。","sourcePage":6,"question":"介護保険法に定める都道府県介護保険事業支援計画について正しいものはどれか。3つ選べ。","options":["都道府県高齢者居住安定確保計画との調和が保たれたものでなければならない。","医療計画との整合性の確保が図られたものでなければならない。","地域支援事業の量の見込みを定めるものとする。","介護支援専門員の確保及び資質の向上に資する事業に関する事項について定めるよう努めるものとする。","日常生活圏域ごとの認知症対応型共同生活介護に係る必要利用定員総数を定めるものとする。"]},{"id":9,"subject":0,"answer":[2,3,4],"explanation":"第1号保険料は、所得段階別に市町村の条例で定め、おおむね3年間の財政均衡を図ります。徴収方法は本人が自由に選べません。","sourcePage":7,"question":"介護保険における第1号被保険者の保険料について正しいものはどれか。3つ選べ。","options":["被保険者は、普通徴収と特別徴収のいずれかを選択することができる。","保険料率は、おおむね3年を通じ財政の均衡を保つことができるものでなければならない。","所得段階別定額保険料である。","市町村が条例で定める。","生活保護受給者の場合は、免除される。"]},{"id":10,"subject":0,"answer":[2,5],"explanation":"第2号被保険者の給付は、特定疾病による要支援・要介護状態が対象です。医療保険の資格を失うと、介護保険の資格も失います。","sourcePage":7,"question":"介護保険の第2号被保険者について正しいものはどれか。2つ選べ。","options":["被保険者資格の取得には、市町村への届出が必要となる。","保険給付の対象者は、特定疾病を原因として要支援・要介護状態にある者である。","児童福祉法に規定する医療型障害児入所施設の入所者は、被保険者となる。","市町村の区域内に住所を有する者の保険料は、介護保険の保険者である当該市町村が徴収する。","医療保険加入者でなくなった日から、被保険者資格を喪失する。"]},{"id":11,"subject":0,"answer":[1,2,4],"explanation":"財政安定化基金は都道府県が設置します。市町村の拠出金は第1号保険料で賄い、介護保険財政の不足に備えます。","sourcePage":8,"question":"介護保険の財政安定化基金について正しいものはどれか。3つ選べ。","options":["都道府県が設置する。","市町村からの財政安定化基金拠出金の財源は、第1号被保険者の保険料である。","財源には、第2号被保険者の保険料も充当する。","市町村は、介護保険財政に不足が見込まれる場合に活用することができる。","財政安定化基金から貸付けを受けた市町村は、貸付けを受けた年度内に返済しなければならない。"]},{"id":12,"subject":0,"answer":[2,5],"explanation":"一般介護予防事業には、介護予防把握事業と地域リハビリテーション活動支援事業が含まれます。","sourcePage":8,"question":"介護予防・日常生活支援総合事業の一般介護予防事業に含まれるものとして正しいものはどれか。2つ選べ。","options":["権利擁護業務","介護予防把握事業","認知症総合支援事業","介護給付等費用適正化事業","地域リハビリテーション活動支援事業"]},{"id":13,"subject":0,"answer":[1,3,5],"explanation":"居宅介護支援の情報公表では、要介護認定申請の援助、サービス担当者会議、公正・中立な支援などの取組を示します。","sourcePage":9,"question":"介護サービス情報の公表制度における居宅介護支援に係る公表項目として正しいものはどれか。3つ選べ。","options":["要介護認定等の申請に係る援助の取組の状況","介護と看護の連携の状況","サービス担当者会議の開催等の状況","ターミナルケアの質の確保のための取組の状況","公正・中立な居宅介護支援のための取組の状況"]},{"id":14,"subject":0,"answer":[1,3,4],"explanation":"介護保険審査会は都道府県に置かれます。審査時には関係者への通知が必要で、必要に応じ関係人の出頭や審問を求められます。","sourcePage":9,"question":"介護保険審査会について正しいものはどれか。3つ選べ。","options":["都道府県に設置される。","審査請求は、口頭ではなく、文書で行わなければならない。","審査を行う場合、原処分をした市町村及びその他の利害関係人に通知しなければならない。","必要があると認めるときは、関係人に出頭を命じて審問することができる。","都道府県知事の指揮監督の下で裁決を行う。"]},{"id":15,"subject":0,"answer":[1,2,4],"explanation":"国保連は、介護給付費等審査委員会の設置、委託された第三者行為求償事務、事業者への必要な指導・助言などを行います。","sourcePage":10,"question":"介護保険法で定める国民健康保険団体連合会が行う業務として正しいものはどれか。3つ選べ。","options":["介護給付費等審査委員会の設置","市町村から委託を受けて行う第三者行為求償事務","介護給付費交付金の交付","指定居宅サービス事業者に対する必要な指導及び助言","福祉用具貸与の種目の指定"]},{"id":16,"subject":0,"answer":[1,2],"explanation":"新規認定の調査は原則として市町村職員が行います。指定市町村事務受託法人への委託も可能です。","sourcePage":10,"question":"要介護認定の認定調査について正しいものはどれか。2つ選べ。","options":["新規認定の調査は、市町村が、その職員に行わせるものとする。","新規認定の調査は、市町村から指定市町村事務受託法人に委託することができる。","更新認定の調査は、市町村から地域密着型介護老人福祉施設に委託することができない。","更新認定の調査は、市町村から地域包括支援センターに委託することができない。","更新認定の調査は、市町村から指定居宅介護支援事業者に委託することができない。"]},{"id":17,"subject":0,"answer":[1,2,3],"explanation":"新規認定の有効期間は原則6か月です。更新認定では、状態などに応じて3か月や36か月の設定も可能です。","sourcePage":11,"question":"要介護認定の有効期間について正しいものはどれか。3つ選べ。","options":["新規認定の場合には、6月間が原則である。","更新認定の場合には、3月間の設定が可能である。","更新認定の場合には、36月間の設定が可能である。","要介護状態区分の変更の認定の場合には、12月間が原則である。","要介護状態区分の変更の認定の場合には、48月間の設定が可能である。"]},{"id":18,"subject":0,"answer":[1,2,5],"explanation":"介護認定審査会は共同設置できます。主治医の意見を聴き、状態の軽減・悪化防止に必要な療養について市町村に意見を述べられます。","sourcePage":11,"question":"介護認定審査会について正しいものはどれか。3つ選べ。","options":["複数の市町村で共同設置することができる。","審査及び判定をするに当たって必要があると認めるときは、主治医意見書を作成した医師の意見を聴くことができる。","審査及び判定をするに当たって、審査対象者の家族の意見を聴くことはできない。","審査対象者が利用できるサービスの種類を指定する。","要介護状態の軽減又は悪化の防止のために必要な療養について、市町村に意見を述べることができる。"]},{"id":19,"subject":0,"answer":[1,2,3],"explanation":"課題分析の標準項目には、健康状態、ADL、口腔内の状況が含まれます。生活全体を把握して支援につなげます。","sourcePage":12,"question":"介護サービス計画作成のための課題分析（アセスメント）に関する課題分析標準項目として正しいものはどれか。3つ選べ。","options":["健康状態","ADL","口腔内の状況","介護保険料","資産額"]},{"id":20,"subject":0,"answer":[2,3,4],"explanation":"担当者から専門的意見を得る会議です。テレビ電話等も利用でき、虐待などの事情があれば利用者・家族の参加に配慮します。","sourcePage":12,"question":"指定居宅介護支援におけるサービス担当者会議について正しいものはどれか。3つ選べ。","options":["主治の医師の出席が必須である。","家庭内暴力がある場合には、必ずしも利用者及び家族の参加を求めるものではない。","指定居宅サービス等の担当者から、専門的な見地からの意見を求めるものとする。","テレビ電話装置等を活用して行うことができる。","会議の記録は、その完結の日から10年間保存しなければならない。"]},{"id":21,"subject":0,"answer":[1,2,3],"explanation":"本人や家族の状況に合った継続的な支援を組み立てます。住民活動の活用や、退院・退所前からの計画作成支援も大切です。","sourcePage":13,"question":"指定居宅介護支援等の事業の人員及び運営に関する基準第13条の具体的取扱方針のうち、介護支援専門員に係るものとして正しいものはどれか。3つ選べ。","options":["利用者の心身又は家族の状況等に応じ、継続的かつ計画的に指定居宅サービス等の利用が行われるようにしなければならない。","住民による自発的な活動によるサービス等の利用も居宅サービス計画上に位置付けるよう努めなければならない。","介護保険施設等から退院又は退所しようとする要介護者から依頼があった場合には、あらかじめ、居宅サービス計画の作成等の援助を行うものとする。","利用者が介護保険施設へ入院又は入所することが必要になった場合には、介護保険施設への紹介を市町村に依頼しなければならない。","居宅サービス計画に特定福祉用具販売を位置付ける場合にあっては、それが必要な理由を記載する必要はない。"]},{"id":22,"subject":0,"answer":[1,3,5],"explanation":"基本チェックリストには、友人宅への訪問、支えなしでの立ち上がり、日付が分からないことなどの質問があります。","sourcePage":13,"question":"介護予防・日常生活支援総合事業の基本チェックリストの質問項目として正しいものはどれか。3つ選べ。","options":["友人の家を訪ねていますか","自宅は持ち家ですか","椅子に座った状態から何もつかまらずに立ち上がっていますか","褥瘡はありますか","今日が何月何日かわからない時がありますか"]},{"id":23,"subject":0,"answer":[1,2,3],"explanation":"老健の計画担当介護支援専門員は、在宅生活の可能性を定期的に検討し、退所時の情報提供や苦情内容の記録も行います。","sourcePage":14,"question":"介護老人保健施設における計画担当介護支援専門員の業務について正しいものはどれか。3つ選べ。","options":["入所者が居宅において日常生活を営むことができるかどうかについて、定期的に検討する。","入所者の退所に際し、居宅サービス計画の作成等の援助に資するため、居宅介護支援事業者に対して情報を提供する。","入所者及びその家族からの苦情の内容等を記録する。","入所者の処遇に支障がない場合であっても、当該介護老人保健施設の他の職務に従事することはできない。","従業者の管理、業務の実施状況の把握その他の管理を一元的に行う。"]},{"id":24,"subject":0,"answer":[2,3],"explanation":"まず年金の受給状況を確認し、利用できる負担軽減制度を説明します。家族の転職や同居を一方的に勧める対応は適切ではありません。","sourcePage":14,"question":"Aさん（84歳、女性、要介護2）は一人暮らしをしており、近隣に住む長女が働きながらAさんに支援を行っている。Aさんは、長女の負担を軽減するため、短期入所療養介護を利用しようとして、長女を通じて居宅介護支援事業所の介護支援専門員に相談をした。相談内容は、Aさんの収入が公的年金に限られ、それが低額であることから、利用料金を減額する方法がないかというものであった。この場合における介護支援専門員の対応として、より適切なものはどれか。2つ選べ。","options":["Aさんが生活に困窮する者として、生活保護を直ちに申請するよう促す。","Aさんの公的年金の受給状況について、改めて確認する。","費用負担やその軽減の仕組みについて説明する。","長女がより高い所得を得られるよう、ハローワークに相談することを強く勧める。","長女が同居して全面的に介護を行うことを勧める。"]},{"id":25,"subject":0,"answer":[1,3,5],"explanation":"本人の在宅希望を尊重し、親子で話し合います。夜間排泄は医師にも相談し、希望に合う通所介護などで介護負担を軽減します。","sourcePage":15,"question":"Aさん（80歳、女性、要介護3、認知症はない）は訪問介護を利用している。同居している長男から「母は自宅で暮らし続けることを望んでいるが、入浴や夜間の排泄に関する介護の負担が重くなって困っている」との相談があった。そのときの介護支援専門員の対応として、より適切なものはどれか。3つ選べ。","options":["Aさんの意向を尊重するために、Aさんと長男との話し合いの機会を設ける。","長男と相談し、特別養護老人ホームに入所するようAさんを説得する。","夜間の排泄について、薬の影響はないか、Aさんの同意を得てかかりつけの医師に意見を求める。","近所の認知症対応型共同生活介護に照会し、空室があれば、速やかに予約する。","Aさんの希望を改めて確認したところ、他者との交流も望んでいたので、通所介護の利用を提案する。"]},{"id":26,"subject":1,"answer":[1,2,3],"explanation":"サルコペニアは筋力・筋肉量の低下です。体重減少は身体的フレイルの目安となり、社会参加の機会は社会的フレイルの予防につながります。","sourcePage":17,"question":"次の記述のうち、より適切なものはどれか。3つ選べ。","options":["サルコペニアとは、加齢に伴う筋力の低下や筋肉量が減少した状態をいう。","体重減少は、身体的フレイルの目安になる。","社会参加しやすい環境づくりは、社会的フレイルの予防になる。","オーラルフレイルとは、心理的認知的フレイルのことである。","フレイルになると、健康な状態に回復することはない。"]},{"id":27,"subject":1,"answer":[1,4,5],"explanation":"入浴は保清や血行促進に役立ちます。移動補助具は介護負担を減らし、痛み・かゆみ・呼吸困難・頻尿などは睡眠を妨げる要因になります。","sourcePage":17,"question":"次の記述のうち、より適切なものはどれか。3つ選べ。","options":["入浴は、全身の保清を図り、血液循環や新陳代謝を促進する。","口腔内を清掃する際は、義歯は外さない。","膀胱留置カテーテルの使用時は、蓄尿バッグを膀胱と同じ高さに固定する。","適切な移動補助具の導入は、介護負担の軽減につながる。","痛みやかゆみ、咳、呼吸困難、頻尿が睡眠障害の原因となることがある。"]},{"id":28,"subject":1,"answer":[1,3,4],"explanation":"褥瘡は圧迫に加え、低栄養や皮膚の湿潤で生じやすくなります。感染が広がると敗血症につながることもあります。","sourcePage":18,"question":"褥瘡について適切なものはどれか。3つ選べ。","options":["感染を伴って敗血症の原因となることがある。","半座位や座位では、生じない。","低栄養は、発生要因の一つである。","排泄物による皮膚の湿潤が加わることで、より生じやすくなる。","入浴をさせてはならない。"]},{"id":29,"subject":1,"answer":[3,4,5],"explanation":"退院後のリハビリ計画では入院中の情報を生かします。片麻痺の移乗は健側を活用し、歩行には杖や装具の利用も検討します。","sourcePage":18,"question":"次の記述のうち、より適切なものはどれか。3つ選べ。","options":["リハビリテーションは、終末期にある者には行ってはならない。","要介護1の者は、介護予防通所リハビリテーションの対象となる。","退院後の訪問リハビリテーション計画の作成に当たっては、入院中のリハビリテーションの情報を把握する。","片麻痺のある者がベッドから車いすに移乗する場合には、車いすをその人の健側に置くとよい。","歩行障害に対するリハビリテーションでは、杖や装具の活用を検討する。"]},{"id":30,"subject":1,"answer":[1,2],"explanation":"軽度認知障害は認知症へ進む場合があります。記憶障害や見当識障害は中核症状です。ケアでは本人の視点を大切にします。","sourcePage":19,"question":"認知症やそのケアについて適切なものはどれか。2つ選べ。","options":["軽度認知障害（MCI）は、認知症に移行することがある。","記憶障害や見当識障害は、認知症の中核症状である。","パーソン・センタード・ケアとは、介護者本位で効率を優先して行うケアである。","認知症初期集中支援チームは、行方不明の認知症の人を捜索する仕組みである。","認知症カフェは、介護保険の給付対象のサービスである。"]},{"id":31,"subject":1,"answer":[1,2,3],"explanation":"環境の変化はせん妄の誘因になります。高齢者は薬の影響で精神症状が出やすく、統合失調症では幻覚がみられることがあります。","sourcePage":19,"question":"次の記述のうち適切なものはどれか。3つ選べ。","options":["せん妄の発症の誘因の一つとして、入院や施設入所などの環境の変化がある。","高齢者では、薬剤によって精神症状を生じやすい。","統合失調症の症状の一つに、幻覚がある。","老年期のアルコール依存症では、認知症を合併することはない。","老年期うつ病では、妄想の症状が生じることはない。"]},{"id":32,"subject":1,"answer":[1,3,5],"explanation":"診断・治療は医学的根拠に基づいて行います。検査では身体的負担に配慮し、十分な説明と同意も必要です。","sourcePage":20,"question":"診断や治療について適切なものはどれか。3つ選べ。","options":["医学的な根拠に基づき行うことが重要である。","疾病の現在の状態のことを予後という。","検査は、患者の身体的負担も考慮して行う。","検査を行う際には、インフォームド・コンセントは不要である。","治療は、診断に基づき行うことが重要である。"]},{"id":33,"subject":1,"answer":[1,2,4],"explanation":"体重減少は低栄養のサインです。食事介助では摂食動作を確認し、口腔ケアで誤嚥性肺炎の予防につなげます。","sourcePage":20,"question":"栄養・食生活について適切なものはどれか。3つ選べ。","options":["体重減少は、低栄養の徴候の一つである。","食事の介護のためのアセスメントでは、摂食動作を確認する。","食事介助では、本人に頭部後屈の姿勢をとらせることが望ましい。","誤嚥性肺炎の予防のためには、口腔ケアが重要である。","薬の服用時間における食間とは、食事中に服用することである。"]},{"id":34,"subject":1,"answer":[1,4,5],"explanation":"在宅医療は多職種で連携します。中心静脈栄養は中心静脈から栄養を補給し、パルスオキシメーターは血液の酸素飽和度を測定します。","sourcePage":21,"question":"次の記述のうち適切なものはどれか。3つ選べ。","options":["在宅医療では、医師、看護師、介護支援専門員など多職種の連携が重要である。","腹膜透析は、患者の自宅で行われることはない。","胃ろうがある場合には、原則として、入浴は禁止されている。","中心静脈栄養法は、点滴栄養剤を中心静脈に入れる方法である。","パルスオキシメーターは、血液中の酸素飽和度を測定する機器である。"]},{"id":35,"subject":1,"answer":[1,2,3],"explanation":"適切な濃度のアルコールは新型コロナウイルスの消毒に有効です。ノロウイルスは吐物にも含まれ、肺炎球菌ワクチンは重症肺炎の予防に役立ちます。","sourcePage":21,"question":"感染症について適切なものはどれか。3つ選べ。","options":["エタノール濃度70%以上95%以下の消毒液は、新型コロナウイルスの消毒に有効である。","ノロウイルス感染者の吐物には、ノロウイルスが含まれていることがある。","高齢者に対する肺炎球菌ワクチンは、重症な肺炎の予防に有効である。","B型肝炎は、ワクチンで予防することはできない。","感染防護具であるエプロンやガウンは、節約のためできるだけ使い回しをする。"]},{"id":36,"subject":1,"answer":[2,3,4],"explanation":"ストーマは人工的な便・尿の排出口です。気管切開部は管理が必要で、在宅人工呼吸器では災害時の対応も事前に確認します。","sourcePage":22,"question":"次の記述のうち適切なものはどれか。3つ選べ。","options":["経管栄養法で使用するカテーテルは、定期的な交換は不要である。","人工的に造設した便や尿の排泄口のことをストーマという。","気管切開を伴った人工呼吸療法では、気管切開部の管理が必要である。","患者の自宅で人工呼吸器を使用する場合は、災害時の対応方法を確認しておくことが重要である。","インスリンの自己注射をしていれば、低血糖は生じない。"]},{"id":37,"subject":1,"answer":[2,3,5],"explanation":"出血には清潔な布などによる圧迫止血を行います。頭部打撲後の手足の異常は頸髄損傷、皮膚の戻りの遅さは脱水を疑う手掛かりです。","sourcePage":22,"question":"次の記述のうち、より適切なものはどれか。3つ選べ。","options":["吐き気を訴える場合は、誤嚥を予防するために身体を仰向きにして寝かせる。","出血している傷口に対しては、清潔なタオルなどを当て、圧迫して止める方法がある。","転倒して頭部を打撲した後に両手足に力が入らない場合は、頸髄損傷の可能性がある。","高齢者が心筋梗塞を起こしている場合は、必ず強い胸痛がある。","手の甲の皮膚をつまみ上げて離したとき、すぐには元に戻らない場合は、脱水も疑う。"]},{"id":38,"subject":1,"answer":[3,4,5],"explanation":"大腿骨頸部骨折は転倒が主な原因です。膝関節症では適切な運動が役立ち、多疾患のある高齢者では多剤服用の影響に注意します。","sourcePage":23,"question":"次の記述のうち、より適切なものはどれか。3つ選べ。","options":["関節リウマチでは、症状の日内変動がないことが特徴の一つである。","パーキンソン病では、転倒しやすいため、運動療法は禁忌である。","大腿骨頸部骨折の最も多い受傷原因は、転倒である。","膝関節症による痛みや腫脹を抑えるために、定期的な運動が効果的である。","複数の疾患を治療している高齢者では、多剤服用による影響に注意する。"]},{"id":39,"subject":1,"answer":[2,3,5],"explanation":"臨死期には、意識レベルの低下、手足の冷感、分泌物などによる喘鳴がみられることがあります。","sourcePage":23,"question":"臨死期の徴候について、より適切なものはどれか。3つ選べ。","options":["規則正しいリズムの呼吸","意識レベルの低下","四肢冷感","尿量増加","喘鳴"]},{"id":40,"subject":1,"answer":[4,5],"explanation":"ACPは本人の意思を大切にし、繰り返し話し合う取組です。内容を記録し、認知症があっても意思を反映できるよう支援します。","sourcePage":24,"question":"アドバンス・ケア・プランニング（ACP）について、より適切なものはどれか。2つ選べ。","options":["本人が死の直前になったときにのみ話し合う。","本人の考えよりも、家族の考えが優先される。","話合いは、一度だけ行えばよい。","話し合った内容は、文書にまとめておくことが望ましい。","認知症の人の意思を適切に反映できるよう、医療・ケアチームが支援する。"]},{"id":41,"subject":1,"answer":[1,2,3],"explanation":"訪問看護ステーションには看護職員を常勤換算2.5人以上配置し、作業療法士も配置できます。計画は利用者の同意を得て作成します。","sourcePage":24,"question":"指定訪問看護について適切なものはどれか。3つ選べ。","options":["指定訪問看護ステーションには、作業療法士を配置することができる。","指定訪問看護ステーションには、看護職員を常勤換算で2.5人以上置かなければならない。","訪問看護計画書の作成に当たっては、利用者の同意を得なければならない。","介護老人保健施設の入所者にも、訪問看護を提供できる。","看護師は、薬剤の処方を行うことができる。"]},{"id":42,"subject":1,"answer":[1,2,4],"explanation":"胃ろうから薬を入れる際は、粉砕・溶解してよいか確認します。薬による転倒に注意し、お薬手帳で処方情報を共有します。","sourcePage":25,"question":"次の記述のうち、より適切なものはどれか。3つ選べ。","options":["胃ろうから薬剤を注入する際には、錠剤であれば、粉砕や微温湯での溶解をしてよいか確認する。","薬の副作用によるふらつきで、転倒を起こすことがある。","介護職員は、服薬介助を行ってはならない。","服薬の状況について、お薬手帳により、処方情報を適切に共有することが重要である。","高齢者は腎機能が低下しているため、薬の副作用が減弱することが多い。"]},{"id":43,"subject":1,"answer":[1,4,5],"explanation":"通所リハビリの会議は本人・家族の参加が基本です。利用定員や非常災害対策は運営規程に定めます。","sourcePage":25,"question":"指定通所リハビリテーションについて、より適切なものはどれか。3つ選べ。","options":["リハビリテーション会議は、利用者やその家族の参加が基本とされている。","既に居宅サービス計画が作成されている場合には、通所リハビリテーション計画は作成しなくてもよい。","個々の利用者の状態にかかわらず、全員が同一の内容で実施しなければならない。","利用定員について、運営規程に定めておかなければならない。","非常災害対策について、運営規程に定めておかなければならない。"]},{"id":44,"subject":1,"answer":[1,3,5],"explanation":"看護小規模多機能型居宅介護は、訪問看護と小規模多機能型居宅介護を組み合わせます。要支援者は対象外で、本体事業所の登録定員は29人以下です。","sourcePage":26,"question":"指定看護小規模多機能型居宅介護について正しいものはどれか。3つ選べ。","options":["訪問看護と小規模多機能型居宅介護を組み合わせたサービスである。","事業者は、看護サービスを提供する場合は、1人の利用者について複数の医師から指示を受けなければならない。","要支援者は利用できない。","登録者の居宅サービス計画は、居宅介護支援事業所の介護支援専門員が作成する。","サテライト型ではない事業所の登録定員は、29人以下である。"]},{"id":45,"subject":1,"answer":[2,4,5],"explanation":"介護医療院には身体合併症のある認知症高齢者も入所します。生活の場としてレクリエーションにも努め、ユニット型もあります。","sourcePage":26,"question":"介護医療院について、より適切なものはどれか。3つ選べ。","options":["要介護者が居宅において生活を営むことができるようにするための支援を行う施設と定義されている。","入所対象者には、病状が比較的安定期にあり、身体合併症を有する認知症高齢者も含まれる。","介護支援専門員を置かなくてよい。","入所者のためのレクリエーション行事を行うよう努める。","ユニットケアを行うユニット型もある。"]},{"id":46,"subject":2,"answer":[2,3,5],"explanation":"「なぜ」は責められた印象を与えることがあります。面接時間を共有し、相手の立場から気持ちを理解する共感を大切にします。","sourcePage":28,"question":"面接場面におけるコミュニケーション技術について、より適切なものはどれか。3つ選べ。","options":["「どのようなことでお困りですか」という質問は、クローズドクエスチョンである。","「なぜ」で始まる質問は、クライエントの戸惑いが増幅することが多いので、注意が必要である。","面接を開始する際には、面接の終了時間をクライエントと確認しておくことが望ましい。","観察には、非言語的メッセージを捉えることは含まれない。","共感とは、クライエントの立場であれば、どのような気持ちになるだろうか、と想像して感じ取ることである。"]},{"id":47,"subject":2,"answer":[1,3,5],"explanation":"ソーシャルワークは人権と社会的包摂を重視します。多面的な情報収集を行い、必要時には専門家の助言を受けるコンサルテーションを活用します。","sourcePage":28,"question":"ソーシャルワークに関する次の記述のうち、より適切なものはどれか。3つ選べ。","options":["ソーシャルワークは、人権を尊重し、生活課題を有する人々がつながりを実感できる社会への変革と社会的包摂の実現を目指している。","チームアプローチでは、それぞれの専門職の役割を曖昧にすることがよい。","アセスメントに当たっては、クライエントの家族関係や経済状況、地域の社会資源など多岐にわたる情報収集が必要である。","アセスメントシートを使用する際は、すべての項目を順番通りに聞かなければならない。","コンサルテーションとは、関連機関や関連領域の専門家との相談等により、援助者が専門的助言や示唆を受けることである。"]},{"id":48,"subject":2,"answer":[1,2,5],"explanation":"差別せず、判断能力が低下していても自己決定を支えます。不安やためらいに配慮し、話しやすい関係をつくります。","sourcePage":29,"question":"ソーシャルワークにおける相談援助者の基本姿勢として、より適切なものはどれか。3つ選べ。","options":["クライエントに対していかなる差別もしない。","判断能力が低下しているクライエントであっても、自己決定を尊重して支援する。","クライエントから得た個人情報は、クライエントの同意を得ないで、近隣住民からの照会に応じて提供してよい。","支援計画では、短期・長期などの期間を設けることなく、目標を立てる。","クライエントが抱えている不安、ためらい、遠慮などに注意する。"]},{"id":49,"subject":2,"answer":[2,4,5],"explanation":"地域の施設への聞き取りで課題を把握し、使える地域資源を探します。孤立を防ぐ見守りネットワークづくりも重要です。","sourcePage":29,"question":"ソーシャルワークにおける地域援助について、より適切なものはどれか。3つ選べ。","options":["専門家によって行われるため、地域住民の参加は必要ではない。","地域アセスメントの手法には、福祉施設への聞き取り調査が含まれる。","アドボカシーとは、地域に出向き潜在的なニーズを発見することである。","地域包括ケアシステムを構築するプロセスには、地域資源の発掘が含まれる。","高齢者の孤立死を防ぐため、見守りネットワークを構築することが重要である。"]},{"id":50,"subject":2,"answer":[1,2,5],"explanation":"訪問介護は本人の能力を生かした在宅生活を支えます。同居家族がいても事情により生活援助を利用でき、担当者会議等で他職種と連携します。","sourcePage":30,"question":"介護保険における訪問介護について正しいものはどれか。3つ選べ。","options":["訪問介護は、その利用者が可能な限りその居宅において、その有する能力に応じ自立した日常生活を営むことができるよう援助を行うものである。","利用者の同居家族等に障害や疾病がなくても、その他の事情により、家事が困難である場合には、生活援助を利用することができる。","事業所は、訪問回数が少ない利用者には、訪問介護計画を作成しなくてもよい。","事業所のサービス提供責任者には、特段の資格要件はない。","事業所のサービス提供責任者には、サービス担当者会議への出席等により、居宅介護支援事業者との連携を図ることが業務として位置付けられている。"]},{"id":51,"subject":2,"answer":[1,2,4],"explanation":"通所介護は家族の負担軽減も目的とします。機能訓練指導員を配置し、おむつ代は利用料とは別に受け取ることができます。","sourcePage":30,"question":"介護保険における通所介護について正しいものはどれか。3つ選べ。","options":["通所介護の基本方針には、利用者の家族の身体的及び精神的負担の軽減を図ることが含まれる。","機能訓練指導員を1人以上配置しなければならない。","事業者は、事業所ごとに通常の事業の実施地域を定めなくてもよい。","事業者は、利用料以外に利用者が使用したおむつ代の支払いを受けることができる。","事業所の建物と利用者の居住建物が同一の場合、その建物に居住する者以外に、当該事業所を利用させてはならない。"]},{"id":52,"subject":2,"answer":[1,5],"explanation":"訪問入浴介護は、入浴援助を通じた心身機能の維持を図ります。事業者には従業者へのハラスメント防止措置も求められます。","sourcePage":31,"question":"介護保険における訪問入浴介護について正しいものはどれか。2つ選べ。","options":["指定訪問入浴介護の基本方針には、居宅での入浴の援助を行うことによって、利用者の心身機能の維持を図ることが含まれる。","サービスの提供の責任者は、入浴介護に関する知識を有していなくてもよい。","サービス提供に使用する浴槽は、あらかじめ利用者が用意しなければならない。","事業所ごとに、医師を1人以上配置しなければならない。","事業者は、セクシュアルハラスメントにより、従業者の就業環境が害されないよう必要な措置を講じなければならない。"]},{"id":53,"subject":2,"answer":[2,3,4],"explanation":"居室は保健衛生や防災に配慮します。利用者20人未満の併設型事業所では、介護職員は常勤でなくてもよく、理美容代も利用者から受け取れます。","sourcePage":31,"question":"介護保険における短期入所生活介護について正しいものはどれか。3つ選べ。","options":["短期入所生活介護計画は、利用期間にかかわらず、作成しなければならない。","居室については、日照、採光、換気等利用者の保健衛生、防災等について十分考慮しなければならない。","利用者20人未満の併設型の事業所の場合、介護職員は常勤でなくてもよい。","事業者は、利用者から理美容代の支払いを受けることができる。","事業者は、その利用者に対して、利用者の負担により、当該指定短期入所生活介護事業所の従業者以外の者による介護を受けさせることができる。"]},{"id":54,"subject":2,"answer":[2,3,4],"explanation":"工事不要のスロープやポータブルトイレは住宅改修費の対象外です。浴室の床を滑りにくい材質に変える工事は対象になります。","sourcePage":32,"question":"介護保険における住宅改修について正しいものはどれか。3つ選べ。","options":["事前の支給申請に必要な「住宅改修が必要な理由書」は、原則として、被保険者本人が作成する。","取付工事の必要のないスロープによる段差の解消は、住宅改修費の支給対象とならない。","ポータブルトイレの設置は、住宅改修費の支給対象とならない。","浴室の床材を滑りにくいものに変更することは、住宅改修費の支給対象となる。","転居前の住宅について住宅改修費の支給を受けた場合、転居後の住宅については住宅改修費の支給を受けることができない。"]},{"id":55,"subject":2,"answer":[1,2,5],"explanation":"認知症対応型通所介護は社会的孤立の解消も目指します。機能訓練室を備え、居宅サービス計画に合わせて通所介護計画を調整します。","sourcePage":32,"question":"介護保険における認知症対応型通所介護について正しいものはどれか。3つ選べ。","options":["指定認知症対応型通所介護の基本方針には、利用者の社会的孤立感の解消が含まれる。","単独型・併設型指定認知症対応型通所介護事業所は、機能訓練室を備えなければならない。","単独型・併設型指定認知症対応型通所介護事業所の生活相談員は、介護支援専門員でなければならない。","若年性認知症の要介護者は、指定認知症対応型通所介護を利用することができない。","認知症対応型通所介護計画の作成後に居宅サービス計画が作成された場合は、当該認知症対応型通所介護計画を必要に応じて変更する。"]},{"id":56,"subject":2,"answer":[1,2,4],"explanation":"小規模多機能型居宅介護は、家庭的な環境と地域交流を重視します。宿泊の日数に一律の月間上限はなく、通いの利用が極端に少ない状態を避けます。","sourcePage":33,"question":"介護保険における小規模多機能型居宅介護について正しいものはどれか。3つ選べ。","options":["利用者の居宅又はサービスの拠点において、家庭的な環境と地域住民との交流の下で行わなければならない。","宿泊サービスでは、利用者1人につき1月当たりの利用日数の上限は定められていない。","宿泊サービスの利用者が1人であれば、夜間及び深夜の時間帯を通じて、夜勤や宿直を行う職員を置かないことができる。","通いサービスの利用者が登録定員に比べて著しく少ない状態が続くものであってはならない。","宿泊室については、宿泊専用の個室でなければならない。"]},{"id":57,"subject":2,"answer":[1,3],"explanation":"特養では入所者の意思・人格を尊重します。また、入所の必要性が高い人を優先するよう努めます。","sourcePage":33,"question":"指定介護老人福祉施設について正しいものはどれか。2つ選べ。","options":["入所者の意思及び人格を尊重し、常にその者の立場に立ってサービスを提供するように努めなければならない。","災害等のやむを得ない事情があっても、定員を超えて入所させることはできない。","指定介護福祉施設サービスを受ける必要性が高いと認められる入所申込者を優先的に入所させるよう努めなければならない。","入所者の入浴又は清拭の頻度の下限については、定めがない。","夜間には、常勤の介護職員を置くことは義務付けられていない。"]},{"id":58,"subject":2,"answer":[1,2,5],"explanation":"生活保護は要件を満たす人に無差別平等に行い、原則として世帯単位です。老齢基礎年金は収入として認定されます。","sourcePage":34,"question":"生活保護制度について正しいものはどれか。3つ選べ。","options":["すべて国民は、生活保護法の定める要件を満たす限り、保護を無差別平等に受けることができる。","保護は、原則として、世帯を単位として行われる。","介護施設入所者基本生活費は、住宅扶助として給付される。","介護扶助は、原則として、金銭給付により行われる。","被保護者の収入として認定されるものには、老齢基礎年金が含まれる。"]},{"id":59,"subject":2,"answer":[1,4],"explanation":"成年後見制度は本人の意思を尊重します。任意後見では、任意後見人の職務を監督する任意後見監督人が選任されます。","sourcePage":34,"question":"成年後見制度について正しいものはどれか。2つ選べ。","options":["成年後見制度の理念の一つとして、成年被後見人等の自発的意思の尊重がある。","成年後見人の選任は、都道府県社会福祉協議会が行う。","成年後見人は、弁護士に限られる。","任意後見では、任意後見人の不正や権限濫用がないよう監督するために、任意後見監督人が選任される。","任意後見人の配偶者は、任意後見監督人となることができる。"]},{"id":60,"subject":2,"answer":[1,3],"explanation":"高齢者虐待には施設従事者等による虐待も含まれます。長時間の放置などはネグレクトであり、養護者の暴言は心理的虐待に当たります。","sourcePage":35,"question":"高齢者虐待防止法について適切なものはどれか。2つ選べ。","options":["高齢者虐待には、養介護施設従事者等によるものが含まれる。","養護者の高齢者に対する著しい暴言は、身体的虐待に該当する。","高齢者を衰弱させるような養護者による長時間の放置は、著しく養護を怠ること（ネグレクト）に該当する。","介護支援専門員には、高齢者虐待の早期発見の役割は期待されていない。","都道府県は、養護者の負担を軽減するため、養護者の相談、指導及び助言その他の必要な措置を講じなければならない。"]}], SUBJECTS=["介護支援分野（問題1～25）", "保健医療サービス（問題26～45）", "福祉サービス（問題46～60）"];

function syncRubyDisplay(){
 host.setAttribute('data-ruby',rubyEnabled?'on':'off');
 root.querySelectorAll('[data-ruby-mode]').forEach(button=>button.setAttribute('aria-pressed',String((button.dataset.rubyMode==='on')===rubyEnabled)));
}
root.querySelectorAll('[data-ruby-mode]').forEach(button=>button.onclick=()=>{
 rubyEnabled=button.dataset.rubyMode==='on';syncRubyDisplay();save();stats();
});
const rubyWordPattern=new RegExp(Object.keys(RUBY_WORDS).sort((a,b)=>b.length-a.length).join('|'),'g');
function annotateText(text){
 return RUBY_TEXT[text]||esc(text).replace(rubyWordPattern,w=>`<ruby>${w}<rt>${RUBY_WORDS[w]}<\/rt><\/ruby>`);
}
function applyRuby(){
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),nodes=[];
 while(walker.nextNode()){
  const node=walker.currentNode;
  if(/[㐀-鿿々〆]/.test(node.data)&&!node.parentElement.closest('style,script,ruby,textarea,input,select,option'))nodes.push(node);
 }
 for(const node of nodes){
  const annotated=annotateText(node.data);
  if(!annotated.includes('<ruby>'))continue;
  const template=document.createElement('template');template.innerHTML=annotated;node.replaceWith(template.content);
 }
}
const rubyObserver=new MutationObserver(()=>{
 rubyObserver.disconnect();applyRuby();rubyObserver.observe(root,{childList:true,subtree:true,characterData:true});
});
syncRubyDisplay();rebuild();applyRuby();rubyObserver.observe(root,{childList:true,subtree:true,characterData:true});
