'use strict';
const DATA={"categories":["<ruby>産前<rt>さんぜん</rt></ruby>・<ruby>産後休業<rt>さんごきゅうぎょう</rt></ruby>","<ruby>出産手当金<rt>しゅっさんてあてきん</rt></ruby>","<ruby>出産育児一時金<rt>しゅっさんいくじいちじきん</rt></ruby>","<ruby>育児休業<rt>いくじきゅうぎょう</rt></ruby>と<ruby>育児休業給付金<rt>いくじきゅうぎょうきゅうふきん</rt></ruby>","<ruby>出生時<rt>しゅっしょうじ</rt></ruby>・<ruby>出生後<rt>しゅっしょうご</rt></ruby>の<ruby>給付<rt>きゅうふ</rt></ruby>","<ruby>社会保険料<rt>しゃかいほけんりょう</rt></ruby>の<ruby>免除<rt>めんじょ</rt></ruby>","<ruby>児童手当<rt>じどうてあて</rt></ruby>と<ruby>妊婦<rt>にんぷ</rt></ruby>の<ruby>支援給付<rt>しえんきゅうふ</rt></ruby>","<ruby>給付額<rt>きゅうふがく</rt></ruby>と<ruby>免除額<rt>めんじょがく</rt></ruby>の<ruby>計算<rt>けいさん</rt></ruby>"],"questions":[{"id":"tf1","num":1,"kind":"tf","category":0,"text":"<ruby>出産予定日<rt>しゅっさんよていび</rt></ruby>の6<ruby>週間前<rt>しゅうかんまえ</rt></ruby>から、<ruby>本人<rt>ほんにん</rt></ruby>が<ruby>請求<rt>せいきゅう</rt></ruby>すれば<ruby>産前休業<rt>さんぜんきゅうぎょう</rt></ruby>を<ruby>取得<rt>しゅとく</rt></ruby>できる。","answer":1,"explanation":"<ruby>単胎妊娠<rt>たんたいにんしん</rt></ruby>の<ruby>産前休業<rt>さんぜんきゅうぎょう</rt></ruby>は6<ruby>週間前<rt>しゅうかんまえ</rt></ruby>からです。<ruby>本人<rt>ほんにん</rt></ruby>の<ruby>請求<rt>せいきゅう</rt></ruby>が<ruby>必要<rt>ひつよう</rt></ruby>です。","source":""},{"id":"tf2","num":2,"kind":"tf","category":0,"text":"<ruby>双子<rt>ふたご</rt></ruby>を<ruby>妊娠<rt>にんしん</rt></ruby>している<ruby>場合<rt>ばあい</rt></ruby>も、<ruby>産前休業<rt>さんぜんきゅうぎょう</rt></ruby>は<ruby>出産予定日<rt>しゅっさんよていび</rt></ruby>の6<ruby>週間前<rt>しゅうかんまえ</rt></ruby>からに<ruby>限<rt>かぎ</rt></ruby>られる。","answer":0,"explanation":"<ruby>多胎妊娠<rt>たたいにんしん</rt></ruby>の<ruby>産前休業<rt>さんぜんきゅうぎょう</rt></ruby>は14<ruby>週間前<rt>しゅうかんまえ</rt></ruby>から<ruby>取得<rt>しゅとく</rt></ruby>できます。","source":""},{"id":"tf3","num":3,"kind":"tf","category":0,"text":"<ruby>出産当日<rt>しゅっさんとうじつ</rt></ruby>は、<ruby>産前休業<rt>さんぜんきゅうぎょう</rt></ruby>の<ruby>期間<rt>きかん</rt></ruby>に<ruby>含<rt>ふく</rt></ruby>まれる。","answer":1,"explanation":"<ruby>出産当日<rt>しゅっさんとうじつ</rt></ruby>は<ruby>産前<rt>さんぜん</rt></ruby>に<ruby>含<rt>ふく</rt></ruby>め、<ruby>産後休業<rt>さんごきゅうぎょう</rt></ruby>は<ruby>出産日<rt>しゅっさんび</rt></ruby>の<ruby>翌日<rt>よくじつ</rt></ruby>から<ruby>数<rt>かぞ</rt></ruby>えます。","source":""},{"id":"tf4","num":4,"kind":"tf","category":0,"text":"<ruby>産後<rt>さんご</rt></ruby>は<ruby>原則<rt>げんそく</rt></ruby>として8<ruby>週間<rt>しゅうかん</rt></ruby>、<ruby>女性<rt>じょせい</rt></ruby>を<ruby>就業<rt>しゅうぎょう</rt></ruby>させてはならない。","answer":1,"explanation":"<ruby>産後<rt>さんご</rt></ruby>8<ruby>週間<rt>しゅうかん</rt></ruby>は<ruby>原則<rt>げんそく</rt></ruby>として<ruby>就業禁止<rt>しゅうぎょうきんし</rt></ruby>です。","source":""},{"id":"tf5","num":5,"kind":"tf","category":0,"text":"<ruby>産後<rt>さんご</rt></ruby>4<ruby>週間<rt>しゅうかん</rt></ruby>を<ruby>経過<rt>けいか</rt></ruby>すれば、<ruby>本人<rt>ほんにん</rt></ruby>が<ruby>希望<rt>きぼう</rt></ruby>するだけで<ruby>職場<rt>しょくば</rt></ruby>に<ruby>復帰<rt>ふっき</rt></ruby>できる。","answer":0,"explanation":"<ruby>産後<rt>さんご</rt></ruby>6<ruby>週間<rt>しゅうかん</rt></ruby>は<ruby>就業禁止<rt>しゅうぎょうきんし</rt></ruby>です。6<ruby>週間経過後<rt>しゅうかんけいかご</rt></ruby>は、<ruby>本人<rt>ほんにん</rt></ruby>の<ruby>請求<rt>せいきゅう</rt></ruby>と<ruby>医師<rt>いし</rt></ruby>が<ruby>支障<rt>ししょう</rt></ruby>なしと<ruby>認<rt>みと</rt></ruby>めることが<ruby>必要<rt>ひつよう</rt></ruby>です。","source":""},{"id":"tf6","num":6,"kind":"tf","category":0,"text":"<ruby>父親<rt>ちちおや</rt></ruby>は、<ruby>子<rt>こ</rt></ruby>が<ruby>生<rt>う</rt></ruby>まれてから8<ruby>週間<rt>しゅうかん</rt></ruby>が<ruby>経過<rt>けいか</rt></ruby>するまで<ruby>育児休業<rt>いくじきゅうぎょう</rt></ruby>を<ruby>取得<rt>しゅとく</rt></ruby>できない。","answer":0,"explanation":"<ruby>父親<rt>ちちおや</rt></ruby>は<ruby>出生日<rt>しゅっしょうび</rt></ruby>から<ruby>育児休業<rt>いくじきゅうぎょう</rt></ruby>を<ruby>取得<rt>しゅとく</rt></ruby>できます。<ruby>産後<rt>さんご</rt></ruby>パパ<ruby>育休<rt>いくきゅう</rt></ruby>も<ruby>利用<rt>りよう</rt></ruby>できます。","source":""},{"id":"tf7","num":7,"kind":"tf","category":1,"text":"<ruby>出産手当金<rt>しゅっさんてあてきん</rt></ruby>は、<ruby>健康保険<rt>けんこうほけん</rt></ruby>の<ruby>被保険者<rt>ひほけんしゃ</rt></ruby>が<ruby>出産<rt>しゅっさん</rt></ruby>のため<ruby>仕事<rt>しごと</rt></ruby>を<ruby>休<rt>やす</rt></ruby>み、<ruby>給与<rt>きゅうよ</rt></ruby>を<ruby>受<rt>う</rt></ruby>けられない<ruby>場合<rt>ばあい</rt></ruby>などに<ruby>支給<rt>しきゅう</rt></ruby>される。","answer":1,"explanation":"<ruby>被保険者本人<rt>ひほけんしゃほんにん</rt ategories":[0,1,2,3,5],"answer":4,"text":"<ruby>事例<rt>じれい</rt></ruby>を<ruby>読<rt>よ</rt></ruby>んで、<ruby>出産<rt>しゅっさん</rt></ruby>・<ruby>育児支援<rt>いくじしえん</rt></ruby>に<ruby>関<rt>かん</rt></ruby>する<ruby>次<rt>つぎ</rt></ruby>の<ruby>記述<rt>きじゅつ</rt></ruby>のうち、<ruby>正<rt>ただ</rt></ruby>しいものを1つ<ruby>選<rt>えら</rt></ruby>びなさい。","case":"<ruby>夫<rt>おっと</rt></ruby>も<ruby>会社員<rt>かいしゃいん</rt></ruby>で<ruby>共働<rt>ともばたら</rt></ruby>きの<ruby>会社員<rt>かいしゃいん</rt></ruby>のＡさんは、2<ruby>週間後<rt>しゅうかんご</rt></ruby>に<ruby>出産予定日<rt>しゅっさんよていび</rt></ruby>を<ruby>控<rt>ひか</rt></ruby>えているが、<ruby>出産後<rt>しゅっさんご</rt></ruby>も<ruby>働<rt>はたら</rt></ruby>き<ruby>続<rt>つづ</rt></ruby>けたいと<ruby>思<rt>おも</rt></ruby>っている。<ruby>明日<rt>あした</rt></ruby>から<ruby>出産休暇<rt>しゅっさんきゅうか</rt></ruby>を<ruby>取得<rt>しゅとく</rt></ruby>し、その<ruby>後<rt>あと</rt></ruby>は<ruby>育児休業<rt>いくじきゅうぎょう</rt></ruby>を<ruby>取<rt>と</rt></ruby>る<ruby>予定<rt>よてい</rt></ruby>である。なお、Ａさんは、3<ruby>年間同<rt>ねんかんおな</rt></ruby>じ<ruby>会社<rt>かいしゃ</rt></ruby>（<ruby>社会保険適用事業所<rt>しゃかいほけんてきようじぎょうしょ</rt></ruby>）に<ruby>勤<rt>つと</rt></ruby>め、<ruby>賃金<rt>ちんぎん</rt></ruby>の<ruby>支払<rt>しはらい</rt></ruby>を<ruby>受<rt>う</rt></ruby>けている。","source":"<ruby>資料<rt>しりょう</rt></ruby>に<ruby>掲載<rt>けいさい</rt></ruby>された、<ruby>制度改正<rt>せいどかいせい</rt></ruby>を<ruby>反映<rt>はんえい</rt></ruby>した<ruby>改題<rt>かいだい</rt></ruby>です。","options":["<ruby>出産<rt>しゅっさん</rt></ruby>は、<ruby>病気<rt>びょうき</rt></ruby>ではないので、Ａさんの<ruby>出産費用<rt>しゅっさんひよう</rt></ruby>に<ruby>対<rt>たい</rt></ruby>しては、<ruby>健康保険制度<rt>けんこうほけんせいど</rt></ruby>から<ruby>何<rt>なに</rt></ruby>の<ruby>給付<rt>きゅうふ</rt></ruby>も<ruby>行<rt>おこな</rt></ruby>われない。","Ａさんが<ruby>出産前<rt>しゅっさんまえ</rt></ruby>に<ruby>会社<rt>かいしゃ</rt></ruby>を<ruby>休<rt>やす</rt></ruby>んでも、<ruby>健康保険制度<rt>けんこうほけんせいど</rt></ruby>からは<ruby>何<rt>なに</rt></ruby>も<ruby>支給<rt>しきゅう</rt></ruby>されないが、<ruby>出産後<rt>しゅっさんご</rt></ruby>に<ruby>休<rt>やす</rt></ruby>んだ<ruby>場合<rt>ばあい</rt></ruby>には、<ruby>健康保険制度<rt>けんこうほけんせいど</rt></ruby>から<ruby>出産手当金<rt>しゅっさんてあてきん</rt></ruby>が<ruby>支給<rt>しきゅう</rt></ruby>される。","Ａさんはできるだけ<ruby>仕事<rt>しごと</rt></ruby>を<ruby>続< const ALL=[...DATA.questions,...DATA.past], BYID=Object.fromEntries(ALL.map(q=>[q.id,q])), KEY='itosoken-childbirth-v1';
const U=s=>DATA.ui[s]||s;
const tones=['#247c69','#aa6b2d','#6f64a6','#357ea1','#626f89','#a75e61','#718844','#9b6b91','#3d8992'];
let answers={},results={},history={},settings={ruby:false,big:false},storageOK=true,readError=false;
try{let saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved){if(saved.version!==1)throw Error('version');for(const q of ALL){const a=saved.answers?.[q.id];if(Number.isInteger(a)&&(q.kind==='tf'?[0,1]:[1,2,3,4,5]).includes(a))answers[q.id]=a;const r=saved.results?.[q.id];if(['correct','wrong','unanswered'].includes(r)&&((a===undefined&&r==='unanswered')||(a!==undefined&&r===(a===q.answer?'correct':'wrong'))))results[q.id]=r;const h=saved.history?.[q.id]||r;if(['correct','wrong','unanswered'].includes(h))history[q.id]=h;}settings={ruby:saved.settings?.ruby===true,big:saved.settings?.big===true};}}catch(e){if(e instanceof SyntaxError)readError=true;else storageOK=false;}
let mode='tf',active=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify({version:1,answers,results,history,settings}));storageOK=true;}catch(e){storageOK=false;}}
function status(id){return history[id]||'';}
function count(qs,which){return qs.filter(q=>status(q.id)===which).length;}
function scoreQuestions(qs,a){return qs.reduce((s,q)=>{if(a[q.id]===undefined)s.unanswered++;else if(a[q.id]===q.answer)s.correct++;else s.wrong++;return s;},{correct:0,wrong:0,unanswered:0,total:qs.length});}
function gradeQuestions(qs){for(const q of qs){results[q.id]=answers[q.id]===undefined?'unanswered':answers[q.id]===q.answer?'correct':'wrong';history[q.id]=results[q.id];}save();}
function applySettings(){document.body.classList.toggle('ruby-off',!settings.ruby);document.body.classList.toggle('big',settings.big);for(const [id,v] of [['rubyOn',settings.ruby],['rubyOff',!settings.ruby],['fontSize',settings.big]]){const b=document.getElementById(id);b.classList.toggle('selected',v);b.setAttribute('aria-pressed',String(v));}}
document.getElementById('rubyOn').onclick=()=>{settings.ruby=true;save();applySettings();};
document.getElementById('rubyOff').onclick=()=>{settings.ruby=false;save();applySettings();};
document.getElementById('fontSize').onclick=()=>{settings.big=!settings.big;save();applySettings();};
function nav(){return `<nav class="nav" aria-label="学習メニュー">${[['tf','○×問題',DATA.questions.length],['past','本試験の過去問',DATA.past.length],['wrong','間違えた問題',count(ALL,'wrong')]].map(([m,t,n])=>`<button data-mode="${m}" class="${mode===m?'selected':''}" aria-pressed="${mode===m}">${U(t)} <b>${n}</b></button>`).join('')}</nav>`;}
function header(){return `<section class="intro"><div class="eyebrow">CHILDBIRTH & CHILDCARE / CHECK TEST</div><h1>${U('出産・育児の社会保障')}<br>${U('確認テスト')}</h1><p class="subtitle">${U('一問一答で基礎を確認し、過去問で力を試しましょう。')}</p><div class="stats"><div><strong>${DATA.questions.length}</strong><span>${U('○×問題')}</span></div><div><strong>${DATA.past.length}</strong><span>${U('本試験の過去問')}</span></div><div><strong>${count(ALL,'correct')}<small style="font-size:15px"> / ${ALL.length}</small></strong><span>${U('正解した問題')}</span></div></div></section>`;}
function footer(){document.getElementById('footer').innerHTML=`<p>${U(storageOK?'学習記録は、このブラウザ内に保存されます。':'この環境では学習記録を保存できません。画面を閉じると記録が消えます。')}</p><details><summary>${U('出典と教材について')}</summary><p>${U('添付資料「出産に関する社会保障」を基に作成。')} 2026.11.08</p><p>${U('○×問題は資料の論点と現在の制度を基にしたオリジナル問題です。')}</p><p>${U('資料に掲載された過去問3問を収録しています。出題回の誤記を訂正し、第23回は資料に合わせた改題として表示しています。')}</p><p>${U('給付の条件と計算の前提は、各問の問題文・解説で確認できます。')}</p><ul>${DATA.sources.map(s=>`<li><a href="${s.url}" target="_blank" rel="noopener">${s.title}</a></li>`).join('')}</ul><p>${U('このテストは学習用です。国家試験の合否判定ではありません。')}</p></details><p style="margin-top:13px"><button data-action="reset">${U('記録をすべて消去')}</button></p>`;}
function goTop(){window.scrollTo({top:0,behavior:'instant'});document.querySelector('h2')?.focus({preventScroll:true});}
function home(){active=null;render();goTop();}
function start(qs,title,category=null){active={ids:qs.map(q=>q.id),title,category};render();goTop();}
function retry(){for(const id of active.ids){delete answers[id];delete results[id];}save();render();goTop();}
function dashboard(){
 if(mode==='tf')return `<div class="section-heading"><h2>${U('項目を選んで学習')}</h2><button data-action="alltf">${U('全問に挑戦')} →</button></div><div class="grid">${DATA.categories.map((title,i)=>{const qs=DATA.questions.filter(q=>q.category===i),c=count(qs,'correct');return `<button class="tile" data-cat="${i}" style="--tone:${tones[i]}"><div class="tile-head"><span class="number">${i+1}</span><span class="pill">${qs.length} ${U('問')}</span></div><div class="tile-name">${title}</div><div class="tile-foot">${U('正解数')} ${c} / ${qs.length}</div><div class="track"><div class="fill" style="width:${c/qs.length*100}%"></div></div></button>`;}).join('')}</div>`;
 if(mode==='past')return `<div class="section-heading"><h2>${U('本試験の過去問')}</h2><button data-action="allpast">${U('全問に挑戦')} →</button></div><p class="muted">${U('正しい選択肢を1つ選んでください。')}</p><div class="grid" style="margin-top:15px">${DATA.past.map(q=>`<button class="tile" data-past="${q.id}" style="--tone:#357ea1"><div class="tile-head"><span class="number">${q.num}</span><span class="pill">${U(status(q.id)==='correct'?'正解':status(q.id)==='wrong'?'不正解':status(q.id)==='unanswered'?'未回答':'未採点')}</span></div><div class="tile-name">${q.label}</div><div class="tile-foot">${q.categories.map(i=>DATA.categories[i]).join(' ／ ')}</div></button>`).join('')}</div>`;
 const wrong=ALL.filter(q=>status(q.id)==='wrong');const unanswered=ALL.filter(q=>status(q.id)==='unanswered');return `<div class="section-heading"><h2>${U('間違えた問題')} ${wrong.length}${U('問')}</h2></div>${wrong.length?`<p class="muted">${U('解説を確認して、もう一度挑戦しましょう。')}</p><div class="actions"><button class="primary" data-action="review">${U('もう一度解く')} →</button></div><div class="grid">${wrong.map(q=>`<button class="tile" data-single="${q.id}" style="--tone:#a75e61"><span class="tile-name">${q.kind==='tf'?U('○×問題')+' '+q.num:q.label}</span><span class="tile-foot">${q.kind==='tf'?DATA.categories[q.category]:U('本試験の過去問')}</span></button>`).join('')}</div>`:`<div class="empty"><h3>${U('まだ該当する問題はありません。')}</h3><p class="muted">${U('問題を解いて採点すると、復習する問題が表示されます。')}</p></div>`}${unanswered.length?`<div class="actions"><button data-action="unanswered">${U('未回答の問題')} ${unanswered.length}${U('問')} →</button></div>`:''}`;
}
function question(q,i){const graded=Boolean(results[q.id]),a=answers[q.id],s=results[q.id],label=s==='correct'?'正解':s==='wrong'?'不正解':'未回答';return `<article class="question" id="q-${q.id}" aria-label="問題${q.num}"><div class="q-top"><span class="q-num">${q.kind==='tf'?U('問題')+' '+q.num:q.label}</span>${graded?`<span class="status-${s}">${U(label)}</span>`:`<span class="muted">${i+1} / ${active.ids.length}</span>`}</div><div class="${q.kind==='tf'?'tf-layout':''}"><div><p class="q-text">${q.text}</p>${q.source?`<p class="source">${q.source}</p>`:''}</div>${q.kind==='tf'?`<div class="tf-options" role="group" aria-label="問題${q.num}の回答">${[1,0].map(v=>`<button data-answer="${q.id}" data-value="${v}" aria-label="${v?'○ 正しい':'× 誤り'}" aria-pressed="${a===v}" ${graded?'disabled':''}>${v?'○':'×'}</button>`).join('')}</div>`:''}</div>${q.case?`<div class="case"><strong>${U('事例')}</strong>${q.case}${q.note?`<p class="source">${q.note}</p>`:''}</div>`:''}${q.kind==='past'?`<div class="options" role="group" aria-label="選択肢">${q.options.map((text,j)=>`<button class="option" data-answer="${q.id}" data-value="${j+1}" aria-pressed="${a===j+1}" ${graded?'disabled':''}><span class="opt-num">${j+1}</span><span>${text}</span></button>`).join('')}</div>`:''}${graded?`<div class="explanation"><div class="key">${U('正答')}：${q.kind==='tf'?(q.answer?'○':'×'):q.answer} <small class="muted">${U('回答')}：${a===undefined?U('未回答'):q.kind==='tf'?(a?'○':'×'):a}</small></div>${q.kind==='tf'?`<p>${q.explanation}</p>`:`<h3>${U('選択肢ごとの解説')}</h3><ol>${q.explanations.map((e,j)=>`<li><span class="verdict ${q.answer===j+1?'status-correct':'status-wrong'}">${j+1}　${q.answer===j+1?'○':'×'}</span>${e}</li>`).join('')}</ol>`}</div>`:''}</article>`;}
function session(){const qs=active.ids.map(id=>BYID[id]),done=qs.every(q=>results[q.id]),n=qs.filter(q=>answers[q.id]!==undefined).length,s=scoreQuestions(qs,answers);let related=active.category===null?[]:DATA.past.filter(q=>q.categories.includes(active.category));return `<button data-action="home">← ${U(mode==='past'?'過去問一覧へ':'項目一覧へ')}</button><section class="session-head"><h2 tabindex="-1">${active.title}</h2><p>${U(qs.every(q=>q.kind==='tf')?'正しいと思う場合は○、誤りと思う場合は×を選んでください。':'回答後に採点すると、正答と根拠を確認できます。')}</p></section>${done?`<section class="result" role="status" tabindex="-1"><span>${U('得点')}</span><div><strong class="score">${s.correct}</strong> / ${s.total} ${U('点')} <span class="muted">（${Math.round(s.correct/s.total*100)}%）</span></div><p>${U(s.correct===s.total?'全問正解です。よく理解できています。':'解説を確認して、もう一度挑戦しましょう。')}</p><div class="muted">${U('不正解')} ${s.wrong}　／　${U('未回答')} ${s.unanswered}</div><div class="actions"><button data-action="retry">${U('もう一度解く')}</button>${s.wrong?`<button data-action="sessionWrong">${U('間違えた問題')} ${s.wrong}${U('問')} →</button>`:''}</div></section>`:''}<div class="session-tools"><span class="muted" id="answered">${U('回答済み')} ${n} / ${qs.length}</span><span class="muted">${done?U('解答と解説'):U('採点前です。回答を選んでください。')}</span></div><div id="questions">${qs.map(question).join('')}</div>${related.length?`<section class="session-head"><h3>${U('この項目の関連過去問')}</h3><div class="related">${related.map(q=>`<button data-past="${q.id}">${q.label} →</button>`).join('')}</div></section>`:''}<div class="bottom-bar"><span id="bottomCount">${U('回答済み')} ${n} / ${qs.length}</span><div class="tools"><button data-action="home">${U('戻る')}</button><button class="primary" data-action="${done?'retry':'grade'}">${U(done?'もう一度解く':'採点する')}</button></div></div>`;}
function render(){document.getElementById('app').innerHTML=(active?'':header())+nav()+(active?session():dashboard())+(readError?`<div class="notice">${U('保存した記録を読み込めませんでした。新しく開始します。')}</div>`:'');footer();applySettings();}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.mode){mode=b.dataset.mode;home();return;}
 if(b.dataset.cat!==undefined){const i=Number(b.dataset.cat);start(DATA.questions.filter(q=>q.category===i),`${i+1}　${DATA.categories[i]}`,i);return;}
 if(b.dataset.past){mode='past';const q=BYID[b.dataset.past];start([q],q.label);return;}
 if(b.dataset.single){const q=BYID[b.dataset.single];start([q],q.kind==='tf'?U('○×問題')+' '+q.num:q.label);retry();return;}
 if(b.dataset.answer){const id=b.dataset.answer;answers[id]=Number(b.dataset.value);save();document.querySelectorAll(`[data-answer="${id}"]`).forEach(x=>x.setAttribute('aria-pressed',String(Number(x.dataset.value)===answers[id])));let n=active.ids.filter(id=>answers[id]!==undefined).length;for(const el of ['answered','bottomCount'])document.getElementById(el).innerHTML=U('回答済み')+' '+n+' / '+active.ids.length;footer();return;}
 switch(b.dataset.action){case'home':home();break;case'alltf':start(DATA.questions,U('○×問題')+' '+DATA.questions.length+U('問'));break;case'allpast':start(DATA.past,U('本試験の過去問')+' '+DATA.past.length+U('問'));break;case'grade':gradeQuestions(active.ids.map(id=>BYID[id]));render();document.querySelector('.result')?.focus();document.querySelector('.result')?.scrollIntoView({behavior:'instant',block:'start'});break;case'retry':retry();break;case'review':{const qs=ALL.filter(q=>status(q.id)==='wrong');start(qs,U('間違えた問題'));retry();break;}case'sessionWrong':{mode='wrong';const qs=active.ids.map(id=>BYID[id]).filter(q=>status(q.id)==='wrong');start(qs,U('間違えた問題'));retry();break;}case'unanswered':{const qs=ALL.filter(q=>status(q.id)==='unanswered');start(qs,U('未回答の問題'));retry();break;}case'reset':if(confirm('このブラウザに保存した回答と採点結果をすべて消去します。よろしいですか？')){answers={};results={};history={};save();home();}break;}
});
save();render();
</script></body></html>
