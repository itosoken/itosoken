(()=>{
'use strict';
const host=document.currentScript.previousElementSibling;
const root=host.attachShadow({mode:'open'});
const QUESTIONS=[{"id":1,"subject":0,"question":"わが国の近年の介護を取り巻く状況の説明として適切なものはどれか。3つ選べ。","options":["介護を要する高齢者を同居している高齢者が介護する「老老介護」は、減少傾向にある。","育児と介護を同時に担う「ダブルケア」が課題となっている。","「ヤングケアラー」への支援が課題となっている。","介護者が仕事と介護を両立できるよう、法律により介護休暇及び介護休業が制度化されている。","特別養護老人ホームなどの老人ホームでの死亡者数は、減少傾向にある。"],"answer":[2,3,4],"sourcePage":3,"explanation":"育児と介護を同時に担う人や、ヤングケアラーへの支援が課題です。仕事と介護の両立を支える制度として、介護休暇・介護休業があります。"},{"id":2,"subject":0,"question":"2021(令和3)年度末における全国の要介護(要支援)認定者数の状況として正しいものはどれか。2つ選べ。","options":["要介護(要支援)認定者のうち、第2号被保険者の占める割合は、30%を超えている。","第1号被保険者に占める要介護(要支援)認定者の割合は、40%を超えている。","85歳以上の被保険者のうち、要介護(要支援)認定者の占める割合は、50%を超えている。","要介護(要支援)認定者数は、男性より女性の方が多い。","要介護(要支援)状態区分別でみると、認定者数が最も多いのは、要介護5である。"],"answer":[3,4],"sourcePage":3,"explanation":"2021年度末では、85歳以上の被保険者の半数以上が要介護・要支援認定を受けています。認定者数は男性より女性が多くなっています。"},{"id":3,"subject":0,"question":"介護保険法に定める医療保険者の事務として正しいものはどれか。2つ選べ。","options":["第1号被保険者の保険料の特別徴収を行う。","第2号被保険者の保険料を徴収する。","社会保険診療報酬支払基金に対し、介護給付費・地域支援事業支援納付金を納付する。","市町村に対し、介護給付費交付金を交付する。","市町村に対し、地域支援事業支援交付金を交付する。"],"answer":[2,3],"sourcePage":4,"explanation":"医療保険者は第2号被保険者の介護保険料を徴収し、支払基金へ納付します。第1号被保険者の保険料徴収は市町村が担います。"},{"id":4,"subject":0,"question":"介護保険法に定める都道府県の責務として正しいものはどれか。2つ選べ。","options":["介護報酬の算定基準を適切に設定しなければならない。","介護保険事業の運営が健全かつ円滑に行われるように、必要な助言及び適切な援助をしなければならない。","介護保険事業が効率的に行われるように、年金保険者を指導・監督しなければならない。","認知症に関する知識の普及及び啓発に努めなければならない。","高齢者が経済活動に参加することを促さなければならない。"],"answer":[2,4],"sourcePage":4,"explanation":"都道府県は、介護保険事業の円滑な運営を助け、認知症に関する知識の普及・啓発に努めます。介護報酬の算定基準は国が定めます。"},{"id":5,"subject":0,"question":"介護保険の第1号被保険者について正しいものはどれか。2つ選べ。","options":["市町村の区域内に住所を有する65歳以上の者をいう。","保険給付の対象となるのは、特定疾病を原因として要支援・要介護状態になった者に限られる。","保険料は、地域支援事業の任意事業の財源に充当される。","居住する市町村から転出した場合は、その翌月から転出先の市町村の被保険者となる。","医療保険加入者でなくなった日から、第1号被保険者の資格を喪失する。"],"answer":[1,3],"sourcePage":5,"explanation":"第1号被保険者は、原則として市町村に住所がある65歳以上の人です。保険料は地域支援事業の任意事業にも使われ、給付の原因は特定疾病に限定されません。"},{"id":6,"subject":0,"question":"区分支給限度基準額が適用されるサービスとして正しいものはどれか。3つ選べ。","options":["訪問介護","地域密着型通所介護","居宅療養管理指導","認知症対応型通所介護","地域密着型介護老人福祉施設入所者生活介護"],"answer":[1,2,4],"sourcePage":5,"explanation":"訪問介護・地域密着型通所介護・認知症対応型通所介護は、区分支給限度基準額の対象です。居宅療養管理指導や地域密着型特養のサービスは対象外です。"},{"id":7,"subject":0,"question":"市町村長が指定する事業者が行うサービスとして正しいものはどれか。3つ選べ。","options":["居宅介護支援","通所介護","認知症対応型共同生活介護","介護予防短期入所生活介護","介護予防支援"],"answer":[1,3,5],"sourcePage":6,"explanation":"市町村長は、居宅介護支援・介護予防支援・地域密着型サービスの事業者を指定します。認知症対応型共同生活介護は地域密着型サービスです。"},{"id":8,"subject":0,"question":"介護保険制度の給付と利用者負担について正しいものはどれか。3つ選べ。","options":["被保険者が災害により住宅に著しい損害を受けた場合には、市町村は、定率の利用者負担を減免することができる。","施設介護サービス費に係る利用者負担は、一律2割の定率負担となっている。","区分支給限度基準額を超えてサービスを利用した場合には、その超えた部分は3割負担となる。","介護保険施設入所者の理美容代は、保険給付の対象とならない。","居宅介護サービス計画費については、利用者負担はない。"],"answer":[1,4,5],"sourcePage":6,"explanation":"災害時には利用者負担を減免できる場合があります。理美容代は自己負担で、居宅介護サービス計画費には利用者負担がありません。限度額超過分は原則全額自己負担です。"},{"id":9,"subject":0,"question":"高額介護サービス費について正しいものはどれか。2つ選べ。","options":["世帯単位で算定される。","地域密着型サービスの利用に係る利用者負担額は、支給の対象とならない。","同一世帯に住民税が課税されている者がいる場合には、支給の対象とならない。","利用者の負担上限額は、6月単位で設定されている。","利用者の負担上限額は、所得によって異なる。"],"answer":[1,5],"sourcePage":7,"explanation":"高額介護サービス費は、原則として世帯の月ごとの利用者負担を合算して算定します。負担上限額は所得区分によって異なります。"},{"id":10,"subject":0,"question":"介護保険法に定める市町村介護保険事業計画について正しいものはどれか。3つ選べ。","options":["市町村老人福祉計画と一体のものとして作成されなければならない。","市町村地域福祉計画と調和が保たれたものでなければならない。","介護保険施設の種類ごとの必要入所定員総数の見込みを定めなければならない。","各年度における地域支援事業の量の見込みを定めるものとする。","計画期間は、5年を1期とする。"],"answer":[1,2,4],"sourcePage":7,"explanation":"市町村介護保険事業計画は、老人福祉計画と一体で作成し、地域福祉計画との調和を図ります。地域支援事業の量を見込み、計画期間は3年です。"},{"id":11,"subject":0,"question":"介護保険の財政について正しいものはどれか。3つ選べ。","options":["施設等給付の公費負担割合は、国30%都道府県10%市町村10%である。","調整交付金の総額は、介護給付及び予防給付に要する費用の総額の5%に相当する額である。","介護給付及び予防給付に要する費用は、公費と保険料によりそれぞれ50%ずつ賄われる。","第1号被保険者と第2号被保険者の保険料負担の按分割合は、制度施行以来変わっていない。","市町村特別給付に要する費用は、その市町村の第1号被保険者の保険料により賄われる。"],"answer":[2,3,5],"sourcePage":8,"explanation":"介護給付・予防給付の財源は公費と保険料が各50％で、調整交付金は全体の5％です。市町村特別給付は、その市町村の第1号被保険者の保険料で賄います。"},{"id":12,"subject":0,"question":"介護保険における第2号被保険者の保険料について正しいものはどれか。3つ選べ。","options":["介護予防・日常生活支援総合事業の費用にも充てられる。","所得段階別定額保険料である。","被用者保険の被保険者の場合には、事業主負担がある。","被用者保険の被保険者である生活保護受給者は、保険料を支払う。","被用者保険の被保険者の保険料は、市町村が条例で定める。"],"answer":[1,3,4],"sourcePage":8,"explanation":"第2号被保険者の保険料は総合事業にも使われます。被用者保険では事業主負担があり、生活保護受給者でも被用者保険の被保険者なら保険料を支払います。"},{"id":13,"subject":0,"question":"認知症総合支援事業において配置の対象とされているものとして正しいものはどれか。3つ選べ。","options":["福祉用具専門相談員","認知症地域支援推進員","チームオレンジコーディネーター","認知症初期集中支援チーム","介護サービス相談員"],"answer":[2,3,4],"sourcePage":9,"explanation":"認知症総合支援事業では、認知症地域支援推進員・チームオレンジコーディネーター・認知症初期集中支援チームが配置の対象です。"},{"id":14,"subject":0,"question":"介護予防ケアマネジメント(第1号介護予防支援事業)について正しいものはどれか。2つ選べ。","options":["事業の受託者への費用の審査及び支払に係る事務は、国民健康保険団体連合会に委託できない。","介護予防ケアマネジメントの利用者負担は、1割又は2割である。","医療機関が行わなければならない。","住所地特例適用被保険者については、入所又は入居する施設が所在する市町村が行う。","要支援者は、対象である。"],"answer":[4,5],"sourcePage":9,"explanation":"介護予防ケアマネジメントは総合事業の一部で、要支援者も対象です。住所地特例の対象者については、施設がある市町村が実施します。利用者負担はありません。"},{"id":15,"subject":0,"question":"介護保険審査会について正しいものはどれか。2つ選べ。","options":["市町村に設置される。","委員には、被保険者を代表する者が含まれる。","介護報酬の審査・支払についての不服は、審査請求の対象となる。","指定介護老人福祉施設の指定についての不服は、審査請求の対象となる。","保険料の滞納処分についての不服は、審査請求の対象となる。"],"answer":[2,5],"sourcePage":10,"explanation":"介護保険審査会は都道府県に置かれ、被保険者の代表も委員になります。保険料やその滞納処分への不服も審査請求の対象です。"},{"id":16,"subject":0,"question":"介護保険に関して市町村が有する権限について正しいものはどれか。2つ選べ。","options":["被保険者に対する老齢等年金給付の支給状況について、年金保険者に対し資料の提供を求める。","要介護認定に関する審査請求事件について、医療保険者に対し必要な報告を求める。","被保険者の保険料に関し、被保険者の収入について調査する。","介護サービス情報の公表制度に係る報告に関し、指定居宅サービス事業者を調査する。","不正の手段により登録を受けた介護支援専門員の登録を消除する。"],"answer":[1,3],"sourcePage":10,"explanation":"市町村は保険料の徴収等に必要な年金の支給状況や収入を調査できます。介護支援専門員の登録の消除や介護サービス情報の公表は都道府県の権限です。"},{"id":17,"subject":0,"question":"要介護認定の認定調査票(基本調査)に含まれる項目として正しいものはどれか。3つ選べ。","options":["座位保持","整髪","預貯金の額","学歴","買い物"],"answer":[1,2,5],"sourcePage":11,"explanation":"認定調査では、座位保持・整髪・買い物など、心身の状態や生活上の行為を確認します。預貯金や学歴は基本調査の項目ではありません。"},{"id":18,"subject":0,"question":"要介護認定の一次判定について正しいものはどれか。2つ選べ。","options":["要介護認定等基準時間は、1日当たりの時間として推計される。","要介護認定等基準時間は、実際に居宅等で行われている介護時間そのものである。","全国共通の基準に基づき行われる。","都道府県が行わなければならない。","一次判定の結果は、申請した被保険者に対し通知されなければならない。"],"answer":[1,3],"sourcePage":11,"explanation":"一次判定は全国共通の基準で行い、介護に必要な手間を1日当たりの時間として推計します。実際に家庭で介護した時間そのものではありません。"},{"id":19,"subject":0,"question":"要介護認定に係る主治医意見書の項目として正しいものはどれか。3つ選べ。","options":["栄養・食生活","感染症の有無","医学的管理の必要性","趣味","職歴"],"answer":[1,2,3],"sourcePage":12,"explanation":"主治医意見書には、栄養・食生活、感染症の有無、医学的管理の必要性などが含まれます。趣味や職歴は所定の項目ではありません。"},{"id":20,"subject":0,"question":"指定居宅介護支援におけるケアマネジメント業務として、より適切なものはどれか。3つ選べ。","options":["課題分析標準項目に基づくアセスメントの実施","利用者によるサービスの選択に資するための情報提供","地域ケア会議の主催","住民による自発的活動の開発","モニタリングの実施"],"answer":[1,2,5],"sourcePage":12,"explanation":"居宅介護支援では、アセスメント、サービス選択のための情報提供、モニタリングなどを行います。地域ケア会議の主催は通常、市町村や地域包括支援センター等が担います。"},{"id":21,"subject":0,"question":"居宅サービス計画の作成について正しいものはどれか。3つ選べ。","options":["被保険者証に認定審査会意見の記載がある場合には、利用者にその趣旨を説明し、理解を得た上で、その内容に沿って作成しなければならない。","地域密着型通所介護を位置付ける場合には、認知症の専門医の意見を求めなければならない。","厚生労働大臣が定める回数以上の訪問介護は、位置付けることができない。","短期入所生活介護を位置付ける場合には、原則として利用する日数が要介護認定の有効期間のおおむね半数を超えないようにしなければならない。","福祉用具貸与を位置付ける場合には、その利用の妥当性を検討し、必要な理由を記載しなければならない。"],"answer":[1,4,5],"sourcePage":13,"explanation":"認定審査会の意見を説明し、計画に反映します。短期入所の利用日数は原則として認定有効期間のおおむね半数以内とし、福祉用具貸与は必要な理由を記載します。"},{"id":22,"subject":0,"question":"指定居宅介護支援事業者の記録について正しいものはどれか。3つ選べ。","options":["居宅介護支援経過は、時系列で誰もが理解できるように記載する。","サービス担当者会議の記録は、支援が完結すればその時点で廃棄してもよい。","自ら提供した指定居宅介護支援とは明らかに関係がない苦情を受け付けた場合でも、すべて記録し保存しなければならない。","指定居宅介護支援の提供により発生した事故の状況及び事故に際して採った処置について、記録しなければならない。","不正の行為によって保険給付を受けた利用者については、市町村に遅滞なく通知するとともに、その記録を整備しなければならない。"],"answer":[1,4,5],"sourcePage":13,"explanation":"支援経過は時系列で分かりやすく記録し、事故の状況や対応、不正受給に関する市町村への通知も記録します。支援が終わっても直ちに廃棄できません。"},{"id":23,"subject":0,"question":"指定介護予防支援について適切なものはどれか。3つ選べ。","options":["地域支援事業及び介護給付と連続性及び一貫性を持った支援を行うように配慮する。","介護予防通所リハビリテーションを介護予防サービス計画に位置付ける場合には、当該サービスに係る主治の医師の指示は必要ない。","介護予防サービス計画の策定に当たっては、利用者の個別性を重視した効果的なものとする。","利用者による主体的な取組を支援し、常に利用者の生活機能の向上に対する意欲を高めるよう支援する。","介護福祉士を配置しなければならない。"],"answer":[1,3,4],"sourcePage":14,"explanation":"介護予防支援では、他の支援との連続性、利用者の個別性、主体的な取組への意欲を大切にします。介護予防通所リハビリテーションには医師の指示が必要です。"},{"id":24,"subject":0,"question":"Aさん(80歳,女性,要介護2,認知機能は低下していない)は、長男と二人暮らしで、通所介護を利用している。その通所介護事業所の職員から、入浴時にAさんの体に直径3cmくらいのあざが数か所あることを見つけ、Aさんが「長男に怒鳴られて、叩かれた」と話していたことについての相談があった。高齢者虐待防止法を踏まえた介護支援専門員の対応として、より適切なものはどれか。2つ選べ。","options":["一時的なものと考え、しばらく様子を見ることにする。","速やかに市町村に通報する。","直ちにAさんが長期間養護を受けるために必要となる居室を確保するための措置を決める。","長男がいない場で、Aさんと今後の介護サービスや対応について話をする機会を設ける。","長男に対し、なぜ怒鳴ったり叩いたりしたのかを厳しく問いただす。"],"answer":[2,4],"sourcePage":14,"explanation":"あざと本人の話から虐待が疑われるため、速やかに市町村へ通報します。長男がいない場で本人の意向を確認し、安全と今後の支援を検討します。"},{"id":25,"subject":0,"question":"Aさん(85歳、女性)は、長女と二人暮らしである。Aさんは自宅で転倒して腰椎を圧迫骨折し、1か月入院した。退院後、筋力低下が著しく、要支援2の認定を受けた。介護支援専門員が訪問したところ、Aさんは以前のように自分で家事や入浴をしたいと希望しているが、長女は転倒を心配してデイサービスでの入浴介助を希望していて折り合わない。自立支援・重度化防止の観点に立った介護支援専門員の対応として、より適切なものはどれか。3つ選べ。","options":["長女の希望だけに沿ったケアプランを作成する。","筋力低下の原因や回復方法等の確認のため、医師、理学療法士、管理栄養士などに相談する。","自宅での転倒リスクを軽減し、できるだけ自宅での自立した生活を営めるように、生活環境全般を把握する。","様子を見るため、あえて目標や期間を定めずに介護予防通所リハビリテーションの利用を位置付ける。","Aさんと長女を交えて、自立支援・重度化防止に向けた話し合いの場を設ける。"],"answer":[2,3,5],"sourcePage":15,"explanation":"本人の希望を尊重し、家族の心配も受け止めて話し合います。多職種の意見と生活環境を確認し、安全に自立した生活を取り戻す方法を検討します。"},{"id":26,"subject":1,"question":"せん妄に関する次の記述のうち適切なものはどれか。3つ選べ。","options":["日常生活における活動性が低下することがある。","認知症を有する人は、せん妄を起こしやすい。","治療は、誘因にかかわらず薬物治療を最優先とする。","せん妄の程度は、時間の経過とともに変化することがある。","夜間にせん妄を起こす高齢者には、日中の睡眠を十分にとらせる。"],"answer":[1,2,4],"sourcePage":17,"explanation":"せん妄には活動性が低下する型もあり、症状は時間によって変わります。認知症がある人は起こしやすく、まず原因や誘因を確認して対応します。"},{"id":27,"subject":1,"question":"バイタルサインについて適切なものはどれか。3つ選べ。","options":["生命の維持にかかわる最も基本的な情報である。","感染症にかかっても、発熱しないことがある。","やせているため体温計を腋下部（腋の下）に密着できない場合には、正確に体温を測定できないことがある。","不整脈の有病率は、年齢層が高くなるにつれて減少する。","医師や看護師が血圧を測定すると低値になることが多い。"],"answer":[1,2,3],"sourcePage":17,"explanation":"バイタルサインは生命維持に関わる基本情報です。高齢者は感染しても発熱しないことがあり、体温計が腋に密着しないと正確に測れない場合があります。"},{"id":28,"subject":1,"question":"口腔のケアについて適切なものはどれか。3つ選べ。","options":["口腔内・口腔周囲を動かすことは、口腔機能の維持・向上に資する。","胃ろうによる経管栄養を行っている高齢者では、口腔のケアは必要ない。","寝たきりで片麻痺がある人の場合には、誤嚥を防ぐため、麻痺側を下にして口腔のケアを行う。","食後は義歯をはずして口腔内を清掃し、義歯はブラシを使用して流水で洗う。","高齢者では唾液の分泌量が減り、う蝕や歯周病が起こりやすい。"],"answer":[1,4,5],"sourcePage":18,"explanation":"口や周囲の筋肉を動かすことと、口腔内・義歯の清掃が大切です。唾液が減るとむし歯や歯周病が起こりやすく、経管栄養中も口腔ケアが必要です。"},{"id":29,"subject":1,"question":"リハビリテーションについて適切なものはどれか。3つ選べ。","options":["利用者の残存能力をできる限り活かす。","急性期及び回復期に獲得された機能をできるだけ長く維持することも重要である。","廃用による筋力低下や筋萎縮の予防には、趣味や余暇活動への参加は効果がない。","本人が苦痛を感じなければ、同じ姿勢で安静臥床を続けることが望ましい。","変形性膝関節症は、歩行障害の原因となることがある。"],"answer":[1,2,5],"sourcePage":18,"explanation":"リハビリテーションは残っている能力を活かし、獲得した機能の維持も目指します。趣味や活動への参加は廃用予防に役立ち、変形性膝関節症は歩行障害の原因になります。"},{"id":30,"subject":1,"question":"高齢者の精神疾患について、より適切なものはどれか。3つ選べ。","options":["要因の一つに、脳の加齢性変化がある。","うつ病では、自殺リスクはない。","配偶者や近親者の死が、うつ病の要因となることがある。","アルコール依存症は、うつ病を合併することはない。","精神症状が定型的でなく、訴えは多彩かつ曖昧であることがある。"],"answer":[1,3,5],"sourcePage":19,"explanation":"高齢者の精神疾患には加齢や身近な人との死別などが関係します。症状が典型的でない場合もあり、うつ病では自殺リスクにも注意が必要です。"},{"id":31,"subject":1,"question":"次の記述のうち、より適切なものはどれか。3つ選べ。","options":["入院中から退院後の生活に向けた準備を進めることが望ましい。","退院前カンファレンスには、利用者・家族は出席できない。","介護支援専門員には、退院前カンファレンスにおいて、病院関係者と在宅支援の関係者の橋渡し役になることが求められる。","介護支援専門員は、常に医学的立場に立って治療法について助言すべきである。","退院後の利用者を担当する介護支援専門員は、退院後の状況を入院していた病院に報告することが望ましい。"],"answer":[1,3,5],"sourcePage":19,"explanation":"退院支援は入院中から進め、本人・家族も参加して考えます。介護支援専門員は病院と在宅支援者をつなぎ、退院後の状況も病院と共有します。"},{"id":32,"subject":1,"question":"栄養と食事について適切なものはどれか。3つ選べ。","options":["体重測定は、栄養状態を把握するために有用である。","低栄養を予防するためには、摂取するエネルギー量を減らす。","水を飲んでむせる場合は、汁物やお茶に適度なとろみをつけることも一つの方法である。","スプーンはできるだけ深く大きいものとし、1回量を多くすることで食事の所要時間を短くする。","配食サービスは、栄養改善の目的だけでなく、一人暮らし高齢者の見守りとしても活用できる。"],"answer":[1,3,5],"sourcePage":20,"explanation":"体重の変化は栄養状態の把握に役立ちます。むせには適切なとろみなどを検討し、配食サービスは栄養支援と見守りの両方に活用できます。"},{"id":33,"subject":1,"question":"次の記述のうち適切なものはどれか。3つ選べ。","options":["糖尿病の治療法の一つとして、インスリンの在宅自己注射がある。","人工透析は、腎臓の働きを補うために行う。","中心静脈栄養法では、必ず腕や手の細い静脈から点滴する。","経管栄養法では、胃や腸に管を用いて栄養を注入する。","人工呼吸療法は、体内への二酸化炭素の取り込みを促すために行う。"],"answer":[1,2,4],"sourcePage":20,"explanation":"インスリンは在宅で自己注射する場合があります。人工透析は腎臓の働きを補い、経管栄養は管を通じて胃や腸へ栄養を届けます。"},{"id":34,"subject":1,"question":"感染予防について適切なものはどれか。3つ選べ。","options":["すべての人が感染症の病原体を保有している可能性があると考え、感染予防に努める。","高齢者には、肺炎球菌ワクチンの接種を毎年1回受けることが推奨されている。","高齢者における結核の初期症状としては、食欲不振、全身倦怠、体重減少などもある。","手洗いでは、指先、指の間、親指、手首も洗い忘れないようにする。","ノロウイルスの消毒には、低濃度のエタノールを用いる。"],"answer":[1,3,4],"sourcePage":21,"explanation":"すべての人が病原体を持つ可能性を考え、手洗いなどの感染予防を行います。高齢者の結核では、食欲不振や全身倦怠、体重減少が現れることもあります。"},{"id":35,"subject":1,"question":"次の記述のうち適切なものはどれか。3つ選べ。","options":["パルスオキシメーターは、一般に手や足の指先に装着する。","自己導尿に用いるカテーテルの消毒は不要である。","ネブライザーは、薬剤の投与や気道の加湿のために使われる。","在宅酸素療法では、携帯用酸素ボンベを使用して外出することができる。","ストーマとは、気管切開口のことである。"],"answer":[1,3,4],"sourcePage":21,"explanation":"パルスオキシメーターは指先などに装着します。ネブライザーは薬剤投与や加湿に使い、携帯用酸素ボンベがあれば在宅酸素療法中も外出できます。"},{"id":36,"subject":1,"question":"次の記述のうち、より適切なものはどれか。3つ選べ。","options":["倒れている高齢者を発見したときは、意識の有無を確認する。","吐物を処理する場合は、使い捨て手袋を使用し塩素系の消毒剤を使用する。","止血した腕は、心臓より低い位置で保持する。","心肺蘇生時の胸骨圧迫は、うつ伏せにして行う。","高齢者が発熱したときは、全身状態の変化も併せて観察する。"],"answer":[1,2,5],"sourcePage":22,"explanation":"倒れた人はまず反応・意識を確認します。吐物の処理では手袋と適切な塩素系消毒剤を用い、発熱時は体温だけでなく全身状態も観察します。"},{"id":37,"subject":1,"question":"次の記述のうち適切なものはどれか。3つ選べ。","options":["後期高齢者に対する健康診査では、フレイル状態のチェックも重要である。","握力の低下は、サルコペニア(筋肉減弱症)の目安となる。","慢性閉塞性肺疾患(COPD)を有する高齢者では、禁煙が重要である。","喫煙は、心筋梗塞の危険因子ではない。","多量の飲酒習慣は、脳卒中のリスクとは無関係である。"],"answer":[1,2,3],"sourcePage":22,"explanation":"高齢者の健診ではフレイルの確認が大切です。握力低下はサルコペニアの目安になり、COPDでは禁煙が重要です。喫煙や多量飲酒は循環器疾患のリスクになります。"},{"id":38,"subject":1,"question":"次の記述のうち、より適切なものはどれか。3つ選べ。","options":["皮脂欠乏症では、患部を清潔に保つことが悪化予防になることから、ナイロンタオルなどを使ってよく洗う。","めまいやふらつきの原因となる疾患の一つに脳梗塞がある。","糖尿病の治療で薬を飲んでいる場合は、食事に気を付ける必要はない。","関節リウマチの患者には、身体に負担をかけないためにベッドの使用が望ましい。","高齢者の大腿骨頸部骨折は、寝たきりの原因となりやすい。"],"answer":[2,4,5],"sourcePage":23,"explanation":"脳梗塞でめまいやふらつきが生じることがあります。関節リウマチではベッドが動作の負担を減らし、高齢者の大腿骨頸部骨折は寝たきりにつながりやすい骨折です。"},{"id":39,"subject":1,"question":"死亡診断書を交付することができる資格として正しいものはどれか。2つ選べ。","options":["介護支援専門員","介護福祉士","医師","歯科医師","薬剤師"],"answer":[3,4],"sourcePage":23,"explanation":"死亡診断書を交付できるのは、医師と歯科医師です。介護支援専門員・介護福祉士・薬剤師には交付する資格がありません。"},{"id":40,"subject":1,"question":"指定訪問看護ステーションについて正しいものはどれか。3つ選べ。","options":["管理者は、医師でなければならない。","主治の医師に、訪問看護計画書及び訪問看護報告書を提出しなければならない。","理学療法士を配置することができる。","訪問看護は、利用者の心身の機能の維持回復を図るよう妥当適切に行う。","看護職員は、すべて常勤で配置しなければならない。"],"answer":[2,3,4],"sourcePage":24,"explanation":"訪問看護は心身機能の維持回復を図り、主治医へ計画書と報告書を提出します。理学療法士等も配置でき、看護職員全員が常勤である必要はありません。"},{"id":41,"subject":1,"question":"指定訪問リハビリテーションについて正しいものはどれか。3つ選べ。","options":["サービス提供には、医師の指示が必要である。","理学療法,作業療法その他必要なリハビリテーションを行うことにより、利用者の心身の機能の維持回復を図るものでなければならない。","事業者は、従業者,設備,備品及び会計に関する諸記録を整備しておかなければならない。","特定の研修を受けた介護福祉士であれば、サービスを提供することができる。","訪問看護ステーションの言語聴覚士がサービスを提供した場合は、訪問リハビリテーション費が算定される。"],"answer":[1,2,3],"sourcePage":24,"explanation":"訪問リハビリテーションは医師の指示に基づき、理学療法士等が機能の維持回復を支援します。事業者は従業者・設備・会計などの記録も整備します。"},{"id":42,"subject":1,"question":"指定短期入所療養介護について適切なものはどれか。2つ選べ。","options":["家族の疾病を理由とした利用はできない。","短期入所療養介護計画は、おおむね4日以上連続して利用する場合に作成する必要がある。","要介護1又は要介護2と認定された者は、利用できない。","介護老人福祉施設で提供される。","酸素療法を必要とするなど医療ニーズが高い要介護者も利用できる。"],"answer":[2,5],"sourcePage":25,"explanation":"短期入所療養介護は医療ニーズの高い要介護者も利用できます。おおむね4日以上続けて利用する場合は、短期入所療養介護計画が必要です。"},{"id":43,"subject":1,"question":"指定定期巡回・随時対応型訪問介護看護について適切なものはどれか。2つ選べ。","options":["要支援者は利用できない。","利用者の心身の状況にかかわらず、毎日、訪問しなければならない。","訪問看護サービスの提供の開始に際し、主治の医師による指示を口頭で受ければよい。","日常生活上の緊急時の対応は想定されていない。","自らその提供するサービスの質の評価を行い、結果を公表しなければならない。"],"answer":[1,5],"sourcePage":25,"explanation":"定期巡回・随時対応型訪問介護看護は要介護者向けで、要支援者は利用できません。サービスの質を自ら評価し、その結果を公表する必要があります。"},{"id":44,"subject":1,"question":"介護老人保健施設について適切なものはどれか。3つ選べ。","options":["入所者の在宅復帰を目指すことが基本方針として定められている。","社会福祉法人は、開設できない。","若年性認知症を有する要介護者は、入所することができる。","介護支援専門員以外の者でも施設サービス計画を作成することができる。","所得の多寡を理由にサービスの提供を拒否することは禁じられている。"],"answer":[1,3,5],"sourcePage":26,"explanation":"介護老人保健施設は在宅復帰を目指す施設です。若年性認知症の要介護者も対象となり、所得の多寡を理由にサービス提供を拒否できません。"},{"id":45,"subject":1,"question":"介護医療院について適切なものはどれか。3つ選べ。","options":["主として短期的な療養が必要な者を対象とすることが基本方針として定められている。","要支援者は、入所することができない。","適切なリハビリテーションを計画的に行わなければならない。","診療所に併設できる場合がある。","1つの療養室の定員は、2人以下としなければならない。"],"answer":[2,3,4],"sourcePage":26,"explanation":"介護医療院は長期の療養が必要な要介護者を対象とし、要支援者は入所できません。計画的なリハビリテーションを行い、診療所に併設する場合もあります。"},{"id":46,"subject":2,"question":"面接場面におけるコミュニケーション技術について適切なものはどれか。3つ選べ。","options":["明確化とは、相談援助者がクライエントの利益を考えて、クライエントの代わりに意思決定することである。","アセスメントには、クライエントの問題状況の把握、情報の収集と分析が含まれる。","オープンクエスチョンとは、クライエントが自らの選択や決定により、答えを見つけることを促す質問である。","面接技術には、ジェスチャー、表情、声の抑揚が含まれる。","視線やクライエントとの距離について配慮することは避けるべきである。"],"answer":[2,3,4],"sourcePage":28,"explanation":"アセスメントでは情報を集めて分析します。自由に答えられる質問を使い、表情・声・身振りなどの非言語的な伝え方にも配慮します。"},{"id":47,"subject":2,"question":"ソーシャルワークに関する次の記述のうち、より適切なものはどれか。3つ選べ。","options":["クライエントと相談援助者が目標達成に向けて取り組むことは、重要である。","支援計画は、具体的に立てるよりは、できる限り抽象的に立てることが望ましい。","支援を終結する際は、終結に伴うクライエントの不安に十分配慮することが重要である。","スーパービジョンの主な目的は、クライエントへの支援の向上とサービスの質の確保のための相談援助者の養成である。","アウトリーチとは、個人情報を適切に管理・保護することである。"],"answer":[1,3,4],"sourcePage":28,"explanation":"本人と援助者が共通の目標に取り組み、終結時の不安にも配慮します。スーパービジョンは援助者を育て、支援やサービスの質を高めるために行います。"},{"id":48,"subject":2,"question":"ソーシャルワークの視点から、支援困難事例に関する記述として、より適切なものはどれか。3つ選べ。","options":["高齢者の家族が支援内容に対して何度も不満を訴えたため、担当の介護支援専門員が地域包括支援センターへ相談する。","独居のクライエントが屋外までごみがあふれている家屋に住んでいるので、直ちに警察へ介入を依頼する。","認知症のために判断能力が著しく低下したクライエントに対して、成年後見制度の利用を検討する。","セルフ・ネグレクトには、配偶者からの身体的虐待が含まれる。","関係する専門職,関係機関、地域住民などがチームを組んでアプローチすることが望ましい。"],"answer":[1,3,5],"sourcePage":29,"explanation":"支援困難事例は一人で抱えず、地域包括支援センターや関係者と協力します。判断能力が低下した人には成年後見制度の利用も検討します。"},{"id":49,"subject":2,"question":"ソーシャルワークにおける地域援助として、より適切なものはどれか。3つ選べ。","options":["保健医療・福祉等の専門職のみによる地域の課題への対応","地域の商店とNPOの協働による認知症カフェの設置・運営","地域の高齢者が福祉サービスにアクセスしやすくなるための自治体への働きかけ","被災者に対する支援のためのボランティアの組織化","住民を交えたグループ活動における本人の了解を得ないままの参加者の氏名や顔写真の公表"],"answer":[2,3,4],"sourcePage":29,"explanation":"地域援助では住民・商店・NPOなどとも協力し、地域の仕組みを整えます。自治体への働きかけやボランティアの組織化も含まれます。"},{"id":50,"subject":2,"question":"介護保険における訪問介護について正しいものはどれか。3つ選べ。","options":["指定訪問介護事業所の管理者は、介護福祉士でなければならない。","サービス提供責任者は、利用者のサービスに関する意向を定期的に把握するものとする。","指定訪問介護事業者は、サービス提供中に事故が発生した場合は、市町村、利用者の家族、担当の居宅介護支援事業者等に連絡を行わなければならない。","居宅サービス計画にないサービスでも、利用者の要望があった場合には、訪問介護員は直ちに提供しなければならない。","指定訪問介護事業者は、定期的に業務継続計画の見直しを行い、必要に応じて業務継続計画の変更を行うものとする。"],"answer":[2,3,5],"sourcePage":30,"explanation":"サービス提供責任者は利用者の意向を定期的に把握します。事故時は関係者へ連絡し、業務継続計画は定期的に見直します。"},{"id":51,"subject":2,"question":"介護保険における通所介護について正しいものはどれか。3つ選べ。","options":["サービスの所要時間が同じ区分の利用者に対しては、サービス提供開始時刻を同じにしなければならない。","指定通所介護事業所の設備を利用し、宿泊サービスを提供する場合には、その開始前に指定権者に届け出る必要がある。","通所介護費の算定の基準となる所要時間には、送迎に要する時間も含まれる。","通所介護計画は、サービスの提供に関わる従業者が共同して個々の利用者ごとに作成するものである。","あらかじめ通所介護計画に位置付けられ、効果的な機能訓練等のサービスが提供できる場合は、事業所の屋外でサービスを提供することができる。"],"answer":[2,4,5],"sourcePage":30,"explanation":"通所介護の宿泊サービスは事前の届出が必要です。計画は従業者が共同して個別に作り、計画に位置付けた効果的な活動なら屋外での実施もできます。"},{"id":52,"subject":2,"question":"介護保険における訪問入浴介護について正しいものはどれか。3つ選べ。","options":["1回の訪問につき、看護職員1人及び介護職員2人で行った場合、これらの者のうち1人を当該サービスの提供の責任者とする。","利用者が短期入所生活介護を利用している間も、その必要性が居宅サービス計画に記載されていれば、訪問入浴介護費を算定できる。","心身の状況により、訪問時に全身入浴が難しい場合、利用者の希望によって、清拭や部分浴に変更することができる。","利用者の自宅に浴室があっても、訪問入浴介護を利用することができる。","終末期にある者は、利用することができない。"],"answer":[1,3,4],"sourcePage":31,"explanation":"訪問入浴介護では訪問する職員の中から責任者を定めます。状態や希望に応じて清拭・部分浴に変更でき、自宅に浴室がある人も利用できます。"},{"id":53,"subject":2,"question":"介護保険における短期入所生活介護について正しいものはどれか。3つ選べ。","options":["短期入所生活介護計画は、居宅サービス計画を作成した介護支援専門員が作成しなければならない。","いかなる場合でも、静養室において指定短期入所生活介護を行うことはできない。","利用定員が20人未満の併設事業所の場合、生活相談員は非常勤でもよい。","食事内容は、当該事業者の医師又は栄養士を含む会議で検討が加えられなければならない。","協力医療機関は、緊急時等に速やかに対応できるよう、指定短期入所生活介護事業所から近距離にあることが望ましいものである。"],"answer":[3,4,5],"sourcePage":31,"explanation":"定員20人未満の併設事業所では生活相談員を非常勤にできます。食事内容は医師又は栄養士を含む会議で検討し、協力医療機関は近距離にあることが望まれます。"},{"id":54,"subject":2,"question":"介護保険における福祉用具について正しいものはどれか。3つ選べ。","options":["福祉用具の使用目的には、利用者の自立した日常生活の支援と介護者の負担軽減が含まれる。","浴槽内いすなどの入浴補助用具は、特定福祉用具販売の対象となる。","利用者の身体を滑らせるスライディングボードは、特定福祉用具販売の対象となる。","空気式又は折りたたみ式の簡易浴槽は、福祉用具貸与の対象となる。","エアマットなどの床ずれ防止用具は、福祉用具貸与の対象となる。"],"answer":[1,2,5],"sourcePage":32,"explanation":"福祉用具は自立支援と介護負担の軽減を目的とします。浴槽内いすなどは販売、床ずれ防止用具は貸与の対象です。簡易浴槽は販売の対象です。"},{"id":55,"subject":2,"question":"介護保険における認知症対応型共同生活介護について正しいものはどれか。2つ選べ。","options":["指定認知症対応型共同生活介護事業所の共同生活住居数は、1以上3以下である。","1つの共同生活住居の入居定員は、15人以上20人以下である。","認知症対応型共同生活介護を利用している場合、福祉用具貸与費を算定できない。","計画作成担当者は、1つの共同生活住居ごとに置かなければならない。","サテライト型指定認知症対応型共同生活介護事業所の管理者は、管理上支障がない場合であっても、本体事業所の管理者が兼務することはできない。"],"answer":[1,3],"sourcePage":32,"explanation":"認知症グループホームの共同生活住居は1～3か所で、1住居の定員は5～9人です。入居中は別途、福祉用具貸与費を算定できません。"},{"id":56,"subject":2,"question":"介護保険における小規模多機能型居宅介護について正しいものはどれか。3つ選べ。","options":["通いを中心として、利用者の様態や希望に応じて、随時訪問や宿泊を組み合わせてサービスを提供するものである。","利用者は、同時に複数の指定小規模多機能型居宅介護事業所に登録することができる。","1つの本体事業所に係るサテライト事業所の数は2か所までとする。","小規模多機能型居宅介護従業者として、理学療法士又は作業療法士を置かなければならない。","介護支援専門員は、利用者の処遇に支障がない場合は、管理者と兼務することができる。"],"answer":[1,3,5],"sourcePage":33,"explanation":"小規模多機能型居宅介護は通いを中心に訪問・宿泊を組み合わせます。サテライトは本体1か所につき2か所までで、支障がなければ介護支援専門員と管理者を兼務できます。"},{"id":57,"subject":2,"question":"指定介護老人福祉施設について正しいものはどれか。3つ選べ。","options":["第三者による施設サービスの質の評価を受けることが、義務付けられている。","身体拘束等の適正化のための対策を検討する委員会を、3か月に1回以上開催しなければならない。","入所者の処遇に支障がない場合、配置される介護支援専門員は非常勤でもよい。","看護職員については、常勤の者を1人以上配置しなければならない。","計画担当介護支援専門員は、特段の事情のない限り、定期的にモニタリングの結果を記録しなければならない。"],"answer":[2,4,5],"sourcePage":33,"explanation":"特養では身体拘束等の適正化を検討する委員会を3か月に1回以上開きます。看護職員は常勤1人以上が必要で、モニタリング結果も定期的に記録します。"},{"id":58,"subject":2,"question":"生活保護制度について正しいものはどれか。3つ選べ。","options":["65歳以上の被保護者の介護保険料は、生活保護から給付される。","補足性の原理により、生活保護の介護扶助は、介護保険の保険給付よりも優先して給付される。","生活保護の要否判定は、家庭裁判所が行う。","葬祭扶助には、火葬又は埋葬に必要な費用が含まれる。","介護予防支援計画に基づいて行われる介護予防サービスは、介護扶助の対象となる。"],"answer":[1,4,5],"sourcePage":34,"explanation":"65歳以上の被保護者の介護保険料は生活扶助から給付されます。葬祭扶助には火葬・埋葬費が含まれ、介護予防サービスも介護扶助の対象です。"},{"id":59,"subject":2,"question":"成年後見制度について正しいものはどれか。3つ選べ。","options":["親族は、成年後見人になることができない。","後見開始の審判は、本人も請求することができる。","法人も、成年後見人に選任されることがある。","身上保護(身上監護)とは、本人に代わって財産を管理することをいう。","成年被後見人の法律行為は、原則として、取り消すことができる。"],"answer":[2,3,5],"sourcePage":34,"explanation":"後見開始は本人も申し立てることができ、法人が後見人になる場合もあります。成年被後見人の法律行為は原則取り消せますが、日用品の購入などは例外です。"},{"id":60,"subject":2,"question":"後期高齢者医療制度について正しいものはどれか。3つ選べ。","options":["保険料は、厚生労働省令で定める。","生活保護受給者は、被保険者にならない。","被保険者には、65歳以上75歳未満であって、後期高齢者医療広域連合の障害認定を受けた者も含まれる。","後期高齢者医療広域連合は、特別の理由がある者に対し、保険料を減免することができる。","訪問看護療養費の支給は、給付に含まれない。"],"answer":[2,3,4],"sourcePage":35,"explanation":"生活保護受給者は後期高齢者医療の被保険者になりません。65～74歳で一定の障害認定を受けた人も対象となり、特別な理由があれば保険料を減免できます。"}], SUBJECTS=["介護支援分野（問題1～25）", "保健医療サービス（問題26～45）", "福祉サービス（問題46～60）"];

ckground:#f1faf7}.option.good{border-color:#4aab87;background:#ecf8f2}.option.bad{border-color:#d88666;background:#fff1eb}.option input{width:18px;height:18px;flex:none;accent-color:#167d69;margin:5px 0 0}.number{font-weight:bold;color:#617984}.opttext{flex:1;min-width:0;overflow-wrap:anywhere}.optbadge{display:inline-block;font-size:11px;font-weight:bold;border-radius:4px;background:#d8eee1;color:#146d4f;padding:0 5px;margin-right:6px}.notebox{margin-top:16px;font-size:12px;color:#62727d}.notebox summary{cursor:pointer}.notebox p{white-space:pre-wrap}.submitrow{display:flex;align-items:center;gap:15px;margin-top:22px}.primary{background:#167d69;color:#fff;border-color:#167d69;font-weight:bold;padding:12px 25px}.primary:hover:not(:disabled){background:#116250;color:white}.hint{font-size:12px;color:#627783}.feedback{margin-top:24px;border-radius:12px;background:#eff8f3;border:1px solid #c6e3d3;padding:20px}.feedback.wrong{background:#fff6ef;border-color:#f0d5bd}.resulttitle{font-size:17px;font-weight:bold}.answer{color:#1861a0;font-size:23px;font-weight:bold;margin-top:5px}.explabel{font-size:11px;letter-spacing:.12em;font-weight:bold;color:#5d756c;margin:12px 0 4px}.explanation{font-size:15px}.retry{font-size:12px;padding:5px 10px;margin-top:14px;background:transparent}.navigation{display:flex;justify-content:space-between;gap:10px;margin-top:20px}.navigation button{min-width:100px}.empty{text-align:center;padding:60px 12px}.empty h2{font-size:21px;margin-bottom:12px}.empty p{font-size:14px;color:#647981;margin-bottom:22px}.footer{font-size:11px;color:#73838b;margin:26px 0 4px;text-align:center}.footer a{margin:0 6px}.summarynote{font-size:12px;color:#58716c;margin-top:10px}.mobilejump{display:none}

@media(max-width:450px){.edition{display:none}.sidebar{grid-template-columns:1fr}.sidebuttons{grid-column:auto}.map{grid-column:auto}.stats{gap:12px}.stat span{font-size:10px}.progress{min-width:20px}.count{display:block;margin:0}.grid{grid-template-columns:repeat(8,1fr)}.submitrow{flex-wrap:wrap}.primary{width:100%}.navigation button{min-width:0}.card{padding:19px 14px}.qtop{align-items:flex-start}.tag{font-size:11px}.case{font-size:13px}.option{font-size:14px}.filters{grid-template-columns:repeat(4,1fr)}.reset{justify-self:start}}
.scores{background:#e5f0ec;border:1px solid #c9ddd4;border-radius:10px;padding:12px 16px;font-size:13px;margin:-8px 0 22px;display:flex;flex-wrap:wrap;gap:8px 24px}.scores strong{color:#115e50}.scores small{flex-basis:100%;color:#536e65}<\/style><div class="wrap"><header class="top"><div><div class="brand">いとう総研 · STUDY PRACTICE<\/div><h1>第27回 ケアマネジャー試験<\/h1><p class="lead">一問ずつ、理解を積み重ねる。全60問・シンプル解説付き<\/p><\/div><span class="edition">2024年実施<\/span><\/header><div class="stats" id="stats"><\/div><div class="scores" id="scores"><\/div><div class="layout"><aside class="sidebar"><div><label class="control-label" for="subject">分野から選ぶ<\/label><select id="subject"><option value="all">全分野 · 60問<\/option>${SUBJECTS.map((s,i)=>`<option value="${i}">${esc(s)}<\/option>`).join('')}<\/select><\/div><div class="filters" role="group" aria-label="出題範囲">${[['all','すべて'],['unseen','未回答'],['wrong','間違えた'],['marks','あとで復習']].map(([v,t])=>`<button data-mode="${v}">${t}<\/button>`).join('')}<\/div><div class="sidebuttons"><button id="shuffle">シャッフル<\/button><button id="sort">番号順<\/button><\/div><details class="map"><summary>問題一覧から選ぶ <span id="listcount"><\/span><\/summary><div class="grid" id="grid"><\/div><p class="legend">緑：正解 ／ 橙：不正解 ／ •：あとで復習<\/p><\/details><p class="storage" id="storage"><\/p><button class="reset" id="reset">学習記録をリセット<\/button><\/aside><main><article class="card" id="card"><\/article><nav class="navigation" aria-label="問題の移動"><button id="prev">← 前の問題<\/button><button id="next">次の問題 →<\/button><\/nav><\/main><\/div><footer class="footer">問題：第27回介護支援専門員実務研修受講試験（提供PDF）<br>問題文・選択肢は文字で表示します。正答は公式発表に準拠。解説は学習用に作成し、試験時点の制度・統計に対応しています。<br><a href="https://www.pref.kochi.lg.jp/doc/2024111300093/" target="_blank" rel="noopener">試験の公式発表<\/a><a href="https://www.fukushi.metro.tokyo.lg.jp/documents/d/fukushi/r6seitoubangou-pdf" target="_blank" rel="noopener">公式正答<\/a><\/footer><\/div>`;
const $=s=>root.querySelector(s);
function matches(q){return (subject==='all'||q.subject===Number(subject))&&(mode==='all'||mode==='unseen'&&!results[q.id]||mode==='wrong'&&results[q.id]&&!correct(q.id)||mode==='marks'&&marks[q.id])}
function rebuild(){order=QUESTIONS.filter(matches).map(q=>q.id);if(!order.includes(index))index=order[0];render()}
function stats(){const care=QUESTIONS.filter(q=>q.id<=25&&correct(q.id)).length,health=QUESTIONS.filter(q=>q.id>25&&correct(q.id)).length;
$('#scores').innerHTML=`<span>介護支援：<strong>${care} / 25点<\/strong>（基準18点）<\/span><span>保健医療福祉：<strong>${health} / 35点<\/strong>（基準25点）<\/span><small>${Object.keys(results).length===60?(care>=18&&health>=25?'第27回の合格基準に達しました。':'第27回の合格基準には、両分野の基準点を満たす必要があります。'):'未回答の問題は得点に含みません。全問解答後、第27回の合格基準と比較します。'} 1問1点・指定数すべて一致で正解（部分点なし）。<\/small>`;
const answered=Object.keys(results).length,n=Object.keys(results).filter(correct).length;$('#stats').innerHTML=`<div class="stat"><b>${answered}<small style="font-size:12px;color:#72858c"> / 60<\/small><\/b><span>回答済み<\/span><\/div><div class="stat"><b>${n}<\/b><span>正解<\/span><\/div><div class="stat"><b>${answered?Math.round(n/answered*100):0}<small style="font-size:12px">%<\/small><\/b><span>正答率<\/span><\/div><div class="progress" role="progressbar" aria-label="回答済み" aria-valuenow="${answered}" aria-valuemin="0" aria-valuemax="60"><i style="width:${answered/60*100}%"><\/i><\/div>`;$('#storage').textContent=storageOK?'学習記録はこのブラウザに自動保存されます。':'この環境では記録を保存できません。ページを閉じると記録が消えます。';}
function nav(){const pos=order.indexOf(index);$('#prev').disabled=pos<=0;$('#next').disabled=pos<0||pos===order.length-1;$('#listcount').textContent=`(${order.length}問)`;$('#grid').innerHTML=order.map(id=>`<button data-id="${id}" class="${results[id]?(correct(id)?'done':'miss'):''} ${index===id?'current':''} ${marks[id]?'flag':''}" aria-label="問題${id}${results[id]?(correct(id)?' 正解':' 不正解'):' 未回答'}${marks[id]?' あとで復習':''}" ${index===id?'aria-current="true"':''}>${id}<\/button>`).join('');}
function render(){save();stats();nav();root.querySelectorAll('[data-mode]').forEach(b=>{b.classList.toggle('active',b.dataset.mode===mode);b.setAttribute('aria-pressed',String(b.dataset.mode===mode))});const q=QUESTIONS[index-1];if(!q||!order.includes(index)){$('#card').innerHTML='<div class="empty"><h2>この範囲の問題はありません<\/h2><p>分野や出題範囲を変更して、学習を続けましょう。<\/p><button id="showall" class="primary">全問に戻る<\/button><\/div>';$('#showall').onclick=()=>{subject='all';mode='all';$('#subject').value='all';rebuild()};return}
revealed=!!results[index];selection=revealed?[...results[index].selected]:[];
const parts=q.question.split('\n\n〔事例〕\n');
$('#card').innerHTML=`<div class="qtop"><span class="tag">${esc(SUBJECTS[q.subject])}<\/span><button id="mark" aria-pressed="${!!marks[index]}">${marks[index]?'★ 復習に登録済み':'☆ あとで復習'}<\/button><\/div><h2 class="qnum" tabindex="-1">問題 ${q.id}<span class="count">${order.indexOf(index)+1} / ${order.length} 問<\/span><\/h2><div class="instruction">${q.answer.length}つ選んで解答してください<\/div><p class="question">${esc(parts[0])}<\/p>${parts.length>1?`<div class="case">〔事例〕<br>${esc(parts.slice(1).join('\n'))}<\/div>`:''}<form id="form"><div class="opts" role="group" aria-label="選択肢">${q.options.map((t,i)=>`<label class="option" data-option="${i+1}"><input type="${q.answer.length===1?'radio':'checkbox'}" name="choice" value="${i+1}" ${selection.includes(i+1)?'checked':''} ${revealed?'disabled':''}><span class="number">${i+1}<\/span><span class="opttext">${esc(t)}<\/span><\/label>`).join('')}<\/div>${q.note?`<details class="notebox"><summary>問題の注記を読む<\/summary><p>${esc(q.note)}<\/p><\/details>`:''}<div class="submitrow" ${revealed?'hidden style="display:none"':''}><button type="submit" class="primary" id="submit" disabled>解答する<\/button><span class="hint" id="hint">${q.answer.length}つ選択してください<\/span><\/div><\/form><div id="feedback" aria-live="polite"><\/div>`;
$('#mark').onclick=()=>{marks[index]=!marks[index];save();$('#mark').textContent=marks[index]?'★ 復習に登録済み':'☆ あとで復習';$('#mark').setAttribute('aria-pressed',String(!!marks[index]));nav()};
$('#form').onchange=()=>{selection=[...root.querySelectorAll('input[name="choice"]:checked')].map(e=>Number(e.value));$('#submit').disabled=selection.length!==q.answer.length;$('#hint').textContent=selection.length>q.answer.length?`${q.answer.length}つに絞ってください`:`${selection.length} / ${q.answer.length}つ選択`;root.querySelectorAll('.option').forEach(el=>el.classList.toggle('selected',selection.includes(Number(el.dataset.option))))};
$('#form').onsubmit=e=>{e.preventDefault();if(selection.length!==q.answer.length||revealed)return;results[index]={selected:[...selection]};render();$('#feedback').scrollIntoView({behavior:'smooth',block:'nearest'})};
if(revealed){const ok=correct(index);root.querySelectorAll('.option').forEach(el=>{const n=Number(el.dataset.option);if(q.answer.includes(n)){el.classList.add('good');el.querySelector('.opttext').insertAdjacentHTML('afterbegin','<span class="optbadge">正答<\/span>')}else if(selection.includes(n)){el.classList.add('bad');el.querySelector('.opttext').insertAdjacentHTML('afterbegin','<span class="optbadge" style="background:#f7d7c8;color:#9d4229">あなたの選択<\/span>')}});$('#feedback').innerHTML=`<section class="feedback ${ok?'':'wrong'}"><div class="resulttitle">${ok?'✓ 正解です！':'もう一度、ポイントを確認しましょう'}<\/div><div class="answer">正答 ${q.answer.join('・')}<\/div><p class="hint">あなたの解答：${selection.join('・')}${q.answer.length>1?' ／ すべて一致で正解':''}<\/p><div class="explabel">シンプル解説<\/div><p class="explanation">${esc(q.explanation)}<\/p><button id="retry" class="retry">この問題を解き直す<\/button>${order.indexOf(index)===order.length-1?'<p class="summarynote">この範囲の最後の問題です。分野や復習モードを切り替えて続けられます。<\/p>':''}<\/section>`;$('#retry').onclick=()=>{delete results[index];render()}}
}
$('#subject').onchange=e=>{subject=e.target.value;rebuild()};root.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;rebuild()});$('#grid').onclick=e=>{const b=e.target.closest('button[data-id]');if(b){index=Number(b.dataset.id);render()}};
function move(step){const n=order.indexOf(index)+step;if(n<0||n>=order.length)return;index=order[n];render();$('.qnum')?.focus({preventScroll:true});$('#card').scrollIntoView({behavior:'smooth',block:'start'})}
$('#prev').onclick=()=>move(-1);$('#next').onclick=()=>move(1);
$('#shuffle').onclick=()=>{order=QUESTIONS.filter(matches).map(q=>q.id);for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}index=order[0];render()};$('#sort').onclick=()=>rebuild();
$('#reset').onclick=()=>{if(confirm('全60問の解答記録と復習マークを削除しますか？')){results={};marks={};index=1;subject='all';mode='all';$('#subject').value='all';rebuild()}};
rebuild();
})();

/*]]>*/
</script>
