>ねっしょう<\/rt><\/ruby>のことである。","げっぷ（噯気）は，咽頭にたまった空気が排出されることである。":"げっぷ（<ruby>噯気<rt>あいき<\/rt><\/ruby>）は，<ruby>咽頭<rt>いんとう<\/rt><\/ruby>にたまった<ruby>空気<rt>くうき<\/rt><\/ruby>が<ruby>排出<rt>はいしゅつ<\/rt><\/ruby>されることである。","嘔気は，胃や腸の内容物が，食道を逆流して口外に吐き出されることである。":"<ruby>嘔気<rt>おうき<\/rt><\/ruby>は，<ruby>胃<rt>い<\/rt><\/ruby>や<ruby>腸<rt>ちょう<\/rt><\/ruby>の<ruby>内容物<rt>ないようぶつ<\/rt><\/ruby>が，<ruby>食道<rt>しょくどう<\/rt><\/ruby>を<ruby>逆流<rt>ぎゃくりゅう<\/rt><\/ruby>して<ruby>口外<rt>こうがい<\/rt><\/ruby>に<ruby>吐<rt>は<\/rt><\/ruby>き<ruby>出<rt>だ<\/rt><\/ruby>されることである。","腹部膨満感は、お腹が張る感覚です。嘔気は吐き気であり、実際に吐き出す嘔吐とは異なります。":"<ruby>腹部膨満感<rt>ふくぶぼうまんかん<\/rt><\/ruby>は、お<ruby>腹<rt>はら<\/rt><\/ruby>が<ruby>張る<rt>はる<\/rt><\/ruby><ruby>感覚<rt>かんかく<\/rt><\/ruby>です。<ruby>嘔気<rt>おうき<\/rt><\/ruby>は<ruby>吐き気<rt>はきけ<\/rt><\/ruby>であり、<ruby>実際に<rt>じっさいに<\/rt><\/ruby><ruby>吐き出す<rt>はきだす<\/rt><\/ruby><ruby>嘔吐<rt>おうと<\/rt><\/ruby>とは<ruby>異な<rt>ことな<\/rt><\/ruby>ります。","Ａさん（80 歳，女性）は，脳梗塞（cerebral infarction）の後遺症で左片麻痺があり，介護老人保健施設に入所して在宅復帰に向けた訓練をしている。嚥下障害もあるため，経鼻経管栄養による栄養摂取をしているが，経口摂取できないことでイライラしてチューブを抜去したことがある。医師からは一時的な治療であると説明を受けて同意していた。経管栄養中に介護福祉士が訪室すると，チューブを触りながら，「自分の口から食べたいから，このチューブを抜いてほしい。見た目も良くない」と訴えがあった。看護師に連絡し，チューブが抜けていないことを確認してもらった。このときのＡさんへの介護福祉士の対応として，最も適切なものを1 つ選びなさい。":"Ａさん（80 <ruby>歳<rt>さい<\/rt><\/ruby>，<ruby>女性<rt>じょせい<\/rt><\/ruby>）は，<ruby>脳梗塞<rt>のうこうそく<\/rt><\/ruby>（cerebral infarction）の<ruby>後遺症<rt>こういしょう<\/rt><\/ruby>で<ruby>左片麻痺<rt>ひだりかたまひ<\/rt><\/ruby>があり，<ruby>介護老人保健施設<rt>かいごろうじんほけんしせつ<\/rt><\/ruby>に<ruby>入所<rt>にゅうしょ<\/rt><\/ruby>して<ruby>在宅復帰<rt>ざいたくふっき<\/rt><\/ruby>に<ruby>向<rt>む<\/rt><\/ruby>けた<ruby>訓練<rt>くんれん<\/rt><\/ruby>をしている。<ruby>嚥下障<rt>えんげしょう<\/rt><\/ruby><ruby>害<rt>がい<\/rt><\/ruby>もあるため，<ruby>経鼻経管栄養<rt>けいびけいかんえいよう<\/rt><\/ruby>による<ruby>栄養摂取<rt>えいようせっしゅ<\/rt><\/ruby>をしているが，<ruby>経口摂取<rt>けいこうせっしゅ<\/rt><\/ruby>できないことでイライラしてチューブを<ruby>抜去<rt>ばっきょ<\/rt><\/ruby>したことがある。<ruby>医師<rt>いし<\/rt><\/ruby>からは<ruby>一時的<rt>いちじてき<\/rt><\/ruby>な<ruby>治療<rt>ちりょう<\/rt><\/ruby>であると<ruby>説明<rt>せつめい<\/rt><\/ruby>を<ruby>受<rt>う<\/rt><\/ruby>けて<ruby>同意<rt>どうい<\/rt><\/ruby>していた。<ruby>経管栄養中<rt>けいかんえいようちゅう<\/rt><\/ruby>に<ruby>介護福祉士<rt>かいごふくしし<\/rt><\/ruby>が<ruby>訪室<rt>ほうしつ<\/rt><\/ruby>すると，チューブを<ruby>触<rt>さわ<\/rt><\/ruby>りながら，「<ruby>自分<rt>じぶん<\/rt><\/ruby>の<ruby>口<rt>くち<\/rt><\/ruby>から<ruby>食<rt>た<\/rt><\/ruby>べたいから，このチューブを<ruby>抜<rt>ぬ<\/rt><\/ruby>いてほしい。<ruby>見<rt>み<\/rt><\/ruby>た<ruby>目<rt>め<\/rt><\/ruby>も<ruby>良<rt>よ<\/rt><\/ruby>くない」と<ruby>訴<rt>うった<\/rt><\/ruby>えがあった。<ruby>看護師<rt>かんごし<\/rt><\/ruby>に<ruby>連絡<rt>れんらく<\/rt><\/ruby>し，チューブが<ruby>抜<rt>ぬ<\/rt><\/ruby>けていないことを<ruby>確認<rt>かくにん<\/rt><\/ruby>してもらった。このときのＡさんへの<ruby>介護福祉士<rt>かいごふくしし<\/rt><\/ruby>の<ruby>対応<rt>たいおう<\/rt><\/ruby>として，<ruby>最<rt>もっと<\/rt><\/ruby>も<ruby>適切<rt>てきせつ<\/rt><\/ruby>なものを1 つ<ruby>選<rt>えら<\/rt><\/ruby>びなさい。","チューブを抜かないようにＡさんの右手を固定する。":"チューブを<ruby>抜<rt>ぬ<\/rt><\/ruby>かないようにＡさんの<ruby>右手<rt>みぎて<\/rt><\/ruby>を<ruby>固定<rt>こてい<\/rt><\/ruby>する。","経管栄養が早く終わるように滴下速度を調節する。":"<ruby>経管栄養<rt>けいかんえいよう<\/rt><\/ruby>が<ruby>早<rt>はや<\/rt><\/ruby>く<ruby>終<rt>お<\/rt><\/ruby>わるように<ruby>滴下速度<rt>てきかそくど<\/rt><\/ruby>を<ruby>調節<rt>ちょうせつ<\/rt><\/ruby>する。","医師や看護師にＡさんの思いを伝える。":"<ruby>医師<rt>いし<\/rt><\/ruby>や<ruby>看護師<rt>かんごし<\/rt><\/ruby>にＡさんの<ruby>思<rt>おも<\/rt><\/ruby>いを<ruby>伝<rt>つた<\/rt><\/ruby>える。","Ａさんに胃ろうの造設を提案する。":"Ａさんに<ruby>胃<rt>い<\/rt><\/ruby>ろうの<ruby>造設<rt>ぞうせつ<\/rt><\/ruby>を<ruby>提案<rt>ていあん<\/rt><\/ruby>する。","Ａさんに経口摂取を提案する。":"Ａさんに<ruby>経口摂取<rt>けいこうせっしゅ<\/rt><\/ruby>を<ruby>提案<rt>ていあん<\/rt><\/ruby>する。","本人の食べたい気持ちや見た目への思いを医師・看護師に伝え、対応を一緒に考えます。":"<ruby>本人<rt>ほんにん<\/rt><\/ruby>の<ruby>食べた<rt>たべた<\/rt><\/ruby>い<ruby>気持<rt>きも<\/rt><\/ruby>ちや<ruby>見た目<rt>みため<\/rt><\/ruby>への<ruby>思い<rt>おもい<\/rt><\/ruby>を<ruby>医師<rt>いし<\/rt><\/ruby>・<ruby>看護師<rt>かんごし<\/rt><\/ruby>に<ruby>伝え<rt>つたえ<\/rt><\/ruby>、<ruby>対応<rt>たいおう<\/rt><\/ruby>を<ruby>一緒<rt>いっしょ<\/rt><\/ruby>に<ruby>考え<rt>かんがえ<\/rt><\/ruby>ます。","介護福祉に関連する法律に関する次の記述のうち，適切なものを1 つ選びなさい。":"<ruby>介護福祉<rt>かいごふくし<\/rt><\/ruby>に<ruby>関連<rt>かんれん<\/rt><\/ruby>する<ruby>法律<rt>ほうりつ<\/rt><\/ruby>に<ruby>関<rt>かん<\/rt><\/ruby>する<ruby>次<rt>つぎ<\/rt><\/ruby>の<ruby>記述<rt>きじゅつ<\/rt><\/ruby>のうち，<ruby>適切<rt>てきせつ<\/rt><\/ruby>なものを1 つ<ruby>選<rt>えら<\/rt><\/ruby>びなさい。","1 「高齢者虐待防止法」とは，「高齢者虐待の防止，高齢者の養護者に対する支 援等に関する法律」のことである。2 「障害者総合支援法」とは，「障害者の日常生活及び社会生活を総合的に支 援するための法律」のことである。":"1 「<ruby>高齢者虐待防止法<rt>こうれいしゃぎゃくたいぼうしほう<\/rt><\/ruby>」とは，「<ruby>高齢者虐待<rt>こうれいしゃぎゃくたい<\/rt><\/ruby>の<ruby>防止<rt>ぼうし<\/rt><\/ruby>，<ruby>高齢者<rt>こうれいしゃ<\/rt><\/ruby>の<ruby>養護者<rt>ようごしゃ<\/rt><\/ruby>に<ruby>対<rt>たい<\/rt><\/ruby>する<ruby>支<rt>し<\/rt><\/ruby> <ruby>援等<rt>えんとう<\/rt><\/ruby>に<ruby>関<rt>かん<\/rt><\/ruby>する<ruby>法律<rt>ほうりつ<\/rt><\/ruby>」のことである。2 「<ruby>障害者総合支援法<rt>しょうがいしゃそうごうしえんほう<\/rt><\/ruby>」とは，「<ruby>障害者<rt>しょうがいしゃ<\/rt><\/ruby>の<ruby>日常生活及<rt>にちじょうせいかつおよ<\/rt><\/ruby>び<ruby>社会生活<rt>しゃかいせいかつ<\/rt><\/ruby>を<ruby>総合的<rt>そうごうてき<\/rt><\/ruby>に<ruby>支<rt>し<\/rt><\/ruby> <ruby>援<rt>えん<\/rt><\/ruby>するための<ruby>法律<rt>ほうりつ<\/rt><\/ruby>」のことである。","「高齢者虐待防止法」は，福祉六法の1 つである。":"「<ruby>高齢者虐待防止法<rt>こうれいしゃぎゃくたいぼうしほう<\/rt><\/ruby>」は，<ruby>福祉六法<rt>ふくしろっぽう<\/rt><\/ruby>の1 つである。","「障害者総合支援法」は，障害者基本計画の策定を義務づけている。":"「<ruby>障害者総合支援法<rt>しょうがいしゃそうごうしえんほう<\/rt><\/ruby>」は，<ruby>障害者基本計画<rt>しょうがいしゃきほんけいかく<\/rt><\/ruby>の<ruby>策定<rt>さくてい<\/rt><\/ruby>を<ruby>義務<rt>ぎむ<\/rt><\/ruby>づけている。","社会福祉法によって，社会福祉士の定義が規定されている。":"<ruby>社会福祉法<rt>しゃかいふくしほう<\/rt><\/ruby>によって，<ruby>社会福祉士<rt>しゃかいふくしし<\/rt><\/ruby>の<ruby>定義<rt>ていぎ<\/rt><\/ruby>が<ruby>規定<rt>きてい<\/rt><\/ruby>されている。","介護保険法は，国民の共同連帯の理念に基づいて介護保険制度を設けている。":"<ruby>介護保険法<rt>かいごほけんほう<\/rt><\/ruby>は，<ruby>国民<rt>こくみん<\/rt><\/ruby>の<ruby>共同連帯<rt>きょうどうれんたい<\/rt><\/ruby>の<ruby>理念<rt>りねん<\/rt><\/ruby>に<ruby>基<rt>もと<\/rt><\/ruby>づいて<ruby>介護保険制度<rt>かいごほけんせいど<\/rt><\/ruby>を<ruby>設<rt>もう<\/rt><\/ruby>けている。","医師法によって，介護福祉の業務の一部として医行為が認められている。":"<ruby>医師法<rt>いしほう<\/rt><\/ruby>によって，<ruby>介護福祉<rt>かいごふくし<\/rt><\/ruby>の<ruby>業務<rt>ぎょうむ<\/rt><\/ruby>の<ruby>一部<rt>いちぶ<\/rt><\/ruby>として<ruby>医行為<rt>いこうい<\/rt><\/ruby>が<ruby>認<rt>みと<\/rt><\/ruby>められている。","介護保険法は、国民の共同連帯の理念に基づき、介護を社会全体で支える仕組みを設けています。":"<ruby>介護保険法<rt>かいごほけんほう<\/rt><\/ruby>は、<ruby>国民<rt>こくみん<\/rt><\/ruby>の<ruby>共同連帯<rt>きょうどうれんたい<\/rt><\/ruby>の<ruby>理念<rt>りねん<\/rt><\/ruby>に<ruby>基づ<rt>もとづ<\/rt><\/ruby>き、<ruby>介護<rt>かいご<\/rt><\/ruby>を<ruby>社会<rt>しゃかい<\/rt><\/ruby><ruby>全体<rt>ぜんたい<\/rt><\/ruby>で<ruby>支え<rt>ささえ<\/rt><\/ruby>る<ruby>仕組<rt>しく<\/rt><\/ruby>みを<ruby>設け<rt>もうけ<\/rt><\/ruby>ています。","社会福祉士及び介護福祉士法に関する次の記述のうち，適切なものを1 つ選びなさい。":"<ruby>社会福祉士及<rt>しゃかいふくししおよ<\/rt><\/ruby>び<ruby>介護福祉士法<rt>かいごふくししほう<\/rt><\/ruby>に<ruby>関<rt>かん<\/rt><\/ruby>する<ruby>次<rt>つぎ<\/rt><\/ruby>の<ruby>記述<rt>きじゅつ<\/rt><\/ruby>のうち，<ruby>適切<rt>てきせつ<\/rt><\/ruby>なものを1 つ<ruby>選<rt>えら<\/rt><\/ruby>びなさい。","資質向上のために，5 年に1 回，資格更新研修を受けなければならない。":"<ruby>資質向上<rt>ししつこうじょう<\/rt><\/ruby>のために，5 <ruby>年<rt>ねん<\/rt><\/ruby>に1 <ruby>回<rt>かい<\/rt><\/ruby>，<ruby>資格更新研修<rt>しかくこうしんけんしゅう<\/rt><\/ruby>を<ruby>受<rt>う<\/rt><\/ruby>けなければならない。","社会福祉士の業務を介護福祉士が行うことは禁じられている。":"<ruby>社会福祉士<rt>しゃかいふくしし<\/rt><\/ruby>の<ruby>業務<rt>ぎょうむ<\/rt><\/ruby>を<ruby>介護福祉士<rt>かいごふくしし<\/rt><\/ruby>が<ruby>行<rt>おこな<\/rt><\/ruby>うことは<ruby>禁<rt>きん<\/rt><\/ruby>じられている。","介護福祉士の信用を傷つける行為をしてはならない。":"<ruby>介護福祉士<rt>かいごふくしし<\/rt><\/ruby>の<ruby>信用<rt>しんよう<\/rt><\/ruby>を<ruby>傷<rt>きず<\/rt><\/ruby>つける<ruby>行為<rt>こうい<\/rt><\/ruby>をしてはならない。","介護福祉士は，その業を辞した後は秘密保持義務が解除される。":"<ruby>介護福祉士<rt>かいごふくしし<\/rt><\/ruby>は，その<ruby>業<rt>ぎょう<\/rt><\/ruby>を<ruby>辞<rt>じ<\/rt><\/ruby>した<ruby>後<rt>あと<\/rt><\/ruby>は<ruby>秘密保持義務<rt>ひみつほじぎむ<\/rt><\/ruby>が<ruby>解除<rt>かいじょ<\/rt><\/ruby>される。","介護福祉士国家試験に合格した日から，介護福祉士を名乗ることができる。":"<ruby>介護福祉士国家試験<rt>かいごふくししこっかしけん<\/rt><\/ruby>に<ruby>合格<rt>ごうかく<\/rt><\/ruby>した<ruby>日<rt>ひ<\/rt><\/ruby>から，<ruby>介護福祉士<rt>かいごふくしし<\/rt><\/ruby>を<ruby>名乗<rt>なの<\/rt><\/ruby>ることができる。","介護福祉士には信用失墜行為の禁止が定められています。秘密保持義務は仕事を辞めた後も続きます。":"<ruby>介護福祉士<rt>かいごふくしし<\/rt><\/ruby>には<ruby>信用<rt>しんよう<\/rt><\/ruby><ruby>失墜<rt>しっつい<\/rt><\/ruby><ruby>行為<rt>こうい<\/rt><\/ruby>の<ruby>禁止<rt>きんし<\/rt><\/ruby>が<ruby>定め<rt>さだめ<\/rt><\/ruby>られています。<ruby>秘密保持義務<rt>ひみつほじぎむ<\/rt><\/ruby>は<ruby>仕事<rt>しごと<\/rt><\/ruby>を<ruby>辞めた後<rt>やめたあと<\/rt><\/ruby>も<ruby>続き<rt>つづき<\/rt><\/ruby>ます。","Ａさん（75 歳，女性）は，3 か月前に，血管性認知症（vascular dementia）を発症し，軽度の左片麻痺で杖歩行となり，要介護3 と認定された。Ａさんは，料理が大好きで，娘と一緒に食事を作ることを楽しみに生活していた。1 か月前から認知症（dementia）が進行し，ユニット型介護老人福祉施設に入所した。Ａさんは夕方になると，「ご飯の支度をしないといけないから帰ります」と言いながら，興奮して歩き回る様子がみられるようになった。Ａさんへの介護福祉職の対応として，最も適切なものを1 つ選びなさい。":"Ａさん（75 <ruby>歳<rt>さい<\/rt><\/ruby>，<ruby>女性<rt>じょせい<\/rt><\/ruby>）は，3 か<ruby>月前<rt>げつまえ<\/rt><\/ruby>に，<ruby>血管性認知症<rt>けっかんせいにんちしょう<\/rt><\/ruby>（vascular dementia）を<ruby>発症<rt>はっしょう<\/rt><\/ruby>し，<ruby>軽度<rt>けいど<\/rt><\/ruby>の<ruby>左片麻痺<rt>ひだりかたまひ<\/rt><\/ruby>で<ruby>杖歩行<rt>つえほこう<\/rt><\/ruby>となり，<ruby>要介護<rt>ようかいご<\/rt><\/ruby>3 と<ruby>認定<rt>にんてい<\/rt><\/ruby>された。Ａさんは，<ruby>料理<rt>りょうり<\/rt><\/ruby>が<ruby>大好<rt>だいす<\/rt><\/ruby>きで，<ruby>娘<rt>むすめ<\/rt><\/ruby>と<ruby>一緒<rt>いっしょ<\/rt><\/ruby>に<ruby>食事<rt>しょくじ<\/rt><\/ruby>を<ruby>作<rt>つく<\/rt><\/ruby>ることを<ruby>楽<rt>たの<\/rt><\/ruby>しみに<ruby>生活<rt>せいかつ<\/rt><\/ruby>していた。1 か<ruby>月前<rt>げつまえ<\/rt><\/ruby>から<ruby>認知症<rt>にんちしょう<\/rt><\/ruby>（dementia）が<ruby>進行<rt>しんこう<\/rt><\/ruby>し，ユニット<ruby>型介護老人福祉施設<rt>がたかいごろうじんふくししせつ<\/rt><\/ruby>に<ruby>入所<rt>にゅうしょ<\/rt><\/ruby>した。Ａさんは<ruby>夕方<rt>ゆうがた<\/rt><\/ruby>になると，「ご<ruby>飯<rt>はん<\/rt><\/ruby>の<ruby>支度<rt>したく<\/rt><\/ruby>をしないといけないから<ruby>帰<rt>かえ<\/rt><\/ruby>ります」と<ruby>言<rt>い<\/rt><\/ruby>いながら，<ruby>興奮<rt>こうふん<\/rt><\/ruby>して<ruby>歩<rt>ある<\/rt><\/ruby>き<ruby>回<rt>まわ<\/rt><\/ruby>る<ruby>様子<rt>ようす<\/rt><\/ruby>がみられるようになった。Ａさんへの<ruby>介護福祉職<rt>かいごふくししょく<\/rt><\/ruby>の<ruby>対応<rt>たいおう<\/rt><\/ruby>として，<ruby>最<rt>もっと<\/rt><\/ruby>も<ruby>適切<rt>てきせつ<\/rt><\/ruby>なものを1 つ<ruby>選<rt>えら<\/rt><\/ruby>びなさい。","居室に鍵をかけて，自室で過ごしてもらう。":"<ruby>居室<rt>きょしつ<\/rt><\/ruby>に<ruby>鍵<rt>かぎ<\/rt><\/ruby>をかけて，<ruby>自室<rt>じしつ<\/rt><\/ruby>で<ruby>過<rt>す<\/rt><\/ruby>ごしてもらう。","介護福祉職と一緒に，夕食の準備をしてもらう。":"<ruby>介護福祉職<rt>かいごふくししょく<\/rt><\/ruby>と<ruby>一緒<rt>いっしょ<\/rt><\/ruby>に，<ruby>夕食<rt>ゆうしょく<\/rt><\/ruby>の<ruby>準備<rt>じゅんび<\/rt><\/ruby>をしてもらう。","杖を預かり，低めの丸椅子に座ってもらう。":"<ruby>杖<rt>つえ<\/rt><\/ruby>を<ruby>預<rt>あず<\/rt><\/ruby>かり，<ruby>低<rt>ひく<\/rt><\/ruby>めの<ruby>丸椅子<rt>まるいす<\/rt><\/ruby>に<ruby>座<rt>すわ<\/rt><\/ruby>ってもらう。","介護福祉職の判断で，向精神薬を服用してもらう。":"<ruby>介護福祉職<rt>かいごふくししょく<\/rt><\/ruby>の<ruby>判断<rt>はんだん<\/rt><\/ruby>で，<ruby>向精神薬<rt>こうせいしんやく<\/rt><\/ruby>を<ruby>服用<rt>ふくよう<\/rt><\/ruby>してもらう。","ここがＡさんの自宅であることを，理解してもらう。":"ここがＡさんの<ruby>自宅<rt>じたく<\/rt><\/ruby>であることを，<ruby>理解<rt>りかい<\/rt><\/ruby>してもらう。","料理を大切にしてきた生活歴を生かし、夕食の準備に一緒に取り組むことで、役割や安心感につなげます。":"<ruby>料理<rt>りょうり<\/rt><\/ruby>を<ruby>大切<rt>たいせつ<\/rt><\/ruby>にしてきた<ruby>生活<rt>せいかつ<\/rt><\/ruby><ruby>歴<rt>れき<\/rt><\/ruby>を<ruby>生か<rt>いか<\/rt><\/ruby>し、<ruby>夕食<rt>ゆうしょく<\/rt><\/ruby>の<ruby>準備<rt>じゅんび<\/rt><\/ruby>に<ruby>一緒<rt>いっしょ<\/rt><\/ruby>に<ruby>取り組む<rt>とりくむ<\/rt><\/ruby>ことで、<ruby>役割<rt>やくわり<\/rt><\/ruby>や<ruby>安心<rt>あんしん<\/rt><\/ruby><ruby>感<rt>かん<\/rt><\/ruby>につなげます。","ＩＣＦ（International Classification of Functioning, Disability and Health： 国際生活機能分類）における「参加」と「活動」の2 つが関連した，認知症の人の支援に関する記述として，最も適切なものを1 つ選びなさい。":"ＩＣＦ（International Classification of Functioning, Disability and Health： <ruby>国際生活機能分類<rt>こくさいせいかつきのうぶんるい<\/rt><\/ruby>）における「<ruby>参加<rt>さんか<\/rt><\/ruby>」と「<ruby>活動<rt>かつどう<\/rt><\/ruby>」の2 つが<ruby>関連<rt>かんれん<\/rt><\/ruby>した，<ruby>認知症<rt>にんちしょう<\/rt><\/ruby>の<ruby>人<rt>ひと<\/rt><\/ruby>の<ruby>支援<rt>しえん<\/rt><\/ruby>に<ruby>関<rt>かん<\/rt><\/ruby>する<ruby>記述<rt>きじゅつ<\/rt><\/ruby>として，<ruby>最<rt>もっと<\/rt><\/ruby>も<ruby>適切<rt>てきせつ<\/rt><\/ruby>なものを1 つ<ruby>選<rt>えら<\/rt><\/ruby>びなさい。","若年性アルツハイマー型認知症（dementia of the Alzheimer’s type with early onset）があり，治療している。":"<ruby>若年性<rt>じゃくねんせい<\/rt><\/ruby>アルツハイマー<ruby>型認知症<rt>がたにんちしょう<\/rt><\/ruby>（dementia of the Alzheimer’s type with early onset）があり，<ruby>治療<rt>ちりょう<\/rt><\/ruby>している。","認知症カフェに通い，体操をしている。":"<ruby>認知症<rt>にんちしょう<\/rt><\/ruby>カフェに<ruby>通<rt>かよ<\/rt><\/ruby>い，<ruby>体操<rt>たいそう<\/rt><\/ruby>をしている。","近所に住む長男が，買物を代行している。":"<ruby>近所<rt>きんじょ<\/rt><\/ruby>に<ruby>住<rt>す<\/rt><\/ruby>む<ruby>長男<rt>ちょうなん<\/rt><\/ruby>が，<ruby>買物<rt>かいもの<\/rt><\/ruby>を<ruby>代行<rt>だいこう<\/rt><\/ruby>している。","自宅にある広い庭を，バリアフリー化して y>最<rt>もっと<\/rt><\/ruby>も<ruby>適切<rt>てきせつ<\/rt><\/ruby>なものを1 つ<ruby>選<rt>えら<\/rt><\/ruby>びなさい。","入所中は母語を使わずに，日本語を話すように伝える。":"<ruby>入所中<rt>にゅうしょちゅう<\/rt><\/ruby>は<ruby>母語<rt>ぼご<\/rt><\/ruby>を<ruby>使<rt>つか<\/rt><\/ruby>わずに，<ruby>日本語<rt>にほんご<\/rt><\/ruby>を<ruby>話<rt>はな<\/rt><\/ruby>すように<ruby>伝<rt>つた<\/rt><\/ruby>える。","居室の床に布団を敷いて，寝起きができるようにする。":"<ruby>居室<rt>きょしつ<\/rt><\/ruby>の<ruby>床<rt>ゆか<\/rt><\/ruby>に<ruby>布団<rt>ふとん<\/rt><\/ruby>を<ruby>敷<rt>し<\/rt><\/ruby>いて，<ruby>寝起<rt>ねお<\/rt><\/ruby>きができるようにする。","自分で食事ができるように，自助具の使用状況を確認する。":"<ruby>自分<rt>じぶん<\/rt><\/ruby>で<ruby>食事<rt>しょくじ<\/rt><\/ruby>ができるように，<ruby>自助具<rt>じじょぐ<\/rt><\/ruby>の<ruby>使用状況<rt>しようじょうきょう<\/rt><\/ruby>を<ruby>確認<rt>かくにん<\/rt><\/ruby>する。","ほかの利用者と同じ時間に食べ終えるように伝える。":"ほかの<ruby>利用者<rt>りようしゃ<\/rt><\/ruby>と<ruby>同<rt>おな<\/rt><\/ruby>じ<ruby>時間<rt>じかん<\/rt><\/ruby>に<ruby>食<rt>た<\/rt><\/ruby>べ<ruby>終<rt>お<\/rt><\/ruby>えるように<ruby>伝<rt>つた<\/rt><\/ruby>える。","日本の生活に合わせるように，余暇活動の内容は介護福祉職が判断する。":"<ruby>日本<rt>にほん<\/rt><\/ruby>の<ruby>生活<rt>せいかつ<\/rt><\/ruby>に<ruby>合<rt>あ<\/rt><\/ruby>わせるように，<ruby>余暇活動<rt>よかかつどう<\/rt><\/ruby>の<ruby>内容<rt>ないよう<\/rt><\/ruby>は<ruby>介護福祉職<rt>かいごふくししょく<\/rt><\/ruby>が<ruby>判断<rt>はんだん<\/rt><\/ruby>する。","本人が望む食事の自立に向け、自助具を適切に使えているか確認します。文化や生活習慣も尊重します。":"<ruby>本人<rt>ほんにん<\/rt><\/ruby>が<ruby>望む<rt>のぞむ<\/rt><\/ruby><ruby>食事<rt>しょくじ<\/rt><\/ruby>の<ruby>自立<rt>じりつ<\/rt><\/ruby>に<ruby>向け<rt>むけ<\/rt><\/ruby>、<ruby>自助具<rt>じじょぐ<\/rt><\/ruby>を<ruby>適切<rt>てきせつ<\/rt><\/ruby>に<ruby>使え<rt>つかえ<\/rt><\/ruby>ているか<ruby>確認<rt>かくにん<\/rt><\/ruby>します。<ruby>文化<rt>ぶんか<\/rt><\/ruby>や<ruby>生活<rt>せいかつ<\/rt><\/ruby><ruby>習慣<rt>しゅうかん<\/rt><\/ruby>も<ruby>尊重<rt>そんちょう<\/rt><\/ruby>します。","次の記述のうち，チームアプローチに関するものとして，適切なものを1 つ選びなさい。":"<ruby>次<rt>つぎ<\/rt><\/ruby>の<ruby>記述<rt>きじゅつ<\/rt><\/ruby>のうち，チームアプローチに<ruby>関<rt>かん<\/rt><\/ruby>するものとして，<ruby>適切<rt>てきせつ<\/rt><\/ruby>なものを1 つ<ruby>選<rt>えら<\/rt><\/ruby>びなさい。","介護福祉職が利用者のところに行って，相談，支援を行う。":"<ruby>介護福祉職<rt>かいごふくししょく<\/rt><\/ruby>が<ruby>利用者<rt>りようしゃ<\/rt><\/ruby>のところに<ruby>行<rt>い<\/rt><\ ><\/ruby>は，<ruby>防災<rt>ぼうさい<\/rt><\/ruby>スキル<ruby>向上<rt>こうじょう<\/rt><\/ruby>のために，<ruby>防災士<rt>ぼうさいし<\/rt><\/ruby>の<ruby>資格取得<rt>しかくしゅとく<\/rt><\/ruby>が<ruby>義務<rt>ぎむ<\/rt><\/ruby>づけられている。","災害対策基本法に基づき，個別避難計画の作成が施設長に義務づけられている。":"<ruby>災害対策基本法<rt>さいがいたいさくきほんほう<\/rt><\/ruby>に<ruby>基<rt>もと<\/rt><\/ruby>づき，<ruby>個別避難計画<rt>こべつひなんけいかく<\/rt><\/ruby>の<ruby>作成<rt>さくせい<\/rt><\/ruby>が<ruby>施設長<rt>しせつちょう<\/rt><\/ruby>に<ruby>義務<rt>ぎむ<\/rt><\/ruby>づけられている。","一般的に，飲料水と非常食は1 日分の備蓄が義務づけられている。":"<ruby>一般的<rt>いっぱんてき<\/rt><\/ruby>に，<ruby>飲料水<rt>いんりょうすい<\/rt><\/ruby>と<ruby>非常食<rt>ひじょうしょく<\/rt><\/ruby>は1 <ruby>日分<rt>にちぶん<\/rt><\/ruby>の<ruby>備蓄<rt>びちく<\/rt><\/ruby>が<ruby>義務<rt>ぎむ<\/rt><\/ruby>づけられている。","災害時等に備えて，業務継続計画（ＢＣＰ：Business Continuity Plan）の策定が義務づけられている。":"<ruby>災害時等<rt>さいがいじとう<\/rt><\/ruby>に<ruby>備<rt>そな<\/rt><\/ruby>えて，<ruby>業務継続計画<rt>ぎょうむけいぞくけいかく<\/rt><\/ruby>（ＢＣＰ：Business Continuity Plan）の<ruby>策定<rt>さくてい<\/rt><\/ruby>が<ruby>義務<rt>ぎむ<\/rt><\/ruby>づけられている。","業務継続計画は、災害や感染症などの発生時にも、必要なサービスを継続・再開するための計画です。":"<ruby>業務継続計画<rt>ぎょうむけいぞくけいかく<\/rt><\/ruby>は、<ruby>災害<rt>さいがい<\/rt><\/ruby>や<ruby>感染症<rt>かんせんしょう<\/rt><\/ruby>などの<ruby>発生時<rt>はっせいじ<\/rt><\/ruby>にも、<ruby>必要<rt>ひつよう<\/rt><\/ruby>なサービスを<ruby>継続<rt>けいぞく<\/rt><\/ruby>・<ruby>再開<rt>さいかい<\/rt><\/ruby>するための<ruby>計画<rt>けいかく<\/rt><\/ruby>です。","次のうち，結核（tuberculosis）の予防対策に該当するものとして，最も適切なものを1 つ選びなさい。":"<ruby>次<rt>つぎ<\/rt><\/ruby>のうち，<ruby>結核<rt>けっかく<\/rt><\/ruby>（tuberculosis）の<ruby>予防対策<rt>よぼうたいさく<\/rt><\/ruby>に<ruby>該当<rt>がいとう<\/rt><\/ruby>するものとして，<ruby>最<rt>もっと<\/rt><\/ruby>も<ruby>適<rt>てき<\/rt><\/ruby><ruby>切<rt>せつ<\/rt><\/ruby>なものを1 つ<ruby>選<rt>えら<\/rt><\/ruby>びなさい。","便座のアルコール消毒":"<ruby>便座<rt>べんざ<\/rt><\/ruby>のアルコール<ruby>消毒<rt>しょうどく<\/rt><\/ruby>","肺炎球菌ワクチンの接種":"<ruby>肺炎球菌<rt>はいえんきゅうきん<\/rt><\/ruby>ワクチンの<ruby>接種<rt>せっしゅ<\/rt><\/ruby>","紫外線を避けた生活":"<ruby>紫外線<rt>しがいせん<\/rt><\/ruby>を<ruby>避<rt>さ<\/rt><\/ruby>けた<ruby>生活<rt>せいかつ<\/rt><\/ruby>","年に1 回の胸部Ｘ線検査":"<ruby>年<rt>ねん<\/rt><\/ruby>に1 <ruby>回<rt>かい<\/rt><\/ruby>の<ruby>胸部<rt>きょうぶ<\/rt><\/ruby>Ｘ<ruby>線検査<rt>せんけんさ<\/rt><\/ruby>","50℃以上の温水によるリネン類の洗濯":"50℃<ruby>以上<rt>いじょう<\/rt><\/ruby>の<ruby>温水<rt>おんすい<\/rt><\/ruby>によるリネン<ruby>類<rt>るい<\/rt><\/ruby>の<ruby>洗濯<rt>せんたく<\/rt><\/ruby>","胸部エックス線検査は、結核の早期発見に役立ちます。早期に発見し治療へつなげることが感染拡大の防止になります。":"<ruby>胸部<rt>きょうぶ<\/rt><\/ruby>エックス<ruby>線検査<rt>せんけんさ<\/rt><\/ruby>は、<ruby>結核<rt>けっかく<\/rt><\/ruby>の<ruby>早期<rt>そうき<\/rt><\/ruby><ruby>発見<rt>はっけん<\/rt><\/ruby>に<ruby>役立<rt>やくだ<\/rt><\/ruby>ちます。<ruby>早期<rt>そうき<\/rt><\/ruby>に<ruby>発見<rt>はっけん<\/rt><\/ruby>し<ruby>治療<rt>ちりょう<\/rt><\/ruby>へつなげることが<ruby>感染<rt>かんせん<\/rt><\/ruby><ruby>拡大<rt>かくだい<\/rt><\/ruby>の<ruby>防止<rt>ぼうし<\/rt><\/ruby>になります。","次の記述のうち，利用者とのコミュニケーションの場面で用いる要約の技法として，適切なものを1 つ選びなさい。":"<ruby>次<rt>つぎ<\/rt><\/ruby>の<ruby>記述<rt>きじゅつ<\/rt><\/ruby>のうち，<ruby>利用者<rt>りようしゃ<\/rt><\/ruby>とのコミュニケーションの<ruby>場面<rt>ばめん<\/rt><\/ruby>で<ruby>用<rt>もち<\/rt><\/ruby>いる<ruby>要約<rt>ようやく<\/rt><\/ruby>の<ruby>技法<rt>ぎほう<\/rt><\/ruby>として，<ruby>適切<rt>てきせつ<\/rt><\/ruby>なものを1 つ<ruby>選<rt>えら<\/rt><\/ruby>びなさい。","開かれた質問をして，利用者の気持ちを明らかにした。":"<ruby>開<rt>ひら<\/rt><\/ruby>かれた<ruby>質問<rt>しつもん<\/rt><\/ruby>をして，<ruby>利用者<rt>りようしゃ<\/rt><\/ruby>の<ruby>気持<rt>きも<\/rt><\/ruby>ちを<ruby>明<rt>あき<\/rt><\/ruby>らかにした。","共感しながら話を聞き，利用者の気持ちを受け止めた。":"<ruby>共感<rt>きょうかん<\/rt><\/ruby>しながら<ruby>話<rt>はなし<\/rt><\/ruby>を<ruby>聞<rt>き<\/rt><\/ruby>き，<ruby>利用者<rt>りようしゃ<\/rt><\/ruby>の<ruby>気持<rt>きも<\/rt><\/ruby>ちを<ruby>受<rt>う<\/rt><\/ruby>け<ruby>止<rt>と<\/rt><\/ruby>めた。","話の途中でうなずき，利用者の気持ちに同意した。":"<ruby>話<rt>はなし<\/rt><\/ruby>の<ruby>途中<rt>とちゅう<\/rt><\/ruby>でうなずき，<ruby>利用者<rt>りようしゃ<\/rt><\/ruby>の<ruby>気持<rt>きも<\/rt><\/ruby>ちに<ruby>同意<rt>どうい<\/rt><\/ruby>した。","話の内容を総合的にまとめて返し，利用者の気持ちを整理した。":"<ruby>話<rt>はなし<\/rt><\/ruby>の<ruby>内容<rt>ないよう<\/rt><\/ruby>を<ruby>総合的<rt>そうごうてき<\/rt><\/ruby>にまとめて<ruby>返<rt>かえ<\/rt><\/ruby>し，<ruby>利用者<rt>りようしゃ<\/rt><\/ruby>の<ruby>気持<rt>きも<\/rt><\/ruby>ちを<ruby>整理<rt>せいり<\/rt><\/ruby>した。","自己覚知を図り，利用者との人間関係の形成に努めた。":"<ruby>自己覚知<rt>じこかくち<\/rt><\/ruby>を<ruby>図<rt>はか<\/rt><\/ruby>り，<ruby>利用者<rt>りようしゃ<\/rt><\/ruby>と <ruby>保持<rt>ほじ<\/rt><\/ruby>を<ruby>支え<rt>ささえ<\/rt><\/ruby>るため、<ruby>動作<rt>どうさ<\/rt><\/ruby>に<ruby>合わ<rt>あわ<\/rt><\/ruby>せて<ruby>水平<rt>すいへい<\/rt><\/ruby>・<ruby>垂直<rt>すいちょく<\/rt><\/ruby>の<ruby>手<rt>て<\/rt><\/ruby>すりを<ruby>設置<rt>せっち<\/rt><\/ruby>します。","次の記述のうち，体調不良で入浴できない片麻痺の利用者に対して，ベッド上で行う全身清拭の方法として，最も適切なものを1 つ選びなさい。":"<ruby>次<rt>つぎ<\/rt><\/ruby>の<ruby>記述<rt>きじゅつ<\/rt><\/ruby>のうち，<ruby>体調不良<rt>たいちょうふりょう<\/rt><\/ruby>で<ruby>入浴<rt>にゅうよく<\/rt><\/ruby>できない<ruby>片麻痺<rt>かたまひ<\/rt><\/ruby>の<ruby>利用者<rt>りようしゃ<\/rt><\/ruby>に<ruby>対<rt>たい<\/rt><\/ruby>して，ベッド<ruby>上<rt>じょう<\/rt><\/ruby>で<ruby>行<rt>おこな<\/rt><\/ruby>う<ruby>全身清拭<rt>ぜんしんせいしき<\/rt><\/ruby>の<ruby>方法<rt>ほうほう<\/rt><\/ruby>として，<ruby>最<rt>もっと<\/rt><\/ruby>も<ruby>適切<rt>てきせつ<\/rt><\/ruby>なものを1 つ<ruby>選<rt>えら<\/rt><\/ruby>びなさい。","清拭時は，窓を開けて行う。":"<ruby>清拭時<rt>せいしきじ<\/rt><\/ruby>は，<ruby>窓<rt>まど<\/rt><\/ruby>を<ruby>開<rt>あ<\/rt><\/ruby>けて<ruby>行<rt>おこな<\/rt><\/ruby>う。","洗面器には，40℃程度のお湯を準備する。":"<ruby>洗面器<rt>せんめんき<\/rt><\/ruby>には，40℃<ruby>程度<rt>ていど<\/rt><\/ruby>のお<ruby>湯<rt>ゆ<\/rt><\/ruby>を<ruby>準備<rt>じゅんび<\/rt><\/ruby>する。","最初に，腹部から清拭する。":"<ruby>最初<rt>さいしょ<\/rt><\/ruby>に，<ruby>腹部<rt>ふくぶ<\/rt><\/ruby>から<ruby>清拭<rt>せいしき<\/rt><\/ruby>する。","背部は，患側を下にした側臥位にして拭く。":"<ruby>背部<rt>はいぶ<\/rt><\/ruby>は，<ruby>患側<rt>かんそく<\/rt><\/ruby>を<ruby>下<rt>した<\/rt><\/ruby>にした<ruby>側臥位<rt>そくがい<\/rt><\/ruby>にして<ruby>拭<rt>ふ<\/rt><\/ruby>く。","蒸しタオルで拭いた後は，乾いたタオルで水分を拭き取る。":"<ruby>蒸<rt>む<\/rt><\/ruby>しタオルで<ruby>拭<rt>ふ<\/rt><\/ruby>いた<ruby>後<rt>あと<\/rt><\/ruby>は，<ruby>乾<rt>かわ<\/rt><\/ruby>いたタオルで<ruby>水分<rt>すいぶん<\/rt><\/ruby>を<ruby>拭<rt>ふ<\/rt><\/ruby>き<ruby>取<rt>と<\/rt><\/ruby>る。","拭いた後の水分が蒸発すると体温が奪われます。乾いたタオルで水分を取り、保温します。":"<ruby>拭い<rt>ふい<\/rt><\/ruby>た<ruby>後の<rt>ごの<\/rt><\/ruby><ruby>水分<rt>すいぶん<\/rt><\/ruby>が<ruby>蒸発<rt>じょうはつ<\/rt><\/ruby>すると<ruby>体温<rt>たいおん<\/rt><\/ruby>が<ruby>奪わ<rt>うばわ<\/rt><\/ruby>れます。<ruby>乾い<rt>かわい<\/rt><\/ruby>たタオルで<ruby>水分<rt>すいぶん<\/rt><\/ruby>を<ruby>取り<rt>とり<\/rt><\/ruby>、<ruby>保温<rt>ほおん<\/rt><\/ruby>します。","次のうち，同居の高齢者におむつを使用する家族介護者に対する くにん<\/rt><\/ruby>します。できる<ruby>力<rt>ちから<\/rt><\/ruby>を<ruby>生か<rt>いか<\/rt><\/ruby>して<ruby>自立<rt>じりつ<\/rt><\/ruby>を<ruby>目指<rt>めざ<\/rt><\/ruby>します。","現在のＡさんの症状に該当するホーエン・ヤール重症度分類として，最も適切なものを1 つ選びなさい。":"<ruby>現在<rt>げんざい<\/rt><\/ruby>のＡさんの<ruby>症状<rt>しょうじょう<\/rt><\/ruby>に<ruby>該当<rt>がいとう<\/rt><\/ruby>するホーエン・ヤール<ruby>重症度分類<rt>じゅうしょうどぶんるい<\/rt><\/ruby>として，<ruby>最<rt>もっと<\/rt><\/ruby>も<ruby>適切<rt>てきせつ<\/rt><\/ruby>なものを1 つ<ruby>選<rt>えら<\/rt><\/ruby>びなさい。","Ａさん（70 歳，男性）は，妻と二人で暮らしている。旅行や釣りが趣味で，会社員として勤務していたころは，活動的な生活を送っていた。66 歳のときにパーキンソン病（Parkinson disease）と診断されたが，内服治療が開始され，症状はあまり気にならなかった。1 年前から顔の表情が乏しくなり，歩行開始時に，はじめの一歩が出にくくなった。3 か月前からは，歩き始めると方向転換が難しく，急に止まることができないことがある。Ａさんは，今後の生活について相談するために，地域包括支援センターに行った。センターで対応してくれたＢ主任介護支援専門員は，介護福祉士としての実務経験が豊富だった。Ａさんは信頼して，気になっていたことをすべて話すことができた。Ａさんは，要介護認定を申請することを勧められ，後日，市役所に行き，要介護認定の申請を行った。":"Ａさん（70 <ruby>歳<rt>さい<\/rt><\/ruby>，<ruby>男性<rt>だんせい<\/rt><\/ruby>）は，<ruby>妻<rt>つま<\/rt><\/ruby>と<ruby>二人<rt>ふたり<\/rt><\/ruby>で<ruby>暮<rt>く<\/rt><\/ruby>らしている。<ruby>旅行<rt>りょこう<\/rt><\/ruby>や<ruby>釣<rt>つ<\/rt><\/ruby>りが<ruby>趣味<rt>しゅみ<\/rt><\/ruby>で，<ruby>会社員<rt>かいしゃいん<\/rt><\/ruby>として<ruby>勤務<rt>きんむ<\/rt><\/ruby>していたころは，<ruby>活動的<rt>かつどうてき<\/rt><\/ruby>な<ruby>生活<rt>せいかつ<\/rt><\/ruby>を<ruby>送<rt>おく<\/rt><\/ruby>っていた。66 <ruby>歳<rt>さい<\/rt><\/ruby>のときにパーキンソン<ruby>病<rt>びょう<\/rt><\/ruby>（Parkinson disease）と<ruby>診断<rt>しんだん<\/rt><\/ruby>されたが，<ruby>内服治療<rt>ないふくちりょう<\/rt><\/ruby>が<ruby>開始<rt>かいし<\/rt><\/ruby>され，<ruby>症状<rt>しょうじょう<\/rt><\/ruby>はあまり<ruby>気<rt>き<\/rt><\/ruby>にならなかった。1 <ruby>年前<rt>ねんまえ<\/rt><\/ruby>から<ruby>顔<rt>かお<\/rt><\/ruby>の<ruby>表情<rt>ひょうじょう<\/rt><\/ruby>が<ruby>乏<rt>とぼ<\/rt><\/ruby>しくなり，<ruby>歩行開始時<rt>ほこうかいしじ<\/rt><\/ruby>に，はじめの<ruby>一歩<rt>いっぽ<\/rt><\/ruby>が<ruby>出<rt>で<\/rt><\/ruby>にくくなった。3 か<ruby>月前<rt>げつまえ<\/rt><\/ruby>からは，<ruby>歩<rt>ある<\/rt><\/ruby>き<ruby>始<rt>はじ<\/rt><\/ruby>めると<ruby>方向転換<rt>ほうこうてんかん<\/rt><\/ruby>が<ruby>難<rt>むずか<\/rt><\/ruby>しく，<ruby>急<rt>きゅう<\/rt><\/ruby>に<ruby>止<rt>と<\/rt><\/ruby>まることができないことがある。Ａさんは，<ruby>今後<rt>こんご<\/rt><\/
