(()=>{
'use strict';
const host=document.currentScript.previousElementSibling;
const root=host.attachShadow({mode:'open'});
const QUESTIONS=[{"id":1,"question":"次の記述のうち，介護福祉職がアドボカシー（advocacy）の視点から行う対応として，最も適切なものを1 つ選びなさい。","options":["介護を行う前には，利用者に十分な説明をして同意を得る。","利用者の介護計画を作成するときに，他職種に専門的な助言を求める。","利用者個人の趣味を生かして，レクリエーション活動を行う。","希望を言い出しにくい利用者の意思をくみ取り，その実現に向けて働きかける。","視覚障害者が必要とする情報を，利用しやすいようにする。"],"answer":[4],"subject":0,"explanation":"アドボカシーは権利擁護です。意思を伝えにくい人の思いをくみ取り、実現に向けて働きかけます。"},{"id":2,"question":"Ａさん（83 歳，女性，要介護3 ）は，脳梗塞（cerebral infarction）の後遺症で左片麻痺があり，介護老人福祉施設で生活している。家族から，「できることは自分で行ってほしい」と希望があり，Ａさんは自室から食堂まで車いすで自 走することを日課としている。1 週間前から，介護福祉士養成施設の学生がＡさんのフロアで実習を開始した。数日前からＡさんは実習生に，「今日は腕が痛いので，食堂まで車いすを押してください」と依頼するようになった。悩んだ実習生は，実習指導者に相談をした。実習生に対する実習指導者の最初の助言として，最も適切なものを1 つ選びなさい。","options":["「Ａさんの腕は痛くないので，気にしないでください」","「どのようなときも，Ａさん自身で行ってもらうことが必要です」","「ご家族から自分で行うように，言われています」","「それは自立につながらないので，車いすを押さないでください」","「Ａさんが依頼する理由を，まず考えてみることが大切です」"],"answer":[5],"subject":0,"explanation":"自立支援では、本人が援助を求める理由を理解することが出発点です。痛みや気持ちを決めつけずに確かめます。"},{"id":3,"question":"人間関係と心理に関する次の記述のうち，適切なものを1 つ選びなさい。","options":["自己愛とは，自分という存在を，他人と区別して意識することである。","自己同一性の確立とは，自分とは何かという認識をもつことである。","自我とは，日常行動に影響を与える，表面化していない意識のことである。","自己覚知とは，コミュニケーションにおいて自分について話すことである。","自己中心性とは，自分の意思で自分の行動をコントロールすることである。"],"answer":[2],"subject":1,"explanation":"自己同一性は、自分が何者であるかという認識です。自分らしさや一貫性を感じることを意味します。"},{"id":4,"question":"Ａさん（80 歳，男性）は，有料老人ホームに入所することになった。一人 暮らしが長かったＡさんは，入所当日，担当の介護福祉職と話すことに戸惑っている様子で，なかなか自分のことを話そうとはしなかった。介護福祉職は，一方的な働きかけにならないように，Ａさんとコミュニケーションをとるとき，あいづちを打ちながらＡさんの発話を引き出すように心がけた。このときの，介護福祉職の対応の意図に当てはまるものとして，最も適切なものを1 つ選びなさい。","options":["互いの自己開示","コミュニケーション能力の評価","感覚機能の低下への配慮","認知機能の改善","双方向のやり取り"],"answer":[5],"subject":1,"explanation":"あいづちで話しやすい雰囲気をつくり、相手からの発言も引き出しています。双方向のやり取りを目指す対応です。"},{"id":5,"question":"次の記述のうち，介護福祉職のキャリアパスに関するものとして，最も適切なものを1 つ選びなさい。","options":["介護計画を作成するときのポイントを明確にする。","介護福祉職の業務マニュアルを具体化する。","利用サービスに応じて求められる関係書類を検討する。","介護施設に必要な設備基準について確認する。","介護福祉職として必要な能力や経験を明確にする。"],"answer":[5],"subject":1,"explanation":"キャリアパスは、成長や昇進の道筋です。各段階で必要な能力や経験を明らかにします。"},{"id":6,"question":"Ｂ介護老人福祉施設に，学校を卒業したばかりの元気なＣ介護福祉職が加わった。2 か月後，ユニットリーダーが，「最近，Ｃ介護福祉職に笑顔が少ない。いつもとちがう様子だ」と，フォロワーであるＤ介護福祉職に話した。Ｄ介護福祉 職はチームの一員として何ができるのかを考えた。Ｄ介護福祉職が最初に行うフォロワーシップとして，最も適切なものを1 つ選びなさい。","options":["Ｃ介護福祉職に対して，元気を出すように励ます。","ユニットリーダーが気になっていることを詳しく聞く。","Ｃ介護福祉職の状況をユニット内のほかのメンバーと速やかに共有する。","施設長に対して，何か指示を出すようにお願いする。","Ｃ介護福祉職に対して，介助方法について教える。"],"answer":[2],"subject":1,"explanation":"まずリーダーが気になっている点を詳しく聴き、状況を把握します。フォロワーも主体的にチームを支えます。"},{"id":7,"question":"社会福祉法に基づく社会福祉法人に関する次の記述のうち，適切なものを 1 つ選びなさい。","options":["収益事業は禁止されている。","所轄庁は内閣府である。","設立時に所轄庁の認可は不要である。","評議員会を置く必要がある。","解散は禁止されている。"],"answer":[4],"subject":2,"explanation":"社会福祉法人には、評議員会を置く必要があります。法人運営に関する重要事項を決議します。"},{"id":8,"question":"次の記述のうち，定期巡回・随時対応型訪問介護看護の説明として，正しいものを1 つ選びなさい。","options":["利用定員は，9 人以下と定められている。","日中・夜間を通じて，提供するサービスである。","認知症対応型共同生活介護（認知症高齢者グループホーム）に入居する利用者に対して，機能訓練を行うサービスである。","通い，泊まり，看護の3 種類の組合せによるサービスである。","都道府県が事業者の指定，指導，監督を行うサービスである。"],"answer":[2],"subject":2,"explanation":"定期巡回・随時対応型訪問介護看護は、昼夜を通じた訪問や随時の対応で、在宅生活を支えます。"},{"id":9,"question":"Ａさん（48 歳，会社員）は，うつ症状から体調不良が続き，仕事を休むことが増えたため，自主的に退職した。その後，体調は回復したが，再就職先がなかなか見つからなかった。しばらく貯金で生活していたが，数か月後，生活を営むことができなくなってしまった。頼れる親族はなく，生活保護を受給することにした。この事例において，日本国憲法に基づいてＡさんに保障された権利として，最も適切なものを1 つ選びなさい。","options":["団体交渉権","平等権","財産権","思想の自由","生存権"],"answer":[5],"subject":2,"explanation":"憲法の生存権は、健康で文化的な最低限度の生活を営む権利です。生活保護はその保障を具体化する制度です。"},{"id":10,"question":"次の記述のうち，保健所に関するものとして，正しいものを1 つ選びなさい。","options":["保健師助産師看護師法に基づいて設置されている。","すべての市町村に設置の義務がある。","業務には精神保健に関する事項が含まれている。","歯科衛生士を置かなくてはならない。","児童の一時保護を行う。"],"answer":[3],"subject":2,"explanation":"保健所は地域保健法に基づく機関で、精神保健を含む地域の保健活動を担います。"},{"id":11,"question":"地域包括支援センターの業務に関する記述として，正しいものを1 つ選びなさい。","options":["地域ケア会議の開催","施設サービスのケアプランの作成","成年後見制度の申請","介護認定審査会の設置","地域密着型サービスの事業者の指導・監督"],"answer":[1],"subject":2,"explanation":"地域包括支援センターは、地域ケア会議を開き、個別の支援や地域の課題について関係者と検討します。"},{"id":12,"question":"Ｂさん（85 歳，男性，要支援1 ）は，自宅で一人暮らしをしている。最近，物忘れが多くなり，1 か月前から地域支援事業の訪問型サービスを利用するようになった。ある日，Ｂさんが，「これからも自宅で生活したいが，日中，話し相手がいなくて寂しい」と介護福祉職に話した。次のうち，Ｂさんに介護福祉職が勧めるサービスとして，最も適切なものを1つ選びなさい。","options":["認知症対応型共同生活介護（認知症高齢者グループホーム）","介護老人福祉施設","第一号通所事業（通所型サービス）","夜間対応型訪問介護","居宅療養管理指導"],"answer":[3],"subject":2,"explanation":"通所型サービスは、要支援者などの介護予防や交流の機会を支えます。自宅で暮らしたい希望にも合っています。"},{"id":13,"question":"介護保険制度に関する記述として，正しいものを1 つ選びなさい。","options":["第1 号被保険者の保険料は，都道府県が徴収する。","第1 号被保険者の保険料は，全国一律である。","第2 号被保険者の保険料は，年金保険の保険料と合わせて徴収される。","財源には，第1 号被保険者の保険料と第2 号被保険者の保険料が含まれる。","介護保険サービスの利用者負担割合は，一律，1 割である。"],"answer":[4],"subject":2,"explanation":"介護保険の財源には、公費と、第一号・第二号被保険者が納める保険料が含まれます。"},{"id":14,"question":"障害者の雇用の促進等に関する法律に関する次の記述のうち，正しいものを1 つ選びなさい。","options":["2024 年度（令和6 年度）の民間企業の法定雇用率は，2.5 ％である。","精神障害者は，法定雇用率の対象から除外されている。","2024 年度（令和6 年度）に，障害者の雇用義務が生じるのは，従業員101 人以 上の事業主である。","週所定労働時間が10 時間以上20 時間未満の労働は認められていない。","2024 年度（令和6 年度）の事業主支援（助成金）は，2023 年度（令和5 年度）以前と同じである。"],"answer":[1],"subject":2,"explanation":"出題で指定された2024年度の民間企業の法定雇用率は、2.5パーセントです。"},{"id":15,"question":"「障害者総合支援法」のサービスに関する次の記述のうち，適切なものを1 つ選びなさい。","options":["介護給付費の支給を受けるときに，障害支援区分の認定は不要である。","短期入所は介護給付の1 つである。","地域生活支援事業は，国が実施主体である。","自立支援給付は応益負担である。","行動援護は訓練等給付の1 つである。"],"answer":[2],"subject":2,"note":" 「障害者総合支援法」とは，「障害者の日常生活及び社会生活を総合的に支援するための法律」のことである。","explanation":"短期入所は、障害者総合支援法の介護給付に含まれます。短期間の入所による介護などを提供します。"},{"id":16,"question":"障害児支援に関する次の記述のうち，適切なものを1 つ選びなさい。","options":["サービスを受けるには，療育手帳の取得が必要である。","放課後等デイサービスは，子ども・子育て支援法に基づく支援である。","障害児通所支援の利用には，障害児支援利用計画の作成は不要である。","障害児入所支援は，すべての市町村が実施主体である。","保育所等訪問支援は，保育所等を訪問し，障害のある児童が集団生活に適応できるように専門的な支援を行う。"],"answer":[5],"subject":2,"explanation":"保育所等訪問支援は、子どもが通う場所を訪問し、集団生活への適応を専門的に支援します。"},{"id":17,"question":"次の記述のうち，サービス付き高齢者向け住宅に関するものとして，正しいものを1 つ選びなさい。","options":["「高齢者住まい法」に基づく，高齢者のための住まいである。","65 歳以上の者が，市町村の措置によって入居する。","認知症高齢者を対象とした，共同生活の住居である。","食事サービスの提供が義務づけられている。","介護サービスの提供が義務づけられている。"],"answer":[1],"subject":2,"note":" 「高齢者住まい法」とは，「高齢者の居住の安定確保に関する法律」のことである。","explanation":"サービス付き高齢者向け住宅は、高齢者住まい法に基づき登録される住まいです。状況把握と生活相談が必須です。"},{"id":18,"question":"Ｃさん（60 歳，男性）は，休日に自宅で趣味の家庭菜園の作業中に脳出 血（cerebral hemorrhage）を起こして救急搬送された。特に麻痺はなく，その後，リハビリテーション病院に転院した。現在は，高次脳機能障害（higher brain dysfunction）の治療とリハビリテーションに専念している。医療費を支払うときにＣさんが利用する制度として，最も適切なものを1 つ選びなさい。","options":["介護保険制度","労働者災害補償保険制度","雇用保険制度","医療保険制度","年金制度"],"answer":[4],"subject":2,"explanation":"休日の自宅で発症した病気の治療に係る医療費には、医療保険制度を利用します。"},{"id":19,"question":"次のうち，恐怖や不安，喜びなどの情動に関わる脳の機能局在の部位として，正しいものを1 つ選びなさい。","options":["扁桃体","小脳","下垂体","海馬","視床下部"],"answer":[1],"subject":3,"explanation":"扁桃体は、恐怖や不安などの情動に深く関わる部位です。"},{"id":20,"question":"次のうち，顔の感覚に関与する脳神経として，正しいものを1 つ選びなさい。","options":["嗅神経","三叉神経","顔面神経","迷走神経","舌下神経"],"answer":[2],"subject":3,"explanation":"三叉神経は、顔の感覚や咀嚼運動に関わります。顔面神経は主に表情筋の運動を担います。"},{"id":21,"question":"次の記述のうち，鼻の構造と機能として，適切なものを1 つ選びなさい。","options":["鼻腔は前鼻道・中鼻道・後鼻道に分かれる。","鼻毛は塵や埃を除去する。","鼻腔の奥は喉頭に直接つながっている。","鼻腔には毛細血管は少ない。","嗅細胞は外鼻孔にある。"],"answer":[2],"subject":3,"explanation":"鼻毛は、吸い込む空気に含まれる塵や埃を取り除く役割を担います。"},{"id":22,"question":"次のうち，歯周病（periodontal disease）の症状として，適切なものを1 つ選びなさい。","options":["歯のくぼみの形成","歯の硬組織の軟化","歯髄の炎症・疼痛","歯のエナメル質の侵蝕","歯周ポケットの形成"],"answer":[5],"subject":3,"explanation":"歯周病では、歯と歯肉の間の溝が深くなり、歯周ポケットが形成されます。"},{"id":23,"question":"Ａさん（78 歳，女性）は，友人から口臭を指摘されて悩んでいる。また，食事をするときに，「水分と一緒に食べないと飲み込みにくい」とも話している。Ａさんに歯の欠損，麻痺はなく，ストレスの訴えもない。次のうち，Ａさんのからだの中で，機能低下が考えられるものとして，最も適切なものを1 つ選びなさい。","options":["咀嚼","蠕動運動","嗅覚","唾液分泌","胃液分泌"],"answer":[4],"subject":3,"explanation":"唾液が減ると、口の中を清潔に保つ働きが弱まり、口臭や飲み込みにくさにつながります。"},{"id":24,"question":"皮膚の構造に関する次の記述のうち，最も適切なものを1 つ選びなさい。","options":["表皮の厚さは平均2.0 mm である。","真皮には角質層がある。","外界と接する組織は表皮である。","皮脂腺は皮下組織にある。","表皮の最表面は基底層である。"],"answer":[3],"subject":3,"explanation":"皮膚の最も外側は表皮です。その表面には角質層があり、外からの刺激などを防ぎます。"},{"id":25,"question":"次のうち，高齢者が嗜好や温度覚の低下によって高温浴を希望した場合に，説明すべき高温浴の特徴として，最も適切なものを1 つ選びなさい。","options":["血圧の上昇","腸蠕動の促進","腎機能の促進","副交感神経の亢進","心機能の抑制"],"answer":[1],"subject":3,"explanation":"高温の湯は交感神経を刺激し、血圧や心拍数を上げやすくなります。高齢者では特に注意が必要です。"},{"id":26,"question":"次のうち，食物の栄養素の大部分を吸収する部位として，正しいものを1 つ選びなさい。","options":["胃","小腸","直腸","横行結腸","Ｓ状結腸"],"answer":[2],"subject":3,"explanation":"食物の栄養素の大部分は、小腸で吸収されます。小腸の広い表面積が吸収を助けます。"},{"id":27,"question":"次の記述のうち，レム睡眠に関するものとして，最も適切なものを1 つ選びなさい。","options":["記憶を整理し，定着させる。","脳を休息させる。","入眠初期に出現する。","成長ホルモンの分泌を促す。","深い眠りの状態である。"],"answer":[1],"subject":3,"explanation":"レム睡眠は、記憶の整理や定着に関わります。深い眠りはノンレム睡眠です。"},{"id":28,"question":"Ｂさん（76 歳，男性）は，この数週間，日中に，「眠い」と訴えている。Ｂさんは毎日15 時にコーヒー1 杯を飲み，たばこを1 本吸い，21 時に就寝する。夜間の睡眠状態を数日間観察すると，睡眠中にぴくぴくと下肢が動いていることがたびたびあった。起床後，手足に異常を感じるかをＢさんに確認したが，「特にない」とのことだった。次のうち，Ｂさんの睡眠障害の原因として，最も適切なものを1 つ選びなさい。","options":["ニコチン摂取","レム睡眠行動障害","レストレスレッグス症候群","カフェイン摂取","周期性四肢運動障害"],"answer":[5],"subject":3,"explanation":"睡眠中に手足が周期的に動き、眠りを妨げるのが周期性四肢運動障害です。日中の眠気につながります。"},{"id":29,"question":"次のうち，呼吸中枢がある部位として，正しいものを1 つ選びなさい。","options":["大脳","中脳","小脳","延髄","脊髄"],"answer":[4],"subject":3,"explanation":"延髄には呼吸を調節する中枢があり、生命維持に重要な働きをしています。"},{"id":30,"question":"次のうち，脳の機能停止を示す徴候に該当するものとして，適切なものを1 つ選びなさい。","options":["呼吸不全","溢流性尿失禁","心停止","蠕動運動の減弱","瞳孔散大・対光反射消失"],"answer":[5],"subject":3,"explanation":"瞳孔の散大や対光反射の消失は、脳の機能停止を示す徴候です。これだけで脳死を判定するものではありません。"},{"id":31,"question":"次の記述のうち，子どもの標準的な成長として，適切なものを1 つ選びなさい。","options":["1 歳半から2 歳ごろに，ハイハイをして移動できるようになる。","生後9 か月から1 歳ごろに，指をさして自分の関心や欲求を他者に伝えられるようになる。","子どもが使う言葉が急に増える語彙爆発は，5 歳を過ぎたころに生じる。","人見知りの反応は，2 歳を過ぎたころに生じる。","イヤイヤをしてすぐに泣く行動は，第二反抗期に生じる。"],"answer":[2],"subject":4,"explanation":"指差しは、自分の関心や欲求を他者に伝える行動です。乳児期の後半から見られるようになります。"},{"id":32,"question":"次の記述のうち，神経性無食欲症（anorexia nervosa）に関するものとして，最も適切なものを1 つ選びなさい。","options":["活動性が高まる。","学童期に最も生じやすい。","太ることへの恐怖はみられない。","低体重の深刻さを理解している。","多くが男性である。"],"answer":[1],"subject":4,"explanation":"神経性無食欲症では、体重が低下していても活動性が高まる場合があります。低体重の深刻さを認識しにくいこともあります。"},{"id":33,"question":"Ａさん（73 歳，男性）は，会社の役員として勤めていたが，3 年前に退職した。地域の老人クラブへの入会を勧められたが拒否している。毎年，敬老の日に記念品が配布されても，不快感を示して受け取らない。退職後も会社の状況を気にしていて，後輩とときどき連絡をとっている。Ａさんは，身体が衰えることに強い不安を感じて，筋力トレーニングを毎日行っている。会社の後輩から，「いつも若々しいですね」と言われることに喜びを感じている。ライチャード（Reichard, S.）による，引退後の男性の5 つの適応タイプのうち，Ａさんに相当するものとして，適切なものを1 つ選びなさい。","options":["外罰（憤慨）型","内罰（自責）型","円熟（成熟）型","自己防衛（装甲）型","ロッキングチェアー（安楽椅子）型"],"answer":[4],"subject":4,"explanation":"自己防衛型は、老いを認めまいとして活動を続け、若さを保とうとするタイプです。"},{"id":34,"question":"次の記述のうち，結晶性知能に関する説明として，最も適切なものを1 つ選びなさい。","options":["感覚や運動に基づく知能である。","過去に得た知識を活用して問題を解決する能力である。","40～50 歳で急激に低下する。","知識や文化の影響よりも，生理的な老化の影響を受けやすい。","その場で新しい問題を解決する能力である。"],"answer":[2],"subject":4,"explanation":"結晶性知能は、経験によって得た知識や技能を活用する能力です。加齢の影響を比較的受けにくい特徴があります。"},{"id":35,"question":"次の記述のうち，加齢に伴う感覚機能の変化として，最も適切なものを 1 つ選びなさい。","options":["皮膚感覚が敏感になる。","高音域の聴力が高まる。","暗順応の時間が延長する。","味覚が敏感になる。","嗅覚が敏感になる。"],"answer":[3],"subject":4,"explanation":"加齢により暗順応に時間がかかり、明るい場所から暗い場所へ移ると見えにくくなります。"},{"id":36,"question":"Ｂさん（74 歳，女性）は，地方で一人暮らしをしている。持病はなく，認 知機能の異常もない。ダンスサークルに通い，近所との付き合いも良好で，今の暮らしに満足している。最近，白髪が増え，友人との死別もあり，年をとったと感じている。ある日，一人息子（50 歳，未婚）から，東京で一緒に住むことを提案された。Ｂさんは，「ここには知り合いがいるが，東京には誰もいない。ここが一番いい」と言った。すると息子は，Ｂさんに，「年をとると頑固になる。あと数年したら認知症（dementia）になるかもしれないので，自分と一緒に暮らすべきだ」と言った。次のうち，Ｂさんに関する記述として，最も適切なものを1 つ選びなさい。","options":["Ｂさんには，老性自覚はみられない。","Ｂさんには，友人との死別による悲嘆がみられる。","Ｂさんは，今，住んでいる環境や生活に適応できていない。","Ｂさんには，エイジズム（ageism）の考え方がみられる。","Ｂさんには，住み慣れた環境や仲間を喪失することへの不安がみられる。"],"answer":[5],"subject":4,"explanation":"本人は現在の生活に満足しています。転居で住み慣れた環境や仲間とのつながりを失うことを心配しています。"},{"id":37,"question":"次の記述のうち，サクセスフル・エイジング（successful aging）として，適切なものを1 つ選びなさい。","options":["長生きすることが，最大の目的である。","一人暮らしで，周囲の人と交流をしないようにしている。","膝に痛みがあるので，一日中ベッド上で過ごすようにしている。","難聴があるので，補聴器をつけてパソコン教室に通い始めた。","歌を上手に歌えなくなったので，カラオケに誘われても行かないようにしている。"],"answer":[4],"subject":4,"explanation":"心身の変化に対応しながら、自分らしく活動や交流を続けることは、サクセスフル・エイジングにつながります。"},{"id":38,"question":"次のうち，老年症候群に直接関わる疾患として，最も適切なものを1 つ選びなさい。","options":["高血圧症（hypertension）","糖尿病（diabetes mellitus）","骨粗鬆症（osteoporosis）","心筋梗塞（myocardial infarction）","脂質異常症（dyslipidemia）"],"answer":[3],"subject":4,"explanation":"骨粗鬆症は骨折の危険を高め、移動能力の低下などにつながるため、老年症候群と密接に関係します。"},{"id":39,"question":"次の記述のうち，2019 年（令和元年）の認知症施策推進大綱に関する説明として，最も適切なものを1 つ選びなさい。","options":["「共生」と「予防」を車の両輪として施策を推進していく。","「予防」とは，「認知症（dementia）にならない」という意味である。","「認知症高齢者等にやさしい地域づくり」を推進する7 つの柱が示された。","「普及啓発・本人発信支援」として，家族が積極的に本人の意思を代弁することが示された。","策定後は，毎年施策の進捗を確認することが示された。"],"answer":[1],"subject":5,"explanation":"認知症施策推進大綱は、共生と予防を両輪としています。予防は、発症を遅らせたり進行を緩やかにしたりする意味です。"},{"id":40,"question":"Ａさん（84 歳，女性，要介護3 ）は，アルツハイマー型認知症（dementia of the Alzheimer’s type）で，介護老人福祉施設に入所している。赤ちゃんの人形を持っていて，「はなちゃん」と呼んで話しかけている。昼食のため，介護福祉職が居室を訪問すると，Ａさんは不安そうな顔で，「はなちゃんがいなくなった。どこへ連れて行ったの？返して」と大声を出した。人形はＡさんのロッカーの上に置かれていた。Ａさんに対する介護福祉職の最初の声かけとして，最も適切なものを1 つ選びなさい。","options":["「私を疑っているんですか」","「置いた場所を忘れたんですか」","「心配ですね，一緒に探しませんか」","「ご飯を食べてから探してはどうですか」","「ロッカーの上にあるのが見えないんですか」"],"answer":[3],"subject":5,"explanation":"まず本人の不安に共感し、一緒に探す姿勢を示します。忘れたことを責めたり、話を否定したりしません。"},{"id":41,"question":"認知症（dementia）の高齢者にみられる，せん妄に関する記述として，適切なものを1 つ選びなさい。","options":["覚醒レベルが重度に低下した状態である。","症状の変動が少ないことが特徴である。","夜間よりも日中に生じやすいことが特徴である。","認知機能障害がみられることはまれである。","関与する因子を特定することが重要である。"],"answer":[5],"subject":5,"explanation":"せん妄には、病気、薬剤、脱水、環境の変化などが関わります。原因となる要因を探して対応することが重要です。"},{"id":42,"question":"次の記述のうち，アルツハイマー型認知症（dementia of the Alzheimer’s type）の特徴として，適切なものを1 つ選びなさい。","options":["近時記憶（新しい記憶）の障害は，初期から始まる。","特徴的な症状として幻視がある。","脳にアミロイドβが沈着し始めると，すぐに発症する。","歩行障害が多く現れるのは，初期の段階である。","嚥下障害が多く現れるのは，初期の段階である。"],"answer":[1],"subject":5,"explanation":"アルツハイマー型認知症では、新しい出来事を覚えにくくなる近時記憶の障害が、初期から見られます。"},{"id":43,"question":"次のうち，認知症（dementia）のリスクを高める要因として，最も適切なものを1 つ選びなさい。","options":["身体活動","不飽和脂肪酸の摂取","歯がなくなることによる咀嚼機能の低下","難聴による補聴器の使用","ボランティア活動"],"answer":[3],"subject":5,"explanation":"歯の喪失による咀嚼機能の低下は、認知症のリスクと関係します。口腔の健康を保つことが大切です。"},{"id":44,"question":"次のうち，全般的な認知機能を評価する尺度であり，30 点満点で20 点以 下を認知症の目安とするものとして，正しいものを1 つ選びなさい。","options":["バーセルインデックス（Barthel Index）","改訂長谷川式認知症スケール（HDS-R）","ＦＡＳＴ（Functional Assessment Staging）","認知症高齢者の日常生活自立度判定基準","臨床的認知症尺度（ＣＤＲ：Clinical Dementia Rating）"],"answer":[2],"subject":5,"explanation":"改訂長谷川式認知症スケールは三十点満点で、二十点以下が認知症を疑う目安です。診断は総合的に行います。"},{"id":45,"question":"次の記述のうち，「認知症（dementia）の人の日常生活・社会生活における意思決定支援ガイドライン」（2018 年（平成30 年）（厚生労働省））で示されている，意思決定支援として，最も適切なものを1 つ選びなさい。","options":["認知症（dementia）の人の家族の意思を支援することである。","意思決定支援者は特定の職種に限定される。","一度，意思決定したら，最後まで同じ内容で支援する。","看取りの場面になってから支援を開始する。","身振りや表情の変化も意思表示として読み取る努力を最大限に行う。"],"answer":[5],"subject":5,"explanation":"言葉だけでなく、表情や身振りにも本人の意思が表れます。それを読み取る努力が求められます。"},{"id":46,"question":"次の記述のうち，回想法として，最も適切なものを1 つ選びなさい。","options":["肩や背中から優しくゆっくりと触れる。","共感を通して，認知症（dementia）の人が体験している現実を受け入れる。","見当識を高めるために，時間や場所，現在の状況を説明する。","昔の写真や音楽を活用して，記憶を活性化する。","残存能力を活用し，共同作業を通して仲間をつくる。"],"answer":[4],"subject":5,"explanation":"回想法は、懐かしい写真や音楽などを手がかりに過去の経験を語り、記憶や交流を促す方法です。"},{"id":47,"question":"次の記述のうち，認知症疾患医療センターの説明として，適切なものを1 つ選びなさい。","options":["事業の実施主体は，市町村である。","都道府県ごとに，1 か所の設置が義務づけられている。","認知症（dementia）の鑑別診断を行う。","主に認知症（dementia）が進行した人の入院治療を行う。","介護保険法に定められている。"],"answer":[3],"subject":5,"explanation":"認知症疾患医療センターは、認知症の鑑別診断や専門的な相談、地域との連携などを行います。"},{"id":48,"question":"Ｂさん（87 歳，男性）は，一人暮らしである。玄関前で，脱水で倒れているところを発見され，救急搬送された。入院中，認知症（dementia）の疑いがある行動が見られた。Ｂさんは，「自宅で暮らしたい」と強く希望していた。退院後，Ｂさんは外出して自宅に戻れなくなることがあった。近所の人たちが，Ｂさんの生活を心配して，地域包括支援センターに相談した結果，認知症初期集中支援チームが編成された。次の記述のうち，Ｂさんに対して認知症初期集中支援チームが行う支援として，最も適切なものを1 つ選びなさい。","options":["金銭管理を行う。","支援方針を検討する。","居宅サービス計画書を作成する。","介護保険サービスを契約する。","法定後見を行う。"],"answer":[2],"subject":5,"explanation":"認知症初期集中支援チームは、本人や家族の状況を把握し、支援方針を検討して適切な支援につなげます。"},{"id":49,"question":"次のうち，ＩＣＦ（International Classification of Functioning, Disability and Health：国際生活機能分類）の社会（人生）レベルに該当するものとして，正しいものを1 つ選びなさい。","options":["心身機能・身体構造","活動","参加","機能障害","活動制限"],"answer":[3],"subject":6,"explanation":"国際生活機能分類の参加は、生活や社会の場面に関わることです。社会・人生の水準に位置付けられます。"},{"id":50,"question":"次の記述のうち，障害者のエンパワメントに関するものとして，最も適切なものを1 つ選びなさい。","options":["障害のある人が障害のない人と同等に生活し，活動する社会を目指す。","専門職が主導し，障害がある人は受動的に支援を受ける。","障害のある人が自らの能力や長所に気づき，課題に対応する。","障害のある人が，主体性や人権が守られないことに耐える。","障害のある人が，医学的リハビリテーションを受ける。"],"answer":[3],"subject":6,"explanation":"エンパワメントは、本人が自分の力や長所を認識し、主体的に課題へ対応できるように支える考え方です。"},{"id":51,"question":"次のうち，クローン病（Crohn disease）にみられる特徴的な症状として，最も適切なものを1 つ選びなさい。","options":["視力低下","栄養障害","咳嗽","運動失調","関節痛"],"answer":[2],"subject":6,"explanation":"クローン病では、消化管の炎症などによって栄養の吸収が障害され、栄養障害が生じることがあります。"},{"id":52,"question":"次の記述のうち，遂行機能障害の特徴として，最も適切なものを1 つ選びなさい。","options":["些細なことですぐに興奮して怒鳴る。","新しい知識を覚えることが困難である。","ぼんやりして周囲に注意を向け続けることが困難である。","行動を計画して実行することが困難である。","言葉の表出や理解が困難である。"],"answer":[4],"subject":6,"explanation":"遂行機能障害では、目標に向けて計画を立て、順序よく実行することが難しくなります。"},{"id":53,"question":"視覚障害の特徴と視覚障害者の生活支援に関する次の記述のうち，最も適切なものを1 つ選びなさい。","options":["ロービジョンは，視覚情報をまったく得られない状態である。","中途視覚障害者は，先天性の障害に比べて障害を受容しやすい。","白杖には，視覚に障害があることを周囲に知らせる役目がある。","視覚障害を補うために，ペットの犬と一緒に外出する。","視覚障害者は，ガイドヘルパーの利用はできない。"],"answer":[3],"subject":6,"explanation":"白杖には、障害物や路面を確認する役割に加え、視覚障害があることを周囲に知らせる役割があります。"},{"id":54,"question":"Ａさん（76 歳，女性）は，パーキンソン病（Parkinson disease）と診断され，日常生活動作（Activities of Daily Living：ＡＤＬ）は，車いすやベッド上で全介助である。最近，食事に時間がかかって嫌がるようになり，かすれ声が目立つようになった。次のうち，現在のＡさんに対して介護福祉職が留意すべきこととして，最も適切なものを1 つ選びなさい。","options":["安静時振戦","筋固縮","仮面様顔貌","誤嚥","便秘"],"answer":[4],"subject":6,"explanation":"食事に時間がかかり、声のかすれもあるため、嚥下機能の低下や誤嚥に注意し、医療職と連携します。"},{"id":55,"question":"聴覚障害者の特徴や支援の方法に関する次の記述のうち，最も適切なものを1 つ選びなさい。","options":["要約筆記によって意思疎通を補う。","軽度の聴覚障害を「ろう」という。","フラッシュベルは周囲の音を増幅させて伝える。","手話は意思の伝達に役立たない。","両耳の聴力レベルが40 dB で身体障害者手帳が交付される。"],"answer":[1],"subject":6,"explanation":"要約筆記は、話の内容を文字で伝える支援です。聴覚障害のある人の意思疎通を補います。"},{"id":56,"question":"Ｂさん（24 歳，男性）は，母親と二人暮らしで，小学生のときに注意欠陥多動性障害と疑われていた。Ｂさんは，最近になって昼夜を問わずゲームを続け，朝起きられずにアルバイトを無断で休むことが増えた。次のうち，Ｂさんの母親が相談する機関として，最も適切なものを1 つ選びなさい。","options":["ハローワーク（公共職業安定所）","難病情報センター","認知症カフェ","放課後等デイサービス","発達障害者支援センター"],"answer":[5],"subject":6,"explanation":"発達障害者支援センターは、本人や家族の相談に応じ、生活や就労などを支援します。"},{"id":57,"question":"次の記述のうち，「障害者差別解消法」の合理的配慮に沿った対応として，最も適切なものを1 つ選びなさい。","options":["車いすの身体障害者から，陳列棚にある商品を見せてほしいと言われたが，口頭で商品を説明した。","聴覚障害者の手話による注文がわからなかったので，最も人気のあるメニューを出した。","盲導犬を連れた視覚障害者が来店したが，動物嫌いの客から苦情を言われると思い，犬は店の中に入れないように頼んだ。","役所に相談に来た精神障害者から，多くの人の中だと不安になると言われたため，帰宅してもらった。","知的障害者から申し出があったので，会議に参加するための資料をわかりやすい言葉に直して，事前に口頭で説明した。"],"answer":[5],"subject":6,"note":" 「障害者差別解消法」とは，「障害を理由とする差別の解消の推進に関する法律」のことである。","explanation":"本人の困難に応じて資料を分かりやすくし、事前に説明することは、会議への参加を支える合理的配慮です。"},{"id":58,"question":"レスパイトケアの望ましいあり方に関する記述として，最も適切なものを1 つ選びなさい。","options":["障害者はサービスを利用せずに生活するべきである。","利用中，家族は自宅で休まなくてはならない。","家族が障害者を預けて旅行に行くことは認められない。","家族の休息が目的なので，障害者の施設利用は宿泊に限定される。","家族が休息している間も，障害者が自分らしく過ごせるようにする。"],"answer":[5],"subject":6,"explanation":"レスパイトケアは家族の休息を支えると同時に、本人が安心して自分らしく過ごせることも大切にします。"},{"id":59,"question":"次の記述のうち，成人に対する救急蘇生法での胸骨圧迫の方法として，最も適切なものを1 つ選びなさい。","options":["呼吸が確認できない場合は，すぐに圧迫を始める。","圧迫する部位は，胸骨の左側である。","実施者の両手を重ねて，指先で圧迫する。","圧迫の深さは，胸が10 cm 沈むようにする。","1 分間に60 回を目安に圧迫する。"],"answer":[1],"subject":7,"explanation":"反応がなく普段どおりの呼吸が確認できない場合は、助けを呼び、速やかに胸骨圧迫を開始します。"},{"id":60,"question":"次の記述のうち，痰を喀出する仕組みに関するものとして，正しいものを1 つ選びなさい。","options":["呼吸器官の内部は乾燥した状態になっている。","気管の内部の表面には絨毛があり，分泌物の侵入を防いでいる。","分泌物は，咽頭で吸収される。","痰は，咳や咳払いによって排出される。","咳は，下垂体にある咳中枢によっておこる反射運動である。"],"answer":[4],"subject":7,"explanation":"痰は、咳や咳払いによって気道から外へ出されます。咳は気道を守るための反射でもあります。"},{"id":61,"question":"次の記述のうち，介護福祉士が行う口腔内の喀痰吸引の方法として，最も適切なものを1 つ選びなさい。","options":["吸引圧は，利用者の体調によって介護福祉士が決める。","吸引圧をかけた状態で，吸引チューブを挿入する。","口蓋垂まで吸引チューブを挿入する。","吸引チューブを回転させながら痰を吸引する。","吸引後は洗浄水を吸引し，清浄綿でチューブを拭く。"],"answer":[4],"subject":7,"explanation":"吸引時は、チューブを回転させながら痰を吸引します。定められた手順と医療職の指示に従い、粘膜への負担を防ぎます。"},{"id":62,"question":"次の記述のうち，消化器症状の説明として，正しいものを1 つ選びなさい。","options":["腹部膨満感は，腹部が張る感覚のことである。","しゃっくり（吃逆）は，胸膜の刺激で起こる現象である。","胸やけは，飲食物による食道の熱傷のことである。","げっぷ（噯気）は，咽頭にたまった空気が排出されることである。","嘔気は，胃や腸の内容物が，食道を逆流して口外に吐き出されることである。"],"answer":[1],"subject":7,"explanation":"腹部膨満感は、お腹が張る感覚です。嘔気は吐き気であり、実際に吐き出す嘔吐とは異なります。"},{"id":63,"question":"Ａさん（80 歳，女性）は，脳梗塞（cerebral infarction）の後遺症で左片麻痺があり，介護老人保健施設に入所して在宅復帰に向けた訓練をしている。嚥下障害もあるため，経鼻経管栄養による栄養摂取をしているが，経口摂取できないことでイライラしてチューブを抜去したことがある。医師からは一時的な治療であると説明を受けて同意していた。経管栄養中に介護福祉士が訪室すると，チューブを触りながら，「自分の口から食べたいから，このチューブを抜いてほしい。見た目も良くない」と訴えがあった。看護師に連絡し，チューブが抜けていないことを確認してもらった。このときのＡさんへの介護福祉士の対応として，最も適切なものを1 つ選びなさい。","options":["チューブを抜かないようにＡさんの右手を固定する。","経管栄養が早く終わるように滴下速度を調節する。","医師や看護師にＡさんの思いを伝える。","Ａさんに胃ろうの造設を提案する。","Ａさんに経口摂取を提案する。"],"answer":[3],"subject":7,"explanation":"本人の食べたい気持ちや見た目への思いを医師・看護師に伝え、対応を一緒に考えます。"},{"id":64,"question":"介護福祉に関連する法律に関する次の記述のうち，適切なものを1 つ選びなさい。","options":["「高齢者虐待防止法」は，福祉六法の1 つである。","「障害者総合支援法」は，障害者基本計画の策定を義務づけている。","社会福祉法によって，社会福祉士の定義が規定されている。","介護保険法は，国民の共同連帯の理念に基づいて介護保険制度を設けている。","医師法によって，介護福祉の業務の一部として医行為が認められている。"],"answer":[4],"subject":8,"note":"1 「高齢者虐待防止法」とは，「高齢者虐待の防止，高齢者の養護者に対する支 援等に関する法律」のことである。2 「障害者総合支援法」とは，「障害者の日常生活及び社会生活を総合的に支 援するための法律」のことである。","explanation":"介護保険法は、国民の共同連帯の理念に基づき、介護を社会全体で支える仕組みを設けています。"},{"id":65,"question":"社会福祉士及び介護福祉士法に関する次の記述のうち，適切なものを1 つ選びなさい。","options":["資質向上のために，5 年に1 回，資格更新研修を受けなければならない。","社会福祉士の業務を介護福祉士が行うことは禁じられている。","介護福祉士の信用を傷つける行為をしてはならない。","介護福祉士は，その業を辞した後は秘密保持義務が解除される。","介護福祉士国家試験に合格した日から，介護福祉士を名乗ることができる。"],"answer":[3],"subject":8,"explanation":"介護福祉士には信用失墜行為の禁止が定められています。秘密保持義務は仕事を辞めた後も続きます。"},{"id":66,"question":"Ａさん（75 歳，女性）は，3 か月前に，血管性認知症（vascular dementia）を発症し，軽度の左片麻痺で杖歩行となり，要介護3 と認定された。Ａさんは，料理が大好きで，娘と一緒に食事を作ることを楽しみに生活していた。1 か月前から認知症（dementia）が進行し，ユニット型介護老人福祉施設に入所した。Ａさんは夕方になると，「ご飯の支度をしないといけないから帰ります」と言いながら，興奮して歩き回る様子がみられるようになった。Ａさんへの介護福祉職の対応として，最も適切なものを1 つ選びなさい。","options":["居室に鍵をかけて，自室で過ごしてもらう。","介護福祉職と一緒に，夕食の準備をしてもらう。","杖を預かり，低めの丸椅子に座ってもらう。","介護福祉職の判断で，向精神薬を服用してもらう。","ここがＡさんの自宅であることを，理解してもらう。"],"answer":[2],"subject":8,"explanation":"料理を大切にしてきた生活歴を生かし、夕食の準備に一緒に取り組むことで、役割や安心感につなげます。"},{"id":67,"question":"ＩＣＦ（International Classification of Functioning, Disability and Health： 国際生活機能分類）における「参加」と「活動」の2 つが関連した，認知症の人の支援に関する記述として，最も適切なものを1 つ選びなさい。","options":["若年性アルツハイマー型認知症（dementia of the Alzheimer’s type with early onset）があり，治療している。","認知症カフェに通い，体操をしている。","近所に住む長男が，買物を代行している。","自宅にある広い庭を，バリアフリー化している。","見当識障害があり，ＧＰＳ装置を身に着けている。"],"answer":[2],"subject":8,"explanation":"認知症カフェへの参加は社会との関わり、体操は具体的な活動です。参加と活動が結び付いています。"},{"id":68,"question":"次の記述のうち，介護保険制度における訪問介護員（ホームヘルパー）が行うサービス内容として，最も適切なものを1 つ選びなさい。","options":["利用者が大切にしている庭の植木に，水やりをする。","利用者が長年飼っている猫のペットフードを，購入してくる。","掃き掃除をする習慣のある利用者と一緒に，寝室をほうきで掃除する。","利用者と一緒に，近所のラーメン屋に行く。","利用者のクレジットカードを預かって，買物を代行する。"],"answer":[3],"subject":8,"explanation":"本人と一緒に日常生活に必要な掃除をすることは、残された力を生かす訪問介護の支援です。"},{"id":69,"question":"次の記述のうち，介護従事者を守る法制度として，正しいものを1 つ選びなさい。","options":["労働安全衛生法では，年に1 回以上の健康診断を行うことを義務づけている。","労働者災害補償保険法では，労働時間，賃金，休暇などの労働条件を定めている。","環境基本法では，快適な職場環境の形成の促進を定めている。","介護休業は，対象家族1 名につき，毎年93 日間を取得できる。","出生時育児休業は，子の出生後から8 週間取得できる。"],"answer":[1],"subject":8,"explanation":"労働安全衛生法では、事業者に定期健康診断の実施を義務付けています。一般には一年以内ごとに一回です。"},{"id":70,"question":"Ｂさん（68 歳，女性，要介護1 ）は，ヨーロッパで生まれ育ち，50 歳のときに日本人と結婚した。65 歳で夫と共に日本で暮らすようになったが，日本語は十分に理解できない。半年前に，脳梗塞（cerebral infarction）を起こし，利き手に麻痺があり，立ち上がりも不安定である。現在は，介護老人保健施設に入所し，在宅復帰へ向けたリハビリテーションを行っている。Ｂさんはこれまでの生活様式を守り，自宅で自分のペースで食事ができるようになりたいと希望している。次の記述のうち，Ｂさんへの介護福祉職の対応として，最も適切なものを1 つ選びなさい。","options":["入所中は母語を使わずに，日本語を話すように伝える。","居室の床に布団を敷いて，寝起きができるようにする。","自分で食事ができるように，自助具の使用状況を確認する。","ほかの利用者と同じ時間に食べ終えるように伝える。","日本の生活に合わせるように，余暇活動の内容は介護福祉職が判断する。"],"answer":[3],"subject":8,"explanation":"本人が望む食事の自立に向け、自助具を適切に使えているか確認します。文化や生活習慣も尊重します。"},{"id":71,"question":"次の記述のうち，チームアプローチに関するものとして，適切なものを1 つ選びなさい。","options":["介護福祉職が利用者のところに行って，相談，支援を行う。","障害者が，地域の資源を活用して，共生社会の実現を目指す。","複数の専門職が共通の目標に向かって協働し，課題解決に取り組む。","利用者に代わって，専門職がサービスを決定する。","当事者が集まって体験談を話し，共に支えあう。"],"answer":[3],"subject":8,"explanation":"チームアプローチは、複数の専門職が共通の目標を持ち、それぞれの専門性を生かして協働する方法です。"},{"id":72,"question":"介護保険施設における防災対策に関する次の記述のうち，最も適切なものを1 つ選びなさい。","options":["介護福祉士は，災害派遣福祉チームで活動することが義務づけられている。","介護福祉士は，防災スキル向上のために，防災士の資格取得が義務づけられている。","災害対策基本法に基づき，個別避難計画の作成が施設長に義務づけられている。","一般的に，飲料水と非常食は1 日分の備蓄が義務づけられている。","災害時等に備えて，業務継続計画（ＢＣＰ：Business Continuity Plan）の策定が義務づけられている。"],"answer":[5],"subject":8,"explanation":"業務継続計画は、災害や感染症などの発生時にも、必要なサービスを継続・再開するための計画です。"},{"id":73,"question":"次のうち，結核（tuberculosis）の予防対策に該当するものとして，最も適切なものを1 つ選びなさい。","options":["便座のアルコール消毒","肺炎球菌ワクチンの接種","紫外線を避けた生活","年に1 回の胸部Ｘ線検査","50℃以上の温水によるリネン類の洗濯"],"answer":[4],"subject":8,"explanation":"胸部エックス線検査は、結核の早期発見に役立ちます。早期に発見し治療へつなげることが感染拡大の防止になります。"},{"id":74,"question":"次の記述のうち，利用者とのコミュニケーションの場面で用いる要約の技法として，適切なものを1 つ選びなさい。","options":["開かれた質問をして，利用者の気持ちを明らかにした。","共感しながら話を聞き，利用者の気持ちを受け止めた。","話の途中でうなずき，利用者の気持ちに同意した。","話の内容を総合的にまとめて返し，利用者の気持ちを整理した。","自己覚知を図り，利用者との人間関係の形成に努めた。"],"answer":[4],"subject":9,"explanation":"要約は、相手の話を整理して短くまとめ、返す技法です。気持ちや内容の確認にも役立ちます。"},{"id":75,"question":"次の記述のうち，利用者と家族の意向が異なるとき，家族とのコミュニケーションにおいて介護福祉職が留意すべき点として，適切なものを1 つ選びなさい。","options":["家族に支援方針を決めてもらう。","家族を通して利用者の意向を聴き取る。","家族と話す機会を別に設ける。","家族にカウンセリングを行うことを意識する。","家族を説得する。"],"answer":[3],"subject":9,"explanation":"家族だけと話す機会を設けると、本人の前では話しにくい気持ちや事情を聴き取りやすくなります。"},{"id":76,"question":"Ａさん（80 歳，男性，要介護3 ）は，介護老人福祉施設に入所している。アルツハイマー型認知症（dementia of the Alzheimer’s type）が進行している。ある日の昼食時，介護福祉職がＡさんに配膳すると，「お金はこれしかありません。足りますか」と小さくたたまれたティッシュペーパーを渡してきた。このときのＡさんに対する介護福祉職の対応として，最も適切なものを1 つ選びなさい。","options":["ティッシュペーパーは，口の周りが汚れたら拭くものだと伝える。","ティッシュペーパーが不足しているサインとして受け止める。","飲食店での会計の場面であると認識して対応する。","食事に集中するように促す。","小遣いの増額を家族に相談する。"],"answer":[3],"subject":9,"explanation":"本人は食事の代金を支払おうとしています。その人が認識している場面を理解し、安心できる対応をします。"},{"id":77,"question":"構音障害のあるＢさんは，現在発語訓練を実施中である。ある日，介護 福祉職に対して，「おあんで，あつがおごれた」と訴えた。介護福祉職は，Ｂさんの発語をうまく聞き取れず，「もう一度，言ってください」と伝えた。Ｂさんは，自 身の発語で会話を続けようとしているが，介護福祉職には，その内容を十分に理 解することができなかった。このときの，Ｂさんに対する介護福祉職の判断として，最も適切なものを1 つ選びなさい。","options":["Ｂさんは言葉の意味の理解に支障があるため，会話の継続は困難である。","発音が苦手なため，短い言葉でゆっくり話してもらう必要がある。","話す意欲があるため，開かれた質問が有効である。","発語訓練の効果がみられないため，訓練を中止する必要がある。","Ｂさんの言葉が聞き取れないため，会話を中断する必要がある。"],"answer":[2],"subject":9,"explanation":"構音障害は発音の障害です。短い言葉でゆっくり話してもらい、伝えようとする気持ちを支えます。"},{"id":78,"question":"Ｃさん（55 歳，男性）は，知的障害がある。3 か月前に，施設から居宅での一人暮らしに移行し，現在は，居宅介護（ホームヘルプサービス）を利用しながら生活している。ある日，Ｃさんが，「ゴミ，分けて捨てるの，難しいよ」と言うので，室内に分別収集の説明書を貼って，カレンダーに収集日を書くことにした。そして，介護福祉職は，「この説明書とカレンダーを見て，捨てるといいですよ」とＣさんに伝えた。その後，Ｃさんは努力していたが，分別できなかったゴミが少しずつ増えていった。次のうち，Ｃさんにかける介護福祉職の最初の言葉として，最も適切なものを 1 つ選びなさい。","options":["「ゴミでいっぱいになる前に，適切に捨てられるようになりましょう」","「説明書とカレンダーをよく見てください」","「ゴミが増えてきて，気持ち悪いですね」","「がんばっていれば，上手にできるようになりますよ」","「ゴミ捨ては難しいですよね。できることをいっしょに考えましょう」"],"answer":[5],"subject":9,"explanation":"まず難しさや努力を受け止めます。その上で、本人ができる具体的な方法を一緒に考えます。"},{"id":79,"question":"介護保険サービスにおける記録に関する次の記述のうち，最も適切なものを1 つ選びなさい。","options":["記録に含まれないものとして食事チェック表がある。","介護記録は介護福祉職の意見を中心に記録する。","調査・研究目的で記録を利用することは避ける。","主観的情報と客観的事実は区別しないで記録する。","利用者は記録の閲覧を請求することができる。"],"answer":[5],"subject":9,"explanation":"利用者は、自分に関する記録の閲覧を求めることができます。記録は事実と推測を分け、適切に管理します。"},{"id":80,"question":"高齢者に配慮した居室環境に関する次の記述のうち，最も適切なものを 1 つ選びなさい。","options":["夏は高齢者が発汗してから冷房を使用する。","暖房を使用するときは除湿機を併用する。","冷房を使用するときは換気を控える。","温度は介護福祉職の感覚で調整する。","冬はトイレの温度を居室の温度に近づける。"],"answer":[5],"subject":10,"explanation":"居室とトイレの温度差を小さくし、急な温度変化による身体への負担を減らします。"},{"id":81,"question":"次の記述のうち，介護の現場において，レクリエーション活動で実施するアイスブレーキングの効果として，最も適切なものを1 つ選びなさい。","options":["参加者の緊張感を軽減することができる。","活動内容を毎回固定して実施することができる。","介護福祉職の負担を軽減することができる。","利用者の参加を義務づけることができる。","勝敗を楽しむことができる。"],"answer":[1],"subject":10,"explanation":"アイスブレーキングは、参加者の緊張を和らげ、交流しやすい雰囲気をつくるために行います。"},{"id":82,"question":"次の記述のうち，介護福祉職が行う身じたく・整容の介護として，最も適切なものを1 つ選びなさい。","options":["ベッド上で行う口腔ケアは，ガーグルベースンを用いる。","総義歯の洗浄は，歯みがき剤を用いる。","耳垢の除去は，ピンセットを用いる。","ベッド上で行う洗顔は，冷水に浸して絞ったタオルを用いる。","浴室で行う洗髪は，ドライシャンプーを用いる。"],"answer":[1],"subject":10,"explanation":"ガーグルベースンは、うがいの水などを受ける容器です。ベッド上での口腔ケアに利用します。"},{"id":83,"question":"次の記述のうち，障害のある人への事故防止の対応として，最も適切なものを1 つ選びなさい。","options":["パーキンソン病（Parkinson disease）の人には，低めのベッドを用意する。","認知症（dementia）の人には，ガスコンロを用意する。","在宅酸素療法中の人のそばでは，喫煙しない。","視覚障害のある人には，洗体用に頭受け台を用意する。","聴覚障害のある人には，補高便座を用意する。"],"answer":[3],"subject":10,"explanation":"酸素は燃焼を強く助けます。在宅酸素療法中の人の周囲では、喫煙などの火気を避けます。"},{"id":84,"question":"次のうち，右片麻痺の利用者が多点杖を使用して3 動作歩行を開始するときに，介護福祉職が行う説明として，適切なものを1 つ選びなさい。","options":["「杖，右足，左足の順で歩きましょう」","「杖，左足，右足の順で歩きましょう」","「右足，左足，杖の順で歩きましょう」","「左足，杖，右足の順で歩きましょう」","「左足，右足，杖の順で歩きましょう」"],"answer":[1],"subject":10,"explanation":"三動作歩行は、杖、麻痺のある足、麻痺のない足の順が基本です。右片麻痺では、杖、右足、左足となります。"},{"id":85,"question":"ノーリフティングケアに関する次の記述のうち，最も適切なものを1 つ選びなさい。","options":["仰臥位（背臥位）の利用者を抱え上げて，端座位にする。","仰臥位（背臥位）の利用者を手前に引きよせて，ストレッチャーに移乗する。","端座位の利用者の体幹を抱きかかえて，車いすに移乗する。","端座位の利用者にスライディングボードを使用して，車いすに移乗する。","立位が困難な端座位の利用者に回転移動盤を使用して，車いすに移乗する。"],"answer":[4],"subject":10,"explanation":"ノーリフティングケアは、人の力だけで抱え上げず、福祉用具などを活用する考え方です。"},{"id":86,"question":"次の記述のうち，左片麻痺の利用者を右側臥位から端座位にするときの介 護として，最も適切なものを1 つ選びなさい。","options":["利用者に左手でベッド柵をつかむように伝える。","利用者に右肘を支点にして上体を起こしてもらう。","利用者の右脚をベッドから下ろす。","利用者の頸部を支えて上体を起こす。","端座位の利用者の右側に立って上体を支える。"],"answer":[2],"subject":10,"explanation":"麻痺のない右肘を支点として、本人の力で上体を起こせるように支援します。"},{"id":87,"question":"口腔ケアに関する次の記述のうち，最も適切なものを1 つ選びなさい。","options":["うがいは，顔貌を整える。","歯みがきは，感染予防になる。","口腔内の乾燥は，口臭を予防する。","唾液腺マッサージは，唾液の分泌を抑える。","咀嚼機能の向上のために，タッピングを行う。"],"answer":[2],"subject":10,"explanation":"歯みがきで口腔内の細菌や汚れを減らすことは、口の中の感染や誤嚥性肺炎などの予防につながります。"},{"id":88,"question":"次の記述のうち，口腔ケアを実施するときの留意点として，最も適切なものを1 つ選びなさい。","options":["実施中は，利用者に顎を上げた姿勢をとってもらう。","総義歯は，上顎から下顎の順に外してもらう。","歯みがきの前に，うがいを行ってもらう。","歯ブラシは，大きく動かして磨いてもらう。","舌ブラシは，舌先から咽頭に向かって動かしてもらう。"],"answer":[3],"subject":10,"explanation":"歯みがき前にうがいをして、口の中の食べかすなどを取り除きます。本人のうがいの能力にも配慮します。"},{"id":89,"question":"次の記述のうち，介護が必要な人への熱中症対策のために，介護福祉職が行う水分補給の対応として，最も適切なものを1 つ選びなさい。","options":["のどが渇いてから，水分を取るように伝える。","水でむせるときは，ゼリーの提供を控える。","起床時は，水分摂取を控えるように伝える。","食事のときの水分は，一日の水分摂取量から除く。","汗の量が多いときは，塩分を含んだ飲み物を勧める。"],"answer":[5],"subject":10,"explanation":"汗が多いと、水分とともに塩分も失われます。状態に応じて塩分を含む飲み物を選びます。"},{"id":90,"question":"Ａさん（75 歳，男性）は，1 年前に前頭側頭型認知症（frontotemporal dementia）と診断され，現在は，認知症対応型共同生活介護（認知症高齢者グループホーム）に入居している。若い頃から食べることが好きである。現在，咀嚼や嚥下機能の低下はなく，スプーンを使い，自分で食べている。最近，飲み込む前に次々と食べ物を口に入れることが増えた。次の記述のうち，Ａさんの現在の状態に合わせた食事の介護として，最も適切なものを1 つ選びなさい。","options":["取っ手つきのコップを準備する。","食器に少量ずつ盛りつけて提供する。","すべての料理をテーブルの上に並べる。","大きなスプーンに変更する。","手で持って食べられる物を準備する。"],"answer":[2],"subject":10,"explanation":"食べ物を一度に詰め込まないよう、少量ずつ提供します。本人の食べる力を生かしながら安全を確保します。"},{"id":91,"question":"次の記述のうち，パーキンソン病（Parkinson disease）で上肢の震えはあるが，自力摂取が可能な利用者の食事の介護として，最も適切なものを1 つ選びなさい。","options":["食事後に口腔内のアイスマッサージを行う。","片側の縁が高くなっている皿を準備する。","上半身を後ろに20 度程度倒すように伝える。","食器の置いてある位置を説明する。","踵を床から浮かすように伝える。"],"answer":[2],"subject":10,"explanation":"縁が高い皿は、食べ物を寄せてすくいやすくします。本人が自分で食べることを助けます。"},{"id":92,"question":"次の記述のうち，入浴の作用を生かした，高齢者への入浴の介護として，最も適切なものを1 つ選びなさい。","options":["食事は，入浴直前に摂取する。","高血圧の人には，42℃以上の湯につかってもらう。","浴槽の中では，関節運動を促す。","心疾患（heart disease）のある人には，肩まで湯につかってもらう。","個浴の浴槽内では，足を浮かせてもらう。"],"answer":[3],"subject":10,"explanation":"湯の浮力によって身体への負担が軽くなるため、浴槽内では関節を動かしやすくなります。"},{"id":93,"question":"次の記述のうち，下肢筋力が低下して介護を必要とする人の入浴に適した環境として，最も適切なものを1 つ選びなさい。","options":["浴室の入口は開き戸にする。","床から浴槽の縁までの高さは20 cm にする。","縦に長く，浅めの洋式の浴槽にする。","浴槽の縁の幅は20 cm にする。","浴槽への出入りのために，水平および垂直の手すりを設置する。"],"answer":[5],"subject":10,"explanation":"浴槽の出入りや姿勢の保持を支えるため、動作に合わせて水平・垂直の手すりを設置します。"},{"id":94,"question":"次の記述のうち，体調不良で入浴できない片麻痺の利用者に対して，ベッド上で行う全身清拭の方法として，最も適切なものを1 つ選びなさい。","options":["清拭時は，窓を開けて行う。","洗面器には，40℃程度のお湯を準備する。","最初に，腹部から清拭する。","背部は，患側を下にした側臥位にして拭く。","蒸しタオルで拭いた後は，乾いたタオルで水分を拭き取る。"],"answer":[5],"subject":10,"explanation":"拭いた後の水分が蒸発すると体温が奪われます。乾いたタオルで水分を取り、保温します。"},{"id":95,"question":"次のうち，同居の高齢者におむつを使用する家族介護者に対する，介護福 祉職の説明として，最も適切なものを1 つ選びなさい。","options":["「使用する本人の羞恥心に気を配りましょう」","「尿失禁を防ぐことができます」","「尿量を気にせずに，1 日中同じおむつを使うことができます」","「おむつを着けると，安心して排泄ができます」","「家族の都合に合わせて，おむつを使いましょう」"],"answer":[1],"subject":10,"explanation":"おむつの使用では、本人の羞恥心や尊厳に配慮します。家族の都合だけで使用を決めません。"},{"id":96,"question":"次の記述のうち，ポータブルトイレを使用するときの排泄の介護として，最も適切なものを1 つ選びなさい。","options":["ポータブルトイレの下に新聞紙を敷く。","ベッドで臥床している状態で，ズボンや下着をおろす。","ポータブルトイレには，前かがみになって座ってもらう。","排泄が終わるまで，ポータブルトイレの後ろに立って待つ。","排泄後の陰部の清拭は，ベッドの上で行う。"],"answer":[3],"subject":10,"explanation":"前かがみの姿勢は腹圧をかけやすくし、排便を助けます。足底を安定させ、安全にも配慮します。"},{"id":97,"question":"次の記述のうち，介護福祉職が行うことのできる，坐薬（座薬）を用いた介護として，最も適切なものを1 つ選びなさい。","options":["膣から挿入する坐薬（座薬）が扱える。","坐薬（座薬）は，あたたかな場所で保管する。","坐薬（座薬）は，とがっていない方から挿入する。","腹部に力を入れるよう促しながら，坐薬（座薬）を挿入する。","下剤以外の坐薬（座薬）挿入は，先に排泄を済ませてから行う。"],"answer":[5],"subject":10,"explanation":"下剤以外の坐薬は、排泄を先に済ませると、挿入後に便と一緒に出てしまうことを防ぎやすくなります。"},{"id":98,"question":"次の記述のうち，調理における基本調味料の効果や使い方として，適切なものを1 つ選びなさい。","options":["砂糖は，塩より先に入れると，食物に甘みが浸透しやすくなる。","塩は，食物のうま味を増し，照りを出す。","酢は，食物の水分を引き出し，保存性を高める。","しょうゆは，食物のくさみを抜き，肉を柔らかくする。","みそは，味付けの最初に入れると，特有の香りが逃げない。"],"answer":[1],"subject":10,"explanation":"砂糖は塩より先に入れると、甘みを染み込ませやすくなります。調味料を入れる順番の基本です。"},{"id":99,"question":"食品の保存に関する次の記述のうち，最も適切なものを1 つ選びなさい。","options":["賞味期限の切れた未開封の缶詰は，すぐに廃棄する。","ウインナーには，消費期限が記載されている。","前日調理して常温保存した肉入りカレーは，再加熱する。","りんごを冷蔵庫で保存するときは，ビニール袋に入れて密封する。","冷凍食品は，一度解凍しても再冷凍すれば長期間の保存が可能である。"],"answer":[4],"subject":10,"explanation":"りんごを袋に入れて密封すると、乾燥を防ぎ、放出するエチレンの他の食品への影響も抑えられます。"},{"id":100,"question":"次の記述のうち，衣類の保管方法として，適切なものを1 つ選びなさい。","options":["衣装ケースで保管するときは，たたんだ衣類の下に防虫剤を入れる。","ドライクリーニング後の衣類は，ビニールを外さずに保管する。","汚れのひどい衣類は，介護福祉職の判断で廃棄する。","湿気を含んだ衣類は，たたんで引き出しに保管する。","絹製品は，タンスの上部に保管する。"],"answer":[5],"subject":10,"explanation":"絹製品は湿気を避けて保管します。湿気がたまりにくいタンスの上部が適しています。"},{"id":101,"question":"次の記述のうち，介護の現場で行うベッドメイキングとして，最も適切なものを1 つ選びなさい。","options":["居室の窓は，閉めて行う。","キャスターのあるベッドは，ストッパーを外す。","シーツの中心線を，マットレスの端に合わせる。","シーツをマットレスの下に入れるときは，手掌を下にする。","シーツ交換は，両膝を伸ばしたままで行う。"],"answer":[4],"subject":10,"explanation":"シーツを差し込むときは手掌を下にし、手の甲でマットレスを支えるようにすると作業しやすくなります。"},{"id":102,"question":"Ｂさん（90 歳，女性，要介護3 ）は，アルツハイマー型認知症（dementia of the Alzheimer’s type）があり，介護老人福祉施設に入所している。テレビを見ることが好きで，日中はお茶を飲みながら，テレビを見て過ごすことが日課である。1 週間前からＢさんは，夜中に目が覚めたり，3 時ごろに起きたりと，不眠が続いている。2 時間ほどしか寝ていない日もある。ある日，Ｂさんは，「昼間，眠くてしかたがない。からだがだるい」と介護福祉職に話した。次の記述のうち，Ｂさんに安眠を促すための介護福祉職の対応として，最も適切なものを1 つ選びなさい。","options":["午前中，太陽の光を浴びることを勧める。","昼間眠いときは，1 時間以上の昼寝を勧める。","夕食後，すぐに寝ることを勧める。","寝る前に，介護福祉職の判断で睡眠薬を勧める。","夜眠れないときは，居室でテレビを見ることを勧める。"],"answer":[1],"subject":10,"explanation":"午前中に太陽の光を浴びることは、体内時計を整え、夜の睡眠を促すことにつながります。"},{"id":103,"question":"終末期の介護に関する次の記述のうち，最も適切なものを1 つ選びなさい。","options":["決まった時間に食事を提供する。","部屋の換気は控えるようにする。","無反応のときは無言で静かに介護を行う。","呼吸困難時は，顎を下げて頭部を前屈させた仰臥位（背臥位）にする。","せん妄によって話のつじつまが合わないときは，否定せずに受け止める。"],"answer":[5],"subject":10,"explanation":"せん妄で話のつじつまが合わなくても、強く否定せずに受け止め、不安を軽くする対応をします。"},{"id":104,"question":"次のうち，キューブラー・ロス（Kubler-Ross, E.）が提唱した終末期にある人の死の受容過程のうち，「死は避けられないと知り，さまざまな喪失感を抱く段階」に該当するものとして，適切なものを1 つ選びなさい。","options":["否認","怒り","取り引き","抑うつ","受容"],"answer":[4],"subject":10,"explanation":"死が避けられないと感じ、喪失感や深い悲しみを抱く状態は、抑うつの段階に当たります。"},{"id":105,"question":"Ｃさん（58 歳，男性）は，アテトーゼ型（athetosis）の脳性麻痺（cerebral palsy）がある。腕，脚，体幹の筋肉は不随意的にゆっくりと動くことが多く，手指を細かく動かすことは難しい。言葉をはっきり発音することが困難であるが，音の聞き取りはできる。次のうち，Ｃさんが使用している情報・意思疎通支援用具として，最も適切なものを1 つ選びなさい。","options":["福祉電話","携帯用会話補助装置","人工喉頭","助聴器","点字器"],"answer":[2],"subject":10,"explanation":"携帯用会話補助装置は、文字などを選んで音声で伝える用具です。発音が難しい人の意思疎通を補います。"},{"id":106,"question":"次の記述のうち，介護過程を展開する目的として，最も適切なものを1 つ選びなさい。","options":["家族が抱える生活課題の解決","個別ケアに基づく利用者の自立支援","介護福祉職の職業倫理の向上","利用者と家族の信頼関係の構築","介護福祉職と他職種の連携の促進"],"answer":[2],"subject":11,"explanation":"介護過程は、一人ひとりに合ったケアを考え、利用者の自立や望む生活を支援するために展開します。"},{"id":107,"question":"生活課題に関する記述として，最も適切なものを1 つ選びなさい。","options":["家族の立場から検討する。","利用者のニーズを判断の基盤にする。","利用者の要望を1 つに集約する。","介護福祉職の主観を尊重する。","生命の危機よりも利用者の意向を優先する。"],"answer":[2],"subject":11,"explanation":"生活課題は、利用者のニーズを基盤にして検討します。支援者や家族の都合だけで判断しません。"},{"id":108,"question":"次の記述のうち，介護過程の展開における評価の説明として，最も適切なものを1 つ選びなさい。","options":["他の利用者と比較して評価する。","短期目標の評価によって，介護過程の展開を終了する。","目標の達成状況を評価する。","介護計画の実施後に評価日を検討する。","介護計画を修正した場合は，評価を省略する。"],"answer":[3],"subject":11,"explanation":"評価では、設定した目標がどの程度達成されたかを確認し、必要に応じて計画を見直します。"},{"id":109,"question":"次のうち，介護保険制度のサービス担当者会議におけるサービス提供 責任者の役割として，最も適切なものを1 つ選びなさい。","options":["会議の主催","居宅サービス計画の原案の説明","他職種が実施したサービス内容の評価","訪問介護計画の作成に要した時間の報告","訪問介護計画の作成に必要な情報の確認"],"answer":[5],"subject":11,"explanation":"サービス提供責任者は、本人の状況や希望など、訪問介護計画の作成に必要な情報を会議で確認します。"},{"id":110,"question":"調理中にＡさんが包丁を置き，部屋で横になってしまった行動に対する解釈として，最も適切なものを1 つ選びなさい。\n\n〔事例〕\nＡさん（78 歳，男性，要介護1 ）は，一人暮らしで，脳梗塞（cerebral infarction）を発症し入院した。その後，リハビリテーションを経て，自宅に戻った。利き手の右 手に麻痺が残ったため，左手を使った調理の自立を目的に，訪問介護（ホームヘルプサービス）を利用することになった。サービス利用時は，訪問介護員（ホームヘルパー）の協力を得ながら，孫からプレゼントされた包丁を使って，調理に取り組んでいた。ある日，好物の牛肉をうまく押さえることができず，切ることができなかった。すると，Ａさんは包丁を置き，部屋で横になってしまった。心配した訪問介護員（ホームヘルパー）が声をかけ，バイタルサインを確認したところ変化はなかった。Ａさんは，「右手が思うように動いてくれない。悔しい。でも，もう一度ひとりで作れるようになりたい」と話した。次の日，Ａさんは，「今日も手伝って」と訪問介護員（ホームヘルパー）に話した。","options":["体調不良による休憩","食材に対する不満","調理に対する興味の喪失","包丁に対する不満","調理がうまくできないことに対する苛立ち"],"answer":[5],"subject":11,"explanation":"本人は調理を続けたいと思っています。うまくできない悔しさや苛立ちが行動の背景にあります。"},{"id":111,"question":"訪問介護計画の修正を目的としたカンファレンスで，訪問介護員（ホームヘルパー）が提案する内容として，最も適切なものを1 つ選びなさい。\n\n〔事例〕\nＡさん（78 歳，男性，要介護1 ）は，一人暮らしで，脳梗塞（cerebral infarction）を発症し入院した。その後，リハビリテーションを経て，自宅に戻った。利き手の右 手に麻痺が残ったため，左手を使った調理の自立を目的に，訪問介護（ホームヘルプサービス）を利用することになった。サービス利用時は，訪問介護員（ホームヘルパー）の協力を得ながら，孫からプレゼントされた包丁を使って，調理に取り組んでいた。ある日，好物の牛肉をうまく押さえることができず，切ることができなかった。すると，Ａさんは包丁を置き，部屋で横になってしまった。心配した訪問介護員（ホームヘルパー）が声をかけ，バイタルサインを確認したところ変化はなかった。Ａさんは，「右手が思うように動いてくれない。悔しい。でも，もう一度ひとりで作れるようになりたい」と話した。次の日，Ａさんは，「今日も手伝って」と訪問介護員（ホームヘルパー）に話した。","options":["訪問介護員（ホームヘルパー）による調理の代行","担当する訪問介護員（ホームヘルパー）の交代","配食サービスの利用","調理に関する福祉用具の活用","訪問回数の削減"],"answer":[4],"subject":11,"explanation":"調理に使う福祉用具を活用し、本人が自分で調理するという希望を実現できるように支えます。"},{"id":112,"question":"次のうち，Ｂさんがしばらく一人でいた様子を理解するために必要な情 報として，最も優先すべきものを1 つ選びなさい。\n\n〔事例〕\nＢさん（42 歳，女性，障害支援区分3 ）は，知的障害があり，母親と二人暮らしである。日中は生活介護事業所に通っている。日常生活動作の一部に見守りが必要である。個別支援計画の短期目標を，「見守りのもと，トイレで排泄ができる」としている。しかし，最近，排泄のときに下着やズボンを汚してしまい，それをほかの利用者にからかわれ，しばらく一人でいる様子があったと生活支援員から申し送りがあった。ある日，事業所長が話しかけると，Ｂさんは，「トイレで失敗したら恥ずかしい」と元気なく話した。母親からも電話で，「これからは紙おむつを使うように勧めているのだけど，使いたくないとＢは話している」とサービス管理責任者に連絡があった。","options":["サービス管理責任者との関係","生活支援員との関係","事業所長との関係","ほかの利用者との関係","母親との関係"],"answer":[4],"subject":11,"explanation":"排泄の失敗をからかわれたことが背景にあるため、ほかの利用者との関係を優先して確認します。"},{"id":113,"question":"Ｂさんについて，個別支援会議が開催され，短期目標を，「排泄の自立（下着を汚さずに排泄する）（3 か月）」とした。次の記述のうち，Ｂさんの短期目標を実現するために生活支援員がとる対応として，最も適切なものを1 つ選びなさい。\n\n〔事例〕\nＢさん（42 歳，女性，障害支援区分3 ）は，知的障害があり，母親と二人暮らしである。日中は生活介護事業所に通っている。日常生活動作の一部に見守りが必要である。個別支援計画の短期目標を，「見守りのもと，トイレで排泄ができる」としている。しかし，最近，排泄のときに下着やズボンを汚してしまい，それをほかの利用者にからかわれ，しばらく一人でいる様子があったと生活支援員から申し送りがあった。ある日，事業所長が話しかけると，Ｂさんは，「トイレで失敗したら恥ずかしい」と元気なく話した。母親からも電話で，「これからは紙おむつを使うように勧めているのだけど，使いたくないとＢは話している」とサービス管理責任者に連絡があった。","options":["定期的に，手順を理解できているか一緒に確認する。","自宅で排泄を済ませ，事業所で排泄しないように助言する。","母親の要望であると伝え，紙おむつを使うように助言する。","ポータブルトイレを設置し，そこで排泄をするように誘導する。","排泄に関する行為を，全介助にする。"],"answer":[1],"subject":11,"explanation":"排泄の手順を理解して実行できるか、本人と一緒に確認します。できる力を生かして自立を目指します。"},{"id":114,"question":"現在のＡさんの症状に該当するホーエン・ヤール重症度分類として，最も適切なものを1 つ選びなさい。\n\n〔事例〕\nＡさん（70 歳，男性）は，妻と二人で暮らしている。旅行や釣りが趣味で，会社員として勤務していたころは，活動的な生活を送っていた。66 歳のときにパーキンソン病（Parkinson disease）と診断されたが，内服治療が開始され，症状はあまり気にならなかった。1 年前から顔の表情が乏しくなり，歩行開始時に，はじめの一歩が出にくくなった。3 か月前からは，歩き始めると方向転換が難しく，急に止まることができないことがある。Ａさんは，今後の生活について相談するために，地域包括支援センターに行った。センターで対応してくれたＢ主任介護支援専門員は，介護福祉士としての実務経験が豊富だった。Ａさんは信頼して，気になっていたことをすべて話すことができた。Ａさんは，要介護認定を申請することを勧められ，後日，市役所に行き，要介護認定の申請を行った。","options":["ステージⅠ","ステージⅡ","ステージⅢ","ステージⅣ","ステージⅤ"],"answer":[3],"subject":12,"explanation":"ステージⅢは、姿勢を保つ反射に障害がみられる段階です。方向転換や停止が難しくなった事例の状態が該当します。"},{"id":115,"question":"要介護認定を申請してから2 週間が経過した。Ａさんは要介護認定の認 定結果が届かないことが気になった。そこで，以前に対応してくれたＢ主任介護支 援専門員に電話で相談した。次のうち，Ｂ主任介護支援専門員の応答として，最も適切なものを1 つ選びなさい。\n\n〔事例〕\nＡさん（70 歳，男性）は，妻と二人で暮らしている。旅行や釣りが趣味で，会社員として勤務していたころは，活動的な生活を送っていた。66 歳のときにパーキンソン病（Parkinson disease）と診断されたが，内服治療が開始され，症状はあまり気にならなかった。1 年前から顔の表情が乏しくなり，歩行開始時に，はじめの一歩が出にくくなった。3 か月前からは，歩き始めると方向転換が難しく，急に止まることができないことがある。Ａさんは，今後の生活について相談するために，地域包括支援センターに行った。センターで対応してくれたＢ主任介護支援専門員は，介護福祉士としての実務経験が豊富だった。Ａさんは信頼して，気になっていたことをすべて話すことができた。Ａさんは，要介護認定を申請することを勧められ，後日，市役所に行き，要介護認定の申請を行った。","options":["「次の受診時に主治医に相談しましょう」","「通常1 か月程度かかるので，あと2 週間くらい待ってみましょう」","「以前に自宅に来てくれた認定調査員に相談しましょう」","「念のためにもう一度要介護認定を申請してください」","「通常であれば認定結果は出ていると思います」"],"answer":[2],"subject":12,"explanation":"要介護認定の結果通知は、原則として申請から三十日以内です。二週間の時点では、通常の期間内です。"},{"id":116,"question":"最近，Ａさんは急に体の動きが悪くなる時間帯があり，不安を感じた。そこでＡさんは，週に2 回利用している訪問介護員（ホームヘルパー）に相談した。相談を受けた訪問介護員（ホームヘルパー）はＡさんに，日々の症状の変化とその時間，さらにもう一点をメモして，医師に伝えるようにと助言した。日々の症状の変化とその時間に加えて，Ａさんが医師に伝える内容として，最も優先度の高いものを1 つ選びなさい。\n\n〔事例〕\nＡさん（70 歳，男性）は，妻と二人で暮らしている。旅行や釣りが趣味で，会社員として勤務していたころは，活動的な生活を送っていた。66 歳のときにパーキンソン病（Parkinson disease）と診断されたが，内服治療が開始され，症状はあまり気にならなかった。1 年前から顔の表情が乏しくなり，歩行開始時に，はじめの一歩が出にくくなった。3 か月前からは，歩き始めると方向転換が難しく，急に止まることができないことがある。Ａさんは，今後の生活について相談するために，地域包括支援センターに行った。センターで対応してくれたＢ主任介護支援専門員は，介護福祉士としての実務経験が豊富だった。Ａさんは信頼して，気になっていたことをすべて話すことができた。Ａさんは，要介護認定を申請することを勧められ，後日，市役所に行き，要介護認定の申請を行った。","options":["服薬の時間","起床の時間","食事の時間","排便の時間","入浴の時間"],"answer":[1],"subject":12,"explanation":"薬の効果と症状の変化の関係を把握するため、服薬した時間も記録して医師に伝えます。"},{"id":117,"question":"次のうち，最近のＣさんの症状に該当するものとして，最も適切なものを1 つ選びなさい。\n\n〔事例〕\nＣさん（90 歳，女性）は，動物好きで長年ペットのオウムを飼っている。5 年前に夫が亡くなったときも，ペットが大きな心の支えになった。2 年前，身体の衰えから買物や調理などの家事が難しくなり，一人暮らしが困難になったので，ペットと入所できる健康型有料老人ホームに入所した。最近Ｃさんは，毎週楽しみにしていたレクリエーションがある曜日や時間を忘れてしまう，トイレの場所がわからず失禁するなどの症状が繰り返し生じるようになってきた。心配した娘がＣさんと病院を受診したところ，アルツハイマー型認知 症（dementia of the Alzheimer’s type）と診断を受けた。健康型有料老人ホームでは対応が困難になってきたため，心配した娘はＣさんが入所できる施設に移ることを検討し始めた。","options":["妄想","見当識障害","失語","遂行機能障害","観念失行"],"answer":[2],"subject":12,"explanation":"時間や場所などが分からなくなるのが見当識障害です。曜日や時刻、トイレの場所が分からない状態が該当します。"},{"id":118,"question":"娘はＣさんの病状を心配して，「お父さんが残してくれた貯金があるから，もっとお母さんのお世話をしてくれる施設に移ろう」と提案した。Ｃさんは，「ペットと一緒に暮らせなくなるのは嫌だ」とつぶやき，うつむいた。困った娘は健康型有料老人ホームの介護福祉士に相談した。次のうち，娘への介護福祉士の応答として，最も適切なものを1 つ選びなさい。\n\n〔事例〕\nＣさん（90 歳，女性）は，動物好きで長年ペットのオウムを飼っている。5 年前に夫が亡くなったときも，ペットが大きな心の支えになった。2 年前，身体の衰えから買物や調理などの家事が難しくなり，一人暮らしが困難になったので，ペットと入所できる健康型有料老人ホームに入所した。最近Ｃさんは，毎週楽しみにしていたレクリエーションがある曜日や時間を忘れてしまう，トイレの場所がわからず失禁するなどの症状が繰り返し生じるようになってきた。心配した娘がＣさんと病院を受診したところ，アルツハイマー型認知 症（dementia of the Alzheimer’s type）と診断を受けた。健康型有料老人ホームでは対応が困難になってきたため，心配した娘はＣさんが入所できる施設に移ることを検討し始めた。","options":["「Ｃさんがペットを大事にしている意思を尊重してはいかがですか」","「Ｃさんが新しい施設に行くことが最優先です」","「あなたの意向を優先してはいかがですか」","「Ｃさんがペットを飼うことは優先度の高いニーズとは言えません」","「Ｃさんが新しい施設に行くことを受け入れるように説得してください」"],"answer":[1],"subject":12,"explanation":"ペットは本人にとって大切な心の支えです。その思いや希望を尊重して、生活の場を考えます。"},{"id":119,"question":"Ｃさんと娘は介護福祉士と相談し，希望に沿った施設を見つけることができた。次のうち，Ｃさんが入所する施設として，最も適切なものを1 つ選びなさい。\n\n〔事例〕\nＣさん（90 歳，女性）は，動物好きで長年ペットのオウムを飼っている。5 年前に夫が亡くなったときも，ペットが大きな心の支えになった。2 年前，身体の衰えから買物や調理などの家事が難しくなり，一人暮らしが困難になったので，ペットと入所できる健康型有料老人ホームに入所した。最近Ｃさんは，毎週楽しみにしていたレクリエーションがある曜日や時間を忘れてしまう，トイレの場所がわからず失禁するなどの症状が繰り返し生じるようになってきた。心配した娘がＣさんと病院を受診したところ，アルツハイマー型認知 症（dementia of the Alzheimer’s type）と診断を受けた。健康型有料老人ホームでは対応が困難になってきたため，心配した娘はＣさんが入所できる施設に移ることを検討し始めた。","options":["経過的軽費老人ホーム（Ｂ型）","介護医療院","介護老人保健施設","養護老人ホーム","介護付有料老人ホーム"],"answer":[5],"subject":12,"explanation":"介護付有料老人ホームは、介護が必要な人の生活を支える住まいです。ペットとの同居の可否は施設ごとに確認します。"},{"id":120,"question":"Ｄさんの疾患で生じる病態として，適切なものを1 つ選びなさい。\n\n〔事例〕\nＤさん（男性，障害支援区分4 ）は，ベッカー型筋ジストロフィー（Becker muscular dystrophy）である。自宅で家族と生活をしている。Ｄさんは，食事は自立しているが，排泄，入浴に介護が必要である。歩行はできず，移動は電動車いすを使用している。絵を描くことが趣味であり，日中は創作活動に取り組んでいる。これまでＤさんは自宅で家族の介護を受けながら生活してきたが，Ｄさんの身体機 能の低下に伴い，家族の介護負担が増えたため，居宅介護を利用することになった。","options":["筋線維の変性","運動神経の変性","網膜の変性","自己免疫の低下","脳細胞の変性"],"answer":[1],"subject":12,"explanation":"筋ジストロフィーでは、筋線維が変性して筋力が低下します。運動神経そのものの変性とは区別します。"},{"id":121,"question":"Ｅ居宅介護事業所に勤務するＦ介護福祉職は，Ｄさん宅を初回訪問するにあたりフェイスシートのジェノグラムを確認した。以下のジェノグラムからＦ介護福祉職が把握した内容として，適切なものを1 つ選びなさい。\n\n〔事例〕\nＤさん（男性，障害支援区分4 ）は，ベッカー型筋ジストロフィー（Becker muscular dystrophy）である。自宅で家族と生活をしている。Ｄさんは，食事は自立しているが，排泄，入浴に介護が必要である。歩行はできず，移動は電動車いすを使用している。絵を描くことが趣味であり，日中は創作活動に取り組んでいる。これまでＤさんは自宅で家族の介護を受けながら生活してきたが，Ｄさんの身体機 能の低下に伴い，家族の介護負担が増えたため，居宅介護を利用することになった。","options":["Ｄさんは，Ｄさんの母親と同居している。","Ｄさんには息子がいる。","Ｄさんの兄は結婚している。","Ｄさんの父親は生存している。","Ｄさんの妻には兄弟姉妹がいる。"],"answer":[2],"subject":12,"explanation":"図では、Ｄさんと妻を結ぶ線から下に二十一歳の男性を示す四角がつながっています。Ｄさんには息子がいます。","figure":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAuQAAAGGCAIAAAC8EgP+AAAACXBIWXMAAA7EAAAOxAGVKw4bAABhYUlEQVR4nOzdiV9M7f8/8N9/0r5qWhRJtkSLkl2EyB5la0GJshVyu4msEZIla+FW9i1bikgoUlG0aFVpGb/3be7PfDPVNHNmOefMvJ6PedwP93TmnHfTOdd5XTPnXNf/+wUAAADAYf+P7QIAAAAApEFYAQAAAE5DWAEAAABOQ1gBAAAATkNYAQAAAE5DWAEAAABOQ1gBAAAATkNYAQAAAE5DWAEAAABOQ1gBAAAATkNYAQAAAE5DWAEAAABOQ1gBAAAATkNYAQAAAE5DWAEAAABOQ1gBAAAATkNYAQAAAE5DWAEAAABOQ1gBAAAATkNYAQAAAE5DWAEAgP80NTUVFxcXFBTk/k9eXp7EMjU1NaIfvXr1qvi3L58/s1ItaA+EFQAA3qurq0tLTT1+7Ni++PidO3ZErl0btmpVc3Nz52VevngxdNCgAf36WQsEpkZG+jo69JBYz62bN0XPix+WFhYSy1y6eFFiGUcHB4llko4fp+dpQ/QYNHAgbXe6j4/EMnfv3ImJjt4bH38iKYmKv337dnZ2thLeC9BECCsAABzS0tLS3t7e+Zna2loKH0sDA2fOmOHl4UHnfgszs5KSks7LvM3P 所","生活介護","居宅介護"],"answer":[4],"subject":12,"explanation":"生活介護は、日中の介護や創作活動などの機会を提供します。施設入所支援と組み合わせて利用できます。"},{"id":124,"question":"次のうち，Ｇさんの難聴の原因となっている損傷部位に該当するものとして，最も適切なものを1 つ選びなさい。\n\n〔事例〕\nＧさん（38 歳，女性）は，母親（65 歳）と暮らしていた。両側性感音難聴（sensorineural hearing loss）があり，雑音がある場所では話を聞き取りにくい。相手の口の動きや表情から会話の内容を理解することはできる。Ｇさんは，脳梗塞（cerebral infarction） を発症し，左片麻痺で車いすの生活となり，障害支援区分4 と認定された。母親による介護が難しくなったため，障害者支援施設に入所することになった。Ｇさんは，写真を撮ることが好きで，施設で近くの公園に出かけたときに，介護福 祉職に手伝ってもらいながら好きな風景を撮影している。Ｇさんは，その写真をアルバムにして，母親にプレゼントしたいと考えている。ある日，Ｇさんから，「アルバムを作りたい。飾りの付け方やメッセージの書き方を教えてほしい」と相談があった。介護福祉職は，Ｇさんとアルバムを作ることにした。","options":["内耳から聴神経","外耳道から中耳","耳介から中耳","耳介から外耳道","耳介"],"answer":[1],"subject":12,"explanation":"感音難聴は、内耳や聴神経などの障害で生じます。外耳や中耳の障害によるものは伝音難聴です。"},{"id":125,"question":"次の記述のうち，Ｇさんに介護福祉職がアルバムの作り方を説明するときに配慮することとして，最も適切なものを1 つ選びなさい。\n\n〔事例〕\nＧさん（38 歳，女性）は，母親（65 歳）と暮らしていた。両側性感音難聴（sensorineural hearing loss）があり，雑音がある場所では話を聞き取りにくい。相手の口の動きや表情から会話の内容を理解することはできる。Ｇさんは，脳梗塞（cerebral infarction） を発症し，左片麻痺で車いすの生活となり，障害支援区分4 と認定された。母親による介護が難しくなったため，障害者支援施設に入所することになった。Ｇさんは，写真を撮ることが好きで，施設で近くの公園に出かけたときに，介護福 祉職に手伝ってもらいながら好きな風景を撮影している。Ｇさんは，その写真をアルバムにして，母親にプレゼントしたいと考えている。ある日，Ｇさんから，「アルバムを作りたい。飾りの付け方やメッセージの書き方を教えてほしい」と相談があった。介護福祉職は，Ｇさんとアルバムを作ることにした。","options":["Ｇさんの左側に座る。","閉じられた質問を用いる。","小さな声で話す。","Ｇさんの好きな音楽を流す。","1 対1 で向かい合って話す。"],"answer":[5],"subject":12,"explanation":"静かな場所で一対一で向かい合い、口の動きや表情を見やすくします。本人が理解しやすい伝え方を選びます。"}], SUBJECTS=["人間の尊厳と自立", "人間関係とコミュニケーション", "社会の理解", "こころとからだのしくみ", "発達と老化の理解", "認知症の理解", "障害の理解", "医療的ケア", "介護の基本", "コミュニケーション技術", "生活支援技術", "介護過程", "総合問題"];

rt>なれ<\/rt><\/ruby>た<ruby>環境<rt>かんきょう<\/rt><\/ruby>や<ruby>仲間<rt>なかま<\/rt><\/ruby>とのつながりを<ruby>失う<rt>うしなう<\/rt><\/ruby>ことを<ruby>心配<rt>しんぱい<\/rt><\/ruby>しています。","次の記述のうち，サクセスフル・エイジング（successful aging）として，適切なものを1 つ選びなさい。":"<ruby>次<rt>つぎ<\/rt><\/ruby>の<ruby>記述<rt>きじゅつ<\/rt><\/ruby>のうち，サクセスフル・エイジング（successful aging）として，<ruby>適切<rt>てきせつ<\/rt><\/ruby>なものを1 つ<ruby>選<rt>えら<\/rt><\/ruby>びなさい。","長生きすることが，最大の目的である。":"<ruby>長生<rt>ながい<\/rt><\/ruby>きすることが，<ruby>最大<rt>さいだい<\/rt><\/ruby>の<ruby>目的<rt>もくてき<\/rt><\/ruby>である。","一人暮らしで，周囲の人と交流をしないようにしている。":"<ruby>一人暮<rt>ひとりぐ<\/rt><\/ruby>らしで，<ruby>周囲<rt>しゅうい<\/rt><\/ruby>の<ruby>人<rt>ひと<\/rt><\/ruby>と<ruby>交流<rt>こうりゅう<\/rt><\/ruby>をしないようにしている。","膝に痛みがあるので，一日中ベッド上で過ごすようにしている。":"<ruby>膝<rt>ひざ<\/rt><\/ruby>に<ruby>痛<rt>いた<\/rt><\/ruby>みがあるので，<ruby>一日中<rt>いちにちじゅう<\/rt><\/ruby>ベッド<ruby>上<rt>じょう<\/rt><\/ruby>で<ruby>過<rt>す<\/rt><\/ruby>ごすようにしている。","難聴があるので，補聴器をつけてパソコン教室に通い始めた。":"<ruby>難聴<rt>なんちょう<\/rt><\/ruby>があるので，<ruby>補聴器<rt>ほちょうき<\/rt><\/ruby>をつけてパソコン<ruby>教室<rt>きょうしつ<\/rt><\/ruby>に<ruby>通<rt>かよ<\/rt><\/ruby>い<ruby>始<rt>はじ<\/rt><\/ruby>めた。","歌を上手に歌えなくなったので，カラオケに誘われても行かないようにしている。":"<ruby>歌<rt>うた<\/rt><\/ruby>を<ruby>上手<rt>じょうず<\/rt><\/ruby>に<ruby>歌<rt>うた<\/rt><\/ruby>えなくなったので，カラオケに<ruby>誘<rt>さそ<\/rt><\/ruby>われても<ruby>行<rt>い<\/rt><\/ruby>かないようにしている。","心身の変化に対応しながら、自分らしく活動や交流を続けることは、サクセスフル・エイジングにつながります。":"<ruby>心身<rt>しんしん<\/rt><\/ruby>の<ruby>変化<rt>へんか<\/rt><\/ruby>に<ruby>対応<rt>たいおう<\/rt><\/ruby>しながら、<ruby>自分<rt>じぶん<\/rt><\/ruby>らしく<ruby>活動<rt>かつどう<\/rt><\/ruby>や<ruby>交流<rt>こうりゅう<\/rt><\/ruby>を<ruby>続け<rt>つづけ<\/rt><\/ruby>ることは、サクセスフル・エイジングにつながります。","次のうち，老年症候群に直接関わる疾患として，最も適切なものを1 つ選びなさい。":"<ruby>次<rt>つぎ<\/rt><\/ruby>のうち，<ruby>老年症候群<rt>ろうねんしょうこうぐん<\/rt><\/ruby>に<ruby>直接関<rt>ちょくせつかか<\/rt><\/ruby>わる<ruby>疾患<rt>しっかん<\/rt><\/ruby>として，<ruby>最<rt>もっと<\/rt><\/ruby>も<ruby>適切<rt>てきせつ<\/rt><\/ruby>なものを1 つ<ruby>選<rt>えら<\/rt><\/ruby>びなさい。","高血圧症（hypertension）":"<ruby>高血圧症<rt>こうけつあつしょう<\/rt><\/ruby>（hypertension）","糖尿病（diabetes mellitus）":"<ruby>糖尿病<rt>とうにょうびょう<\/rt><\/ruby>（diabetes mellitus）","骨粗鬆症（osteoporosis）":"<ruby>骨粗鬆症<rt>こつそしょうしょう<\/rt><\/ruby>（osteoporosis）","心筋梗塞（myocardial infarction）":"<ruby>心筋梗塞<rt>しんきんこうそく<\/rt><\/ruby>（myocardial infarction）","脂質異常症（dyslipidemia）":"<ruby>脂質異常症<rt>ししついじょうしょう<\/rt><\/ruby>（dyslipidemia）","骨粗鬆症は骨折の危険を高め、移動能力の低下などにつながるため、老年症候群と密接に関係します。":"<ruby>骨粗鬆症<rt>こつそしょうしょう<\/rt><\/ruby>は<ruby>骨折<rt>こっせつ<\/rt><\/ruby>の<ruby>危険<rt>きけん<\/rt><\/ruby>を<ruby>高め<rt>たかめ<\/rt><\/ruby>、<ruby>移動<rt>いどう<\/rt><\/ruby><ruby>能力<rt>のうりょく<\/rt><\/ruby>の<ruby>低下<rt>ていか<\/rt><\/ruby>などにつながるため、<ruby>老年症候群<rt>ろうねんしょうこうぐん<\/rt><\/ruby>と<ruby>密接<rt>みっせつ<\/rt><\/ruby>に<ruby>関係<rt>かんけい<\/rt><\/ruby>します。","次の記述のうち，2019 年（令和元年）の認知症施策推進大綱に関する説明として，最も適切なものを1 つ選びなさい。":"<ruby>次<rt>つぎ<\/rt><\/ruby>の<ruby>記述<rt>きじゅつ<\/rt><\/ruby>のうち，2019 <ruby>年<rt>ねん<\/rt><\/ruby>（<ruby>令和元年<rt>れいわがんねん<\/rt><\/ruby>）の<ruby>認知症施策推進大綱<rt>にんちしょうせさくすいしんたいこう<\/rt><\/ruby>に<ruby>関<rt>かん<\/rt><\/ruby>する<ruby>説明<rt>せつめい<\/rt><\/ruby>として，<ruby>最<rt>もっと<\/rt><\/ruby>も<ruby>適切<rt>てきせつ<\/rt><\/ruby>なものを1 つ<ruby>選<rt>えら<\/rt><\/ruby>びなさい。","「共生」と「予防」を車の両輪として施策を推進していく。":"「<ruby>共生<rt>きょうせい<\/rt><\/ruby>」と「<ruby>予防<rt>よぼう<\/rt><\/ruby>」を<ruby>車<rt>くるま<\/rt><\/ruby>の<ruby>両輪<rt>りょうりん<\/rt><\/ruby>として<ruby>施策<rt>せさく<\/rt><\/ruby>を<ruby>推進<rt>すいしん<\/rt><\/ruby>していく。","「予防」とは，「認知症（dementia）にならない」という意味である。":"「<ruby>予防<rt>よぼう<\/rt><\/ruby>」とは，「<ruby>認知症<rt>にんちしょう<\/rt><\/ruby>（dementia）にならない」という<ruby>意味<rt>いみ<\/rt><\/ruby>である。","「認知症高齢者等にやさしい地域づくり」を推進する7 つの柱が示された。":"「<ruby>認知症高齢者等<rt>にんちしょうこうれいしゃとう<\/rt><\/ruby>にやさしい<ruby>地域<rt>ちいき<\/rt><\/ruby>づくり」を<ruby>推進<rt>すいしん<\/rt><\/ruby>する7 つの<ruby>柱<rt>はしら<\/rt><\/ruby>が<ruby>示<rt>しめ<\/rt><\/ruby>された。","「普及啓発・本人発信支援」として，家族が積極的に本人の意思を代弁することが示された。":"「<ruby>普及啓発<rt>ふきゅうけいはつ<\/rt><\/ruby>・<ruby>本人発信支援<rt>ほんにんはっしんしえん<\/rt><\/ruby>」として，<ruby>家族<rt>かぞく<\/rt><\/ruby>が<ruby>積極的<rt>せっきょくてき<\/rt><\/ruby>に<ruby>本人<rt>ほんにん<\/rt><\/ruby>の<ruby>意思<rt>いし<\/rt><\/ruby>を<ruby>代弁<rt>だいべん<\/rt><\/ruby>することが<ruby>示<rt>しめ<\/rt><\/ruby>された。","策定後は，毎年施策の進捗を確認することが示された。":"<ruby>策定後<rt>さくていご<\/rt><\/ruby>は，<ruby>毎年施策<rt>まいとしせさく<\/rt><\/ruby>の<ruby>進捗<rt>しんちょく<\/rt><\/ruby>を<ruby>確認<rt>かくにん<\/rt><\/ruby>することが<ruby>示<rt>しめ<\/rt><\/ruby>された。","認知症施策推進大綱は、共生と予防を両輪としています。予防は、発症を遅らせたり進行を緩やかにしたりする意味です。":"<ruby>認知症施策推進大綱<rt>にんちしょうせさくすいしんたいこう<\/rt><\/ruby>は、<ruby>共生<rt>きょうせい<\/rt><\/ruby>と<ruby>予防<rt>よぼう<\/rt><\/ruby>を<ruby>両輪<rt>りょうりん<\/rt><\/ruby>としています。<ruby>予防<rt>よぼう<\/rt><\/ruby>は、<ruby>発症<rt>はっしょう<\/rt><\/ruby>を<ruby>遅ら<rt>おくら<\/rt><\/ruby>せたり<ruby>進行<rt>しんこう<\/rt><\/ruby>を<ruby>緩や<rt>ゆるや<\/rt><\/ruby>かにしたりする<ruby>意味<rt>いみ<\/rt><\/ruby>です。","Ａさん（84 歳，女性，要介護3 ）は，アルツハイマー型認知症（dementia of the Alzheimer’s type）で，介護老人福祉施設に入所している。赤ちゃんの人形を持っていて，「はなちゃん」と呼んで話しかけている。昼食のため，介護福祉職が居室を訪問すると，Ａさんは不安そうな顔で，「はなちゃんがいなくなった。どこへ連れて行ったの？返して」と大声を出した。人形はＡさんのロッカーの上に置かれていた。Ａさんに対する介護福祉職の最初の声かけとして，最も適切なものを1 つ選びなさい。":"Ａさん（84 <ruby>歳<rt>さい<\/rt><\/ruby>，<ruby>女性<rt>じょせい<\/rt><\/ruby>，<ruby>要介護<rt>ようかいご<\/rt><\/ruby>3 ）は，アルツハイマー<ruby>型認知症<rt>がたにんちしょう<\/rt><\/ruby>（dementia of the Alzheimer’s type）で，<ruby>介護老人福祉施設<rt>かいごろうじんふくししせつ<\/rt><\/ruby>に<ruby>入所<rt>にゅうしょ<\/rt><\/ruby>している。<ruby>赤<rt>あか<\/rt><\/ruby>ちゃんの<ruby>人形<rt>にんぎょう<\/rt><\/ruby>を<ruby>持<rt>も<\/rt><\/ruby>っていて，「はなちゃん」と<ruby>呼<rt>よ<\/rt><\/ruby>んで<ruby>話<rt>はな<\/rt><\/ruby>しかけている。<ruby>昼食<rt>ちゅうしょく<\/rt><\/ruby>のため，<ruby>介護福祉職<rt>かいごふくししょく<\/rt><\/ruby>が<ruby>居室<rt>きょしつ<\/rt><\/ruby>を<ruby>訪問<rt>ほうもん<\/rt><\/ruby>すると，Ａさんは<ruby>不安<rt>ふあん<\/rt><\/ruby>そうな<ruby>顔<rt>かお<\/rt><\/ruby>で，「はなちゃんがいなくなった。どこへ<ruby>連<rt>つ<\/rt><\/ruby>れて<ruby>行<rt>い<\/rt><\/ruby>ったの？<ruby>返<rt>かえ<\/rt><\/ruby>して」と<ruby>大声<rt>おおごえ<\/rt><\/ruby>を<ruby>出<rt>だ<\/rt><\/ruby>した。<ruby>人形<rt>にんぎょう<\/rt><\/ruby>はＡさんのロッカーの<ruby>上<rt>うえ<\/rt><\/ruby>に<ruby>置<rt>お<\/rt><\/ruby>かれていた。Ａさんに<ruby>対<rt>たい<\/rt><\/ruby>する<ruby>介護福祉職<rt>かいごふくししょく<\/rt><\/ruby>の<ruby>最初<rt>さいしょ<\/rt><\/ruby>の<ruby>声<rt>こえ<\/rt><\/ruby>かけとして，<ruby>最<rt>もっと<\/rt><\/ruby>も<ruby>適切<rt>てきせつ<\/rt><\/ruby>なものを1 つ<ruby>選<rt>えら<\/rt><\/ruby>びなさい。","「私を疑っているんですか」":"「<ruby>私<rt>わたし<\/rt><\/ruby>を<ruby>疑<rt>うたが<\/rt><\/ruby>っているんですか」","「置いた場所を忘れたんですか」":"「<ruby>置<rt>お<\/rt><\/ruby>いた<ruby>場所<rt>ばしょ<\/rt><\/ruby>を<ruby>忘<rt>わす<\/rt><\/ruby>れたんですか」","「心配ですね，一緒に探しませんか」":"「<ruby>心配<rt>しんぱい<\/rt><\/ruby>ですね，<ruby>一緒<rt>いっしょ<\/rt><\/ruby>に<ruby>探<rt>さが<\/rt><\/ruby>しませんか」","「ご飯を食べてから探してはどうですか」":"「ご<ruby>飯<rt>はん<\/rt><\/ruby>を<ruby>食<rt>た<\/rt><\/ruby>べてから<ruby>探<rt>さが<\/rt><\/ruby>してはどうですか」","「ロッカーの上にあるのが見えないんですか」":"「ロッカーの<ruby>上<rt>うえ<\/rt><\/ruby>にあるのが<ruby>見<rt>み<\/rt><\/ruby>えないんですか」","まず本人の不安に共感し、一緒に探す姿勢を示します。忘れたことを責めたり、話を否定したりしません。":"まず<ruby>本人<rt>ほんにん<\/rt><\/ruby>の<ruby>不安<rt>ふあん<\/rt><\/ruby>に<ruby>共感<rt>きょうかん<\/rt><\/ruby>し、<ruby>一緒<rt>いっしょ<\/rt><\/ruby>に<ruby>探す<rt>さがす<\/rt><\/ruby><ruby>姿勢<rt>しせい<\/rt><\/ruby>を<ruby>示し<rt>しめし<\/rt><\/ruby>ます。<ruby>忘れ<rt>わすれ<\/rt><\/ruby>たことを<ruby>責め<rt>せめ<\/rt><\/ruby>たり、<ruby>話<rt>はなし<\/rt><\/ruby>を<ruby>否定<rt>ひてい<\/rt><\/ruby>したりしません。","認知症（dementia）の高齢者にみられる，せん妄に関する記述として，適切なものを1 つ選びなさい。":"<ruby>認知症<rt>にんちしょう<\/rt><\/ruby>（dementia）の<ruby>高齢者<rt>こうれいしゃ<\/rt><\/ruby>にみられる，せん<ruby>妄<rt>もう<\/rt><\/ruby>に<ruby>関<rt>かん<\/rt><\/ruby>する<ruby>記述<rt>きじゅつ<\/rt><\/ruby>として，<ruby>適<rt>てき<\/rt><\/ruby><ruby>切<rt>せつ<\/rt><\/ruby>なものを1 つ<ruby>選<rt>えら<\/rt><\/ruby>びなさい。","覚醒レベルが重度に低下した状態である。":"<ruby>覚醒<rt>かくせい<\/rt><\/ruby>レベルが<ruby>重度<rt>じゅうど<\/rt><\/ruby>に<ruby>低下<rt>ていか<\/rt><\/ruby>した<ruby>状態<rt>じょうたい<\/rt><\/ruby>である。","症状の変動が少ないことが特徴である。":"<ruby>症状<rt>しょうじょう<\/rt><\/ruby>の<ruby>変動<rt>へんどう<\/rt><\/ruby>が<ruby>少<rt>すく<\/rt><\/ruby>ないことが<ruby>特徴<rt>とくちょう<\/rt><\/ruby>である。","夜間よりも日中に生じやすいことが特徴である。":"<ruby>夜間<rt>やかん<\/rt><\/ruby>よりも<ruby>日中<rt>にっちゅう<\/rt><\/ruby>に<ruby>生<rt>しょう<\/rt><\/ruby>じやすいことが<ruby>特徴<rt>とくちょう<\/rt><\/ruby>である。","認知機能障害がみられることはまれである。":"<ruby>認知機能障害<rt>にんちきのうしょうがい<\/rt><\/ruby>がみられることはまれである。","関与する因子を特定することが重要である。":"<ruby>関与<rt>かんよ<\/rt><\/ruby>する<ruby>因子<rt>いんし<\/rt><\/ruby>を<ruby>特定<rt>とくてい<\/rt><\/ruby>することが<ruby>重要<rt>じゅうよう<\/rt><\/ruby>である。","せん妄には、病気、薬剤、脱水、環境の変化などが関わります。原因となる要因を探して対応することが重要です。":"せん<ruby>妄<rt>もう<\/rt><\/ruby>には、<ruby>病気<rt>びょうき<\/rt><\/ruby>、<ruby>薬剤<rt>やくざい<\/rt><\/ruby>、<ruby>脱水<rt>だっすい<\/rt><\/ruby>、<ruby>環境<rt>かんきょう<\/rt><\/ruby>の<ruby>変化<rt>へんか<\/rt><\/ruby>などが<ruby>関わ<rt>かかわ<\/rt><\/ruby>ります。<ruby>原因<rt>げんいん<\/rt><\/ruby>となる<ruby>要因<rt>よういん<\/rt><\/ruby>を<ruby>探し<rt>さがし<\/rt><\/ruby>て<ruby>対応<rt>たいおう<\/rt><\/ruby>することが<ruby>重要<rt>じゅうよう<\/rt><\/ruby>です。","次の記述のうち，アルツハイマー型認知症（dementia of the Alzheimer’s type）の特徴として，適切なものを1 つ選びなさい。":"<ruby>次<rt>つぎ<\/rt><\/ruby>の<ruby>記述<rt>きじゅつ<\/rt><\/ruby>のうち，アルツハイマー<ruby>型認知症<rt>がたにんちしょう<\/rt><\/ruby>（dementia of the Alzheimer’s type）の<ruby>特徴<rt>とくちょう<\/rt><\/ruby>として，<ruby>適切<rt>てきせつ<\/rt><\/ruby>なものを1 つ<ruby>選<rt>えら<\/rt><\/ruby>びなさい。","近時記憶（新しい記憶）の障害は，初期から始まる。":"<ruby>近時記憶<rt>きんじきおく<\/rt><\/ruby>（<ruby>新<rt>あたら<\/rt><\/ruby>しい<ruby>記憶<rt>きおく<\/rt><\/ruby>）の<ruby>障害<rt>しょうがい<\/rt><\/ruby>は，<ruby>初期<rt>しょき<\/rt><\/ruby>から<ruby>始<rt>はじ<\/rt><\/ruby>まる。","特徴的な症状として幻視がある。":"<ruby>特徴的<rt>とくちょうてき<\/rt><\/ruby>な<ruby>症状<rt>しょうじょう<\/rt><\/ruby>として<ruby>幻視<rt>げんし<\/rt><\/ruby>がある。","脳にアミロイドβが沈着し始めると，すぐに発症する。":"<ruby>脳<rt>のう<\/rt><\/ruby>にアミロイドβが<ruby>沈着<rt>ちんちゃく<\/rt><\/ruby>し<ruby>始<rt>はじ<\/rt><\/ruby>めると，すぐに<ruby>発症<rt>はっしょう<\/rt><\/ruby>する。","歩行障害が多く現れるのは，初期の段階である。":"<ruby>歩行障害<rt>ほこうしょうがい<\/rt><\/ruby>が<ruby>多<rt>おお<\/rt><\/ruby>く<ruby>現<rt>あらわ<\/rt><\/ruby>れるのは，<ruby>初期<rt>しょき<\/rt><\/ruby>の<ruby>段階<rt>だんかい<\/rt><\/ruby>である。","嚥下障害が多く現れるのは，初期の段階である。":"<ruby>嚥下障害<rt>えんげしょうがい<\/rt><\/ruby>が<ruby>多<rt>おお<\/rt><\/ruby>く<ruby>現<rt>あらわ<\/rt><\/ruby>れるのは，<ruby>初期<rt>しょき<\/rt><\/ruby>の<ruby>段階<rt>だんかい<\/rt><\/ruby>である。","アルツハイマー型認知症では、新しい出来事を覚えにくくなる近時記憶の障害が、初期から見られます。":"アルツハイマー<ruby>型認知症<rt>がたにんちしょう<\/rt><\/ruby>では、<ruby>新しい<rt>あたらしい<\/rt><\/ruby><ruby>出来事<rt>できごと<\/rt><\/ruby>を<ruby>覚え<rt>おぼえ<\/rt><\/ruby>にくくなる<ruby>近時記憶<rt>きんじきおく<\/rt><\/ruby>の<ruby>障害<rt>しょうがい<\/rt><\/ruby>が、<ruby>初期<rt>しょき<\/rt><\/ruby>から<ruby>見ら<rt>みら<\/rt><\/ruby>れます。","次のうち，認知症（dementia）のリスクを高める要因として，最も適切なものを1 つ選びなさい。":"<ruby>次<rt>つぎ<\/rt><\/ruby>のうち，<ruby>認知症<rt>にんちしょう<\/rt><\/ruby>（dementia）のリスクを<ruby>高<rt>たか<\/rt><\/ruby>める<ruby>要因<rt>よういん<\/rt><\/ruby>として，<ruby>最<rt>もっと<\/rt><\/ruby>も<ruby>適切<rt>てきせつ<\/rt><\/ruby>なものを1 つ<ruby>選<rt>えら<\/rt><\/ruby>びなさい。","身体活動":"<ruby>身体活動<rt>しんたいかつどう<\/rt><\/ruby>","不飽和脂肪酸の摂取":"<ruby>不飽和脂肪酸<rt>ふほうわしぼうさん<\/rt><\/ruby>の<ruby>摂取<rt>せっしゅ<\/rt><\/ruby>","歯がなくなることによる咀嚼機能の低下":"<ruby>歯<rt>は<\/rt><\/ruby>がなくなることによる<ruby>咀嚼機能<rt>そしゃくきのう<\/rt><\/ruby>の<ruby>低下<rt>ていか<\/rt><\/ruby>","難聴による補聴器の使用":"<ruby>難聴<rt>なんちょう<\/rt><\/ruby>による<ruby>補聴器<rt>ほちょうき<\/rt><\/ruby>の<ruby>使用<rt>しよう<\/rt><\/ruby>","ボランティア活動":"ボランティア<ruby>活動<rt>かつどう<\/rt><\/ruby>","歯の喪失による咀嚼機能の低下は、認知症のリスクと関係します。口腔の健康を保つことが大切です。":"<ruby>歯<rt>は<\/rt><\/ruby>の<ruby>喪失<rt>そうしつ<\/rt><\/ruby>による<ruby>咀嚼機能<rt>そしゃくきのう<\/rt><\/ruby>の<ruby>低下<rt>ていか<\/rt><\/ruby>は、<ruby>認知症<rt>にんちしょう<\/rt><\/ruby>のリスクと<ruby>関係<rt>かんけい<\/rt><\/ruby>します。<ruby>口腔<rt>こうくう<\/rt><\/ruby>の<ruby>健康<rt>けんこう<\/rt><\/ruby>を<ruby>保つ<rt>たもつ<\/rt><\/ruby>ことが<ruby>大切<rt>たいせつ<\/rt><\/ruby>です。","次のうち，全般的な認知機能を評価する尺度であり，30 点満点で20 点以 下を認知症の目安とするものとして，正しいものを1 つ選びなさい。":"<ruby>次<rt>つぎ<\/rt><\/ruby>のうち，<ruby>全般的<rt>ぜんぱんてき<\/rt><\/ruby>な<ruby>認知機能<rt>にんちきのう<\/rt><\/ruby>を<ruby>評価<rt>ひょうか<\/rt><\/ruby>する<ruby>尺度<rt>しゃくど<\/rt><\/ruby>であり，30 <ruby>点満点<rt>てんまんてん<\/rt><\/ruby>で20 <ruby>点以<rt>てんい<\/rt><\/ruby> <ruby>下<rt>か<\/rt><\/ruby>を<ruby>認知症<rt>にんちしょう<\/rt><\/ruby>の<ruby>目安<rt>めやす<\/rt><\/ruby>とするものとして，<ruby>正<rt>ただ<\/rt><\/ruby>しいものを1 つ<ruby>選<rt>えら<\/rt><\/ruby>びなさい。","バーセルインデックス（Barthel Index）":"バーセルインデックス（Barthel Index）","改訂長谷川式認知症スケール（HDS-R）":"<ruby>改訂長谷川式認知症<rt>かいていはせがわしきにんちしょう<\/rt><\/ruby>スケール（HDS-R）","ＦＡＳＴ（Functional Assessment Staging）":"ＦＡＳＴ（Functional Assessment Staging）","認知症高齢者の日常生活自立度判定基準":"<ruby>認知症高齢者<rt>にんちしょうこうれいしゃ<\/rt><\/ruby>の<ruby>日常生活自立度判定基準<rt>にちじょうせいかつじりつどはんていきじゅん<\/rt><\/ruby>","臨床的認知症尺度（ＣＤＲ：Clinical Dementia Rating）":"<ruby>臨床的認知症尺度<rt>りんしょうてきにんちしょうしゃくど<\/rt><\/ruby>（ＣＤＲ：Clinical Dementia Rating）","改訂長谷川式認知症スケールは三十点満点で、二十点以下が認知症を疑う目安です。診断は総合的に行います。":"<ruby>改訂長谷川式認知症<rt>かいていはせがわしきにんちしょう<\/rt><\/ruby>スケールは<ruby>三十<rt>さんじゅう<\/rt><\/ruby><ruby>点満点<rt>てんまんてん<\/rt><\/ruby>で、<ruby>二十点以下<rt>にじゅってんいか<\/rt><\/ruby>が<ruby>認知症<rt>にんちしょう<\/rt><\/ruby>を<ruby>疑う<rt>うたがう<\/rt><\/ruby><ruby>目安<rt>めやす<\/rt><\/ruby>です。<ruby>診断<rt>しんだん<\/rt><\/ruby>は<ruby>総合的<rt>そうごうてき<\/rt><\/ruby>に<ruby>行い<rt>おこない<\/rt><\/ruby>ます。","次の記述のうち，「認知症（dementia）の人の日常生活・社会生活における意思決定支援ガイドライン」（2018 年（平成30 年）（厚生労働省））で示されている，意思決定支援として，最も適切なものを1 つ選びなさい。":"<ruby>次<rt>つぎ<\/rt><\/ruby>の<ruby>記述<rt>きじゅつ<\/rt><\/ruby>のうち，「<ruby>認知症<rt>にんちしょう<\/rt><\/ruby>（dementia）の<ruby>人<rt>ひと<\/rt><\/ruby>の<ruby>日常生活<rt>にちじょうせいかつ<\/rt><\/ruby>・<ruby>社会生活<rt>しゃかいせいかつ<\/rt><\/ruby>における<ruby>意思決定支援<rt>いしけっていしえん<\/rt><\/ruby>ガイドライン」（2018 <ruby>年<rt>ねん<\/rt><\/ruby>（<ruby>平成<rt>へいせい<\/rt><\/ruby>30 <ruby>年<rt>ねん<\/rt><\/ruby>）（<ruby>厚生労働省<rt>こうせいろうどうしょう<\/rt><\/ruby>））で<ruby>示<rt>しめ<\/rt><\/ruby>されている，<ruby>意思決定支援<rt>いしけっていしえん<\/rt><\/ruby>として，<ruby>最<rt>もっと<\/rt><\/ruby>も<ruby>適切<rt>てきせつ<\/rt><\/ruby>なものを1 つ<ruby>選<rt>えら<\/rt><\/ruby>びなさい。","認知症（dementia）の人の家族の意思を支援することである。":"<ruby>認知症<rt>にんちしょう<\/rt><\/ruby>（dementia）の<ruby>人<rt>ひと<\/rt><\/ruby>の<ruby>家族<rt>かぞく<\/rt><\/ruby>の<ruby>意思<rt>いし<\/rt><\/ruby>を<ruby>支援<rt>しえん<\/rt><\/ruby>することである。","意思決定支援者は特定の職種に限定される。":"<ruby>意思決定支援者<rt>いしけっていしえんしゃ<\/rt><\/ruby>は<ruby>特定<rt>とくてい<\/rt><\/ruby>の<ruby>職種<rt>しょくしゅ<\/rt><\/ruby>に<ruby>限定<rt>げんてい<\/rt><\/ruby>される。","一度，意思決定したら，最後まで同じ内容で支援する。":"<ruby>一度<rt>いちど<\/rt><\/ruby>，<ruby>意思決定<rt>いしけってい<\/rt><\/ruby>したら，<ruby>最後<rt>さいご<\/rt><\/ruby>まで<ruby>同<rt>おな<\/rt><\/ruby>じ<ruby>内容<rt>ないよう<\/rt><\/ruby>で<ruby>支援<rt>しえん<\/rt><\/ruby>する。","看取りの場面になってから支援を開始する。":"<ruby>看取<rt>みと<\/rt><\/ruby>りの<ruby>場面<rt>ばめん<\/rt><\/ruby>になってから<ruby>支援<rt>しえん<\/rt><\/ruby>を<ruby>開始<rt>かいし<\/rt><\/ruby>する。","身振りや表情の変化も意思表示として読み取る努力を最大限に行う。":"<ruby>身振<rt>みぶ<\/rt><\/ruby>りや<ruby>表情<rt>ひょうじょう<\/rt><\/ruby>の<ruby>変化<rt>へんか<\/rt><\/ruby>も<ruby>意思表示<rt>いしひょうじ<\/rt><\/ruby>として<ruby>読<rt>よ<\/rt><\/ruby>み<ruby>取<rt>と<\/rt><\/ruby>る<ruby>努力<rt>どりょく<\/rt><\/ruby>を<ruby>最大限<rt>さいだいげん<\/rt><\/ruby>に<ruby>行<rt>おこな<\/rt><\/ruby>う。","言葉だけでなく、表情や身振りにも本人の意思が表れます。それを読み取る努力が求められます。":"<ruby>言葉<rt>ことば<\/rt><\/ruby>だけでなく、<ruby>表情<rt>ひょうじょう<\/rt><\/ruby>や<ruby>身振<rt>みぶ<\/rt><\/ruby>りにも<ruby>本人<rt>ほんにん<\/rt><\/ruby>の<ruby>意思<rt>いし<\/rt><\/ruby>が<ruby>表れ<rt>あらわれ<\/rt><\/ruby>ます。それを<ruby>読み取る<rt>よみとる<\/rt><\/ruby><ruby>努力<rt>どりょく<\/rt><\/ruby>が<ruby>求め<rt>もとめ<\/rt><\/ruby>られます。","次の記述のうち，回想法として，最も適切なものを1 つ選びなさい。":"<ruby>次<rt>つぎ<\/rt><\/ruby>の<ruby>記述<rt>きじゅつ<\/rt><\/ruby>のうち，<ruby>回想法<rt>かいそうほう<\/rt><\/ruby>として，<ruby>最<rt>もっと<\/rt><\/ruby>も<ruby>適切<rt>てきせつ<\/rt><\/ruby>なものを1 つ<ruby>選<rt>えら<\/rt><\/ruby>びなさい。","肩や背中から優しくゆっくりと触れる。":"<ruby>肩<rt>かた<\/rt><\/ruby>や<ruby>背中<rt>せなか<\/rt><\/ruby>から<ruby>優<rt>やさ<\/rt><\/ruby>しくゆっくりと<ruby>触<rt>ふ<\/rt><\/ruby>れる。","共感を通して，認知症（dementia）の人が体験している現実を受け入れる。":"<ruby>共感<rt>きょうかん<\/rt><\/ruby>を<ruby>通<rt>とお<\/rt><\/ruby>して，<ruby>認知症<rt>にんちしょう<\/rt><\/ruby>（dementia）の<ruby>人<rt>ひと<\/rt><\/ruby>が<ruby>体験<rt>たいけん<\/rt><\/ruby>している<ruby>現実<rt>げんじつ<\/rt><\/ruby>を<ruby>受<rt>う<\/rt><\/ruby>け<ruby>入<rt>い<\/rt><\/ruby>れる。","見当識を高めるために，時間や場所，現在の状況を説明する。":"<ruby>見当識<rt>けんとうしき<\/rt><\/ruby>を<ruby>高<rt>たか<\/rt><\/ruby>めるために，<ruby>時間<rt>じかん<\/rt><\/ruby>や<ruby>場所<rt>ばしょ<\/rt><\/ruby>，<ruby>現在<rt>げんざい<\/rt><\/ruby>の<ruby>状況<rt>じょうきょう<\/rt><\/ruby>を<ruby>説明<rt>せつめい<\/rt><\/ruby>する。","昔の写真や音楽を活用して，記憶を活性化する。":"<ruby>昔<rt>むかし<\/rt><\/ruby>の<ruby>写真<rt>しゃしん<\/rt><\/ruby>や<ruby>音楽<rt>おんがく<\/rt><\/ruby>を<ruby>活用<rt>かつよう<\/rt><\/ruby>して，<ruby>記憶<rt>きおく<\/rt><\/ruby>を<ruby>活性化<rt>かっせいか<\/rt><\/ruby>する。","残存能力を活用し，共同作業を通して仲間をつくる。":"<ruby>残存能力<rt>ざんぞんのうりょく<\/rt><\/ruby>を<ruby>活用<rt>かつよう<\/rt><\/ruby>し，<ruby>共同作業<rt>きょうどうさぎょう<\/rt><\/ruby>を<ruby>通<rt>とお<\/rt><\/ruby>して<ruby>仲間<rt>なかま<\/rt><\/ruby>をつくる。","回想法は、懐かしい写真や音楽などを手がかりに過去の経験を語り、記憶や交流を促す方法です。":"<ruby>回想法<rt>かいそうほう<\/rt><\/ruby>は、<ruby>懐かしい<rt>なつかしい<\/rt><\/ruby><ruby>写真<rt>しゃしん<\/rt><\/ruby>や<ruby>音楽<rt>おんがく<\/rt><\/ruby>などを<ruby>手がかり<rt>てがかり<\/rt><\/ruby>に<ruby>過去<rt>かこ<\/rt><\/ruby>の<ruby>経験<rt>けいけん<\/rt><\/ruby>を<ruby>語り<rt>かたり<\/rt><\/ruby>、<ruby>記憶<rt>きおく<\/rt><\/ruby>や<ruby>交流<rt>こうりゅう<\/rt><\/ruby>を<ruby>促す<rt>うながす<\/rt><\/ruby><ruby>方法<rt>ほうほう<\/rt><\/ruby>です。","次の記述のうち，認知症疾患医療センターの説明として，適切なものを1 つ選びなさい。":"<ruby>次<rt>つぎ<\/rt><\/ruby>の<ruby>記述<rt>きじゅつ<\/rt><\/ruby>のうち，<ruby>認知症疾患医療<rt>にんちしょうしっかんいりょう<\/rt><\/ruby>センターの<ruby>説明<rt>せつめい<\/rt><\/ruby>として，<ruby>適切<rt>てきせつ<\/rt><\/ruby>なものを1 つ<ruby>選<rt>えら<\/rt><\/ruby>びなさい。","事業の実施主体は，市町村である。":"<ruby>事業<rt>じぎょう<\/rt><\/ruby>の<ruby>実施主体<rt>じっししゅたい<\/rt><\/ruby>は，<ruby>市町村<rt>しちょうそん<\/rt><\/ruby>である。","都道府県ごとに，1 か所の設置が義務づけられている。":"<ruby>都道府県<rt>とどうふけん<\/rt><\/ruby>ごとに，1 か<ruby>所<rt>しょ<\/rt><\/ruby>の<ruby>設置<rt>せっち<\/rt><\/ruby>が<ruby>義務<rt>ぎむ<\/rt><\/ruby>づけられている。","認知症（dementia）の鑑別診断を行う。":"<ruby>認知症<rt>にんちしょう<\/rt><\/ruby>（dementia）の<ruby>鑑別診断<rt>かんべつしんだん<\/rt><\/ruby>を<ruby>行<rt>おこな<\/rt><\/ruby>う。","主に認知症（dementia）が進行した人の入院治療を行う。":"<ruby>主<rt>おも<\/rt><\/ruby>に<ruby>認知症<rt>にんちしょう<\/rt><\/ruby>（dementia）が<ruby>進行<rt>しんこう<\/rt><\/ruby>した<ruby>人<rt>ひと<\/rt><\/ruby>の<ruby>入院治療<rt>にゅういんちりょう<\/rt><\/ruby>を<ruby>行<rt>おこな<\/rt><\/ruby>う。","介護保険法に定められている。":"<ruby>介護保険法<rt>かいごほけんほう<\/rt><\/ruby>に<ruby>定<rt>さだ<\/rt><\/ruby>められている。","認知症疾患医療センターは、認知症の鑑別診断や専門的な相談、地域との連携などを行います。":"<ruby>認知症疾患医療<rt>にんちしょうしっかんいりょう<\/rt><\/ruby>センターは、<ruby>認知症<rt>にんちしょう<\/rt><\/ruby>の<ruby>鑑別診断<rt>かんべつしんだん<\/rt><\/ruby>や<ruby>専門的<rt>せんもんてき<\/rt><\/ruby>な<ruby>相談<rt>そうだん<\/rt><\/ruby>、<ruby>地域<rt>ちいき<\/rt><\/ruby>との<ruby>連携<rt>れんけい<\/rt><\/ruby>などを<ruby>行い<rt>おこない<\/rt><\/ruby>ます。","Ｂさん（87 歳，男性）は，一人暮らしである。玄関前で，脱水で倒れているところを発見され，救急搬送された。入院中，認知症（dementia）の疑いがある行動が見られた。Ｂさんは，「自宅で暮らしたい」と強く希望していた。退院後，Ｂさんは外出して自宅に戻れなくなることがあった。近所の人たちが，Ｂさんの生活を心配して，地域包括支援センターに相談した結果，認知症初期集中支援チームが編成された。次の記述のうち，Ｂさんに対して認知症初期集中支援チームが行う支援として，最も適切なものを1 つ選びなさい。":"Ｂさん（87 <ruby>歳<rt>さい<\/rt><\/ruby>，<ruby>男性<rt>だんせい<\/rt><\/ruby>）は，<ruby>一人暮<rt>ひとりぐ<\/rt><\/ruby>らしである。<ruby>玄関前<rt>げんかんまえ<\/rt><\/ruby>で，<ruby>脱水<rt>だっすい<\/rt><\/ruby>で<ruby>倒<rt>たお<\/rt><\/ruby>れているところを<ruby>発見<rt>はっけん<\/rt><\/ruby>され，<ruby>救急搬送<rt>きゅうきゅうはんそう<\/rt><\/ruby>された。<ruby>入院中<rt>にゅういんちゅう<\/rt><\/ruby>，<ruby>認知症<rt>にんちしょう<\/rt><\/ruby>（dementia）の<ruby>疑<rt>うたが<\/rt><\/ruby>いがある<ruby>行動<rt>こうどう<\/rt><\/ruby>が<ruby>見<rt>み<\/rt><\/ruby>られた。Ｂさんは，「<ruby>自宅<rt>じたく<\/rt><\/ruby>で<ruby>暮<rt>く<\/rt><\/ruby>らしたい」と<ruby>強<rt>つよ<\/rt><\/ruby>く<ruby>希望<rt>きぼう<\/rt><\/ruby>していた。<ruby>退院後<rt>たいいんご<\/rt><\/ruby>，Ｂさんは<ruby>外出<rt>がいしゅつ<\/rt><\/ruby>して<ruby>自宅<rt>じたく<\/rt><\/ruby>に<ruby>戻<rt>もど<\/rt><\/ruby>れなくなることがあった。<ruby>近所<rt>きんじょ<\/rt><\/ruby>の<ruby>人<rt>ひと<\/rt><\/ruby>たちが，Ｂさんの<ruby>生活<rt>せいかつ<\/rt><\/ruby>を<ruby>心配<rt>しんぱい<\/rt><\/ruby>して，<ruby>地域包括支援<rt>ちいきほうかつしえん<\/rt><\/ruby>センターに<ruby>相談<rt>そうだん<\/rt><\/ruby>した<ruby>結果<rt>けっか<\/rt><\/ruby>，<ruby>認知症初期集中支援<rt>にんちしょうしょきしゅうちゅうしえん<\/rt><\/ruby>チームが<ruby>編成<rt>へんせい<\/rt><\/ruby>された。<ruby>次<rt>つぎ<\/rt><\/ruby>の<ruby>記述<rt>きじゅつ<\/rt><\/ruby>のうち，Ｂさんに<ruby>対<rt>たい<\/rt><\/ruby>して<ruby>認知症初期集中支援<rt>にんちしょうしょきしゅうちゅうしえん<\/rt><\/ruby>チームが<ruby>行<rt>おこな<\/rt><\/ruby>う<ruby>支援<rt>しえん<\/rt><\/ruby>として，<ruby>最<rt>もっと<\/rt><\/ruby>も<ruby>適切<rt>てきせつ<\/rt><\/ruby>なものを1 つ<ruby>選<rt>えら<\/rt><\/ruby>びなさい。","金銭管理を行う。":"<ruby>金銭管理<rt>きんせんかんり<\/rt><\/ruby>を<ruby>行<rt>おこな<\/rt><\/ruby>う。","支援方針を検討する。":"<ruby>支援方針<rt>しえんほうしん<\/rt><\/ruby>を<ruby>検討<rt>けんとう<\/rt><\/ruby>する。","居宅サービス計画書を作成する。":"<ruby>居宅<rt>きょたく<\/rt><\/ruby>サービス<ruby>計画書<rt>けいかくしょ<\/rt><\/ruby>を<ruby>作成<rt>さくせい<\/rt><\/ruby>する。","介護保険サービスを契約する。":"<ruby>介護保険<rt>かいごほけん<\/rt><\/ruby>サービスを<ruby>契約<rt>けいやく<\/rt><\/ruby>する。","法定後見を行う。":"<ruby>法定後見<rt>ほうていこうけん<\/rt><\/ruby>を<ruby>行<rt>おこな<\/rt><\/ruby>う。","認知症初期集中支援チームは、本人や家族の状況を把握し、支援方針を検討して適切な支援につなげます。":"<ruby>認知症初期集中支援<rt>にんちしょうしょきしゅうちゅうしえん<\/rt><\/ruby>チームは、<ruby>本人<rt>ほんにん<\/rt><\/ruby>や<ruby>家族<rt>かぞく<\/rt><\/ruby>の<ruby>状況<rt>じょうきょう<\/rt><\/ruby>を<ruby>把握<rt>はあく<\/rt><\/ruby>し、<ruby>支援方針<rt>しえんほうしん<\/rt><\/ruby>を<ruby>検討<rt>けんとう<\/rt><\/ruby>して<ruby>適切<rt>てきせつ<\/rt><\/ruby>な<ruby>支援<rt>しえん<\/rt><\/ruby>につなげます。","次のうち，ＩＣＦ（International Classification of Functioning, Disability and Health：国際生活機能分類）の社会（人生）レベルに該当するものとして，正しいものを1 つ選びなさい。":"<ruby>次<rt>つぎ<\/rt><\/ruby>のうち，ＩＣＦ（International Classification of Functioning, Disability and Health：<ruby>国際生活機能分類<rt>こくさいせいかつきのうぶんるい<\/rt><\/ruby>）の<ruby>社会<rt>しゃかい<\/rt><\/ruby>（<ruby>人生<rt>じんせい<\/rt><\/ruby>）レベルに<ruby>該当<rt>がいとう<\/rt><\/ruby>するものとして，<ruby>正<rt>ただ<\/rt><\/ruby>しいものを1 つ<ruby>選<rt>えら<\/rt><\/ruby>びなさい。","心身機能・身体構造":"<ruby>心身機能<rt>しんしんきのう<\/rt><\/ruby>・<ruby>身体構造<rt>しんたいこうぞう<\/rt><\/ruby>","活動":"<ruby>活動<rt>かつどう<\/rt><\/ruby>","参加":"<ruby>参加<rt>さんか<\/rt><\/ruby>","機能障害":"<ruby>機能障害<rt>きのうしょうがい<\/rt><\/ruby>","活動制限":"<ruby>活動制限<rt>かつどうせいげん<\/rt><\/ruby>","国際生活機能分類の参加は、生活や社会の場面に関わることです。社会・人生の水準に位置付けられます。":"<ruby>国際生活機能分類<rt>こくさいせいかつきのうぶんるい<\/rt><\/ruby>の<ruby>参加<rt>さんか<\/rt><\/ruby>は、<ruby>生活<rt>せいかつ<\/rt><\/ruby>や<ruby>社会<rt>しゃかい<\/rt><\/ruby>の<ruby>場面<rt>ばめん<\/rt><\/ruby>に<ruby>関わ<rt>かかわ<\/rt><\/ruby>ることです。<ruby>社会<rt>しゃかい<\/rt><\/ruby>・<ruby>人生<rt>じんせい<\/rt><\/ruby>の<ruby>水準<rt>すいじゅん<\/rt><\/ruby>に<ruby>位置<rt>いち<\/rt><\/ruby><ruby>付け<rt>つけ<\/rt><\/ruby>られます。","次の記述のうち，障害者のエンパワメントに関するものとして，最も適切なものを1 つ選びなさい。":"<ruby>次<rt>つぎ<\/rt><\/ruby>の<ruby>記述<rt>きじゅつ<\/rt><\/ruby>のうち，<ruby>障害者<rt>しょうがいしゃ<\/rt><\/ruby>のエンパワメントに<ruby>関<rt>かん<\/rt><\/ruby>するものとして，<ruby>最<rt>もっと<\/rt><\/ruby>も<ruby>適<rt>てき<\/rt><\/ruby><ruby>切<rt>せつ<\/rt><\/ruby>なものを1 つ<ruby>選<rt>えら<\/rt><\/ruby>びなさい。","障害のある人が障害のない人と同等に生活し，活動する社会を目指す。":"<ruby>障害<rt>しょうがい<\/rt><\/ruby>のある<ruby>人<rt>ひと<\/rt><\/ruby>が<ruby>障害<rt>しょうがい<\/rt><\/ruby>のない<ruby>人<rt>ひと<\/rt><\/ruby>と<ruby>同等<rt>どうとう<\/rt><\/ruby>に<ruby>生活<rt>せいかつ<\/rt><\/ruby>し，<ruby>活動<rt>かつどう<\/rt><\/ruby>する<ruby>社会<rt>しゃかい<\/rt><\/ruby>を<ruby>目指<rt>めざ<\/rt><\/ruby>す。","専門職が主導し，障害がある人は受動的に支援を受ける。":"<ruby>専門職<rt>せんもんしょく<\/rt><\/ruby>が<ruby>主導<rt>しゅどう<\/rt><\/ruby>し，<ruby>障害<rt>しょうがい<\/rt><\/ruby>がある<ruby>人<rt>ひと<\/rt><\/ruby>は<ruby>受動的<rt>じゅどうてき<\/rt><\/ruby>に<ruby>支援<rt>しえん<\/rt><\/ruby>を<ruby>受<rt>う<\/rt><\/ruby>ける。","障害のある人が自らの能力や長所に気づき，課題に対応する。":"<ruby>障害<rt>しょうがい<\/rt><\/ruby>のある<ruby>人<rt>ひと<\/rt><\/ruby>が<ruby>自<rt>みずか<\/rt><\/ruby>らの<ruby>能力<rt>のうりょく<\/rt><\/ruby>や<ruby>長所<rt>ちょうしょ<\/rt><\/ruby>に<ruby>気<rt>き<\/rt><\/ruby>づき，<ruby>課題<rt>かだい<\/rt><\/ruby>に<ruby>対応<rt>たいおう<\/rt><\/ruby>する。","障害のある人が，主体性や人権が守られないことに耐える。":"<ruby>障害<rt>しょうがい<\/rt><\/ruby>のある<ruby>人<rt>ひと<\/rt><\/ruby>が，<ruby>主体性<rt>しゅたいせい<\/rt><\/ruby>や<ruby>人権<rt>じんけん<\/rt><\/ruby>が<ruby>守<rt>まも<\/rt><\/ruby>られないことに<ruby>耐<rt>た<\/rt><\/ruby>える。","障害のある人が，医学的リハビリテーションを受ける。":"<ruby>障害<rt>しょうがい<\/rt><\/ruby>のある<ruby>人<rt>ひと<\/rt><\/ruby>が，<ruby>医学的<rt>いがくてき<\/rt><\/ruby>リハビリテーションを<ruby>受<rt>う<\/rt><\/ruby>ける。","エンパワメントは、本人が自分の力や長所を認識し、主体的に課題へ対応できるように支える考え方です。":"エンパワメントは、<ruby>本人<rt>ほんにん<\/rt><\/ruby>が<ruby>自分<rt>じぶん<\/rt><\/ruby>の<ruby>力<rt>ちから<\/rt><\/ruby>や<ruby>長所<rt>ちょうしょ<\/rt><\/ruby>を<ruby>認識<rt>にんしき<\/rt><\/ruby>し、<ruby>主体的<rt>しゅたいてき<\/rt><\/ruby>に<ruby>課題<rt>かだい<\/rt><\/ruby>へ<ruby>対応<rt>たいおう<\/rt><\/ruby>できるように<ruby>支え<rt>ささえ<\/rt><\/ruby>る<ruby>考え方<rt>かんがえかた<\/rt><\/ruby>です。","次のうち，クローン病（Crohn disease）にみられる特徴的な症状として，最も適切なものを1 つ選びなさい。":"<ruby>次<rt>つぎ<\/rt><\/ruby>のうち，クローン<ruby>病<rt>びょう<\/rt><\/ruby>（Crohn disease）にみられる<ruby>特徴的<rt>とくちょうてき<\/rt><\/ruby>な<ruby>症状<rt>しょうじょう<\/rt><\/ruby>として，<ruby>最<rt>もっと<\/rt><\/ruby>も<ruby>適切<rt>てきせつ<\/rt><\/ruby>なものを1 つ<ruby>選<rt>えら<\/rt><\/ruby>びなさい。","視力低下":"<ruby>視力低下<rt>しりょくていか<\/rt><\/ruby>","栄養障害":"<ruby>栄養障害<rt>えいようしょうがい<\/rt><\/ruby>","咳嗽":"<ruby>咳嗽<rt>がいそう<\/rt><\/ruby>","運動失調":"<ruby>運動失調<rt>うんどうしっちょう<\/rt><\/ruby>","関節痛":"<ruby>関節痛<rt>かんせつつう<\/rt><\/ruby>","クローン病では、消化管の炎症などによって栄養の吸収が障害され、栄養障害が生じることがあります。":"クローン<ruby>病<rt>びょう<\/rt><\/ruby>では、<ruby>消化<rt>しょうか<\/rt><\/ruby><ruby>管<rt>かん<\/rt><\/ruby>の<ruby>炎症<rt>えんしょう<\/rt><\/ruby>などによって<ruby>栄養<rt>えいよう<\/rt><\/ruby>の<ruby>吸収<rt>きゅうしゅう<\/rt><\/ruby>が<ruby>障害<rt>しょうがい<\/rt><\/ruby>され、<ruby>栄養障害<rt>えいようしょうがい<\/rt><\/ruby>が<ruby>生じ<rt>しょうじ<\/rt><\/ruby>ることがあります。","次の記述のうち，遂行機能障害の特徴として，最も適切なものを1 つ選びなさい。":"<ruby>次<rt>つぎ<\/rt><\/ruby>の<ruby>記述<rt>きじゅつ<\/rt><\/ruby>のうち，<ruby>遂行機能障害<rt>すいこうきのうしょうがい<\/rt><\/ruby>の<ruby>特徴<rt>とくちょう<\/rt><\/ruby>として，<ruby>最<rt>もっと<\/rt><\/ruby>も<ruby>適切<rt>てきせつ<\/rt><\/ruby>なものを1 つ<ruby>選<rt>えら<\/rt><\/ruby>びなさい。","些細なことですぐに興奮して怒鳴る。":"<ruby>些細<rt>ささい<\/rt><\/ruby>なことですぐに<ruby>興奮<rt>こうふん<\/rt><\/ruby>して<ruby>怒鳴<rt>どな<\/rt><\/ruby>る。","新しい知識を覚えることが困難である。":"<ruby>新<rt>あたら<\/rt><\/ruby>しい<ruby>知識<rt>ちしき<\/rt><\/ruby>を<ruby>覚<rt>おぼ<\/rt><\/ruby>えることが<ruby>困難<rt>こんなん<\/rt><\/ruby>である。","ぼんやりして周囲に注意を向け続けることが困難である。":"ぼんやりして<ruby>周囲<rt>しゅうい<\/rt><\/ruby>に<ruby>注意<rt>ちゅうい<\/rt><\/ruby>を<ruby>向<rt>む<\/rt><\/ruby>け<ruby>続<rt>つづ<\/rt><\/ruby>けることが<ruby>困難<rt>こんなん<\/rt><\/ruby>である。","行動を計画して実行することが困難である。":"<ruby>行動<rt>こうどう<\/rt><\/ruby>を<ruby>計画<rt>けいかく<\/rt><\/ruby>して<ruby>実行<rt>じっこう<\/rt><\/ruby>することが<ruby>困難<rt>こんなん<\/rt><\/ruby>である。","言葉の表出や理解が困難である。":"<ruby>言葉<rt>ことば<\/rt><\/ruby>の<ruby>表出<rt>ひょうしゅつ<\/rt><\/ruby>や<ruby>理解<rt>りかい<\/rt><\/ruby>が<ruby>困難<rt>こんなん<\/rt><\/ruby>である。","遂行機能障害では、目標に向けて計画を立て、順序よく実行することが難しくなります。":"<ruby>遂行機能障害<rt>すいこうきのうしょうがい<\/rt><\/ruby>では、<ruby>目標<rt>もくひょう<\/rt><\/ruby>に<ruby>向け<rt>むけ<\/rt><\/ruby>て<ruby>計画<rt>けいかく<\/rt><\/ruby>を<ruby>立て<rt>たて<\/rt><\/ruby>、<ruby>順序<rt>じゅんじょ<\/rt><\/ruby>よく<ruby>実行<rt>じっこう<\/rt><\/ruby>することが<ruby>難しく<rt>むずかしく<\/rt><\/ruby>なります。","視覚障害の特徴と視覚障害者の生活支援に関する次の記述のうち，最も適切なものを1 つ選びなさい。":"<ruby>視覚障害<rt>しかくしょうがい<\/rt><\/ruby>の<ruby>特徴<rt>とくちょう<\/rt><\/ruby>と<ruby>視覚障害者<rt>しかくしょうがいしゃ<\/rt><\/ruby>の<ruby>生活支援<rt>せいかつしえん<\/rt><\/ruby>に<ruby>関<rt>かん<\/rt><\/ruby>する<ruby>次<rt>つぎ<\/rt><\/ruby>の<ruby>記述<rt>きじゅつ<\/rt><\/ruby>のうち，<ruby>最<rt>もっと<\/rt><\/ruby>も<ruby>適切<rt>てきせつ<\/rt><\/ruby>なものを1 つ<ruby>選<rt>えら<\/rt><\/ruby>びなさい。","ロービジョンは，視覚情報をまったく得られない状態である。":"ロービジョンは，<ruby>視覚情報<rt>しかくじょうほう<\/rt><\/ruby>をまったく<ruby>得<rt>え<\/rt><\/ruby>られない<ruby>状態<rt>じょうたい<\/rt><\/ruby>である。","中途視覚障害者は，先天性の障害に比べて障害を受容しやすい。":"<ruby>中途視覚障害者<rt>ちゅうとしかくしょうがいし い<\/rt><\/ruby>すべきこととして，<ruby>最<rt>もっと<\/rt><\/ruby>も<ruby>適<rt>てき<\/rt><\/ruby><ruby>切<rt>せつ<\/rt><\/ruby>なものを1 つ<ruby>選<rt>えら<\/rt><\/ruby>びなさい。","安静時振戦":"<ruby>安静時振戦<rt>あんせいじしんせん<\/rt><\/ruby>","筋固縮":"<ruby>筋固縮<rt>きんこしゅく<\/rt><\/ruby>","仮面様顔貌":"<ruby>仮面様顔貌<rt>かめんようがんぼう<\/rt><\/ruby>","誤嚥":"<ruby>誤嚥<rt>ごえん<\/rt><\/ruby>","便秘":"<ruby>便秘<rt>べんぴ<\/rt><\/ruby>","食事に時間がかかり、声のかすれもあるため、嚥下機能の低下や誤嚥に注意し、医療職と連携します。":"<ruby>食事<rt>しょくじ<\/rt><\/ruby>に<ruby>時間<rt>じかん<\/rt><\/ruby>がかかり、<ruby>声<rt>こえ<\/rt><\/ruby>のかすれもあるため、<ruby>嚥下機能<rt>えんげきのう<\/rt><\/ruby>の<ruby>低下<rt>ていか<\/rt><\/ruby>や<ruby>誤嚥<rt>ごえん<\/rt><\/ruby>に<ruby>注意<rt>ちゅうい<\/rt><\/ruby>し、<ruby>医療<rt>いりょう<\/rt><\/ruby><ruby>職<rt>しょく<\/rt><\/ruby>と<ruby>連携<rt>れんけい<\/rt><\/ruby>します。","聴覚障害者の特徴や支援の方法に関する次の記述のうち，最も適切なものを1 つ選びなさい。":"<ruby>聴覚障害者<rt>ちょうかくしょうがいしゃ<\/rt><\/ruby>の<ruby>特徴<rt>とくちょう<\/rt><\/ruby>や<ruby>支援<rt>しえん<\/rt><\/ruby>の<ruby>方法<rt>ほうほう<\/rt><\/ruby>に<ruby>関<rt>かん<\/rt><\/ruby>する<ruby>次<rt>つぎ<\/rt><\/ruby>の<ruby>記述<rt>きじゅつ<\/rt><\/ruby>のうち，<ruby>最<rt>もっと<\/rt><\/ruby>も<ruby>適切<rt>てきせつ<\/rt><\/ruby>なものを1 つ<ruby>選<rt>えら<\/rt><\/ruby>びなさい。","要約筆記によって意思疎通を補う。":"<ruby>要約筆記<rt>ようやくひっき<\/rt><\/ruby>によって<ruby>意思疎通<rt>いしそつう<\/rt><\/ruby>を<ruby>補<rt>おぎな<\/rt><\/ruby>う。","軽度の聴覚障害を「ろう」という。":"<ruby>軽度<rt>けいど<\/rt><\/ruby>の<ruby>聴覚障害<rt>ちょうかくしょうがい<\/rt><\/ruby>を「ろう」という。","フラッシュベルは周囲の音を増幅させて伝える。":"フラッシュベルは<ruby>周囲<rt>しゅうい<\/rt><\/ruby>の<ruby>音<rt>おと<\/rt><\/ruby>を<ruby>増幅<rt>ぞうふく<\/rt><\/ruby>させて<ruby>伝<rt>つた<\/rt><\/ruby>える。","手話は意思の伝達に役立たない。":"<ruby>手話<rt>しゅわ<\/rt><\/ruby>は<ruby>意思<rt>いし<\/rt><\/ruby>の<ruby>伝達<rt>でんたつ<\/rt><\/ruby>に<ruby>役立<rt>やくだ<\/rt><\/ruby>たない。","両耳の聴力レベルが40 dB で身体障害者手帳が交付される。":"<ruby>両耳<rt>りょうみみ<\/rt><\/ruby>の<ruby>聴力<rt>ちょうりょく<\/rt><\/ruby>レベルが40 dB で<ruby>身体障害者手帳<rt>しんたいしょうがいしゃてちょう<\/rt><\/ruby>が<ruby>交付<rt>こうふ<\/rt><\/ruby>される。","要約筆記は、話の内容を文字で伝える支援です。聴覚障害のある人の意思疎通を補います。":"<ruby>要約筆記<rt>ようやくひっき<\/rt><\/ruby>は、<ruby>話<rt>はなし<\/rt><\/ruby>の<ruby>内容<rt>ないよう<\/rt><\/ruby>を<ruby>文字<rt>もじ<\/rt><\/ruby>で<ru
