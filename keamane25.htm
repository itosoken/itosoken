/* <![CDATA[ */
(()=>{
'use strict';
const host=document.currentScript.previousElementSibling;
const root=host.attachShadow({mode:'open'});
const QUESTIONS=[{"id":1,"subject":0,"question":"介護保険制度の考え方として適切なものはどれか。3つ選べ。","options":["要介護者の尊厳を保持し、自立した日常生活を営むことを目指す。","高齢者の介護を社会全体で支える。","認知症高齢者の施設入所を促進する。","要介護者へのサービスを画一的な内容にする。","保険給付は、多様な事業者又は施設から、総合的かつ効率的にサービスが提供されるよう配慮する。"],"answer":[1,2,5],"sourcePage":3,"explanation":"介護保険は尊厳の保持と自立支援を基本とし、介護を社会全体で支えます。本人の状況に合うサービスを、多様な事業者から総合的・効率的に提供します。"},{"id":2,"subject":0,"question":"社会福祉法における「重層的支援体制整備事業」について正しいものはどれか。3つ選べ。","options":["都道府県が行う。","地域生活課題を抱える地域住民の社会参加のための支援が含まれる。","地域づくりに向けた支援が含まれる。","地域生活課題を抱える地域住民の家族に対する包括的な相談支援が含まれる。","介護保険の居宅介護支援が含まれる。"],"answer":[2,3,4],"sourcePage":3,"explanation":"重層的支援体制整備事業は市町村が実施します。包括的な相談支援、社会参加への支援、地域づくりへの支援などを一体的に進めます。"},{"id":3,"subject":0,"question":"介護保険法第5条に規定されている「国及び地方公共団体の責務」として正しいものはどれか。3つ選べ。","options":["国は、保健医療サービス及び福祉サービスを提供する体制の確保に関する施策を講じなければならない。","国及び地方公共団体は、障害者その他の者の福祉に関する施策との有機的な連携を図るように努めなければならない。","都道府県は、介護保険事業の運営が健全かつ円滑に行われるように、必要な助言及び適切な援助をしなければならない。","市町村は、要介護者等の医療に要する費用の適正化を図るための施策を実施しなければならない。","市町村は、地域において医療及び介護が総合的に確保されるよう指針を定めなければならない。"],"answer":[1,2,3],"sourcePage":4,"explanation":"国はサービス提供体制の確保を進め、都道府県は介護保険事業に助言・援助を行います。国と地方公共団体には、障害者福祉など他分野との連携も求められます。"},{"id":4,"subject":0,"question":"2019(令和元)年度の第1号被保険者の状況について正しいものはどれか。2つ選べ。","options":["前期高齢者数は、後期高齢者数の3倍を超えている。","3,000万人を超えている。","要介護及び要支援の認定者が占める割合は、40%を超えている。","要介護及び要支援の認定者のうち、要介護3以上の者が占める割合は、50%を超えている。","保険給付費のうち、居宅サービス及び地域密着型サービスが占める割合は、50%を超えている。"],"answer":[2,5],"sourcePage":4,"explanation":"2019年度の第1号被保険者は3,000万人を超えています。給付費では、居宅サービスと地域密着型サービスの合計が半数を超えています。"},{"id":5,"subject":0,"question":"介護保険の被保険者資格の取得及び喪失について正しいものはどれか。2つ選べ。","options":["医療保険加入者が40歳に達したとき、住所を有する市町村の被保険者資格を取得する。","第1号被保険者が生活保護の被保護者となった場合は、被保険者資格を喪失する。","入所前の住所地とは別の市町村に所在する養護老人ホームに措置入所した者は、その養護老人ホームが所在する市町村の被保険者となる。","居住する市町村から転出した場合は、その翌日から、転出先の市町村の被保険者となる。","被保険者が死亡した場合は、その翌日から、被保険者資格を喪失する。"],"answer":[1,5],"sourcePage":5,"explanation":"医療保険加入者は40歳に達すると第2号被保険者になります。死亡による資格喪失は翌日です。65歳以上の人は生活保護を受けても原則として被保険者です。"},{"id":6,"subject":0,"question":"介護支援専門員について正しいものはどれか。3つ選べ。","options":["登録を受けている者が死亡した場合には、その相続人はその旨を届け出なければならない。","登録の申請の10年前に居宅サービスにおいて不正な行為をした者は、登録を受けることができない。","都道府県知事は、信用を傷つけるような行為をした介護支援専門員の登録を消除することができる。","介護支援専門員証の交付を受けていなくても、業務に従事することができる。","更新研修を受けた者は、介護支援専門員証の有効期間を更新することができる。"],"answer":[1,3,5],"sourcePage":5,"explanation":"登録者が死亡した場合は相続人による届出が必要です。信用を傷つける行為は登録消除の対象となり得ます。試験時点では、更新研修を受けて専門員証を更新する制度です。"},{"id":7,"subject":0,"question":"介護保険施設について正しいものはどれか。2つ選べ。","options":["介護老人福祉施設の入所定員は、50人以上でなければならない。","介護老人保健施設の管理者となる医師は、都道府県知事の承認を受けなければならない。","2024(令和6)年3月31日までは、新たに指定介護療養型医療施設の指定を受けることができる。","入所者ごとに施設サービス計画を作成しなければならない。","地域密着型介護老人福祉施設は、含まれる。"],"answer":[2,4],"sourcePage":6,"explanation":"老健の管理者となる医師は都道府県知事の承認が必要で、施設では入所者ごとの計画を作成します。介護老人福祉施設の定員は30人以上で、地域密着型特養は別の区分です。"},{"id":8,"subject":0,"question":"要介護認定の仕組みについて正しいものはどれか。3つ選べ。","options":["介護保険の被保険者証が交付されていない第2号被保険者が申請するときは、医療保険被保険者証等を提示する。","市町村は新規認定の調査について、指定市町村事務受託法人に委託することができる。","主治医がいない場合には、介護認定審査会が指定する医師が主治医意見書を作成する。","要介護者が他市町村に所在する介護老人福祉施設に入所する場合には、その施設所在地の市町村の認定を改めて受ける必要はない。","介護保険料を滞納している者は、認定を受けることができない。"],"answer":[1,2,4],"sourcePage":6,"explanation":"第2号被保険者の申請では医療保険の加入確認を行い、新規調査は指定市町村事務受託法人へ委託できます。住所地特例の対象施設への入所だけで認定を受け直す必要はありません。"},{"id":9,"subject":0,"question":"介護保険財政について正しいものはどれか。3つ選べ。","options":["国は、介護給付及び予防給付に要する費用の30%を負担する。","国は、介護保険の財政の調整を行うため、市町村に対して調整交付金を交付する。","都道府県は、介護保険事業に要する費用に充てるため、保険料を徴収しなければならない。","地域支援事業支援交付金は、社会保険診療報酬支払基金が医療保険者から徴収する納付金をもって充てる。","第1号被保険者の保険料の賦課期日は、当該年度の初日である。"],"answer":[2,4,5],"sourcePage":7,"explanation":"国は市町村へ調整交付金を交付します。地域支援事業支援交付金は医療保険者からの納付金を財源とし、第1号保険料の賦課期日は年度初日です。"},{"id":10,"subject":0,"question":"介護保険における第1号被保険者の保険料について正しいものはどれか。3つ選べ。","options":["政令で定める基準に従い市町村が条例で定める。","保険料率は、おおむね5年を通じ財政の均衡を保つことができるものでなければならない。","普通徴収の方法によって徴収する保険料については、世帯主に連帯納付義務がある。","普通徴収の方法によって徴収する保険料の納期は、政令で定める。","条例で定めるところにより、特別の理由がある者に対し、保険料を減免し、又はその徴収を猶予することができる。"],"answer":[1,3,5],"sourcePage":7,"explanation":"第1号保険料は国の基準に従って市町村条例で定めます。普通徴収では世帯主にも連帯納付義務があり、特別な理由による減免・徴収猶予も可能です。"},{"id":11,"subject":0,"question":"介護予防・生活支援サービス事業について正しいものはどれか。2つ選べ。","options":["居宅要支援被保険者は、利用できる。","利用者の負担額は、都道府県が設定する。","住所地特例適用被保険者に係る費用は、施設所在地の市町村が負担する。","介護老人保健施設の入所者は、利用できない。","第2号被保険者は、利用できない。"],"answer":[1,4],"sourcePage":8,"explanation":"介護予防・生活支援サービス事業は在宅の要支援者などが利用でき、老健の入所者は対象外です。利用者負担は市町村が定め、第2号被保険者も要支援認定等により対象になります。"},{"id":12,"subject":0,"question":"包括的支援事業の各事業において配置することとされている者として正しいものはどれか。3つ選べ。","options":["生活支援コーディネーター(地域支え合い推進員)","介護サービス相談員","認知症地域支援推進員","チームオレンジコーディネーター","福祉用具専門相談員"],"answer":[1,3,4],"sourcePage":8,"explanation":"包括的支援事業では、生活支援コーディネーター、認知症地域支援推進員、チームオレンジコーディネーターなどを配置します。生活支援や認知症支援の体制を整える役割です。"},{"id":13,"subject":0,"question":"介護保険法で定める国民健康保険団体連合会が行う業務として正しいものはどれか。3つ選べ。","options":["介護給付費交付金の交付","市町村から委託を受けて行う介護予防・日常生活支援総合事業に関する費用の審査及び支払","介護給付費等審査委員会の設置","指定居宅介護支援事業所への強制権限を伴う立入検査","市町村から委託を受けて行う第三者行為求償事務"],"answer":[2,3,5],"sourcePage":9,"explanation":"国保連は総合事業の費用の審査・支払や第三者行為求償を受託し、介護給付費等審査委員会を設置します。強制権限を伴う立入検査は国保連の業務ではありません。"},{"id":14,"subject":0,"question":"介護サービス情報の公表制度について正しいものはどれか。3つ選べ。","options":["原則として、介護サービス事業者は、毎年、介護サービス情報を報告する。","指定居宅介護支援事業者は、介護サービス情報をその事業所の所在地の市町村長に報告する。","介護サービス情報の公表は、事業所又は施設の所在地の国民健康保険団体連合会が行う。","職種別の従業者の数は、公表すべき事項に含まれる。","指定居宅サービス事業者が報告内容の是正命令に従わないときには、指定を取り消されることがある。"],"answer":[1,4,5],"sourcePage":9,"explanation":"事業者は原則毎年、介護サービス情報を都道府県知事へ報告します。職種別の従業者数も公表対象で、是正命令に従わない場合は指定取消しにつながることがあります。"},{"id":15,"subject":0,"question":"介護サービスに関する苦情処理について正しいものはどれか。3つ選べ。","options":["利用者が国民健康保険団体連合会に苦情を申し立てる場合、指定居宅介護支援事業者は、利用者に対して必要な援助を行わなくてもよい。","国民健康保険団体連合会は、都道府県から委託を受けて苦情処理を行う。","国民健康保険団体連合会は、事業者に対する必要な指導及び助言を行う。","指定訪問看護事業者は、受け付けた苦情の内容等を記録しなければならない。","指定訪問介護事業者は、苦情受付窓口の設置等の必要な措置を講じなければならない。"],"answer":[3,4,5],"sourcePage":10,"explanation":"国保連は苦情について事業者へ指導・助言を行います。サービス事業者は窓口の設置や苦情内容の記録が必要で、ケアマネは利用者の申立てを援助します。"},{"id":16,"subject":0,"question":"要介護認定に係る主治医意見書における「認知症の中核症状」の項目として正しいものはどれか。2つ選べ。","options":["自分の意思の伝達能力","徘徊","幻視・幻聴","短期記憶","妄想"],"answer":[1,4],"sourcePage":10,"explanation":"主治医意見書の中核症状の項目には、意思の伝達能力や短期記憶などが含まれます。徘徊、幻視・幻聴、妄想は行動・心理症状に関する項目です。"},{"id":17,"subject":0,"question":"介護保険における特定疾病として正しいものはどれか。3つ選べ。","options":["関節リウマチ","慢性肝疾患","潰瘍性大腸炎","脳血管疾患","骨折を伴う骨粗鬆症"],"answer":[1,4,5],"sourcePage":11,"explanation":"関節リウマチ、脳血管疾患、骨折を伴う骨粗鬆症は16の特定疾病に含まれます。慢性肝疾患と潰瘍性大腸炎は含まれません。"},{"id":18,"subject":0,"question":"要介護認定について正しいものはどれか。2つ選べ。","options":["要介護認定等基準時間は、実際の介護時間とは異なる。","要介護認定等基準時間は、同居家族の有無によって異なる。","要介護認定等基準時間の算出根拠は、1分間タイムスタディである。","指定居宅介護支援事業者は、新規認定の調査を行える。","認定調査票の特記事項は、一次判定で使用する。"],"answer":[1,3],"sourcePage":11,"explanation":"要介護認定等基準時間は、1分間タイムスタディを基に介護の手間を推計したものです。家庭で実際に介護した時間や、同居家族の有無で決めるものではありません。"},{"id":19,"subject":0,"question":"指定居宅介護支援等の事業の人員及び運営に関する基準第13条の具体的取扱方針のうち、介護支援専門員に係るものとして正しいものはどれか。3つ選べ。","options":["利用者の心身又は家族の状況等に応じ、継続的かつ計画的に指定居宅サービス等の利用が行われるようにしなければならない。","その地域における指定居宅サービス事業者等に関するサービスの内容、利用料等の情報を適正に利用者又はその家族に対して提供するものとする。","居宅サービス計画の原案の内容について利用者やその家族に対して説明し、口頭で利用者の同意を得るものとする。","作成した居宅サービス計画は、利用者から求めがなければ、利用者に交付しなくてもよい。","介護保険施設等から退院又は退所しようとする要介護者から依頼があった場合には、あらかじめ、居宅サービス計画の作成等の援助を行うものとする。"],"answer":[1,2,5],"sourcePage":12,"explanation":"ケアマネは継続的・計画的なサービス利用を支え、内容や料金の情報を提供します。退院・退所前から援助し、計画の同意は文書で得て、本人へ交付します。"},{"id":20,"subject":0,"question":"指定居宅介護支援事業者の記録の整備について正しいものはどれか。3つ選べ。","options":["居宅介護支援台帳は、書面による記録と電磁的記録の両方を整備しなければならない。","事故の状況及び事故に際して採った処置についての記録を整備しなければならない。","従業者に関する記録を整備しておかなければならない。","会計に関する記録を整備しておかなければならない。","サービス担当者会議等の記録は、その完結の日から5年間保存しなければならない。"],"answer":[2,3,4],"sourcePage":12,"explanation":"事故の状況と対応、従業者、会計などの記録を整備します。書面と電磁的記録の両方を必ず用意するわけではありません。国の基準では支援記録は完結から2年間保存します。"},{"id":21,"subject":0,"question":"指定居宅介護支援に係るモニタリングについて正しいものはどれか。3つ選べ。","options":["利用者についての継続的なアセスメントは、含まれる。","目標の達成度の把握は、含まれる。","指定居宅サービス事業者等との連絡を継続的に行う。","少なくとも1月に1回、主治の医師に意見を求めなければならない。","地域ケア会議に結果を提出しなければならない。"],"answer":[1,2,3],"sourcePage":13,"explanation":"モニタリングでは状態を継続的に評価し、目標の達成度やサービスの実施状況を確認します。事業者と連絡を取り、必要に応じ計画を見直します。"},{"id":22,"subject":0,"question":"介護予防サービス計画について正しいものはどれか。3つ選べ。","options":["地域の住民による自発的な活動によるサービス等の利用も含めて位置付けるよう努めなければならない。","計画に位置付けた指定介護予防サービス事業者から、利用者の状態等に関する報告を少なくとも3月に1回、聴取しなければならない。","介護予防福祉用具貸与を位置付ける場合には、貸与が必要な理由を記載しなければならない。","計画に位置付けた期間が終了するときは、当該計画の目標の達成状況について評価しなければならない。","介護予防通所リハビリテーションを位置付ける場合には、理学療法士の指示が必要である。"],"answer":[1,3,4],"sourcePage":13,"explanation":"介護予防計画には地域の活動も活かし、用具貸与の必要性を記載します。計画期間の終了時は目標の達成状況を評価し、事業者からの報告は少なくとも毎月聴取します。"},{"id":23,"subject":0,"question":"Aさん(58歳、男性)は、会社の管理職をしていたが、仕事中に突然怒り出すことが多くなり、受診の結果、若年性認知症と診断された。Aさんは、まだ働けるという認識はあったが、退職せざるを得なくなった。夫婦二人暮らしで、妻(55歳)はパートで働いている。Aさんは要介護1の認定を受け、通所介護を週2回利用することとなった。サービス利用開始1か月後に介護支援専門員がAさん夫婦と面談したところ、Aさんは、高齢者ばかりの環境に馴染めないことと、妻のために我慢して通っていることが分かった。介護支援専門員の対応として、より適切なものはどれか。3つ選べ。","options":["妻からAさんに我慢して通所介護に通うよう説得してもらう。","通所介護の場でAさんが役割を実感できるように、通所介護事業所に通所介護計画を再検討してもらう。","地域の中でAさんが参加したいと思うような活動や場所を探す。","通所介護の利用をやめて、Aさんが一人で自宅で過ごすことを夫婦に勧める。","若年性認知症に対応する社会資源開発を地域ケア会議で提案する。"],"answer":[2,3,5],"sourcePage":14,"explanation":"本人が役割を感じられる活動を一緒に探し、通所介護の計画を再検討します。若年性認知症に合う資源が不足していれば、地域ケア会議で開発を提案します。"},{"id":24,"subject":0,"question":"Aさん(80歳、女性、要介護2)は、長女(50歳、障害支援区分3)との二人暮らしである。Aさんは、変形性股関節症の悪化に伴い、自宅の浴槽で入浴することが難しくなり、通所介護での入浴を希望している。しかし、長女はAさんの姿が見えなくなると不穏になるので、「長女を一人にするのが不安だ」とAさんから介護支援専門員に相談があった。この時点における介護支援専門員の対応として、より適切なものはどれか。3つ選べ。","options":["Aさんと長女の同意を得て、長女を担当する相談支援専門員に現状を伝える。","浴室の改修のため、直ちに施工業者を訪問させる。","Aさんと長女が一緒に通所利用できる共生型サービス事業所の情報を収集する。","Aさんがすぐに入所できる特別養護老人ホームを探す。","Aさんの変形性股関節症の症状の改善の可能性について、本人の同意を得て主治医に意見を求める。"],"answer":[1,3,5],"sourcePage":15,"explanation":"本人と長女の同意を得て相談支援専門員と連携します。共生型サービスなどの選択肢を調べ、主治医にも症状の改善可能性を確認して支援を考えます。"},{"id":25,"subject":0,"question":"一人暮らしのAさん(84歳、男性、要介護1)は、訪問介護を週1回利用している。認知症と診断されており、片付けができなくなったことに加え、先日は外出先で道に迷って警察に保護された。遠方に住む妹からは、「迷惑をかけるようなら施設に入るよう説得してほしい」との要望があった。Aさんは、「このまま家で気楽に暮らし続けたいが、銀行手続等の金銭管理が不安なので、介護支援専門員に管理をお願いしたい」と話している。この時点における介護支援専門員の対応として、より適切なものはどれか。3つ選べ。","options":["Aさんとの信頼関係を大切にするため、金銭管理を引き受ける。","Aさんと妹の同意を得て、民生委員にAさんの最近の状況を説明し、見守りに関する対応を相談する。","Aさんに日常生活自立支援事業についての情報提供を行う。","妹の要望に応え、施設サービスの利用手続を始める。","Aさんの認知症の状態や生活状況についての再アセスメントを行う。"],"answer":[2,3,5],"sourcePage":16,"explanation":"在宅生活を続けたい本人の意向を尊重し、状態と生活を再評価します。地域の見守りや日常生活自立支援事業を検討し、ケアマネが安易に金銭管理を引き受けることは避けます。"},{"id":26,"subject":1,"question":"次の疾病の特徴として、より適切なものはどれか。3つ選べ。","options":["狭心症では、前胸部の圧迫感が生じることはない。","心不全による呼吸困難時に、起座位にすると症状が改善することがある。","慢性腎不全では、水分やカリウムの摂取量に注意する必要がある。","高齢者の糖尿病では、口渇、多飲、多尿の症状が出現しにくい。","帯状疱疹は、細菌性感染症である。"],"answer":[2,3,4],"sourcePage":18,"explanation":"心不全の呼吸困難は座ると楽になる場合があります。慢性腎不全は水分やカリウムに注意が必要で、高齢者の糖尿病は典型的な症状が出にくいことがあります。"},{"id":27,"subject":1,"question":"高齢者の精神障害について、より適切なものはどれか。2つ選べ。","options":["老年期うつ病では、妄想の症状が発現することはない。","老年期うつ病では、自死を図ることはない。","高齢者の妄想性障害への対応では、共感が大切な要素である。","神経症は、病気ではなく、気のもちようである。","アルコール依存症のケアには、自助グループなどの地域の社会資源の活用も有用である。"],"answer":[3,5],"sourcePage":18,"explanation":"妄想の内容を否定するだけでなく、不安や苦痛に共感します。アルコール依存症では自助グループも支えになります。高齢者のうつ病でも妄想や自殺の危険があります。"},{"id":28,"subject":1,"question":"次の記述のうち適切なものはどれか。3つ選べ。","options":["起立性低血圧は、降圧薬、利尿薬などの薬剤の使用も原因になる。","加齢とともに血管の弾力が失われるため、収縮期血圧が低くなる傾向がある。","橈骨動脈で脈が触れない場合には、頸動脈や股動脈で脈拍をみる。","重度の徐脈は、失神を伴うことがある。","昏睡とは、刺激がないと眠ってしまう状態である。"],"answer":[1,3,4],"sourcePage":19,"explanation":"起立性低血圧は降圧薬や利尿薬などでも起こります。手首で脈を触れない場合は頸動脈などを確認し、重い徐脈は失神につながります。昏睡では強い刺激にも反応しません。"},{"id":29,"subject":1,"question":"検査項目について適切なものはどれか。3つ選べ。","options":["BMI(BodyMassIndex)は、身長(m)を体重(kg)の2乗で除したものである。","血清アルブミンの値は、高齢者の長期にわたる栄養状態をみる指標として有用である。","AST(GOT)・ALT(GPT)の値は、肝・胆道疾患の指標となる。","血清クレアチニンの値は、腎機能の指標となる。","ヘモグロビンA1cの値は、過去1週間の平均的な血糖レベルを反映する。"],"answer":[2,3,4],"sourcePage":19,"explanation":"アルブミンは栄養状態、AST・ALTは肝・胆道疾患、クレアチニンは腎機能の指標です。BMIは体重を身長の2乗で割り、HbA1cは過去1～2か月程度の血糖状態を反映します。"},{"id":30,"subject":1,"question":"次の記述のうち適切なものはどれか。3つ選べ。","options":["介護を行うときには、利用者の残存能力をできる限り活かす。","入浴は、全身の保清を図り、血液循環や新陳代謝を促進する。","清拭をするときには、その部屋の温度を確認する。","尿失禁とは、尿を全部出しきれず、膀胱の中に尿が残ることをいう。","ボディメカニクスとは、起床、食事、排泄など、利用者の生活リズムを取り戻すことをいう。"],"answer":[1,2,3],"sourcePage":20,"explanation":"介護は本人の残存能力を活かして行います。入浴は清潔と血行を保ち、清拭では室温にも配慮します。尿失禁は意思に反して尿が漏れることで、残尿とは異なります。"},{"id":31,"subject":1,"question":"次の記述のうち適切なものはどれか。3つ選べ。","options":["味覚は、舌や口蓋等にある味蕾が刺激されて起こる。","誤嚥とは、飲食物や唾液、胃の内容物が気管内に入ることをいう。","薬のPTP包装シート(プラスチックにアルミなどを貼り付けたもの)を誤って飲み込んだ場合、排泄されるため心配はない。","認知症と口腔環境とは、無関係である。","口腔内・口腔周囲を動かすことは、オーラルフレイル予防につながる。"],"answer":[1,2,5],"sourcePage":20,"explanation":"味は味蕾への刺激で感じ、誤嚥は飲食物などが気管に入ることです。口を動かすことはオーラルフレイル予防に役立ちます。PTP包装の誤飲は消化管を傷つける危険があります。"},{"id":32,"subject":1,"question":"認知症について適切なものはどれか。2つ選べ。","options":["BPSD(認知症の行動・心理症状)は、住環境などの環境因子の影響は受けない。","若年性認知症は、うつ病など、他の精神疾患と疑われることがある。","前頭側頭型認知症では、リアルな幻視やパーキンソニズムが特徴である。","パーソン・センタード・ケアは、介護者本位で効率よく行うケアである。","介護支援専門員が、利用者本人の同意を得て、心身の変化などを主治医に伝えることは、よりよい医療につながる。"],"answer":[2,5],"sourcePage":21,"explanation":"若年性認知症は他の精神疾患と疑われる場合があります。本人の同意を得て主治医と情報を共有します。BPSDには環境も影響し、ケアは本人を中心に考えます。"},{"id":33,"subject":1,"question":"リハビリテーションについて、より適切なものはどれか。3つ選べ。","options":["代償的アプローチには、残存機能の活用が含まれる。","急性期リハビリテーションは、一般に、廃用症候群の予防と早期からのセルフケアの自立を目標とする。","回復期リハビリテーション病棟では、多職種による集中的なリハビリテーションが提供される。","終末期にある者は、対象とならない。","指定訪問リハビリテーションは、バス等の公共交通機関への乗降の支援を対象としない。"],"answer":[1,2,3],"sourcePage":21,"explanation":"残っている機能で補う代償的な方法もリハビリです。急性期は廃用予防と早期自立、回復期は多職種による集中的な支援を行い、終末期も対象になります。"},{"id":34,"subject":1,"question":"次の記述のうち適切なものはどれか。3つ選べ。","options":["薬剤師は、薬剤を処方してはならない。","介護職員は、服薬介助を行ってはならない。","医療用医薬品と健康食品の併用による有害な相互作用の可能性について注意が必要である。","薬の変更や中止で重篤な症状が起こることはない。","内服薬は、通常、水又はぬるま湯で飲む。"],"answer":[1,3,5],"sourcePage":22,"explanation":"処方は医師・歯科医師が行います。医薬品と健康食品にも相互作用があり、内服薬は通常、水かぬるま湯で飲みます。自己判断の中止や変更には危険があります。"},{"id":35,"subject":1,"question":"次の記述のうち適切なものはどれか。3つ選べ。","options":["居宅介護支援事業所から病院への情報提供のため、入院時情報提供書が使われることがある。","エビデンス・ベースド・メディスン(EvidenceBasedMedicineEBM)は、根拠に基づく医療のことである。","介護支援専門員は、患者自身が治療法を選択する際に、第三者的な立場から助言してはならない。","介護支援専門員は、退院前カンファレンスに参加することが望ましい。","チームアプローチでは、住民によるボランティア活動を含まない。"],"answer":[1,2,4],"sourcePage":22,"explanation":"入院時情報提供書などで病院と生活情報を共有し、退院前カンファレンスにも参加します。EBMは根拠に基づく医療で、地域のボランティアも支援チームに含められます。"},{"id":36,"subject":1,"question":"高齢者の栄養・食生活について適切なものはどれか。3つ選べ。","options":["必要な栄養を食事では摂りきれない場合でも、間食で補うことは適当でない。","咀嚼能力や唾液分泌の低下などから、摂食・嚥下障害を起こしやすい。","食事中に口から食べ物をこぼす場合、口腔・嚥下機能評価を行うとよい。","食べることを通じて尊厳ある自己実現を目指す。","食事支援では、介護する家族の状況を考える必要はない。"],"answer":[2,3,4],"sourcePage":23,"explanation":"加齢による咀嚼や唾液分泌の低下は摂食・嚥下に影響します。食べこぼしがあれば機能を評価し、本人の尊厳や楽しみ、家族の状況も踏まえて支援します。"},{"id":37,"subject":1,"question":"次の記述のうち適切なものはどれか。3つ選べ。","options":["中心静脈栄養法では、静脈炎にならないように末梢静脈を用いる。","経鼻胃管の種類には、バルーン型とバンパー型がある。","血液透析のためのシャントは、動脈と静脈をつなぎ合わせた部位のことである。","ネブライザーは、気道を加湿して痰を出しやすくするために用いる機器である。","パルスオキシメーターは、血液中の酸素飽和度を測定する機器である。"],"answer":[3,4,5],"sourcePage":23,"explanation":"透析用シャントは動脈と静脈をつないだ部位です。ネブライザーは気道の加湿等に、パルスオキシメーターは酸素飽和度の測定に使います。中心静脈栄養には太い静脈を用います。"},{"id":38,"subject":1,"question":"次の記述のうち、より適切なものはどれか。3つ選べ。","options":["手の甲の皮膚をつまみ上げて離したとき、すぐには元に戻らない場合は、脱水を疑う。","薬の服用時間における食間とは、食事中に服用することである。","言葉が出てこない、又はろれつが回らないという症状が突然生じた場合は、脳卒中の可能性がある。","転倒による頭部打撲後、すぐに意識障害が起こらなければ問題はない。","前立腺肥大症の場合、尿意を感じたら、早めにトイレに行くよう心がける。"],"answer":[1,3,5],"sourcePage":24,"explanation":"皮膚の戻りが遅ければ脱水を疑います。突然の言語障害は脳卒中の可能性があり、頭を打った後も遅れて症状が出る場合があります。前立腺肥大症では排尿を我慢しないようにします。"},{"id":39,"subject":1,"question":"次の記述のうち適切なものはどれか。3つ選べ。","options":["健康日本21(第二次)では、健康寿命を延ばすことを目指している。","就労、ボランティアなどの社会参加は、フレイル予防に役立たない。","パーキンソン病の場合、転倒しやすいため、運動療法は禁忌である。","膝関節症による痛みや腫脹を抑えるには、定期的な運動が効果的である。","高齢者においては、無症状であっても骨粗鬆症の検査を受けることが推奨される。"],"answer":[1,4,5],"sourcePage":24,"explanation":"健康日本21（第二次）は健康寿命の延伸を目指しました。膝関節症には状態に合う運動が役立ち、高齢者は症状がなくても骨粗鬆症の検査が勧められます。"},{"id":40,"subject":1,"question":"臨死期について適切なものはどれか。3つ選べ。","options":["家族に対して、今後予想される状況に即した病状説明が行われるよう配慮する。","在宅で看取る場合、呼吸停止の瞬間に、医師が立ち会う必要がある。","呼吸をするたびに、喉元でゴロゴロと音がする状態(死前喘鳴)になることがある。","臨終が近づき、応答がなくなった場合には、本人への語りかけをやめる。","死後のケアであるエンゼルケアは、身体を清潔にし、その人らしい外見に整えるためのものである。"],"answer":[1,3,5],"sourcePage":25,"explanation":"家族が予想される変化を理解できるよう支援します。死前喘鳴が起こることがあり、応答がなくても穏やかに語りかけます。エンゼルケアは清潔とその人らしい外見を整えるケアです。"},{"id":41,"subject":1,"question":"訪問看護について正しいものはどれか。3つ選べ。","options":["急性増悪時に主治医から特別指示書が交付された場合、介護保険から給付が行われる。","介護保険の指定訪問看護ステーションの管理者は、原則として、常勤の保健師又は看護師でなければならない。","提供に当たっては、常に利用者の病状、心身の状況及びその置かれている環境の的確な把握に努める。","保険医療機関の指定を受けている病院は、介護保険の指定訪問看護事業者とみなされる。","24時間365日、サービスを提供しなければならない。"],"answer":[2,3,4],"sourcePage":25,"explanation":"訪問看護ステーションの管理者は原則、常勤の保健師・看護師です。病状や生活環境を把握し、保険医療機関の病院は指定を受けたものとみなされます。特別指示期間は医療保険で対応します。"},{"id":42,"subject":1,"question":"指定通所リハビリテーションについて正しいものはどれか。3つ選べ。","options":["利用者の生活機能の維持又は向上を目指し、心身の機能の維持回復を図るものでなければならない。","介護老人福祉施設で提供される。","事業所には、生活相談員を配置しなければならない。","通所リハビリテーション計画は、医師及び理学療法士、作業療法士等の従業者が、共同して作成する。","通所リハビリテーション計画の進捗状況を定期的に評価し、必要に応じて当該計画を見直す。"],"answer":[1,4,5],"sourcePage":26,"explanation":"通所リハビリは生活機能の維持・向上と心身機能の維持回復を目指します。医師やリハビリ職等が共同で計画を作り、定期的に評価して見直します。"},{"id":43,"subject":1,"question":"指定短期入所療養介護について正しいものはどれか。3つ選べ。","options":["家族の身体的及び精神的な負担軽減を図るために利用できる。","看護,医学的管理の下における介護及び機能訓練その他必要な医療並びに日常生活上の世話を行う。","居宅サービス計画において、あらかじめ位置付けられていない場合には、利用することができない。","短期入所療養介護計画は、おおむね4日以上連続して利用する場合に作成する必要がある。","ターミナルケアは、行われない。"],"answer":[1,2,4],"sourcePage":26,"explanation":"短期入所療養介護は医療・看護・介護等を提供し、家族の負担軽減にも使えます。おおむね4日以上続けて利用する場合は個別の計画が必要です。"},{"id":44,"subject":1,"question":"指定定期巡回・随時対応型訪問介護看護について正しいものはどれか。3つ選べ。","options":["利用者が尊厳を保持し、可能な限りその居宅において、その有する能力に応じ自立した日常生活を営むことができるよう援助を行う。","要支援者も利用できる。","利用者の心身の状況にかかわらず、毎日、訪問しなければならない。","随時対応サービスについては、利用者のみならずその家族等からの在宅介護における相談等にも適切に対応する。","介護・医療連携推進会議は、おおむね6月に1回以上、開催しなければならない。"],"answer":[1,4,5],"sourcePage":27,"explanation":"定期巡回・随時対応型サービスは、要介護者の在宅生活を支え、家族からの相談にも対応します。介護・医療連携推進会議は、おおむね6か月に1回以上開きます。"},{"id":45,"subject":1,"question":"介護老人保健施設について正しいものはどれか。2つ選べ。","options":["社会福祉法人は、開設できる。","ユニット型では、一のユニットの定員は、15人を超えることが認められている。","入所定員が100人以上の場合には、栄養士又は管理栄養士を置かなければならない。","処置室を設けなければならない。","全国では、全入所者のうち要介護4及び要介護5の者が占める割合は、80%以上である。"],"answer":[1,3],"sourcePage":27,"explanation":"老健は社会福祉法人も開設でき、定員100人以上なら栄養士又は管理栄養士が必要です。ユニット定員は原則おおむね10人以下、15人以下が上限です。"},{"id":46,"subject":2,"question":"面接場面におけるコミュニケーション技術について、より適切なものはどれか。3つ選べ。","options":["イラストや写真などの表現方法の利用は、クライエントを混乱させるので控える。","直面化とは、クライエントが否認していることによって生じている話の矛盾点を指摘することをいう。","援助者は、クライエントの主訴の把握に当たっては、言語的な手段だけでなく、非言語的な手段も用いることが望ましい。","共感とは、クライエントの言動に対して、援助者自身の過去の重要な人との関係を投影することをいう。","クローズドクエスチョンは、明確な回答を得たいときに用いる。"],"answer":[2,3,5],"sourcePage":29,"explanation":"直面化は話の矛盾などに本人が気付けるよう働きかける技術です。主訴の把握には表情等も活かし、明確な回答が必要なら閉じた質問を用います。"},{"id":47,"subject":2,"question":"インテーク面接について、より適切なものはどれか。3つ選べ。","options":["地域援助技術の一つである。","支援過程の後期に実施する面接である。","面接の終わりには、問題解決に向けて一定の方向性を確認することが重要である。","必ずしも1回で終了させる必要はない。","クライエントが訪れた支援機関の機能や提供可能なサービスを説明する。"],"answer":[3,4,5],"sourcePage":29,"explanation":"インテークは支援の初期の面接です。機関の機能やサービスを説明し、問題解決の方向性を確認します。必要があれば複数回行います。"},{"id":48,"subject":2,"question":"ソーシャルワークに関する次の記述のうち、より適切なものはどれか。2つ選べ。","options":["クライエントの視点から、人生観や価値観等についての理解をより深めることが重要である。","家族や地域住民は、アウトリーチの対象に含まれない。","利用できる社会資源が不足している場合、新たな社会資源の開発が求められる。","不衛生な環境に居住している認知症高齢者が、サービスの利用を拒否したため、本人の意向に従い、支援を中止する。","「無断で家族に年金をすべて使われている」と高齢者からの訴えがあったが、家族間の問題であるため、「支援できない」と本人に伝える。"],"answer":[1,3],"sourcePage":30,"explanation":"本人の視点から価値観を理解し、必要な社会資源がなければ開発を考えます。支援拒否や家族による財産の不当な使用があっても、すぐに支援を断ち切りません。"},{"id":49,"subject":2,"question":"ソーシャルワークにおける集団援助として、より適切なものはどれか。3つ選べ。","options":["地域包括支援センターの主任介護支援専門員による認知症高齢者の家族を対象とした交流活動","民生委員による地域の認知症高齢者の見守り活動","医療機関で行われる、難病の当事者による分かち合いの場の体験","社会福祉協議会によるヤングケアラー支援のための地域ネットワークの構築","養護老人ホームの生活相談員による入所者グループに対するプログラム活動"],"answer":[1,3,5],"sourcePage":30,"explanation":"家族の交流会、当事者同士の分かち合い、入所者グループの活動は集団援助です。メンバー間の交流や相互作用を支援に活かします。"},{"id":50,"subject":2,"question":"介護保険における訪問介護について正しいものはどれか。3つ選べ。","options":["訪問介護計画の作成は、管理者の業務として位置付けられている。","利用回数が少ない利用者であっても、訪問介護計画を作成しなければならない。","サービス提供責任者は、居宅介護支援事業者に対し、サービス提供に当たり把握した利用者の心身の状態及び生活の状況について必要な情報の提供を行うものとする。","指定訪問介護事業者は、利用者が不正な行為によって保険給付を受けたときは、遅滞なく、市町村に通知しなければならない。","指定訪問介護事業者は、法定代理受領サービスに該当しないサービスの利用料の支払を受けた場合には、サービス提供証明書を交付しなくてよい。"],"answer":[2,3,4],"sourcePage":31,"explanation":"利用回数が少なくても訪問介護計画は必要です。サービス提供責任者はケアマネへ状態等を伝え、不正受給を把握した事業者は市町村へ通知します。"},{"id":51,"subject":2,"question":"介護保険における通所介護について正しいものはどれか。3つ選べ。","options":["利用者の社会的孤立感の解消を図ることは、指定通所介護の事業の基本方針に含まれている。","通所介護計画作成後に居宅サービス計画が作成された場合、その通所介護計画が居宅サービス計画に沿ったものであるか、確認する必要はない。","通所介護計画の目標及び内容については、利用者又は家族に説明を行うとともに、その実施状況や評価についても説明を行うものとする。","利用者は、利用日ごとに異なる提供時間数のサービスを受けることができる。","指定通所介護事業者は、指定通所介護事業所ごとに、経理を区分しなくてもよい。"],"answer":[1,3,4],"sourcePage":31,"explanation":"通所介護は社会的孤立感の解消も目指します。計画や実施状況を本人・家族に説明し、利用日ごとに異なる提供時間で利用することもできます。"},{"id":52,"subject":2,"question":"介護保険における訪問入浴介護について正しいものはどれか。2つ選べ。","options":["指定訪問入浴介護事業所ごとに、医師を1人以上置かなければならない。","管理者は、看護師又は准看護師でなければならない。","サービス提供時に使用する浴槽は、事業者が備えなければならない。","利用者が小規模多機能型居宅介護を利用している場合でも、訪問入浴介護費を算定できる。","事業者は、サービスの利用に当たっての留意事項を運営規程に定めておかなければならない。"],"answer":[3,5],"sourcePage":32,"explanation":"訪問入浴の浴槽は事業者が用意し、利用時の留意事項を運営規程に定めます。医師の配置や看護職の管理者は必須ではありません。小規模多機能との併用算定はできません。"},{"id":53,"subject":2,"question":"介護保険における短期入所生活介護について正しいものはどれか。2つ選べ。","options":["家族の冠婚葬祭や出張を理由とした利用はできない。","災害等のやむを得ない事情がある場合でも、利用定員を超えることは認められない。","短期入所生活介護計画の作成は、既に居宅サービス計画が作成されている場合には、当該計画の内容に沿って作成されなければならない。","一の居室の定員は、4人以下でなければならない。","居宅サービス計画上,区分支給限度基準額の範囲内であれば、利用できる日数に制限はない。"],"answer":[3,4],"sourcePage":32,"explanation":"短期入所生活介護の計画は居宅サービス計画に沿って作成し、居室の定員は4人以下です。冠婚葬祭等でも利用でき、利用日数には原則的な制限があります。"},{"id":54,"subject":2,"question":"介護保険における福祉用具について正しいものはどれか。3つ選べ。","options":["使用目的は、利用者の自立した日常生活の支援であり、介護者の負担軽減ではない。","貸与する際には、福祉用具専門相談員は、具体的なサービス内容等を記載した福祉用具貸与計画を作成しなければならない。","複数の福祉用具を貸与する場合には、通常の貸与価格から減額して貸与することができる。","入浴用いすなどの入浴補助用具は、特定福祉用具販売の対象となる。","取付工事の有無にかかわらず、手すりは福祉用具貸与の対象となる。"],"answer":[2,3,4],"sourcePage":33,"explanation":"福祉用具専門相談員は貸与計画を作成します。複数用具の貸与は減額でき、入浴用いすは販売の対象です。用具は本人の自立だけでなく介護負担の軽減にも役立ちます。"},{"id":55,"subject":2,"question":"介護保険における小規模多機能型居宅介護について正しいものはどれか。3つ選べ。","options":["通いサービス、宿泊サービスごとに、1日当たりの同時にサービス提供を受ける利用定員の上限が定められている。","一の宿泊室の定員は、利用者の処遇上必要と認められる場合は、2人とすることができる。","訪問サービスでは、身体介護の提供に限られる。","宿泊サービスでは、利用者1人につき1月当たりの日数の上限が定められている。","指定小規模多機能型居宅介護事業所の登録者に対しては、その事業所の介護支援専門員が、居宅サービス計画を作成しなければならない。"],"answer":[1,2,5],"sourcePage":33,"explanation":"小規模多機能では通い・宿泊の利用定員が定められています。必要があれば宿泊室を2人定員にでき、居宅サービス計画はその事業所のケアマネが作成します。"},{"id":56,"subject":2,"question":"介護保険における認知症対応型共同生活介護について正しいものはどれか。3つ選べ。","options":["入居の際には、主治の医師の診断書等により申込者が認知症である者であることの確認をしなければならない。","居間及び食堂は、同一の場所とすることができる。","管理者は、認知症である者の介護に3年以上従事した経験を有する者であって、所定の研修を修了しているものでなければならない。","事業者は、利用者の食材料費、理美容代、おむつ代を負担しなければならない。","各事業所に設けることができる共同生活住居の数は、1以上5以下である。"],"answer":[1,2,3],"sourcePage":34,"explanation":"認知症グループホームでは診断書等で認知症を確認し、居間と食堂は共用できます。管理者には認知症介護の3年以上の経験と所定の研修が必要です。"},{"id":57,"subject":2,"question":"指定介護老人福祉施設について正しいものはどれか。3つ選べ。","options":["明るく家庭的な雰囲気を有し、地域や家庭との結び付きを重視した運営を行うよう努めなければならない。","市町村長が指定する。","入所者の負担により、当該施設の従業者以外の者による介護を受けさせてはならない。","褥瘡の発生を予防するための体制を整備しなければならない。","入所者のためのレクリエーション行事を行うのであれば、教養娯楽設備等は備えなくてもよい。"],"answer":[1,3,4],"sourcePage":34,"explanation":"特養は家庭的な雰囲気と地域・家庭とのつながりを大切にします。褥瘡予防の体制を整え、入所者負担で外部の者に介護させることは禁止されています。"},{"id":58,"subject":2,"question":"生活保護制度について正しいものはどれか。3つ選べ。","options":["被保護者の収入として認定されるものには、地代や家賃等の財産収入が含まれる。","要保護者が急迫した状況にあるときは、保護の申請がなくても、必要な保護を行うことができる。","介護施設入所者基本生活費は、介護扶助として給付される。","教育扶助は、原則として、現物給付によって行われる。","介護扶助は、介護保険制度の保険給付の対象となる介護サービスと同等のサービスを、要保護者に対し保障する。"],"answer":[1,2,5],"sourcePage":35,"explanation":"地代・家賃等も収入認定の対象です。急迫時は申請がなくても保護でき、介護扶助は介護保険相当のサービスを保障します。介護施設入所者基本生活費は生活扶助です。"},{"id":59,"subject":2,"question":"成年後見制度について正しいものはどれか。2つ選べ。","options":["任意後見制度では、判断能力を喪失した人に、保佐人や補助人をつけることができる。","都道府県知事は、65歳以上の者につき、その福祉を図るため特に必要があると認めるときは、後見開始の審判の請求をすることができる。","本人と任意後見受任者の同意があれば、公正証書以外の方法でも任意後見契約が成立する。","成年後見制度の利用の促進に関する法律に定められた基本理念には、成年被後見人等の意思決定の支援と身上の保護が適切に行われるべきことが含まれる。","成年被後見人の法律行為は、原則として、取り消すことができる。"],"answer":[4,5],"sourcePage":35,"explanation":"成年後見制度は本人の意思決定と身上の保護を重視します。成年被後見人の法律行為は原則取り消せます。任意後見契約には公正証書が必要で、市町村長にも法定の申立権があります。"},{"id":60,"subject":2,"question":"障害者総合支援法について正しいものはどれか。3つ選べ。","options":["その支援には、自立支援給付と地域生活支援事業が含まれる。","自立支援医療とは、育成医療、更生医療及び精神通院医療である。","補装具費の支給は、地域生活支援事業の一つである。","対象とする障害者には、難病の者も含まれる。","サービスの利用を希望する者は、都道府県に対して支給申請を行う。"],"answer":[1,2,4],"sourcePage":36,"explanation":"障害者総合支援法の支援は、自立支援給付と地域生活支援事業からなります。自立支援医療は育成・更生・精神通院医療で、対象には一定の難病の人も含まれます。"}], SUBJECTS=["介護支援分野（問題1～25）", "保健医療サービス（問題26～45）", "福祉サービス（問題46～60）"];

ckground:#f1faf7}.option.good{border-color:#4aab87;background:#ecf8f2}.option.bad{border-color:#d88666;background:#fff1eb}.option input{width:18px;height:18px;flex:none;accent-color:#167d69;margin:5px 0 0}.number{font-weight:bold;color:#617984}.opttext{flex:1;min-width:0;overflow-wrap:anywhere}.optbadge{display:inline-block;font-size:11px;font-weight:bold;border-radius:4px;background:#d8eee1;color:#146d4f;padding:0 5px;margin-right:6px}.notebox{margin-top:16px;font-size:12px;color:#62727d}.notebox summary{cursor:pointer}.notebox p{white-space:pre-wrap}.submitrow{display:flex;align-items:center;gap:15px;margin-top:22px}.primary{background:#167d69;color:#fff;border-color:#167d69;font-weight:bold;padding:12px 25px}.primary:hover:not(:disabled){background:#116250;color:white}.hint{font-size:12px;color:#627783}.feedback{margin-top:24px;border-radius:12px;background:#eff8f3;border:1px solid #c6e3d3;padding:20px}.feedback.wrong{background:#fff6ef;border-color:#f0d5bd}.resulttitle{font-size:17px;font-weight:bold}.answer{color:#1861a0;font-size:23px;font-weight:bold;margin-top:5px}.explabel{font-size:11px;letter-spacing:.12em;font-weight:bold;color:#5d756c;margin:12px 0 4px}.explanation{font-size:15px}.retry{font-size:12px;padding:5px 10px;margin-top:14px;background:transparent}.navigation{display:flex;justify-content:space-between;gap:10px;margin-top:20px}.navigation button{min-width:100px}.empty{text-align:center;padding:60px 12px}.empty h2{font-size:21px;margin-bottom:12px}.empty p{font-size:14px;color:#647981;margin-bottom:22px}.footer{font-size:11px;color:#73838b;margin:26px 0 4px;text-align:center}.footer a{margin:0 6px}.summarynote{font-size:12px;color:#58716c;margin-top:10px}.mobilejump{display:none}

.scores{background:#e5f0ec;border:1px solid #c9ddd4;border-radius:10px;padding:12px 16px;font-size:13px;margin:-8px 0 22px;display:flex;flex-wrap:wrap;gap:8px 24px}.scores strong{color:#115e50}.scores small{flex-basis:100%;color:#536e65}<\/style><div class="wrap"><header class="top"><div><div class="brand">いとう総研 · STUDY PRACTICE<\/div><h1>第25回 ケアマネジャー試験<\/h1><p class="lead">一問ずつ、理解を積み重ねる。全60問・シンプル解説付き<\/p><\/div><span class="edition">2022年実施<\/span><\/header><div class="stats" id="stats"><\/div><div class="scores" id="scores"><\/div><div class="layout"><aside class="sidebar"><div><label class="control-label" for="subject">分野から選ぶ<\/label><select id="subject"><option value="all">全分野 · 60問<\/option>${SUBJECTS.map((s,i)=>`<option value="${i}">${esc(s)}<\/option>`).join('')}<\/select><\/div><div class="filters" role="group" aria-label="出題範囲">${[['all','すべて'],['unseen','未回答'],['wrong','間違えた'],['marks','あとで復習']].map(([v,t])=>`<button data-mode="${v}">${t}<\/button>`).join('')}<\/div><div class="sidebuttons"><button id="shuffle">シャッフル<\/button><button id="sort">番号順<\/button><\/div><details class="map"><summary>問題一覧から選ぶ <span id="listcount"><\/span><\/summary><div class="grid" id="grid"><\/div><p class="legend">緑：正解 ／ 橙：不正解 ／ •：あとで復習<\/p><\/details><p class="storage" id="storage"><\/p><button class="reset" id="reset">学習記録をリセット<\/button><\/aside><main><article class="card" id="card"><\/article><nav class="navigation" aria-label="問題の移動"><button id="prev">← 前の問題<\/button><button id="next">次の問題 →<\/button><\/nav><\/main><\/div><footer class="footer">問題：第25回介護支援専門員実務研修受講試験（提供PDF）<br>問題文・選択肢は文字で表示します。正答は公式発表に準拠。解説は学習用に作成し、試験時点の制度・統計に対応しています。<br><a href="https://www.pref.hiroshima.lg.jp/site/kaigosiennsennmonninn/r4shikenkekka.html" target="_blank" rel="noopener">試験の公式発表<\/a><a href="https://www.pref.hiroshima.lg.jp/site/kaigosiennsennmonninn/r4shikenkekka.html" target="_blank" rel="noopener">公式正答<\/a><\/footer><\/div>`;
const $=s=>root.querySelector(s);
function matches(q){return (subject==='all'||q.subject===Number(subject))&&(mode==='all'||mode==='unseen'&&!results[q.id]||mode==='wrong'&&results[q.id]&&!correct(q.id)||mode==='marks'&&marks[q.id])}
function rebuild(){order=QUESTIONS.filter(matches).map(q=>q.id);if(!order.includes(index))index=order[0];render()}
function stats(){const care=QUESTIONS.filter(q=>q.id<=25&&correct(q.id)).length,health=QUESTIONS.filter(q=>q.id>25&&correct(q.id)).length;
$('#scores').innerHTML=`<span>介護支援：<strong>${care} / 25点<\/strong>（基準18点）<\/span><span>保健医療福祉：<strong>${health} / 35点<\/strong>（基準26点）<\/span><small>${Object.keys(results).length===60?(care>=18&&health>=26?'第25回の合格基準に達しました。':'第25回の合格基準には、両分野の基準点を満たす必要があります。'):'未回答の問題は得点に含みません。全問解答後、第25回の合格基準と比較します。'} 1問1点・指定数すべて一致で正解（部分点なし）。<\/small>`;
const answered=Object.keys(results).length,n=Object.keys(results).filter(correct).length;$('#stats').innerHTML=`<div class="stat"><b>${answered}<small style="font-size:12px;color:#72858c"> / 60<\/small><\/b><span>回答済み<\/span><\/div><div class="stat"><b>${n}<\/b><span>正解<\/span><\/div><div class="stat"><b>${answered?Math.round(n/answered*100):0}<small style="font-size:12px">%<\/small><\/b><span>正答率<\/span><\/div><div class="progress" role="progressbar" aria-label="回答済み" aria-valuenow="${answered}" aria-valuemin="0" aria-valuemax="60"><i style="width:${answered/60*100}%"><\/i><\/div>`;$('#storage').textContent=storageOK?'学習記録はこのブラウザに自動保存されます。':'この環境では記録を保存できません。ページを閉じると記録が消えます。';}
function nav(){const pos=order.indexOf(index);$('#prev').disabled=pos<=0;$('#next').disabled=pos<0||pos===order.length-1;$('#listcount').textContent=`(${order.length}問)`;$('#grid').innerHTML=order.map(id=>`<button data-id="${id}" class="${results[id]?(correct(id)?'done':'miss'):''} ${index===id?'current':''} ${marks[id]?'flag':''}" aria-label="問題${id}${results[id]?(correct(id)?' 正解':' 不正解'):' 未回答'}${marks[id]?' あとで復習':''}" ${index===id?'aria-current="true"':''}>${id}<\/button>`).join('');}
function render(){save();stats();nav();root.querySelectorAll('[data-mode]').forEach(b=>{b.classList.toggle('active',b.dataset.mode===mode);b.setAttribute('aria-pressed',String(b.dataset.mode===mode))});const q=QUESTIONS[index-1];if(!q||!order.includes(index)){$('#card').innerHTML='<div class="empty"><h2>この範囲の問題はありません<\/h2><p>分野や出題範囲を変更して、学習を続けましょう。<\/p><button id="showall" class="primary">全問に戻る<\/button><\/div>';$('#showall').onclick=()=>{subject='all';mode='all';$('#subject').value='all';rebuild()};return}
revealed=!!results[index];selection=revealed?[...results[index].selected]:[];
const parts=q.question.split('\n\n〔事例〕\n');
$('#card').innerHTML=`<div class="qtop"><span class="tag">${esc(SUBJECTS[q.subject])}<\/span><button id="mark" aria-pressed="${!!marks[index]}">${marks[index]?'★ 復習に登録済み':'☆ あとで復習'}<\/button><\/div><h2 class="qnum" tabindex="-1">問題 ${q.id}<span class="count">${order.indexOf(index)+1} / ${order.length} 問<\/span><\/h2><div class="instruction">${q.answer.length}つ選んで解答してください<\/div><p class="question">${esc(parts[0])}<\/p>${parts.length>1?`<div class="case">〔事例〕<br>${esc(parts.slice(1).join('\n'))}<\/div>`:''}<form id="form"><div class="opts" role="group" aria-label="選択肢">${q.options.map((t,i)=>`<label class="option" data-option="${i+1}"><input type="${q.answer.length===1?'radio':'checkbox'}" name="choice" value="${i+1}" ${selection.includes(i+1)?'checked':''} ${revealed?'disabled':''}><span class="number">${i+1}<\/span><span class="opttext">${esc(t)}<\/span><\/label>`).join('')}<\/div>${q.note?`<details class="notebox"><summary>問題の注記を読む<\/summary><p>${esc(q.note)}<\/p><\/details>`:''}<div class="submitrow" ${revealed?'hidden style="display:none"':''}><button type="submit" class="primary" id="submit" disabled>解答する<\/button><span class="hint" id="hint">${q.answer.length}つ選択してください<\/span><\/div><\/form><div id="feedback" aria-live="polite"><\/div>`;
$('#mark').onclick=()=>{marks[index]=!marks[index];save();$('#mark').textContent=marks[index]?'★ 復習に登録済み':'☆ あとで復習';$('#mark').setAttribute('aria-pressed',String(!!marks[index]));nav()};
$('#form').onchange=()=>{selection=[...root.querySelectorAll('input[name="choice"]:checked')].map(e=>Number(e.value));$('#submit').disabled=selection.length!==q.answer.length;$('#hint').textContent=selection.length>q.answer.length?`${q.answer.length}つに絞ってください`:`${selection.length} / ${q.answer.length}つ選択`;root.querySelectorAll('.option').forEach(el=>el.classList.toggle('selected',selection.includes(Number(el.dataset.option))))};
$('#form').onsubmit=e=>{e.preventDefault();if(selection.length!==q.answer.length||revealed)return;results[index]={selected:[...selection]};render();$('#feedback').scrollIntoView({behavior:'smooth',block:'nearest'})};
if(revealed){const ok=correct(index);root.querySelectorAll('.option').forEach(el=>{const n=Number(el.dataset.option);if(q.answer.includes(n)){el.classList.add('good');el.querySelector('.opttext').insertAdjacentHTML('afterbegin','<span class="optbadge">正答<\/span>')}else if(selection.includes(n)){el.classList.add('bad');el.querySelector('.opttext').insertAdjacentHTML('afterbegin','<span class="optbadge" style="background:#f7d7c8;color:#9d4229">あなたの選択<\/span>')}});$('#feedback').innerHTML=`<section class="feedback ${ok?'':'wrong'}"><div class="resulttitle">${ok?'✓ 正解です！':'もう一度、ポイントを確認しましょう'}<\/div><div class="answer">正答 ${q.answer.join('・')}<\/div><p class="hint">あなたの解答：${selection.join('・')}${q.answer.length>1?' ／ すべて一致で正解':''}<\/p><div class="explabel">シンプル解説<\/div><p class="explanation">${esc(q.explanation)}<\/p><button id="retry" class="retry">この問題を解き直す<\/button>${order.indexOf(index)===order.length-1?'<p class="summarynote">この範囲の最後の問題です。分野や復習モードを切り替えて続けられます。<\/p>':''}<\/section>`;$('#retry').onclick=()=>{delete results[index];render()}}
}
$('#subject').onchange=e=>{subject=e.target.value;rebuild()};root.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;rebuild()});$('#grid').onclick=e=>{const b=e.target.closest('button[data-id]');if(b){index=Number(b.dataset.id);render()}};
function move(step){const n=order.indexOf(index)+step;if(n<0||n>=order.length)return;index=order[n];render();$('.qnum')?.focus({preventScroll:true});$('#card').scrollIntoView({behavior:'smooth',block:'start'})}
$('#prev').onclick=()=>move(-1);$('#next').onclick=()=>move(1);
$('#shuffle').onclick=()=>{order=QUESTIONS.filter(matches).map(q=>q.id);for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}index=order[0];render()};$('#sort').onclick=()=>rebuild();
$('#reset').onclick=()=>{if(confirm('全60問の解答記録と復習マークを削除しますか？')){results={};marks={};index=1;subject='all';mode='all';$('#subject').value='all';rebuild()}};
rebuild();
})();
