<div class="wrap"><header><div><div class="brand">いとう総研 · 確認テスト</div><h1><small>第29回介護支援専門員試験</small>黄金の法則問題</h1><p class="lead">20問を解いて、身についた力を確かめましょう。</p></div><div class="exam-tag"><span>全20問</span><b>20点</b><span>満点</span></div></header>
<div class="ruby-controls" role="group" aria-label="ふりがなの表示"><span>ふりがな</span><button id="ruby-on" aria-pressed="true">ルビあり</button><button id="ruby-off" aria-pressed="false">ルビなし</button></div>
<div class="progressbar"><div class="progress-text" id="progress-text"></div><div class="track" role="progressbar" aria-label="解答済みの問題数" aria-valuemin="0" id="progress"><i id="fill"></i></div><span class="progress-note">正解は最後の採点後に表示</span></div>
<div id="review-banner" class="review-banner" hidden></div><div class="layout"><aside class="sidebar"><section class="map-panel"><h2 id="map-title">問題一覧</h2><nav class="map" id="map" aria-label="問題一覧"></nav><p class="legend" id="legend"></p></section><div class="steps"><h3>取り組み方</h3><p><span>01</span>指定された数の選択肢を選ぶ</p><p><span>02</span><span id="step-count" style="font-weight:normal;color:inherit;margin:0">20問すべてに解答する</span></p><p><span>03</span>最後に「採点する」を押す</p><p>各問1点。正答の組み合わせがすべて一致すると正解です。</p></div><p class="storage" id="storage"></p><button class="textbutton" id="reset">全20問を最初からやり直す</button></aside><main id="main"><div id="notice" class="notice" role="alert" hidden></div><div id="content"></div></main></div>
<footer class="footer">いとう総研資格取得支援センター<br>第29回介護支援専門員試験「黄金の法則問題」・全20問／各1点<br>この得点は本試験の合否判定ではありません。</footer></div>
<dialog class="dialog" id="reset-dialog"><h2>全20問をやり直しますか？</h2><p>このアプリの解答と採点結果を消して、問題1から始めます。</p><div class="dialog-actions"><button id="cancel-reset" autofocus>キャンセル</button><button class="primary" id="confirm-reset">最初からやり直す</button></div></dialog>`;
function renderMap(){
 $('#map-title').textContent=state.mode==='review'?'復習する問題':'問題一覧';
 $('#map').innerHTML=state.ids.map(id=>{const correct=state.graded&&isCorrect(id,state.answers);const status=state.graded?(correct?'正解':'不正解'):ready(id)?'解答済み':state.answers[id-1].length?'選択数を確認':'未解答';return `<button data-id="${id}" class="${state.graded?(correct?'right':'wrong'):ready(id)?'filled':state.answers[id-1].length?'partial':''} ${state.screen==='question'&&state.index===id?'current':''}" aria-label="問題${id} ${status}" ${state.screen==='question'&&state.index===id?'aria-current="step"':''}>${id}</button>`}).join('');
 $('#legend').textContent=state.graded?'緑：正解 ／ 橙：不正解':'緑：解答済み ／ •：選択数を確認';
}
function renderProgress(){$('#step-count').textContent=`${state.ids.length}問すべてに解答する`;const n=state.ids.filter(ready).length;$('#progress-text').innerHTML=`${state.graded?'採点済み':'解答済み'} <b>${n}</b> / ${state.ids.length} 問`;$('#progress').setAttribute('aria-valuenow',n);$('#progress').setAttribute('aria-valuemax',state.ids.length);$('#fill').style.width=`${100*n/state.ids.length}%`;const banner=$('#review-banner');banner.hidden=state.mode!=='review';if(!banner.hidden)banner.textContent=`復習モード：${state.ids.length}問を解き直しています。`+(state.fullResult?` 全20問の採点結果：${score(allIds,state.fullResult.answers)} / 20点。`:'');}
function updateSelection(){const q=QUESTIONS[state.index-1];const a=state.answers[q.id-1];root.querySelectorAll('.option').forEach(label=>label.classList.toggle('selected',a.includes(Number(label.dataset.option))));const count=$('#selection-count');if(count){count.textContent=a.length>q.count?`${q.count}つに絞ってください（現在${a.length}つ選択）。`:`${a.length} / ${q.count}つ選択${a.length===q.count?' · 解答済み':''}`;count.classList.toggle('invalid',a.length>q.count)}const pending=state.ids.filter(id=>!ready(id));if($('#grade-hint'))$('#grade-hint').textContent=pending.length?`あと${pending.length}問に解答すると採点できます。`:'すべての問題に解答しました。採点できます。';renderProgress();renderMap();save();annotateRuby()}
function focusQuestion(){const title=$('#question-title');if(title){title.focus({preventScroll:true});title.scrollIntoView({block:'start',behavior:'auto'})}}
function showQuestion(id){state.index=id;state.screen='question';render();focusQuestion()}
function renderQuestion(){const q=QUESTIONS[state.index-1],a=state.answers[q.id-1],pos=state.ids.indexOf(q.id);const correct=state.graded&&isCorrect(q.id,state.answers);
 $('#content').innerHTML=`<article class="card"><div class="question-top"><h2 class="qtitle" id="question-title" tabindex="-1">問題 ${q.id} <span class="position">${pos+1} / ${state.ids.length}問</span></h2><span class="pill">${q.count}つ選べ</span></div><p class="question">${esc(q.question)}</p><fieldset class="choices"><legend class="sr-only">問題${q.id}の選択肢。${q.count}つ選んでください</legend>${q.options.map((t,i)=>{const n=i+1;const c=state.graded&&q.answer.includes(n),w=state.graded&&a.includes(n)&&!q.answer.includes(n);return `<label class="option ${a.includes(n)?'selected':''} ${c?'correct':''} ${w?'incorrect':''} ${state.graded?'locked':''}" data-option="${n}"><input type="checkbox" value="${n}" aria-label="選択肢${n} ${esc(t)}" ${a.includes(n)?'checked':''} ${state.graded?'disabled':''}><span class="number" aria-hidden="true">${n}</span><span class="opttext">${c?'<span class="badge">正答</span>':w?'<span class="badge">あなたの選択</span>':''}${esc(t)}</span></label>`}).join('')}</fieldset>${state.graded?`<section class="feedback ${correct?'':'wrong'}"><h3>${correct?'○ 正解です！':'× 不正解'}</h3><p><strong>正答：${q.answer.join('・')}</strong></p><p>あなたの解答：${a.join('・')}<br>正答の組み合わせがすべて一致すると1点です。</p></section>`:'<p class="selection-count" id="selection-count" role="status" aria-live="polite"></p>'}</article><nav class="nav" aria-label="問題の移動"><button id="prev" ${pos===0?'disabled':''}>← 前の問題</button><button id="next" ${pos===state.ids.length-1?'disabled':''}>次の問題 →</button></nav><div class="gradebox"><div><strong>${state.graded?'採点が完了しました':state.mode==='review'?'復習問題を最後にまとめて採点':'全20問を最後にまとめて採点'}</strong><p id="grade-hint">${state.graded?'結果一覧で得点と正答を確認できます。':''}</p></div><button class="primary" id="grade">${state.graded?'採点結果を見る':'採点する'}</button></div>`;
 root.querySelectorAll('.choices input').forEach(input=>input.addEventListener('change',()=>{if(state.graded)return;state.answers[q.id-1]=Array.from(root.querySelectorAll('.choices input:checked'),x=>Number(x.value));$('#notice').hidden=true;updateSelection()}));
 $('#prev').onclick=()=>showQuestion(state.ids[pos-1]);$('#next').onclick=()=>showQuestion(state.ids[pos+1]);$('#grade').onclick=grade;
 if(!state.graded)updateSelection();
}
function renderResult(){const n=score(state.ids,state.answers),max=state.ids.length,wrong=wrongIds();let message=n===max?'満点です！ よく頑張りました！':n/max>=.8?'よくできました！ あと一歩で満点です。':n/max>=.6?'最後までよく取り組みました！':'最後まで取り組めました！ ここから一緒に復習しましょう。';
 $('#content').innerHTML=`<section class="result-head"><div class="eyebrow">${state.mode==='full'?'20問の取り組み、お疲れさまでした':'もう一度の挑戦、お疲れさまでした'}</div><h2 id="result-title" tabindex="-1">${state.mode==='full'?'採点結果':'復習の採点結果'}</h2><div class="score" aria-label="${max}点満点中${n}点"><b>${n}</b><span>/ ${max}点</span></div><p class="result-message">${message}</p><p class="result-sub">正解 ${n}問 ／ 不正解 ${max-n}問 · 正答率 ${Math.round(100*n/max)}％</p></section><div class="result-actions">${wrong.length?`<button class="primary" id="review">間違えた${wrong.length}問を解き直す</button>`:''}<button id="check-answers">解答を確認する</button><button class="gold" id="retry-all">全20問をもう一度</button></div><h3 class="table-title">問題ごとの結果</h3><div class="table-wrap"><table><thead><tr><th scope="col">問題</th><th scope="col">あなたの解答</th><th scope="col">正答</th><th scope="col">判定</th></tr></thead><tbody>${state.ids.map(id=>`<tr><td><button data-result-id="${id}">問題${id}</button></td><td>${state.answers[id-1].join('・')}</td><td>${QUESTIONS[id-1].answer.join('・')}</td><td class="${isCorrect(id,state.answers)?'ok':'ng'}">${isCorrect(id,state.answers)?'○ 正解':'× 不正解'}</td></tr>`).join('')}</tbody></table></div><p class="smallnote">問題番号を押すと、問題文と正答を確認できます。各問1点・部分点はありません。</p>`;
 if($('#review'))$('#review').onclick=()=>{const ids=wrongIds();state.ids=ids;state.answers=emptyAnswers();state.index=ids[0];state.graded=false;state.screen='question';state.mode='review';render();focusQuestion()};
 $('#check-answers').onclick=()=>showQuestion(state.ids[0]);$('#retry-all').onclick=openReset;
 root.querySelectorAll('[data-result-id]').forEach(b=>b.onclick=()=>showQuestion(Number(b.dataset.resultId)));
}
function grade(){if(!state.graded){const pending=state.ids.filter(id=>!ready(id));if(pending.length){const notice=$('#notice');notice.textContent=`まだ採点できません。問題${pending.join('・')}の選択数を確認してください。各問題で指定された数を選んでから採点します。`;notice.hidden=false;annotateRuby();notice.scrollIntoView({block:'start'});return}state.graded=true;if(state.mode==='full')state.fullResult={answers:state.answers.map(a=>[...a])};}state.screen='result';render();$('#result-title').focus({preventScroll:true});$('#main').scrollIntoView({block:'start'});}
function render(){renderProgress();renderMap();$('#notice').hidden=true;state.screen==='result'&&state.graded?renderResult():renderQuestion();save();annotateRuby()}
function openReset(){$('#reset-dialog').showModal()}
$('#ruby-on').onclick=()=>setRubyMode(true);$('#ruby-off').onclick=()=>setRubyMode(false);
setRubyMode(rubyEnabled,false);
$('#map').onclick=e=>{const b=e.target.closest('button[data-id]');if(b)showQuestion(Number(b.dataset.id))};
$('#reset').onclick=openReset;$('#cancel-reset').onclick=()=>$('#reset-dialog').close();$('#confirm-reset').onclick=()=>{$('#reset-dialog').close();state=fresh();render();focusQuestion()};
render();
})();
</script>
