(()=>{
'use strict';
const host=document.currentScript.previousElementSibling;
const root=host.attachShadow({mode:'open'});
const QUESTIONS=[{"id":1,"question":"次のうち、成人の認知能力を詳細に評価するための心理検査として、適切なものを1つ選びなさい。","options":["文章完成法テスト","ロールシャッハテスト","ＷＡＩＳ－Ⅳ知能検査","ＷＰＰＳＩ－Ⅲ知能検査","P-F スタディ"],"answer":[3],"subject":0,"explanation":"WAIS-Ⅳは、成人の知的能力を複数の側面から評価する検査です。WPPSIは幼児を対象とする検査です。"},{"id":2,"question":"神経性無食欲症に関する次の記述のうち、正しいものを2つ選びなさい。","options":["身体に対する認知のゆがみがある。","甲状腺機能が亢進する。","無月経となる。","性差では男性に多い。","身体的活動が低下する。"],"answer":[1,3],"subject":0,"explanation":"神経性無食欲症では、体型や体重の捉え方にゆがみがみられます。低栄養やホルモンの変化により、無月経になることもあります。"},{"id":3,"question":"Ａさん（42歳）は、夫（40歳）、娘（10歳）、息子（6歳）の4人家族である。ある日、最大震度7 の地震が起こり、Ａさんの家は半壊した。Ａさんとその家族は全員かすり傷程度のケガで済んだものの、自宅での生活が難しく、避難所である小学校の体育館での生活となった。被災して3日が経過した。避難所を訪れたＤＰＡＴのスタッフに対してＡさんは「倒れてきた家具の下敷きになるところでした。現実のことと思えず、夢を見ているような感覚でした。今でもその時の出来事が何度も思い起こされてとても不安です。夜もよく眠れていません」と話した。次のうち、Ａさんの状態として、適切なものを1つ選びなさい。","options":["全般不安症","ナルコレプシー","強迫症","急性ストレス反応","心気症"],"answer":[4],"subject":0,"explanation":"強い災害体験の直後に、現実感の低下、不安、不眠などが生じています。被災3日後という経過から、急性ストレス反応が適切です。"},{"id":4,"question":"次の記述のうち、うつ病を有する人に特徴的な妄想による発言として、適切なものを1つ選びなさい。","options":["「誰かに盗聴されている」","「家族が預金通帳を盗んだ」","「過去に罪を犯してしまった。今その罰を受けている」","「自分は神だから死ぬことはない」","「自分は高貴な生まれである」"],"answer":[3],"subject":0,"explanation":"うつ病では、自分が重大な罪を犯したと確信する「罪業妄想」がみられることがあります。貧困妄想や心気妄想も代表例です。"},{"id":5,"question":"次のうち、精神疾患の診断・統計マニュアル（ＤＳＭ－5 ）において、自閉スペクトラム症と診断するための症状に含まれるものとして、正しいものを1つ選びなさい。","options":["精神運動焦燥または制止","感覚刺激に対する過敏さまたは鈍感さ","チック症状","気分の高揚","幻覚"],"answer":[2],"subject":0,"explanation":"自閉スペクトラム症の診断基準には、感覚刺激への過敏さや鈍感さが含まれます。感覚の特徴には個人差があります。"},{"id":6,"question":"次の記述のうち、社会生活技能訓練（ＳＳＴ）の説明として、正しいものを1つ選びなさい。","options":["精神分析の考え方を応用したプログラムの一つである。","絶対臥褥により活動意欲を高める。","自己認識を深める心理劇である。","認知行動療法の考えを取り入れている。","絵画や音楽を通じた表現的精神療法の一つである。"],"answer":[4],"subject":0,"explanation":"SSTは認知行動療法の考え方を取り入れています。ロールプレイやフィードバックなどを通じ、生活や対人関係の技能を練習します。"},{"id":7,"question":"次のうち、精神科病院において業務従事者による精神障害者への虐待を発見した者が「精神保健福祉法」に基づいて取るべき行動として、正しいものを1つ選びなさい。","options":["国民健康保険団体連合会への申立て","都道府県への通報","警察署への通報","地方裁判所への申立て","市町村への通報"],"answer":[2],"subject":0,"note":"「精神保健福祉法」とは、「精神保健及び精神障害者福祉に関する法律」のことである。","explanation":"精神科病院の業務従事者による虐待を発見した場合、精神保健福祉法に基づく通報先は都道府県です。"},{"id":8,"question":"Ａさん（30歳、女性）は、母親への殺人未遂の疑いで逮捕された。しかし、起訴前鑑定で、統合失調症に罹患しており「母親を殺せ」という幻聴の強い影響下で犯行に及んだと示された。このため、犯行当時にＡさんは心神喪失状態だったと認められて不起訴処分とされ、検察官から「医療観察法」の審判が申し立てられた。次の記述のうち、申立て後、最初に行われることとして、正しいものを1つ選びなさい。","options":["地方裁判所が鑑定入院を命じる。","地方裁判所において裁判官と精神保健審判員が合議を行い、処遇を決定する。","精神保健参与員が意見を述べる。","多職種チームによる治療を行う。","指定入院医療機関においてＣＰＡ会議を実施する。"],"answer":[1],"subject":0,"note":"「医療観察法」とは、「心神喪失等の状態で重大な他害行為を行った者の医療及び観察等に関する法律」のことである。","explanation":"医療観察法の審判が申し立てられると、原則としてまず鑑定入院が行われます。鑑定などの結果を踏まえて、その後の処遇を決めます。"},{"id":9,"question":"精神医療と保健、福祉との連携に関する次の記述のうち、正しいものを1つ選びなさい。","options":["精神保健福祉センターは、主に精神科医療機関への技術協力を行う機関として位置づけられる。","精神障害にも対応した地域包括ケアシステムは、認知症の高齢者が地域で自立した生活を可能にすることが目的である。","精神科病院の主な役割は、精神疾患への早期介入である。","精神科救急情報センターは、精神科救急に関する文献検索サービスを関係機関に提供する。","認知症初期集中支援チームは、在宅の認知症が疑われる人や認知症の人に対して、多職種で集中的に支援し、地域で暮らし続けられるようにすることを目指す。"],"answer":[5],"subject":0,"explanation":"認知症初期集中支援チームは、本人や家族を訪問し、多職種で集中的に支援します。地域での生活を続けられるようにする取組です。"},{"id":10,"question":"次のうち、「令和2年患者調査」（厚生労働省）において、精神疾患を有する外来患者数の内訳で最も多い傷病分類として、正しいものを1つ選びなさい。","options":["てんかん","統合失調症、統合失調症型障害及び妄想性障害","神経症性障害、ストレス関連障害及び身体表現性障害","精神作用物質使用による精神及び行動の障害","気分［感情］障害（躁うつ病を含む）"],"answer":[5],"subject":1,"explanation":"設問の令和2年患者調査では、精神疾患の外来患者のうち、気分［感情］障害が最も多くなっています。"},{"id":11,"question":"次のうち、吉川武彦が概念化した精神保健活動の三つの側面における支持的精神保健に該当するものとして、正しいものを1つ選びなさい。","options":["こころの健康づくりのための市民講座の開催","在宅の精神疾患患者への訪問指導","高齢住民を対象とした睡眠衛生教育","精神保健福祉ボランティアの育成","住民の精神保健の増進と精神障害者支援のための拠点づくり"],"answer":[2],"subject":1,"explanation":"支持的精神保健は、精神的な不調や障害のある人の生活を支える活動です。在宅の精神疾患患者への訪問指導が当たります。"},{"id":12,"question":"Ａ精神科病院に長期入院していたＢさん（64歳）は、地域移行支援を受けた後、1年前からＣ生活介護事業所を利用しながら地域のアパートで一人暮らしをしている。Ｂさんの食生活は整っており、血圧・血糖値・コレステロールや中性脂肪には問題がなかった。しかし近頃は、長年の運動不足から筋力が低下したことによって、短時間の歩行でも息切れをし、足が上がりにくくＣ事業所内の階段もすぐには上れない状態が目立ち始めた。そこでＣ事業所では、Ｂさんやほかの利用者の状況も鑑み、運動プログラムを取り入れ、Ｂさんにも参加してもらうよう促すことにした。次のうち、Ｂさんの状態を表す症候群として、適切なものを1つ選びなさい。","options":["コルサコフ症候群","メタボリック症候群","ロコモティブ症候群","悪性症候群","ガンザー症候群"],"answer":[3],"subject":1,"explanation":"ロコモティブ症候群は、筋肉・骨・関節などの運動器の障害により、移動機能が低下した状態です。事例では歩行や階段昇降が難しくなっています。"},{"id":13,"question":"次のうち、少年法における「その性格又は環境に照して、将来、罪を犯し、又は刑事法令に触れる行為をする虞のある少年」の呼称として、正しいものを1つ選びなさい。","options":["犯罪少年","触法少年","不良行為少年","ぐ犯少年","特定少年"],"answer":[4],"subject":1,"explanation":"ぐ犯少年は、一定の事由があり、性格や環境から将来犯罪などを行うおそれがある少年です。既に犯罪を行った少年とは区別します。"},{"id":14,"question":"次のうち、文部科学省の「スクールソーシャルワーカー活用事業実施要領」に記載されたスクールソーシャルワーカーの職務内容として、正しいものを2つ選びなさい。","options":["児童の心理状態の評価","児童福祉法に基づく児童の一時保護","学校内におけるチーム体制の構築、支援","学級活動での保健指導","教職員等への研修活動"],"answer":[3,5],"subject":1,"explanation":"スクールソーシャルワーカーの職務には、校内のチーム体制づくりや支援、教職員等への研修が含まれます。"},{"id":15,"question":"職場でのハラスメントに関する次の記述のうち、正しいものを1つ選びなさい。","options":["業務上明らかに不要なことや遂行不可能なことの強制・仕事の妨害は、パワーハラスメントに該当する。","労働者数300名未満の事業場では、ハラスメント対応の措置が事業主の努力義務となっている。","セクシュアルハラスメントの内容として、同性に対するものは対象外である。","マタニティハラスメントの禁止は、母子保健法で規定されている。","ハラスメントに起因する精神障害は、労働災害認定基準から除外されている。"],"answer":[1],"subject":1,"explanation":"業務上明らかに不要な仕事や遂行不可能な仕事を強制する行為は、パワーハラスメントの「過大な要求」に該当します。"},{"id":16,"question":"労働安全衛生法に基づくストレスチェック制度に関する次の記述のうち、正しいものを1つ選びなさい。","options":["2年に1度の実施が義務づけられている。","休職者の職場復帰支援のための仕組みとして創設された。","高ストレスと判定された労働者のうち、希望があった者への医師による面接指導の実施が事業者に義務づけられている。","精神保健福祉士は、厚生労働大臣の定める研修を修了することなく実施者になれる。","検査結果の分析は、地域障害者職業センターが行う。"],"answer":[3],"subject":1,"explanation":"高ストレスと判定され、医師による面接指導が必要とされた労働者から申出があった場合、事業者は面接指導を実施する義務があります。"},{"id":17,"question":"Ａ県精神保健福祉センターのＢ精神保健福祉士のところに、Ｃさんが相談に訪れた。兄を自死で亡くしたというＣさんは、自分と同じように自死で家族を亡くした経験がある人々が集まる「分かち合いの会」を主催しており、行政機関として何らかの協力をしてほしいというものだった。Ｂ精神保健福祉士は上司と相談した結果、センターの会議室の提供と広報への協力をするとともに、「分かち合いの会」に業務として定期的にオブザーバーで参加することとなった。次のうち、この自殺対策活動を表す言葉として、適切なものを1つ選びなさい。","options":["イノベーション","インターベンション","ハームリダクション","プリベンション","ポストベンション"],"answer":[5],"subject":1,"explanation":"ポストベンションは、自殺が起きた後に遺族や周囲の人を支える取組です。遺族の分かち合いの会への支援が該当します。"},{"id":18,"question":"保健師に関する次の記述のうち、正しいものを1つ選びなさい。","options":["児童相談所には、保健師の配置が必須である。","保健所の所長は、保健師でなければならない。","保健師の資格は、地域保健法で定められている。","労働者数50人以上の事業場では、保健師を選任しなければならない。","看護師国家試験に合格しなくても、保健師になることができる。"],"answer":[1],"subject":1,"explanation":"児童相談所には、保健師の配置が必要です。資格の根拠法は、地域保健法ではなく保健師助産師看護師法です。"},{"id":19,"question":"次の記述のうち、障害者福祉を支える理念や概念の説明として、正しいものを1つ選びなさい。","options":["ソーシャルロールバロリゼーション（ＳＲＶ）とは、人間らしく生きる権利の回復を目指すことである。","リハビリテーションとは、人権擁護と公衆衛生の観点から健康・社会・経済上の悪影響を減少させることを主目的とするものである。","バリアフリーとは、重大な逆境に遭遇したにもかかわらず、前向きに生きていこうとする復元力のことである。","エンパワメントとは、無力化された人々が本来持っている力を取り戻し、抑圧的な状況を客観的に批判し主体的な変革を目指すことである。","レジリエンス（resilience）とは、障害や疾患をもつ人というラベルによって生じる社会的不利を軽減することである。"],"answer":[4],"subject":2,"explanation":"エンパワメントは、無力化された人が本来もつ力を取り戻し、自分に影響する状況を主体的に変えていくことです。"},{"id":20,"question":"次のうち、精神科病院での職員による入院患者への暴行等の重大な不祥事件を契機に、任意入院制度を創設した法律として、正しいものを1つ選びなさい。","options":["精神衛生法","精神病者監護法","精神病院法","精神保健法","「精神保健福祉法」"],"answer":[4],"subject":2,"note":"「精神保健福祉法」とは、「精神保健及び精神障害者福祉に関する法律」のことである。","explanation":"宇都宮病院事件などを背景とする1987年の精神保健法への改正で、任意入院制度が創設されました。"},{"id":21,"question":"Ａ高等学校では、保健体育の授業において、心の健康への意識を高め、共生社会への理解を深めることを目的として「こころの健康教育」を実施している。今回は近隣にあるＢ精神科病院のＣ精神保健福祉士と、精神障害当事者のＤさん（63歳、男性）がゲストスピーカーとして招かれた。授業はＣ精神保健福祉士とＤさんの対話形式で進められた。その中で、Ｄさんは精神科病院における35年の入院生活やグループホームへの退院、今の生活の様子を語った。Ｄさんからは、長年病院内で変化のない集団生活を続けたことで気力が失われ、退院を諦めるようになったこと。入院当初は強い思いであった退院を決断するのに長い時間を要したこと。退院した今は、地域に出て良かったと実感するといった気持ちが語られた。次のうち、Ｄさんの語りから考えられる入院中の状態として、適切なものを1つ選びなさい。","options":["施設症","施設コンフリクト","トラウマ","スティグマ","回転ドア現象"],"answer":[1],"subject":2,"explanation":"施設症は、長期間の施設生活などによって、意欲や主体性が低下する状態です。事例では変化の乏しい入院生活から退院を諦めています。"},{"id":22,"question":"次の記述のうち、「精神保健福祉法」に定められている精神障害者の家族の権利・義務として、正しいものを1つ選びなさい。","options":["精神障害者に医療を受けさせるに当たって、医師の指示に従う。","精神障害者が自身を傷つけ又は他人に害を及ぼさないように監督する。","精神障害者の財産上の利益を保護する。","都道府県知事に退院請求の申立てができる。","回復した措置入院者等を引き取る。"],"answer":[4],"subject":2,"explanation":"精神保健福祉法では、入院者の家族等も都道府県知事に退院等を請求できます。かつての保護者制度の義務と区別しましょう。"},{"id":23,"question":"次の記述のうち、精神保健福祉士法成立の社会的背景として、適切なものを1つ選びなさい。","options":["年間自殺者が3万人を超え続け、国民のメンタルヘルスが社会問題化した。","頻発する自然災害に対し、災害派遣精神医療チーム（ＤＰＡＴ）の必要性が高まった。","諸外国と比べて精神科の入院医療を受けている者の割合が高く、入院期間も長期にわたっていた。","「障害者権利条約」を批准するため、国内法の整備が急がれた。","「精神保健医療福祉の改革ビジョン」において、「入院医療中心から地域生活中心へ」が示された。"],"answer":[3],"subject":2,"note":"「障害者権利条約」とは、「障害者の権利に関する条約」のことである。","explanation":"精神保健福祉士法の成立の背景には、精神科の入院率の高さや長期入院の問題がありました。社会復帰を支える専門職が求められていました。"},{"id":24,"question":"次の記述のうち、精神保健福祉士法に規定される精神保健福祉士の義務として、正しいものを2つ選びなさい。","options":["保健医療サービス、障害福祉サービス等の提供者と連携を保つ。","担当する利用者の立場に立って誠実に業務を行う。","資質向上のため、厚生労働省令で定める研修を受講する。","職を辞した後の秘密保持義務は、10年で解除される。","業務を行うに当たっては、主治医の指示を受ける。"],"answer":[1,2],"subject":2,"explanation":"精神保健福祉士には、関係するサービス提供者との連携義務と、本人の立場に立って業務を行う誠実義務があります。"},{"id":25,"question":"次のうち、この電話相談においてＢ精神保健福祉士が優先的に評価すべきこととして、適切なものを1つ選びなさい。\n\n〔事例〕\n会社を定年退職したＡさん（60代後半）は、昨年妻を事故で亡くし、一人息子（30代）と二人で暮らしている。息子は仕事でのトラブル等が重なり、自宅にひきこもって3年になる。Ａさんは息子を一度強く叱責し拒絶されてからは話し掛けることもできなくなり、息子を心配しながら一人で家事を担い、日々を過ごしていた。最近Ａさんは生活の中で年齢を感じることが増え、自分に何かあったら息子はどうなるだろうとの思いから、県のホームページで見付けたひきこもり地域支援センター（以下「センター」という。）に電話をかけた。息子とうまく関係を築けず拒絶されているように感じること、3年もひきこもっている息子の将来についての心配などをＡさんはしっかりした口調で話した。電話を受けたＢ精神保健福祉士はその話を傾聴し、Ａさんをねぎらい、センターとして関わりたいことを伝え、情報を整理した。（問題25）\n\nセンターの対応に安堵したＡさんは、Ｂ精神保健福祉士とであれば息子のことについて進展を得られるように感じ、時折センターに出向くようになった。そのうちＡさんは、いつまでこの状態が続くのか、自分の息子だけなぜこうなのかなど、悩みを具体的に語るようになった。そこでＢ精神保健福祉士は、センターで行われている「ひきこもり家族の会」（以下「家族会」という。）への参加をＡさんに勧めた。（問題26）\n\n家族会に参加したＡさんは、そこでの学びからセンターに行った感想を添えたメッセージや「名刺の人が話をしてみたいそうだ」とＢ精神保健福祉士の名刺を添えたセンターのチラシを台所のテーブルに置くようになった。息子はそれらを夜中に台所で読んでいるようだった。ある日、Ｂ精神保健福祉士のところに電話がかかってきた。Ｂ精神保健福祉士は、その名前からＡさんの息子からであることに気付いた。Ａさんの息子は、仕事も続かず、職場でも家でも誰ともうまくやれないこと、学生時代もそうだったことなどを語った。（問題27）","options":["息子の精神的健康","息子の就労能力","現在の経済状況","Ａさんの家事負担","Ａさんの現在の発達課題"],"answer":[1],"subject":2,"explanation":"まず、ひきこもっている息子の心の健康状態を、得られた情報から慎重に把握します。就労を急がず、必要な支援を見極めるためです。"},{"id":26,"question":"次の記述のうち、この時点でＢ精神保健福祉士がＡさんに参加を勧めた理由として、最も適切なものを1つ選びなさい。\n\n〔事例〕\n会社を定年退職したＡさん（60代後半）は、昨年妻を事故で亡くし、一人息子（30代）と二人で暮らしている。息子は仕事でのトラブル等が重なり、自宅にひきこもって3年になる。Ａさんは息子を一度強く叱責し拒絶されてからは話し掛けることもできなくなり、息子を心配しながら一人で家事を担い、日々を過ごしていた。最近Ａさんは生活の中で年齢を感じることが増え、自分に何かあったら息子はどうなるだろうとの思いから、県のホームページで見付けたひきこもり地域支援センター（以下「センター」という。）に電話をかけた。息子とうまく関係を築けず拒絶されているように感じること、3年もひきこもっている息子の将来についての心配などをＡさんはしっかりした口調で話した。電話を受けたＢ精神保健福祉士はその話を傾聴し、Ａさんをねぎらい、センターとして関わりたいことを伝え、情報を整理した。（問題25）\n\nセンターの対応に安堵したＡさんは、Ｂ精神保健福祉士とであれば息子のことについて進展を得られるように感じ、時折センターに出向くようになった。そのうちＡさんは、いつまでこの状態が続くのか、自分の息子だけなぜこうなのかなど、悩みを具体的に語るようになった。そこでＢ精神保健福祉士は、センターで行われている「ひきこもり家族の会」（以下「家族会」という。）への参加をＡさんに勧めた。（問題26）\n\n家族会に参加したＡさんは、そこでの学びからセンターに行った感想を添えたメッセージや「名刺の人が話をしてみたいそうだ」とＢ精神保健福祉士の名刺を添えたセンターのチラシを台所のテーブルに置くようになった。息子はそれらを夜中に台所で読んでいるようだった。ある日、Ｂ精神保健福祉士のところに電話がかかってきた。Ｂ精神保健福祉士は、その名前からＡさんの息子からであることに気付いた。Ａさんの息子は、仕事も続かず、職場でも家でも誰ともうまくやれないこと、学生時代もそうだったことなどを語った。（問題27）","options":["体験を共有する場を提供するため。","グリーフケアのため。","若者支援の社会活動に参加してもらうため。","コミュニケーション能力を高めるため。","家族会のファシリテーターになってもらうため。"],"answer":[1],"subject":2,"explanation":"家族会では、同じような経験をもつ家族と悩みや体験を共有できます。孤立感を和らげ、対応のヒントを得る機会になります。"},{"id":27,"question":"次の記述のうち、この段階でＢ精神保健福祉士が考えた関わりの内容として、適切なものを1つ選びなさい。\n\n〔事例〕\n会社を定年退職したＡさん（60代後半）は、昨年妻を事故で亡くし、一人息子（30代）と二人で暮らしている。息子は仕事でのトラブル等が重なり、自宅にひきこもって3年になる。Ａさんは息子を一度強く叱責し拒絶されてからは話し掛けることもできなくなり、息子を心配しながら一人で家事を担い、日々を過ごしていた。最近Ａさんは生活の中で年齢を感じることが増え、自分に何かあったら息子はどうなるだろうとの思いから、県のホームページで見付けたひきこもり地域支援センター（以下「センター」という。）に電話をかけた。息子とうまく関係を築けず拒絶されているように感じること、3年もひきこもっている息子の将来についての心配などをＡさんはしっかりした口調で話した。電話を受けたＢ精神保健福祉士はその話を傾聴し、Ａさんをねぎらい、センターとして関わりたいことを伝え、情報を整理した。（問題25）\n\nセンターの対応に安堵したＡさんは、Ｂ精神保健福祉士とであれば息子のことについて進展を得られるように感じ、時折センターに出向くようになった。そのうちＡさんは、いつまでこの状態が続くのか、自分の息子だけなぜこうなのかなど、悩みを具体的に語るようになった。そこでＢ精神保健福祉士は、センターで行われている「ひきこもり家族の会」（以下「家族会」という。）への参加をＡさんに勧めた。（問題26）\n\n家族会に参加したＡさんは、そこでの学びからセンターに行った感想を添えたメッセージや「名刺の人が話をしてみたいそうだ」とＢ精神保健福祉士の名刺を添えたセンターのチラシを台所のテーブルに置くようになった。息子はそれらを夜中に台所で読んでいるようだった。ある日、Ｂ精神保健福祉士のところに電話がかかってきた。Ｂ精神保健福祉士は、その名前からＡさんの息子からであることに気付いた。Ａさんの息子は、仕事も続かず、職場でも家でも誰ともうまくやれないこと、学生時代もそうだったことなどを語った。（問題27）","options":["ひきこもり対応として、外出する場面を設定する。","社会的な役割を得るために、当事者の会の立ち上げを促す。","就労支援を始めるために、職業評価を受けるよう提案する。","父親に自分の気持ちを伝えるために、社会生活技能訓練（ＳＳＴ）を行う。","支援者として関係を築くために、無知の姿勢をとる。"],"answer":[5],"subject":2,"explanation":"「無知の姿勢」は、支援者が分かったつもりにならず、本人から学ぶ態度です。本人の経験や思いを聴き、信頼関係を築きます。"},{"id":28,"question":"地域活動支援センターで精神保健福祉士の実習を行っている学生Ａさんは、利用者Ｂさんとの関係形成を進めている。Ｂさんから「友人ができなくて寂しい」と聞き、自分もそのような経験があって悩んだことを自己開示した。その日の実習を終え、帰り支度をしていると、Ｂさんから声を掛けられ「私と似たような経験をしているＡさんなら、私のことを分かってくれる。友達になってほしい」と言われた。ＡさんはＢさんから信頼されているのだと思い「実習中ならいいですよ」と答えた。次の日、Ｂさんから「今日から友達ね」と声を掛けられた。Ａさんは昨日の対応で良かったのか心配になり、実習指導者のＣ精神保健福祉士に相談すると「専門的援助関係について、改めて考えていきましょう」と指導を受けた。次のうち、Ｃ精神保健福祉士がＡさんに指導した内容として、適切なものを1つ選びなさい。","options":["パターナリズム","非審判的態度","バウンダリー","ナチュラルサポート","役割拘束"],"answer":[3],"subject":3,"explanation":"バウンダリーは、専門的援助関係と私的な関係との境界です。友人関係と援助関係を混同しないことが大切です。"},{"id":29,"question":"次の記述のうち、精神保健福祉士が面接で用いる「感情の反映」の説明として、正しいものを1つ選びなさい。","options":["クライエントの表現をそのまま繰り返す。","クライエントの話に込められている気持ちを言語化する。","クライエントが話したことをまとめてフィードバックする。","クライエントの感情を尊重し認める。","クライエントの思いと行動のずれを明らかにする。"],"answer":[2],"subject":3,"explanation":"感情の反映は、本人の話に込められた気持ちを言葉にして返す技法です。本人が自分の感情に気づくことを支えます。"},{"id":30,"question":"次の記述のうち、離転職を繰り返す精神障害者に対して精神保健福祉士が行うナラティブアプローチとして、適切なものを1つ選びなさい。","options":["クライエント自身の職場適応の課題を細分化し整理して、短期集中で解決を図る。","クライエントの語りから、問題となった出来事と本人を切り離す。","クライエントの離転職にまつわる思い込みのストーリーにある誤りを指摘する。","クライエントとの対話を通して離転職要因を1つに特定する。","離転職した経緯の語りから、成長を促すために機関で可能な支援の展開を図式化する。"],"answer":[2],"subject":3,"explanation":"ナラティブアプローチでは、問題と本人を切り離す「外在化」を用います。本人そのものを問題とみなさず、新しい捉え方を探ります。"},{"id":31,"question":"次の記述のうち、インターディシプリナリー・モデルによる支援として、正しいものを2つ選びなさい。","options":["入院時カンファレンスで、医師の指導により精神保健福祉士が患者の家族関係を確認する。","精神科デイ・ケアで、看護師が運動プログラムを担当する。","包括型地域生活支援（ＡＣＴ）チームで、作業療法士がクライエントの服薬状況を確認する。","多職種が対等な立場で参加する地域移行支援会議で、精神保健福祉士からクライエントが活用できる制度について述べる。","ケア会議で、就労支援及び医療機関スタッフがそれぞれ専門職の立場から意見を述べ合い支援方針を決める。"],"answer":[4,5],"subject":3,"explanation":"インターディシプリナリー・モデルでは、各職種が専門性を保ちながら、対等に意見を交換して共通の支援方針を決めます。"},{"id":32,"question":"次の記述のうち、精神保健福祉士が行うコミュニティワークとして、適切なものを2つ選びなさい。","options":["住民が運営し、精神障害の有無にかかわらず集えるサロンの立ち上げを支援する。","精神科デイ・ケアでの話合いで、地域にある居場所の見学を企画する。","自治会と共に精神障害の理解に関する住民ヒアリングを行い、結果をまとめる。","障害福祉サービスの利用を希望する精神障害者のセルフプラン立案を支援する。","精神保健福祉ボランティアグループの定例会で、ファシリテーターを担う。"],"answer":[1,3],"subject":3,"explanation":"住民主体のサロンづくりや、自治会と行う住民への聞き取りは、地域のつながりや支援基盤を整えるコミュニティワークです。"},{"id":33,"question":"次の記述のうち、精神保健福祉士が行うソーシャルアクションとして、適切なものを1つ選びなさい。","options":["積極的に地域へ出向き、支援が必要なクライエントを発見する。","社会資源の開発のために、国や地方自治体に働きかける。","社会関係資本を形成するために、地域における人々の精神的な絆を強める。","クライエントの支援に関する助言を他の専門職に求める。","クライエントのニーズを充足するために、社会資源につなげる。"],"answer":[2],"subject":3,"explanation":"ソーシャルアクションは、制度や社会の仕組みを変えるための働きかけです。資源の開発を国や自治体に求める活動が該当します。"},{"id":34,"question":"次の記述のうち、この時にＣ精神保健福祉士がＡさんに返した言葉として、適切なものを1つ選びなさい。\n\n〔事例〕\nＡさん（53歳、男性）は、35歳の時「誰かが自分の悪口を言っている」と訴えたことから、両親に付き添われてＢ精神科病院を受診した。そこで統合失調症と診断され、1年間入院した。退院後は両親と暮らしながら治療を続けた。その間に父親が亡くなり、49歳の時に母親が認知症を発症し、Ａさんが母親の世話をすることになった。50歳の時にＡさんは介護のストレスから病状が悪化し「自分の悪口がテレビで流れている」と夜中に大声を出してテレビを自宅前に放り出し、近所を巻き込む騒ぎとなり、今回の入院となった。Ａさんの入院後、母親は民生委員から見守り支援を受けていたが、高齢者施設へ入所した。入院から1年経過した後、病棟担当になったＣ精神保健福祉士は、前任者から「Ａさんは退院可能だが、退院に消極的」と引継ぎを受け、Ａさんと面談をした。Ａさんは「不都合なこともないし、このままでいい。自宅は誰も居ないし、一人暮らしは経験がないし、人と話すのは苦手だから無理」と話した。（問題34）\n\nＣ精神保健福祉士は、地域移行支援を利用して退院したＤさんをＡさんに紹介し、体験談を話してもらった。Ｄさんとの交流が半年ほど続き、Ａさんは「自分も退院できるかな」とＣ精神保健福祉士に話した。そこで、Ｃ精神保健福祉士はＡさんを地域移行支援の利用につなげ、指定一般相談支援事業所のＥ精神保健福祉士が支援を開始した。Ｅ精神保健福祉士は、初回面談でＡさんから退院への期待や不安などの揺れ動く気持ちを聞いた。それを踏まえ、Ａさんに対して支援を行った。（問題35）\n\nＡさんはＥ精神保健福祉士とグループホームを見学したが、ほかの入居者との交流に負担を感じたため、自宅への退院も考え始めた。Ｅ精神保健福祉士と共に数度自宅へ外出をした後、1人で外泊した。外泊後、Ｅ精神保健福祉士と面談したＡさんは「家の中は何とかなるかもしれない。でも、近所に迷惑を掛けたので、近所の目が怖い。本当は買物にも行きたいのだけど」と話した。（問題36）\n\nその後、Ａさんは退院し、障害福祉サービスを利用して一人暮らしを続けている。","options":["「不都合がないなら、今のままでも悪くはないですね」","「では、退院先をグループホームにしましょう」","「退院後の生活を考えると、不安を感じるのですね」","「まだ50代だから、退院を諦めてはいけませんよ」","「退院して、あなたはどこで誰と暮らしていますか」"],"answer":[3],"subject":3,"explanation":"まず、退院後の生活への不安を言葉にして受け止めます。本人の気持ちを確かめながら、次の支援を一緒に考えます。"},{"id":35,"question":"次の記述のうち、Ｅ精神保健福祉士がＡさんに行った支援として、適切なものを1つ選びなさい。\n\n〔事例〕\nＡさん（53歳、男性）は、35歳の時「誰かが自分の悪口を言っている」と訴えたことから、両親に付き添われてＢ精神科病院を受診した。そこで統合失調症と診断され、1年間入院した。退院後は両親と暮らしながら治療を続けた。その間に父親が亡くなり、49歳の時に母親が認知症を発症し、Ａさんが母親の世話をすることになった。50歳の時にＡさんは介護のストレスから病状が悪化し「自分の悪口がテレビで流れている」と夜中に大声を出してテレビを自宅前に放り出し、近所を巻き込む騒ぎとなり、今回の入院となった。Ａさんの入院後、母親は民生委員から見守り支援を受けていたが、高齢者施設へ入所した。入院から1年経過した後、病棟担当になったＣ精神保健福祉士は、前任者から「Ａさんは退院可能だが、退院に消極的」と引継ぎを受け、Ａさんと面談をした。Ａさんは「不都合なこともないし、このままでいい。自宅は誰も居ないし、一人暮らしは経験がないし、人と話すのは苦手だから無理」と話した。（問題34）\n\nＣ精神保健福祉士は、地域移行支援を利用して退院したＤさんをＡさんに紹介し、体験談を話してもらった。Ｄさんとの交流が半年ほど続き、Ａさんは「自分も退院できるかな」とＣ精神保健福祉士に話した。そこで、Ｃ精神保健福祉士はＡさんを地域移行支援の利用につなげ、指定一般相談支援事業所のＥ精神保健福祉士が支援を開始した。Ｅ精神保健福祉士は、初回面談でＡさんから退院への期待や不安などの揺れ動く気持ちを聞いた。それを踏まえ、Ａさんに対して支援を行った。（問題35）\n\nＡさんはＥ精神保健福祉士とグループホームを見学したが、ほかの入居者との交流に負担を感じたため、自宅への退院も考え始めた。Ｅ精神保健福祉士と共に数度自宅へ外出をした後、1人で外泊した。外泊後、Ｅ精神保健福祉士と面談したＡさんは「家の中は何とかなるかもしれない。でも、近所に迷惑を掛けたので、近所の目が怖い。本当は買物にも行きたいのだけど」と話した。（問題36）\n\nその後、Ａさんは退院し、障害福祉サービスを利用して一人暮らしを続けている。","options":["退院した患者の定期的な集いに同行した。","精神障害者保健福祉手帳の取得を提案した。","宿泊型自立訓練の体験を調整した。","今回の入院の初期支援が適切に行われていたか評価した。","生活福祉資金貸付制度について説明した。"],"answer":[1],"subject":3,"explanation":"退院した人の集いに同行すると、地域生活の実際を知り、経験を聴けます。期待と不安のある本人が、生活を具体的に考える助けになります。"},{"id":36,"question":"次の記述のうち、この後にＥ精神保健福祉士が行う支援として、適切なものを1つ選びなさい。\n\n〔事例〕\nＡさん（53歳、男性）は、35歳の時「誰かが自分の悪口を言っている」と訴えたことから、両親に付き添われてＢ精神科病院を受診した。そこで統合失調症と診断され、1年間入院した。退院後は両親と暮らしながら治療を続けた。その間に父親が亡くなり、49歳の時に母親が認知症を発症し、Ａさんが母親の世話をすることになった。50歳の時にＡさんは介護のストレスから病状が悪化し「自分の悪口がテレビで流れている」と夜中に大声を出してテレビを自宅前に放り出し、近所を巻き込む騒ぎとなり、今回の入院となった。Ａさんの入院後、母親は民生委員から見守り支援を受けていたが、高齢者施設へ入所した。入院から1年経過した後、病棟担当になったＣ精神保健福祉士は、前任者から「Ａさんは退院可能だが、退院に消極的」と引継ぎを受け、Ａさんと面談をした。Ａさんは「不都合なこともないし、このままでいい。自宅は誰も居ないし、一人暮らしは経験がないし、人と話すのは苦手だから無理」と話した。（問題34）\n\nＣ精神保健福祉士は、地域移行支援を利用して退院したＤさんをＡさんに紹介し、体験談を話してもらった。Ｄさんとの交流が半年ほど続き、Ａさんは「自分も退院できるかな」とＣ精神保健福祉士に話した。そこで、Ｃ精神保健福祉士はＡさんを地域移行支援の利用につなげ、指定一般相談支援事業所のＥ精神保健福祉士が支援を開始した。Ｅ精神保健福祉士は、初回面談でＡさんから退院への期待や不安などの揺れ動く気持ちを聞いた。それを踏まえ、Ａさんに対して支援を行った。（問題35）\n\nＡさんはＥ精神保健福祉士とグループホームを見学したが、ほかの入居者との交流に負担を感じたため、自宅への退院も考え始めた。Ｅ精神保健福祉士と共に数度自宅へ外出をした後、1人で外泊した。外泊後、Ｅ精神保健福祉士と面談したＡさんは「家の中は何とかなるかもしれない。でも、近所に迷惑を掛けたので、近所の目が怖い。本当は買物にも行きたいのだけど」と話した。（問題36）\n\nその後、Ａさんは退院し、障害福祉サービスを利用して一人暮らしを続けている。","options":["近所の目が怖くなくなってから退院することを提案する。","Ａさんが外泊する際、Ｄさんに付き添ってもらうよう調整する。","近所との関係修復を図るために、1 軒ずつお詫びに回る。","次回の外泊時には外出しないで済むよう、必要な物をＡさんと事前に準備する。","Ａさんと一緒に、民生委員に近所付き合いのサポートを依頼しに行く。"],"answer":[5],"subject":3,"explanation":"本人と一緒に民生委員へ相談し、近所との関係を支えてもらいます。本人の希望を尊重しながら、地域のつながりを整える支援です。"},{"id":37,"question":"次の記述のうち、アンソニー（Anthony,W.）らによる「精神科リハビリテーションの基本原則」に関するものとして、正しいものを1つ選びなさい。","options":["就労支援は除外される。","最大の焦点は、早期の回復を目指し退院させることである。","当事者は専門職への依存を避け、自身の力で自立を目指す。","様々な技法を折衷的に駆使する。","専門職が主導的にリハビリテーション計画を作成する。"],"answer":[4],"subject":4,"explanation":"精神科リハビリテーションでは、本人の希望や状況に応じて、様々な技法を柔軟に組み合わせます。特定の方法だけに限定しません。"},{"id":38,"question":"次の記述のうち、パーソナルリカバリーの説明として、正しいものを1つ選びなさい。","options":["激しい症状が治まり、薬を必要としない状態になること。","支援者がクライエントの利益のために、本人の意思に関わりなく判断すること。","支援者が定めた方針に、クライエントが従うこと。","専門職が自らの支援やその役割について責任をもって説明を行うこと。","障害があっても希望をもって新たな人生を再発見し、主体的に生きること。"],"answer":[5],"subject":4,"explanation":"パーソナルリカバリーは、障害や症状があっても、希望をもち、自分にとって意味のある人生を主体的に生きる過程です。"},{"id":39,"question":"Ａ精神保健福祉士が勤務する地域活動支援センターでは、これまで新型コロナウィルス感染症の流行のため利用人数や利用時間を制限していたが、全面的に再開した。再開後これまでのメンバーに加えて、新たなメンバーも増えてきた。メンバー同士の交流が増えるにつれて、Ａ精神保健福祉士に対して「他の人からの誘いを断りたいけど、うまく断れなくて困っている」「自分の意見や考えをうまく伝えられるようになりたい」といった相談が多くなった。そこでＡ精神保健福祉士は、相手の気持ちを大切にしながら自分の意見を主張できることを目指す集団プログラムの実施をメンバーに提案した。次のうち、このプログラムとして、適切なものを1つ選びなさい。","options":["リワークプログラム","アサーショントレーニング","ＴＥＡＣＣＨ","ＳＭＡＲＰＰ","ＩＭＲ"],"answer":[2],"subject":4,"explanation":"アサーショントレーニングは、自分も相手も尊重しながら気持ちや意見を伝える練習です。断り方や要望の伝え方などを学びます。"},{"id":40,"question":"次の記述のうち、この時点のＢ精神保健福祉士の対応として、適切なものを1つ選びなさい。\n\n〔事例〕\nある日、市役所の精神保健に関する相談窓口にＡさん（43歳）が来庁し、担当のＢ精神保健福祉士に話をした。Ａさんによると、会社員である夫（45歳）は、日頃の仕事のストレスに起因する過度の飲酒が原因で体調を崩し、身体疾患の治療のため入院をした。その後、退院を迎えるに当たり、Ａさんと夫は、主治医から「体調は落ち着きましたが、アルコール依存症の可能性があるので、精神科の受診を勧めます」と提案を受けた。ところが、退院後、夫に精神科を受診するよう話したが全く聞こうとせず、激しく怒り出すようになった。また、夫が飲酒を再開してしまい、そのことについて、Ａさんも夫に対し「なぜお酒を飲むの」と怒りの感情をぶつけたことから夫婦関係は悪化した。自分の力だけではどうにもならないと感じるようになり相談窓口を訪れたとのことであった。（問題40）\n\nＡさんの話からＢ精神保健福祉士は、精神保健福祉センターで実施されているプログラムを紹介した。それは、アルコール依存症が疑われる人が精神科を受診しようとしない時に、本人のキーパーソンとなる人に介入することで、本人を受診につなげるための包括的なプログラムである。その説明を受け、Ａさんからはプログラムへの参加の意思が示された。（問題41）\n\nこのプログラムに参加するようになり、しばらくして夫は精神科病院を受診することができた。夫は2か月休職し、入院治療を受けたことで自身の病状についての理解が進んだ。退院後間もなく、Ａさんは夫と共に退院の報告を兼ねてＢ精神保健福祉士のもとを訪れた。夫は「いろいろありがとうございました。無事に退院したのですが、実は、ストレスがたまるとまた飲酒しそうで怖いです。どうしたら良いでしょうか」と語り、Ａさんも「夫が飲酒を再開しないために、私も夫と一緒にやれることを探したいです」と述べた。Ｂ精神保健福祉士は、精神科の主治医に相談することも重要であることを説明しつつ、家族も参加できるアルコール依存症の患者本人を対象とした自助グループを紹介した。（問題42）","options":["夫のケアを担うＡさんの能力について評価を行う。","Ａさんの怒りの感情や無力感に対して肯定的に関わる。","夫の入院治療を強く勧める。","夫の客観的情報の収集を優先して行う。","Ａさんがイネイブラーとして夫を支える重要性を説明する。"],"answer":[2],"subject":4,"explanation":"まず、家族が抱えている怒りや無力感を受け止めます。家族も支援を必要とする人として、その苦労や気持ちを大切にします。"},{"id":41,"question":"次の記述のうち、このプログラムの特徴として、正しいものを1つ選びなさい。\n\n〔事例〕\nある日、市役所の精神保健に関する相談窓口にＡさん（43歳）が来庁し、担当のＢ精神保健福祉士に話をした。Ａさんによると、会社員である夫（45歳）は、日頃の仕事のストレスに起因する過度の飲酒が原因で体調を崩し、身体疾患の治療のため入院をした。その後、退院を迎えるに当たり、Ａさんと夫は、主治医から「体調は落ち着きましたが、アルコール依存症の可能性があるので、精神科の受診を勧めます」と提案を受けた。ところが、退院後、夫に精神科を受診するよう話したが全く聞こうとせず、激しく怒り出すようになった。また、夫が飲酒を再開してしまい、そのことについて、Ａさんも夫に対し「なぜお酒を飲むの」と怒りの感情をぶつけたことから夫婦関係は悪化した。自分の力だけではどうにもならないと感じるようになり相談窓口を訪れたとのことであった。（問題40）\n\nＡさんの話からＢ精神保健福祉士は、精神保健福祉センターで実施されているプログラムを紹介した。それは、アルコール依存症が疑われる人が精神科を受診しようとしない時に、本人のキーパーソンとなる人に介入することで、本人を受診につなげるための包括的なプログラムである。その説明を受け、Ａさんからはプログラムへの参加の意思が示された。（問題41）\n\nこのプログラムに参加するようになり、しばらくして夫は精神科病院を受診することができた。夫は2か月休職し、入院治療を受けたことで自身の病状についての理解が進んだ。退院後間もなく、Ａさんは夫と共に退院の報告を兼ねてＢ精神保健福祉士のもとを訪れた。夫は「いろいろありがとうございました。無事に退院したのですが、実は、ストレスがたまるとまた飲酒しそうで怖いです。どうしたら良いでしょうか」と語り、Ａさんも「夫が飲酒を再開しないために、私も夫と一緒にやれることを探したいです」と述べた。Ｂ精神保健福祉士は、精神科の主治医に相談することも重要であることを説明しつつ、家族も参加できるアルコール依存症の患者本人を対象とした自助グループを紹介した。（問題42）","options":["対立的手法を積極的に活用する。","日本で開発されたものである。","家族が「私」という一人称を主語にして、患者本人に思いを伝える方法を学ぶ。","専門職から患者本人への直接的な働きかけに重きを置く。","アルコール依存症に特化したプログラムである。"],"answer":[3],"subject":4,"explanation":"事例のプログラムはCRAFTです。家族が「私は」と自分の気持ちを伝える方法などを学び、関係改善や本人の受診につなげます。"},{"id":42,"question":"次のうち、Ｂ精神保健福祉士が紹介した自助グループとして、正しいものを1つ選びなさい。\n\n〔事例〕\nある日、市役所の精神保健に関する相談窓口にＡさん（43歳）が来庁し、担当のＢ精神保健福祉士に話をした。Ａさんによると、会社員である夫（45歳）は、日頃の仕事のストレスに起因する過度の飲酒が原因で体調を崩し、身体疾患の治療のため入院をした。その後、退院を迎えるに当たり、Ａさんと夫は、主治医から「体調は落ち着きましたが、アルコール依存症の可能性があるので、精神科の受診を勧めます」と提案を受けた。ところが、退院後、夫に精神科を受診するよう話したが全く聞こうとせず、激しく怒り出すようになった。また、夫が飲酒を再開してしまい、そのことについて、Ａさんも夫に対し「なぜお酒を飲むの」と怒りの感情をぶつけたことから夫婦関係は悪化した。自分の力だけではどうにもならないと感じるようになり相談窓口を訪れたとのことであった。（問題40）\n\nＡさんの話からＢ精神保健福祉士は、精神保健福祉センターで実施されているプログラムを紹介した。それは、アルコール依存症が疑われる人が精神科を受診しようとしない時に、本人のキーパーソンとなる人に介入することで、本人を受診につなげるための包括的なプログラムである。その説明を受け、Ａさんからはプログラムへの参加の意思が示された。（問題41）\n\nこのプログラムに参加するようになり、しばらくして夫は精神科病院を受診することができた。夫は2か月休職し、入院治療を受けたことで自身の病状についての理解が進んだ。退院後間もなく、Ａさんは夫と共に退院の報告を兼ねてＢ精神保健福祉士のもとを訪れた。夫は「いろいろありがとうございました。無事に退院したのですが、実は、ストレスがたまるとまた飲酒しそうで怖いです。どうしたら良いでしょうか」と語り、Ａさんも「夫が飲酒を再開しないために、私も夫と一緒にやれることを探したいです」と述べた。Ｂ精神保健福祉士は、精神科の主治医に相談することも重要であることを説明しつつ、家族も参加できるアルコール依存症の患者本人を対象とした自助グループを紹介した。（問題42）","options":["断酒会","ギャマノン（GAM-ANON）","アラノン（Al-Anon）","ナラノン（Nar-Anon）","ナルコティクス・アノニマス（ＮＡ）"],"answer":[1],"subject":4,"explanation":"断酒会は、アルコール依存症の本人と家族が参加し、体験を語り合いながら断酒を支える自助グループです。"},{"id":43,"question":"次のうち、「精神保健福祉法」に規定されている機関として、正しいものを1つ選びなさい。","options":["発達障害者支援センター","市町村保健センター","認知症疾患医療センター","基幹相談支援センター","精神保健福祉センター"],"answer":[5],"subject":5,"note":"「精神保健福祉法」とは、「精神保健及び精神障害者福祉に関する法律」のことである。","explanation":"精神保健福祉センターは、精神保健福祉法に規定されています。精神保健福祉に関する専門的な相談や技術的な支援などを行います。"},{"id":44,"question":"精神医療審査会に関する次の記述のうち、正しいものを1つ選びなさい。","options":["市町村が事務を行う。","精神障害当事者を委員とすることが必須である。","定期病状報告の審査対象から措置入院者は除外される。","入院者からの電話による退院請求は審査の対象となる。","精神科病院の管理者に入院者の処遇改善を命令できる。"],"answer":[4],"subject":5,"explanation":"退院請求は、電話によるものも審査の対象です。書面を作成できないことなどを理由に、請求の機会が失われないようにします。"},{"id":45,"question":"生活保護制度に関する次の記述のうち、正しいものを2つ選びなさい。","options":["保護の基準額は、全国一律である。","精神障害者が申請する場合、資力調査は免除される。","原則として、住宅扶助は現物給付である。","原則として、世帯単位で保護の要否及び程度が定められる。","精神障害者保健福祉手帳の1級及び2級所持者には、生活扶助の障害者加算がある。"],"answer":[4,5],"subject":5,"explanation":"生活保護は原則として世帯単位で判断します。また、精神障害者保健福祉手帳1級・2級の所持者は、所定の要件のもとで障害者加算の対象になります。"},{"id":46,"question":"次のうち、この入院形態として、正しいものを1つ選びなさい。\n\n〔事例〕\nＡさん（40歳、男性）はＢ県Ｃ市に在住し、5年前に父親の会社を継ぎ、Ａさんを含む社員5名で製造業を営んでいた。Ａさんは独身できょうだいはおらず、両親は既に亡くなっていて交流のある親戚もいない。Ａさんは真面目な性格で朝から晩まで仕事をするも、不況のあおりを受けて近年は赤字続きで、自分のせいで会社が潰れてしまうと悩んでいた。最近では食事量が減って、見るからにやつれたＡさんの状況を見て社員はとても心配していた。さらに「死んでしまいたい」という発言も多くみられるようになり、社員は精神科受診を勧めた。Ａさんは当初受診を拒否していたが、社員らに連れられて渋々Ｄ精神科病院を受診した。精神保健指定医である医師は入院治療の必要性を認めたが、Ａさんは頑なに入院を拒否した。身寄りもないことからＣ市長同意による入院の手続が行われた。（問題46）\n\n「精神保健福祉法」に基づきＤ精神科病院の管理者から選任されたＥ精神保健福祉士はＡさんに自己紹介をして、今後のことなどについて丁寧な説明を行った。（問題47）\n\nその後もＥ精神保健福祉士はＡさんとの面談を定期的に行うなど支援を継続した。Ａさんの経過は良好で3か月後には症状は安定していた。主治医からも退院可能であると 。主治医からも退院可能であると判断がなされたため、Ｅ精神保健福祉士はＡさんの退院支援委員会開催の準備を行った。落ち着いてきたＡさんは「会社の経営が厳しいので、医療費の負担を少しでも軽くしたい」と面談の中で話した。そこでＥ精神保健福祉士は、Ａさんの退院後の精神科の通院医療費の負担軽減のために、「障害者総合支援法」に規定されているサービス利用を提案したところ、Ａさんも是非利用したいと述べた。（問題48）","options":["障害支援区分の認定を必要とする。","申請窓口は市町村である。","入院医療費も適用の対象となる。","利用は6か月が限度である。","所得にかかわらず、自己負担額は同じである。"],"answer":[2],"subject":5,"explanation":"提案された制度は、自立支援医療（精神通院医療）です。申請窓口は市町村で、精神科への通院医療費の自己負担を軽減します。","note":"「障害者総合支援法」とは、「障害者の日常生活及び社会生活を総合的に支援するための法律」のことである。"}], SUBJECTS=["精神医学と精神医療", "現代の精神保健の課題と支援", "精神保健福祉の原理", "ソーシャルワークの理論と方法（専門）", "精神障害リハビリテーション論", "精神保健福祉制度論"];

 const pendingGroups=groups.filter(g=>g.score===null),zeroGroups=groups.filter(g=>g.score===0);

function matches(q){return (subject==='all'||q.subject===Number(subject))&&(mode==='all'||mode==='unseen'&&!results[q.id]||mode==='wrong'&&results[q.id]&&!correct(q.id)||mode==='marks'&&marks[q.id])}
function rebuild(){order=QUESTIONS.filter(matches).map(q=>q.id);if(!order.includes(index))index=order[0];render()}
function stats(){const wrongCount=QUESTIONS.filter(q=>results[q.id]&&!correct(q.id)).length;$('#reviewwrong').textContent=`全科目の間違えた問題だけ（${wrongCount}問）`;$('#wronghelp').textContent='最後の解答が不正解の問題を抽出します。正解すると次回の抽出から外れます。';const answered=Object.keys(results).length,n=Object.keys(results).filter(correct).length;$('#stats').innerHTML=`<div class="stat"><b>${answered}<small style="font-size:12px;color:#72858c"> / 48<\/small><\/b><span>回答済み<\/span><\/div><div class="stat"><b>${n}<\/b><span>正解<\/span><\/div><div class="stat"><b>${answered?Math.round(n/answered*100):0}<small style="font-size:12px">%<\/small><\/b><span>正答率<\/span><\/div><div class="progress" role="progressbar" aria-label="回答済み" aria-valuenow="${answered}" aria-valuemin="0" aria-valuemax="48"><i style="width:${answered/48*100}%"><\/i><\/div>`;$('#storage').textContent=storageOK?'学習記録はこのブラウザに自動保存されます。':'この環境では記録を保存できません。ページを閉じると記録が消えます。';}
function nav(){const pos=order.indexOf(index);$('#prev').disabled=pos<=0;$('#next').disabled=pos<0||pos===order.length-1;$('#listcount').textContent=`(${order.length}問)`;$('#grid').innerHTML=[...new Set(QUESTIONS.map(q=>q.subject))].map(subjectId=>{const ids=order.filter(id=>QUESTIONS[id-1].subject===subjectId).sort((a,b)=>a-b);if(!ids.length)return '';return `<section class="subject-group"><h3 class="subject-title">${subjectId+1} ${esc(SUBJECTS[subjectId])}</h3><p class="subject-range">問題 ${ids[0]}${ids.length>1?'〜'+ids[ids.length-1]:''} · ${ids.length}問</p><div class="subject-numbers">`+ids.map(id=>`<button data-id="${id}" class="${results[id]?(correct(id)?'done':'miss'):''} ${index===id?'current':''} ${marks[id]?'flag':''}" aria-label="問題${id}${results[id]?(correct(id)?' 正解':' 不正解'):' 未回答'}${marks[id]?' あとで復習':''}" ${index===id?'aria-current="true"':''}>${id}<\/button>`).join('')+'</div></section>';}).join('');}
function render(){save();stats();renderPassCheck();nav();root.querySelectorAll('[data-mode]').forEach(b=>{b.classList.toggle('active',b.dataset.mode===mode);b.setAttribute('aria-pressed',String(b.dataset.mode===mode))});const q=QUESTIONS[index-1];if(!q||!order.includes(index)){$('#card').innerHTML='<div class="empty"><h2>この範囲の問題はありません<\/h2><p>科目や出題範囲を変更して、学習を続けましょう。<\/p><button id="showall" class="primary">全問に戻る<\/button><\/div>';$('#showall').onclick=()=>{subject='all';mode='all';$('#subject').value='all';rebuild()};return}
revealed=!!results[index]&&retrying!==index;selection=revealed?[...results[index].selected]:[];
const parts=q.question.split('\n\n〔事例〕\n');
$('#card').innerHTML=`<div class="qtop"><span class="tag">${esc(SUBJECTS[q.subject])}<\/span><button id="mark" aria-pressed="${!!marks[index]}">${marks[index]?'★ 復習に登録済み':'☆ あとで復習'}<\/button><\/div><h2 class="qnum" tabindex="-1">問題 ${q.id}<span class="count">${order.indexOf(index)+1} / ${order.length} 問<\/span><\/h2><div class="instruction">${q.answer.length}つ選んで解答してください<\/div><p class="question">${esc(parts[0])}<\/p>${parts.length>1?`<div class="case">〔事例〕<br>${esc(parts.slice(1).join('\n'))}<\/div>`:''}<form id="form"><div class="opts" role="group" aria-label="選択肢">${q.options.map((t,i)=>`<label class="option" data-option="${i+1}"><input type="${q.answer.length===1?'radio':'checkbox'}" name="choice" value="${i+1}" ${selection.includes(i+1)?'checked':''} ${revealed?'disabled':''}><span class="number">${i+1}<\/span><span class="opttext">${esc(t)}<\/span><\/label>`).join('')}<\/div>${q.note?`<details class="notebox"><summary>問題の注記を読む<\/summary><p>${esc(q.note)}<\/p><\/details>`:''}<div class="submitrow" ${revealed?'hidden style="display:none"':''}><button type="submit" class="primary" id="submit" disabled>解答する<\/button><span class="hint" id="hint">${q.answer.length}つ選択してください<\/span><\/div><\/form><div id="feedback" aria-live="polite"><\/div>`;
$('#mark').onclick=()=>{marks[index]=!marks[index];save();$('#mark').textContent=marks[index]?'★ 復習に登録済み':'☆ あとで復習';$('#mark').setAttribute('aria-pressed',String(!!marks[index]));nav()};
$('#form').onchange=()=>{selection=[...root.querySelectorAll('input[name="choice"]:checked')].map(e=>Number(e.value));$('#submit').disabled=selection.length!==q.answer.length;$('#hint').textContent=selection.length>q.answer.length?`${q.answer.length}つに絞ってください`:`${selection.length} / ${q.answer.length}つ選択`;root.querySelectorAll('.option').forEach(el=>el.classList.toggle('selected',selection.includes(Number(el.dataset.option))))};
$('#form').onsubmit=e=>{e.preventDefault();if(selection.length!==q.answer.length||revealed)return;results[index]={selected:[...selection]};retrying=null;render();$('#feedback').scrollIntoView({behavior:'smooth',block:'nearest'})};
if(revealed){const ok=correct(index);root.querySelectorAll('.option').forEach(el=>{const n=Number(el.dataset.option);if(q.answer.includes(n)){el.classList.add('good');el.querySelector('.opttext').insertAdjacentHTML('afterbegin','<span class="optbadge">正答<\/span>')}else if(selection.includes(n)){el.classList.add('bad');el.querySelector('.opttext').insertAdjacentHTML('afterbegin','<span class="optbadge" style="background:#f7d7c8;color:#9d4229">あなたの選択<\/span>')}});$('#feedback').innerHTML=`<section class="feedback ${ok?'':'wrong'}"><div class="resulttitle">${ok?'✓ 正解です！':'もう一度、ポイントを確認しましょう'}<\/div><div class="answer">正答 ${q.answer.join('・')}<\/div><p class="hint">あなたの解答：${selection.join('・')}${q.answer.length>1?' ／ すべて一致で正解':''}<\/p><div class="explabel">シンプル解説<\/div><p class="explanation">${esc(q.explanation)}<\/p><button id="retry" class="retry">この問題を解き直す<\/button>${order.indexOf(index)===order.length-1?'<p class="summarynote">この範囲の最後の問題です。科目や復習モードを切り替えて続けられます。<\/p>':''}<\/section>`;$('#retry').onclick=()=>{retrying=index;render()}}
}
$('#pass-mode').value=passMode;
$('#pass-mode').onchange=e=>{passMode=e.target.value==='full'?'full':'exempt';save();renderPassCheck();stats();};
$('#common-entry').oninput=e=>{const input=e.target.closest('input[data-common]');if(!input)return;commonScores[Number(input.dataset.common)]=input.value;save();renderPassCheck();stats();};
$('#pass-toggle').onclick=()=>{const detail=$('#pass-detail'),open=detail.hidden;detail.hidden=!open;$('#pass-toggle').setAttribute('aria-expanded',String(open));$('#pass-toggle').textContent=open?'判定を閉じる':'合格ラインを確認';if(open){renderPassCheck();$('#pass-title').focus({preventScroll:true});detail.scrollIntoView({behavior:'smooth',block:'nearest'});}};
$('#reviewwrong').onclick=()=>{retrying=null;subject='all';mode='wrong';$('#subject').value='all';rebuild();$('.map').open=true;$('#card').scrollIntoView({behavior:'smooth',block:'start'})};
$('#subject').onchange=e=>{subject=e.target.value;rebuild()};root.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{retrying=null;mode=b.dataset.mode;rebuild();if(mode==='wrong')$('.map').open=true});$('#grid').onclick=e=>{const b=e.target.closest('button[data-id]');if(b){index=Number(b.dataset.id);render()}};
function move(step){const n=order.indexOf(index)+step;if(n<0||n>=order.length)return;index=order[n];render();$('.qnum')?.focus({preventScroll:true});$('#card').scrollIntoView({behavior:'smooth',block:'start'})}
$('#prev').onclick=()=>move(-1);$('#next').onclick=()=>move(1);
$('#shuffle').onclick=()=>{order=QUESTIONS.filter(matches).map(q=>q.id);for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}index=order[0];render()};$('#sort').onclick=()=>rebuild();
$('#reset').onclick=()=>{if(confirm('全48問の解答記録・復習マークと、入力した共通科目の得点を削除しますか？')){results={};marks={};commonScores=COMMON_GROUPS.map(()=>'');root.querySelectorAll('input[data-common]').forEach(input=>input.value='');retrying=null;index=1;subject='all';mode='all';$('#subject').value='all';rebuild()}};
rebuild();
})();

/*]]>*/
</script>
