rt><\/ruby>から<ruby>言語<rt>げんご<\/rt><\/ruby>の<ruby>表出<rt>ひょうしゅつ<\/rt><\/ruby>，<ruby>自発<rt>じはつ<\/rt><\/ruby><ruby>呼吸<rt>こきゅう<\/rt><\/ruby>が<ruby>困難<rt>こんなん<\/rt><\/ruby>となり，<ruby>人工呼吸器<rt>じんこうこきゅうき<\/rt><\/ruby>の<ruby>装着<rt>そうちゃく<\/rt><\/ruby>について<ruby>検討<rt>けんとう<\/rt><\/ruby>することとなった。","Ｇさん，家族，医療・ケアチームによる話し合いの場を設定する。":"Ｇさん，<ruby>家族<rt>かぞく<\/rt><\/ruby>，<ruby>医療<rt>いりょう<\/rt><\/ruby>・ケアチームによる<ruby>話<rt>はな<\/rt><\/ruby>し<ruby>合<rt>あ<\/rt><\/ruby>いの<ruby>場<rt>ば<\/rt><\/ruby>を<ruby>設定<rt>せってい<\/rt><\/ruby>する。","Ｈさんの妻は，Ｈさんの成年後見監督人になることができる。":"Ｈさんの<ruby>妻<rt>つま<\/rt><\/ruby>は，Ｈさんの<ruby>成年<rt>せいねん<\/rt><\/ruby><ruby>後見<rt>こうけん<\/rt><\/ruby><ruby>監督<rt>かんとく<\/rt><\/ruby><ruby>人<rt>にん<\/rt><\/ruby>になることができる。","Ｈさんの希望は就職であることから，適応訓練についてはあっせんしない。":"Ｈさんの<ruby>希望<rt>きぼう<\/rt><\/ruby>は<ruby>就職<rt>しゅうしょく<\/rt><\/ruby>であることから，<ruby>適応<rt>てきおう<\/rt><\/ruby><ruby>訓練<rt>くんれん<\/rt><\/ruby>についてはあっせんしない。","Ｈさんの病状を整理するために，ソシオグラムを作成する。":"Ｈさんの<ruby>病状<rt>びょうじょう<\/rt><\/ruby>を<ruby>整理<rt>せいり<\/rt><\/ruby>するために，ソシオグラムを<ruby>作成<rt>さくせい<\/rt><\/ruby>する。","Ｈさんの確実な就職のため，一般企業ではなく特例子会社の求人を紹介する。":"Ｈさんの<ruby>確実<rt>かくじつ<\/rt><\/ruby>な<ruby>就職<rt>しゅうしょく<\/rt><\/ruby>のため，<ruby>一般企業<rt>いっぱんきぎょう<\/rt><\/ruby>ではなく<ruby>特例子会社<rt>とくれいこがいしゃ<\/rt><\/ruby>の<ruby>求人<rt>きゅうじん<\/rt><\/ruby>を<ruby>紹介<rt>しょうかい<\/rt><\/ruby>する。","Ｈさん（45 歳）は，妻と中学生の子との3 人家族だったが，先日，妻が業務上の事故によって死亡した。Ｈさんは，数年前に，持病のためそれまで勤めていた会社を退職し，それ以来，無職，無収入のまま民間企業で働く妻の健康保険の被扶養者になっていた。":"Ｈさん（45 <ruby>歳<rt>さい<\/rt><\/ruby>）は，<ruby>妻<rt>つま<\/rt><\/ruby>と<ruby>中学生<rt>ちゅうがくせい<\/rt><\/ruby>の<ruby>子<rt>こ<\/rt><\/ruby>との3 <ruby>人<rt>にん<\/rt><\/ruby><ruby>家族<rt>かぞく<\/rt><\/ruby>だったが，<ruby>先日<rt>せんじつ<\/rt><\/ruby>，<ruby>妻<rt>つま<\/rt><\/ruby>が<ruby>業務上<rt>ぎょうむじょう<\/rt><\/ruby>の<ruby>事故<rt>じこ<\/rt><\/ruby>によって<ruby>死亡<rt>しぼう<\/rt><\/ruby>した。Ｈさんは，<ruby>数<rt>すう<\/rt><\/ruby><ruby>年<rt>ねん<\/rt><\/ruby><ruby>前<rt>まえ<\/rt><\/ruby>に，<ruby>持病<rt>じびょう<\/rt><\/ruby>のためそれまで<ruby>勤<rt>つと<\/rt><\/ruby>めていた<ruby>会社<rt>かいしゃ<\/rt><\/ruby>を<ruby>退職<rt>たいしょく<\/rt><\/ruby>し，それ<ruby>以来<rt>いらい<\/rt><\/ruby>，<ruby>無職<rt>むしょく<\/rt><\/ruby>，<ruby>無収入<rt>むしゅうにゅう<\/rt><\/ruby>のまま<ruby>民間<rt>みんかん<\/rt><\/ruby><ruby>企業<rt>きぎょう<\/rt><\/ruby>で<ruby>働<rt>はたら<\/rt><\/ruby>く<ruby>妻<rt>つま<\/rt><\/ruby>の<ruby>健康保険<rt>けんこうほけん<\/rt><\/ruby>の<ruby>被扶養者<rt>ひふようしゃ<\/rt><\/ruby>になっていた。","Ｈは，多額の財産を遺して死亡した。Ｈの相続人は，配偶者Ｊ，子のＫ・Ｌ・Ｍ，Ｈよりも先に死亡した子Ａの子（Ｈの孫）であるＢ・Ｃの計6 人である。なお，Ｌは養子であり，Ｍは非嫡出子である。Ｈは生前にＭを認知している。":"Ｈは，<ruby>多額<rt>たがく<\/rt><\/ruby>の<ruby>財産<rt>ざいさん<\/rt><\/ruby>を<ruby>遺<rt>のこ<\/rt><\/ruby>して<ruby>死亡<rt>しぼう<\/rt><\/ruby>した。Ｈの<ruby>相続人<rt>そうぞくにん<\/rt><\/ruby>は，<ruby>配偶者<rt>はいぐうしゃ<\/rt><\/ruby>Ｊ，<ruby>子<rt>こ<\/rt><\/ruby>のＫ・Ｌ・Ｍ，Ｈよりも<ruby>先<rt>さき<\/rt><\/ruby>に<ruby>死亡<rt>しぼう<\/rt><\/ruby>した<ruby>子<rt>こ<\/rt><\/ruby>Ａの<ruby>子<rt>こ<\/rt><\/ruby>（Ｈの<ruby>孫<rt>まご<\/rt><\/ruby>）であるＢ・Ｃの<ruby>計<rt>けい<\/rt><\/ruby>6 <ruby>人<rt>にん<\/rt><\/ruby>である。なお，Ｌは<ruby>養子<rt>ようし<\/rt><\/ruby>であり，Ｍは<ruby>非嫡出子<rt>ひちゃくしゅつし<\/rt><\/ruby>である。Ｈは<ruby>生前<rt>せいぜん<\/rt><\/ruby>にＭを<ruby>認知<rt>にんち<\/rt><\/ruby>している。","Ｊさんが自ら意思決定できるよう，実行可能なあらゆる支援を行う。":"Ｊさんが<ruby>自<rt>みずか<\/rt><\/ruby>ら<ruby>意思決定<rt>いしけってい<\/rt><\/ruby>できるよう，<ruby>実行<rt>じっこう<\/rt><\/ruby><ruby>可能<rt>かのう<\/rt><\/ruby>なあらゆる<ruby>支援<rt>しえん<\/rt><\/ruby>を<ruby>行<rt>おこな<\/rt><\/ruby>う。","Ｊさんが障害の原因となった事故を起こした時に，健康保険の被保険者であった場合は，給与の全額に相当する傷病手当金を継続して受給することができる。":"Ｊさんが<ruby>障害<rt>しょうがい<\/rt><\/ruby>の<ruby>原因<rt>げんいん<\/rt><\/ruby>となった<ruby>事故<rt>じこ<\/rt><\/ruby>を<ruby>起<rt>お<\/rt><\/ruby>こした<ruby>時<rt>とき<\/rt><\/ruby>に，<ruby>健康保険<rt>けんこうほけん<\/rt><\/ruby>の<ruby>被保険者<rt>ひほけんしゃ<\/rt><\/ruby>であった<ruby>場合<rt>ばあい<\/rt><\/ruby>は，<ruby>給与<rt>きゅうよ<\/rt><\/ruby>の<ruby>全額<rt>ぜんがく<\/rt><\/ruby>に<ruby>相当<rt>そうとう<\/rt><\/ruby>する<ruby>傷病手当金<rt>しょうびょうてあてきん<\/rt><\/ruby>を<ruby>継続<rt>けいぞく<\/rt><\/ruby>して<ruby>受給<rt>じゅきゅう<\/rt><\/ruby>することができる。","Ｊさんには意思決定能力がないものとして支援を行う。":"Ｊさんには<ruby>意思決定<rt>いしけってい<\/rt><\/ruby><ruby>能力<rt>のうりょく<\/rt><\/ruby>がないものとして<ruby>支援<rt>しえん<\/rt><\/ruby>を<ruby>行<rt>おこな<\/rt><\/ruby>う。","Ｊさんに未成年の子がある場合は，Ｊさんは特別障害者手当を受給できる。":"Ｊさんに<ruby>未成年<rt>みせいねん<\/rt><\/ruby>の<ruby>子<rt>こ<\/rt><\/ruby>がある<ruby>場合<rt>ばあい<\/rt><\/ruby>は，Ｊさんは<ruby>特別障害者<rt>とくべつしょうがいしゃ<\/rt><\/ruby><ruby>手当<rt>てあて<\/rt><\/ruby>を<ruby>受給<rt>じゅきゅう<\/rt><\/ruby>できる。","Ｊさんの障害の原因となった事故が17 歳の時のものである場合は，20 歳以降に障害基礎年金を受給できるが，Ｊさんの所得によっては，その一部又は全部が停止される可能性がある。":"Ｊさんの<ruby>障害<rt>しょうがい<\/rt><\/ruby>の<ruby>原因<rt>げんいん<\/rt><\/ruby>となった<ruby>事故<rt>じこ<\/rt><\/ruby>が17 <ruby>歳<rt>さい<\/rt><\/ruby>の<ruby>時<rt>とき<\/rt><\/ruby>のものである<ruby>場合<rt>ばあい<\/rt><\/ruby>は，20 <ruby>歳<rt>さい<\/rt><\/ruby><ruby>以降<rt>いこう<\/rt><\/ruby>に<ruby>障害基礎年金<rt>しょうがいきそねんきん<\/rt><\/ruby>を<ruby>受給<rt>じゅきゅう<\/rt><\/ruby>できるが，Ｊさんの<ruby>所得<rt>しょとく<\/rt><\/ruby>によっては，その<ruby>一部<rt>いちぶ<\/rt><\/ruby><ruby>又<rt>また<\/rt><\/ruby>は<ruby>全部<rt>ぜんぶ<\/rt><\/ruby>が<ruby>停止<rt>ていし<\/rt><\/ruby>される<ruby>可能性<rt>かのうせい<\/rt><\/ruby>がある。","Ｊさんの障害の原因となった事故が25 歳の時のものであった場合は，年金制度への加入歴が定められた期間に満たないので，障害基礎年金を受給できない。":"Ｊさんの<ruby>障害<rt>しょうがい<\/rt><\/ruby>の<ruby>原因<rt>げんいん<\/rt><\/ruby>となった<ruby>事故<rt>じこ<\/rt><\/ruby>が25 <ruby>歳<rt>さい<\/rt><\/ruby>の<ruby>時<rt>とき<\/rt><\/ruby>のものであった<ruby>場合<rt>ばあい<\/rt><\/ruby>は，<ruby>年金制度<rt>ねんきんせいど<\/rt><\/ruby>への<ruby>加入<rt>かにゅう<\/rt><\/ruby><ruby>歴<rt>れき<\/rt><\/ruby>が<ruby>定<rt>さだ<\/rt><\/ruby>められた<ruby>期間<rt>きかん<\/rt><\/ruby>に<ruby>満<rt>み<\/rt><\/ruby>たないので，<ruby>障害基礎年金<rt>しょうがいきそねんきん<\/rt><\/ruby>を<ruby>受給<rt>じゅきゅう<\/rt><\/ruby>できない。","Ｊさんの障害の原因となった事故が雇用労働者であった時のものである場合は，労働者災害補償保険の障害補償給付を受けられる。":"Ｊさんの<ruby>障害<rt>しょうがい<\/rt><\/ruby>の<ruby>原因<rt>げんいん<\/rt><\/ruby>となった<ruby>事故<rt>じこ<\/rt><\/ruby>が<ruby>雇用<rt>こよう<\/rt><\/ruby><ruby>労働者<rt>ろうどうしゃ<\/rt><\/ruby>であった<ruby>時<rt>とき<\/rt><\/ruby>のものである<ruby>場合<rt>ばあい<\/rt><\/ruby>は，<ruby>労働者災害補償保険<rt>ろうどうしゃさいがいほしょうほけん<\/rt><\/ruby>の<ruby>障害補償給付<rt>しょうがいほしょうきゅうふ<\/rt><\/ruby>を<ruby>受<rt>う<\/rt><\/ruby>けられる。","Ｊさんは，以前休日にオートバイを運転して行楽に出かける途中，誤ってガードレールに衝突する自損事故を起こし，それが原因で，その時から障害基礎年金の1 級相当の障害者となった。現在は30 歳で，自宅で電動車いすを利用して暮らしている。":"Ｊさんは，<ruby>以前<rt>いぜん<\/rt><\/ruby><ruby>休日<rt>きゅうじつ<\/rt><\/ruby>にオートバイを<ruby>運転<rt>うんてん<\/rt><\/ruby>して<ruby>行楽<rt>こうらく<\/rt><\/ruby>に<ruby>出<rt>で<\/rt><\/ruby>かける<ruby>途中<rt>とちゅう<\/rt><\/ruby>，<ruby>誤<rt>あやま<\/rt><\/ruby>ってガードレールに<ruby>衝突<rt>しょうとつ<\/rt><\/ruby>する<ruby>自損<rt>じそん<\/rt><\/ruby><ruby>事故<rt>じこ<\/rt><\/ruby>を<ruby>起<rt>お<\/rt><\/ruby>こし，それが<ruby>原因<rt>げんいん<\/rt><\/ruby>で，その<ruby>時<rt>とき<\/rt><\/ruby>から<ruby>障害基礎年金<rt>しょうがいきそねんきん<\/rt><\/ruby>の1 <ruby>級<rt>きゅう<\/rt><\/ruby><ruby>相当<rt>そうとう<\/rt><\/ruby>の<ruby>障害者<rt>しょうがいしゃ<\/rt><\/ruby>となった。<ruby>現在<rt>げんざい<\/rt><\/ruby>は30 <ruby>歳<rt>さい<\/rt><\/ruby>で，<ruby>自宅<rt>じたく<\/rt><\/ruby>で<ruby>電動車<rt>でんどうしゃ<\/rt><\/ruby>いすを<ruby>利用<rt>りよう<\/rt><\/ruby>して<ruby>暮<rt>く<\/rt><\/ruby>らしている。","Ｋさんが継続的に医療を受けるよう，保護司に指導を指示する。":"Ｋさんが<ruby>継続的<rt>けいぞくてき<\/rt><\/ruby>に<ruby>医療<rt>いりょう<\/rt><\/ruby>を<ruby>受<rt>う<\/rt><\/ruby>けるよう，<ruby>保護司<rt>ほごし<\/rt><\/ruby>に<ruby>指導<rt>しどう<\/rt><\/ruby>を<ruby>指示<rt>しじ<\/rt><\/ruby>する。","Ｋさんに「自宅での療養で困っていることはありますか」と聞き，新たな要望やニーズの有無を確認する。":"Ｋさんに「<ruby>自宅<rt>じたく<\/rt><\/ruby>での<ruby>療養<rt>りょうよう<\/rt><\/ruby>で<ruby>困<rt>こま<\/rt><\/ruby>っていることはありますか」と<ruby>聞<rt>き<\/rt><\/ruby>き，<ruby>新<rt>あら<\/rt><\/ruby>たな<ruby>要望<rt>ようぼう<\/rt><\/ruby>やニーズの<ruby>有無<rt>うむ<\/rt><\/ruby>を<ruby>確認<rt>かくにん<\/rt><\/ruby>する。","Ｋさんの夫に「病気になる前はどのように暮らしていましたか」と聞き，Ｋさんの生活歴を確認する。":"Ｋさんの<ruby>夫<rt>おっと<\/rt><\/ruby>に「<ruby>病気<rt>びょうき<\/rt><\/ruby>になる<ruby>前<rt>まえ<\/rt><\/ruby>はどのように<ruby>暮<rt>く<\/rt><\/ruby>らしていましたか」と<ruby>聞<rt>き<\/rt><\/ruby>き，Ｋさんの<ruby>生活<rt>せいかつ<\/rt><\/ruby><ruby>歴<rt>れき<\/rt><\/ruby>を<ruby>確認<rt>かくにん<\/rt><\/ruby>する。","Ｋさん（60 歳）は，呼吸器機能に障害があり病院に入院していたが，退院後には自宅で在宅酸素療法を行うことになった。Ｋさんとその夫は，在宅療養支援診療所のＪと話し合いながら，訪問診療，訪問看護，訪問介護等を導入して自宅療養体制を整えた。療養開始後1 か月が経ち，Ｊはモニタリングを行うことにした。":"Ｋさん（60 <ruby>歳<rt>さい<\/rt><\/ruby>）は，<ruby>呼吸器<rt>こきゅうき<\/rt><\/ruby><ruby>機能<rt>きのう<\/rt><\/ruby>に<ruby>障害<rt>しょうがい<\/rt><\/ruby>があり<ruby>病院<rt>びょういん<\/rt><\/ruby>に<ruby>入院<rt>にゅういん<\/rt><\/ruby>していたが，<ruby>退院後<rt>たいいんご<\/rt><\/ruby>には<ruby>自宅<rt>じたく<\/rt><\/ruby>で<ruby>在宅<rt>ざいたく<\/rt><\/ruby><ruby>酸素<rt>さんそ<\/rt><\/ruby><ruby>療法<rt>りょうほう<\/rt><\/ruby>を<ruby>行<rt>おこな<\/rt><\/ruby>うことになった。Ｋさんとその<ruby>夫<rt>おっと<\/rt><\/ruby>は，<ruby>在宅<rt>ざいたく<\/rt><\/ruby><ruby>療養<rt>りょうよう<\/rt><\/ruby><ruby>支援<rt>しえん<\/rt><\/ruby><ruby>診療所<rt>しんりょうじょ<\/rt><\/ruby>のＪと<ruby>話<rt>はな<\/rt><\/ruby>し<ruby>合<rt>あ<\/rt><\/ruby>いながら，<ruby>訪問<rt>ほうもん<\/rt><\/ruby><ruby>診療<rt>しんりょう<\/rt><\/ruby>，<ruby>訪問<rt>ほうもん<\/rt><\/ruby><ruby>看護<rt>かんご<\/rt><\/ruby>，<ruby>訪問<rt>ほうもん<\/rt><\/ruby><ruby>介護<rt>かいご<\/rt><\/ruby><ruby>等<rt>とう<\/rt><\/ruby>を<ruby>導入<rt>どうにゅう<\/rt><\/ruby>して<ruby>自宅<rt>じたく<\/rt><\/ruby><ruby>療養<rt>りょうよう<\/rt><\/ruby><ruby>体制<rt>たいせい<\/rt><\/ruby>を<ruby>整<rt>ととの<\/rt><\/ruby>えた。<ruby>療養<rt>りょうよう<\/rt><\/ruby><ruby>開始<rt>かいし<\/rt><\/ruby><ruby>後<rt>ご<\/rt><\/ruby>1 か<ruby>月<rt>げつ<\/rt><\/ruby>が<ruby>経<rt>た<\/rt><\/ruby>ち，Ｊはモニタリングを<ruby>行<rt>おこな<\/rt><\/ruby>うことにした。","Ｋは，変形性膝関節症で外来通院中のＬさん（82 歳，女性，独居，要支援2 ）から相談を受けた。Ｌさんは屋外の歩行が不自由で杖を使っているが，介護サービス等は利用していない。Ｌさんは，数年ぶりに趣味の歌舞伎鑑賞に出かけようと思い，介護保険制度のサービス利用について市役所に問い合わせたところ「本市では趣味のための移動支援は実施していない」と説明されたと言う。Ｌさんは転倒の心配もあり，歌舞伎鑑賞には見守り支援を利用したいと言っている。":"Ｋは，<ruby>変形性<rt>へんけいせい<\/rt><\/ruby><ruby>膝関節症<rt>しつかんせつしょう<\/rt><\/ruby>で<ruby>外来<rt>がいらい<\/rt><\/ruby><ruby>通院<rt>つういん<\/rt><\/ruby><ruby>中<rt>ちゅう<\/rt><\/ruby>のＬさん（82 <ruby>歳<rt>さい<\/rt><\/ruby>，<ruby>女性<rt>じょせい<\/rt><\/ruby>，<ruby>独居<rt>どっきょ<\/rt><\/ruby>，<ruby>要支援<rt>ようしえん<\/rt><\/ruby>2 ）から<ruby>相談<rt>そうだん<\/rt><\/ruby>を<ruby>受<rt>う<\/rt><\/ruby>けた。Ｌさんは<ruby>屋外<rt>おくがい<\/rt><\/ruby>の<ruby>歩行<rt>ほこう<\/rt><\/ruby>が<ruby>不自由<rt>ふじゆう<\/rt><\/ruby>で<ruby>杖<rt>つえ<\/rt><\/ruby>を<ruby>使<rt>つか<\/rt><\/ruby>っているが，<ruby>介護<rt>かいご<\/rt><\/ruby>サービス<ruby>等<rt>とう<\/rt><\/ruby>は<ruby>利用<rt>りよう<\/rt><\/ruby>していない。Ｌさんは，<ruby>数<rt>すう<\/rt><\/ruby><ruby>年<rt>ねん<\/rt><\/ruby>ぶりに<ruby>趣味<rt>しゅみ<\/rt><\/ruby>の<ruby>歌舞伎<rt>かぶき<\/rt><\/ruby><ruby>鑑賞<rt>かんしょう<\/rt><\/ruby>に<ruby>出<rt>で<\/rt><\/ruby>かけようと<ruby>思<rt>おも<\/rt><\/ruby>い，<ruby>介護<rt>かいご<\/rt><\/ruby><ruby>保険制度<rt>ほけんせいど<\/rt><\/ruby>のサービス<ruby>利用<rt>りよう<\/rt><\/ruby>について<ruby>市役所<rt>しやくしょ<\/rt><\/ruby>に<ruby>問<rt>と<\/rt><\/ruby>い<ruby>合<rt>あ<\/rt><\/ruby>わせたところ「<ruby>本市<rt>ほんし<\/rt><\/ruby>では<ruby>趣味<rt>しゅみ<\/rt><\/ruby>のための<ruby>移動<rt>いどう<\/rt><\/ruby><ruby>支援<rt>しえん<\/rt><\/ruby>は<ruby>実施<rt>じっし<\/rt><\/ruby>していない」と<ruby>説明<rt>せつめい<\/rt><\/ruby>されたと<ruby>言<rt>い<\/rt><\/ruby>う。Ｌさんは<ruby>転倒<rt>てんとう<\/rt><\/ruby>の<ruby>心配<rt>しんぱい<\/rt><\/ruby>もあり，<ruby>歌舞伎<rt>かぶき<\/rt><\/ruby><ruby>鑑賞<rt>かんしょう<\/rt><\/ruby>には<ruby>見守<rt>みまも<\/rt><\/ruby>り<ruby>支援<rt>しえん<\/rt><\/ruby>を<ruby>利用<rt>りよう<\/rt><\/ruby>したいと<ruby>言<rt>い<\/rt><\/ruby>っている。","Ｌさんの居住地を担当する「生活支援コーディネーター（第2 層）」に連絡を取り，Ｌさんが利用できる，制度外の外出時の見守り支援策について相談・調整を図る。":"Ｌさんの<ruby>居住地<rt>きょじゅうち<\/rt><\/ruby>を<ruby>担当<rt>たんとう<\/rt><\/ruby>する「<ruby>生活<rt>せいかつ<\/rt><\/ruby><ruby>支援<rt>しえん<\/rt><\/ruby>コーディネーター（<ruby>第<rt>だい<\/rt><\/ruby>2 <ruby>層<rt>そう<\/rt><\/ruby>）」に<ruby>連絡<rt>れんらく<\/rt><\/ruby>を<ruby>取<rt>と<\/rt><\/ruby>り，Ｌさんが<ruby>利用<rt>りよう<\/rt><\/ruby>できる，<ruby>制度<rt>せいど<\/rt><\/ruby><ruby>外<rt>がい<\/rt><\/ruby>の<ruby>外出<rt>がいしゅつ<\/rt><\/ruby><ruby>時<rt>じ<\/rt><\/ruby>の<ruby>見守<rt>みまも<\/rt><\/ruby>り<ruby>支援策<rt>しえんさく<\/rt><\/ruby>について<ruby>相談<rt>そうだん<\/rt><\/ruby>・<ruby>調整<rt>ちょうせい<\/rt><\/ruby>を<ruby>図<rt>はか<\/rt><\/ruby>る。","Ｌさんの支援を在宅医療・介護連携推進事業の担当者に依頼する。":"Ｌさんの<ruby>支援<rt>しえん<\/rt><\/ruby>を<ruby>在宅<rt>ざいたく<\/rt><\/ruby><ruby>医療<rt>いりょう<\/rt><\/ruby>・<ruby>介護<rt>かいご<\/rt><\/ruby><ruby>連携<rt>れんけい<\/rt><\/ruby><ruby>推進<rt>すいしん<\/rt><\/ruby><ruby>事業<rt>じぎょう<\/rt><\/ruby>の<ruby>担当者<rt>たんとうしゃ<\/rt><\/ruby>に<ruby>依頼<rt>いらい<\/rt><\/ruby>する。","Ｌさんの歩行機能の改善を図るため，地域介護予防活動支援事業の利用を勧める。":"Ｌさんの<ruby>歩行<rt>ほこう<\/rt><\/ruby><ruby>機能<rt>きのう<\/rt><\/ruby>の<ruby>改善<rt>かいぜん<\/rt><\/ruby>を<ruby>図<rt>はか<\/rt><\/ruby>るため，<ruby>地域<rt>ちいき<\/rt><\/ruby><ruby>介護<rt>かいご<\/rt><\/ruby><ruby>予防<rt>よぼう<\/rt><\/ruby><ruby>活動<rt>かつどう<\/rt><\/ruby><ruby>支援<rt>しえん<\/rt><\/ruby><ruby>事業<rt>じぎょう<\/rt><\/ruby>の<ruby>利用<rt>りよう<\/rt><\/ruby>を<ruby>勧<rt>すす<\/rt><\/ruby>める。","Ｌさんの疑問や不安に対応してもらえるよう，介護サービス相談員と連携を図る。":"Ｌさんの<ruby>疑問<rt>ぎもん<\/rt><\/ruby>や<ruby>不安<rt>ふあん<\/r function syncRubyDisplay(){
 host.setAttribute('data-ruby',rubyEnabled?'on':'off');
 root.querySelectorAll('[data-ruby-mode]').forEach(button=>button.setAttribute('aria-pressed',String((button.dataset.rubyMode==='on')===rubyEnabled)));
}
root.querySelectorAll('[data-ruby-mode]').forEach(button=>button.onclick=()=>{
 rubyEnabled=button.dataset.rubyMode==='on';syncRubyDisplay();save();stats();
});
const rubyWordPattern=new RegExp(Object.keys(RUBY_WORDS).sort((a,b)=>b.length-a.length).join('|'),'g');
function annotateText(text){
 return RUBY_TEXT[text]||esc(text).replace(rubyWordPattern,w=>`<ruby>${w}<rt>${RUBY_WORDS[w]}<\/rt><\/ruby>`);
}
function applyRuby(){
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),nodes=[];
 while(walker.nextNode()){
  const node=walker.currentNode;
  if(/[㐀-鿿々〆]/.test(node.data)&&!node.parentElement.closest('style,script,ruby,textarea,input,select,option'))nodes.push(node);
 }
 for(const node of nodes){
  const annotated=annotateText(node.data);
  if(!annotated.includes('<ruby>'))continue;
  const template=document.createElement('template');template.innerHTML=annotated;node.replaceWith(template.content);
 }
}
const rubyObserver=new MutationObserver(()=>{
 rubyObserver.disconnect();applyRuby();rubyObserver.observe(root,{childList:true,subtree:true,characterData:true});
});
syncRubyDisplay();rebuild();applyRuby();rubyObserver.observe(root,{childList:true,subtree:true,characterData:true});

})();
