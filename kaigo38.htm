、身体の病気がないのに、自分は病気だと確信することです。":"<ruby>心気妄想<rt>しんきもうそう<\/rt><\/ruby>は、<ruby>身体<rt>しんたい<\/rt><\/ruby>の<ruby>病気<rt>びょうき<\/rt><\/ruby>がないのに、<ruby>自分<rt>じぶん<\/rt><\/ruby>は<ruby>病気<rt>びょうき<\/rt><\/ruby>だと<ruby>確信<rt>かくしん<\/rt><\/ruby>することです。","次の記述のうち，認知症（dementia）の人への取り組みとその説明として，最も適切なものを1 つ選びなさい。":"<ruby>次<rt>つぎ<\/rt><\/ruby>の<ruby>記述<rt>きじゅつ<\/rt><\/ruby>のうち，<ruby>認知症<rt>にんちしょう<\/rt><\/ruby>（dementia）の<ruby>人<rt>ひと<\/rt><\/ruby>への<ruby>取<rt>と<\/rt><\/ruby>り<ruby>組<rt>く<\/rt><\/ruby>みとその<ruby>説明<rt>せつめい<\/rt><\/ruby>として，<ruby>最<rt>もっと<\/rt><\/ruby>も<ruby>適切<rt>てきせつ<\/rt><\/ruby>なものを1 つ<ruby>選<rt>えら<\/rt><\/ruby>びなさい。","本人ミーティングでは，当事者たちが語り合い社会に発信も行う。":"<ruby>本人<rt>ほんにん<\/rt><\/ruby>ミーティングでは，<ruby>当事者<rt>とうじしゃ<\/rt><\/ruby>たちが<ruby>語<rt>かた<\/rt><\/ruby>り<ruby>合<rt>あ<\/rt><\/ruby>い<ruby>社会<rt>しゃかい<\/rt><\/ruby>に<ruby>発信<rt>はっしん<\/rt><\/ruby>も<ruby>行<rt>おこな<\/rt><\/ruby>う。","認知症初期集中支援チームは，要介護認定を行う。":"<ruby>認知症初期集中支援<rt>にんちしょうしょきしゅうちゅうしえん<\/rt><\/ruby>チームは，<ruby>要介護認定<rt>ようかいごにんてい<\/rt><\/ruby>を<ruby>行<rt>おこな<\/rt><\/ruby>う。","若年性認知症支援コーディネーターは，認知症（dementia）の診断を行う。":"<ruby>若年性認知症支援<rt>じゃくねんせいにんちしょうしえん<\/rt><\/ruby>コーディネーターは，<ruby>認知症<rt>にんちしょう<\/rt><\/ruby>（dementia）の<ruby>診断<rt>しんだん<\/rt><\/ruby>を<ruby>行<rt>おこな<\/rt><\/ruby>う。","認知症疾患医療センターは，地域ケア会議を開催する。":"<ruby>認知症疾患医療<rt>にんちしょうしっかんいりょう<\/rt><\/ruby>センターは，<ruby>地域<rt>ちいき<\/rt><\/ruby>ケア<ruby>会議<rt>かいぎ<\/rt><\/ruby>を<ruby>開催<rt>かいさい<\/rt><\/ruby>する。","認知症カフェは，認知症介護指導者を養成する。":"<ruby>認知症<rt>にんちしょう<\/rt><\/ruby>カフェは，<ruby>認知症介護指導者<rt>にんちしょうかいごしどうしゃ<\/rt><\/ruby>を<ruby>養成<rt>ようせい<\/rt><\/ruby>する。","本人ミーティングは、認知症の当事者が体験や希望を語り合う場です。社会への発信にもつながります。":"<ruby>本人<rt>ほんにん<\/rt><\/ruby>ミーティングは、<ruby>認知症<rt>にんちしょう<\/rt><\/ruby>の<ruby>当事者<rt>とうじしゃ<\/rt><\/ruby>が<ruby>体験<rt>たいけん<\/rt><\/ruby>や<ruby>希望<rt>きぼう<\/rt><\/ruby>を<ruby>語り<rt>かたり<\/rt><\/ruby><ruby>合う<rt>あう<\/rt><\/ruby><ruby>場<rt>ば<\/rt><\/ruby>です。<ruby>社会<rt>しゃかい<\/rt><\/ruby>への<ruby>発信<rt>はっしん<\/rt><\/ruby>にもつながります。","次の記述のうち，認知症（dementia）の行動・心理症状（ＢＰＳＤ）に該当するものとして，最も適切なものを1 つ選びなさい。":"<ruby>次<rt>つぎ<\/rt><\/ruby>の<ruby>記述<rt>きじゅつ<\/rt><\/ruby>のうち，<ruby>認知症<rt>にんちしょう<\/rt><\/ruby>（dementia）の<ruby>行動<rt>こうどう<\/rt><\/ruby>・<ruby>心理症状<rt>しんりしょうじょう<\/rt><\/ruby>（ＢＰＳＤ）に<ruby>該当<rt>がいとう<\/rt><\/ruby>するものとして，<ruby>最<rt>もっと<\/rt><\/ruby>も<ruby>適切<rt>てきせつ<\/rt><\/ruby>なものを1 つ<ruby>選<rt>えら<\/rt><\/ruby>びなさい。","10 分前に施設職員が挨拶しに来たことを，覚えていない。":"10 <ruby>分前<rt>ぷんまえ<\/rt><\/ruby>に<ruby>施設職員<rt>しせつしょくいん<\/rt><\/ruby>が<ruby>挨拶<rt>あいさつ<\/rt><\/ruby>しに<ruby>来<rt>き<\/rt><\/ruby>たことを，<ruby>覚<rt>おぼ<\/rt><\/ruby>えていない。","病院にいるのに，自宅にいると思っている。":"<ruby>病院<rt>びょういん<\/rt><\/ruby>にいるのに，<ruby>自宅<rt>じたく<\/rt><\/ruby>にいると<ruby>思<rt>おも<\/rt><\/ruby>っている。","通所介護（デイサービス）を利用中に，出口を探して歩き回る。":"<ruby>通所介護<rt>つうしょかいご<\/rt><\/ruby>（デイサービス）を<ruby>利用中<rt>りようちゅう<\/rt><\/ruby>に，<ruby>出口<rt>でぐち<\/rt><\/ruby>を<ruby>探<rt>さが<\/rt><\/ruby>して<ruby>歩<rt>ある<\/rt><\/ruby>き<ruby>回<rt>まわ<\/rt><\/ruby>る。","薬を処方されても，服薬管理ができない。":"<ruby>薬<rt>くすり<\/rt><\/ruby>を<ruby>処方<rt>しょほう<\/rt><\/ruby>されても，<ruby>服薬管理<rt>ふくやくかんり<\/rt><\/ruby>ができない。","入浴を促すと，湯につかるだけで出てくる。":"<ruby>入浴<rt>にゅうよく<\/rt><\/ruby>を<ruby>促<rt>うなが<\/rt><\/ruby>すと，<ruby>湯<rt>ゆ<\/rt><\/ruby>につかるだけで<ruby>出<rt>で<\/rt><\/ruby>てくる。","出口を探して歩き回る行動は、行動・心理症状に当たります。不安や目的など、その背景を理解することも大切です。":"<ruby>出口<rt>でぐち<\/rt><\/ruby>を<ruby>探し<rt>さがし<\/rt><\/ruby>て<ruby>歩き<rt>あるき<\/rt><\/ruby><ruby>回る<rt>まわる<\/rt><\/ruby><ruby>行動<rt>こうどう<\/rt><\/ruby>は、<ruby>行動<rt>こうどう<\/rt><\/ruby>・<ruby>心理症状<rt>しんりしょうじょう<\/rt><\/ruby>に<ruby>当たり<rt>あたり<\/rt><\/ruby>ます。<ruby>不安<rt>ふあん<\/rt><\/ruby>や<ruby>目的<rt>もくてき<\/rt><\/ruby>など、その<ruby>背景<rt>はいけい<\/rt><\/ruby>を<ruby>理解<rt>りかい<\/rt><\/ruby>することも<ruby>大切<rt>たいせつ<\/rt><\/ruby>です。","次の記述のうち，アルツハイマー型認知症（dementia of the Alzheimer’s type）の説明として，最も適切なものを1 つ選びなさい。":"<ruby>次<rt>つぎ<\/rt><\/ruby>の<ruby>記述<rt>きじゅつ<\/rt><\/ruby>のうち，アルツハイマー<ruby>型認知症<rt>がたにんちしょう<\/rt><\/ruby>（dementia of the Alzheimer’s type）の<ruby>説明<rt>せつめい<\/rt><\/ruby>として，<ruby>最<rt>もっと<\/rt><\/ruby>も<ruby>適切<rt>てきせつ<\/rt><\/ruby>なものを1 つ<ruby>選<rt>えら<\/rt><\/ruby>びなさい。","古い記憶から障害され，徐々に新しい記憶も障害される。":"<ruby>古<rt>ふる<\/rt><\/ruby>い<ruby>記憶<rt>きおく<\/rt><\/ruby>から<ruby>障害<rt>しょうがい<\/rt><\/ruby>され，<ruby>徐々<rt>じょじょ<\/rt><\/ruby>に<ruby>新<rt>あたら<\/rt><\/ruby>しい<ruby>記憶<rt>きおく<\/rt><\/ruby>も<ruby>障害<rt>しょうがい<\/rt><\/ruby>される。","認知機能が変動することが特徴的である。":"<ruby>認知機能<rt>にんちきのう<\/rt><\/ruby>が<ruby>変動<rt>へんどう<\/rt><\/ruby>することが<ruby>特徴的<rt>とくちょうてき<\/rt><\/ruby>である。","ＡＤＬ（Activities of Daily Living：日常生活動作）の障害は，重度期以降に認められる。":"ＡＤＬ（Activities of Daily Living：<ruby>日常生活動作<rt>にちじょうせいかつどうさ<\/rt><\/ruby>）の<ruby>障害<rt>しょうがい<\/rt><\/ruby>は，<ruby>重度期以降<rt>じゅうどきいこう<\/rt><\/ruby>に<ruby>認<rt>みと<\/rt><\/ruby>められる。","見当識障害は，中期以降に認められる。":"<ruby>見当識障害<rt>けんとうしきしょうがい<\/rt><\/ruby>は，<ruby>中期以降<rt>ちゅうきいこう<\/rt><\/ruby>に<ruby>認<rt>みと<\/rt><\/ruby>められる。","記憶障害は，初期から認められる。":"<ruby>記憶障害<rt>きおくしょうがい<\/rt><\/ruby>は，<ruby>初期<rt>しょき<\/rt><\/ruby>から<ruby>認<rt>みと<\/rt><\/ruby>められる。","アルツハイマー型認知症では、初期から新しい出来事を覚えにくくなるなどの記憶障害がみられます。":"アルツハイマー<ruby>型認知症<rt>がたにんちしょう<\/rt><\/ruby>では、<ruby>初期<rt>しょき<\/rt><\/ruby>から<ruby>新しい<rt>あたらしい<\/rt><\/ruby><ruby>出来事<rt>できごと<\/rt><\/ruby>を<ruby>覚え<rt>おぼえ<\/rt><\/ruby>にくくなるなどの<ruby>記憶障害<rt>きおくしょうがい<\/rt><\/ruby>がみられます。","次のうち，レビー小体型認知症（dementia with Lewy bodies）の症状として，最も適切なものを1 つ選びなさい。":"<ruby>次<rt>つぎ<\/rt><\/ruby>のうち，レビー<ruby>小体型認知症<rt>しょうたいがたにんちしょう<\/rt><\/ruby>（dementia with Lewy bodies）の<ruby>症状<rt>しょうじょう<\/rt><\/ruby>として，<ruby>最<rt>もっと<\/rt><\/ruby>も<ruby>適切<rt>てきせつ<\/rt><\/ruby>なものを1 つ<ruby>選<rt>えら<\/rt><\/ruby>びなさい。","ノンレム睡眠行動障害による大声":"ノンレム<ruby>睡眠行動障害<rt>すいみんこうどうしょうがい<\/rt><\/ruby>による<ruby>大声<rt>おおごえ<\/rt><\/ruby>","自律神経症状による起立性低血圧（orthostatic hypotension）":"<ruby>自律神経症状<rt>じりつしんけいしょうじょう<\/rt><\/ruby>による<ruby>起立性低血圧<rt>きりつせいていけつあつ<\/rt><\/ruby>（orthostatic hypotension）","聴覚認知機能の障害による幻聴":"<ruby>聴覚認知機能<rt>ちょうかくにんちきのう<\/rt><\/ruby>の<ruby>障害<rt>しょうがい<\/rt><\/ruby>による<ruby>幻聴<rt>げんちょう<\/rt><\/ruby>","側頭葉の萎縮による意味性失語":"<ruby>側頭葉<rt>そくとうよう<\/rt><\/ruby>の<ruby>萎縮<rt>いしゅく<\/rt><\/ruby>による<ruby>意味性失語<rt>いみせいしつご<\/rt><\/ruby>","嚥下機能の促進による食欲増加":"<ruby>嚥下機能<rt>えんげ
