t>ど<\/rt><\/ruby>","短期目標の達成度":"<ruby>短期目標<rt>たんきもくひょう<\/rt><\/ruby>の<ruby>達成度<rt>たっせいど<\/rt><\/ruby>","評価では、設定した短期目標がどの程度達成できたかを優先して確認します。":"<ruby>評価<rt>ひょうか<\/rt><\/ruby>では、<ruby>設定<rt>せってい<\/rt><\/ruby>した<ruby>短期目標<rt>たんきもくひょう<\/rt><\/ruby>がどの<ruby>程度<rt>ていど<\/rt><\/ruby><ruby>達成<rt>たっせい<\/rt><\/ruby>できたかを<ruby>優先<rt>ゆうせん<\/rt><\/ruby>して<ruby>確認<rt>かくにん<\/rt><\/ruby>します。","次の記述のうち，居宅サービス計画と訪問介護計画の関係として，最も適切なものを1つ選びなさい。":"<ruby>次の<rt>つぎの<\/rt><\/ruby><ruby>記述<rt>きじゅつ<\/rt><\/ruby>のうち，<ruby>居宅<rt>きょたく<\/rt><\/ruby>サービス<ruby>計画<rt>けいかく<\/rt><\/ruby>と<ruby>訪問介護計画<rt>ほうもんかいごけいかく<\/rt><\/ruby>の<ruby>関係<rt>かんけい<\/rt><\/ruby>として，<ruby>最も<rt>もっとも<\/rt><\/ruby><ruby>適切<rt>てきせつ<\/rt><\/ruby>なものを1つ<ruby>選び<rt>えらび<\/rt><\/ruby>なさい。","訪問介護計画を根拠に，居宅サービス計画を作成する。":"<ruby>訪問介護計画<rt>ほうもんかいごけいかく<\/rt><\/ruby>を<ruby>根拠<rt>こんきょ<\/rt><\/ruby>に，<ruby>居宅<rt>きょたく<\/rt><\/ruby>サービス<ruby>計画<rt>けいかく<\/rt><\/ruby>を<ruby>作成<rt>さくせい<\/rt><\/ruby>する。","居宅サービス計画の目標が変更されても，訪問介護計画は見直しをせず継続する。":"<ruby>居宅<rt>きょたく<\/rt><\/ruby>サービス<ruby>計画<rt>けいかく<\/rt><\/ruby>の<ruby>目標<rt>もくひょう<\/rt><\/ruby>が<ruby>変更<rt>へんこう<\/rt><\/ruby>されても，<ruby>訪問介護計画<rt>ほうもんかいごけいかく<\/rt><\/ruby>は<ruby>見直し<rt>みなおし<\/rt><\/ruby>をせず<ruby>継続<rt>けいぞく<\/rt><\/ruby>する。","居宅サービス計画と同じ内容を，訪問介護計画に転記する。":"<ruby>居宅<rt>きょたく<\/rt><\/ruby>サービス<ruby>計画<rt>けいかく<\/rt><\/ruby>と<ruby>同じ<rt>おなじ<\/rt><\/ruby><ruby>内容<rt>ないよう<\/rt><\/ruby>を，<ruby>訪問介護計画<rt>ほうもんかいごけいかく<\/rt><\/ruby>に<ruby>転記<rt>てんき<\/rt><\/ruby>する。","居宅サービス計画の方針に沿って，訪問介護計画を作成する。":"<ruby>居宅<rt>きょたく<\/rt><\/ruby>サービス<ruby>計画<rt>けいかく<\/rt><\/ruby>の<ruby>方針<rt>ほうしん<\/rt><\/ruby>に<ruby>沿って<rt>そって<\/rt><\/ruby>，<ruby>訪問介護計画<rt>ほうもんかいごけいかく<\/rt><\/ruby>を<ruby>作成<rt>さくせい<\/rt><\/ruby>する。","訪問介護計画の終了後に，居宅サービス計画を作成する。":"<ruby>訪問介護計画<rt>ほうもんかいごけいかく<\/rt><\/ruby>の<ruby>終了<rt>しゅうりょう<\/rt><\/ruby><ruby>後に<rt>ごに<\/rt><\/ruby>，<ruby>居宅<rt>きょたく<\/rt><\/ruby>サービス<ruby>計画<rt>けいかく<\/rt><\/ruby>を<ruby>作成<rt>さくせい<\/rt><\/ruby>する。","訪問介護計画は、居宅サービス計画の方針に沿って、具体的な支援内容を定めます。":"<ruby>訪問介護計画<rt>ほうもんかいごけいかく<\/rt><\/ruby>は、<ruby>居宅<rt>きょたく<\/rt><\/ruby>サービス<ruby>計画<rt>けいかく<\/rt><\/ruby>の<ruby>方針<rt>ほうしん<\/rt><\/ruby>に<ruby>沿って<rt>そって<\/rt><\/ruby>、<ruby>具体的<rt>ぐたいてき<\/rt><\/ruby>な<ruby>支援<rt>しえん<\/rt><\/ruby><ruby>内容<rt>ないよう<\/rt><\/ruby>を<ruby>定め<rt>さだめ<\/rt><\/ruby>ます。","Lさんが急に立ち止まった行動の解釈として，最も適切なものを1つ選びなさい。":"Lさんが<ruby>急に<rt>きゅうに<\/rt><\/ruby><ruby>立ち<rt>たち<\/rt><\/ruby><ruby>止ま<rt>とま<\/rt><\/ruby>った<ruby>行動<rt>こうどう<\/rt><\/ruby>の<ruby>解釈<rt>かいしゃく<\/rt><\/ruby>として，<ruby>最も<rt>もっとも<\/rt><\/ruby><ruby>適切<rt>てきせつ<\/rt><\/ruby>なものを1つ<ruby>選び<rt>えらび<\/rt><\/ruby>なさい。","Lさん（76歳，女性，要介護1）は，自宅で娘と暮らしている。軽度の認知症（dementia）と診断されたが，身体機能に問題はなく，友人との外出を楽しんでいる。ある日，外食の後，自宅近くで保護されたとき，「ここはどこなの」と言った。その後，自宅から出ようとしなくなった。心配した娘が本人と相談して，小規模多機能型居宅介護を利用することになった。\n利用開始時に，Lさんの短期目標を，「外出を楽しめる」と設定した。2週間が過ぎた頃，Lさんから，近くのスーパーへの買い物ツアーに参加したいと申し出があった。当日，他の利用者や介護福祉職と笑顔で買い物をする様子が見られた。買い物が終わり，歩いて戻り始めると，笑顔が消え，急に立ち止まった。\n介護福祉職が声をかけると，「ここはどこなの。どこに行くの」と不安そうに言った。":"Lさん（76<ruby>歳<rt>さい<\/rt><\/ruby>，<ruby>女性<rt>じょせい<\/rt><\/ruby>，<ruby>要介護<rt>ようかいご<\/rt><\/ruby>1）は，<ruby>自宅<rt>じたく<\/rt><\/ruby>で<ruby>娘<rt>むすめ<\/rt><\/ruby>と<ruby>暮らし<rt>くらし<\/rt><\/ruby>ている。<ruby>軽度<rt>けいど<\/rt><\/ruby>の<ruby>認知症<rt>にんちしょう<\/rt><\/ruby>（dementia）と<ruby>診断<rt>しんだん<\/rt><\/ruby>されたが，<ruby>身体機能<rt>しんたいきのう<\/rt><\/ruby>に<ruby>問題<rt>もんだい<\/rt><\/ruby>はなく，<ruby>友人<rt>ゆうじん<\/rt><\/ruby>との<ruby>外出<rt>がいしゅつ<\/rt><\/ruby>を<ruby>楽し<rt>たのし<\/rt><\/ruby>んでいる。ある<ruby>日<rt>にち<\/rt><\/ruby>，<ruby>外食<rt>がいしょく<\/rt><\/ruby>の<ruby>後<rt>ご<\/rt><\/ruby>，<ruby>自宅<rt>じたく<\/rt><\/ruby><ruby>近く<rt>ちかく<\/rt><\/ruby>で<ruby>保護<rt>ほご<\/rt><\/ruby>されたとき，「ここはどこなの」と<ruby>言った<rt>いった<\/rt><\/ruby>。その<ruby>後<rt>ご<\/rt><\/ruby>，<ruby>自宅<rt>じたく<\/rt><\/ruby>から<ruby>出よ<rt>でよ<\/rt><\/ruby>うとしなくなった。<ruby>心配<rt>しんぱい<\/rt><\/ruby>した<ruby>娘<rt>むすめ<\/rt><\/ruby>が<ruby>本人<rt>ほんにん<\/rt><\/ruby>と<ruby>相談<rt>そうだん<\/rt><\/ruby>して，<ruby>小規模<rt>しょうきぼ<\/rt><\/ruby><ruby>多<rt>た<\/rt><\/ruby><ruby>機能<rt>きのう<\/rt><\/ruby><ruby>型<rt>がた<\/rt><\/ruby><ruby>居宅介護<rt>きょたくかいご<\/rt><\/ruby>を<ruby>利用<rt>りよう<\/rt><\/ruby>することになった。\n<ruby>利用<rt>りよう<\/rt><\/ruby><ruby>開始<rt>かいし<\/rt><\/ruby><ruby>時に<rt>ときに<\/rt><\/ruby>，Lさんの<ruby>短期目標<rt>たんきもくひょう<\/rt><\/ruby>を，「<ruby>外出<rt>がいしゅつ<\/rt><\/ruby>を<ruby>楽し<rt>たのし<\/rt><\/ruby>める」と<ruby>設定<rt>せってい<\/rt><\/ruby>した。2<ruby>週間<rt>しゅうかん<\/rt><\/ruby>が<ruby>過ぎ<rt>すぎ<\/rt><\/ruby>た<ruby>頃<rt>ごろ<\/rt><\/ruby>，Lさんから，<ruby>近く<rt>ちかく<\/rt><\/ruby>のスーパーへの<ruby>買い物<rt>かいもの<\/rt><\/ruby>ツアーに<ruby>参加<rt>さんか<\/rt><\/ruby>したいと<ruby>申し出<rt>もうしで<\/rt><\/ruby>があった。<ruby>当日<rt>とうじつ<\/rt><\/ruby>，<ruby>他の<rt>ほかの<\/rt><\/ruby><ruby>利用者<rt>りようしゃ<\/rt><\/ruby>や<ruby>介護福祉職<rt>かいごふくししょく<\/rt><\/ruby>と<ruby>笑顔<rt>えがお<\/rt><\/ruby>で<ruby>買い物<rt>かいもの<\/rt><\/ruby>をする<ruby>様子<rt>ようす<\/rt><\/ruby>が<ruby>見ら<rt>みら<\/rt><\/ruby>れた。<ruby>買い物<rt>かいもの<\/rt><\/ruby>が<ruby>終わり<rt>おわり<\/rt><\/ruby>，<ruby>歩い<rt>あるい<\/rt><\/ruby>て<ruby>戻り<rt>もどり<\/rt><\/ruby><ruby>始め<rt>はじめ<\/rt><\/ruby>ると，<ruby>笑顔<rt>えがお<\/rt><\/ruby>が<ruby>消え<rt>きえ<\/rt><\/ruby>，<ruby>急に<rt>きゅうに<\/rt><\/ruby><ruby>立ち<rt>たち<\/rt><\/ruby><ruby>止ま<rt>とま<\/rt><\/ruby>った。\n<ruby>介護福祉職<rt>かいごふくししょく<\/rt><\/ruby>が<ruby>声<rt>こえ<\/rt><\/ruby>をかけると，「ここはどこなの。どこに<ruby>行く<rt>いく<\/rt><\/ruby>の」と<ruby>不安<rt>ふあん<\/rt><\/ruby>そうに<ruby>言った<rt>いった<\/rt><\/ruby>。","買い物ツアー時間の延長の要求":"<ruby>買い物<rt>かいもの<\/rt><\/ruby>ツアー<ruby>時間<rt>じかん<\/rt><\/ruby>の<ruby>延長<rt>えんちょう<\/rt><\/ruby>の<ruby>要求<rt>ようきゅう<\/rt><\/ruby>","自分のいる場所がわからない不安":"<ruby>自分<rt>じぶん<\/rt><\/ruby>のいる<ruby>場所<rt>ばしょ<\/rt><\/ruby>がわからない<ruby>不安<rt>ふあん<\/rt><\/ruby>","休憩したいという訴え":"<ruby>休憩<rt>きゅうけい<\/rt><\/ruby>したいという<ruby>訴え<rt>うったえ<\/rt><\/ruby>","店での介護福祉職の支援に対する不満":"<ruby>店<rt>みせ<\/rt><\/ruby>での<ruby>介護福祉職<rt>かいごふくししょく<\/rt><\/ruby>の<ruby>支援<rt>しえん<\/rt><\/ruby>に<ruby>対<rt>たい<\/rt><\/ruby>する<ruby>不満<rt>ふまん<\/rt><\/ruby>","一人で帰りたいという訴え":"<ruby>一人<rt>ひとり<\/rt><\/ruby>で<ruby>帰り<rt>かえり<\/rt><\/ruby>たいという<ruby>訴え<rt>うったえ<\/rt><\/ruby>","「ここはどこ」という発言から、自分のいる場所がわからず、不安になったと考えられます。":"「ここはどこ」という<ruby>発言<rt>はつげん<\/rt><\/ruby>から、<ruby>自分<rt>じぶん<\/rt><\/ruby>のいる<ruby>場所<rt>ばしょ<\/rt><\/ruby>がわからず、<ruby>不安<rt>ふあん<\/rt><\/ruby>になったと<ruby>考え<rt>かんがえ<\/rt><\/ruby>られます。","Lさんの状況から，短期目標と支援内容を見直すためのカンファレンス（conference）が開かれた。担当する介護福祉職の提案として，最も優先すべきものを1つ選びなさい。":"Lさんの<ruby>状況<rt>じょうきょう<\/rt><\/ruby>から，<ruby>短期目標<rt>たんきもくひょう<\/rt><\/ruby>と<ruby>支援<rt>しえん<\/rt><\/ruby><ruby>内容<rt>ないよう<\/rt><\/ruby>を<ruby>見直す<rt>みなおす<\/rt><\/ruby>ためのカンファレンス（conference）が<ruby>開か<rt>ひらか<\/rt><\/ruby>れた。<ruby>担当<rt>たんとう<\/rt><\/ruby>する<ruby>介護福祉職<rt>かいごふくししょく<\/rt><\/ruby>の<ruby>提案<rt>ていあん<\/rt><\/ruby>として，<ruby>最も<rt>もっとも<\/rt><\/ruby><ruby>優先<rt>ゆうせん<\/rt><\/ruby>すべきものを1つ<ruby>選び<rt>えらび<\/rt><\/ruby>なさい。","外出先から帰れなくなる不安への対応が必要である。":"<ruby>外出<rt>がいしゅつ<\/rt><\/ruby><ruby>先<rt>さき<\/rt><\/ruby>から<ruby>帰れ<rt>かえれ<\/rt><\/ruby>なくなる<ruby>不安<rt>ふあん<\/rt><\/ruby>への<ruby>対応<rt>たいおう<\/rt><\/ruby>が<ruby>必要<rt>ひつよう<\/rt><\/ruby>である。","表情がかたくなったときは帰り道を変更する。":"<ruby>表情<rt>ひょうじょう<\/rt><\/ruby>がかたくなったときは<ruby>帰り道<rt>かえりみち<\/rt><\/ruby>を<ruby>変更<rt>へんこう<\/rt><\/ruby>する。","外出する意欲を持つ必要がある。":"<ruby>外出<rt>がいしゅつ<\/rt><\/ruby>する<ruby>意欲<rt>いよく<\/rt><\/ruby>を<ruby>持つ<rt>もつ<\/rt><\/ruby><ruby>必要<rt>ひつよう<\/rt><\/ruby>がある。","歩くために身体機能の改善が必要である。":"<ruby>歩く<rt>あるく<\/rt><\/ruby>ために<ruby>身体機能<rt>しんたいきのう<\/rt><\/ruby>の<ruby>改善<rt>かいぜん<\/rt><\/ruby>が<ruby>必要<rt>ひつよう<\/rt><\/ruby>である。","事業所をなじみの生活空間にする。":"<ruby>事業所<rt>じぎょうしょ<\/rt><\/ruby>をなじみの<ruby>生活<rt>せいかつ<\/rt><\/ruby><ruby>空間<rt>くうかん<\/rt><\/ruby>にする。","外出を楽しむために、帰れなくなる不安への対応を優先して検討します。":"<ruby>外出<rt>がいしゅつ<\/rt><\/ruby>を<ruby>楽し<rt>たのし<\/rt><\/ruby>むために、<ruby>帰れ<rt>かえれ<\/rt><\/ruby>なくなる<ruby>不安<rt>ふあん<\/rt><\/ruby>への<ruby>対応<rt>たいおう<\/rt><\/ruby>を<ruby>優先<rt>ゆうせん<\/rt><\/ruby>して<ruby>検討<rt>けんとう<\/rt><\/ruby>します。","次のうち，Mさんの発言から，個別支援計画を立案するために，介護福祉職が把握すべき情報として，最も優先すべきものを1つ選びなさい。":"<ruby>次の<rt>つぎの<\/rt><\/ruby>うち，Mさんの<ruby>発言<rt>はつげん<\/rt><\/ruby>から，<ruby>個別支援計画<rt>こべつしえんけいかく<\/rt><\/ruby>を<ruby>立案<rt>りつあん<\/rt><\/ruby>するために，<ruby>介護福祉職<rt>かいごふくししょく<\/rt><\/ruby>が<ruby>把握<rt>はあく<\/rt><\/ruby>すべき<ruby>情報<rt>じょうほう<\/rt><\/ruby>として，<ruby>最も<rt>もっとも<\/rt><\/ruby><ruby>優先<rt>ゆうせん<\/rt><\/ruby>すべきものを1つ<ruby>選び<rt>えらび<\/rt><\/ruby>なさい。","Mさん（35歳，男性，障害支援区分5）は，脳性麻痺（cerebral palsy）による四肢麻痺で筋緊張がある。日常生活動作は全般に介護が必要であり，電動車いすを使用している。これまで，本人と母親（70歳）の希望で，自宅で二人暮らしを続けてきた。Mさんは3年前から，重度訪問介護を利用している。軽度の知的障害があるが，自分の意思を介護者と母親に伝えることができる。相談支援専門員が作成したサービス等利用計画の総合目標は，「やりたいことに挑戦し，生活を充実させる」となっている。Mさん自身も，やりたいことを見つけたいと介護福祉職に話していたことから，次の個別支援会議で検討する予定になっていた。\nある日，重度訪問介護の利用時，パラリンピックのテレビ中継を見ていたMさんが，介護福祉職に，「ボール投げるの，おもしろそう」と話した。":"Mさん（35<ruby>歳<rt>さい<\/rt><\/ruby>，<ruby>男性<rt>だんせい<\/rt><\/ruby>，<ruby>障害支援区分<rt>しょうがいしえんくぶん<\/rt><\/ruby>5）は，<ruby>脳性麻痺<rt>のうせいまひ<\/rt><\/ruby>（cerebral palsy）による<ruby>四肢<rt>しし<\/rt><\/ruby><ruby>麻痺<rt>まひ<\/rt><\/ruby>で<ruby>筋<rt>きん<\/rt><\/ruby><ruby>緊張<rt>きんちょう<\/rt><\/ruby>がある。<ruby>日常生活動作<rt>にちじょうせいかつどうさ<\/rt><\/ruby>は<ruby>全般<rt>ぜんぱん<\/rt><\/ruby>に<ruby>介護<rt>かいご<\/rt><\/ruby>が<ruby>必要<rt>ひつよう<\/rt><\/ruby>であり，<ruby>電動車<rt>でんどうくるま<\/rt><\/ruby>いすを<ruby>使用<rt>しよう<\/rt><\/ruby>している。これまで，<ruby>本人<rt>ほんにん<\/rt><\/ruby>と<ruby>母親<rt>ははおや<\/rt><\/ruby>（70<ruby>歳<rt>さい<\/rt><\/ruby>）の<ruby>希望<rt>きぼう<\/rt><\/ruby>で，<ruby>自宅<rt>じたく<\/rt><\/ruby>で<ruby>二人暮<rt>ふたりぐ<\/rt><\/ruby>らしを<ruby>続け<rt>つづけ<\/rt><\/ruby>てきた。Mさんは3<ruby>年前<rt>ねんまえ<\/rt><\/ruby>から，<ruby>重度<rt>じゅうど<\/rt><\/ruby><ruby>訪問介護<rt>ほうもんかいご<\/rt><\/ruby>を<ruby>利用<rt>りよう<\/rt><\/ruby>している。<ruby>軽度<rt>けいど<\/rt><\/ruby>の<ruby>知的障害<rt>ちてきしょうがい<\/rt><\/ruby>があるが，<ruby>自分<rt>じぶん<\/rt><\/ruby>の<ruby>意思<rt>いし<\/rt><\/ruby>を<ruby>介護<rt>かいご<\/rt><\/ruby><ruby>者<rt>しゃ<\/rt><\/ruby>と<ruby>母親<rt>ははおや<\/rt><\/ruby>に<ruby>伝え<rt>つたえ<\/rt><\/ruby>ることができる。<ruby>相談<rt>そうだん<\/rt><\/ruby><ruby>支援<rt>しえん<\/rt><\/ruby><ruby>専門<rt>せんもん<\/rt><\/ruby><ruby>員<rt>いん<\/rt><\/ruby>が<ruby>作成<rt>さくせい<\/rt><\/ruby>したサービス<ruby>等<rt>など<\/rt><\/ruby><ruby>利用<rt>りよう<\/rt><\/ruby><ruby>計画<rt>けいかく<\/rt><\/ruby>の<ruby>総合<rt>そうごう<\/rt><\/ruby><ruby>目標<rt>もくひょう<\/rt><\/ruby>は，「やりたいことに<ruby>挑戦<rt>ちょうせん<\/rt><\/ruby>し，<ruby>生活<rt>せいかつ<\/rt><\/ruby>を<ruby>充実<rt>じゅうじつ<\/rt><\/ruby>させる」となっている。Mさん<ruby>自身<rt>じしん<\/rt><\/ruby>も，やりたいことを<ruby>見つ<rt>みつ<\/rt><\/ruby>けたいと<ruby>介護福祉職<rt>かいごふくししょく<\/rt><\/ruby>に<ruby>話し<rt>はなし<\/rt><\/ruby>ていたことから，<ruby>次の<rt>つぎの<\/rt><\/ruby><ruby>個別支援会議<rt>こべつしえんかいぎ<\/rt><\/ruby>で<ruby>検討<rt>けんとう<\/rt><\/ruby>する<ruby>予定<rt>よてい<\/rt><\/ruby>になっていた。\nある<ruby>日<rt>にち<\/rt><\/ruby>，<ruby>重度<rt>じゅうど<\/rt><\/ruby><ruby>訪問介護<rt>ほうもんかいご<\/rt><\/ruby>の<ruby>利用時<rt>りようじ<\/rt><\/ruby>，パラリンピックのテレビ<ruby>中継<rt>ちゅうけい<\/rt><\/ruby>を<ruby>見て<rt>みて<\/rt><\/ruby>いたMさんが，<ruby>介護福祉職<rt>かいごふくししょく<\/rt><\/ruby>に，「ボール<ruby>投げ<rt>なげ<\/rt><\/ruby>るの，おもしろそう」と<ruby>話し<rt>はなし<\/rt><\/ruby>た。","競技で使われるボールの種類":"<ruby>競技<rt>きょうぎ<\/rt><\/ruby>で<ruby>使わ<rt>つかわ<\/rt><\/ruby>れるボールの<ruby>種類<rt>しゅるい<\/rt><\/ruby>","話を聞いた介護福祉職の感想":"<ruby>話<rt>はなし<\/rt><\/ruby>を<ruby>聞い<rt>きい<\/rt><\/ruby>た<ruby>介護福祉職<rt>かいごふくししょく<\/rt><\/ruby>の<ruby>感想<rt>かんそう<\/rt><\/ruby>","競技に対するMさんの意向":"<ruby>競技<rt>きょうぎ<\/rt><\/ruby>に<ruby>対<rt>たい<\/rt><\/ruby>するMさんの<ruby>意向<rt>いこう<\/rt><\/ruby>","母親のパラリンピックへの関心":"<ruby>母親<rt>ははおや<\/rt><\/ruby>のパラリンピックへの<ruby>関心<rt>かんしん<\/rt><\/ruby>","テレビ中継を見ていた時間":"テレビ<ruby>中継<rt>ちゅうけい<\/rt><\/ruby>を<ruby>見て<rt>みて<\/rt><\/ruby>いた<ruby>時間<rt>じかん<\/rt><\/ruby>","個別支援計画は、競技をやってみたいという本人の意向を具体的に確認して立てます。":"<ruby>個別支援計画<rt>こべつしえんけいかく<\/rt><\/ruby>は、<ruby>競技<rt>きょうぎ<\/rt><\/ruby>をやってみたいという<ruby>本人<rt>ほんにん<\/rt><\/ruby>の<ruby>意向<rt>いこう<\/rt><\/ruby>を<ruby>具体的<rt>ぐたいてき<\/rt><\/ruby>に<ruby>確認<rt>かくにん<\/rt><\/ruby>して<ruby>立て<rt>たて<\/rt><\/ruby>ます。","いくつかのスポーツクラブを見学後，介護福祉職はMさんから，「このスポーツクラブが近いから，入会前に体験したい」と伝えられた。Mさんへの介護福祉職の対応に関する次の記述のうち，最も適切なものを1つ選びなさい。":"いくつかのスポーツクラブを<ruby>見学<rt>けんがく<\/rt><\/ruby><ruby>後<rt>ご<\/rt><\/ruby>，<ruby>介護福祉職<rt>かいごふくししょく<\/rt><\/ruby>はMさんから，「このスポーツクラブが<ruby>近い<rt>ちかい<\/rt><\/ruby>から，<ruby>入会<rt>にゅうかい<\/rt><\/ruby><ruby>前<rt>まえ<\/rt><\/ruby>に<ruby>体験<rt>たいけん<\/rt><\/ruby>したい」と<ruby>伝え<rt>つたえ<\/rt><\/ruby>られた。Mさんへの<ruby>介護福祉職<rt>かいごふくししょく<\/rt><\/ruby>の<ruby>対応<rt>たいおう<\/rt><\/ruby>に<ruby>関す<rt>かんす<\/rt><\/ruby>る<ruby>次の<rt>つぎの<\/rt><\/ruby><ruby>記述<rt>きじゅつ<\/rt><\/ruby>のうち，<ruby>最も<rt>もっとも<\/rt><\/ruby><ruby>適切<rt>てきせつ<\/rt><\/ruby>なものを1つ<ruby>選び<rt>えらび<\/rt><\/ruby>なさい。","筋緊張から回復する訓練を行うように伝える。":"<ruby>筋<rt>きん<\/rt><\/ruby><ruby>緊張<rt>きんちょう<\/rt><\/ruby>から<ruby>回復<rt>かいふく<\/rt><\/ruby>する<ruby>訓練<rt>くんれん<\/rt><\/ruby>を<ruby>行う<rt>おこなう<\/rt><\/ruby>ように<ruby>伝え<rt>つたえ<\/rt><\/ruby>る。","母親が決めたスポーツクラブを選ぶように勧める。":"<ruby>母親<rt>ははおや<\/rt><\/ruby>が<ruby>決め<rt>きめ<\/rt><\/ruby>たスポーツクラブを<ruby>選ぶ<rt>えらぶ<\/rt><\/ruby>ように<ruby>勧め<rt>すすめ<\/rt><\/ruby>る。","スポーツクラブにすぐに入会するように勧める。":"スポーツクラブにすぐに<ruby>入会<rt>にゅうかい<\/rt><\/ruby>するように<ruby>勧め<rt>すすめ<\/rt><\/ruby>る。","意思決定に必要な情報を提供する。":"<ruby>意思決定<rt>いしけってい<\/rt><\/ruby>に<ruby>必要<rt>ひつよう<\/rt><\/ruby>な<ruby>情報<rt>じょうほう<\/rt><\/ruby>を<ruby>提供<rt>ていきょう<\/rt><\/ruby>する。","相談支援専門員の許可を得るように勧める。":"<ruby>相談<rt>そうだん<\/rt><\/ruby><ruby>支援<rt>しえん<\/rt><\/ruby><ruby>専門<rt>せんもん<\/rt><\/ruby><ruby>員<rt>いん<\/rt><\/ruby>の<ruby>許可<rt>きょか<\/rt><\/ruby>を<ruby>得る<rt>える<\/rt><\/ruby>ように<ruby>勧め<rt>すすめ<\/rt><\/ruby>る。","体験の方法など必要な情報を伝え、本人が納得して選べるようにします。":"<ruby>体験<rt>たいけん<\/rt><\/ruby>の<ruby>方法<rt>ほうほう<\/rt><\/ruby>など<ruby>必要<rt>ひつよう<\/rt><\/ruby>な<ruby>情報<rt>じょうほう<\/rt><\/ruby>を<ruby>伝え<rt>つたえ<\/rt><\/ruby>、<ruby>本人<rt>ほんにん<\/rt><\/ruby>が<ruby>納得<rt>なっとく<\/rt><\/ruby>して<ruby>選べ<rt>えらべ<\/rt><\/ruby>るようにします。","介護福祉職が事例研究を行う目的として，最も適切なものを1つ選びなさい。":"<ruby>介護福祉職<rt>かいごふくししょく<\/rt><\/ruby>が<ruby>事例<rt>じれい<\/rt><\/ruby><ruby>研究<rt>けんきゅう<\/rt><\/ruby>を<ruby>行う<rt>おこなう<\/rt><\/ruby><ruby>目的<rt>もくてき<\/rt><\/ruby>として，<ruby>最も<rt>もっとも<\/rt><\/ruby><ruby>適切<rt>てきせつ<\/rt><\/ruby>なものを1つ<ruby>選び<rt>えらび<\/rt><\/ruby>なさい。","事業所の介護の理念の確認":"<ruby>事業所<rt>じぎょうしょ<\/rt><\/ruby>の<ruby>介護<rt>かいご<\/rt><\/ruby>の<ruby>理念<rt>りねん<\/rt><\/ruby>の<ruby>確認<rt>かくにん<\/rt><\/ruby>","介護福祉職の能力を調べること":"<ruby>介護福祉職<rt>かいごふくししょく<\/rt><\/ruby>の<ruby>能力<rt>のうりょく<\/rt><\/ruby>を<ruby>調べ<rt>しらべ<\/rt><\/ruby>ること","介護過程から介護実践を振り返ること":"<ruby>介護過程<rt>かいごかてい<\/rt><\/ruby>から<ruby>介護<rt>かいご<\/rt><\/ruby><ruby>実践<rt>じっせん<\/rt><\/ruby>を<ruby>振り返る<rt>ふりかえる<\/rt><\/ruby>こと","介護報酬の獲得":"<ruby>介護<rt>かいご<\/rt><\/ruby><ruby>報酬<rt>ほうしゅう<\/rt><\/ruby>の<ruby>獲得<rt>かくとく<\/rt><\/ruby>","介護福祉職自身の満足度の充足":"<ruby>介護福祉職<rt>かいごふくししょく<\/rt><\/ruby><ruby>自身<rt>じしん<\/rt><\/ruby>の<ruby>満足<rt>まんぞく<\/rt><\/ruby><ruby>度<rt>ど<\/rt><\/ruby>の<ruby>充足<rt>じゅうそく<\/rt><\/ruby>","事例研究は、介護過程と実践を振り返り、支援の意味や改善点を明らかにするために行います。":"<ruby>事例<rt>じれい<\/rt><\/ruby><ruby>研究<rt>けんきゅう<\/rt><\/ruby>は、<ruby>介護過程<rt>かいごかてい<\/rt><\/ruby>と<ruby>実践<rt>じっせん<\/rt><\/ruby>を<ruby>振り返り<rt>ふりかえり<\/rt><\/ruby>、<ruby>支援<rt>しえん<\/rt><\/ruby>の<ruby>意味<rt>いみ<\/rt><\/ruby>や<ruby>改善<rt>かいぜん<\/rt><\/ruby><ruby>点<rt>てん<\/rt><\/ruby>を<ruby>明らか<rt>あきらか<\/rt><\/ruby>にするために<ruby>行い<rt>おこない<\/rt><\/ruby>ます。","図は脳を模式的に示したものである。\nAさんの脳に萎縮が顕著にみられる部位として，最も適切なものを1つ選びなさい。":"<ruby>図<rt>ず<\/rt><\/ruby>は<ruby>脳<rt>のう<\/rt><\/ruby>を<ruby>模式的<rt>もしきてき<\/rt><\/ruby>に<ruby>示し<rt>しめし<\/rt><\/ruby>たものである。\nAさんの<ruby>脳<rt>のう<\/rt><\/ruby>に<ruby>萎縮<rt>いしゅく<\/rt><\/ruby>が<ruby>顕著<rt>けんちょ<\/rt><\/ruby>にみられる<ruby>部位<rt>ぶい<\/rt><\/ruby>として，<ruby>最も<rt>もっとも<\/rt><\/ruby><ruby>適切<rt>てきせつ<\/rt><\/ruby>なものを1つ<ruby>選び<rt>えらび<\/rt><\/ruby>なさい。","Aさん（80歳，女性）は，自宅で一人暮らしをしている。同じ県内に住む娘が，月に一度Aさんの自宅を訪れている。\n最近，Aさんの物忘れが多くなってきたため，不安になった娘が，Aさんと一緒に病院を受診したところ，医師から，脳の記憶をつかさどる部分が顕著に萎縮したアルツハイマー型認知症（dementia of the Alzheimer’s type）であると診断された。Aさんはこのまま自宅で暮らすことを希望し，介護保険の訪問介護（ホームヘルプサービス）を利用しながら一人暮らしを継続することになった。\nある日，娘からサービス提供責任者に，今年はAさんが一人で雪かきができるか不安であると相談があった。そこで，サービス提供責任者が，Aさんと一緒に地区の民生委員に相談したところ，近所の人たちが雪かきをしてくれることになった。":"Aさん（80<ruby>歳<rt>さい<\/rt><\/ruby>，<ruby>女性<rt>じょせい<\/rt><\/ruby>）は，<ruby>自宅<rt>じたく<\/rt><\/ruby>で<ruby>一人暮<rt>ひとりぐ<\/rt><\/ruby>らしをしている。<ruby>同じ<rt>おなじ<\/rt><\/ruby><ruby>県内<rt>けんない<\/rt><\/ruby>に<ruby>住む<rt>すむ<\/rt><\/ruby><ruby>娘<rt>むすめ<\/rt><\/ruby>が，<ruby>月に一度<rt>つきにいちど<\/rt><\/ruby>Aさんの<ruby>自宅<rt>じたく<\/rt><\/ruby>を<ruby>訪れ<rt>おとずれ<\/rt><\/ruby>ている。\n<ruby>最近<rt>さいきん<\/rt><\/ruby>，Aさんの<ruby>物忘れ<rt>ものわすれ<\/rt><\/ruby>が<ruby>多く<rt>おおく<\/rt><\/ruby>なってきたため，<ruby>不安<rt>ふあん<\/rt><\/ruby>になった<ruby>娘<rt>むすめ<\/rt><\/ruby>が，Aさんと<ruby>一緒<rt>いっしょ<\/rt><\/ruby>に<ruby>病院<rt>びょういん<\/rt><\/ruby>を<ruby>受診<rt>じゅしん<\/rt><\/ruby>したところ，<ruby>医師<rt>いし<\/rt><\/ruby>から，<ruby>脳<rt>のう<\/rt><\/ruby>の<ruby>記憶<rt>きおく<\/rt><\/ruby>をつかさどる<ruby>部分<rt>ぶぶん<\/rt><\/ruby>が<ruby>顕著<rt>けんちょ<\/rt><\/ruby>に<ruby>萎縮<rt>いしゅく<\/rt><\/ruby>したアルツハイマー<ruby>型認知症<rt>がたにんちしょう<\/rt><\/ruby>（dementia of the Alzheimer’s type）であると<ruby>診断<rt>しんだん<\/rt><\/ruby>された。Aさんはこのまま<ruby>自宅<rt>じたく<\/rt><\/ruby>で<ruby>暮ら<rt>くら<\/rt><\/ruby>すことを<ruby>希望<rt>きぼう<\/rt><\/ruby>し，<ruby>介護保険<rt>かいごほけん<\/rt><\/ruby>の<ruby>訪問介護<rt>ほうもんかいご<\/rt><\/ruby>（ホームヘルプサービス）を<ruby>利用<rt>りよう<\/rt><\/ruby>しながら<ruby>一人暮<rt>ひとりぐ<\/rt><\/ruby>らしを<ruby>継続<rt>けいぞく<\/rt><\/ruby>することになった。\nある<ruby>日<rt>にち<\/rt><\/ruby>，<ruby>娘<rt>むすめ<\/rt><\/ruby>からサービス<ruby>提供<rt>ていきょう<\/rt><\/ruby><ruby>責任者<rt>せきにんしゃ<\/rt><\/ruby>に，<ruby>今年<rt>ことし<\/rt><\/ruby>はAさんが<ruby>一人<rt>ひとり<\/rt><\/ruby>で<ruby>雪<rt>ゆき<\/rt><\/ruby>かきができるか<ruby>不安<rt>ふあん<\/rt><\/ruby>であると<ruby>相談<rt>そうだん<\/rt><\/ruby>があった。そこで，サービス<ruby>提供<rt>ていきょう<\/rt><\/ruby><ruby>責任者<rt>せきにんしゃ<\/rt><\/ruby>が，Aさんと<ruby>一緒<rt>いっしょ<\/rt><\/ruby>に<ruby>地区<rt>ちく<\/rt><\/ruby>の<ruby>民生<rt>みんせい<\/rt><\/ruby><ruby>委員<rt>いいん<\/rt><\/ruby>に<ruby>相談<rt>そうだん<\/rt><\/ruby>したところ，<ruby>近所<rt>きんじょ<\/rt><\/ruby>の<ruby>人<rt>ひと<\/rt><\/ruby>たちが<ruby>雪<rt>ゆき<\/rt><\/ruby>かきをしてくれることになった。","アルツハイマー型認知症では、記憶に関係する海馬などが萎縮します。図Ｄが該当します。":"アルツハイマー<ruby>型認知症<rt>がたにんちしょう<\/rt><\/ruby>では、<ruby>記憶<rt>きおく<\/rt><\/ruby>に<ruby>関係<rt>かんけい<\/rt><\/ruby>する<ruby>海馬<rt>かいば<\/rt><\/ruby>などが<ruby>萎縮<rt>いしゅく<\/rt><\/ruby>します。<ruby>図<rt>ず<\/rt><\/ruby>Ｄが<ruby>該当<rt>がいとう<\/rt><\/ruby>します。","地域包括ケアシステムにおいて，Aさんの雪かきの課題への対応を示すものとして，最も適切なものを1つ選びなさい。":"<ruby>地域<rt>ちいき<\/rt><\/ruby><ruby>包括<rt>ほうかつ<\/rt><\/ruby>ケアシステムにおいて，Aさんの<ruby>雪<rt>ゆき<\/rt><\/ruby>かきの<ruby>課題<rt>かだい<\/rt><\/ruby>への<ruby>対応<rt>たいおう<\/rt><\/ruby>を<ruby>示す<rt>しめす<\/rt><\/ruby>ものとして，<ruby>最も<rt>もっとも<\/rt><\/ruby><ruby>適切<rt>てきせつ<\/rt><\/ruby>なものを1つ<ruby>選び<rt>えらび<\/rt><\/ruby>なさい。","自助":"<ruby>自助<rt>じじょ<\/rt><\/ruby>","互助":"<ruby>互助<rt>ごじょ<\/rt><\/ruby>","介助":"<ruby>介助<rt>かいじょ<\/rt><\/ruby>","扶助":"<ruby>扶助<rt>ふじょ<\/rt><\/ruby>","公助":"<ruby>公助<rt>こうじょ<\/rt><\/ruby>","近隣住民が自発的に助け合う雪かきは、互助に当たります。":"<ruby>近隣住民<rt>きんりんじゅうみん<\/rt><\/ruby>が<ruby>自発的<rt>じはつてき<\/rt><\/ruby>に<ruby>助け<rt>たすけ<\/rt><\/ruby><ruby>合う<rt>あう<\/rt><\/ruby><ruby>雪<rt>ゆき<\/rt><\/ruby>かきは、<ruby>互助<rt>ごじょ<\/rt><\/ruby>に<ruby>当たり<rt>あたり<\/rt><\/ruby>ます。","ある日，訪問介護員（ホームヘルパー）がAさんの自宅を訪れ，一包化された薬の服薬状況を確認したところ，残薬があった。Aさんに服薬状況を確認すると，薬を飲んだかどうか，わからなくなることがあるという返答があった。訪問介護員（ホームヘルパー）は，Aさんとの会話から，日時に関する見当識に問題はないことを確認した。Aさんの薬の飲み忘れを防止するための対応として，最も適切なものを1つ選びなさい。":"ある<ruby>日<rt>にち<\/rt><\/ruby>，<ruby>訪問介護員<rt>ほうもんかいごいん<\/rt><\/ruby>（ホームヘルパー）がAさんの<ruby>自宅<rt>じたく<\/rt><\/ruby>を<ruby>訪れ<rt>おとずれ<\/rt><\/ruby>，<ruby>一包化<rt>いっぽうか<\/rt><\/ruby>された<ruby>薬<rt>くすり<\/rt><\/ruby>の<ruby>服薬<rt>ふくやく<\/rt><\/ruby><ruby>状況<rt>じょうきょう<\/rt><\/ruby>を<ruby>確認<rt>かくにん<\/rt><\/ruby>したところ，<ruby>残<rt>ざん<\/rt><\/ruby><ruby>薬<rt>くすり<\/rt><\/ruby>があった。Aさんに<ruby>服薬<rt>ふくやく<\/rt><\/ruby><ruby>状況<rt>じょうきょう<\/rt><\/ruby>を<ruby>確認<rt>かくにん<\/rt><\/ruby>すると，<ruby>薬<rt>くすり<\/rt><\/ruby>を<ruby>飲ん<rt>のん<\/rt><\/ruby>だかどうか，わからなくなることがあるという<ruby>返答<rt>へんとう<\/rt><\/ruby>があった。<ruby>訪問介護員<rt>ほうもんかいごいん<\/rt><\/ruby>（ホームヘルパー）は，Aさんとの<ruby>会話<rt>かいわ<\/rt><\/ruby>から，<ruby>日時<rt>にちじ<\/rt><\/ruby>に<ruby>関す<rt>かんす<\/rt><\/ruby>る<ruby>見当識<rt>けんとうしき<\/rt><\/ruby>に<ruby>問題<rt>もんだい<\/rt><\/ruby>はないことを<ruby>確認<rt>かくにん<\/rt><\/ruby>した。Aさんの<ruby>薬<rt>くすり<\/rt><\/ruby>の<ruby>飲み<rt>のみ<\/rt><\/ruby><ruby>忘れ<rt>わすれ<\/rt><\/ruby>を<ruby>防止<rt>ぼうし<\/rt><\/ruby>するための<ruby>対応<rt>たいおう<\/rt><\/ruby>として，<ruby>最も<rt>もっとも<\/rt><\/ruby><ruby>適切<rt>てきせつ<\/rt><\/ruby>なものを1つ<ruby>選び<rt>えらび<\/rt><\/ruby>なさい。","一包化を中止する。":"<ruby>一包化<rt>いっぽうか<\/rt><\/ruby>を<ruby>中止<rt>ちゅうし<\/rt><\/ruby>する。","インフォーマルな社会資源の活用は避ける。":"インフォーマルな<ruby>社会<rt>しゃかい<\/rt><\/ruby><ruby>資源<rt>しげん<\/rt><\/ruby>の<ruby>活用<rt>かつよう<\/rt><\/ruby>は<ruby>避け<rt>さけ<\/rt><\/ruby>る。","お薬カレンダーの使用を提案する。":"お<ruby>薬<rt>くすり<\/rt><\/ruby>カレンダーの<ruby>使用<rt>しよう<\/rt><\/ruby>を<ruby>提案<rt>ていあん<\/rt><\/ruby>する。","一人では薬を服用しないように伝える。":"<ruby>一人<rt>ひとり<\/rt><\/ruby>では<ruby>薬<rt>くすり<\/rt><\/ruby>を<ruby>服用<rt>ふくよう<\/rt><\/ruby>しないように<ruby>伝え<rt>つたえ<\/rt><\/ruby>る。","薬の飲み忘れに気がついたとき，2回分を服用するように伝える。":"<ruby>薬<rt>くすり<\/rt><\/ruby>の<ruby>飲み<rt>のみ<\/rt><\/ruby><ruby>忘れ<rt>わすれ<\/rt><\/ruby>に<ruby>気が<rt>きが<\/rt><\/ruby>ついたとき，2<ruby>回分<rt>かいぶん<\/rt><\/ruby>を<ruby>服用<rt>ふくよう<\/rt><\/ruby>するように<ruby>伝え<rt>つたえ<\/rt><\/ruby>る。","日時がわかる力を生かし、お薬カレンダーで服薬の予定と実施を確認しやすくします。":"<ruby>日時<rt>にちじ<\/rt><\/ruby>がわかる<ruby>力<rt>ちから<\/rt><\/ruby>を<ruby>生か<rt>いか<\/rt><\/ruby>し、お<ruby>薬<rt>くすり<\/rt><\/ruby>カレンダーで<ruby>服薬<rt>ふくやく<\/rt><\/ruby>の<ruby>予定<rt>よてい<\/rt><\/ruby>と<ruby>実施<rt>じっし<\/rt><\/ruby>を<ruby>確認<rt>かくにん<\/rt><\/ruby>しやすくします。","入所から2か月が経過した。C介護福祉士は，Bさんの四点杖歩行の様子を観察したところ，左立脚相と比べて，右立脚相が短いことが気になった。Bさんの短期目標を達成するために，理学療法士と相談して，転倒予防の観点から，見守り歩行をするときの介護福祉職の位置について，改めて周知することにした。Bさんの四点杖歩行を見守るときに介護福祉職が立つ位置として，最も適切なものを1つ選びなさい。":"<ruby>入所<rt>にゅうしょ<\/rt><\/ruby>から<ruby>2か月<rt>にかげつ<\/rt><\/ruby>が<ruby>経過<rt>けいか<\/rt><\/ruby>した。C<ruby>介護福祉士<rt>かいごふくしし<\/rt><\/ruby>は，Bさんの<ruby>四点杖<rt>よんてんづえ<\/rt><\/ruby><ruby>歩行<rt>ほこう<\/rt><\/ruby>の<ruby>様子<rt>ようす<\/rt><\/ruby>を<ruby>観察<rt>かんさつ<\/rt><\/ruby>したところ，<ruby>左<rt>ひだり<\/rt><\/ruby><ruby>立脚<rt>りっきゃく<\/rt><\/ruby><ruby>相<rt>そう<\/rt><\/ruby>と<ruby>比べ<rt>くらべ<\/rt><\/ruby>て，<ruby>右<rt>みぎ<\/rt><\/ruby><ruby>立脚<rt>りっきゃく<\/rt><\/ruby><ruby>相<rt>そう<\/rt><\/ruby>が<ruby>短い<rt>みじかい<\/rt><\/ruby>ことが<ruby>気に<rt>きに<\/rt><\/ruby>なった。Bさんの<ruby>短期目標<rt>たんきもくひょう<\/rt><\/ruby>を<ruby>達成<rt>たっせい<\/rt><\/ruby>するために，<ruby>理学療法士<rt>りがくりょうほうし<\/rt><\/ruby>と<ruby>相談<rt>そうだん<\/rt><\/ruby>して，<ruby>転倒<rt>てんとう<\/rt><\/ruby><ruby>予防<rt>よぼう<\/rt><\/ruby>の<ruby>観点<rt>かんてん<\/rt><\/ruby>から，<ruby>見守<rt>みまも<\/rt><\/ruby>り<ruby>歩行<rt>ほこう<\/rt><\/ruby>をするときの<ruby>介護福祉職<rt>かいごふくししょく<\/rt><\/ruby>の<ruby>位置<rt>いち<\/rt><\/ruby>について，<ruby>改め<rt>あらため<\/rt><\/ruby>て<ruby>周知<rt>しゅうち<\/rt><\/ruby>することにした。Bさんの<ruby>四点杖<rt>よんてんづえ<\/rt><\/ruby><ruby>歩行<rt>ほこう<\/rt><\/ruby>を<rub
