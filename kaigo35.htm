(()=>{
'use strict';
const host=document.currentScript.previousElementSibling;
const root=host.attachShadow({mode:'open'});
const QUESTIONS=[{"id":1,"answer":[4],"subject":0,"explanation":"本人と相談しながら福祉用具を選び、その人が望む生活の実現を支えます。","sourcePage":1,"question":"利用者の生活の質（QOL）を高めるための介護実践に関する次の記述のうち，最も適切なものを1つ選びなさい。","options":["日常生活動作の向上を必須とする。","利用者の主観的評価では，介護福祉職の意向を重視する。","介護実践は，家族のニーズに応じて行う。","福祉用具の活用は，利用者と相談しながら進める。","価値の基準は，全ての利用者に同じものを用いる。"]},{"id":2,"answer":[3],"subject":0,"explanation":"行きたいという希望を尊重し、交通経路や会場を一緒に確認して不安を減らします。","sourcePage":2,"question":"Aさん（25歳，男性，障害支援区分3）は，網膜色素変性症（retinitis pigmentosa）で，移動と外出先での排泄時に介助が必要である。同行援護を利用しながら，自宅で母親と暮らしている。音楽が好きなAさんは合唱サークルに入会していて，月1回の練習に参加している。合唱コンクールが遠方で行われることになった。同行援護を担当する介護福祉職は，Aさんから，「コンクールに出演したいが，初めての場所に行くことが心配である」と相談を受けた。介護福祉職のAさんへの対応として，最も適切なものを1つ選びなさい。","options":["合唱コンクールへの参加を諦めるように話す。","合唱サークルの仲間に移動の支援を依頼するように伝える。","一緒に交通経路や会場内の状況を確認する。","合唱コンクールに参加するかどうかは，母親に判断してもらうように促す。","日常生活自立支援事業の利用を勧める。"]},{"id":3,"answer":[2],"subject":1,"explanation":"問題焦点型コーピングは、ストレスの原因そのものに働きかけ、解決を目指す対処です。","sourcePage":3,"question":"ストレス対処行動の一つである問題焦点型コーピングに当てはまる行動として，適切なものを1つ選びなさい。","options":["趣味の活動をして気分転換する。","トラブルの原因に働きかけて解決しようとする。","運動して身体を動かしストレスを発散する。","好きな音楽を聴いてリラックスする。","「トラブルも良い経験だ」と自己の意味づけを変える。"]},{"id":4,"answer":[3],"subject":1,"explanation":"まず自分から自己紹介をし、安心して話せる関係をつくります。","sourcePage":3,"question":"Bさん（80歳，女性）は，介護老人保健施設に入所が決まった。今日はBさんが施設に入所する日であり，C介護福祉職が担当者になった。C介護福祉職は，初対面のBさんとの信頼関係の形成に向けて取り組んだ。C介護福祉職のBさんへの対応として，最も適切なものを1つ選びなさい。","options":["自発的な関わりをもつことを控えた。","真正面に座って面談をした。","自分から進んで自己紹介をした。","終始，手を握りながら話をした。","孫のような口調で語りかけた。"]},{"id":5,"answer":[4],"subject":1,"explanation":"アクションは改善の段階です。駐車場所を確保することが、苦情を踏まえた改善に当たります。","sourcePage":4,"question":"介護老人福祉施設は，利用者とその家族，地域住民等との交流を目的とした夏祭りを開催した。夏祭りには，予想を超えた来客があり，「違法駐車が邪魔で困る」という苦情が近隣の住民から寄せられた。そこで，次の夏祭りの運営上の改善に向けて職員間で話し合い，対応案を作成した。次の対応案のうち，PDCAサイクルのアクション（Action）に当たるものとして，最も適切なものを1つ選びなさい。","options":["近隣への騒音の影響について調べる。","苦情を寄せた住民に話を聞きに行く。","夏祭りの感想を利用者から聞く。","来客者用の駐車スペースを確保する。","周辺の交通量を調べる。"]},{"id":6,"answer":[3],"subject":1,"explanation":"ＯＪＴは、実際の仕事を通じて学ぶ研修です。先輩が現場で介護技術を指導します。","sourcePage":4,"question":"D介護福祉職は，利用者に対して行っている移乗の介護がうまくできず，技術向上を目的としたOJTを希望している。次のうち，D介護福祉職に対して行うOJTとして，最も適切なものを1つ選びなさい。","options":["専門書の購入を勧める。","外部研修の受講を提案する。","先輩職員が移乗の介護に同行して指導する。","職場外の専門家に相談するように助言する。","苦手な移乗の介護は控えるように指示する。"]},{"id":7,"answer":[5],"subject":2,"explanation":"社会福祉協議会は、社会福祉法に基づき、地域福祉の推進を図る団体です。","sourcePage":5,"question":"社会福祉法に基づく，都道府県や市町村において地域福祉の推進を図ることを目的とする団体として，正しいものを1つ選びなさい。","options":["特定非営利活動法人（NPO法人）","隣保館","地域包括支援センター","基幹相談支援センター","社会福祉協議会"]},{"id":8,"answer":[5],"subject":2,"explanation":"地域共生社会は、誰もが役割をもち、つながり、支え合って暮らせる社会です。","sourcePage":5,"question":"近年，人と人，人と社会とがつながり，一人ひとりが生きがいや役割をもち，助け合いながら暮らしていくことのできる，包摂的なコミュニティ，地域や社会を創るという考え方が示されている。この考え方を表すものとして，最も適切なものを1つ選びなさい。","options":["ナショナルミニマム（national minimum）","バリアフリー社会","介護の社会化","生涯現役社会","地域共生社会"]},{"id":9,"answer":[2],"subject":2,"explanation":"1950年の勧告では、社会保険・国家扶助・公衆衛生及び医療・社会福祉を基本に整理しました。","sourcePage":6,"question":"我が国の社会保障制度の基本となる，1950年（昭和25年）の社会保障制度審議会による「社会保障制度に関する勧告」の内容として，最も適切なものを1つ選びなさい。","options":["生活困窮者自立支援法の制定の提言","社会保障制度を，社会保険，国家扶助，公衆衛生及び医療，社会福祉で構成","介護保険制度の創設の提言","保育所の待機児童ゼロ作戦の提言","介護分野におけるICT等の活用とビッグデータの整備"]},{"id":10,"answer":[1],"subject":2,"explanation":"要介護認定の区分変更は、介護保険の保険者である市町村などに申請します。","sourcePage":6,"question":"Eさん（75歳，女性，要介護2）は，訪問介護（ホームヘルプサービス）を利用している。最近，Eさんの認知症（dementia）が進行して，家での介護が困難になり，介護老人福祉施設の申込みをすることにした。家族が訪問介護員（ホームヘルパー）に相談したところ，まだ要介護認定の有効期間が残っていたが，要介護状態区分の変更の申請ができることがわかった。家族が区分変更するときの申請先として，正しいものを1つ選びなさい。","options":["介護保険の保険者","後期高齢者医療広域連合","介護保険審査会","国民健康保険団体連合会","運営適正化委員会"]},{"id":11,"answer":[4],"subject":2,"explanation":"聞こえにくさを補うため、口頭の説明を書面でも伝えることが合理的配慮になります。","sourcePage":7,"question":"Fさん（19歳，女性，身体障害者手帳2級）は，先天性の聴覚障害がある。Fさんは大学生で，授業のときは手話通訳者が配置されている。Fさんは筆記による定期試験を受けることになり，試験実施に関する配慮を大学に申し出た。次の記述のうち，Fさんの申し出を踏まえた合理的配慮として，最も適切なものを1つ選びなさい。","options":["受験時間を延長する。","試験問題の文字を拡大する。","テキストの持ち込みを許可する。","試験監督者が口頭で説明する内容を書面で渡す。","問題を読み上げる。"]},{"id":12,"answer":[4],"subject":2,"explanation":"2011年の障害者基本法改正では、社会的障壁の除去に関する規定が加わりました。","sourcePage":7,"question":"我が国の「障害者権利条約」の批准（2014年（平成26年））に向けて行われた，障害者基本法の改正（2011年（平成23年））で新たに法律上に規定されたものとして，適切なものを1つ選びなさい。","options":["自立支援医療（精神通院医療）の開始","共同生活援助（グループホーム）の制度化","成年後見制度の創設","社会的障壁の除去","東京2020パラリンピック競技大会の開催"],"note":"（注）「障害者権利条約」とは，国際連合の「障害者の権利に関する条約」のことである。"},{"id":13,"answer":[1],"subject":2,"explanation":"介護給付の利用は、まず市町村に支給申請をすることから始まります。","sourcePage":8,"question":"次のうち，「障害者総合支援法」の介護給付を利用するときに，利用者が最初に市町村に行う手続きとして，適切なものを1つ選びなさい。","options":["支給申請","認定調査","審査会の開催","障害支援区分の認定","サービス等利用計画の作成"],"note":"（注）「障害者総合支援法」とは，「障害者の日常生活及び社会生活を総合的に支援するための法律」のことである。"},{"id":14,"answer":[2],"subject":2,"explanation":"障害福祉サービスの利用者負担は、負担能力に応じた応能負担を基本とします。","sourcePage":8,"question":"「障害者総合支援法」の居宅介護を利用したときの利用者負担の考え方として，最も適切なものを1つ選びなさい。","options":["利用したサービスの種類や量に応じて負担する。","利用者の負担能力に応じて負担する。","利用したサービス費用の一定の割合を負担する。","利用したサービス費用の全額を負担する。","利用者は負担しない。"],"note":"（注）「障害者総合支援法」とは，「障害者の日常生活及び社会生活を総合的に支援するための法律」のことである。"},{"id":15,"answer":[4],"subject":2,"explanation":"個人情報を第三者へ提供する場合は、原則として本人の同意が必要です。","sourcePage":9,"question":"「個人情報保護法」に基づくプライバシー保護に関する次の記述のうち，最も適切なものを1つ選びなさい。","options":["電磁的記録は，個人情報には含まれない。","マイナンバーなどの個人識別符号は，個人情報ではない。","施設職員は，実習生に利用者の生活歴などを教えることは一切できない。","個人情報を第三者に提供するときは，原則として本人の同意が必要である。","自治会長は，本人の同意がなくても個人情報を入手できる。"],"note":"（注）「個人情報保護法」とは，「個人情報の保護に関する法律」のことである。"},{"id":16,"answer":[4],"subject":2,"explanation":"養介護施設従事者等が業務上の虐待を発見した場合は、市町村へ通報する義務があります。","sourcePage":9,"question":"「高齢者虐待防止法」に関する次の記述のうち，最も適切なものを1つ選びなさい。","options":["虐待が起こる場として，家庭，施設，病院の3つが規定されている。","対象は，介護保険制度の施設サービス利用者とされている。","徘徊しないように車いすに固定することは，身体拘束には当たらない。","虐待を発見した養介護施設従事者には，通報する義務がある。","虐待の認定は，警察署長が行う。"],"note":"（注）「高齢者虐待防止法」とは，「高齢者虐待の防止，高齢者の養護者に対する支援等に関する法律」のことである。"},{"id":17,"answer":[1],"subject":2,"explanation":"母親との生活を続けるため、地域包括支援センターで介護保険サービスについて相談します。","sourcePage":10,"question":"発達障害のGさん（38歳，男性）は，高校生の頃に不登校になり，ずっとアルバイトをしながら，統合失調症（schizophrenia）の母親（65歳，精神保健福祉手帳2級）を介護してきた。母親に認知症（dementia）が疑われるようになったが，これからも二人で暮らし続けたいと考えたGさんは，相談支援事業所の介護福祉職に相談した。Gさんに対する介護福祉職の助言として，最も適切なものを1つ選びなさい。","options":["地域包括支援センターで，介護保険サービスの情報を得ることを勧める。","Gさんが正規に雇用されるように，ハローワークに相談に行くことを勧める。","Gさんの発達障害について，クリニックで適切な治療を受けることを勧める。","母親に，介護老人福祉施設を紹介する。","母親に，精神科病院への入院を勧める。"]},{"id":18,"answer":[1],"subject":2,"explanation":"生活困窮者自立支援法は、最低限度の生活を維持できなくなるおそれのある人も対象とします。","sourcePage":10,"question":"生活困窮者自立支援法に関する次の記述のうち，適切なものを1つ選びなさい。","options":["最低限度の生活が維持できなくなるおそれのある者が対象になる。","自立を図るために，就労自立給付金が支給される。","疾病がある者には，医療費が支給される。","子どもへの学習支援は，必須事業とされている。","最終的な，「第3のセーフティーネット」と位置づけられている。"]},{"id":19,"answer":[4],"subject":3,"explanation":"円熟型は、加齢を受け入れ、人間関係や活動を楽しみながら生活する適応的な類型です。","sourcePage":11,"question":"Hさん（75歳，男性）は，一人暮らしであるが，隣人と共に社会活動にも積極的に参加し，ゲートボールや詩吟，芸術活動など多くの趣味をもっている。また，多くの友人から，「Hさんは，毎日を有意義に生活している」と評価されている。Hさん自身も友人関係に満足している。ライチャード（Reichard，S.）による老齢期の性格類型のうち，Hさんに相当するものとして，適切なものを1つ選びなさい。","options":["自責型","防衛型（装甲型）","憤慨型","円熟型","依存型（安楽いす型）"]},{"id":20,"answer":[1],"subject":3,"explanation":"大脳の後頭葉には、視覚の情報を処理する視覚野があります。","sourcePage":11,"question":"大脳の後頭葉にある機能局在として，適切なものを1つ選びなさい。","options":["視覚野","聴覚野","運動野","体性感覚野","感覚性言語野（ウェルニッケ野）"]},{"id":21,"answer":[3],"subject":3,"explanation":"大腿四頭筋は膝を伸ばして支え、立った姿勢を保つ抗重力筋の一つです。","sourcePage":12,"question":"立位姿勢を維持するための筋肉（抗重力筋）として，最も適切なものを1つ選びなさい。","options":["上腕二頭筋","大胸筋","大腿四頭筋","僧帽筋","三角筋"]},{"id":22,"answer":[1],"subject":3,"explanation":"活動が少ない状態が続くと、身体機能だけでなく、意欲低下やうつ状態も起こることがあります。","sourcePage":12,"question":"廃用症候群（disuse syndrome）で起こる可能性があるものとして，最も適切なものを1つ選びなさい。","options":["うつ状態","高血圧","関節炎","徘徊","下痢"]},{"id":23,"answer":[4],"subject":3,"explanation":"仙骨部は骨が突出し、仰向けで圧迫されやすいため、褥瘡ができやすい部位です。","sourcePage":12,"question":"褥瘡の好発部位として，最も適切なものを1つ選びなさい。","options":["側頭部","頸部","腹部","仙骨部","足趾部"]},{"id":24,"answer":[3],"subject":3,"explanation":"歯周病では細菌が増え、その働きによって口臭が生じやすくなります。","sourcePage":13,"question":"次のうち，口臭の原因になりやすい状態として，最も適切なものを1つ選びなさい。","options":["唾液の増加","義歯の装着","歯周病（periodontal disease）","顎関節症（temporomandibular joint disorder）","低栄養状態"]},{"id":25,"answer":[2],"subject":3,"explanation":"まず座り方と首の位置を整えます。首が後ろに反った姿勢は誤嚥につながります。","sourcePage":13,"question":"Jさん（82歳，女性）は，施設に入所している。Jさんは車いすで食堂に来て，箸やスプーンを使って，自分で食事をしている。主食は普通食，おかずは刻み食で全量摂取している。最近，車いすからずり落ちる傾向があり，首が後屈した姿勢で食事をし，むせることが多くなった。Jさんが誤嚥をしないようにするための最初の対応として，最も適切なものを1つ選びなさい。","options":["食事回数の調整","座位姿勢の調整","使用食器の変更","食事の量の調整","食事場所の変更"]},{"id":26,"answer":[5],"subject":3,"explanation":"本人が安全に飲める水分の形状かを確認します。必要に応じて、とろみなどを調整します。","sourcePage":14,"question":"次のうち，誤嚥しやすい高齢者の脱水予防のために確認することとして，最も優先すべきものを1つ選びなさい。","options":["義歯の装着状態","上肢の関節可動域","睡眠時間","夜間の咳込みの有無","摂取している水分の形状"]},{"id":27,"answer":[5],"subject":3,"explanation":"大腸の内容物は、上行結腸から横行結腸、下行結腸、Ｓ状結腸、直腸へ進みます。","sourcePage":14,"question":"健康な成人の便の生成で，上行結腸の次に内容物が通過する部位として，正しいものを1つ選びなさい。","options":["S状結腸","回腸","直腸","下行結腸","横行結腸"]},{"id":28,"answer":[2],"subject":3,"explanation":"高齢者では薬の作用が翌朝まで残り、眠気やふらつきが起こることがあります。","sourcePage":14,"question":"高齢者の睡眠薬の使用に関する次の記述のうち，最も適切なものを1つ選びなさい。","options":["依存性は生じにくい。","翌朝まで作用が残ることがある。","食事後すぐの服用が望ましい。","アルコールと一緒に飲んでも効果は変わらない。","転倒の原因にはならない。"]},{"id":29,"answer":[2],"subject":3,"explanation":"グリーフは、大切な人を失った後に起こる、悲しみなどの心身の反応です。","sourcePage":15,"question":"大切な人を亡くした後にみられる，寂しさやむなしさ，無力感などの精神的反応や，睡眠障害，食欲不振，疲労感などの身体的反応を表すものとして，最も適切なものを1つ選びなさい。","options":["認知症（dementia）","グリーフ（grief）","リビングウィル（living will）","スピリチュアル（spiritual）","パニック障害（panic disorder）"]},{"id":30,"answer":[5],"subject":3,"explanation":"死が近づくと分泌物を排出しにくくなり、呼吸時に音がする喘鳴がみられることがあります。","sourcePage":15,"question":"死が近づいているときの身体の変化として，最も適切なものを1つ選びなさい。","options":["瞳孔の縮小","筋肉の硬直","発汗","結膜の充血","喘鳴"]},{"id":31,"answer":[4],"subject":4,"explanation":"社会的参照は、他者の表情などを手がかりに、自分の行動を決めることです。","sourcePage":16,"question":"今，発達の実験のために，図のようなテーブル（テーブル表面の左半分が格子柄，右半分が透明な板で床の格子柄が透けて見える）の左端に，Kさん（1歳1か月）を座らせた。テーブルの反対側には母親が立っている。Kさんは，格子柄と透明な板との境目でいったん動くのをやめて，怖がった表情で母親の顔を見た。母親が穏やかにほほ笑むと，Kさんは母親の方に近づいていった。\nKさんの行動を説明する用語として，最も適切なものを1つ選びなさい。","options":["自己中心性","愛着理論","向社会的行動","社会的参照","原始反射"],"figure":"data:image/webp;base64,UklGRohUAABXRUJQVlA4IHxUAADQHgGdASpTArgBPh0OhkIhBF5HWwQAcS0t3o/6iAhFfO+uhHAldzML/fPyk/pXjX/W/x7/ufqT+MfPv1n8Z/7L/3P8f97P5t/keZjqf/k+h/8s+yv2L+9fsv/bf is）の主な症状は，頭痛である。","尿の濃縮力が低下する。","前立腺肥大症（prostatic hypertrophy）では，尿道の痛みがある。","薬物が排出される時間は，短くなる。"]},{"id":37,"answer":[2],"subject":4,"explanation":"変形性膝関節症は、男性より女性に多くみられます。","sourcePage":18,"question":"老年期の変形性膝関節症（knee osteoarthritis）に関する次の記述のうち，最も適切なものを1つ選びなさい。","options":["外反型の脚の変形を伴うことが多い。","女性のほうが男性より罹患率が高い。","積極的に患部を冷やすことを勧める。","正座の生活習慣を勧める。","肥満のある人には積極的に階段を利用するように勧める。"]},{"id":38,"answer":[5],"subject":4,"explanation":"脱水で体内の水分が減ると、体重が減少することがあります。","sourcePage":19,"question":"高齢者の脱水に関する次の記述のうち，最も適切なものを1つ選びなさい。","options":["若年者よりも口渇感を感じやすい。","体内水分量は若年者よりも多い。","起立時に血圧が上がりやすくなる。","下痢が原因となることはまれである。","体重が減ることがある。"]},{"id":39,"answer":[2],"subject":5,"explanation":"2019年の認知症施策推進大綱では、「普及啓発・本人発信支援」が五つの柱の一つです。","sourcePage":20,"question":"次のうち，2019年（令和元年）の認知症施策推進大綱の5つの柱に示されているものとして，適切なものを1つ選びなさい。","options":["市民後見人の活動推進への体制整備","普及啓発・本人発信支援","若年性認知症支援ハンドブックの配布","認知症初期集中支援チームの設置","認知症カフェ等を全市町村に普及"]},{"id":40,"answer":[1],"subject":5,"explanation":"見当識は、時間・場所・人物などを把握する力です。現在の場所を尋ねる質問が該当します。","sourcePage":20,"question":"次の記述のうち，見当識障害に関する質問として，最も適切なものを1つ選びなさい。","options":["「私たちが今いるところはどこですか」","「100から7を順番に引いてください」","「先ほど覚えてもらった言葉をもう一度言ってみてください」","「次の図形を写してください」","「この紙を左手で取り，両手で半分に折って，私に返してください」"]},{"id":41,"answer":[2],"subject":5,"explanation":"もの盗られ妄想には、記憶障害に加え、不安などの気持ちが関係します。","sourcePage":21,"question":"アルツハイマー型認知症（dementia of the Alzheimer’s type）の，もの盗られ妄想に関する次の記述のうち，最も適切なものを1つ選びなさい。","options":["説明をすれば自身の考えの誤りに気づくことが多い。","本人の不安から生じることが多い。","現実に存在しない人が犯人とされる。","主に幻視が原因である。","症状の予防には抗精神病薬が有効である。"]},{"id":42,"answer":[3],"subject":5,"explanation":"抗凝固薬は血液を固まりにくくするため、慢性硬膜下血腫のリスクになります。","sourcePage":21,"question":"慢性硬膜下血腫（chronic subdural hematoma）に関する次の記述のうち，最も適切なものを1つ選びなさい。","options":["運動機能障害が起こることは非常に少ない。","頭蓋骨骨折を伴い発症する。","抗凝固薬の使用はリスクとなる。","転倒の後，2～3日で発症することが多い。","保存的治療が第一選択である。"]},{"id":43,"answer":[4],"subject":5,"explanation":"日常生活自立支援事業では、生活支援員が公共料金の支払いなど、日常的な金銭管理を支援できます。","sourcePage":22,"question":"Lさん（83歳，女性，要介護1）は，アルツハイマー型認知症（dementia of the Alzheimer’s type）である。一人暮らしで，週2回，訪問介護（ホームヘルプサービス）を利用している。ある日，訪問介護員（ホームヘルパー）が訪問すると，息子が来ていて，「最近，母が年金の引き出しや，水道代の支払いを忘れるようだ。日常生活自立支援事業というものがあると聞いたことがあるが，どのような制度なのか」と質問があった。訪問介護員（ホームヘルパー）の説明として，最も適切なものを1つ選びなさい。","options":["「申込みをしたい場合は，家庭裁判所が受付窓口です」","「年金の振込口座を，息子さん名義の口座に変更することができます」","「Lさんが契約内容を理解できない場合は，息子さんが契約できます」","「生活支援員が，水道代の支払いをLさんの代わりに行うことができます」","「利用後に苦情がある場合は，国民健康保険団体連合会が受付窓口です」"]},{"id":44,"answer":[4],"subject":5,"explanation":"ユマニチュードの「立つ」は、本人の状態に合わせて立位をとる機会をつくることです。","sourcePage":22,"question":"認知症ケアの技法であるユマニチュードに関する次の記述のうち，正しいものを1つ選びなさい。","options":["「見る」とは，離れた位置からさりげなく見守ることである。","「話す」とは，意識的に高いトーンの大きな声で話しかけることである。","「触れる」とは，指先で軽く触れることである。","「立つ」とは，立位をとる機会を作ることである。","「オートフィードバック」とは，ケアを評価することである。"]},{"id":45,"answer":[1],"subject":5,"explanation":"ステップアップ講座を受けた認知症サポーターは、チームオレンジなどでの活動が期待されます。","sourcePage":23,"question":"現行の認知症サポーターに関する次の記述のうち，最も適切なものを1つ選びなさい。","options":["ステップアップ講座を受講した認知症サポーターには，チームオレンジへの参加が期待されている。","100万人を目標に養成されている。","認知症介護実践者等養成事業の一環である。","認知症ケア専門の介護福祉職である。","国が実施主体となって養成講座を行っている。"]},{"id":46,"answer":[3],"subject":5,"explanation":"認知症ケアパスは、本人の状態に応じた医療や介護などの支援の流れを示したものです。","sourcePage":23,"question":"認知症ケアパスに関する次の記述のうち，最も適切なものを1つ選びなさい。","options":["都道府県ごとに作られるものである。","介護保険制度の地域密着型サービスの1つである。","認知症（dementia）の人の状態に応じた適切なサービス提供の流れをまとめたものである。","レスパイトケアとも呼ばれるものである。","介護支援専門員（ケアマネジャー）が中心になって作成する。"]},{"id":47,"answer":[3],"subject":5,"explanation":"認知症ライフサポートモデルでは、本人を中心に生活全体を捉え、自己決定を支えます。","sourcePage":24,"question":"認知症ライフサポートモデルに関する次の記述のうち，最も適切なものを1つ選びなさい。","options":["各職種がそれぞれで目標を設定する。","終末期に行う介入モデルである。","認知症（dementia）の人本人の自己決定を支える。","生活を介護サービスに任せるプランを策定する。","認知症（dementia）の人に施設入所を促す。"]},{"id":48,"answer":[5],"subject":5,"explanation":"裁縫のように、繰り返し行って身につけた技能の記憶は手続き記憶です。","sourcePage":24,"question":"Mさん（88歳，女性）は，アルツハイマー型認知症（dementia of the Alzheimer’s type）と診断された。夫と二人暮らしで，訪問介護（ホームヘルプサービス）を利用している。訪問介護員（ホームヘルパー）が訪問したときに夫から，「最近，日中することがなく寝てしまい，夜眠れていないようだ」と相談を受けた。訪問介護員（ホームヘルパー）は，Mさんが長年していた裁縫を日中にしてみることを勧めた。早速，裁縫をしてみるとMさんは，短時間で雑巾を縫うことができた。Mさんの裁縫についての記憶として，最も適切なものを1つ選びなさい。","options":["作業記憶","展望的記憶","短期記憶","陳述記憶","手続き記憶"]},{"id":49,"answer":[1],"subject":6,"explanation":"ストレングスは、本人の強みや得意なこと、利用できる資源に着目する考え方です。","sourcePage":25,"question":"ストレングス（strength）の視点に基づく利用者支援の説明として，最も適切なものを1つ選びなさい。","options":["個人の特性や強さを見つけて，それを生かす支援を行うこと。","日常生活の条件をできるだけ，障害のない人と同じにすること。","全人間的復権を目標とすること。","権利を代弁・擁護して，権利の実現を支援すること。","抑圧された権利や能力を取り戻して，力をつけること。"]},{"id":50,"answer":[3],"subject":6,"explanation":"自立生活運動は、介助を受けても、本人が意思決定して生活することを重視します。","sourcePage":25,"question":"1960年代のアメリカにおける自立生活運動（IL運動）に関する次の記述のうち，最も適切なものを1つ選びなさい。","options":["障害があっても障害のない人々と同じ生活を送る。","一度失った地位，名誉，特権などを回復する。","自分で意思決定をして生活する。","医療職が機能回復訓練を行う。","障害者の社会への完全参加と平等を促進する。"]},{"id":51,"answer":[4],"subject":6,"explanation":"著しい暴言は、相手の心を傷つける心理的虐待に当たります。","sourcePage":26,"question":"「障害者虐待防止法」における，障害者に対する著しい暴言が当てはまる障害者虐待の類型として，最も適切なものを1つ選びなさい。","options":["身体的虐待","放棄・放置","性的虐待","心理的虐待","経済的虐待"],"note":"（注）「障害者虐待防止法」とは，「障害者虐待の防止，障害者の養護者に対する支援等に関する法律」のことである。"},{"id":52,"answer":[5],"subject":6,"explanation":"受容期では、障害に対する価値観が変わり、自分の可能性を生かす積極的な生活へ向かいます。","sourcePage":26,"question":"上田敏の障害受容のモデルにおける受容期の説明として，最も適切なものを1つ選びなさい。","options":["受傷直後である。","障害の状態を否認する。","リハビリテーションによって機能回復に取り組む。","障害のため何もできないと捉える。","障害に対する価値観を転換し，積極的な生活態度になる。"]},{"id":53,"answer":[3],"subject":6,"explanation":"頸髄が損傷すると、損傷の程度や部位に応じて両腕と両脚に麻痺が生じます。","sourcePage":27,"question":"次のうち，四肢麻痺を伴う疾患や外傷として，適切なものを1つ選びなさい。","options":["右脳梗塞（right cerebral infarction）","左脳梗塞（left cerebral infarction）","頸髄損傷（cervical cord injury）","腰髄損傷（lumbar spinal cord injury）","末梢神経損傷（peripheral nerve injury）"]},{"id":54,"answer":[1],"subject":6,"explanation":"学習障害では、読む・書く・計算するなど、特定の能力の習得や使用に困難があります。","sourcePage":27,"question":"学習障害の特徴に関する次の記述のうち，最も適切なものを1つ選びなさい。","options":["読む・書く・計算するなどの習得に困難がある。","注意力が欠如している。","じっとしているのが難しい。","脳の機能に障害はない。","親のしつけ方や愛情不足によるものである。"]},{"id":55,"answer":[2],"subject":6,"explanation":"動作の調整がうまくできず、ふらつきや手の震えが生じる状態は運動失調です。","sourcePage":28,"question":"Aさん（60歳，男性）は，脊髄小脳変性症（spinocerebellar degeneration）のため，物をつかもうとすると手が震え，起立時や歩行時に身体がふらつき，ろれつが回らないため発語が不明瞭である。次のうち，Aさんの現在の症状に該当するものとして，最も適切なものを1つ選びなさい。","options":["運動麻痺","運動失調","関節拘縮","筋萎縮","筋固縮"]},{"id":56,"answer":[5],"subject":6,"explanation":"本人が自分で決めて実行できるように支え、主体性や自信の回復につなげます。","sourcePage":28,"question":"Bさん（21歳，男性）は，統合失調症（schizophrenia）を発症し，継続した内服によって幻覚や妄想などの症状は改善しているが，意欲や自発性が低下して引きこもりがちである。現在，Bさんは，外来に通院しながら自宅で生活していて，就労を考えるようになってきた。介護福祉職が就労に向けて支援するにあたり留意すべきこととして，最も適切なものを1つ選びなさい。","options":["あいまいな言葉で説明する。","代理で手続きを進める。","介護福祉職が正しいと考える支援を行う。","Bさんに意欲をもつように強く指示する。","Bさん自身が物事を決め，実行できるように関わる。"]},{"id":57,"answer":[3],"subject":6,"explanation":"必要なサービスが地域にない場合は、社会資源の開発を協議して進めます。","sourcePage":29,"question":"Cさん（3歳）は，24時間の人工呼吸器管理，栄養管理と体温管理が必要であり，母親（32歳）が生活全般を支えている。Cさんの母親は，「発達支援やショートステイを活用したいのに，市内に事業所がない。ほかにも困っている家族がいる」とD相談支援専門員に伝えた。D相談支援専門員が，課題の解決に向けて市（自立支援）協議会に働きかけたところ，市内に該当する事業所がないことが明らかになった。この事例で，地域におけるサービスの不足を解決するために，市（自立支援）協議会に期待される機能・役割として，最も適切なものを1つ選びなさい。","options":["困難な事例や資源不足についての情報の発信","権利擁護に関する取り組みの展開","地域の社会資源の開発","構成員の資質向上","基幹相談支援センターの運営評価"]},{"id":58,"answer":[5],"subject":6,"explanation":"障害福祉サービスの利用に向けて、相談支援専門員が関係者の会議を開き、支援を調整します。","sourcePage":29,"question":"Eさん（38歳，男性）は，脳梗塞（cerebral infarction）を発症し，病院に入院していた。退院時に，右片麻痺と言語障害があったため，身体障害者手帳2級の交付を受けた。現在，Eさんと家族の希望によって，自宅で生活しているが，少しずつ生活に支障が出てきている。Eさんの今後の生活を支えるために，障害福祉サービスの利用を前提に多職種連携による支援が行われることになった。Eさんに関わる関係者が果たす役割として，最も適切なものを1つ選びなさい。","options":["介護支援専門員（ケアマネジャー）が，介護サービス計画を作成する。","医師が，要介護認定を受けるための意見書を作成する。","基幹相談支援センターの職員が，障害福祉計画を立てる。","地域包括支援センターの職員が，認定調査を行う。","相談支援専門員が，サービス担当者会議を開催する。"]},{"id":59,"answer":[3],"subject":7,"explanation":"滅菌した物にも有効期限があります。期限や包装の状態を確認して使用します。","sourcePage":30,"question":"消毒と滅菌に関する次の記述のうち，正しいものを1つ選びなさい。","options":["消毒は，すべての微生物を死滅させることである。","複数の消毒液を混ぜると効果的である。","滅菌物には，有効期限がある。","家庭では，熱水で滅菌する。","手指消毒は，次亜塩素酸ナトリウムを用いる。"]},{"id":60,"answer":[1],"subject":7,"explanation":"正常な呼吸では、胸や腹が一定のリズムで動きます。","sourcePage":30,"question":"次の記述のうち，成人の正常な呼吸状態として，最も適切なものを1つ選びなさい。","options":["胸腹部が一定のリズムで膨らんだり縮んだりしている。","ゴロゴロとした音がする。","爪の色が紫色になっている。","呼吸数が1分間に40回である。","下顎を上下きせて呼吸している。"]},{"id":61,"answer":[2],"subject":7,"explanation":"吸引を行うたびに本人へ説明し、理解や同意を確認して不安を軽減します。","sourcePage":31,"question":"喀痰吸引を行う前の準備に関する次の記述のうち，最も適切なものを1つ選びなさい。","options":["医師の指示書の確認は，初回に一度行う。","利用者への吸引の説明は，吸引のたびに行う。","腹臥位の姿勢にする。","同室の利用者から見える状態にする。","利用者に手指消毒をしてもらう。"]},{"id":62,"answer":[4],"subject":7,"explanation":"口から食べていなくても、口の中の清潔を保つために口腔ケアが必要です。","sourcePage":31,"question":"胃ろうによる経管栄養での生活上の留意点の説明として，最も適切なものを1つ選びなさい。","options":["「日中は，ベッド上で過ごします」","「夜寝るときは，上半身を起こした姿勢で寝ます」","「便秘の心配はなくなります」","「口から食べなくても口腔ケアは必要です」","「入浴は清拭に変更します」"]},{"id":63,"answer":[5],"subject":7,"explanation":"嘔吐物が気道に入らないよう、顔を横に向けます。経管栄養は中止し、看護職につなぎます。","sourcePage":32,"question":"Fさん（87歳，女性）は，介護老人福祉施設に入所している。嚥下機能が低下したため，胃ろうによる経管栄養が行われている。担当の介護福祉士は，Fさんの経管栄養を開始して，しばらく観察した。その後，15分後に訪室すると，Fさんが嘔吐して，意識はあるが苦しそうな表情をしていた。介護福祉士は，すぐに経管栄養を中止して看護職員を呼んだ。看護職員が来るまでの介護福祉士の対応として，最も優先すべきものを1つ選びなさい。","options":["室内の換気を行った。","ベッド上の嘔吐物を片付けた。","酸素吸入を行った。","心臓マッサージを行った。","誤嚥を防ぐために顔を横に向けた。"]},{"id":64,"answer":[3],"subject":8,"explanation":"本人の好みを確認して調理することが、利用者主体の支援です。","sourcePage":33,"question":"利用者主体の考えに基づいた訪問介護員（ホームヘルパー）の対応に関する次の記述のうち，最も適切なものを1つ選びなさい。","options":["トイレの窓は換気が必要であると判断し，開けたままにしておいた。","認知症（dementia）の人が包丁を持つのは危険だと判断し，訪問介護員（ホームヘルパー）が調理した。","煮物を調理するとき，利用者に好みの切り方を確認してもらった。","糖尿病（diabetes mellitus）のある利用者には，買い物代行で菓子の購入はしないことにした。","次回の掃除のために，訪問介護員（ホームヘルパー）が使いやすい場所に掃除機を置いた。"]},{"id":65,"answer":[5],"subject":8,"explanation":"介護福祉士には、介護職の中で中核的な役割を担うことが求められています。","sourcePage":34,"question":"「求められる介護福祉士像」で示された内容に関する次の記述のうち，最も適切なものを1つ選びなさい。","options":["地域や社会のニーズにかかわらず，利用者を導く。","利用者の身体的な支援よりも，心理的・社会的支援を重視する。","施設か在宅かに関係なく，家族が望む生活を支える。","専門職として他律的に介護過程を展開する。","介護職の中で中核的な役割を担う。"],"note":"（注）「求められる介護福祉士像」とは，社会保障審議会福祉部会福祉人材確保専門委員会「介護人材に求められる機能の明確化とキャリアパスの実現に向けて」（2017年（平成29年）10月4日）の中で示されたものを指す。"},{"id":66,"answer":[2],"subject":8,"explanation":"介護福祉士には、介護に関する知識や技能を向上させる資質向上の責務があります。","sourcePage":34,"question":"社会福祉士及び介護福祉士法に規定されている介護福祉士の責務として，最も適切なものを1つ選びなさい。","options":["地域生活支援事業その他の支援を総合的に行う。","介護等に関する知識及び技能の向上に努める。","肢体の不自由な利用者に対して必要な訓練を行う。","介護保険事業に要する費用を公平に負担する。","常に心身の健康を保持して，社会的活動に参加するように努める。"]},{"id":67,"answer":[4],"subject":8,"explanation":"まず本人がサービスを変えたい理由を聴き、希望や判断の背景を理解します。","sourcePage":35,"question":"Aさん（85歳，女性，要介護1）は夫と二人暮らしで，訪問介護（ホームヘルプサービス）を利用している。Aさんは認知症（dementia）の進行によって，理解力の低下がみられる。ある日，Aさんが訪問介護員（ホームヘルパー）に，「受けているサービスをほかのものに変更したい」「夫とは仲が悪いので話したくない」と，不安な様子で話した。意思決定支援を意識した訪問介護員（ホームヘルパー）の対応として，最も適切なものを1つ選びなさい。","options":["Aさんとの話し合いの場に初めから夫に同席してもらった。","Aさんにサービス変更の決断を急ぐように伝えた。","Aさんと話す前に相談内容を夫に話した。","サービスを変更したい理由についてAさんに確認した。","訪問介護員（ホームヘルパー）がサービス変更をすることを判断した。"]},{"id":68,"answer":[1],"subject":8,"explanation":"ユニバーサルデザインは、年齢や障害の有無などにかかわらず、誰もが使いやすい設計です。","sourcePage":35,"question":"すべての人が暮らしやすい社会の実現に向けて，どこでも，だれでも，自由に，使いやすくという考え方を表す用語として，適切なものを1つ選びなさい。","options":["ユニバーサルデザイン（universal design）","インフォームドコンセント（informed consent）","アドバンス・ケア・プランニング（advance care planning）","リビングウィル（living will）","エンパワメント（empowerment）"]},{"id":69,"answer":[4],"subject":8,"explanation":"帰りたいという訴えの背景にある、家を大切にする思いや気がかりを受け止めます。","sourcePage":36,"question":"Bさん（82歳，女性，要介護2）は，若いときに夫を亡くし，家で仕事をしながら子どもを一人で育てた。夫や子どもと過ごした家の手入れは毎日欠かさず行っていた。数年前に，アルツハイマー型認知症（dementia of the Alzheimer’s type）と診断され，認知症対応型共同生活介護（認知症高齢者グループホーム）に入居した。夕方になると，「私，家に帰らないといけない」と介護福祉職に何度も訴えている。Bさんに対する介護福祉職の声かけとして，最も適切なものを1つ選びなさい。","options":["「仕事はないですよ」","「ここが家ですよ」","「外に散歩に行きますか」","「家のことが気になるんですね」","「子どもさんが『ここにいてください』と言っていますよ」"]},{"id":70,"answer":[1],"subject":8,"explanation":"図は聴覚障害者標識です。手話や筆談など、相手が理解しやすい方法で伝えます。","sourcePage":37,"question":"介護保険施設の駐車場で，下記のマークを付けた車の運転手が困った様子で手助けを求めていた。介護福祉職の対応として，最も適切なものを1つ選びなさい。","options":["手話や筆談を用いて話しかける。","杖を用意する。","拡大読書器を使用する。","移動用リフトを用意する。","携帯用点字器を用意する。"],"figure":"data:image/webp;base64,UklGRroTAABXRUJQVlA4IK4TAADQTACdASr1ANcAPh0OhkIhBIpXVAQAcS0t3C6UI35wLW37l4j+NTyr7Vf2T3EtA/Yl/Y+gf8d+zf33+p/uB+bf3z/ou9/4df3PqBfjP8o/w/9m/br81uQd2f/P+gL7N/Yf9l90Hpran3hX/h+4B/L/7N/tfzj+Fv974Jn4f/VftH8AP87/uv/H/zP5e/TJ/V/9//P/mh7Vv0P/H/9v/Kf6D5Bv5T/Xf+R/hva4/+nuF/c72O/2Y/8hOPLN1gMt 6LRABk7oFjhfBYQKg/KTkHiW0cRpT/M2reO/ECkwBqVOQ+ofQ6YPdf8W/ro1T5n7X8q0vYWH0gf05MmA/knNLVcAN6pFmZPkBaukum7Jkg5ZYnraa6Lf997zYLXGmIIAh8vcX9YDmL3lEXNesQMdN8+w2KMXx0ORt8cW5Ge9aQfktxZkx7ST5l92u9ftaseZs7CVo9V5jMltVI7Qqb1NSw9g9JklDGZfyoHJvSRau3BqhsWIJ0PH7Cqy+EcWFJxxO21ii7Ddlp+RX5Wc6PRD+o/e5Nzhqfiwq84WbZ/bYS20MCwufYEMCZWJVRKYOcQ5xc2Do9zmtp5cjYI73wW6MCbkVCdv1rS+oe+slsGqJ+KxPifjWdXJCmjblsbaWFpCCgbKo5V38nqIc50yFjWfbj/m1VTb8NIDAaLfwK1FUHF1LKvkdxkL+eKFAzu7fFdAJmXYMTc3gqxgAAAA"},{"id":71,"answer":[5],"subject":8,"explanation":"施設サービス計画は、介護支援専門員が作成します。","sourcePage":37,"question":"介護保険施設における専門職の役割に関する次の記述のうち，最も適切なものを1つ選びなさい。","options":["利用者の栄養ケア・マネジメントは，薬剤師が行う。","認知症（dementia）の診断と治療は，作業療法士が行う。","利用者の療養上の世話又は診療の補助は，社会福祉士が行う。","日常生活を営むのに必要な身体機能改善や機能訓練は，歯科衛生士が行う。","施設サービス計画の作成は，介護支援専門員が行う。"]},{"id":72,"answer":[2],"subject":8,"explanation":"チームで支援するには、各メンバーの役割を明確にし、情報と目標を共有します。","sourcePage":38,"question":"介護の現場におけるチームアプローチ（team approach）に関する次の記述のうち，最も適切なものを1つ選びなさい。","options":["チームメンバーが得た情報は，メンバー間であっても秘密にする。","チームメンバーの役割分担を明確にする。","利用者を外してチームを構成する。","医師がチームの方針を決定する。","チームメンバーを家族が指名する。"]},{"id":73,"answer":[3],"subject":8,"explanation":"食事中に姿勢が傾くと誤嚥などの危険があるため、姿勢を整えます。","sourcePage":38,"question":"利用者の危険を回避するための介護福祉職の対応として，最も適切なものを1つ選びなさい。","options":["スプーンを拾おうとして前傾姿勢になった車いすの利用者を，目視で確認した。","廊下をふらつきながら歩いていた利用者の横を，黙って通り過ぎた。","食事介助をしていた利用者の姿勢が傾いてきたので，姿勢を直した。","下肢筋力が低下している利用者が，靴下で歩いていたので，スリッパを履いてもらった。","車いすの利用者が，フットサポートを下げたまま立ち上がろうとしたので，またいでもらった。"]},{"id":74,"answer":[1],"subject":9,"explanation":"「はい・いいえ」など、限られた答えで回答できるのが閉じられた質問です。","sourcePage":39,"question":"次のうち，閉じられた質問として，適切なものを1つ選びなさい。","options":["「この本は好きですか」","「午後はどのように過ごしますか」","「困っていることは何ですか」","「どのような歌が好きですか」","「なぜそう思いますか」"]},{"id":75,"answer":[2],"subject":9,"explanation":"家族と丁寧に話し合う機会をもち、相互理解を重ねて信頼関係をつくります。","sourcePage":39,"question":"利用者の家族と信頼関係を形成するための留意点として，最も適切なものを1つ選びなさい。","options":["家族の希望を優先する。","話し合いの機会を丁寧にもつ。","一度形成した信頼関係は，変わらずに継続すると考える。","家族に対して，「こうすれば良い」と指示を出す。","介護は全面的に介護福祉職に任せてもらう。"]},{"id":76,"answer":[1],"subject":9,"explanation":"正面から話すと、声だけでなく口の動きや表情も手がかりにできます。","sourcePage":40,"question":"Cさん（75歳，男性）は，老人性難聴（presbycusis）があり，右耳は中等度難聴，左耳は高度難聴である。耳かけ型補聴器を両耳で使用して静かな場所で話せば，なんとか相手の話を聞き取ることができる。Cさんとの1対1のコミュニケーションの方法として，最も適切なものを1つ選びなさい。","options":["正面で向き合って話しかける。","高音域の声を使って話しかける。","耳元で，できるだけ大きな声で話しかける。","手話で会話をする。","からだに触れてから話しかける。"]},{"id":77,"answer":[3],"subject":9,"explanation":"言葉が少なくても、表情やしぐさを観察して気持ちを理解するように努めます。","sourcePage":40,"question":"Dさん（90歳，女性，要介護5）は，重度のアルツハイマー型認知症（dementia of the Alzheimer’s type）である。介護福祉職は，Dさんに声かけをして会話をしているが，最近，自発的な発語が少なくなり，会話中に視線が合わないことも増えてきたことが気になっている。Dさんとのコミュニケーションをとるための介護福祉職の対応として，最も適切なものを1つ選びなさい。","options":["引き続き，言語を中心にコミュニケーションをとる。","Dさんが緊張しているので，からだに触れないようにする。","表情やしぐさを確認しながら，感情の理解に努める。","視線が合わないときは，会話を控える。","自発的な発語がないため，会話の機会を減らしていく。"]},{"id":78,"answer":[4],"subject":9,"explanation":"申し送りは、勤務者が交代しても必要なケアが継続できるように行います。","sourcePage":41,"question":"介護実践の場で行われる，勤務交代時の申し送りの目的に関する次の記述のうち，最も適切なものを1つ選びなさい。","options":["翌月の介護福祉職の勤務表を検討する。","利用者のレクリエーション活動を計画する。","利用者の問題解決に向けた事例検討を行う。","利用者へのケアの継続性を保つ。","利用者とケアの方針を共有する。"]},{"id":79,"answer":[5],"subject":9,"explanation":"報告では推測と事実を区別します。本人の発言と観察した行動を具体的に伝えます。","sourcePage":41,"question":"Eさん（87歳，女性，要介護3）は，介護老人福祉施設に入所していて，認知症（dementia）がある。ある日，担当のF介護福祉職がEさんの居室を訪問すると，Eさんは，イライラした様子で，「私の財布が盗まれた」と言ってベッドの周りをうろうろしていた。一緒に探すと，タンスの引き出しの奥から財布が見つかった。F介護福祉職は，Eさんのケアカンファレンス（care conference）に出席して，この出来事について情報共有することにした。Eさんの状況に関する報告として，最も適切なものを1つ選びなさい。","options":["「Eさんの認知機能が低下しました」","「Eさんは，誰かに怒っていました」","「Eさんには，もの盗られ妄想があります」","「Eさんは，財布が見つかって，安心していると思います」","「Eさんは，財布が盗まれたと言って，ベッドの周りをうろうろしていました」"]},{"id":80,"answer":[5],"subject":10,"explanation":"本人が希望するおやつ作りを通して、生活の楽しみや意欲につながるように支えます。","sourcePage":42,"question":"Gさん（79歳，女性，要介護3）は，介護老人福祉施設に入所して，3週間が経過した。施設での生活には慣れてきているが，居室でテレビを見て過ごす時間が長くなった。ある時，Gさんが，「気分転換に台所を借りて，自分でおやつを作ってみたい」と介護福祉職に話した。Gさんのレクリエーション活動の計画作成にあたり，介護福祉職が留意すべきこととして，最も適切なものを1つ選びなさい。","options":["Gさんの居室で行うようにする。","おやつのメニューは，介護福祉職が選ぶ。","施設のレクリエーション財を優先する。","集団で行うことを優先する。","おやつ作りをきっかけに，施設生活に楽しみがもてるようにする。"]},{"id":81,"answer":[1],"subject":10,"explanation":"階段の手すりは、からだを支え、転倒を防ぐ助けになります。","sourcePage":42,"question":"高齢者の安全な移動に配慮した階段の要件として，最も適切なものを1つ選びなさい。","options":["手すりを設置している。","階段の一段の高さは，25cm以上である。","階段の足をのせる板の奥行は，15cm未満である。","階段の照明は，足元の間接照明にする。","毛の長いじゅうたんを敷く。"]},{"id":82,"answer":[4],"subject":10,"explanation":"後ろ足のつま先で地面を蹴ると、前へ進む力が生まれ、安定した歩行につながります。","sourcePage":43,"question":"介護予防教室で介護福祉職が行う安定した歩行に関する助言として，最も適切なものを1つ選びなさい。","options":["「歩幅を狭くしましょう」","「腕の振りを小さくしましょう」","「足元を見ながら歩きましょう」","「後ろ足のつま先で地面を蹴って踏み出しましょう」","「つま先から足をつきましょう」"]},{"id":83,"answer":[5],"subject":10,"explanation":"溝をまたいだ後は両足をそろえ、安定した姿勢を確保します。","sourcePage":43,"question":"T字杖を用いて歩行する左片麻痺の利用者が，20cm幅の溝をまたぐときの介護方法として，最も適切なものを1つ選びなさい。","options":["杖は，左手に持ちかえてもらう。","杖は，溝の手前に突いてもらう。","溝は，右足からまたいでもらう。","遠い方向を見てもらう。","またいだ後は，両足をそろえてもらう。"]},{"id":84,"answer":[2],"subject":10,"explanation":"義歯は毎食後に洗い、食べかすや汚れを取り除きます。","sourcePage":43,"question":"総義歯の取扱いに関する次の記述のうち，最も適切なものを1つ選びなさい。","options":["上顎から先に外す。","毎食後に洗う。","スポンジブラシで洗う。","熱湯につけてから洗う。","乾燥させて保管する。"]},{"id":85,"answer":[5],"subject":10,"explanation":"赤みや熱感があり炎症が疑われるため、切らずに報告し、医療職への相談につなげます。","sourcePage":44,"question":"Hさん（82歳，男性，要介護2）は，一人暮らしで，週1回，訪問介護（ホームヘルプサービス）を利用している。訪問時に，「足の爪が伸びているので，切ってほしい」と依頼された。爪を切ろうとしたところ，両足とも親指の爪が伸びて両端が皮膚に食い込んで赤くなっていて，触ると熱感があった。親指の状態を確認した訪問介護員（ホームヘルパー）の対応として，最も適切なものを1つ選びなさい。","options":["親指に絆創膏を巻く。","Hさんの家にある軟膏を親指に塗る。","蒸しタオルで爪を軟らかくしてから切る。","爪が伸びている部分に爪やすりをかける。","爪は切らずに，親指の状態をサービス提供責任者に報告する。"]},{"id":86,"answer":[3],"subject":10,"explanation":"脱ぐときは健側から、着るときは患側からが基本です。麻痺側の袖口を広げ、腕を抜きやすくします。","sourcePage":44,"question":"左片麻痺の利用者が，前開きの上着をベッド上で臥床したまま交換するときの介護の基本に関する次の記述のうち，最も適切なものを1つ選びなさい。","options":["介護福祉職は利用者の左側に立つ。","新しい上着は利用者の右側に置く。","脱ぐときは，着ている上着の左上肢の肩口を広げておく。","左側の袖を脱ぎ，脱いだ上着は丸めて，からだの下に入れる。","利用者を左側臥位にし，脱いだ上着を引き出す。"]},{"id":87,"answer":[5],"subject":10,"explanation":"むせたときは、咳で異物を出せるようにします。無理に飲み物を飲ませません。","sourcePage":45,"question":"利用者が食事中にむせ込んだときの介護として，最も適切なものを1つ選びなさい。","options":["上を向いてもらう。","お茶を飲んでもらう。","深呼吸をしてもらう。","口の中のものを飲み込んでもらう。","しっかりと咳を続けてもらう。"]},{"id":88,"answer":[1],"subject":10,"explanation":"足を床につけると座位が安定し、安全に食べやすくなります。","sourcePage":45,"question":"テーブルで食事の介護を行うときの留意点に関する次の記述のうち，最も適切なものを1つ選びなさい。","options":["車いすで食事をするときは，足をフットサポートから下ろして床につける。","片麻痺があるときは，患側の上肢を膝の上にのせる。","スプーンを使うときは，下顎を上げた姿勢にして食べ物を口に入れる。","利用者に声をかけるときは，食べ物を口に入れてから行う。","食事をしているときは，大きな音でテレビをつけておく。"]},{"id":89,"answer":[3],"subject":10,"explanation":"一度に多く食べると胃の圧が高まります。少量ずつ分けて食べると逆流を減らせます。","sourcePage":45,"question":"逆流性食道炎（reflux esophagitis）の症状がある利用者への助言として，最も適切なものを1つ選びなさい。","options":["脂肪を多く含む食品を食べるように勧める。","酸味の強い果物を食べるように勧める。","1日の食事は回数を分けて少量ずつ食べるように勧める。","食事のときは，腹圧をかけるような前かがみの姿勢をとるように勧める。","食後すぐに仰臥位（背臥位）をとるように勧める。"]},{"id":90,"answer":[4],"subject":10,"explanation":"シャンプーの泡をタオルで取ってからすすぐと、使う湯量を減らしやすくなります。","sourcePage":46,"question":"ベッド上で臥床している利用者の洗髪の基本に関する次の記述のうち，最も適切なものを1つ選びなさい。","options":["利用者のからだ全体をベッドの端に移動する。","利用者の両下肢は，まっすぐに伸ばした状態にする。","洗うときは，頭頂部から生え際に向かって洗う。","シャンプー後は，タオルで泡を拭き取ってからすすぐ。","ドライヤーの温風は，頭皮に直接当たるようにする。"]},{"id":91,"answer":[1],"subject":10,"explanation":"目の周囲は、目頭から目尻へ向かって優しく拭きます。図Ａが該当します。","sourcePage":47,"question":"目の周囲の清拭の方法を図に示す。矢印は拭く方向を表している。\n次のA～Eのうち，基本的な清拭の方法として，最も適切なものを1つ選びなさい。","options":["A","B","C","D","E"],"figure":"data:image/webp;base64,UklGRpCJAABXRUJQVlA4IISJAABQ6QGdASpmA9UCPh0OhkIhBFZdMwQAcS0t34ZLOR1qGf/LP91/me3b+3/3n9lf8Z6h/jHzH9S/s367/2X/xf6z4+v5/++fuB6busP+H/oPUX+MfXr7X/ev8f/qv7l/9P9p91P6n/Qfkj/b/2o9r/ix/IflV/mP2K+wX8R/kf9g/tf7F/3f/6f6P3hf9bult3/2X+y/yX7jfAL6lfN/79/dv8v/qP7r+5v1HfV/6383fdz7G/7P/D/u//mPsA/kP9B/xP95/xf+k/vX/8/2P3R/uP/F/mPKg+0f6b/vf5z8yPsB/kf9Q/0v+J/zv+9/u3/9/5P4z/0P+2/w3+n/9H+K////v+Kf53/ev9v/kv9B/2P8X//v+9+gX8c/nn+T/uP+R/4v+C//v/d+8P/s+3/9qv/H7mX6v/7783f3///4yu8328AJIUwAEkKYACSFMABJCmAAkhTAASQpTOl01nk+88328AJIUlt3opbMr1oS0LZVWKFsqUgf7iZ0fvPN9vACSFJnu9JTmvdJUvwVXbup0Xh/Ao7wyqIFMAA6V6uukL1Bw487WfFSjwsv3+AxoVKqxLMJPM9TuWIxoIuIvmNiQy9EMlbLd8KYACQrJC4kKFf/oCe/gXOjRMeCUt+mJqG1qSAa13ubFrQpf7q23JxD5mkgDcITDciJobpY1Jn+qLCngBD84IvqxQr9mnMc/ox/7hhf/EorbFF1Vtb7 聞く。","積極的に趣味活動に参加するように勧める。"]},{"id":97,"answer":[3],"subject":10,"explanation":"嘔吐物の処理ではマスクや手袋などを着用し、飛散や手指からの感染を防ぎます。","sourcePage":50,"question":"ノロウイルス（Norovirus）による感染症の予防のための介護福祉職の対応として，最も適切なものを1つ選びなさい。","options":["食品は，中心部温度50℃で1分間加熱する。","嘔吐物は，乾燥後に処理をする。","マスクと手袋を着用して，嘔吐物を処理する。","手すりの消毒は，エタノール消毒液を使用する。","嘔吐物のついたシーツは，洗濯機で水洗いする。"]},{"id":98,"answer":[5],"subject":10,"explanation":"調理器具の置き場所を決めておくと、見えにくくても探しやすく、安全に使えます。","sourcePage":51,"question":"弱視で物の区別がつきにくい人の調理と買い物の支援に関する次の記述のうち，最も適切なものを1つ選びなさい。","options":["買い物は，ガイドヘルパーに任せるように勧める。","財布は，貨幣や紙幣を同じ場所に収納できるものを勧める。","包丁は，調理台の手前に置くように勧める。","まな板は，食材と同じ色にするように勧める。","よく使う調理器具は，いつも同じ場所に収納するように勧める。"]},{"id":99,"answer":[3],"subject":10,"explanation":"手掌基部を使うと、指の小さな関節への負担を減らしながら拭くことができます。","sourcePage":51,"question":"次の記述のうち，関節リウマチ（rheumatoid arthritis）のある人が，少ない負担で家事をするための介護福祉職の助言として，最も適切なものを1つ選びなさい。","options":["部屋の掃除をするときは，早朝に行うように勧める。","食器を洗うときは，水を使うように勧める。","テーブルを拭くときは，手掌基部を使うように勧める。","瓶のふたを開けるときは，指先を使うように勧める。","洗濯かごを運ぶときは，片手で持つように勧める。"]},{"id":100,"answer":[4],"subject":10,"explanation":"寝室の換気を行い、空気やにおいを整えると、心地よく眠る環境につながります。","sourcePage":51,"question":"睡眠の環境を整える介護に関する次の記述のうち，最も適切なものを1つ選びなさい。","options":["マットレスは，腰が深く沈む柔らかさのものにする。","枕は，頸部が前屈する高さにする。","寝床内の温度を20℃に調整する。","臭気がこもらないように，寝室の換気をする。","睡眠状態を観察できるように，寝室のドアは開けておく。"]},{"id":101,"answer":[1],"subject":10,"explanation":"足を温めるとリラックスしやすく、寝つきを助けます。","sourcePage":52,"question":"利用者の入眠に向けた介護福祉職の助言として，最も適切なものを1つ選びなさい。","options":["「足をお湯につけて温めてから寝ましょう」","「寝室の照明を，昼光色の蛍光灯に変えましょう」","「布団に入ってから，短く浅い呼吸を繰り返しましょう」","「入眠への習慣は控えましょう」","「寝る前に，汗をかく運動をしましょう」"]},{"id":102,"answer":[2],"subject":10,"explanation":"息苦しいときは上半身を起こした半座位にすると、呼吸しやすくなります。","sourcePage":52,"question":"終末期で終日臥床している利用者に対する介護福祉職の対応として，最も適切なものを1つ選びなさい。","options":["入浴時は，肩までお湯につかるように勧める。","息苦しさを訴えたときは，半座位にする。","終日，窓を閉めたままにする。","会話をしないように勧める。","排便時は，息を止めて腹に力を入れるように勧める。"]},{"id":103,"answer":[5],"subject":10,"explanation":"後悔や悲しみを否定せず、家族が話したい気持ちを丁寧に聴きます。","sourcePage":52,"question":"介護老人福祉施設に入所している利用者の看取りにおける，介護福祉職による家族への支援として，最も適切なものを1つ選びなさい。","options":["利用者の介護は，介護福祉職が最期まで行い，家族には控えてもらう。","利用者の反応がないときには，声をかけることを控えるように伝える。","利用者の死後は，毎日電話をして，家族の状況を確認する。","利用者の死後は，気分を切り替えるように家族を励ます。","家族が悔いが残ると言ったときは，話を聴く。"]},{"id":104,"answer":[2],"subject":10,"explanation":"音声案内付きの電磁調理器は、表示が見えない人が操作や状態を確認する助けになります。","sourcePage":53,"question":"利用者の障害特性に適した福祉用具の選択に関する次の記述のうち，最も適切なものを1つ選びなさい。","options":["言語機能障害の利用者には，ストッキングエイドの使用を勧める。","全盲の利用者には，音声ガイド付き電磁調理器の使用を勧める。","聴覚障害の利用者には，床置き式手すりの使用を勧める。","右片麻痺の利用者には，交互型歩行器の使用を勧める。","肘関節拘縮の利用者には，座位時に体圧分散クッションの使用を勧める。"]},{"id":105,"answer":[1],"subject":10,"explanation":"車いすをたたむときは、動かないようにブレーキをかけ、安全を確保します。","sourcePage":53,"question":"福祉用具等を安全に使用するための方法として，最も適切なものを1つ選びなさい。","options":["車いすをたたむときは，ブレーキをかけてから行う。","入浴用介助ベルトは，利用者の腰部を真上に持ち上げて使用する。","差し込み便器は，端座位で使用する。","移動用リフトで吊り上げるときは，利用者のからだから手を離して行う。","簡易スロープは，埋め込み工事をして使用する。"]},{"id":106,"answer":[5],"subject":11,"explanation":"介護過程は、情報を整理し、根拠に基づいた個別の介護を実践するために展開します。","sourcePage":54,"question":"介護過程を展開する目的として，最も適切なものを1つ選びなさい。","options":["業務効率を優先する。","医師と連携する。","ケアプランを作成する。","画一的な介護を実現する。","根拠のある介護を実践する。"]},{"id":107,"answer":[5],"subject":11,"explanation":"評価では、設定した短期目標がどの程度達成できたかを優先して確認します。","sourcePage":54,"question":"次のうち，介護過程を展開した結果を評価する項目として，最も優先すべきものを1つ選びなさい。","options":["実施に要した日数","情報収集に要した時間","評価に要した時間","介護福祉職チームの満足度","短期目標の達成度"]},{"id":108,"answer":[4],"subject":11,"explanation":"訪問介護計画は、居宅サービス計画の方針に沿って、具体的な支援内容を定めます。","sourcePage":54,"question":"次の記述のうち，居宅サービス計画と訪問介護計画の関係として，最も適切なものを1つ選びなさい。","options":["訪問介護計画を根拠に，居宅サービス計画を作成する。","居宅サービス計画の目標が変更されても，訪問介護計画は見直しをせず継続する。","居宅サービス計画と同じ内容を，訪問介護計画に転記する。","居宅サービス計画の方針に沿って，訪問介護計画を作成する。","訪問介護計画の終了後に，居宅サービス計画を作成する。"]},{"id":109,"answer":[2],"subject":11,"explanation":"「ここはどこ」という発言から、自分のいる場所がわからず、不安になったと考えられます。","sourcePage":56,"question":"Lさんが急に立ち止まった行動の解釈として，最も適切なものを1つ選びなさい。\n\n〔事例〕\nLさん（76歳，女性，要介護1）は，自宅で娘と暮らしている。軽度の認知症（dementia）と診断されたが，身体機能に問題はなく，友人との外出を楽しんでいる。ある日，外食の後，自宅近くで保護されたとき，「ここはどこなの」と言った。その後，自宅から出ようとしなくなった。心配した娘が本人と相談して，小規模多機能型居宅介護を利用することになった。\n利用開始時に，Lさんの短期目標を，「外出を楽しめる」と設定した。2週間が過ぎた頃，Lさんから，近くのスーパーへの買い物ツアーに参加したいと申し出があった。当日，他の利用者や介護福祉職と笑顔で買い物をする様子が見られた。買い物が終わり，歩いて戻り始めると，笑顔が消え，急に立ち止まった。\n介護福祉職が声をかけると，「ここはどこなの。どこに行くの」と不安そうに言った。","options":["買い物ツアー時間の延長の要求","自分のいる場所がわからない不安","休憩したいという訴え","店での介護福祉職の支援に対する不満","一人で帰りたいという訴え"]},{"id":110,"answer":[1],"subject":11,"explanation":"外出を楽しむために、帰れなくなる不安への対応を優先して検討します。","sourcePage":56,"question":"Lさんの状況から，短期目標と支援内容を見直すためのカンファレンス（conference）が開かれた。担当する介護福祉職の提案として，最も優先すべきものを1つ選びなさい。\n\n〔事例〕\nLさん（76歳，女性，要介護1）は，自宅で娘と暮らしている。軽度の認知症（dementia）と診断されたが，身体機能に問題はなく，友人との外出を楽しんでいる。ある日，外食の後，自宅近くで保護されたとき，「ここはどこなの」と言った。その後，自宅から出ようとしなくなった。心配した娘が本人と相談して，小規模多機能型居宅介護を利用することになった。\n利用開始時に，Lさんの短期目標を，「外出を楽しめる」と設定した。2週間が過ぎた頃，Lさんから，近くのスーパーへの買い物ツアーに参加したいと申し出があった。当日，他の利用者や介護福祉職と笑顔で買い物をする様子が見られた。買い物が終わり，歩いて戻り始めると，笑顔が消え，急に立ち止まった。\n介護福祉職が声をかけると，「ここはどこなの。どこに行くの」と不安そうに言った。","options":["外出先から帰れなくなる不安への対応が必要である。","表情がかたくなったときは帰り道を変更する。","外出する意欲を持つ必要がある。","歩くために身体機能の改善が必要である。","事業所をなじみの生活空間にする。"]},{"id":111,"answer":[3],"subject":11,"explanation":"個別支援計画は、競技をやってみたいという本人の意向を具体的に確認して立てます。","sourcePage":58,"question":"次のうち，Mさんの発言から，個別支援計画を立案するために，介護福祉職が把握すべき情報として，最も優先すべきものを1つ選びなさい。\n\n〔事例〕\nMさん（35歳，男性，障害支援区分5）は，脳性麻痺（cerebral palsy）による四肢麻痺で筋緊張がある。日常生活動作は全般に介護が必要であり，電動車いすを使用している。これまで，本人と母親（70歳）の希望で，自宅で二人暮らしを続けてきた。Mさんは3年前から，重度訪問介護を利用している。軽度の知的障害があるが，自分の意思を介護者と母親に伝えることができる。相談支援専門員が作成したサービス等利用計画の総合目標は，「やりたいことに挑戦し，生活を充実させる」となっている。Mさん自身も，やりたいことを見つけたいと介護福祉職に話していたことから，次の個別支援会議で検討する予定になっていた。\nある日，重度訪問介護の利用時，パラリンピックのテレビ中継を見ていたMさんが，介護福祉職に，「ボール投げるの，おもしろそう」と話した。","options":["競技で使われるボールの種類","話を聞いた介護福祉職の感想","競技に対するMさんの意向","母親のパラリンピックへの関心","テレビ中継を見ていた時間"]},{"id":112,"answer":[4],"subject":11,"explanation":"体験の方法など必要な情報を伝え、本人が納得して選べるようにします。","sourcePage":58,"question":"いくつかのスポーツクラブを見学後，介護福祉職はMさんから，「このスポーツクラブが近いから，入会前に体験したい」と伝えられた。Mさんへの介護福祉職の対応に関する次の記述のうち，最も適切なものを1つ選びなさい。\n\n〔事例〕\nMさん（35歳，男性，障害支援区分5）は，脳性麻痺（cerebral palsy）による四肢麻痺で筋緊張がある。日常生活動作は全般に介護が必要であり，電動車いすを使用している。これまで，本人と母親（70歳）の希望で，自宅で二人暮らしを続けてきた。Mさんは3年前から，重度訪問介護を利用している。軽度の知的障害があるが，自分の意思を介護者と母親に伝えることができる。相談支援専門員が作成したサービス等利用計画の総合目標は，「やりたいことに挑戦し，生活を充実させる」となっている。Mさん自身も，やりたいことを見つけたいと介護福祉職に話していたことから，次の個別支援会議で検討する予定になっていた。\nある日，重度訪問介護の利用時，パラリンピックのテレビ中継を見ていたMさんが，介護福祉職に，「ボール投げるの，おもしろそう」と話した。","options":["筋緊張から回復する訓練を行うように伝える。","母親が決めたスポーツクラブを選ぶように勧める。","スポーツクラブにすぐに入会するように勧める。","意思決定に必要な情報を提供する。","相談支援専門員の許可を得るように勧める。"]},{"id":113,"answer":[3],"subject":11,"explanation":"事例研究は、介護過程と実践を振り返り、支援の意味や改善点を明らかにするために行います。","sourcePage":58,"question":"介護福祉職が事例研究を行う目的として，最も適切なものを1つ選びなさい。","options":["事業所の介護の理念の確認","介護福祉職の能力を調べること","介護過程から介護実践を振り返ること","介護報酬の獲得","介護福祉職自身の満足度の充足"]},{"id":114,"answer":[4],"subject":12,"explanation":"アルツハイマー型認知症では、記憶に関係する海馬などが萎縮します。図Ｄが該当します。","sourcePage":60,"question":"図は脳を模式的に示したものである。\nAさんの脳に萎縮が顕著にみられる部位として，最も適切なものを1つ選びなさい。\n\n〔事例〕\nAさん（80歳，女性）は，自宅で一人暮らしをしている。同じ県内に住む娘が，月に一度Aさんの自宅を訪れている。\n最近，Aさんの物忘れが多くなってきたため，不安になった娘が，Aさんと一緒に病院を受診したところ，医師から，脳の記憶をつかさどる部分が顕著に萎縮したアルツハイマー型認知症（dementia of the Alzheimer’s type）であると診断された。Aさんはこのまま自宅で暮らすことを希望し，介護保険の訪問介護（ホームヘルプサービス）を利用しながら一人暮らしを継続することになった。\nある日，娘からサービス提供責任者に，今年はAさんが一人で雪かきができるか不安であると相談があった。そこで，サービス提供責任者が，Aさんと一緒に地区の民生委員に相談したところ，近所の人たちが雪かきをしてくれることになった。","options":["A","B","C","D","E"],"figure":"data:image/webp;base64,UklGRuB/AABXRUJQVlA4INR/AAAwYAGdASowAuUBPh0OhUIhBG7TSwQAcS0t3C7WI35rvrD+8elvxk+rf3v9bP71/0/XX8W+U/oX9z/Vn+z/6z/PfIl/D/lp6c+t/9p/mP3O9xP4t9a/p39w/y39+/sv/d/1v3T/qf7r+L/90/Zr25+Pn7n+QP9u/7H/C+wL8O/iX9D/sv+K/uH9w/6X+i+xD5f/S/4f9n/7J5YVtv9d+V3wC+oPyf+tf3L/L/4H+8f+P/VfXH9l/lPyj94/s3/qvxz+gH+N/zH+7f3T9lP79/4/9J9vf8f/s+KZ91/0n/p/zvwAfyb+nf5f+//5v/bf4T/8fbF/K/6X/C/4n/k/5X/+/+P4p/nP9z/1f+C/0v/O/wX/+/5/6Bfxr+Yf3r+0f5T/V/3f/9f777tf/B7a/2q/+Pua/rT/2Pz9IpvgIiRPZN8BESJ7JvgIiRPZN8BESJ7JvgIiRPVapCS8silPbSqzPOitk3wERInsm+AiIzPUqKsYREZo1p2WedFbJvgIiRPZN8BESJ7ImQOloGc16vbC1/RWyb4CIkT2TfAREiM70yXYb4q0IrPvDt9UDw/7PFbJvgIiRPZN8BCmjgSghXvTpUJLM9LKx00Od6vjv5uvad06OcFlAGSp8zC7WhbT2+kf5z2FKO342dJJmOJpEM5cYyfwQULEFShFV+SkkM1tb9+gBhUmQmrM86K2TfAREics1zsefhKB9nc0BClVeGiP4zZdi9ighxRAbM4dPukxZj30tPMg9hoOm ）を利用しながら一人暮らしを継続することになった。\nある日，娘からサービス提供責任者に，今年はAさんが一人で雪かきができるか不安であると相談があった。そこで，サービス提供責任者が，Aさんと一緒に地区の民生委員に相談したところ，近所の人たちが雪かきをしてくれることになった。","options":["一包化を中止する。","インフォーマルな社会資源の活用は避ける。","お薬カレンダーの使用を提案する。","一人では薬を服用しないように伝える。","薬の飲み忘れに気がついたとき，2回分を服用するように伝える。"]},{"id":117,"answer":[2],"subject":12,"explanation":"麻痺のある右側のやや後方に立ち、ふらついたときに支えられるようにします。","sourcePage":63,"question":"入所から2か月が経過した。C介護福祉士は，Bさんの四点杖歩行の様子を観察したところ，左立脚相と比べて，右立脚相が短いことが気になった。Bさんの短期目標を達成するために，理学療法士と相談して，転倒予防の観点から，見守り歩行をするときの介護福祉職の位置について，改めて周知することにした。Bさんの四点杖歩行を見守るときに介護福祉職が立つ位置として，最も適切なものを1つ選びなさい。\n\n〔事例〕\nBさん（75歳，男性，要介護3）は，1年前に脳梗塞（cerebral infarction）を発症し，右片麻痺がある。自宅では，家具や手すりにつかまって，なんとか自力歩行し，外出時は車いすを使用していた。うまく話すことができないこともあるが，他者の話を聞き取って理解することは，問題なくできていて，介護保険サービスを利用しながら，一人で暮らしていた。数か月前から着替えや入浴に介助が必要になり，在宅生活が難しくなったため，1週間前にU介護老人福祉施設に入所した。\n入所時の面談でBさんは，自分の力で歩きたいという意思を示した。U介護老人福祉施設では，C介護福祉士をBさんの担当者に選定した。C介護福祉士は，カンファレンス（conference）での意見に基づいて，Bさんが，四点杖を使用して，安全に施設内を歩行できることを短期目標とした介護計画を立案した。","options":["Bさんの右側前方","Bさんの右側後方","Bさんの真後ろ","Bさんの左側前方","Bさんの左側後方"]},{"id":118,"answer":[5],"subject":12,"explanation":"話を理解できても言葉にしにくいため、「はい・いいえ」で答えられる質問が役立ちます。","sourcePage":63,"question":"C介護福祉士がBさんとコミュニケーションをとるための方法に関する次の記述のうち，最も適切なものを1つ選びなさい。\n\n〔事例〕\nBさん（75歳，男性，要介護3）は，1年前に脳梗塞（cerebral infarction）を発症し，右片麻痺がある。自宅では，家具や手すりにつかまって，なんとか自力歩行し，外出時は車いすを使用していた。うまく話すことができないこともあるが，他者の話を聞き取って理解することは，問題なくできていて，介護保険サービスを利用しながら，一人で暮らしていた。数か月前から着替えや入浴に介助が必要になり，在宅生活が難しくなったため，1週間前にU介護老人福祉施設に入所した。\n入所時の面談でBさんは，自分の力で歩きたいという意思を示した。U介護老人福祉施設では，C介護福祉士をBさんの担当者に選定した。C介護福祉士は，カンファレンス（conference）での意見に基づいて，Bさんが，四点杖を使用して，安全に施設内を歩行できることを短期目標とした介護計画を立案した。","options":["補聴器を使用する。","五十音表を使用する。","手話を使う。","大きな声で話しかける。","「はい」「いいえ」で回答できる質問を中心に用いる。"]},{"id":119,"answer":[1],"subject":12,"explanation":"一人で歩きたい希望に合わせ、生活の中で安全に歩く機会を増やします。","sourcePage":64,"question":"入所から3か月後，C介護福祉士は，Bさんの四点杖歩行が安定してきたことを確認して介護計画を見直すことにした。C介護福祉士がBさんに，今後の生活について確認したところ，居室から食堂まで，四点杖で一人で歩けるようになりたいと思っていることがわかった。Bさんの現在の希望に沿って介護計画を見直すときに，最も優先すべきものを1つ選びなさい。\n\n〔事例〕\nBさん（75歳，男性，要介護3）は，1年前に脳梗塞（cerebral infarction）を発症し，右片麻痺がある。自宅では，家具や手すりにつかまって，なんとか自力歩行し，外出時は車いすを使用していた。うまく話すことができないこともあるが，他者の話を聞き取って理解することは，問題なくできていて，介護保険サービスを利用しながら，一人で暮らしていた。数か月前から着替えや入浴に介助が必要になり，在宅生活が難しくなったため，1週間前にU介護老人福祉施設に入所した。\n入所時の面談でBさんは，自分の力で歩きたいという意思を示した。U介護老人福祉施設では，C介護福祉士をBさんの担当者に選定した。C介護福祉士は，カンファレンス（conference）での意見に基づいて，Bさんが，四点杖を使用して，安全に施設内を歩行できることを短期目標とした介護計画を立案した。","options":["生活場面の中で歩行する機会を増やす。","評価日は設定しない。","ほかの利用者と一緒に実施できる内容にする。","他者との交流を目標にする。","歩行練習を行う時間は，出勤している職員が決めるようにする。"]},{"id":120,"answer":[3],"subject":12,"explanation":"服の向きや着る手順がわからず、着替えがうまくできない状態は着衣失行です。","sourcePage":65,"question":"Dさんにみられた失行として，適切なものを1つ選びなさい。\n\n〔事例〕\nDさん（38歳，男性，障害支援区分3）は，1年前に脳梗塞（cerebral infarction）を発症し左片麻痺となった。後遺症として左同名半盲，失行もみられる。現在は週3回，居宅介護を利用しながら妻と二人で生活している。\nある日，上着の袖に頭を入れようとしているDさんに介護福祉職が声をかけると，「どうすればよいかわからない」と答えた。普段は妻がDさんの着替えを手伝っている。食事はスプーンを使用して自分で食べるが，左側にある食べ物を残すことがある。Dさんは，「左側が見づらい。動いているものにもすぐに反応ができない」と話した。\n最近は，日常生活の中で，少しずつできることが増えてきた。Dさんは，「人と交流する機会を増やしたい。また，簡単な生産活動ができるようなところに行きたい」と介護福祉職に相談した。","options":["構成失行","観念失行","着衣失行","顔面失行","観念運動失行"]},{"id":121,"answer":[5],"subject":12,"explanation":"左側が見えにくいため、見やすい右側に食事を配置して食べやすくします。","sourcePage":66,"question":"Dさんへの食事の支援に関する次の記述のうち，最も適切なものを1つ選びなさい。\n\n〔事例〕\nDさん（38歳，男性，障害支援区分3）は，1年前に脳梗塞（cerebral infarction）を発症し左片麻痺となった。後遺症として左同名半盲，失行もみられる。現在は週3回，居宅介護を利用しながら妻と二人で生活している。\nある日，上着の袖に頭を入れようとしているDさんに介護福祉職が声をかけると，「どうすればよいかわからない」と答えた。普段は妻がDさんの着替えを手伝っている。食事はスプーンを使用して自分で食べるが，左側にある食べ物を残すことがある。Dさんは，「左側が見づらい。動いているものにもすぐに反応ができない」と話した。\n最近は，日常生活の中で，少しずつできることが増えてきた。Dさんは，「人と交流する機会を増やしたい。また，簡単な生産活動ができるようなところに行きたい」と介護福祉職に相談した。","options":["食事の量を少なくする。","テーブルを高くする。","スプーンを持つ手を介助する。","バネつき箸に替える。","食事を本人から見て右寄りに配膳する。"]},{"id":122,"answer":[2],"subject":12,"explanation":"地域活動支援センターでは、創作や生産活動の機会、社会との交流などを支援します。","sourcePage":66,"question":"介護福祉職は，Dさんに生産活動ができるサービスの利用を提案したいと考えている。次のうち，Dさんの発言内容に合う障害福祉サービスとして，最も適切なものを1つ選びなさい。\n\n〔事例〕\nDさん（38歳，男性，障害支援区分3）は，1年前に脳梗塞（cerebral infarction）を発症し左片麻痺となった。後遺症として左同名半盲，失行もみられる。現在は週3回，居宅介護を利用しながら妻と二人で生活している。\nある日，上着の袖に頭を入れようとしているDさんに介護福祉職が声をかけると，「どうすればよいかわからない」と答えた。普段は妻がDさんの着替えを手伝っている。食事はスプーンを使用して自分で食べるが，左側にある食べ物を残すことがある。Dさんは，「左側が見づらい。動いているものにもすぐに反応ができない」と話した。\n最近は，日常生活の中で，少しずつできることが増えてきた。Dさんは，「人と交流する機会を増やしたい。また，簡単な生産活動ができるようなところに行きたい」と介護福祉職に相談した。","options":["就労継続支援A型での活動","地域活動支援センターの利用","療養介護","就労定着支援","相談支援事業の利用"]},{"id":123,"answer":[2],"subject":12,"explanation":"決めた予定や規則を守って続けられることは、本人の強みとして生かせます。","sourcePage":67,"question":"Eさんのストレングス（strength）に関する次の記述のうち，最も適切なものを1つ選びなさい。\n\n〔事例〕\nEさん（35歳，男性）は，自閉症スペクトラム障害（autism spectrum disorder）があり，V障害者支援施設の生活介護と施設入所支援を利用している。Eさんは，毎日のスケジュールを決め，規則や時間を守ってプログラムに参加しているが，周りの人や物事に関心が向かず，予定外の行動や集団行動はとりづらい。コミュニケーションは，話すよりも絵や文字を示したほうが伝わりやすい。\nEさんが利用するV障害者支援施設では，就労継続支援事業も行っている。災害が起こったときに様々な配慮が必要な利用者がいるため，施設として防災対策に力を入れている。また，通所している利用者も多いので，V障害者支援施設は市の福祉避難所として指定を受けている。","options":["行動力があり，すぐに動く。","自分で決めたことを継続する。","新しいことを思いつく。","コミュニケーション力が高い。","いろいろなことに興味がもてる。"]},{"id":124,"answer":[1],"subject":12,"explanation":"絵や文字のほうが伝わりやすい特性に合わせ、災害時に使うイラストを準備します。","sourcePage":68,"question":"V障害者支援施設では定期的に災害に備えた避難訓練を行っている。Eさんの特性を考慮して実施する避難訓練に関する次の記述のうち，最も適切なものを1つ選びなさい。\n\n〔事例〕\nEさん（35歳，男性）は，自閉症スペクトラム障害（autism spectrum disorder）があり，V障害者支援施設の生活介護と施設入所支援を利用している。Eさんは，毎日のスケジュールを決め，規則や時間を守ってプログラムに参加しているが，周りの人や物事に関心が向かず，予定外の行動や集団行動はとりづらい。コミュニケーションは，話すよりも絵や文字を示したほうが伝わりやすい。\nEさんが利用するV障害者支援施設では，就労継続支援事業も行っている。災害が起こったときに様々な配慮が必要な利用者がいるため，施設として防災対策に力を入れている。また，通所している利用者も多いので，V障害者支援施設は市の福祉避難所として指定を受けている。","options":["災害時に使用する意思伝達のイラストを用意する。","避難生活を想定して，食事等の日課を集団で行えるようにする。","予告せずに避難訓練を行う。","Eさんの避難訓練は単独で行う。","避難を援助する人によってEさんへの対応を変える。"]},{"id":125,"answer":[1],"subject":12,"explanation":"福祉避難所として、受け入れる対象者や必要な支援を事前に把握しておきます。","sourcePage":68,"question":"V障害者支援施設が，災害発生に備えて取り組む活動として，最も適切なものを1つ選びなさい。\n\n〔事例〕\nEさん（35歳，男性）は，自閉症スペクトラム障害（autism spectrum disorder）があり，V障害者支援施設の生活介護と施設入所支援を利用している。Eさんは，毎日のスケジュールを決め，規則や時間を守ってプログラムに参加しているが，周りの人や物事に関心が向かず，予定外の行動や集団行動はとりづらい。コミュニケーションは，話すよりも絵や文字を示したほうが伝わりやすい。\nEさんが利用するV障害者支援施設では，就労継続支援事業も行っている。災害が起こったときに様々な配慮が必要な利用者がいるため，施設として防災対策に力を入れている。また，通所している利用者も多いので，V障害者支援施設は市の福祉避難所として指定を受けている。","options":["事前に受け入れ対象者を確認しておく。","災害派遣医療チーム（DMAT）と支援人員確保契約を結ぶ。","職員の役割分担は，状況に応じてその場で決める。","要配慮者のサービス等利用計画を作成する。","要配慮者に自分で避難するように促す。"]}], SUBJECTS=["人間の尊厳と自立", "人間関係とコミュニケーション", "社会の理解", "こころとからだのしくみ", "発達と老化の理解", "認知症の理解", "障害の理解", "医療的ケア", "介護の基本", "コミュニケーション技術", "生活支援技術", "介護過程", "総合問題"];

for(const [id,v] of Object.entries(results)){if(!QUESTIONS[id-1]||!v||!Array.isArray(v.selected)){delete results[id]}}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const equal=(a,b)=>a.length===b.length&&[...a].sort().every((v,i)=>v===[...b].sort()[i]);

function nav(){const pos=order.indexOf(index);$('#prev').disabled=pos<=0;$('#next').disabled=pos<0||pos===order.length-1;$('#listcount').textContent=`(${order.length}問)`;$('#grid').innerHTML=[...new Set(QUESTIONS.map(q=>q.subject))].map(subjectId=>{const ids=order.filter(id=>QUESTIONS[id-1].subject===subjectId).sort((a,b)=>a-b);if(!ids.length)return '';return `<section class="subject-group"><h3 class="subject-title">${subjectId+1} ${esc(SUBJECTS[subjectId])}</h3><p class="subject-range">問題 ${ids[0]}${ids.length>1?'〜'+ids[ids.length-1]:''} · ${ids.length}問</p><div class="subject-numbers">`+ids.map(id=>`<button data-id="${id}" class="${results[id]?(correct(id)?'done':'miss'):''} ${index===id?'current':''} ${marks[id]?'flag':''}" aria-label="問題${id}${results[id]?(correct(id)?' 正解':' 不正解'):' 未回答'}${marks[id]?' あとで復習':''}" ${index===id?'aria-current="true"':''}>${id}<\/button>`).join('')+'</div></section>';}).join('');}
function render(){save();stats();nav();root.querySelectorAll('[data-mode]').forEach(b=>{b.classList.toggle('active',b.dataset.mode===mode);b.setAttribute('aria-pressed',String(b.dataset.mode===mode))});const q=QUESTIONS[index-1];if(!q||!order.includes(index)){$('#card').innerHTML='<div class="empty"><h2>この範囲の問題はありません<\/h2><p>科目や出題範囲を変更して、学習を続けましょう。<\/p><button id="showall" class="primary">全問に戻る<\/button><\/div>';$('#showall').onclick=()=>{subject='all';mode='all';rebuild()};return}

rt><\/ruby>」のことである。","電磁的記録は，個人情報には含まれない。":"<ruby>電磁的<rt>でんじてき<\/rt><\/ruby><ruby>記録<rt>きろく<\/rt><\/ruby>は，<ruby>個人<rt>こじん<\/rt><\/ruby><ruby>情報<rt>じょうほう<\/rt><\/ruby>には<ruby>含ま<rt>ふくま<\/rt><\/ruby>れない。","マイナンバーなどの個人識別符号は，個人情報ではない。":"マイナンバーなどの<ruby>個人識別<rt>こじんしきべつ<\/rt><\/ruby><ruby>符号<rt>ふごう<\/rt><\/ruby>は，<ruby>個人<rt>こじん<\/rt><\/ruby><ruby>情報<rt>じょうほう<\/rt><\/ruby>ではない。","施設職員は，実習生に利用者の生活歴などを教えることは一切できない。":"<ruby>施設<rt>しせつ<\/rt><\/ruby><ruby>職員<rt>しょくいん<\/rt><\/ruby>は，<ruby>実習生<rt>じっしゅうせい<\/rt><\/ruby>に<ruby>利用者<rt>りようしゃ<\/rt><\/ruby>の<ruby>生活<rt>せいかつ<\/rt><\/ruby><ruby>歴<rt>れき<\/rt><\/ruby>などを<ruby>教え<rt>おしえ<\/rt><\/ruby>ることは<ruby>一切<rt>いっさい<\/rt><\/ruby>できない。","個人情報を第三者に提供するときは，原則として本人の同意が必要である。":"<ruby>個人<rt>こじん<\/rt><\/ruby><ruby>情報<rt>じょうほう<\/rt><\/ruby>を<ruby>第三者<rt>だいさんしゃ<\/rt><\/ruby>に<ruby>提供<rt>ていきょう<\/rt><\/ruby>するときは，<ruby>原則<rt>げんそく<\/rt><\/ruby>として<ruby>本人<rt>ほんにん<\/rt><\/ruby>の<ruby>同意<rt>どうい<\/rt><\/ruby>が<ruby>必要<rt>ひつよう<\/rt><\/ruby>である。","自治会長は，本人の同意がなくても個人情報を入手できる。":"<ruby>自治会<rt>じちかい<\/rt><\/ruby><ruby>長<rt>ちょう<\/rt><\/ruby>は，<ruby>本人<rt>ほんにん<\/rt><\/ruby>の<ruby>同意<rt>どうい<\/rt><\/ruby>がなくても<ruby>個人<rt>こじん<\/rt><\/ruby><ruby>情報<rt>じょうほう<\/rt><\/ruby>を<ruby>入手<rt>にゅうしゅ<\/rt><\/ruby>できる。","個人情報を第三者へ提供する場合は、原則として本人の同意が必要です。":"<ruby>個人<rt>こじん<\/rt><\/ruby><ruby>情報<rt>じょうほう<\/rt><\/ruby>を<ruby>第三者<rt>だいさんしゃ<\/rt><\/ruby>へ<ruby>提供<rt>ていきょう<\/rt><\/ruby>する<ruby>場合<rt>ばあい<\/rt><\/ruby>は、<ruby>原則<rt>げんそく<\/rt><\/ruby>として<ruby>本人<rt>ほんにん<\/rt><\/ruby>の<ruby>同意<rt>どうい<\/rt><\/ruby>が<ruby>必要<rt>ひつよう<\/rt><\/ruby>です。","「高齢者虐待防止法」に関する次の記述のうち，最も適切なものを1つ選びなさい。":"「<ruby>高齢者虐待防止法<rt>こうれいしゃぎゃくたいぼうしほう<\/rt><\/ruby>」に<ruby>関す<rt>かんす<\/rt><\/ruby>る<ruby>次の<rt>つぎの<\/rt><\/ruby><ruby>記述<rt>きじゅつ<\/rt><\/ruby>のうち，<ruby>最も<rt>もっとも<\/rt><\/ruby><ruby>適切<rt>てきせつ<\/rt><\/ruby>なものを1つ<ruby>選び<rt>えらび<\/rt><\/ruby>なさい。","（注）「高齢者虐待防止法」とは，「高齢者虐待の防止，高齢者の養護者に対する支援等に関する法律」のことである。":"（<ruby>注<rt>ちゅう<\/rt><\/ruby>）「<ruby>高齢者虐待防止法<rt>こうれいしゃぎゃくたいぼうしほう<\/rt><\/ruby>」とは，「<ruby>高齢者虐待<rt>こうれいしゃぎゃくたい<\/rt><\/ruby>の<ruby>防止<rt>ぼうし<\/rt><\/ruby>，<ruby>高齢者<rt>こうれいしゃ<\/rt><\/ruby>の<ruby>養護者<rt>ようごしゃ<\/rt><\/ruby>に<ruby>対<rt>たい<\/rt><\/ruby>する<ruby>支援<rt>しえん<\/rt><\/ruby><ruby>等<rt>など<\/rt><\/ruby>に<ruby>関す<rt>かんす<\/rt><\/ruby>る<ruby>法律<rt>ほうりつ<\/rt><\/ruby>」のことである。","虐待が起こる場として，家庭，施設，病院の3つが規定されている。":"<ruby>虐待<rt>ぎゃくたい<\/rt><\/ruby>が<ruby>起こ<rt>おこ<\/rt><\/ruby>る<ruby>場<rt>ば<\/rt><\/ruby>として，<ruby>家庭<rt>かてい<\/rt><\/ruby>，<ruby>施設<rt>しせつ<\/rt><\/ruby>，<ruby>病院<rt>びょういん<\/rt><\/ruby>の3つが<ruby>規定<rt>きてい<\/rt><\/ruby>されている。","対象は，介護保険制度の施設サービス利用者とされている。":"<ruby>対象<rt>たいしょう<\/rt><\/ruby>は，<ruby>介護保険制度<rt>かいごほけんせいど<\/rt><\/ruby>の<ruby>施設<rt>しせつ<\/rt><\/ruby>サービス<ruby>利用者<rt>りようしゃ<\/rt><\/ruby>とされている。","徘徊しないように車いすに固定することは，身体拘束には当たらない。":"<ruby>徘徊<rt>はいかい<\/rt><\/ruby>しないように<ruby>車<rt>くるま<\/rt><\/ruby>いすに<ruby>固定<rt>こてい<\/rt><\/ruby>することは，<ruby>身体<rt>しんたい<\/rt><\/ruby><ruby>拘束<rt>こうそく<\/rt><\/ruby>には<ruby>当た<rt>あた<\/rt><\/ruby>らない。","虐待を発見した養介護施設従事者には，通報する義務がある。":"<ruby>虐待<rt>ぎゃくたい<\/rt><\/ruby>を<ruby>発見<rt>はっけん<\/rt><\/ruby>した<ruby>養<rt>よう<\/rt><\/ruby><ruby>介護施設<rt>かいごしせつ<\/rt><\/ruby><ruby>従事者<rt>じゅうじしゃ<\/rt><\/ruby>には，<ruby>通報す<rt>つうほうす<\/rt><\/ruby>る<ruby>義務<rt>ぎむ<\/rt><\/ruby>がある。","虐待の認定は，警察署長が行う。":"<ruby>虐待<rt>ぎゃくたい<\/rt><\/ruby>の<ruby>認定<rt>にんてい<\/rt><\/ruby>は，<ruby>警察署長<rt>けいさつしょちょう<\/rt><\/ruby>が<ruby>行う<rt>おこなう<\/rt><\/ruby>。","養介護施設従事者等が業務上の虐待を発見した場合は、市町村へ通報する義務があります。":"<ruby>養<rt>よう<\/rt><\/ruby><ruby>介護施設<rt>かいごしせつ<\/rt><\/ruby><ruby>従事者<rt>じゅうじしゃ<\/rt><\/ruby><ruby>等<rt>など<\/rt><\/ruby>が<ruby>業務上<rt>ぎょうむじょう<\/rt><\/ruby>の<ruby>虐待<rt>ぎゃくたい<\/rt><\/ruby>を<ruby>発見<rt>はっけん<\/rt><\/ruby>した<ruby>場合<rt>ばあい<\/rt><\/ruby>は、<ruby>市町村<rt>しちょうそん<\/rt><\/ruby>へ<ruby>通報す<rt>つうほうす<\/rt><\/ruby>る<ruby>義務<rt>ぎむ<\/rt><\/ruby>があります。","発達障害のGさん（38歳，男性）は，高校生の頃に不登校になり，ずっとアルバイトをしながら，統合失調症（schizophrenia）の母親（65歳，精神保健福祉手帳2級）を介護してきた。母親に認知症（dementia）が疑われるようになったが，これからも二人で暮らし続けたいと考えたGさんは，相談支援事業所の介護福祉職に相談した。Gさんに対する介護福祉職の助言として，最も適切なものを1つ選びなさい。":"<ruby>発達<rt>はったつ<\/rt><\/ruby><ruby>障害<rt>しょうがい<\/rt><\/ruby>のGさん（38<ruby>歳<rt>さい<\/rt><\/ruby>，<ruby>男性<rt>だんせい<\/rt><\/ruby>）は，<ruby>高校生<rt>こうこうせい<\/rt><\/ruby>の<ruby>頃に<rt>ごろに<\/rt><\/ruby><ruby>不登<rt>ふとう<\/rt><\/ruby><ruby>校<rt>こう<\/rt><\/ruby>になり，ずっとアルバイトをしながら，<ruby>統合<rt>とうごう<\/rt><\/ruby><ruby>失調<rt>しっちょう<\/rt><\/ruby><ruby>症<rt>しょう<\/rt><\/ruby>（schizophrenia）の<ruby>母親<rt>ははおや<\/rt><\/ruby>（65<ruby>歳<rt>さい<\/rt><\/ruby>，<ruby>精神保健<rt>せいしんほけん<\/rt><\/ruby><ruby>福祉<rt>ふくし<\/rt><\/ruby><ruby>手帳<rt>てちょう<\/rt><\/ruby>2<ruby>級<rt>きゅう<\/rt><\/ruby>）を<ruby>介護<rt>かいご<\/rt><\/ruby>してきた。<ruby>母親<rt>ははおや<\/rt><\/ruby>に<ruby>認知症<rt>にんちしょう<\/rt><\/ruby>（dementia）が<ruby>疑わ<rt>うたがわ<\/rt><\/ruby>れるようになったが，これからも<ruby>二人<rt>ふたり<\/rt><\/ruby>で<ruby>暮らし<rt>くらし<\/rt><\/ruby><ruby>続け<rt>つづけ<\/rt><\/ruby>たいと<ruby>考え<rt>かんがえ<\/rt><\/ruby>たGさんは，<ruby>相談<rt>そうだん<\/rt><\/ruby><ruby>支援<rt>しえん<\/rt><\/ruby><ruby>事業所<rt>じぎょうしょ<\/rt><\/ruby>の<ruby>介護福祉職<rt>かいごふくししょく<\/rt><\/ruby>に<ruby>相談<rt>そうだん<\/rt><\/ruby>した。Gさんに<ruby>対<rt>たい<\/rt><\/ruby>する<ruby>介護福祉職<rt>かいごふくししょく<\/rt><\/ruby>の<ruby>助言<rt>じょげん<\/rt><\/ruby>として，<ruby>最も<rt>もっとも<\/rt><\/ruby><ruby>適切<rt>てきせつ<\/rt><\/ruby>なものを1つ<ruby>選び<rt>えらび<\/rt><\/ruby>なさい。","地域包括支援センターで，介護保険サービスの情報を得ることを勧める。":"<ruby>地域包括支援<rt>ちいきほうかつしえん<\/rt><\/ruby>センターで，<ruby>介護保険<rt>かいごほけん<\/rt><\/ruby>サービスの<ruby>情報<rt>じょうほう<\/rt><\/ruby>を<ruby>得る<rt>える<\/rt><\/ruby>ことを<ruby>勧め<rt>すすめ<\/rt><\/ruby>る。","Gさんが正規に雇用されるように，ハローワークに相談に行くことを勧める。":"Gさんが<ruby>正規<rt>せいき<\/rt><\/ruby>に<ruby>雇用<rt>こよう<\/rt><\/ruby>されるように，ハローワークに<ruby>相談<rt>そうだん<\/rt><\/ruby>に<ruby>行く<rt>いく<\/rt><\/ruby>ことを<ruby>勧め<rt>すすめ<\/rt><\/ruby>る。","Gさんの発達障害について，クリニックで適切な治療を受けることを勧める。":"Gさんの<ruby>発達<rt>はったつ<\/rt><\/ruby><ruby>障害<rt>しょうがい<\/rt><\/ruby>について，クリニックで<ruby>適切<rt>てきせつ<\/rt><\/ruby>な<ruby>治療<rt>ちりょう<\/rt><\/ruby>を<ruby>受ける<rt>うける<\/rt><\/ruby>ことを<ruby>勧め<rt>すすめ<\/rt><\/ruby>る。","母親に，介護老人福祉施設を紹介する。":"<ruby>母親<rt>ははおや<\/rt><\/ruby>に，<ruby>介護老人福祉施設<rt>かいごろうじんふくししせつ<\/rt><\/ruby>を<ruby>紹介<rt>しょうかい<\/rt><\/ruby>する。","母親に，精神科病院への入院を勧める しょうじょう<\/rt><\/ruby>の<ruby>予防<rt>よぼう<\/rt><\/ruby>には<ruby>抗<rt>こう<\/rt><\/ruby><ruby>精神病<rt>せいしんびょう<\/rt><\/ruby><ruby>薬<rt>くすり<\/rt><\/ruby>が<ruby>有効<rt>ゆうこう<\/rt><\/ruby>である。","もの盗られ妄想には、記憶障害に加え、不安などの気持ちが関係します。":"もの<ruby>盗ら<rt>とら<\/rt><\/ruby>れ<ruby>妄想<rt>もうそう<\/rt><\/ruby>には、<ruby>記憶<rt>きおく<\/rt><\/ruby><ruby>障害<rt>しょうがい<\/rt><\/ruby>に<ruby>加え<rt>くわえ<\/rt><\/ruby>、<ruby>不安<rt>ふあん<\/rt><\/ruby>などの<ruby>気持<rt>きも<\/rt><\/ruby>ちが<ruby>関係<rt>かんけい<\/rt><\/ruby>します。","慢性硬膜下血腫（chronic subdural hematoma）に関する次の記述のうち，最も適切なものを1つ選びなさい。":"<ruby>慢性硬膜下血腫<rt>まんせいこうまくかけっしゅ<\/rt><\/ruby>（chronic subdural hematoma）に<ruby>関す<rt>かんす<\/rt><\/ruby>る<ruby>次の<rt>つぎの<\/rt><\/ruby><ruby>記述<rt>きじゅつ<\/rt><\/ruby>のうち，<ruby>最も<rt>もっとも<\/rt><\/ruby><ruby>適切<rt>てきせつ<\/rt><\/ruby>なものを1つ<ruby>選び<rt>えらび<\/rt><\/ruby>なさい。","運動機能障害が起こることは非常に少ない。":"<ruby>運動<rt>うんどう<\/rt><\/ruby><ruby>機能障害<rt>きのうしょうがい<\/rt><\/ruby>が<ruby>起こ<rt>おこ<\/rt><\/ruby>ることは<ruby>非常に<rt>ひじょうに<\/rt><\/ruby><ruby>少ない<rt>すくない<\/rt><\/ruby>。","頭蓋骨骨折を伴い発症する。":"<ruby>頭蓋骨<rt>ずがいこつ<\/rt><\/ruby><ruby>骨折<rt>こっせつ<\/rt><\/ruby>を<ruby>伴い<rt>ともない<\/rt><\/ruby><ruby>発症<rt>はっしょう<\/rt><\/ruby>する。","抗凝固薬の使用はリスクとなる。":"<ruby>抗凝固薬<rt>こうぎょうこやく<\/rt><\/ruby>の<ruby>使用<rt>しよう<\/rt><\/ruby>はリスクとなる。","転倒の後，2～3日で発症することが多い。":"<ruby>転倒<rt>てんとう<\/rt><\/ruby>の<ruby>後<rt>ご<\/rt><\/ruby>，2～3<ruby>日<rt>にち<\/rt><\/ruby>で<ruby>発症<rt>はっしょう<\/rt><\/ruby>することが<ruby>多い<rt>おおい<\/rt><\/ruby>。","保存的治療が第一選択である。":"<ruby>保存<rt>ほぞん<\/rt><\/ruby><ruby>的<rt>てき<\/rt><\/ruby><ruby>治療<rt>ちりょう<\/rt><\/ruby>が<ruby>第一<rt>だいいち<\/rt><\/ruby><ruby>選択<rt>せんたく<\/rt><\/ruby>である。","抗凝固薬は血液を固まりにくくするため、慢性硬膜下血腫のリスクになります。":"<ruby>抗凝固薬<rt>こうぎょうこやく<\/rt><\/ruby>は<ruby>血液<rt>けつえき<\/rt><\/ruby>を<ruby>固ま<rt>かたま<\/rt><\/ruby>りにくくするため、<ruby>慢性硬膜下血腫<rt>まんせいこうまくかけっしゅ<\/rt><\/ruby>のリスクになります。","Lさん（83歳，女性，要介護1）は，アルツハイマー型認知症（dementia of the Alzheimer’s type）である。一人暮らしで，週2回，訪問介護（ホームヘルプサービス）を利用している。ある日，訪問介護員（ホームヘルパー）が訪問すると，息子が来ていて，「最近，母が年金の引き出しや，水道代の支払いを忘れるようだ。日常生活自立支援事業というものがあると聞いたことがあるが，どのような制度なのか」と質問があった。訪問介護員（ホームヘルパー）の説明として，最も適切なものを1つ選びなさい。":"Lさん（83<ruby>歳<rt>さい<\/rt><\/ruby>，<ruby>女性<rt>じょせい<\/rt><\/ruby>，<ruby>要介護<rt>ようかいご<\/rt><\/ruby>1）は，アルツハイマー<ruby>型認知症<rt>がたにんちしょう<\/rt><\/ruby>（dementia of the Alzheimer’s type）である。<ruby>一人暮<rt>ひとりぐ<\/rt><\/ruby>らしで，<ruby>週<rt>しゅう<\/rt><\/ruby>2<ruby>回<rt>かい<\/rt><\/ruby>，<ruby>訪問介護<rt>ほうもんかいご<\/rt><\/ruby>（ホームヘルプサービス）を<ruby>利用<rt>りよう<\/rt><\/ruby>している。ある<ruby>日<rt>にち<\/rt><\/ruby>，<ruby>訪問介護員<rt>ほうもんかいごいん<\/rt><\/ruby>（ホームヘルパー）が<ruby>訪問<rt>ほうもん<\/rt><\/ruby>すると，<ruby>息子<rt>むすこ<\/rt><\/ruby>が<ruby>来て<rt>きて<\/rt><\/ruby>いて，「<ruby>最近<rt>さいきん<\/rt><\/ruby>，<ruby>母<rt>はは<\/rt><\/ruby>が<ruby>年金<rt>ねんきん<\/rt><\/ruby>の<ruby>引き出し<rt>ひきだし<\/rt><\/ruby>や，<ruby>水道代<rt>すいどうだい<\/rt><\/ruby>の<ruby>支払<rt>しはら<\/rt><\/ruby>いを<ruby>忘れ<rt>わすれ<\/rt><\/ruby>るようだ。<ruby>日常生活<rt>にちじょうせいかつ<\/rt><\/ruby><ruby>自立支援<rt>じりつしえん<\/rt><\/ruby><ruby>事業<rt>じぎょう<\/rt><\/ruby>というものがあると<ruby>聞い<rt>きい<\/rt><\/ruby>たことがあるが，どのような<ruby>制度<rt>せいど<\/rt><\/ruby>なのか」と<ruby>質問<rt>しつもん<\/rt><\/ruby>があった。<ruby>訪問介護員<rt>ほうもんかいごいん<\/rt><\/ruby>（ホームヘルパー）の<ruby>説明<rt>せつめい<\/rt><\/ruby>として，<ruby>最も<rt>もっとも<\/rt><\/ruby><ruby>適切<rt>てきせつ<\/rt><\/ruby>なものを1つ<ruby>選び<rt>えらび<\/rt><\/ruby>なさい。","「申込みをしたい場合は，家庭裁判所が受付窓口です」":"「<ruby>申込<rt>もうしこみ<\/rt><\/ruby>みをしたい<ruby>場合<rt>ばあい<\/rt><\/ruby>は，<ruby>家庭裁判所<rt>かていさいばんしょ<\/rt><\/ruby>が<ruby>受付<rt>うけつけ<\/rt><\/ruby><ruby>窓口<rt>まどぐち<\/rt><\/ruby>です」","「年金の振込口座を，息子さん名義の口座に変更することができます」":"「<ruby>年金<rt>ねんきん<\/rt><\/ruby>の<ruby>振込<rt>ふりこみ<\/rt><\/ruby><ruby>口座<rt>こうざ<\/rt><\/ruby>を，<ruby>息子<rt>むすこ<\/rt><\/ruby>さん<ruby>名義<rt>めいぎ<\/rt><\/ruby>の<ruby>口座<rt>こうざ<\/rt><\/ruby>に<ruby>変更<rt>へんこう<\/rt><\/ruby>することができます」","「Lさんが契約内容を理解できない場合は，息子さんが契約できます」":"「Lさんが<ruby>契約<rt>けいやく<\/rt><\/ruby><ruby>内容<rt>ないよう<\/rt><\/ruby>を<ruby>理解<rt>りかい<\/rt><\/ruby>できない<ruby>場合<rt>ばあい<\/rt><\/ruby>は，<ruby>息子<rt>むすこ<\/rt><\/ruby>さんが<ruby>契約<rt>けいやく<\/rt><\/ruby>できます」","「生活支援員が，水道代の支払いをLさんの代わりに行うことができます」":"「<ruby>生活支援員<rt>せいかつしえんいん<\/rt><\/ruby>が，<ruby>水道代<rt>すいどうだい<\/rt><\/ruby>の<ruby>支払<rt>しはら<\/rt><\/ruby>いをLさんの<ruby>代わり<rt>かわり<\/rt><\/ruby>に<ruby>行う<rt>おこなう<\/rt><\/ruby>ことができます」","「利用後に苦情がある場合は，国民健康保険団体連合会が受付窓口です」":"「<ruby>利用<rt>りよう<\/rt><\/ruby><ruby>後に<rt>ごに<\/rt><\/ruby><ruby>苦情<rt>くじょう<\/rt><\/ruby>がある<ruby>場合<rt>ばあい<\/rt><\/ruby>は，<ruby>国民<rt>こくみん<\/rt><\/ruby><ruby>健康保険<rt>けんこうほけん<\/rt><\/ruby><ruby>団体<rt>だんたい<\/rt><\/ruby><ruby>連合会<rt>れんごうかい<\/rt><\/ruby>が<ruby>受付<rt>うけつけ<\/rt><\/ruby><ruby>窓口<rt>まどぐち<\/rt><\/ruby>です」","日常生活自立支援事業では、生活支援員が公共料金の支払いなど、日常的な金銭管理を支援できます。":"<ruby>日常生活<rt>にちじょうせいかつ<\/rt><\/ruby><ruby>自立支援<rt>じりつしえん<\/rt><\/ruby><ruby>事業<rt>じぎょう<\/rt><\/ruby>では、<ruby>生活支援員<rt>せいかつしえんいん<\/rt><\/ruby>が<ruby>公共<rt>こうきょう<\/rt><\/ruby><ruby>料金<rt>りょうきん<\/rt><\/ruby>の<ruby>支払<rt>しはら<\/rt><\/ruby>いなど、<ruby>日常的<rt>にちじょうてき<\/rt><\/ruby>な<ruby>金銭管理<rt>きんせんかんり<\/rt><\/ruby>を<ruby>支援<rt>しえん<\/rt><\/ruby>できます。","認知症ケアの技法であるユマニチュードに関する次の記述のうち，正しいものを1つ選びなさい。":"<ruby>認知症<rt>にんちしょう<\/rt><\/ruby>ケアの<ruby>技法<rt>ぎほう<\/rt><\/ruby>であるユマニチュードに<ruby>関す<rt>かんす<\/rt><\/ruby>る<ruby>次の<rt>つぎの<\/rt><\/ruby><ruby>記述<rt>きじゅつ<\/rt><\/ruby>のうち，<ruby>正しい<rt>ただしい<\/rt><\/ruby>ものを1つ<ruby>選び<rt>えらび<\/rt><\/ruby>なさい。","「見る」とは，離れた位置からさりげなく見守ることである。":"「<ruby>見る<rt>みる<\/rt><\/ruby>」とは，<ruby>離れ<rt>はなれ<\/rt><\/ruby>た<ruby>位置<rt>いち<\/rt><\/ruby>からさりげなく<ruby>見守<rt>みまも<\/rt><\/ruby>ることである。","「話す」とは，意識的に高いトーンの大きな声で話しかけることである。":"「<ruby>話す<rt>はなす<\/rt><\/ruby>」とは，<ruby>意識<rt>いしき<\/rt><\/ruby><ruby>的に<rt>てきに<\/rt><\/ruby><ruby>高い<rt>たかい<\/rt><\/ruby>トーンの<ruby>大き<rt>おおき<\/rt><\/ruby>な<ruby>声<rt>こえ<\/rt><\/ruby>で<ruby>話し<rt>はなし<\/rt><\/ruby>かけることである。","「触れる」とは，指先で軽く触れることである。":"「<ruby>触れる<rt>ふれる<\/rt><\/ruby>」とは，<ruby>指先<rt>ゆびさき<\/rt><\/ruby>で<ruby>軽く<rt>かるく<\/rt><\/ruby><ruby>触れる<rt>ふれる<\/rt><\/ruby>ことである。","「立つ」とは，立位をとる機会を作ることである。":"「<ruby>立つ<rt>たつ<\/rt><\/ruby>」とは，<ruby>立位<rt>りつい<\/rt><\/ruby>をとる<ruby>機会<rt>きかい<\/rt><\/ruby>を<ruby>作る<rt>つくる<\/rt><\/ruby>ことである。","「オートフィードバック」とは，ケアを評価することである。":"「オートフィードバック」とは，ケアを<ruby>評価<rt>ひょうか<\/rt><\/ruby>することである。","ユマニチュードの「立つ」は、本 y>中心<rt>ちゅうしん<\/rt><\/ruby>にコミュニケーションをとる。","Dさんが緊張しているので，からだに触れないようにする。":"Dさんが<ruby>緊張し<rt>きんちょうし<\/rt><\/ruby>ているので，からだに<ruby>触れな<rt>ふれな<\/rt><\/ruby>いようにする。","表情やしぐさを確認しながら，感情の理解に努める。":"<ruby>表情<rt>ひょうじょう<\/rt><\/ruby>やしぐさを<ruby>確認<rt>かくにん<\/rt><\/ruby>しながら，<ruby>感情<rt>かんじょう<\/rt><\/ruby>の<ruby>理解<rt>りかい<\/rt><\/ruby>に<ruby>努め<rt>つとめ<\/rt><\/ruby>る。","視線が合わないときは，会話を控える。":"<ruby>視線<rt>しせん<\/rt><\/ruby>が<ruby>合わ<rt>あわ<\/rt><\/ruby>ないときは，<ruby>会話<rt>かいわ<\/rt><\/ruby>を<ruby>控え<rt>ひかえ<\/rt><\/ruby>る。","自発的な発語がないため，会話の機会を減らしていく。":"<ruby>自発的<rt>じはつてき<\/rt><\/ruby>な<ruby>発語<rt>はつご<\/rt><\/ruby>がないため，<ruby>会話<rt>かいわ<\/rt><\/ruby>の<ruby>機会<rt>きかい<\/rt><\/ruby>を<ruby>減ら<rt>へら<\/rt><\/ruby>していく。","言葉が少なくても、表情やしぐさを観察して気持ちを理解するように努めます。":"<ruby>言葉<rt>ことば<\/rt><\/ruby>が<ruby>少なく<rt>すくなく<\/rt><\/ruby>ても、<ruby>表情<rt>ひょうじょう<\/rt><\/ruby>やしぐさを<ruby>観察<rt>かんさつ<\/rt><\/ruby>して<ruby>気持<rt>きも<\/rt><\/ruby>ちを<ruby>理解<rt>りかい<\/rt><\/ruby>するように<ruby>努め<rt>つとめ<\/rt><\/ruby>ます。","介護実践の場で行われる，勤務交代時の申し送りの目的に関する次の記述のうち，最も適切なものを1つ選びなさい。":"<ruby>介護<rt>かいご<\/rt><\/ruby><ruby>実践<rt>じっせん<\/rt><\/ruby>の<ruby>場<rt>ば<\/rt><\/ruby>で<ruby>行わ<rt>おこなわ<\/rt><\/ruby>れる，<ruby>勤務<rt>きんむ<\/rt><\/ruby><ruby>交代<rt>こうたい<\/rt><\/ruby><ruby>時の<rt>ときの<\/rt><\/ruby><ruby>申し<rt>もうし<\/rt><\/ruby><ruby>送り<rt>おくり<\/rt><\/ruby>の<ruby>目的<rt>もくてき<\/rt><\/ruby>に<ruby>関す<rt>かんす<\/rt><\/ruby>る<ruby>次の<rt>つぎの<\/rt><\/ruby><ruby>記述<rt>きじゅつ<\/rt><\/ruby>のうち，<ruby>最も<rt>もっとも<\/rt><\/ruby><ruby>適切<rt>てきせつ<\/rt><\/ruby>なものを1つ<ruby>選び<rt>えらび<\/rt><\/ruby>なさい。","翌月の介護福祉職の勤務表を検討する。":"<ruby>翌月<rt>よくげつ<\/rt><\/ruby>の<ruby>介護福祉職<rt>かいごふくししょく<\/rt><\/ruby>の<ruby>勤務表<rt>きんむひょう<\/rt><\/ruby>を<ruby>検討<rt>けんとう<\/rt><\/ruby>する。","利用者のレクリエーション活動を計画する。":"<ruby>利用者<rt>りようしゃ<\/rt><\/ruby>のレクリエーション<ruby>活動<rt>かつどう<\/rt><\/ruby>を<ruby>計画<rt>けいかく<\/rt><\/ruby>する。","利用者の問題解決に向けた事例検討を行う。":"<ruby>利用者<rt>りようしゃ<\/rt><\/ruby>の<ruby>問題<rt>もんだい<\/rt><\/ruby><ruby>解決<rt>かいけつ<\/rt><\/ruby>に<ruby>向け<rt>むけ<\/rt><\/ruby>た<ruby>事例<rt>じれい<\/rt><\/ruby><ruby>検討<rt>けんとう ごに<\/rt><\/ruby><ruby>洗い<rt>あらい<\/rt><\/ruby>、<ruby>食べ<rt>たべ<\/rt><\/ruby>かすや<ruby>汚れ<rt>よごれ<\/rt><\/ruby>を<ruby>取り除き<rt>とりのぞき<\/rt><\/ruby>ます。","Hさん（82歳，男性，要介護2）は，一人暮らしで，週1回，訪問介護（ホームヘルプサービス）を利用している。訪問時に，「足の爪が伸びているので，切ってほしい」と依頼された。爪を切ろうとしたところ，両足とも親指の爪が伸びて両端が皮膚に食い込んで赤くなっていて，触ると熱感があった。親指の状態を確認した訪問介護員（ホームヘルパー）の対応として，最も適切なものを1つ選びなさい。":"Hさん（82<ruby>歳<rt>さい<\/rt><\/ruby>，<ruby>男性<rt>だんせい<\/rt><\/ruby>，<ruby>要介護<rt>ようかいご<\/rt><\/ruby>2）は，<ruby>一人暮<rt>ひとりぐ<\/rt><\/ruby>らしで，<ruby>週<rt>しゅう<\/rt><\/ruby>1<ruby>回<rt>かい<\/rt><\/ruby>，<ruby>訪問介護<rt>ほうもんかいご<\/rt><\/ruby>（ホームヘルプサービス）を<ruby>利用<rt>りよう<\/rt><\/ruby>している。<ruby>訪問<rt>ほうもん<\/rt><\/ruby><ruby>時に<rt>ときに<\/rt><\/ruby>，「<ruby>足<rt>あし<\/rt><\/ruby>の<ruby>爪<rt>つめ<\/rt><\/ruby>が<ruby>伸び<rt>のび<\/rt><\/ruby>ているので，<ruby>切っ<rt>きっ<\/rt><\/ruby>てほしい」と<ruby>依頼<rt>いらい<\/rt><\/ruby>された。<ruby>爪<rt>つめ<\/rt><\/ruby>を<ruby>切ろ<rt>きろ<\/rt><\/ruby>うとしたところ，<ruby>両足<rt>りょうあし<\/rt><\/ruby>とも<ruby>親指<rt>おやゆび<\/rt><\/ruby>の<ruby>爪<rt>つめ<\/rt><\/ruby>が<ruby>伸び<rt>のび<\/rt><\/ruby>て<ruby>両端<rt>りょうたん<\/rt><\/ruby>が<ruby>皮膚<rt>ひふ<\/rt><\/ruby>に<ruby>食い<rt>くい<\/rt><\/ruby><ruby>込ん<rt>こん<\/rt><\/ruby>で<ruby>赤く<rt>あかく<\/rt><\/ruby>なっていて，<ruby>触る<rt>さわる<\/rt><\/ruby>と<ruby>熱感<rt>ねつかん<\/rt><\/ruby>があった。<ruby>親指<rt>おやゆび<\/rt><\/ruby>の<ruby>状態<rt>じょうたい<\/rt><\/ruby>を<ruby>確認<rt>かくにん<\/rt><\/ruby>した<ruby>訪問介護員<rt>ほうもんかいごいん<\/rt><\/ruby>（ホームヘルパー）の<ruby>対応<rt>たいおう<\/rt><\/ruby>として，<ruby>最も<rt>もっとも<\/rt><\/ruby><ruby>適切<rt>てきせつ<\/rt><\/ruby>なものを1つ<ruby>選び<rt>えらび<\/rt><\/ruby>なさい。","親指に絆創膏を巻く。":"<ruby>親指<rt>おやゆび<\/rt><\/ruby>に<ruby>絆創膏<rt>ばんそうこう<\/rt><\/ruby>を<ruby>巻く<rt>まく<\/rt><\/ruby>。","Hさんの家にある軟膏を親指に塗る。":"Hさんの<ruby>家<rt>いえ<\/rt><\/ruby>にある<ruby>軟膏<rt>なんこう<\/rt><\/ruby>を<ruby>親指<rt>おやゆび<\/rt><\/ruby>に<ruby>塗る<rt>ぬる<\/rt><\/ruby>。","蒸しタオルで爪を軟らかくしてから切る。":"<ruby>蒸し<rt>むし<\/rt><\/ruby>タオルで<ruby>爪<rt>つめ<\/rt><\/ruby>を<ruby>軟らかく<rt>やわらかく<\/rt><\/ruby>してから<ruby>切る<rt>きる<\/rt><\/ruby>。","爪が伸びている部分に爪やすりをかける。":"<ruby>爪<rt>つめ<\/rt><\/ruby>が<ruby>伸び<rt>のび<\/rt><\/ruby>ている< ruby>て，からだの<ruby>下に<rt>したに<\/rt><\/ruby><ruby>入れ<rt>いれ<\/rt><\/ruby>る。","利用者を左側臥位にし，脱いだ上着を引き出す。":"<ruby>利用者<rt>りようしゃ<\/rt><\/ruby>を<ruby>左側<rt>ひだりがわ<\/rt><\/ruby><ruby>臥<rt>が<\/rt><\/ruby><ruby>位<rt>い<\/rt><\/ruby>にし，<ruby>脱い<rt>ぬい<\/rt><\/ruby>だ<ruby>上着<rt>うわぎ<\/rt><\/ruby>を<ruby>引き出す<rt>ひきだす<\/rt><\/ruby>。","脱ぐときは健側から、着るときは患側からが基本です。麻痺側の袖口を広げ、腕を抜きやすくします。":"<ruby>脱ぐ<rt>ぬぐ<\/rt><\/ruby>ときは<ruby>健側<rt>けんそく<\/rt><\/ruby>から、<ruby>着る<rt>きる<\/rt><\/ruby>ときは<ruby>患側<rt>かんそく<\/rt><\/ruby>からが<ruby>基本<rt>きほん<\/rt><\/ruby>です。<ruby>麻痺側<rt>まひそく<\/rt><\/ruby>の<ruby>袖口<rt>そでぐち<\/rt><\/ruby>を<ruby>広げ<rt>ひろげ<\/rt><\/ruby>、<ruby>腕<rt>うで<\/rt><\/ruby>を<ruby>抜き<rt>ぬき<\/rt><\/ruby>やすくします。","利用者が食事中にむせ込んだときの介護として，最も適切なものを1つ選びなさい。":"<ruby>利用者<rt>りようしゃ<\/rt><\/ruby>が<ruby>食事<rt>しょくじ<\/rt><\/ruby><ruby>中に<rt>なかに<\/rt><\/ruby>むせ<ruby>込ん<rt>こん<\/rt><\/ruby>だときの<ruby>介護<rt>かいご<\/rt><\/ruby>として，<ruby>最も<rt>もっとも<\/rt><\/ruby><ruby>適切<rt>てきせつ<\/rt><\/ruby>なものを1つ<ruby>選び<rt>えらび<\/rt><\/ruby>なさい。","上を向いてもらう。":"<ruby>上<rt>うえ<\/rt><\/ruby>を<ruby>向い<rt>むい<\/rt><\/ruby>てもらう。","お茶を飲んでもらう。":"お<ruby>茶<rt>ちゃ<\/rt><\/ruby>を<ruby>飲ん<rt>のん<\/rt><\/ruby>でもらう。","深呼吸をしてもらう。":"<ruby>深<rt>しん<\/rt><\/ruby><ruby>呼吸<rt>こきゅう<\/rt><\/ruby>をしてもらう。","口の中のものを飲み込んでもらう。":"<ruby>口<rt>くち<\/rt><\/ruby>の<ruby>中の<rt>なかの<\/rt><\/ruby>ものを<ruby>飲み<rt>のみ<\/rt><\/ruby><ruby>込ん<rt>こん<\/rt><\/ruby>でもらう。","しっかりと咳を続けてもらう。":"しっかりと<ruby>咳<rt>せき<\/rt><\/ruby>を<ruby>続け<rt>つづけ<\/rt><\/ruby>てもらう。","むせたときは、咳で異物を出せるようにします。無理に飲み物を飲ませません。":"むせたときは、<ruby>咳<rt>せき<\/rt><\/ruby>で<ruby>異物<rt>いぶつ<\/rt><\/ruby>を<ruby>出せ<rt>だせ<\/rt><\/ruby>るようにします。<ruby>無理<rt>むり<\/rt><\/ruby>に<ruby>飲み物<rt>のみもの<\/rt><\/ruby>を<ruby>飲ま<rt>のま<\/rt><\/ruby>せません。","テーブルで食事の介護を行うときの留意点に関する次の記述のうち，最も適切なものを1つ選びなさい。":"テーブルで<ruby>食事<rt>しょくじ<\/rt><\/ruby>の<ruby>介護<rt>かいご<\/rt><\/ruby>を<ruby>行う<rt>おこなう<\/rt><\/ruby>ときの<ruby>留意点<rt>りゅういてん<\/rt><\/ruby>に<ruby>関す<rt>かんす<\/rt><\/ruby>る<ruby>次の<rt>つぎの<\/rt><\/ruby><ruby>記述<rt>きじゅつ<\/rt><\/ruby>のうち，<ruby>最も<rt>もっとも<\/rt><\/ruby><ruby>適切<rt>てきせつ<\/rt><\/ruby>なものを1つ<ruby>選び<rt>えらび<\/rt><\/ruby>なさい。","車いすで食事をするときは，足をフットサポートから下ろして床につける。":"<ruby>車<rt>くるま<\/rt><\/ruby>いすで<ruby>食事<rt>しょくじ<\/rt><\/ruby>をするときは，<ruby>足<rt>あし<\/rt><\/ruby>をフットサポートから<ruby>下ろ<rt>おろ<\/rt><\/ruby>して<ruby>床<rt>ゆか<\/rt><\/ruby>につける。","片麻痺があるときは，患側の上肢を膝の上にのせる。":"<ruby>片麻痺<rt>かたまひ<\/rt><\/ruby>があるときは，<ruby>患側<rt>かんそく<\/rt><\/ruby>の<ruby>上肢<rt>じょうし<\/rt><\/ruby>を<ruby>膝<rt>ひざ<\/rt><\/ruby>の<ruby>上に<rt>うえに<\/rt><\/ruby>のせる。","スプーンを使うときは，下顎を上げた姿勢にして食べ物を口に入れる。":"スプーンを<ruby>使う<rt>つかう<\/rt><\/ruby>ときは，<ruby>下顎<rt>かがく<\/rt><\/ruby>を<ruby>上げ<rt>あげ<\/rt><\/ruby>た<ruby>姿勢<rt>しせい<\/rt><\/ruby>にして<ruby>食べ物<rt>たべもの<\/rt><\/ruby>を<ruby>口<rt>くち<\/rt><\/ruby>に<ruby>入れ<rt>いれ<\/rt><\/ruby>る。","利用者に声をかけるときは，食べ物を口に入れてから行う。":"<ruby>利用者<rt>りようしゃ<\/rt><\/ruby>に<ruby>声<rt>こえ<\/rt><\/ruby>をかけるときは，<ruby>食べ物<rt>たべもの<\/rt><\/ruby>を<ruby>口<rt>くち<\/rt><\/ruby>に<ruby>入れ<rt>いれ<\/rt><\/ruby>てから<ruby>行う<rt>おこなう<\/rt><\/ruby>。","食事をしているときは，大きな音でテレビをつけておく。":"<ruby>食事<rt>しょくじ<\/rt><\/ruby>をしているときは，<ruby>大き<rt>おおき<\/rt><\/ruby>な<ruby>音<rt>おと<\/rt><\/ruby>でテレビをつけておく。","足を床につけると座位が安定し、安全に食べやすくなります。":"<ruby>足<rt>あし<\/rt><\/ruby>を<ruby>床<rt>ゆか<\/rt><\/ruby>につけると<ruby>座<rt>ざ<\/rt><\/ruby><ruby>位<rt>い<\/rt><\/ruby>が<ruby>安定<rt>あんてい<\/rt><\/ruby>し、<ruby>安全<rt>あんぜん<\/rt><\/ruby>に<ruby>食べ<rt>たべ<\/rt><\/ruby>やすくなります。","逆流性食道炎（reflux esophagitis）の症状がある利用者への助言として，最も適切なものを1つ選びなさい。":"<ruby>逆流<rt>ぎゃくりゅう<\/rt><\/ruby><ruby>性<rt>せい<\/rt><\/ruby><ruby>食道炎<rt>しょくどうえん<\/rt><\/ruby>（reflux esophagitis）の<ruby>症状<rt>しょうじょう<\/rt><\/ruby>がある<ruby>利用者<rt>りようしゃ<\/rt><\/ruby>への<ruby>助言<rt>じょげん<\/rt><\/ruby>として，<ruby>最も<rt>もっとも<\/rt><\/ruby><ruby>適切<rt>てきせつ<\/rt><\/ruby>なものを1つ<ruby>選び<rt>えらび<\/rt><\/ruby>なさい。","脂肪を多く含む食品を食べるように勧める。":"<ruby>脂肪<rt>しぼう<\/rt><\/ruby>を<ruby>多く<rt>おおく<\/rt><\/ruby><ruby>含む<rt>ふくむ<\/rt><\/ruby><ruby>食品<rt>しょくひん<\/rt><\/ruby>を<ruby>食べ<rt>たべ<\/rt><\/ruby>るように<ruby>勧め<rt>すすめ<\/rt><\/ruby>る。","酸味の強い果物を食べるように勧める。":"<ruby>酸味<rt>さんみ<\/rt><\/ruby>の<ruby>強い<rt>つよい<\/rt><\/ruby><ruby> uby>際に<rt>さいに<\/rt><\/ruby><ruby>向か<rt>むか<\/rt><\/ruby>って<ruby>洗う<rt>あらう<\/rt><\/ruby>。","シャンプー後は，タオルで泡を拭き取ってからすすぐ。":"シャンプー<ruby>後<rt>ご<\/rt><\/ruby>は，タオルで<ruby>泡<rt>あわ<\/rt><\/ruby>を<ruby>拭き<rt>ふき<\/rt><\/ruby><ruby>取っ<rt>とっ<\/rt><\/ruby>てからすすぐ。","ドライヤーの温風は，頭皮に直接当たるようにする。":"ドライヤーの<ruby>温風<rt>おんぷう<\/rt><\/ruby>は，<ruby>頭皮<rt>とうひ<\/rt><\/ruby>に<ruby>直接<rt>ちょくせつ<\/rt><\/ruby><ruby>当た<rt>あた<\/rt><\/ruby>るようにする。","シャンプーの泡をタオルで取ってからすすぐと、使う湯量を減らしやすくなります。":"シャンプーの<ruby>泡<rt>あわ<\/rt><\/ruby>をタオルで<ruby>取っ<rt>とっ<\/rt><\/ruby>てからすすぐと、<ruby>使う<rt>つかう<\/rt><\/ruby><ruby>湯量<rt>ゆりょう<\/rt><\/ruby>を<ruby>減ら<rt>へら<\/rt><\/ruby>しやすくなります。","目の周囲の清拭の方法を図に示す。矢印は拭く方向を表している。\n次のA～Eのうち，基本的な清拭の方法として，最も適切なものを1つ選びなさい。":"<ruby>目の<rt>めの<\/rt><\/ruby><ruby>周囲<rt>しゅうい<\/rt><\/ruby>の<ruby>清拭<rt>せいしき<\/rt><\/ruby>の<ruby>方法<rt>ほうほう<\/rt><\/ruby>を<ruby>図<rt>ず<\/rt><\/ruby>に<ruby>示す<rt>しめす<\/rt><\/ruby>。<ruby>矢印<rt>やじるし<\/rt><\/ruby>は<ruby>拭く<rt>ふく<\/rt><\/ruby><ruby>方向<rt>ほうこう<\/rt><\/ruby>を<ruby>表し<rt>あらわし<\/rt><\/ruby>ている。\n<ruby>次の<rt>つぎの<\/rt><\/ruby>A～Eのうち，<ruby>基本的<rt>きほんてき<\/rt><\/ruby>な<ruby>清拭<rt>せいしき<\/rt><\/ruby>の<ruby>方法<rt>ほうほう<\/rt><\/ruby>として，<ruby>最も<rt>もっとも<\/rt><\/ruby><ruby>適切<rt>てきせつ<\/rt><\/ruby>なものを1つ<ruby>選び<rt>えらび<\/rt><\/ruby>なさい。","A":"A","B":"B","C":"C","D":"D","E":"E","目の周囲は、目頭から目尻へ向かって優しく拭きます。図Ａが該当します。":"<ruby>目の<rt>めの<\/rt><\/ruby><ruby>周囲<rt>しゅうい<\/rt><\/ruby>は、<ruby>目頭<rt>めがしら<\/rt><\/ruby>から<ruby>目尻<rt>めじり<\/rt><\/ruby>へ<ruby>向か<rt>むか<\/rt><\/ruby>って<ruby>優し<rt>やさし<\/rt><\/ruby>く<ruby>拭き<rt>ふき<\/rt><\/ruby>ます。<ruby>図<rt>ず<\/rt><\/ruby>Ａが<ruby>該当<rt>がいとう<\/rt><\/ruby>します。","Jさん（85歳，女性，要介護2）は，アルツハイマー型認知症（dementia of the Alzheimer’s type）である。時間をかければ一人で洗身，洗髪もできるが，ズボンの上に下着を着る行為がみられたため，訪問介護（ホームヘルプサービス）を利用することになった。Jさんの入浴時における訪問介護員（ホームヘルパー）の対応として，最も適切なものを1つ選びなさい。":"Jさん（85<ruby>歳<rt>さい<\/rt><\/ruby>，<ruby>女性<rt>じょせい<\/rt><\/ruby>，<ruby>要介護<rt>ようかいご<\/rt><\/ruby>2）は，アルツハイマー<ruby>型認知症<rt>がたにんちしょう<\/rt><\/ruby>（dementia of the Alzheimer’s type）である。<ruby>時間<rt>じかん<\/rt><\/ruby>をかければ<ruby>一人<rt>ひとり<\/rt><\/ruby>で<ruby>洗身<rt>せんしん<\/rt><\/ruby>，<ruby>洗髪<rt>せんぱつ<\/rt><\/ruby>もできるが，ズボンの<ruby>上に<rt>うえに<\/rt><\/ruby><ruby>下着<rt>したぎ<\/rt><\/ruby>を<ruby>着る<rt>きる<\/rt><\/ruby><ruby>行為<rt>こうい<\/rt><\/ruby>がみられたため，<ruby>訪問介護<rt>ほうもんかいご<\/rt><\/ruby>（ホームヘルプサービス）を<ruby>利用<rt>りよう<\/rt><\/ruby>することになった。Jさんの<ruby>入浴<rt>にゅうよく<\/rt><\/ruby><ruby>時に<rt>ときに<\/rt><\/ruby>おける<ruby>訪問介護員<rt>ほうもんかいごいん<\/rt><\/ruby>（ホームヘルパー）の<ruby>対応<rt>たいおう<\/rt><\/ruby>として，<ruby>最も<rt>もっとも<\/rt><\/ruby><ruby>適切<rt>てきせつ<\/rt><\/ruby>なものを1つ<ruby>選び<rt>えらび<\/rt><\/ruby>なさい。","脱いだ衣服は，着る衣服の隣に並べて置く。":"<ruby>脱い<rt>ぬい<\/rt><\/ruby>だ<ruby>衣服<rt>いふく<\/rt><\/ruby>は，<ruby>着る<rt>きる<\/rt><\/ruby><ruby>衣服<rt>いふく<\/rt><\/ruby>の<ruby>隣<rt>となり<\/rt><\/ruby>に<ruby>並べて<rt>ならべて<\/rt><\/ruby><ruby>置く<rt>おく<\/rt><\/ruby>。","洗身と洗髪は訪問介護員（ホームヘルパー）が行う。":"<ruby>洗身<rt>せんしん<\/rt><\/ruby>と<ruby>洗髪<rt>せんぱつ<\/rt><\/ruby>は<ruby>訪問介護員<rt>ほうもんかいごいん<\/rt><\/ruby>（ホームヘルパー）が<ruby>行う<rt>おこなう<\/rt><\/ruby>。","入浴中の利用者に声をかけることは控える。":"<ruby>入浴<rt>にゅうよく<\/rt><\/ruby><ruby>中の<rt>なかの<\/rt><\/ruby><ruby>利用者<rt>りようしゃ<\/rt><\/ruby>に<ruby>声<rt>こえ<\/rt><\/ruby>をかけることは<ruby>控え<rt>ひかえ<\/rt><\/ruby>る。","衣服の着る順番に応じて声をかける。":"<ruby>衣服<rt>いふく<\/rt><\/ruby>の<ruby>着る<rt>きる<\/rt><\/ruby><ruby>順番<rt>じゅんばん<\/rt><\/ruby>に<ruby>応じ<rt>おうじ<\/rt><\/ruby>て<ruby>声<rt>こえ<\/rt><\/ruby>をかける。","ズボンの着脱は訪問介護員（ホームヘルパー）が行う。":"ズボンの<ruby>着脱<rt>ちゃくだつ<\/rt><\/ruby>は<ruby>訪問介護員<rt>ほうもんかいごいん<\/rt><\/ruby>（ホームヘルパー）が<ruby>行う<rt>おこなう<\/rt><\/ruby>。","本人ができる動作を生かし、衣服を着る順番に合わせて声をかけます。":"<ruby>本人<rt>ほんにん<\/rt><\/ruby>ができる<ruby>動作<rt>どうさ<\/rt><\/ruby>を<ruby>生か<rt>いか<\/rt><\/ruby>し、<ruby>衣服<rt>いふく<\/rt><\/ruby>を<ruby>着る<rt>きる<\/rt><\/ruby><ruby>順番<rt>じゅんばん<\/rt><\/ruby>に<ruby>合わ<rt>あわ<\/rt><\/ruby>せて<ruby>声<rt>こえ<\/rt><\/ruby>をかけます。","胃・結腸反射を利用して，生理的排便を促すための介護福祉職の支援として，最も適切なものを1つ選びなさい。":"<ruby>胃・結腸反射<rt>いけっちょうはんしゃ<\/rt><\/ruby>を<ruby>利用<rt>りよう<\/rt><\/ruby>して，<ruby>生理的<rt>せいりてき<\/rt><\/ruby><ruby>排便<rt>はいべん<\/rt><\/ruby>を<ruby>促す<rt>うながす<\/rt><\/ruby>ための<ruby>介護福祉職<rt>かいごふくし
