 <section class="panel"><div class="muted">${qi+1} · ${qi<10?'○×':qi===10?'5つから1つえらぶ · 過去問改題':'5つから1つえらぶ · 予想問題'}</div><div class="question">${q.text}</div><div class="options ${qi<10?'tf':''}">${q.options.map((s,i)=>`<button class="option ${answered?(i===q.answer?'correct ':'')+(i===answers[qi]?(i===q.answer?'chosen':'wrong'):''):''}" ${answered?'disabled':''} onclick="answer(${i})">${qi<10?s:`<span>${i+1}.</span> ${s}`}</button>`).join('')}</div><div id="feedback" aria-live="polite">${answered?feedback(q,answers[qi]):''}</div>
 <div class="foot"><button onclick="jump(${idx-1})" ${idx===0?'disabled':''}>← まえへ</button><button class="primary" ${!answered?'disabled':''} onclick="next()">${idx===queue.length-1?'<ruby>結果<rt>けっか</rt></ruby>をみる':'つぎへ →'}</button></div></section>
 <div class="pills" aria-label="問題を選ぶ">${queue.map((n,i)=>`<button class="${i===idx?'current ':''}${answers[n]!==undefined?(answers[n]===unit.questions[n].answer?'done-ok':'done-bad'):''}" onclick="jump(${i})" ${i===idx?'aria-current="step"':''} aria-label="問題${n+1}${answers[n]!==undefined?(answers[n]===unit.questions[n].answer?' 正解':' 不正解'):''}">${n+1}${answers[n]!==undefined?(answers[n]===unit.questions[n].answer?' ✓':' ×'):''}</button>`).join('')}</div>`;
}
function feedback(q,a){return `<div class="feedback ${q.answer===a?'':'bad'}"><strong>${q.answer===a?'<ruby>正解<rt>せいかい</rt></ruby>です！':'もういちど、たしかめましょう。'}</strong><p><ruby>正解<rt>せいかい</rt></ruby>：${q.options.length===2?q.options[q.answer]:q.answer+1}</p>${q.explanation}</div>`}
function answer(a){const qi=queue[idx];if(answers[qi]!==undefined||!Number.isInteger(a)||a<0||a>=unit.questions[qi].options.length)return;answers[qi]=a;show()}
function next(){if(answers[queue[idx]]===undefined)return;if(idx<queue.length-1)jump(idx+1);else result()}
function result(){
 const unanswered=queue.findIndex(i=>answers[i]===undefined);if(unanswered!==-1){jump(unanswered);return}
 const wrong=queue.filter(i=>answers[i]!==unit.questions[i].answer),score=queue.length-wrong.length;
 if(!review){history[unit.n]={score,date:Date.now()};save()}
 app.innerHTML=`<button onclick="home()">← <ruby>項目<rt>こうもく</rt></ruby>をえらぶ</button><div class="panel"><div class="brand">LESSON COMPLETE</div><h2>${unit.n}　${unit.title}</h2><p>${review?'もういちどの学習、おつかれさまでした。':'おつかれさまでした。'}</p><div class="score">${score}<span style="font-size:24px"> / ${queue.length}</span></div><p>${wrong.length?'まちがえたところを、もういちど。ひとつずつ身につけていきましょう。':'すべてできました！ よくがんばりました。'}</p>
 <div class="foot">${wrong.length?'<button class="primary" id="retry">まちがえたところだけ</button>':''}<button onclick="start(${unit.n})">はじめから</button>${unit.n<DATA.length?`<button onclick="start(${unit.n+1})">つぎの<ruby>項目<rt>こうもく</rt></ruby> →</button>`:''}</div>
 <div class="score-list" aria-label="解答の結果">${queue.map((qi,i)=>`<button onclick="jump(${i})">${qi+1} · ${answers[qi]===unit.questions[qi].answer?'✓ 正解':'× 不正解'}<small>あなたの答え：${qi<10?unit.questions[qi].options[answers[qi]]:answers[qi]+1} ／ 正解：${qi<10?unit.questions[qi].options[unit.questions[qi].answer]:unit.questions[qi].answer+1}　解説をみる →</small></button>`).join('')}</div>${!storageOK?'<p class="notice">このブラウザでは学習記録を保存できませんでした。</p>':''}</div>`;
 if(wrong.length)document.getElementById('retry').onclick=()=>{queue=wrong;wrong.forEach(i=>delete answers[i]);idx=0;review=true;show();window.scrollTo(0,0)};
 window.scrollTo(0,0);
}
home();

</script></body></html>
